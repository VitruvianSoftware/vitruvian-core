# Backstage catalog entities for the platform we operate.
#
# These are not things we build -- they are upstream components the homelab
# cluster runs, and that our applications depend on. Modelling them as
# Resources is what lets their Grafana dashboards, and later their runbooks and
# alerts, hang off a page someone can actually find.
#
# Each carries a grafana/dashboard-selector matching a TAG on the dashboard in
# ./argocd/platform/grafana-dashboards. Tag matching is case-sensitive, and a
# single-word selector is always treated as a tag (never a title search) -- so
# the dashboard must carry a tag equal to the selector, which is why
# cert-manager.json and traefik.json gained one.
#
# Deliberately absent: Longhorn and Elasticsearch have dashboards in Grafana but
# are NOT deployed. Nothing gets an entity until it is real.
#
# The old rule here was "real AND observable" -- no Grafana dashboard, no entity.
# That is obsolete now that ArgoCD deployment state is a second signal: an entity
# is worth having if you can answer "what version is live and is it healthy?",
# even with no dashboard yet. The entities below carry argocd/app-name only, and
# gain a grafana/dashboard-selector if and when a dashboard exists -- adding a
# selector that matches no dashboard renders a permanently empty card.
#
# Not modelled, deliberately: the ArgoCD Applications that are plumbing rather
# than components -- app-of-*, *-resources, platform-crds, sealed-secrets-manifests,
# grafana-dashboards, and the per-service *-db clusters. They are how things are
# deployed, not things anyone looks up. ArgoCD itself has no entity because it is
# not an ArgoCD Application: it is the Pulumi bootstrap that manages everything else.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cert-manager
  title: cert-manager
  description: Issues and renews the cluster's TLS certificates via Let's Encrypt (DNS-01 through Cloudflare)
  annotations:
    grafana/dashboard-selector: cert-manager
    argocd/app-name: cert-manager
  links:
    - url: https://cert-manager.io/docs/
      title: Upstream docs
      icon: docs
spec:
  type: certificate-manager
  owner: platform-team
  system: vitruvian-core
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: external-dns
  title: ExternalDNS
  description: Reconciles Cloudflare DNS records from Ingress and Gateway resources
  annotations:
    grafana/dashboard-selector: external-dns
    argocd/app-name: external-dns
  links:
    - url: https://kubernetes-sigs.github.io/external-dns/
      title: Upstream docs
      icon: docs
spec:
  type: dns
  owner: platform-team
  system: vitruvian-core
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: minio
  title: MinIO
  description: S3-compatible object storage backing CNPG base backups, WAL archiving and Thanos
  annotations:
    grafana/dashboard-selector: minio
    argocd/app-name: minio-amd64
  links:
    - url: https://min.io/docs/minio/kubernetes/upstream/
      title: Upstream docs
      icon: docs
spec:
  type: object-storage
  owner: platform-team
  system: vitruvian-core
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cloudnative-pg
  title: CloudNativePG
  description: PostgreSQL operator running the Backstage, Zitadel and buzz clusters
  annotations:
    grafana/dashboard-selector: cloudnativepg
    # app-name, not app-selector: in pure proxy mode the plugin requests
    # /applications/selector/<sel>, which is NOT an ArgoCD API path (it is served
    # by @roadiehq/backstage-plugin-argo-cd-backend, which this portal does not
    # install) -- verified 404 against the live API. The operator is the entity
    # this Resource describes; cnpg-cluster is a database it runs.
    argocd/app-name: cnpg-operator
  links:
    - url: https://cloudnative-pg.io/documentation/
      title: Upstream docs
      icon: docs
spec:
  type: database-operator
  owner: platform-team
  system: vitruvian-core
---
