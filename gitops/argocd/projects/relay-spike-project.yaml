# vitruvian-relay-spike: the Vitruvian Relay P0 spike server (apps/suites/vitruvian-relay/spike). One
# namespace, and only the kinds its chart renders. No Secret or SealedSecret:
# the server needs none (it fetches Zitadel's public keys).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: relay-spike-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: vitruvian-relay-spike — Vitruvian Relay P0 spike (MCP over Zitadel sign-in, WebSocket echo)
  orphanedResources:
    warn: true
  sourceRepos:
    - 'https://github.com/VitruvianSoftware/vitruvian-core.git'
  destinations:
    - namespace: relay-spike
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ''
      kind: Pod
    - group: ''
      kind: Service
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: externaldns.k8s.io
      kind: DNSEndpoint
