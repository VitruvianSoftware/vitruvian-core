#
# whoami-project — the first PER-APP AppProject, retiring the wildcard for a
# zero-criticality demo app (issue #459). It proves the scoped pattern that the
# remaining apps should migrate to: no cluster-resource access at all, a single
# destination namespace, and only the exact namespaced kinds the app manages
# (enumerated from the live app: apps/Deployment, /Service,
# externaldns.k8s.io/DNSEndpoint, gateway.networking.k8s.io/HTTPRoute).
#
# Scoping the shared platform-project the same way must be done incrementally
# under supervision — a missed CRD kind there breaks reconciliation of Zitadel
# (auth) and the CNPG databases.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: whoami-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: whoami demo app — fully-scoped per-app project (issue #459)
  orphanedResources:
    warn: true
  sourceRepos:
    - 'https://github.com/VitruvianSoftware/vitruvian-core.git'
  # Single destination namespace — no cross-namespace writes.
  destinations:
    - namespace: whoami
      server: 'https://kubernetes.default.svc'
  # No cluster-scoped resources: whoami manages none, so the cluster wildcard
  # ('*'/'*') is fully retired for this project.
  clusterResourceWhitelist: []
  # Exactly the namespaced kinds whoami manages — nothing else.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: externaldns.k8s.io
      kind: DNSEndpoint
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
