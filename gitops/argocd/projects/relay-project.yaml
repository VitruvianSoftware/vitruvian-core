# vitruvian-relay: the Vitruvian Relay server (apps/suites/vitruvian-relay/relay). One
# namespace, and only the kinds its chart and its database render: the chart's
# Deployment, Service, routes and policies, and relay-db's CloudNativePG
# Cluster, ObjectStore and ScheduledBackup (gitops/argocd/platform/relay/).
# Secret and SealedSecret are deliberately not allowed: nothing this app renders
# is one. CloudNativePG creates relay-db-app and relay-db-ca itself, in the
# cluster, and the backup credentials are SealedSecrets applied by
# sealed-secrets-manifests (platform-project). They are listed under
# orphanedResources.ignore instead, so they do not show as orphans.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: relay-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: vitruvian-relay — Vitruvian Relay (MCP over Zitadel sign-in, device WebSocket, device registry)
  orphanedResources:
    warn: true
    ignore:
      - group: ''
        kind: Secret
      - group: bitnami.com
        kind: SealedSecret
  sourceRepos:
    - 'https://github.com/VitruvianSoftware/vitruvian-core.git'
  destinations:
    - namespace: relay
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: ''
      kind: Pod
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: gateway.envoyproxy.io
      kind: BackendTrafficPolicy
    - group: externaldns.k8s.io
      kind: DNSEndpoint
    - group: postgresql.cnpg.io
      kind: Cluster
    - group: postgresql.cnpg.io
      kind: ScheduledBackup
    - group: barmancloud.cnpg.io
      kind: ObjectStore
