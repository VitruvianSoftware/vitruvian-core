apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-project
  namespace: argocd
  # Finalizer: keep the project until no Application references it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform project — cluster system components migrated from Pulumi dev-local
  # Surface retained-but-untracked resources (the orphaned cert-manager
  # ClusterIssuer / cf-secret / ClusterSecretStores left by the Pulumi->ArgoCD
  # cutover) so accidental adoption or drift is visible.
  # NOTE: prune-safety for the retained CRDs depends entirely on
  # installCRDs:false / crds.enabled:false in the child AppSets — keep those; a
  # permissive project (clusterResourceWhitelist '*') is no backstop on its own.
  orphanedResources:
    warn: true
  # clusterResourceWhitelist is scoped to EXACTLY the cluster-scoped kinds the
  # platform components currently manage (issue #459), retiring the '*'/'*'
  # wildcard. This is the complete set enumerated from the live apps'
  # .status.resources, so no current app is denied (whitelist ⊇ usage, verified).
  # A missed kind would only make an app OutOfSync (it cannot MANAGE that kind) —
  # existing resources are never pruned by a whitelist. To onboard a component
  # that manages a NEW cluster-scoped kind, add its group/kind here.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: apiregistration.k8s.io
      kind: APIService
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: 'https://kubernetes.default.svc'
