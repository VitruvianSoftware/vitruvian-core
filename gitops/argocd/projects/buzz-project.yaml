# buzz-project — scoped per-app AppProject for the Buzz relay (block/buzz).
# Follows the whoami-project pattern (issue #459): single destination namespace,
# only the exact namespaced kinds the app manages. The Helm chart creates
# Deployments, Services, Secrets, ConfigMaps, StatefulSets, PVCs, ServiceAccounts,
# PodDisruptionBudgets, and HPAs internally; the platform/ directory adds
# HTTPRoutes and DNSEndpoints.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: buzz-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Buzz relay — block/buzz self-hosted workspace (issue #xxx)
  orphanedResources:
    warn: true
  sourceRepos:
    - 'https://github.com/VitruvianSoftware/vitruvian-core.git'
    - 'ghcr.io/block/buzz/charts'
    - 'ghcr.io/block/buzz/charts/*'
  destinations:
    - namespace: buzz
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ''
      kind: Service
    - group: ''
      kind: Secret
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ServiceAccount
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: Job
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: externaldns.k8s.io
      kind: DNSEndpoint
    - group: postgresql.cnpg.io
      kind: Cluster
    - group: monitoring.coreos.com
      kind: ServiceMonitor
