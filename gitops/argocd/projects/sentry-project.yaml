# sentry — scoped per-app AppProject for self-hosted Sentry.
# Restricts destination namespace strictly to `sentry`, with whitelisted
# resources needed by Sentry Helm chart, CloudNativePG, Valkey, ClickHouse,
# Kafka KRaft, Envoy Gateway, and cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sentry
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Self-hosted Sentry error tracking platform — scoped per-app project
  orphanedResources:
    warn: true
  sourceRepos:
    - 'https://github.com/VitruvianSoftware/vitruvian-core.git'
    - 'https://sentry-kubernetes.github.io/charts'
  destinations:
    - namespace: sentry
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: apps
      kind: DaemonSet
    - group: ''
      kind: Pod
    - group: ''
      kind: Service
    - group: ''
      kind: Secret
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: ServiceAccount
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant
    - group: cert-manager.io
      kind: Certificate
    - group: externaldns.k8s.io
      kind: DNSEndpoint
    - group: postgresql.cnpg.io
      kind: Cluster
    - group: postgresql.cnpg.io
      kind: Pooler
    - group: postgresql.cnpg.io
      kind: ScheduledBackup
    - group: barmancloud.cnpg.io
      kind: ObjectStore
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: cache.keiailab.io
      kind: Valkey
