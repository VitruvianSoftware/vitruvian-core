# gods-eye-view-project — scoped per-app project for God's Eye View console.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gods-eye-view-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: God's Eye View geospatial 3D intelligence console — fully-scoped per-app project
  orphanedResources:
    warn: true
  sourceRepos:
    - 'https://github.com/VitruvianSoftware/vitruvian-core.git'
  destinations:
    - namespace: gods-eye-view
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: externaldns.k8s.io
      kind: DNSEndpoint
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: bitnami.com
      kind: SealedSecret
    - group: ''
      kind: Secret
