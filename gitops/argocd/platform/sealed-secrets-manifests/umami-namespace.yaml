#
# The umami namespace, declared here (not only via the umami Application's
# CreateNamespace) because this Application syncs FIRST (wave -4) and applies
# the umami-* SealedSecrets into it; without the namespace that sync would fail
# until the umami app happened to create it. Pod Security "baseline" is
# enforced and "restricted" warned/audited, like arc-runners: Umami's own pods
# meet restricted, but the CNPG instance pods carry an injected Barman plugin
# sidecar this namespace does not control.
apiVersion: v1
kind: Namespace
metadata:
  name: umami
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
