# Fine-grained GitHub PAT used by Backstage for:
#   - GithubOrgEntityProvider, which ingests VitruvianSoftware members and teams
#     into the software catalog so users/groups stop being hand-declared in
#     catalog-info.yaml, and
#   - integrations.github, which today fetches catalog-info.yaml ANONYMOUSLY and
#     is therefore subject to GitHub's 60 req/hr unauthenticated rate limit.
#
# Scope is deliberately minimal: resource owner VitruvianSoftware, Organization
# permission "Members: Read-only". It grants no repository write and no account
# access. Sealing was done with kubeseal against the live controller; the token
# value never left the operator's terminal.
#
# EXPIRES ~2026-09-16 (30 days from issue). Nothing warns on expiry -- when it
# lapses, org ingestion silently stops. Re-seal with the same recipe and replace
# encryptedData below.
#
# Landed on its own, ahead of the provider wiring, on purpose: a SealedSecret
# that nothing references yet is inert, and having it applied first means the
# provider PR cannot roll a pod against an unresolved ${GITHUB_TOKEN} -- the
# exact failure that wedged the rollout in #1709/#1731.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backstage-github-token
  namespace: backstage
spec:
  encryptedData:
    GITHUB_TOKEN: 
  template:
    metadata:
      name: backstage-github-token
      namespace: backstage
