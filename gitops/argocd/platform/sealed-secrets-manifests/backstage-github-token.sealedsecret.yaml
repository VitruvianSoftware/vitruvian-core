# Fine-grained GitHub PAT used by Backstage for:
#   - GithubOrgEntityProvider, which ingests VitruvianSoftware members and teams
#     into the software catalog so users/groups stop being hand-declared in
#     catalog-info.yaml,
#   - integrations.github, which authenticates catalog-info.yaml fetches, and
#   - the scaffolder's publish:github / github:* actions (#1764).
#
# WHAT IT ACTUALLY IS (checked 2026-11-17 from inside the cluster, with a
# one-off Job that read this Secret and asked GitHub; the token never left the
# cluster). This replaces an older note that said "Members: Read-only, expires
# ~2026-09-16" -- both were wrong:
#   - owner: ipv1337 (a personal account, not an app), fine-grained PAT
#   - expiry: NONE. GitHub sends no github-authentication-token-expiration
#     header for it, and it still works three months after it was sealed
#     (2026-08-18). It never expires on its own.
#   - repositories: about 70 VitruvianSoftware repos are visible to it
#   - granted (200): Administration (read, at least), Contents (read, at
#     least), Members read
#   - not granted (403): webhooks, Actions secrets, org secrets
#   Write access can't be confirmed with read-only probes; the initializer
#   design (ADR-018) records "Administration: write" for publish:github.
#
# Risk: a never-expiring personal token with repository Administration, held
# by an internet-facing portal. The plan is to replace it with a GitHub App
# installation token (short-lived, scoped per repo) -- see
# docs/superpowers/specs/2026-11-12-app-console-design.md.
#
# Re-seal with kubeseal against the live controller and replace encryptedData
# below; the value must never be pasted anywhere else.
#
# Landed on its own, ahead of the provider wiring, on purpose: a SealedSecret
# that nothing references yet is inert, and having it applied first means the
# provider PR cannot roll a pod against an unresolved ${GITHUB_TOKEN} -- the
# exact failure that wedged the rollout in #1709/#1731.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backstage-github-token
  namespace: backstage
spec:
  encryptedData:
    GITHUB_TOKEN: 
  template:
    metadata:
      name: backstage-github-token
      namespace: backstage
