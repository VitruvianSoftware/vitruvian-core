# mcp-slack-tokens — bot credentials for the Slack MCP server (app A0BNFAEKRMH,
# "Vitruvian Slack MCP (Remote)", bot U0BNJ3RK9KP, team T08JV4QGT71).
#
# SLACK_BOT_TOKEN only. NO user token is ever sealed here: the server refuses to
# start on the HTTP transport if SLACK_USER_TOKEN is set, and this file is the
# other half of that — enforced on both sides rather than by omission alone.
#
# Consumed by mcp-slack/deploy/chart (values.slack.secretName), which is why the
# name is fixed rather than templated. Sealed strict-scoped: these ciphertexts
# only decrypt into Secret mcp-slack/mcp-slack-tokens and nowhere else.
#
# Namespace mcp-slack does not exist until the mcp-slack Application is enabled
# (it ships .disabled). Until then this object syncs and waits; the controller
# creates the Secret once the namespace appears.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mcp-slack-tokens
  namespace: mcp-slack
spec:
  encryptedData:
    SLACK_BOT_TOKEN: 
    SLACK_TEAM_ID: 
  template:
    metadata:
      name: mcp-slack-tokens
      namespace: mcp-slack
