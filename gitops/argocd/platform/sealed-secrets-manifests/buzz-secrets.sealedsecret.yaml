---
# REDIS_URL now points at buzz-valkey-primary.buzz.svc.cluster.local (the
# valkey-operator HA cluster), not the shared redis-master.redis.svc left
# over from the reverted Sentinel migration (84253457). buzz.yaml's
# externalRedis.url value never took effect here: with secrets.existingSecret
# set, the chart's secret-chart.yaml template doesn't render at all, so
# REDIS_URL always came from this file regardless of that Helm value. Live
# readiness checks were flapping 503 on `"redis": false` (deadpool "Error
# occurred while creating a new object: timed out") against the old shared
# instance; buzz-valkey has auth.enabled: false, so no credentials are
# needed in the URL.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: buzz-secrets
  namespace: buzz
spec:
  encryptedData:
    BUZZ_RELAY_PRIVATE_KEY: 
    BUZZ_S3_ACCESS_KEY: 
    BUZZ_S3_SECRET_KEY: 
    DATABASE_URL: 
    REDIS_URL: 
  template:
    metadata:
      name: buzz-secrets
      namespace: buzz
