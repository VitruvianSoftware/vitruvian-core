# cloudflared-credentials — dev-local Cloudflare Tunnel credentials.json (the
# account tag, tunnel id, and per-tunnel secret) for the locally-managed tunnel
# 1f7b9704-bb66-41f4-966f-5bb722e3c10e, consumed by the cloudflared Deployment.
# Sealed; the controller decrypts into Secret cloudflared/cloudflared-credentials.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
spec:
  encryptedData:
    credentials.json: 
  template:
    metadata:
      name: cloudflared-credentials
      namespace: cloudflared
