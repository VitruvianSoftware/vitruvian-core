# Credentials for the in-cluster MinIO MCP server (namespace minio-mcp): the
# existing MinIO login mcp-readonly, whose policy lists buckets and keys only and
# never reads an object. Same password as minio/minio-user-mcp-readonly (Bitwarden
# "Homelab MCP — MinIO mcp-readonly"); sealed straight from the keychain.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-mcp-credentials
  namespace: minio-mcp
spec:
  encryptedData:
    MINIO_ACCESS_KEY: 
    MINIO_SECRET_KEY: 
  template:
    metadata:
      name: minio-mcp-credentials
      namespace: minio-mcp
    type: Opaque
