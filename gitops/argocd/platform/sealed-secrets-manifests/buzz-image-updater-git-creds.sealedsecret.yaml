# Dedicated SSH deploy key for argocd-image-updater's git write-back on the
# `buzz` ImageUpdater (see gitops/argocd/platform/argocd-image-updater/).
#
# Namespace is `argocd`, NOT the controller's own namespace: confirmed from
# upstream source (pkg/argocd/argocd.go FilterApplicationsForUpdate and
# pkg/argocd/update.go's getGitCredsSource call) that an ImageUpdater CR only
# ever lists Applications in *its own* namespace, and resolves a
# `git:secret:<ns>/<name>` write-back credential with `<ns>` required to equal
# the target Application's namespace (`app.GetNamespace()`) -- both because
# buzz.yaml lives in `argocd`. The chart's own RBAC only grants Secret
# get/list/watch inside its release namespace, so the controller *must* be
# installed into `argocd` too (see applicationset.yaml) for this secret to be
# both findable and readable -- there is no way to split "controller pod
# namespace" from "app + secret namespace" here without adding custom
# cross-namespace RBAC the chart doesn't ship.
#
# Write access is repo-wide at the GitHub deploy-key level (deploy keys can't
# be scoped to one branch), but the ImageUpdater CR only ever pushes to
# `image-updates/buzz`, which a separate Actions workflow turns into a PR --
# the key itself never touches `main`. Deliberately its own key, not the
# shared `ipv1337` PAT: narrower blast radius if it ever leaks, since it can
# only write to this one repo.
#
# Registered as a deploy key via `gh repo deploy-key add --allow-write`
# (id 159180336, 2026-08-03) -- per `gh`'s own caveat, it is tied to the
# authenticating account's token and is removed if that token is revoked.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: buzz-image-updater-git-creds
  namespace: argocd
spec:
  encryptedData:
    sshPrivateKey: 
  template:
    metadata:
      name: buzz-image-updater-git-creds
      namespace: argocd
    type: Opaque
