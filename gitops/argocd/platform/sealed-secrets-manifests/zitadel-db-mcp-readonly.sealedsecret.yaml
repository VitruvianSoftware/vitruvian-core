# Login for the read-only Postgres MCP server (role mcp_readonly on zitadel-db-cluster,
# member of pg_read_all_data, declared under cluster.roles in the
# zitadel-db ApplicationSet). CNPG reads username/password from this basic-auth
# Secret. The plaintext was generated and sealed in one step and is held only in
# Bitwarden ("Homelab MCP — Postgres zitadel-db mcp_readonly").
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zitadel-db-mcp-readonly
  namespace: zitadel
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: zitadel-db-mcp-readonly
      namespace: zitadel
    type: kubernetes.io/basic-auth
