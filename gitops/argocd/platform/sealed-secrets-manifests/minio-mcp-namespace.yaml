#
# The minio-mcp namespace, declared here (not only via the minio-mcp
# Application's CreateNamespace) because this Application syncs FIRST (wave -4)
# and applies the minio-mcp-credentials SealedSecret into it, and because
# platform-config (wave -3) creates the minio-mcp-tls Certificate and
# ReferenceGrant here. Without the namespace those syncs would fail until the
# minio-mcp app happened to create it.
#
# Pod Security "restricted" is enforced: the MCP server pod runs as non-root,
# drops every capability, forbids privilege escalation and uses the runtime
# default seccomp profile, so it meets the strictest profile as it is.
apiVersion: v1
kind: Namespace
metadata:
  name: minio-mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
