# Grafana service-account token used by Backstage's proxy to read dashboards.
#
# Provisioned as a Grafana service account named `backstage` with the VIEWER
# role (id 35, token `backstage-proxy`), so it cannot mutate dashboards, alerts
# or datasources. The proxy additionally restricts the endpoint to GET.
#
# The value was generated inside the Grafana pod and piped straight into
# kubeseal, so it never touched a terminal, a log, or this repository in
# plaintext.
#
# Rotation: delete the token via Grafana's API (or UI: Administration ->
# Service accounts -> backstage), issue a new one, and re-seal with the same
# pipeline documented in docs/backstage-grafana.md. The token does not expire,
# so rotation is deliberate rather than forced.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-backstage-token
  namespace: backstage
spec:
  encryptedData:
    GRAFANA_TOKEN: 
  template:
    metadata:
      name: grafana-backstage-token
      namespace: backstage
