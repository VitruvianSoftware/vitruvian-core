# cf-secret (external-dns's Cloudflare API token). Sealed directly to replace the
# fake-ClusterSecretStore + cf-external-secret indirection (which held the value
# inline — not git-safe). external-dns reads this Secret via secretKeyRef.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cf-secret
  namespace: external-dns
spec:
  encryptedData:
    cloudflare-api-key: 
  template:
    metadata:
      annotations:
        reconcile.external-secrets.io/data-hash: d43a3c59bfbd43638afb01e6fe20fc58
        reloader.stakater.com/match: "true"
      labels:
        reconcile.external-secrets.io/created-by: b816a8084f199d20daf6214e566972ee
        reconcile.external-secrets.io/managed: "true"
        service: external-dns
      name: cf-secret
      namespace: external-dns
    type: Opaque
