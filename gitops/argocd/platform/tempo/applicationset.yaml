#
# tempo — OTel trace store. S3-backed via MinIO (persistence disabled, no PVC),
# so safe to ArgoCD-adopt. Part of the OTel stack: operator (wave -1) -> tempo
# (wave 0) -> collector (wave 1). All three are released from Pulumi together by
# the single `opentelemetry_enabled` flag. helm.values mirror the live release
# (`helm get values tempo -n opentelemetry`) verbatim, so adoption is a no-op.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
  labels:
    environment: opentelemetry
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: tempo
      labels:
        app: tempo
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: tempo
        targetRevision: "1.24.4"
        helm:
          version: v3
          values: |
            replicas: 2
            persistence:
              enabled: false
              size: 2Gi
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: tempo
                    topologyKey: kubernetes.io/hostname
            tempo:
              metricsGenerator:
                enabled: true
                remoteWriteUrl: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
                processor:
                  service_graphs:
                    enabled: true
                  span_metrics:
                    enabled: true
                registry:
                  external_labels:
                    source: tempo
              overrides:
                defaults:
                  metrics_generator:
                    processors:
                      - service-graphs
                      - span-metrics
              storage:
                trace:
                  backend: s3
                  s3:
                    access_key: admin
                    secret_key: minio-admin-password
                    bucket: tempo
                    endpoint: minio.minio.svc.cluster.local:9000
                    insecure: true
      destination:
        server: '{{.server}}'
        namespace: opentelemetry
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
