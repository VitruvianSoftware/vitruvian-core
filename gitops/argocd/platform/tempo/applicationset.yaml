# tempo — OTel trace store. S3-backed via MinIO (persistence disabled, no PVC),
# so safe to ArgoCD-adopt. Part of the OTel stack: operator (wave -1) -> tempo
# (wave 0) -> collector (wave 1). All three are released from Pulumi together by
# the single `opentelemetry_enabled` flag. helm.values mirror the live release
# (`helm get values tempo -n opentelemetry`) verbatim, so adoption is a no-op.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
  labels:
    environment: opentelemetry
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: tempo
      labels:
        app: tempo
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: tempo
        targetRevision: "1.24.4"
        helm:
          version: v3
          values: |
            replicas: 2
            persistence:
              enabled: false
              size: 2Gi
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: tempo
                    topologyKey: kubernetes.io/hostname
            tempo:
              metricsGenerator:
                enabled: true
                # Phase 2: MIRROR generated metrics to BOTH prometheus replicas (the
                # remote-write receiver path must be HA, like the OTel collector). The
                # chart's storage.remote_write list (full Prometheus remote_write
                # config) overrides the single remoteWriteUrl; target the StatefulSet
                # per-pod headless DNS. The Thanos Querier dedups via the replica label.
                storage:
                  remote_write:
                    - url: http://prometheus-server-0.prometheus-server-headless.monitoring.svc.cluster.local:9090/api/v1/write
                    - url: http://prometheus-server-1.prometheus-server-headless.monitoring.svc.cluster.local:9090/api/v1/write
                # Do NOT set processor.<service_graphs|span_metrics>.enabled — Tempo's config has no
                # such field, so it renders into /conf/tempo.yaml and crash-loops the pod with
                # "yaml: field enabled not found in type servicegraphs.Config / spanmetrics.Config".
                # The processors are enabled the correct way below, via
                # overrides.defaults.metrics_generator.processors.
                registry:
                  external_labels:
                    source: tempo
              overrides:
                defaults:
                  metrics_generator:
                    processors:
                      - service-graphs
                      - span-metrics
              storage:
                trace:
                  backend: s3
                  s3:
                    # S3 creds come from SealedSecret tempo-minio-creds via env
                    # expansion (R8: no plaintext in git) — see config.expand-env.
                    access_key: ${MINIO_ACCESS_KEY}
                    secret_key: ${MINIO_SECRET_KEY}
                    bucket: tempo
                    endpoint: minio-amd64.minio.svc.cluster.local:9000
                    insecure: true
              # Substitute ${VAR} in the rendered /conf/tempo.yaml so the S3
              # credentials are injected from the Secret, not baked in plaintext.
              extraArgs:
                config.expand-env: "true"
              extraEnv:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tempo-minio-creds
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tempo-minio-creds
                      key: MINIO_SECRET_KEY
      destination:
        server: '{{.server}}'
        namespace: opentelemetry
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
