# R2 — off-cluster logical backup of the cnpg-cluster app DB. Daily pg_dump to the
# NAS over NFS (nfs-backup class), complementing the in-cluster barman PITR (R1).
# This copy lives on a separate machine (the NAS), so it survives loss of the
# whole k8s cluster / its MinIO. 30-day retention.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-dump-nfs
  namespace: cnpg-cluster
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-backup
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump-nfs
  namespace: cnpg-cluster
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # root + no_root_squash export → writes to the NAS without uid mapping.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
          containers:
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:16
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts=$(date +%Y%m%d-%H%M%S)
                  out="/backup/app-${ts}.sql.gz"
                  echo "pg_dump ${PGDATABASE}@${PGHOST} -> ${out}"
                  pg_dump --no-owner --no-privileges | gzip -c > "${out}.partial"
                  mv "${out}.partial" "${out}"
                  echo "prune dumps older than 30d:"
                  find /backup -name 'app-*.sql.gz' -mtime +30 -print -delete || true
                  echo "current dumps:"; ls -lh /backup | tail -8
              env:
                - {name: PGHOST, value: cnpg-cluster-rw.cnpg-cluster.svc.cluster.local}
                - {name: PGPORT, value: "5432"}
                - {name: PGDATABASE, value: app}
                - {name: PGSSLMODE, value: require}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: {name: cnpg-initial-app-credentials, key: username}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: cnpg-initial-app-credentials, key: password}
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: pg-dump-nfs
