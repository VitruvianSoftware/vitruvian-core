#
# prometheus — Pulumi -> ArgoCD platform cutover. Central metrics store +
# remote-write receiver consumed by the OTel collector and Tempo's metrics
# generator. helm.values mirror the LIVE Pulumi/Helm release verbatim
# (`helm get values prometheus -n monitoring` == DeployPrometheus in
# infrastructure/pulumi/platform/dev-local/pkg/applications/monitoring.go), so ArgoCD
# adoption is a no-op — no pod restart, no PVC churn.
#   chart prometheus-22.6.7 (prometheus-community), ns monitoring.
#   server: replicaCount=1, statefulSet.enabled=false (Deployment, NOT a
#     StatefulSet — single replica because simple-mode Prometheus has no HA
#     remote-write without Thanos/Mimir; two replicas would split-brain the
#     collector's round-robin).
#   server.persistentVolume: 25Gi on local-path (node-local; TSDB history is
#     disposable — re-scraped after a node loss). retention.size is delivered as a
#     RAW FLAG via server.extraFlags (storage.tsdb.retention.size=20GB) —
#     chart 22.6.7 does NOT render server.retentionSize, so it must stay in
#     extraFlags or the live --storage.tsdb.retention.size arg would disappear.
#     extraFlags also carries web.enable-lifecycle + web.enable-remote-write-
#     receiver (the remote-write receiver the OTel/Tempo pipeline writes into).
#   alertmanager.persistence: 2Gi on local-path (node-local; minimal state). NOTE the live release persists via
#     `alertmanager.persistence` (the subchart's real key). The legacy
#     `alertmanager.persistentVolume` spelling is silently ignored by this chart
#     — do NOT "fix" it to persistentVolume here or the alertmanager PVC binding
#     changes and silences/nflog churn.
#
# DATA IS RETAINED OUT-OF-BAND BY PULUMI DURING CUTOVER. The two PVCs
# (prometheus-server 25Gi, alertmanager 2Gi on local-path) and their backing
# local-path volumes hold live TSDB + alertmanager state and MUST survive the
# handoff. The chart ships no CRDs, so there is no CRD bundle to preserve; the
# only stateful objects are the PVCs. At cutover set the prometheus/monitoring
# enable flag to false in the dev-local stack and `pulumi up` so Pulumi releases
# ownership (RetainOnDelete keeps the release + PVCs) as ArgoCD adopts — Pulumi
# must NEVER prune the PVCs or the StatefulSet/Deployment-bound volumes.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
  labels:
    environment: monitoring
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: prometheus
      labels:
        app: prometheus
      annotations:
        # Base observability datastore + remote-write receiver. Lands before the
        # consumers that write to / scrape it: the OTel collector (wave 1) and
        # Tempo's metrics generator. Peer of the tempo datastore (wave 0).
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus
        # Pinned to the live release version (helm list: prometheus-22.6.7).
        targetRevision: "22.6.7"
        helm:
          version: v3
          values: |
            {{`
            server:
              extraFlags:
              - web.enable-lifecycle
              - web.enable-remote-write-receiver
              - storage.tsdb.retention.size=20GB
              # Thanos sidecar requires local compaction DISABLED (min==max block
              # duration) so it ships raw 2h blocks; the Thanos Compactor owns
              # compaction/downsampling in object storage.
              - storage.tsdb.min-block-duration=2h
              - storage.tsdb.max-block-duration=2h
              # Expand $(POD_NAME) inside external_labels (per-replica dedup label).
              - enable-feature=expand-external-labels
              persistentVolume:
                enabled: true
                size: 25Gi
                storageClass: local-path
              # HA: 2 independent replicas. Dedup happens at the Thanos Querier via
              # the per-replica replica label, NOT at write time -- two replicas
              # behind one round-robin Service would otherwise split-brain reads.
              # (No literal backticks anywhere in this block -- it is a Go raw string.)
              replicaCount: 2
              statefulSet:
                enabled: true
                # Expose the sidecar gRPC (10901) on the prometheus-server-headless
                # Service so the Thanos Querier can dnssrv-discover both sidecars.
                headless:
                  gRPC:
                    enabled: true
              # Unique replica label per pod -> the Querier dedup key; cluster label
              # tags the source. Prometheus expand-external-labels uses os.Expand
              # (shell-style ${VAR}/$VAR), NOT the k8s $(VAR) form -- $(POD_NAME)
              # is left literal, giving both replicas IDENTICAL labels (breaks dedup
              # and halts the Compactor on overlapping blocks). Use ${POD_NAME}.
              global:
                external_labels:
                  cluster: lab
                  replica: "${POD_NAME}"
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              # Pod-level volume for the Thanos objstore config, consumed by the
              # sidecar below (the SealedSecret created in Phase 1a).
              extraVolumes:
                - name: thanos-objstore
                  secret:
                    secretName: thanos-objstore-creds
              # Thanos sidecar: serves the recent TSDB over StoreAPI (gRPC 10901)
              # and uploads completed blocks to MinIO. Shares the prometheus data
              # PVC (storage-volume -> /data, the chart's tsdb path).
              sidecarContainers:
                thanos-sidecar:
                  image: quay.io/thanos/thanos:v0.39.2
                  args:
                    - sidecar
                    - --tsdb.path=/data
                    - --prometheus.url=http://127.0.0.1:9090
                    - --objstore.config-file=/etc/thanos/objstore.yml
                    - --grpc-address=0.0.0.0:10901
                    - --http-address=0.0.0.0:10902
                  ports:
                    - name: grpc
                      containerPort: 10901
                    - name: http-sidecar
                      containerPort: 10902
                  volumeMounts:
                    - name: storage-volume
                      mountPath: /data
                    - name: thanos-objstore
                      mountPath: /etc/thanos
                      readOnly: true
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 256Mi
            serverFiles:
              recording_rules.yml:
                groups:
                - name: k8s.rules
                  rules:
                  - expr: sum by (namespace, pod, container) (irate(container_cpu_usage_seconds_total{image!=""}[5m]))
                    record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
              alerting_rules.yml:
                groups:

                # ── 1. Watchdog (dead-man's-switch) ──────────────────────────
                - name: watchdog
                  rules:
                  - alert: Watchdog
                    expr: vector(1)
                    labels:
                      severity: none
                    annotations:
                      summary: "Alerting pipeline heartbeat (dead-man's-switch)"
                      description: >-
                        Always firing. Routed to healthchecks.io so that if dev-local,
                        Prometheus, or Alertmanager dies, hc.io stops receiving pings
                        and raises an external alarm.

                # ── 2. Nodes (sleep-prone laptop VMs = #1 failure mode) ──────
                - name: nodes
                  rules:
                  - alert: KubeNodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 10m
                    labels:
                      severity: page
                    annotations:
                      summary: "Node {{ $labels.node }} is NotReady"
                      description: "{{ $labels.node }} NotReady for >10m (kube-state-metrics)."

                  - alert: KubeNodeUnreachable
                    expr: up{job="kubernetes-nodes"} == 0
                    for: 5m
                    labels:
                      severity: page
                    annotations:
                      summary: "Node {{ $labels.instance }} kubelet unreachable"
                      description: "kubelet on {{ $labels.instance }} unscrapeable for >5m (node down/asleep)."

                  - alert: KubeNodeMemoryPressure
                    expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "MemoryPressure on {{ $labels.node }}"
                      description: "{{ $labels.node }} MemoryPressure >5m; pods may be evicted."

                  - alert: KubeNodeDiskPressure
                    expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "DiskPressure on {{ $labels.node }}"
                      description: "{{ $labels.node }} DiskPressure >5m; image GC / evictions imminent."

                  - alert: NodeFilesystemNearFull
                    expr: |
                      (
                        node_filesystem_avail_bytes{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"}
                        /
                        node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"}
                      ) * 100 < 12
                      and
                      node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"} > 0
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} <12% free"
                      description: "{{ $value | printf \"%.1f\" }}% free on {{ $labels.mountpoint }} ({{ $labels.instance }}) for >30m."

                  - alert: NodeFilesystemNearFullCritical
                    expr: |
                      (
                        node_filesystem_avail_bytes{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"}
                        /
                        node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"}
                      ) * 100 < 5
                      and
                      node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"} > 0
                    for: 10m
                    labels:
                      severity: page
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} <5% free"
                      description: "CRITICAL: {{ $value | printf \"%.1f\" }}% left on {{ $labels.mountpoint }} ({{ $labels.instance }})."

                  - alert: NodeFilesystemInodesNearFull
                    expr: |
                      (
                        node_filesystem_files_free{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"}
                        /
                        node_filesystem_files{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"}
                      ) * 100 < 10
                      and
                      node_filesystem_files{fstype!~"tmpfs|vfat|overlay|squashfs|ramfs"} > 0
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Inodes <10% free on {{ $labels.mountpoint }} ({{ $labels.instance }})"
                      description: "{{ $value | printf \"%.1f\" }}% inodes left on {{ $labels.mountpoint }} ({{ $labels.instance }}) for >30m."

                  - alert: NodeMemoryHigh
                    expr: |
                      (
                        1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                      ) * 100 > 92
                    for: 20m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Memory >92% on {{ $labels.instance }}"
                      description: "{{ $labels.instance }} memory at {{ $value | printf \"%.1f\" }}% for >20m (OOM / eviction risk)."

                # ── 3. etcd quorum PROXY (etcd metrics NOT scraped here) ─────
                # Voter set hard-coded; re-check if cluster membership changes.
                - name: etcd-quorum-proxy
                  rules:
                  - alert: EtcdServerNodeDown
                    expr: up{job="kubernetes-nodes", instance=~"james-macbook-pro|james-mbp32|fedora"} == 0
                    for: 3m
                    labels:
                      severity: warning
                    annotations:
                      summary: "etcd voter node {{ $labels.instance }} unreachable"
                      description: "etcd server {{ $labels.instance }} kubelet down >3m. 1 voter lost; quorum holds (2/3). Wake it before a second drops."

                  - alert: EtcdQuorumAtRisk
                    expr: count(up{job="kubernetes-nodes", instance=~"james-macbook-pro|james-mbp32|fedora"} == 0) >= 2
                    for: 1m
                    labels:
                      severity: page
                    annotations:
                      summary: "etcd quorum LOST — {{ $value }} of 3 voters down"
                      description: "2+ of 3 etcd voters (james-macbook-pro/james-mbp32/fedora) unreachable. API server read-only / unavailable. Wake a laptop NOW."

                  - alert: EtcdNoLeader
                    expr: max(etcd_server_has_leader) == 0
                    for: 1m
                    labels:
                      severity: page
                    annotations:
                      summary: "etcd reports no leader"
                      description: "etcd_server_has_leader==0 (inert until an etcd scrape job exists; harmless if absent)."

                # ── 4. Runtime wedge (cri-dockerd/shim incident as SYMPTOM) ──
                - name: runtime-wedge
                  rules:
                  - alert: NodeContainersStuckWaiting
                    expr: |
                      sum by (node) (
                        kube_pod_container_status_waiting
                        * on(namespace, pod) group_left(node) kube_pod_info
                      ) >= 3
                    for: 10m
                    labels:
                      severity: page
                    annotations:
                      summary: "{{ $value }} containers stuck waiting on node {{ $labels.node }}"
                      description: >-
                        {{ $value }} containers in Waiting on {{ $labels.node }} for >10m while
                        other nodes run — classic cri-dockerd/containerd shim wedge
                        (FailedCreatePodSandbox / 'unsupported protocol'). Check pod events on
                        {{ $labels.node }}; restart k3s/docker on that node.

                  - alert: PodNotReadyLong
                    expr: |
                      sum by (namespace, pod) (
                        kube_pod_status_phase{phase=~"Pending|Unknown"}
                      ) > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending/Unknown >15m"
                      description: "{{ $labels.namespace }}/{{ $labels.pod }} has not reached Running for >15m."

                # ── 5. Workloads (node-exporter/metallb noise routed to null) ─
                - name: workloads
                  rules:
                  - alert: KubePodCrashLooping
                    expr: |
                      increase(
                        kube_pod_container_status_restarts_total{
                          container!~"node-exporter|.*metallb.*|speaker"
                        }[15m]
                      ) > 3
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "CrashLoop: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
                      description: "{{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} restarted >3x in 15m."

                  - alert: KubePodCrashLoopingNoisy
                    expr: |
                      increase(
                        kube_pod_container_status_restarts_total{
                          container=~"node-exporter|.*metallb.*|speaker"
                        }[1h]
                      ) > 10
                    for: 30m
                    labels:
                      severity: noise
                    annotations:
                      summary: "Chronic crashloop (known noise): {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
                      description: "Known-noisy {{ $labels.container }} flapping. Informational only; routed to null receiver."

                  - alert: KubeDeploymentReplicasMismatch
                    expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
                    for: 20m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} under desired replicas"
                      description: "Available != desired for >20m ({{ $labels.namespace }}/{{ $labels.deployment }})."

                  - alert: KubeStatefulSetReplicasMismatch
                    expr: kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
                    for: 20m
                    labels:
                      severity: warning
                    annotations:
                      summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} under desired replicas"
                      description: "Ready != desired for >20m ({{ $labels.namespace }}/{{ $labels.statefulset }})."

                  - alert: KubeDaemonSetMisScheduled
                    expr: kube_daemonset_status_number_misscheduled > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} mis-scheduled"
                      description: "{{ $value }} pods of {{ $labels.namespace }}/{{ $labels.daemonset }} running where they shouldn't for >15m."

                  - alert: KubeDaemonSetNotScheduled
                    expr: |
                      kube_daemonset_status_desired_number_scheduled
                        - kube_daemonset_status_current_number_scheduled > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} not fully scheduled"
                      description: "{{ $value }} pods of {{ $labels.namespace }}/{{ $labels.daemonset }} not scheduled for >15m."

                # ── 6. Backups (must not silently fail) ──────────────────────
                - name: backups
                  rules:
                  - alert: CronJobBackupStale
                    expr: |
                      (
                        time() - kube_cronjob_status_last_successful_time{
                          cronjob=~"pg-dump-nfs|prometheus-nas-backup"
                        }
                      ) > 36 * 3600
                    labels:
                      severity: page
                    annotations:
                      summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} stale (>36h)"
                      description: >-
                        {{ $labels.namespace }}/{{ $labels.cronjob }} last succeeded
                        {{ $value | humanizeDuration }} ago (>36h). NAS backups failing
                        silently — check the CronJob and the NAS mount.

                  - alert: CronJobNeverSucceeded
                    expr: |
                      kube_cronjob_status_last_successful_time{
                        cronjob=~"pg-dump-nfs|prometheus-nas-backup"
                      } == 0
                    for: 6h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has never succeeded"
                      description: "No successful run on record for {{ $labels.namespace }}/{{ $labels.cronjob }}."

                  - alert: KubeJobFailed
                    expr: kube_job_status_failed > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
                      description: "{{ $labels.namespace }}/{{ $labels.job_name }} has {{ $value }} failed pod(s)."

                # ── 7. CNPG Postgres (ready instances via KSM, not cnpg labels) ─
                - name: cnpg
                  rules:
                  - alert: CNPGClusterUnderReplicated
                    expr: |
                      sum by (namespace) (
                        kube_pod_status_ready{condition="true"}
                        * on(namespace, pod) group_left
                        kube_pod_info{created_by_kind="Cluster", namespace=~"cnpg-cluster|grafana"}
                      ) < 3
                    for: 10m
                    labels:
                      severity: page
                    annotations:
                      summary: "CNPG cluster in {{ $labels.namespace }} has <3 ready instances"
                      description: >-
                        Only {{ $value }} ready CNPG Postgres instance(s) in {{ $labels.namespace }}
                        (expected 3) for >10m. Likely a sleeping node + hostname-pinned local-path
                        PV stranding a replica.

                  - alert: CNPGCollectorDown
                    expr: cnpg_collector_up == 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "CNPG metrics collector down ({{ $labels.namespace }})"
                      description: "cnpg_collector_up==0 for >10m; CNPG instance metrics unavailable."

                # ── 8. Storage (PVC/PV) ──────────────────────────────────────
                - name: storage
                  rules:
                  - alert: PersistentVolumeClaimNearFull
                    expr: |
                      (
                        kubelet_volume_stats_available_bytes
                        /
                        kubelet_volume_stats_capacity_bytes
                      ) * 100 < 12
                    for: 20m
                    labels:
                      severity: warning
                    annotations:
                      summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} <12% free"
                      description: "{{ $value | printf \"%.1f\" }}% space left on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} for >20m."

                  - alert: PersistentVolumeClaimCritical
                    expr: |
                      (
                        kubelet_volume_stats_available_bytes
                        /
                        kubelet_volume_stats_capacity_bytes
                      ) * 100 < 5
                    for: 5m
                    labels:
                      severity: page
                    annotations:
                      summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} <5% free"
                      description: "CRITICAL: {{ $value | printf \"%.1f\" }}% left on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}."

                  - alert: PersistentVolumeFailed
                    expr: kube_persistentvolume_status_phase{phase="Failed"} == 1
                    for: 5m
                    labels:
                      severity: page
                    annotations:
                      summary: "PersistentVolume {{ $labels.persistentvolume }} Failed"
                      description: "PV {{ $labels.persistentvolume }} in phase=Failed (reclaim/detach error)."

                  - alert: PersistentVolumeClaimPending
                    expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} Pending"
                      description: "PVC unbound (no provisioner / node affinity unmet) for >15m."

                # ── 9. Certificates (cert-manager metrics present) ───────────
                - name: certificates
                  rules:
                  - alert: CertManagerCertExpiringSoon
                    expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires <7d"
                      description: "{{ $labels.name }} ({{ $labels.namespace }}) expires in {{ $value | humanizeDuration }}."

                  - alert: CertManagerCertNotReady
                    expr: certmanager_certificate_ready_status{condition="True"} == 0
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not Ready"
                      description: "{{ $labels.name }} ({{ $labels.namespace }}) not-Ready for >1h."

                # ── 10. Monitoring self ──────────────────────────────────────
                - name: monitoring-self
                  rules:
                  - alert: PrometheusConfigReloadFailed
                    expr: prometheus_config_last_reload_successful == 0
                    for: 10m
                    labels:
                      severity: page
                    annotations:
                      summary: "Prometheus config reload failed"
                      description: "prometheus_config_last_reload_successful==0 for >10m — running config stale; new rules/alerts NOT loaded."

                  - alert: PrometheusTSDBCompactionsFailing
                    expr: increase(prometheus_tsdb_compactions_failed_total[3h]) > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Prometheus TSDB compactions failing"
                      description: "{{ $value }} failed TSDB compaction(s) in 3h — disk/corruption risk on the 25Gi PVC."

                  - alert: PrometheusNotificationsDropped
                    expr: increase(prometheus_notifications_dropped_total[15m]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Prometheus dropping alert notifications to Alertmanager"
                      description: "{{ $value }} notifications dropped in 15m — Alertmanager may be down/unreachable."

                  - alert: PrometheusTargetDown
                    expr: up{job!~"node-exporter|.*metallb.*"} == 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Scrape target down: {{ $labels.job }} / {{ $labels.instance }}"
                      description: "{{ $labels.job }} target {{ $labels.instance }} unscrapeable for >15m."
            extraScrapeConfigs: |2

              - job_name: 'node-exporter'
                kubernetes_sd_configs:
                  - role: endpoints
                relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  regex: '.*node-exporter.*'
                  action: keep
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  target_label: instance
                # OpenLens/Lens node + cluster-overview CPU/mem panels aggregate
                # node-exporter series by(kubernetes_node), but this chart only
                # relabels the node name into 'node'. Mirror it into kubernetes_node
                # so Lens renders (detail pages work without it; the overview does
                # not). Ref: lensapp/lens troubleshooting/custom-prometheus.md.
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  target_label: kubernetes_node
              - job_name: 'traefik'
                kubernetes_sd_configs:
                  - role: endpoints
                relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  regex: 'traefik'
                  action: keep
              - job_name: 'minio'
                metrics_path: /minio/v2/metrics/cluster
                kubernetes_sd_configs:
                  - role: endpoints
                relabel_configs:
                - source_labels: [__meta_kubernetes_service_name]
                  regex: 'minio'
                  action: keep
            alertmanager:
              # HA: 2-replica gossip cluster. The subchart auto-wires clustering
              # when replicaCount>1 (--cluster.listen-address + a --cluster.peer per
              # replica via the headless service), so silences/nflog/dedup survive a
              # single node loss and Prometheus fans alerts out to both. The
              # podAntiAffinity "hard" value pins the two onto different nodes
              # (topologyKey hostname; 2 replicas / 7 nodes always schedules).
              # replica-0 keeps its existing 2Gi PVC; replica-1 gets a new one from
              # the same volumeClaimTemplate. NOTE: this whole values block is a Go
              # raw-string literal (opened/closed by the brace-brace-backtick
              # delimiters at the very top and bottom of the block). Do NOT use a
              # literal backtick anywhere inside it — a stray backtick closes the
              # raw string early and breaks ApplicationSet goTemplate parsing.
              replicaCount: 2
              podAntiAffinity: hard
              persistence:
                enabled: true
                size: 2Gi
                storageClass: local-path
              # Alertmanager delivery. Until now the chart default was used — an
              # EMPTY "default-receiver" that silently DROPPED every alert, so the
              # (comprehensive, working) rules fired into a void: a CNPG member
              # crashlooped 15 days and backups failed silently, unseen (2026-07-20).
              # Route actionable alerts (severity page|warning) to ntfy for phone
              # push; drop known-noise/heartbeat. The ntfy URL is NOT committed (this
              # repo has a public mirror) — it is read at runtime from a mounted
              # Secret via url_file. PREREQUISITE: the SealedSecret
              # `alertmanager-ntfy-endpoint` (key `ntfy-url` = the full ntfy topic
              # URL) must exist BEFORE this applies, or the alertmanager pod can't
              # mount it. Create it in one step:
              #   bazel run //tools/gitops:seal-alert-ntfy -- 'https://ntfy.host/mytopic'
              config:
                global:
                  resolve_timeout: 5m
                route:
                  receiver: "null"
                  group_by: ["alertname", "namespace"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                  routes:
                    - matchers: ['severity=~"none|noise"']
                      receiver: "null"
                    - matchers: ['severity=~"page|warning"']
                      receiver: ntfy
                receivers:
                  - name: "null"
                  - name: ntfy
                    webhook_configs:
                      - url_file: /etc/alertmanager/secrets/ntfy/ntfy-url
                        send_resolved: true
              extraSecretMounts:
                - name: ntfy-endpoint
                  secretName: alertmanager-ntfy-endpoint
                  mountPath: /etc/alertmanager/secrets/ntfy
                  readOnly: true
            # ── node-exporter: run as root so the RAPL collector can read ────
            # CPU package energy. node-exporter exports node_rapl_*_joules_total
            # from /host/sys/class/powercap/intel-rapl:*/energy_uj, but since
            # CVE-2020-8694 that sysfs file is mode 0400 (root-only), so the
            # chart-default nobody (uid 65534) reads nothing and the rapl series
            # are silently absent. Running the DaemonSet as root lets the
            # collector read it (the pod already host-mounts /, /sys, /proc).
            # Only the bare-metal Intel nodes (fedora, nuc9i5, nuc9i9) have a
            # powercap interface; the Lima VM nodes expose no rapl series, which
            # is harmless. Powers the "Node Power" Grafana dashboard.
            prometheus-node-exporter:
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                fsGroup: 0
            # ── pushgateway: tailnet-reachable ingress for host push agents ──
            # The bundled Pushgateway is ClusterIP-only. The macOS power agents
            # run on the Lima VM HOSTS (the Macs, outside k8s) and push SoC /
            # battery watts over the tailnet, so expose it through Traefik at a
            # lab hostname (same pattern as grafana). The lab record resolves to
            # the in-cluster Traefik LB, so this is reachable only from tailnet
            # devices — no auth beyond that boundary. The existing
            # prometheus-pushgateway scrape job already ingests it with
            # honor_labels:true, so the pushed job/instance labels survive.
            prometheus-pushgateway:
              ingress:
                enabled: true
                className: traefik
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-cloudflare
                  external-dns.alpha.kubernetes.io/sync-enabled: "true"
                hosts:
                  - pushgateway.lab.ipv1337.dev
                tls:
                  - hosts:
                      - pushgateway.lab.ipv1337.dev
                    secretName: pushgateway-tls
            `}}
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
