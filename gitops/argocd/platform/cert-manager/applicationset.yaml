# cert-manager — Pulumi -> ArgoCD platform cutover.
# Values mirror the LIVE Pulumi/Helm deployment exactly (verified on-cluster:
# `helm get values cert-manager -a` + running controller args + replica counts).
#   chart cert-manager-v1.17.0, replicaCount=2 (HA), crds.enabled=false at cutover,
#   extraArgs=[--dns01-recursive-nameservers-only,
#              --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53],
#   hostname podAntiAffinity + PDBs on controller/webhook/cainjector,
#   prometheus.enabled=false with annotation-based scrape on :9402.
#
# CRDs are chart-owned (crds.enabled=true, keep=true) since 2026-09-25; see the
# values block below. The letsencrypt-cloudflare ClusterIssuer
# and cloudflare-api-token-secret are created by Pulumi, NOT this chart, and must
# be migrated/managed separately.
#
# CUTOVER (do NOT just merge): only after ArgoCD is bootstrapped + the platform
# root is applied. At cutover, set cert_manager_enabled=false in the dev-local
# stack and `pulumi up` so Pulumi releases ownership as ArgoCD takes it — but the
# CRDs, ACME account key, cloudflare secret, and ClusterIssuer MUST survive
# (never let Pulumi prune them; CleanupCRDs is already false).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    environment: cert-manager
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: cert-manager
      labels:
        app: cert-manager
      annotations:
        # CRD-bearing, webhook-providing operator: installs before workloads and
        # other operators that may consume cert-manager-issued certs. Earlier
        # than the CNPG operator (-1). The matching CRD bundle, if managed in
        # GitOps, should sit at an even earlier wave (e.g. -4).
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: platform-project
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: "v1.21.2"
        helm:
          version: v3
          values: |
            # The chart is the ONLY owner of its CRDs (since 2026-09-25), so a
            # chart upgrade brings CRDs that match its controller. They used to
            # be a vendored copy applied by the platform-crds app, which had to
            # be hand-updated on every upgrade -- the gap that broke the
            # external-secrets 0.20.4 bump (#2483). That copy was removed once
            # every CRD carried Prune=false,Delete=false.
            #
            # Deleting a CRD deletes every Certificate/Issuer. Protection:
            #  - Argo CD never deletes CRDs on app deletion (hardcoded
            #    !kube.IsCRD in controller/appcontroller.go shouldBeDeleted),
            #    and also honours keep below.
            #  - A PRUNE would still remove them if they vanished from the
            #    render, so do NOT set enabled back to false: the conformance
            #    check "Chart-owned CRDs" fails the build if you do.
            crds:
              enabled: true
              keep: true
            global:
              leaderElection:
                namespace: cert-manager
            # HA: high_availability_enabled=true -> 2 replicas everywhere.
            replicaCount: 2
            nodeSelector:
              node.ipv1337.dev/link: wired
            # DNS-01 self-check must use a public recursive resolver; this
            # homelab blocks pod egress to authoritative NS on :53. Verified
            # live on the controller. Removing these hangs ACME DNS-01 forever.
            extraArgs:
              - --dns01-recursive-nameservers-only
              - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
            # Hard hostname spread — the webhook is admission-path critical.
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: cert-manager
                    topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            # Annotation-based scrape in lieu of a ServiceMonitor/PodMonitor.
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "9402"
            prometheus:
              enabled: false
            webhook:
              replicaCount: 2
              nodeSelector:
                node.ipv1337.dev/link: wired
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: webhook
                      topologyKey: kubernetes.io/hostname
              podDisruptionBudget:
                enabled: true
                minAvailable: 1
            cainjector:
              replicaCount: 2
              nodeSelector:
                node.ipv1337.dev/link: wired
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: cainjector
                      topologyKey: kubernetes.io/hostname
              podDisruptionBudget:
                enabled: true
                minAvailable: 1
      destination:
        server: '{{.server}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # cert-manager CRD/manifests exceed the client-side last-applied
          # annotation limit; CSA avoids the 256KB failure (matches cnpg appset).
          - ServerSideApply=true
          # Keep the ignoreDifferences below out of self-heal too, so Argo CD
          # never strips the protective annotation it describes.
          - RespectIgnoreDifferences=true
      # The CRDs carry argocd.argoproj.io/sync-options: Prune=false,Delete=false
      # (added while platform-crds co-owned them, #2488) so Argo CD can never
      # delete them. The cert-manager chart cannot render that annotation, so
      # without this the app reports the CRDs as permanently OutOfSync.
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1sync-options
