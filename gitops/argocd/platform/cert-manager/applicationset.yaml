# cert-manager — Pulumi -> ArgoCD platform cutover.
# Values mirror the LIVE Pulumi/Helm deployment exactly (verified on-cluster:
# `helm get values cert-manager -a` + running controller args + replica counts).
#   chart cert-manager-v1.17.0, replicaCount=2 (HA), crds.enabled=false,
#   extraArgs=[--dns01-recursive-nameservers-only,
#              --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53],
#   hostname podAntiAffinity + PDBs on controller/webhook/cainjector,
#   prometheus.enabled=false with annotation-based scrape on :9402.
#
# CRDs are NOT installed here (crds.enabled=false) — the v1.17.0 CRD bundle must
# already exist (Pulumi-applied with helm.sh/resource-policy=keep, or a CRD-only
# Application at an earlier sync-wave). The letsencrypt-cloudflare ClusterIssuer
# and cloudflare-api-token-secret are created by Pulumi, NOT this chart, and must
# be migrated/managed separately.
#
# CUTOVER (do NOT just merge): only after ArgoCD is bootstrapped + the platform
# root is applied. At cutover, set cert_manager_enabled=false in the dev-local
# stack and `pulumi up` so Pulumi releases ownership as ArgoCD takes it — but the
# CRDs, ACME account key, cloudflare secret, and ClusterIssuer MUST survive
# (never let Pulumi prune them; CleanupCRDs is already false).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    environment: cert-manager
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: cert-manager
      labels:
        app: cert-manager
      annotations:
        # CRD-bearing, webhook-providing operator: installs before workloads and
        # other operators that may consume cert-manager-issued certs. Earlier
        # than the CNPG operator (-1). The matching CRD bundle, if managed in
        # GitOps, should sit at an even earlier wave (e.g. -4).
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: platform-project
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        # Pinned to the live release version (helm list: cert-manager-v1.17.0).
        targetRevision: "v1.17.0"
        helm:
          version: v3
          values: |
            # CRDs managed out-of-band (Pulumi crds/cert-manager.crds.yaml with
            # resource-policy=keep). The chart must not install or own them.
            crds:
              enabled: false
            global:
              leaderElection:
                namespace: cert-manager
            # HA: high_availability_enabled=true -> 2 replicas everywhere.
            replicaCount: 2
            # DNS-01 self-check must use a public recursive resolver; this
            # homelab blocks pod egress to authoritative NS on :53. Verified
            # live on the controller. Removing these hangs ACME DNS-01 forever.
            extraArgs:
              - --dns01-recursive-nameservers-only
              - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
            # Hard hostname spread — the webhook is admission-path critical.
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: cert-manager
                    topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
            # Annotation-based scrape in lieu of a ServiceMonitor/PodMonitor.
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "9402"
            prometheus:
              enabled: false
            webhook:
              replicaCount: 2
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: webhook
                      topologyKey: kubernetes.io/hostname
              podDisruptionBudget:
                enabled: true
                minAvailable: 1
            cainjector:
              replicaCount: 2
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: cainjector
                      topologyKey: kubernetes.io/hostname
              podDisruptionBudget:
                enabled: true
                minAvailable: 1
      destination:
        server: '{{.server}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # cert-manager CRD/manifests exceed the client-side last-applied
          # annotation limit; CSA avoids the 256KB failure (matches cnpg appset).
          - ServerSideApply=true
