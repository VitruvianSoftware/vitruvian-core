# external-dns — first Pulumi -> ArgoCD platform cutover.
# Values mirror the LIVE Pulumi deployment exactly (verified on-cluster args):
#   --provider=cloudflare --domain-filter=ipv1337.dev --policy=sync
#   --txt-owner-id=bluecentre-dev --source=service --source=ingress --interval=1m
# txtOwnerId MUST remain "bluecentre-dev": it identifies external-dns's own TXT
# records in Cloudflare; changing it orphans the existing records. The Cloudflare
# API token is read from the pre-existing `cf-secret` (do not prune it).
#
# CUTOVER (do NOT just merge): only after ArgoCD is bootstrapped + the platform
# root is applied. At cutover, set external_dns_enabled=false in the dev-local
# stack and `pulumi up` so Pulumi releases ownership as ArgoCD takes it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
  labels:
    environment: external-dns
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: external-dns
      labels:
        app: external-dns
    spec:
      project: platform-project
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns
        chart: external-dns
        targetRevision: "1.15.0"
        helm:
          version: v3
          values: |
            provider: cloudflare
            cloudflare:
              proxied: false
            sources:
              - service
              - ingress
              - crd
            # crd source serves DNSEndpoint CRs (e.g. the k8s-api control-plane
            # endpoint record in platform-config, and the Cloudflare Tunnel CNAMEs
            # for external apps). RBAC for dnsendpoints is added by the chart
            # automatically when "crd" is in sources.
            # NOTE: the gateway-httproute source was tried (Gateway-API migration) but
            # does NOT honor the sync-enabled annotationFilter — it publishes EVERY
            # HTTPRoute's hostname -> its Gateway LB IP, which collides with the
            # proxied tunnel CNAMEs that external apps need (A vs CNAME on the same
            # name; external-dns discards the CNAME). External/tunnel apps therefore
            # use explicit DNSEndpoint CRs. Reintroduce gateway-httproute only with a
            # dedicated internal-only Gateway (or gateway-label-filter) once the
            # production TLS apps migrate off Ingress.
            extraArgs:
              - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
              - --crd-source-kind=DNSEndpoint
            domainFilters:
              - ipv1337.dev
            policy: sync
            interval: 1m
            triggerLoopOnEvent: true
            annotationFilter: "external-dns.alpha.kubernetes.io/sync-enabled in (true)"
            txtOwnerId: bluecentre-dev
            env:
              - name: CF_API_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: cf-secret
                    key: cloudflare-api-key
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
            metrics:
              enabled: true
            service:
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "7979"
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "7979"
      destination:
        server: '{{.server}}'
        namespace: external-dns
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
