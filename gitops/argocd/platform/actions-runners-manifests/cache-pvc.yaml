# Persistent cross-node (ReadWriteMany) local cluster cache for the
# vitruvian-queue runner scale set, backed by the homelab NFS StorageClass
# (/volume1/k8s on springwood-nas, mountPermissions 0775).
#
# Ephemeral runner pods mount subpaths of this volume at:
#   - /home/runner/.cache/bazel-repo (Bazel --repository_cache)
#   - /home/runner/.cache/bazelisk   (Bazelisk binary cache)
#   - /home/runner/go/pkg/mod        (Go module download cache for fetch_repo)
#   - /home/runner/.local/share/pnpm/store (pnpm content-addressable store)
# so merge-queue and push-to-main jobs reuse fetched archives across pods
# on the LAN instead of downloading the 5.55 GB repository-cache tarball and
# Go modules over WAN on every job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vitruvian-queue-cache
  namespace: arc-runners
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 50Gi
