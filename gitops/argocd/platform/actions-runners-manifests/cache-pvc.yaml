# Persistent cross-node (ReadWriteMany) local cluster cache for the
# vitruvian-queue runner scale set, backed by the homelab NFS StorageClass
# (/volume1/k8s on springwood-nas, mountPermissions 0775).
#
# Ephemeral runner pods mount subpaths of this volume at:
#   - /home/runner/.cache/bazel-repo (Bazel --repository_cache, SHA-256 CAS)
#   - /home/runner/.cache/bazelisk   (Bazelisk binary cache)
# Both caches are content-addressed and lock-free across concurrent pods (unlike
# Go's `go/pkg/mod/cache/download/*.lock` fcntl locks or pnpm's store index),
# so merge-queue and push-to-main jobs reuse fetched archives across pods on
# the LAN without downloading the 5.55 GB repository-cache tarball over WAN on
# every job or contending on NFSv4 file locks. Pruned weekly by
# cache-gc-cronjob.yaml.
#
# The size is the claim, not a quota: csi-driver-nfs enforces no limit, so the
# real ceiling is free space on the NAS share. It still sets the GC's
# high-watermark (70% of it), so keep the two in step. The StorageClass allows
# expansion, so raising it resizes the bound claim in place; it cannot shrink.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vitruvian-queue-cache
  namespace: arc-runners
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 80Gi
