# High-watermark garbage collection for the vitruvian-queue-cache NFS volume.
#
# Bazel's --repository_cache is content-addressed by SHA-256 and does not
# update mtime on cache hits (and the nfs StorageClass mounts with noatime).
# An unconditional 14-day mtime sweep would therefore wipe active dependencies
# every two weeks. Instead, this CronJob checks /cache/bazel-repo usage once a
# week and prunes blobs older than 14 days ONLY when usage exceeds the 35 GiB
# high-watermark (36700160 KiB out of the 50 GiB PVC). All find invocations
# tolerate concurrent runner pod activity (`|| true`).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vitruvian-queue-cache-gc
  namespace: arc-runners
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [fedora, nuc9i9]
          containers:
            - name: cache-gc
              image: ghcr.io/vitruviansoftware/vitruvian-ci-runner@sha256:0bb1b40b9e1f62eec01bd6e615ce6588befb36b41f3fa5a51226297e25e474b4
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  if [ -d /cache/bazel-repo ]; then
                    used_kb="$(du -sk /cache/bazel-repo 2>/dev/null | awk '{print $1}' || echo 0)"
                    echo "/cache/bazel-repo usage: ${used_kb:-0} KiB (watermark: 36700160 KiB / 35 GiB)"
                    if [ "${used_kb:-0}" -gt 36700160 ]; then
                      echo "Above 35 GiB high-watermark; pruning /cache/bazel-repo files older than 14 days..."
                      find /cache/bazel-repo -type f -mtime +14 -delete || true
                      find /cache/bazel-repo -mindepth 1 -type d -empty -delete || true
                    fi
                  fi
                  df -h /cache
              resources:
                requests:
                  cpu: "100m"
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                privileged: false
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: runner-cache
                  mountPath: /cache
          volumes:
            - name: runner-cache
              persistentVolumeClaim:
                claimName: vitruvian-queue-cache
