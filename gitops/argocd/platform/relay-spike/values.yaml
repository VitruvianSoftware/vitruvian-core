# Live values for the Vitruvian Relay spike chart (apps/suites/vitruvian-relay/spike/deploy/chart).
# The digest is pinned by hand: a spike doesn't get an image updater. Take a new
# one from the vitruvian-relay-spike-image run's summary.
image:
  digest: "main@sha256:f6a488ce2934cfbc517ff1ec42e0d260c399f20dfc0cd2fa5dd06d3b7917b3cb"
  # OLD image name on purpose: the renamed image does not exist in GHCR until the
  # first vitruvian-relay-spike-image run. Point this at ghcr.io/vitruviansoftware/vitruvian-relay-spike
  # and re-pin the digest after that run.
  repository: ghcr.io/vitruviansoftware/relay-spike
# From the zitadel-apps-relay stack's outputs (zitadel-apps-relay-apply run).
oidc:
  projectId: "398912441632687930"
  mcpClientIds: "398912442404439866" # claudeClientId (add chatgptClientId later)
  connectorClientId: "398912442404505402"
  allowedSubjects: "378818267051722263" # James (the stack's only grant)
