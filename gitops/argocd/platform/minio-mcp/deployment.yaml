# minio-mcp — read-only MinIO MCP server (StreamableHTTP at /mcp on 8090).
#
# Read-only on two layers:
#   1. The server runs without --allow-write, --allow-delete and --allow-admin,
#      so it offers no tools that change anything (upstream README: "without any
#      flags the server will be running in read-only mode"). --allowed-directories
#      is left off too: it is only for the local-file tools.
#   2. The MinIO login it uses (mcp-readonly, SealedSecret minio-mcp-credentials)
#      is allowed ListAllMyBuckets, GetBucketLocation and ListBucket only, so even
#      a tool that tried to read an object would be refused by MinIO.
# The server has no authentication of its own. Anyone who can reach it can list
# every bucket and key; the tailnet-only exposure is the only access control.
#
# The image runs as root by default (no USER in its Dockerfile, checked on the
# registry config 2026-11-25). The binary is a single file at /, mode 0755, so
# any uid can run it: runAsNonRoot with an arbitrary uid here, like ntfy.
# HOME points at the /tmp emptyDir because the server looks up the home
# directory at start ("Failed to get home directory") and the root filesystem
# is read-only.
#
# Single replica: stateless, and a missed request during a restart is retried
# by the client. The image is a multi-arch index (amd64 + arm64), so no node
# affinity is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-mcp
  namespace: minio-mcp
  labels:
    app: minio-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-mcp
  template:
    metadata:
      labels:
        app: minio-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          # Pinned by digest: the multi-arch index behind the `latest` tag
          # (also tagged RELEASE.2025-05-28T17-22-30Z), read from the quay.io
          # registry API on 2026-11-25. Renovate does not track this one; bump
          # it by hand.
          image: quay.io/minio/aistor/mcp-server-aistor@sha256:8bb7292bd9e0aa83664eacac7bc530381e0995526eb69c192e199865ccccfb8b
          args:
            - --http
            - --http-port
            - "8090"
          env:
            # The ClusterIP Service in front of the MinIO StatefulSet
            # (gitops/argocd/platform/minio-amd64). Plain HTTP inside the cluster.
            - name: MINIO_ENDPOINT
              value: minio-amd64.minio.svc.cluster.local:9000
            - name: MINIO_USE_SSL
              value: "false"
            - name: HOME
              value: /tmp
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-mcp-credentials
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-mcp-credentials
                  key: MINIO_SECRET_KEY
          ports:
            - name: http
              containerPort: 8090
          # tcpSocket, not an HTTP path: the MCP endpoint (/mcp) only speaks
          # JSON-RPC, and the README documents no health-check path.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
