# buzz-db — dedicated CloudNativePG Postgres cluster for the Buzz relay.
# Single instance (homelab; no HA needed). The relay connects via the -rw Service
# at buzz-db-rw.buzz.svc.cluster.local:5432. Credentials are in the
# buzz-db-credentials Secret (created by a SealedSecret).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-db
  namespace: buzz
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-db-credentials
  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
  monitoring:
    enablePodMonitor: false
