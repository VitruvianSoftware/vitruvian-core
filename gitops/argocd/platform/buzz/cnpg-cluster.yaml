# buzz-db — dedicated CloudNativePG Postgres cluster for the Buzz relay.
# High Availability configuration with 3 instances. The relay connects via the -rw Service
# at buzz-db-rw.buzz.svc.cluster.local:5432. Credentials are in the
# buzz-db-credentials Secret (created by a SealedSecret).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-db
  namespace: buzz
spec:
  instances: 3
  # Promote a replica instead of restarting the primary in place when the
  # primary must be updated (operator upgrades, image changes). Unset, CNPG
  # defaults to `restart`: during the operator 1.25 -> 1.30 upgrade
  # (2026-09-25) buzz-db sat in "Primary instance is being restarted without a
  # switchover" for up to ~3.5 min, while the chart-managed clusters (which set
  # switchover) paused for seconds.
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  # Spread 1-per-node across WIRED nodes only. Prevents replicas from scheduling
  # on battery-powered laptop worker nodes over WiFi where streaming replication
  # or sleep causes lag and failovers.
  affinity:
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node.ipv1337.dev/link: wired
  # buzz-db was BestEffort QoS (no requests/limits) — moved to Burstable to
  # avoid noisy-neighbor eviction, not the primary fix for the readiness-probe
  # flapping (that's the Pooler in cnpg-pooler.yaml). The first attempt at
  # this (256Mi request==limit) was sized off idle RSS alone (<30Mi observed)
  # and was too tight: buzz-db-1 (the primary) OOMKilled at 2026-07-30T18:31:56Z
  # under real connection load through the new pooler (up to 70 backend
  # connections possible, see cnpg-pooler.yaml), triggering a failover
  # cascade that reproduced the original relay 503s one layer down. 1Gi
  # matches the proven-safe sizing already used for zitadel-db (a comparable
  # dedicated CNPG cluster) rather than re-tuning tight a second time.
  # Memory request==limit (no OOM/evict) and NO cpu limit — a cpu
  # limit==request caused CFS throttling that SIGTERM'd a recovering replica
  # in zitadel-db/grafana-db (2026-06-13), so this mirrors that established
  # pattern.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-db-credentials
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      wal_sender_timeout: "600s"
      wal_receiver_timeout: "600s"
      wal_keep_size: "4GB"
      # DDL/DML audit trail. Default 'none' meant the 2026-08-03 migration-26
      # incident (relay startup DDL committed against prod outside a recorded
      # migration) left the actual successful statements unlogged — only the
      # later failing retries showed up, since 'none' only logs errors. 'mod'
      # covers DDL + DML while skipping the read-heavy relay query traffic.
      log_statement: "mod"
  monitoring:
    enablePodMonitor: false
  # WAL archiving and base backups go through the Barman Cloud plugin
  # (barman-cloud.cloudnative-pg.io), which replaces the built-in
  # spec.backup.barmanObjectStore that CNPG removes in 1.31. Where and how to
  # write is the ObjectStore in cnpg-objectstore.yaml: the same bucket and
  # server path as before (s3://buzz-db-backups/buzz-db), so the backups and
  # WAL already there stay part of one history. Retention (7d) moved there
  # too; the replica target moved to the ScheduledBackup. Switched 2026-09-26.
  # Adding the plugin injects its sidecar, so CNPG rolls the instances once
  # (switchover, see primaryUpdateMethod above).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # CNPG defaults this to true; stating it keeps Argo CD's diff clean
      # (without it buzz sat OutOfSync on the defaulted field).
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: buzz-db-backups
