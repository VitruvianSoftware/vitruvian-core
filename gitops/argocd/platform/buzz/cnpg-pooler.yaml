# buzz-db-pooler-rw — CNPG PgBouncer Pooler in front of buzz-db-rw.
#
# Why: 3 buzz relay pods each open their own client-side pool directly against
# buzz-db-rw with no explicit pool size, so each inherits a small library
# default. Any modest concurrency burst exhausts that thin pool and the relay
# starts returning "pool timed out waiting for an open connection", which trips
# the readiness probe (see the 2026-07-30 relay stabilization thread). PgBouncer
# absorbs bursts in front of Postgres instead of each pod fending for itself.
#
# poolMode session (the CNPG/PgBouncer default) is intentional, not an
# oversight: transaction pooling breaks LISTEN/NOTIFY and named prepared
# statements, and a Nostr relay's realtime subscription fan-out plausibly
# depends on LISTEN/NOTIFY. Revisit only after confirming the relay doesn't
# rely on either.
#
# No authQuery/authQuerySecret is set, so CNPG wires PgBouncer to buzz-db
# automatically (same app user/secret the Cluster already bootstraps).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: buzz-db-pooler-rw
  namespace: buzz
spec:
  cluster:
    name: buzz-db
  type: rw
  instances: 2
  pgbouncer:
    poolMode: session
    parameters:
      # Headroom for 3 relay replicas' client connections into PgBouncer (3 pods x 50 = 150).
      max_client_conn: "250"
      # Backend connections PgBouncer keeps open to buzz-db-rw, per
      # user/db pair, PER POOLER INSTANCE (2 instances -> up to 240 regular + 40 reserve).
      # In session mode a backend is held for the client's whole session,
      # not released between queries, so this must cover the relay's
      # steady-state demand, not just its query concurrency: the relay
      # (BUZZ_DB_POOL_SIZE=50/pod x 3 pods) wants up to 150
      # persistent DB sessions at once. 120/instance gives ample headroom for
      # unbalanced Service routing (or single-instance pooler maintenance) so all
      # 150 relay connections can be served without blocking or queue timeouts.
      # 240 regular + 40 reserve stays safely under CNPG's max_connections (300).
      default_pool_size: "120"
      reserve_pool_size: "20"
      # Prevent hourly connection churn. PgBouncer's default server_lifetime (3600s)
      # severs backend connections under deadpool, triggering pool timeouts and 503
      # readiness flaps. 24h lifetime + 30m idle timeout ensures stable connections.
      server_lifetime: "86400"
      server_idle_timeout: "1800"
  monitoring:
    enablePodMonitor: false
  template:
    metadata:
      labels:
        cnpg.io/poolerName: buzz-db-pooler-rw
    spec:
      containers: []
      nodeSelector:
        node.ipv1337.dev/link: wired
