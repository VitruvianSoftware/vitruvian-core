# buzz DNS — external endpoint published via external-dns's crd source. A PROXIED
# CNAME buzz.ipv1337.dev -> <tunnel>.cfargotunnel.com routes the hostname through
# Cloudflare's edge into the tunnel. Explicit CNAME because the gateway-httproute
# source would instead publish the internal Gateway LB IP.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: buzz-tunnel
  namespace: buzz
  annotations:
    external-dns.alpha.kubernetes.io/sync-enabled: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  endpoints:
    - dnsName: buzz.ipv1337.dev
      recordType: CNAME
      recordTTL: 1
      targets:
        - 1f7b9704-bb66-41f4-966f-5bb722e3c10e.cfargotunnel.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
