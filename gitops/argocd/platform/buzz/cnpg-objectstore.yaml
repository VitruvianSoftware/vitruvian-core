# Where buzz-db's Barman Cloud plugin writes WAL and base backups. Same bucket
# and endpoint as the built-in config it replaced, so the history continues.
# Credentials are buzz-db's own MinIO login (buzz-db-backup, which can reach
# only this bucket), not the root user the built-in config used.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: buzz-db-backups
  namespace: buzz
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://buzz-db-backups/
    endpointURL: http://minio-amd64.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: buzz-db-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: buzz-db-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 1
    data:
      compression: gzip
      jobs: 2
