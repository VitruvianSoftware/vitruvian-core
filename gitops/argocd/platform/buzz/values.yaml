# Helm values for the buzz Application (gitops/argocd/applications/buzz.yaml),
# extracted out of that Application's inline `helm.values` block so
# argocd-image-updater's git write-back has a real file to patch
# (`image.tag`/digest) — it can't target a string embedded in an Application
# manifest. Referenced via the `$values` source ref in buzz.yaml; excluded
# from source 2's directory-recurse render (`directory.exclude`) so it isn't
# also applied as a raw manifest.
image:
  tag: "main@sha256:1120aa3fa8b57b243de35f309255870ba3520726ff2490f0d494bfb16dcf9c79"
  repository: ghcr.io/block/buzz
relayUrl: wss://buzz.ipv1337.dev
ownerPubkey: "d6a7b951e82471bc01094ba399a484e48b66d2b208cc3261ae6365b8b7d90814"
replicaCount: 3
secrets:
  existingSecret: buzz-secrets
relay:
  requireRelayMembership: false
  requireAuthToken: true
  # Explicit DB/Redis pool sizing for 3 replicas (BUZZ_DB_POOL_SIZE=50,
  # BUZZ_REDIS_POOL_SIZE=32 per pod). With cnpg-cluster.yaml setting
  # max_connections=300, 3 pods x 50 = 150 Postgres connections leaves ample
  # headroom for replication, monitoring, and pooler connections. 50/pod
  # prevents client-side pool exhaustion on deadpool Pool::get() which
  # previously caused recurring 503 readiness probe ping timeouts when background
  # workers (admin outbox, reminder scheduler, ephemeral reaper, lease reapers)
  # held connections simultaneously. Redis pool is 32/pod.
  extraEnv:
  - name: BUZZ_DB_POOL_SIZE
    value: "50"
  - name: BUZZ_REDIS_POOL_SIZE
    value: "32"
  # Default startupProbe budget (failureThreshold: 60 * periodSeconds:
  # 2 = 120s) is too tight for this homelab: the git-store A3
  # conformance probe (32-way concurrent conditional-write race
  # against MinIO) hit intermittent "socket/send failure" transport
  # drops on a routine relay restart, observed alongside a 5.6s
  # spike on MinIO's own /minio/health/live from the same node —
  # pushing total probe time past 120s and crash-looping a pod that
  # was otherwise healthy. 150 * 2s = 300s gives headroom for a
  # couple of slow rounds without masking a genuinely stuck probe.
  startupProbe:
    failureThreshold: 150
  # Tune readinessProbe to prevent transient pool-acquisition pauses from triggering
  # spurious Unhealthy events and pulling pods from endpoints (chart defaults to
  # periodSeconds: 5, failureThreshold: 3, timeoutSeconds: 3). 10s period and 4 misses
  # (40s sustained failure budget) gives deadpool and background workers time to cycle
  # connections without causing probe flapping.
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 4
    timeoutSeconds: 5
  nodeSelector:
    node.ipv1337.dev/link: wired
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: buzz
        app.kubernetes.io/name: buzz
        app.kubernetes.io/component: relay
pairingRelay:
  enabled: true
  url: "wss://buzz.ipv1337.dev/pair"
# Chart-managed HTTPRoute pointing at the homelab platform Gateway.
httproute:
  enabled: true
  hostnames:
  - buzz.ipv1337.dev
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: platform
    namespace: envoy-gateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /pair
    backendRefs:
    - group: ""
      kind: Service
      name: buzz-pairing
      port: 5000
      weight: 1
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: buzz
      port: 3000
      weight: 1
# Redis: use the dedicated HA Redis cluster from the platform layer.
# NOTE: with secrets.existingSecret set (below), the chart never
# renders its own Secret, so externalRedis.url is NOT actually
# wired into REDIS_URL — it's documentation of intent only. The
# real value lives in the buzz-secrets SealedSecret and must be
# kept in sync with this by hand.
redis:
  enabled: false
externalRedis:
  url: "redis://buzz-valkey-primary.buzz.svc.cluster.local:6379"
# S3: use the existing homelab MinIO cluster. Credentials are in
# buzz-secrets (BUZZ_S3_ACCESS_KEY / BUZZ_S3_SECRET_KEY).
s3:
  endpoint: http://minio-amd64.minio.svc.cluster.local:9000
  bucket: buzz-media
# This cluster's Prometheus is the community prometheus-server
# chart, not kube-prometheus-stack — there is no Prometheus
# Operator to reconcile ServiceMonitor CRDs, so serviceMonitor
# (below) is inert (kept for forward-compat if that ever changes).
# Prometheus discovers scrape targets via Service annotations
# instead (kubernetes-service-endpoints job), hence these.
service:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9102"
    prometheus.io/path: "/metrics"
serviceMonitor:
  enabled: true
# Git scratch volume: disabled (emptyDir) for multi-replica HA.
# The chart docs confirm git state is S3-backed; the PVC is pure
# scratch and its RWO nodeAffinity prevents cross-node scheduling.
persistence:
  git:
    enabled: false
