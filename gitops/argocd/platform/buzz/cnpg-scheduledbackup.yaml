# Nightly base backup of buzz-db to MinIO (s3://buzz-db-backups/), matching
# zitadel-db / grafana-db / cnpg-cluster. Continuous WAL archiving is set on
# the Cluster (cnpg-cluster.yaml spec.backup); this adds the daily full
# backup that recovery starts from. Retention (7d) is on the Cluster.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: buzz-db-daily-backup
  namespace: buzz
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  # Take the first backup as soon as this is created, so it is proven working
  # the same day rather than at the next midnight.
  immediate: true
  method: barmanObjectStore
  cluster:
    name: buzz-db
