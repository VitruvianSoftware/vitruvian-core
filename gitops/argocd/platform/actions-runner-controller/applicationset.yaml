# GitHub Actions Runner Controller: the controller half. It watches only the
# arc-runners namespace, where the one runner scale set lives
# (platform/actions-runners), and starts one pod per job for it.
# Spec: docs/superpowers/specs/2026-10-19-queue-runners-on-homelab-design.md
#   chart gha-runner-scale-set-controller 0.15.0 (OCI ghcr.io/actions), ns arc-system.
#   repoURL is scheme-less on purpose, as for envoy-gateway: ArgoCD resolves
#   ghcr.io/<ns> + chart as OCI natively.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: actions-runner-controller
  namespace: argocd
  labels:
    environment: actions-runner-controller
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: actions-runner-controller
      labels:
        app: actions-runner-controller
      annotations:
        # CRDs before the scale set that uses them (actions-runners, wave 2).
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform-project
      source:
        repoURL: ghcr.io/actions/actions-runner-controller-charts
        chart: gha-runner-scale-set-controller
        targetRevision: "0.15.1"
        helm:
          version: v3
          # Fixes the service account's name, arc-gha-rs-controller, which the
          # scale set's values name.
          releaseName: arc
          values: |
            replicaCount: 1
            # An extra label gives the pod a different Cilium security identity.
            # The controller's own labels plus its service account make identity
            # 16648, and on 2026-10-20 a pod with that identity got no DNS answers
            # on any node (tested on fedora and nuc9i5): its queries leave the node
            # and no reply comes back, with no drop logged and a healthy endpoint.
            # So the controller could not resolve api.github.com and no runner
            # could start. The same labels with another service account, or the
            # service account with other labels, resolve fine. The cause in
            # Cilium is not found; this label is the workaround and its value is
            # meaningless. It was applied by hand during the incident; this makes
            # it permanent so a re-render cannot drop it.
            podLabels:
              vitruvian.dev/cilium-identity: "2"
            flags:
              # Least privilege: no cluster-wide watch for one scale set.
              watchSingleNamespace: arc-runners
            nodeSelector:
              kubernetes.io/arch: amd64
      destination:
        server: '{{.server}}'
        namespace: arc-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
