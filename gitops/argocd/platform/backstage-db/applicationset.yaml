# backstage-db — HA CloudNativePG Postgres cluster for Backstage developer portal.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-db
  namespace: argocd
  labels:
    environment: backstage-db
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: backstage-db
      labels:
        app: backstage-db
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cluster
        targetRevision: "0.7.0"
        helm:
          version: v3
          values: |
            cluster:
              instances: 3
              affinity:
                topologyKey: kubernetes.io/hostname
                nodeSelector:
                  node.ipv1337.dev/link: wired
              inheritedMetadata:
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9187"
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 1Gi
              storage:
                size: 5Gi
                storageClass: local-path
              postgresql:
                parameters:
                  wal_sender_timeout: "600s"
                  wal_keep_size: "1GB"
              enableSuperuserAccess: true
              initdb:
                database: backstage
                owner: backstage
                secret:
                  name: backstage-db-app-credentials
      destination:
        server: '{{.server}}'
        namespace: backstage
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          jsonPointers:
            - /spec/backup/barmanObjectStore/wal/encryption
            - /spec/backup/barmanObjectStore/data/encryption
