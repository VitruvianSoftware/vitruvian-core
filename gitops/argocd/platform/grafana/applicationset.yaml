# grafana — Pulumi -> ArgoCD platform cutover.
# Config mirrors the LIVE release (helm get values grafana -n grafana) EXACTLY,
# EXCEPT dashboard delivery: the live release embedded ~44k lines of dashboard
# JSON inline under `dashboards:`. Here they are delivered via the Grafana
# SIDECAR from the labeled ConfigMaps generated by the sibling grafana-dashboards
# kustomization (gitops/argocd/platform/grafana-dashboards/, label
# grafana_dashboard=1) — same JSON, no duplication, no giant values file.
#
# Grafana's pod is STATELESS (persistence.enabled=false) — all state lives in the
# grafana-db CNPG Postgres (grafana.ini database section below). So the one-time
# restart from the embedded->sidecar dashboard change loses nothing.
#
# The chart 10.5.15 is the live version. adminPassword is the live homelab default
# ("admin"); GF_DATABASE_PASSWORD comes from the grafana-db-credentials secret.
# The argocd gnetId dashboard (14191) the live release downloaded is dropped here
# (needs pod egress to grafana.com); re-add as a local JSON ConfigMap if wanted.
#
# CUTOVER: only after the grafana-dashboards ConfigMaps exist. Then disable
# grafana_enabled (+ grafana_ha_enabled, grafana_db_backups_enabled, cnpg_enabled)
# in the dev-local stack and `pulumi up` so Pulumi releases the grafana + grafana-db
# + cnpg releases (retainOnDelete) as ArgoCD takes them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana
  namespace: argocd
  labels:
    environment: grafana
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: grafana
      labels:
        app: grafana
      annotations:
        # After its datasources (prometheus/tempo) and its DB (grafana-db) exist.
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform-project
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: grafana
        targetRevision: "10.5.15"
        helm:
          version: v3
          values: |
            replicas: 2
            adminPassword: admin
            persistence:
              enabled: false
            initChownData:
              enabled: false
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: grafana
                    topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              minAvailable: 1
            livenessProbe:
              initialDelaySeconds: 120
              timeoutSeconds: 30
            readinessProbe:
              initialDelaySeconds: 120
              timeoutSeconds: 30
            # Postgres session/state DB — the grafana-db CNPG cluster (rw service).
            grafana.ini:
              database:
                type: postgres
                host: grafana-db-cluster-rw:5432
                name: grafana
                user: grafana
            envValueFrom:
              GF_DATABASE_PASSWORD:
                secretKeyRef:
                  name: grafana-db-credentials
                  key: password
            datasources:
              datasources.yaml:
                apiVersion: 1
                datasources:
                  - name: Tempo
                    type: tempo
                    uid: Tempo
                    access: proxy
                    isDefault: false
                    url: http://tempo.opentelemetry.svc.cluster.local:3200
                  - name: Prometheus-Data
                    type: prometheus
                    uid: Prometheus-Data
                    access: proxy
                    isDefault: true
                    url: http://prometheus-server.monitoring.svc.cluster.local:80
                  - name: Prometheus-Fallback-1
                    type: prometheus
                    uid: Prometheus
                    access: proxy
                    isDefault: false
                    url: http://prometheus-server.monitoring.svc.cluster.local:80
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-cloudflare
                external-dns.alpha.kubernetes.io/sync-enabled: "true"
              hosts:
                - grafana.lab.ipv1337.dev
              tls:
                - hosts:
                    - grafana.lab.ipv1337.dev
                  secretName: grafana-tls
            # Dashboards via sidecar from the grafana-dashboards ConfigMaps
            # (label grafana_dashboard=1) instead of the live embedded values.
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
                searchNamespace: grafana
                folder: /tmp/dashboards
                provider:
                  foldersFromFilesStructure: false
      destination:
        server: '{{.server}}'
        namespace: grafana
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
