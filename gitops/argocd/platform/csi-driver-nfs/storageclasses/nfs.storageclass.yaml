# `nfs` — live workload data on the NAS share /volume1/k8s. Off-node + RWX-capable
# (not node-pinned like local-path). reclaimPolicy=Delete (dynamic app volumes).
# NOT the cluster default — opt-in via storageClassName: nfs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
provisioner: nfs.csi.k8s.io
parameters:
  # NAS LAN IP, NOT the Tailscale IP: the NAS's Tailscale package runs in
  # userspace mode and masquerades inbound tailnet NFS, so the export rule never
  # matches a 100.x source. Nodes reach the NAS over the LAN (192.168.0.0/16 is
  # in the export). Requires nodes on the LAN — true for this homelab.
  server: "192.168.86.200"
  share: /volume1/k8s
  # Isolate each PVC into its own subdir on the share.
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}/${pv.metadata.name}
  mountPermissions: "0775"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - hard
  - nconnect=4
  - timeo=600
  - retrans=2
  - noatime
  - _netdev
