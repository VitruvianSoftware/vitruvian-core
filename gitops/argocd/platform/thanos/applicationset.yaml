#
# thanos -- the HA query/dedup + durable-storage layer for the Prometheus->Thanos
# migration (docs/archive/design/prometheus-thanos-ha.md). PHASE 1a: deploy Query + Store
# Gateway + Compactor ONLY. This is purely ADDITIVE -- it does not touch the live
# single Prometheus. The Store Gateway / Compactor read the (currently empty)
# `thanos` MinIO bucket (Phase 0); the Querier already dedups, but has no sidecars
# to fan out to until Phase 1b converts Prometheus to 2 replicas + sidecars. The
# `static` sidecar endpoint below is therefore intentionally unresolved in 1a (the
# Querier tolerates a store with zero resolved endpoints) and goes live in 1b.
#
# Chart: thanos-community/helm-charts (NOT bitnami/thanos -- bitnami's 2026 images
# moved to a paid/legacy registry and the chart is unmaintained; thanos-community
# defaults to the official quay.io/thanos/thanos images). Scheme-less OCI repoURL,
# same convention as the envoy-gateway appset.
#
# Object storage creds: the `thanos-objstore-scoped` SealedSecret (ns monitoring,
# key objstore.yml): MinIO user `thanos`, limited to the thanos bucket. It
# replaced the root-user `thanos-objstore-creds` of Phase 1a on 2026-09-26.
# createSecret:false so the chart
# consumes it instead of minting its own. Compactor is a SINGLETON (replicaCount 1)
# -- it must be the only writer to the bucket; never scale it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos
  namespace: argocd
  labels:
    environment: monitoring
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: thanos
      labels:
        app: thanos
      annotations:
        # Peer of the prometheus datastore (wave 0); reads the thanos bucket and
        # (from 1b) the Prometheus sidecars.
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: ghcr.io/thanos-community/helm-charts
        chart: thanos
        targetRevision: "0.47.1"
        helm:
          version: v3
          values: |
            global:
              image:
                registry: quay.io
                repository: thanos/thanos
                tag: "v0.39.2"
              # Consume the existing SealedSecret; do NOT let the chart create one.
              objstore:
                createSecret: false
                secretName: thanos-objstore-scoped
                secretKey: objstore.yml
              # The chart's built-in Thanos alert rules render a PrometheusRule CRD,
              # which requires the Prometheus Operator. This cluster runs the PLAIN
              # prometheus chart (no operator / no PrometheusRule CRD), so the
              # resource would fail to apply -- disable it. (serviceMonitor is already
              # disabled by chart default for the same reason.) Thanos alerting can be
              # added later as plain rules in the prometheus appset's serverFiles.
              thanosRules:
                enabled: false
            # ---- Querier: HA, dedup on the Prometheus per-replica label ----
            query:
              enabled: true
              replicaCount: 2
              replicaLabels:
                - replica
              endpoints:
                # Auto-build dnssrv endpoints for the in-chart Store Gateway.
                autogen:
                  enabled: true
                # The Prometheus Thanos sidecars, discovered via the chart's
                # prometheus-server-headless Service (gRPC 10901, enabled by
                # server.statefulSet.headless.gRPC in the prometheus appset, Phase
                # 1b). The _grpc._tcp SRV name requires that gRPC port; the Querier
                # tolerates zero resolved endpoints before 1b lands.
                static:
                  - dnssrv+_grpc._tcp.prometheus-server-headless.monitoring.svc.cluster.local
              # Per-query guardrails: the Querier must refuse a query it cannot
              # serve instead of being killed by it. A refused query fails with a
              # clear "limit exceeded" error on one panel; a killed Querier takes
              # the metrics read path down for everyone.
              #
              # What happened on 2026-10-10: the ci-pipelines dashboard was left
              # open on auto-refresh. One panel ("Slowest steps") selects
              # cicd_duration_seconds_bucket{ci_span_type="step"}, about 86k
              # series, three times in one expression. Measured cost is about
              # 5.5 KB of Querier memory per series per select, so one run of
              # that panel needs well over 1 GB against a 2Gi limit, and the
              # dashboard sends about 11 queries at once. Both Queriers were
              # OOM-killed 56 times in 3.5 hours and took a sidecar and a Store
              # Gateway with them. The 300k series cap set after 2026-09-29 never
              # applied: it is counted per select, and each select was far below it.
              #
              # --store.limits.request-series=50000 (per select). Above every
              # other select the committed dashboards make (the next largest is
              # under 18k) and below the 86k step select, which is now refused.
              # Keep it BELOW the per-store cap (150k on the Store Gateway and on
              # the Prometheus sidecars), so the Querier is the one that refuses.
              #
              # Known limitation, not fixed here: the lower cap does not stop a
              # store from dropping out of a query. The Store Gateway adds up
              # its series cap across every block it reads, so it refuses long
              # selects well under 150k series (a 38k-series, 24h select was
              # refused with "limit 150000 violated (got 189981)"). Partial
              # response is on, so that refusal reaches the panel as a warning,
              # not an error. Data older than what the sidecars hold (about 9.5
              # days) can therefore come back incomplete with only a warning.
              #
              # --store.limits.request-samples=12000000 (per select). A series cap
              # cannot see the time range: a few thousand series over 30 days
              # is as heavy as many series over an hour. Thanos counts this as
              # 120 samples per chunk of data it reads, so this allows about
              # 100,000 chunks per select. At the 1m scrape interval one chunk
              # is about 2 hours of one series from one Prometheus replica. A
              # select that reads more than that is refused, whatever its
              # series count.
              #
              # --query.max-concurrent=4 (was 8). Fewer queries hold memory at
              # the same time; the rest wait in line instead of piling on. Four
              # selects at the series cap come to about 1.1 GB at 5.5 KB a
              # series, which fits under the limit; eight did not.
              #
              # --enable-auto-gomemlimit. Sets the Go soft memory limit from the
              # container memory limit (0.9 of it by default, so about 1.8Gi of
              # 2Gi). Without it Go has no limit and lets the heap double before
              # collecting, so it runs past 2Gi while still holding garbage and
              # the kernel kills the process. With it the collector runs harder
              # as the limit gets close. It is a soft limit: it buys headroom, it
              # does not make an oversized query fit, which is what the caps are
              # for.
              #
              # --grpc.proxy-strategy=lazy. The two caps above are checked as
              # series are handed to the query engine. By default ("eager") the
              # Querier first reads every store's whole answer into memory, so
              # the caps fired too late: on 2026-10-10 one 7-day select held
              # 1.5 GB before it was refused, and a panel that runs two at once
              # killed the Querier. With lazy it holds at most 20 answers per
              # store at a time and refuses as soon as a cap is passed.
              # The flag is hidden upstream (--help does not show it). If a
              # later version drops it the Querier will not start, which is the
              # cue to revisit this line.
              # Before upgrading Thanos: from v0.41.0 stores send series in
              # batches, and in v0.42.4 the limiter does not count batched
              # messages, so these caps would silently stop applying. Do not
              # upgrade past v0.40 without re-testing the caps (issue #2609
              # tracks the upgrade).
              #
              # Accepted consequences, until issue #2606 cuts that metric down
              # (only then can the caps be raised):
              #  - the "Slowest steps" panel shows a limit error at any range;
              #  - the samples cap also refuses the other panels built on the
              #    cicd_duration_seconds histogram at long ranges. By the chunk
              #    arithmetic above the ceiling is roughly 12,000 series at 6h,
              #    4,000 at 24h and 600 at 7d, and that dashboard opens at 7d
              #    on selects of 5k to 15k series. Those selects would need
              #    several GB at 7d, so they were never servable in 2Gi; they
              #    now fail with an error instead of killing the Querier.
              #
              # Overriding extraArgs replaces the chart default list, so
              # --log.level is restated.
              extraArgs:
                - --log.level=info
                - --enable-auto-gomemlimit
                - --query.max-concurrent=4
                - --store.limits.request-series=50000
                - --store.limits.request-samples=12000000
                - --grpc.proxy-strategy=lazy
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
            # ---- Store Gateway: serves historical blocks from MinIO ----
            storegateway:
              enabled: true
              # HA: 2 replicas so a node loss never blocks historical (object-store)
              # queries. Store Gateway is read-only over the bucket (safe to run >1,
              # unlike the Compactor); the Querier autogen-discovers both via DNS-SRV
              # and load-balances. Each gets its own local index-cache PVC.
              replicaCount: 2
              persistence:
                enabled: true
                size: 5Gi
                storageClass: local-path
              # Per-request series cap (see the Querier note). 150k sits above the
              # biggest single metric (cicd_duration_seconds_bucket, ~95k series on
              # 2026-09-29) and well below the ~640k-series all-metrics select that
              # OOMed this tier.
              extraArgs:
                - --store.limits.request-series=150000
                # Go collects before the kernel kills at 2Gi (see the Querier note).
                - --enable-auto-gomemlimit
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 2Gi
            # ---- Compactor: SINGLETON (only writer to the bucket) ----
            compactor:
              enabled: true
              replicaCount: 1
              # Phase 3: retention/downsampling tuning. Downsampling is on by default,
              # so the Compactor produces 5m and 1h resolutions; these set how long
              # each is kept in MinIO. Raw is the disk driver (full-resolution blocks)
              # -> bounded to 15d for the homelab; downsampled data is tiny, so 5m/1h
              # keep long trend history cheaply. An empty value would disable retention
              # for that resolution (keep forever). Tune up if MinIO has room.
              retention:
                resolutionRaw: 15d
                resolution5m: 90d
                resolution1h: 365d
              persistence:
                enabled: true
                size: 10Gi
                storageClass: local-path
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
            # ---- Components we explicitly do NOT want ----
            # receive defaults to TRUE in this chart -- must disable.
            receive:
              enabled: false
            ruler:
              enabled: false
            queryFrontend:
              enabled: false
            bucket:
              enabled: false
            rustfs:
              enabled: false
            kube-prometheus-stack:
              enabled: false
      destination:
        server: '{{.server}}'
        namespace: monitoring
      # The chart's StatefulSets (compactor, storegateway) carry volumeClaimTemplates;
      # the k8s API injects defaults the chart doesn't render (apiVersion/kind,
      # spec.volumeMode=Filesystem, status) so ArgoCD reports a permanent OutOfSync
      # even though sync Succeeds and the app is Healthy -- and selfHeal then re-syncs
      # (a no-op) every reconcile. volumeClaimTemplates are immutable on an existing
      # StatefulSet anyway, so ignore that subtree to keep the app cleanly Synced and
      # stop the churn. (Storage size changes still require a manual STS recreate.)
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
