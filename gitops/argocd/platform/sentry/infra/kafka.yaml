# sentry-kafka — single-node Kafka KRaft cluster for Sentry event ingestion.
# Lean KRaft mode replaces bundled Bitnami Zookeeper/Kafka without operator CRDs.
# Pinned to wired amd64 hosts with ample memory (fedora, nuc9i9).
apiVersion: v1
kind: Service
metadata:
  name: sentry-kafka
  namespace: sentry
  labels:
    app.kubernetes.io/name: sentry-kafka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentry-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentry-kafka
  namespace: sentry
  labels:
    app.kubernetes.io/name: sentry-kafka
spec:
  serviceName: sentry-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentry-kafka
    spec:
      securityContext:
        fsGroup: 1000
      nodeSelector:
        node.ipv1337.dev/link: wired
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - fedora
                      - nuc9i9
      containers:
        - name: kafka
          image: apache/kafka:3.9.2
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://sentry-kafka.sentry.svc.cluster.local:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: CLUSTER_ID
              value: "4L622nShTWWkrFuATAuUWA"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "52428800"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "72"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "5368709120"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-Xmx1G -Xms1G"
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
