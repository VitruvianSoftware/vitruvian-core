# PUBLIC Sentry route — sentry-ingest.ipv1337.dev, reached through Cloudflare Tunnel.
# Restricts public traffic strictly to Sentry Relay envelope and event store paths
# (/api/<project_id>/envelope/, store, security, minidump) for POST and OPTIONS methods.
# Project IDs are non-zero positive integers ([1-9][0-9]*), strictly excluding /api/0/.
# All other endpoints (UI dashboard, /api/0/ REST API, administrative endpoints)
# return 404 at Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sentry-relay-public
  namespace: sentry
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - sentry-ingest.ipv1337.dev
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: ^/api/[1-9][0-9]*/(envelope|store|security|minidump)/?$
          method: POST
        - path:
            type: RegularExpression
            value: ^/api/[1-9][0-9]*/(envelope|store|security|minidump)/?$
          method: OPTIONS
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-relay
          port: 3000
          weight: 1
