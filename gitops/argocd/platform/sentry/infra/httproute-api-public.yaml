# PUBLIC Sentry REST API — sentry-api.ipv1337.dev, reached through Cloudflare Tunnel.
# Exists so the Sentry MCP server (@sentry/mcp-server, SENTRY_HOST=sentry-api.ipv1337.dev)
# works off-tailnet, e.g. from cloud agent sessions.
#
# Only the token-authenticated REST API (/api/0/) is routed. The web UI, login pages,
# static assets and every other path stay on sentry.lab.ipv1337.dev (tailnet only) and
# return 404 here. /api/0/relays/ (Relay registration) is explicitly not forwarded:
# a rule with no backendRefs gets a Gateway error response, and it is more specific than
# the /api/0/ prefix, so it wins. The access-control boundary is the Sentry auth token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sentry-api-public
  namespace: sentry
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - sentry-api.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/0/relays
    - matches:
        - path:
            type: PathPrefix
            value: /api/0/
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-web
          port: 9000
          weight: 1
