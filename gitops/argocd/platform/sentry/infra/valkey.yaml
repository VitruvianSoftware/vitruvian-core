# sentry-valkey — dedicated Valkey cluster for self-hosted Sentry.
# Deploys a 3-replica HA Valkey cluster using the Valkey Operator.
apiVersion: cache.keiailab.io/v1alpha1
kind: Valkey
metadata:
  name: sentry-valkey
  namespace: sentry
spec:
  mode: Replication
  replicas: 3
  autoFailover: true
  version:
    version: "7.2.5"
  auth:
    enabled: true
    passwordSecretRef:
      name: sentry-valkey-auth
      key: password
  monitoring:
    enabled: true
  persistence:
    mode: None
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  pod:
    nodeSelector:
      node.ipv1337.dev/link: wired
      kubernetes.io/arch: amd64
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: sentry-valkey
            app.kubernetes.io/name: valkey
