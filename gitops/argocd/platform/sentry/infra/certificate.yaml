# TLS for the internal Sentry dashboard hostname, served by the platform Gateway's
# https-sentry listener (envoy-gateway/gateway/gateway.yaml). Same issuer as the
# lab-internal certificates (DNS-01 via Cloudflare, so it works for a name that
# only resolves to a private IP). The ReferenceGrant lets the Gateway in
# envoy-gateway-system read the resulting Secret in this namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sentry-tls
  namespace: sentry
spec:
  secretName: sentry-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  dnsNames:
    - sentry.lab.ipv1337.dev
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-tls
  namespace: sentry
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: sentry-tls
