# sentry-db — dedicated CloudNativePG Postgres cluster for self-hosted Sentry.
# High Availability configuration with 3 instances. Sentry connects via the -rw Service
# at sentry-db-rw.sentry.svc.cluster.local:5432. Credentials are in the
# sentry-db-credentials Secret (created by a SealedSecret).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sentry-db
  namespace: sentry
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node.ipv1337.dev/link: wired
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: sentry
      owner: sentry
      secret:
        name: sentry-db-credentials
      postInitTemplateSQL:
        - "CREATE EXTENSION IF NOT EXISTS citext;"
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS citext;"
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      wal_sender_timeout: "600s"
      wal_receiver_timeout: "600s"
      wal_keep_size: "4GB"
      log_statement: "mod"
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: sentry-db-backups
