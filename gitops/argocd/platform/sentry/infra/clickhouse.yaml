# sentry-clickhouse — single-node ClickHouse server for Sentry Snuba and event storage.
# Chart 36.0.0 removed bundled ClickHouse, requiring externalClickhouse. Pinned to
# nuc9i9 (wired AMD64 host with 770+ GiB free NVMe storage).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-clickhouse-config
  namespace: sentry
data:
  homelab.xml: |
    <clickhouse>
        <!-- Memory cap at 6 GiB -->
        <max_server_memory_usage>6442450944</max_server_memory_usage>
        <!-- Disable aggressive system logs that cause disk runaway on local-path -->
        <trace_log remove="1"/>
        <text_log remove="1"/>
        <processors_profile_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <!-- 3-day TTL on query and part logs -->
        <query_log>
            <ttl>event_date + INTERVAL 3 DAY</ttl>
        </query_log>
        <part_log>
            <ttl>event_date + INTERVAL 3 DAY</ttl>
        </part_log>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: sentry-clickhouse
  namespace: sentry
  labels:
    app.kubernetes.io/name: sentry-clickhouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentry-clickhouse
  ports:
    - name: tcp
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentry-clickhouse
  namespace: sentry
  labels:
    app.kubernetes.io/name: sentry-clickhouse
spec:
  serviceName: sentry-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentry-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentry-clickhouse
    spec:
      securityContext:
        fsGroup: 101
      nodeSelector:
        kubernetes.io/hostname: nuc9i9
        kubernetes.io/arch: amd64
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8-alpine
          env:
            - name: CLICKHOUSE_USER
              value: "sentry"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentry-secrets
                  key: clickhouse-password
            - name: CLICKHOUSE_DB
              value: "default"
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: tcp
              containerPort: 9000
            - name: http
              containerPort: 8123
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/homelab.xml
              subPath: homelab.xml
      volumes:
        - name: config
          configMap:
            name: sentry-clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
