#
# Where sentry-db's Barman Cloud plugin writes WAL and base backups.
# Annotated with sync-wave: "-1" so ObjectStore exists before Cluster attempts
# to reconcile Barman backup plugin.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: sentry-db-backups
  namespace: sentry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://sentry-db-backups/cnpg/
    endpointURL: http://minio-amd64.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: sentry-db-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: sentry-db-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 1
    data:
      compression: gzip
      jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sentry-db-daily-backup
  namespace: sentry
spec:
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
  cluster:
    name: sentry-db
