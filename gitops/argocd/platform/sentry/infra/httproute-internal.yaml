# INTERNAL Sentry route — the web UI and dashboard on sentry.lab.ipv1337.dev.
# Attached to platform Gateway's https-sentry listener (certificate.yaml + gateway.yaml).
# Only reachable from LAN or Tailscale.
# Routes event ingestion to Sentry Relay, /api/0 administrative APIs to Sentry Web,
# and all other frontend traffic to Sentry Web.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sentry-dashboard
  namespace: sentry
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
      sectionName: https-sentry
  hostnames:
    - sentry.lab.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/store
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-relay
          port: 3000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/0/relays
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-relay
          port: 3000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/0
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-web
          port: 9000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-relay
          port: 3000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sentry-web
          port: 9000
          weight: 1
