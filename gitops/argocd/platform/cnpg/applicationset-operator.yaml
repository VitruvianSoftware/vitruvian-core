apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cnpg-operator
  namespace: argocd
  labels:
    environment: cnpg
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: cnpg-operator
      labels:
        app: cnpg
      annotations:
        # Operators install before workloads (CNPG clusters / grafana-db).
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: platform-project
      source:
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        # Pinned to the LIVE release (helm list: cloudnative-pg-0.23.2).
        targetRevision: "0.23.2"
        helm:
          version: v3
          # Mirror the live Pulumi values exactly so adoption is zero-churn.
          # Webhook serving cert is minted by cert-manager.
          #
          # The chart owns its CRDs (crds.create: true, since 2026-09-25), so a
          # chart upgrade brings CRDs matching its operator. They used to be a
          # vendored copy applied by the platform-crds app and hand-updated on
          # every upgrade -- the gap that broke the external-secrets 0.20.4 bump
          # (#2483). These CRDs back EVERY database on the cluster: deleting one
          # deletes every Cluster/Backup/Pooler of its kind.
          #  - Argo CD never deletes CRDs on app deletion (hardcoded !kube.IsCRD
          #    in controller/appcontroller.go) and honours the chart's
          #    helm.sh/resource-policy: keep; the live CRDs also carry
          #    Prune=false,Delete=false (#2488, see ignoreDifferences below).
          #  - A PRUNE would still remove them if they vanished from the render,
          #    so never set create back to false: the conformance check
          #    "Chart-owned CRDs" fails the build if you do.
          values: |
            replicaCount: 2
            config:
              clusterWide: true
            crds:
              create: true
            hostNetwork: true
            nodeSelector:
              node.ipv1337.dev/link: wired
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: cloudnative-pg
                    topologyKey: kubernetes.io/hostname
            metrics:
              enabled: true
              serviceMonitor:
                enabled: false
            podAnnotations:
              prometheus.io/port: "8080"
              prometheus.io/scrape: "true"
            podSecurityContext:
              fsGroup: 65534
              runAsNonRoot: true
              runAsUser: 65534
            securityContext:
              runAsGroup: 65534
              runAsNonRoot: true
              runAsUser: 65534
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            webhook:
              certManager:
                enabled: true
              timeoutSeconds: 60
      destination:
        server: '{{.server}}'
        namespace: cnpg-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Keep the ignoreDifferences below out of self-heal too, so Argo CD
          # never strips the protective annotation it describes.
          - RespectIgnoreDifferences=true
      # The CRDs carry argocd.argoproj.io/sync-options: Prune=false,Delete=false
      # (#2488) so Argo CD can never delete them. The chart cannot render that
      # annotation, so without this the app reports them permanently OutOfSync
      # (same fix as cert-manager, #2490).
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1sync-options
