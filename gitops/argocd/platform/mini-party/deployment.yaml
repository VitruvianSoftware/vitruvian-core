# Mini Party rooms server: the socket.io relay behind the game's online play.
# The game itself is static on GitHub Pages (mini-games.vitruviansoftware.dev)
# and connects here; ALLOWED_ORIGINS admits that site and refuses others.
#
# One replica on purpose: rooms live in this process's memory, so a second
# replica would split players of one room across two servers. A restart ends
# the games in progress, which is acceptable for quick party games.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-party
  namespace: mini-party
  labels:
    app: mini-party
    app.kubernetes.io/name: mini-party
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mini-party
      app.kubernetes.io/name: mini-party
  template:
    metadata:
      labels:
        app: mini-party
        app.kubernetes.io/name: mini-party
    spec:
      automountServiceAccountToken: false
      # Keep it on the always-on servers (fedora, nuc9i5, nuc9i9), never a
      # laptop: it first landed on james-mbp16, and a laptop that sleeps or
      # leaves the network takes online rooms down with it. Same rule as
      # CoreDNS and the Actions runner listener.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mini-party
          image: ghcr.io/vitruviansoftware/mini-party:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ALLOWED_ORIGINS
              value: https://mini-games.vitruviansoftware.dev
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
