# argocd-image-updater pins the digest behind `latest` here (in a bump PR from
# image-updates/mini-party), so ArgoCD rolls out exactly the reviewed build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - dnsendpoint.yaml
  - httproute.yaml
  - service.yaml
images:
  - name: ghcr.io/vitruviansoftware/mini-party
    newName: ghcr.io/vitruviansoftware/mini-party
    newTag: latest
    digest: sha256:6318a034662dadcc7beb3c3c091f17dbf3cd46903953ad9f86794fb80a91edd5
