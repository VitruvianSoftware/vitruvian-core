# Public route for the rooms server, reached through the Cloudflare tunnel
# (cloudflared preserves the Host header; the Gateway routes on it).
# Envoy Gateway passes WebSocket upgrades through, which socket.io prefers;
# it falls back to long polling, which also works with the single replica.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mini-party
  namespace: mini-party
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - mini-games-rooms.vitruviansoftware.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mini-party
          port: 80
          weight: 1
