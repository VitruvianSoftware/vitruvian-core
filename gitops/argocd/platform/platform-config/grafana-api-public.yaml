# PUBLIC Grafana HTTP API — grafana-api.ipv1337.dev, reached through Cloudflare Tunnel.
# Exists so the Grafana MCP server (mcp-grafana, GRAFANA_URL=https://grafana-api.ipv1337.dev)
# works off-tailnet, e.g. from cloud agent sessions. Use a Viewer service-account token.
#
# Only /api/ is routed; the UI, /login and everything else stay on
# grafana.lab.ipv1337.dev (tailnet only) and get no route here.
# Requests carrying HTTP Basic credentials are NOT forwarded: the more specific
# header-matching rule has no backendRefs, so the Gateway answers it with an error.
# That keeps admin-password guessing off the public internet; only bearer
# (service-account) tokens reach Grafana, and they are the access-control boundary.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-api-public
  namespace: grafana
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - grafana-api.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
          headers:
            - type: RegularExpression
              name: Authorization
              value: "(?i)^\\s*basic\\s.*"
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 80
          weight: 1
---
# PUBLIC Grafana API DNS — grafana-api.ipv1337.dev -> Cloudflare Tunnel (proxied).
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: grafana-api-tunnel
  namespace: grafana
  annotations:
    external-dns.alpha.kubernetes.io/sync-enabled: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  endpoints:
    - dnsName: grafana-api.ipv1337.dev
      recordType: CNAME
      recordTTL: 1
      targets:
        - 1f7b9704-bb66-41f4-966f-5bb722e3c10e.cfargotunnel.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
