# cert-manager Certificates for internal .lab.ipv1337.dev platform services.
# These certificates are referenced by Gateway `platform` listeners via ReferenceGrants
# and automatically provisioned/renewed via the letsencrypt-cloudflare ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: grafana
spec:
  secretName: grafana-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  dnsNames:
    - grafana.lab.ipv1337.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pushgateway-tls
  namespace: monitoring
spec:
  secretName: pushgateway-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  dnsNames:
    - pushgateway.lab.ipv1337.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-tls
  namespace: opentelemetry
spec:
  secretName: otel-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  dnsNames:
    - otel.lab.ipv1337.dev
