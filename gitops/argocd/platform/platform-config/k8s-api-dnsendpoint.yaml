#
# Control-plane HA API endpoint — declarative DNS for `k8s-api.lab.ipv1337.dev`.
# external-dns (crd source) syncs this A record to Cloudflare so kubectl can use a
# single stable name (kubeconfig server: https://k8s-api.lab.ipv1337.dev:6443) and
# fail over across the 3 control-plane apiservers when one is down. The k3s
# apiserver serving cert already carries this name as a SAN (tls-san on all 3
# servers), so TLS validates no matter which CP answers.
#
# The 3 targets are the control-plane *tailnet* IPs (reachable over Tailscale, which
# is the intended remote-access path). The `sync-enabled` annotation satisfies
# external-dns's annotationFilter; with policy=sync + the txt registry, external-dns
# adopts the pre-existing manual record by writing its ownership TXT (A records are
# unchanged), so the cutover is non-disruptive. `targets` is kept in sync with the
# live control-plane apiservers by the k8s-api-dns-reconciler CronJob (ArgoCD ignores
# /spec/endpoints/0/targets); the values below are only the seed used on first apply.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: k8s-api
  namespace: external-dns
  annotations:
    external-dns.alpha.kubernetes.io/sync-enabled: "true"
spec:
  endpoints:
    - dnsName: k8s-api.lab.ipv1337.dev
      recordType: A
      recordTTL: 60
      targets:
        - 100.97.82.15    # fedora
        - 100.96.128.107  # nuc9i5
        - 100.86.106.117  # nuc9i9
