# cilium — CNI (Flannel + kube-proxy + MetalLB replacement) for the GKE-shaped
# migration. Chart pinned 1.17.17 (helm.cilium.io). Phase 2 of
# docs/design/cilium-gateway-api-migration.md.
#
# Rolling migration safety:
#   - The agent DaemonSet is GATED by nodeSelector cilium.ipv1337.dev/ready=true,
#     so installing this App on the still-Flannel cluster schedules ZERO agents
#     (operator + CRDs only). Each node is labeled as it is reconfigured to Cilium.
#   - ipam=kubernetes reuses the existing per-node Node.spec.podCIDR (10.42.x/24) —
#     no IPAM conflict with Flannel, pod CIDR preserved.
#   - kube-proxy-replacement needs a DIRECT API endpoint (kube-proxy is gone):
#     k8sServiceHost=k8s-api.lab.ipv1337.dev (DNS -> 3 CP tailnet IPs, Go dials all).
#   - routingMode tunnel/vxlan over devices tailscale0 (+ LAN NICs lima+/enp+/eth+
#     for L2 LB), mtu 1280 — mirrors today's Flannel-VXLAN-over-tailscale.
#   - gatewayAPI OFF — Envoy Gateway owns Gateway API; Cilium must NOT install a 2nd
#     controller over the .211 Gateway cloudflared depends on.
#   - l2announcements feature ON but no CiliumL2AnnouncementPolicy/LB-IPAM pool yet
#     (those land at the Stage-4 MetalLB cutover) -> announces nothing until then.
#   - envoy.enabled false -> embedded Envoy (gated with the agent), no un-gated DS.
#   - hubble deferred to Stage 5 (relay would be NotReady with 0 agents).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd
  labels:
    environment: cilium
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: cilium
      labels:
        app: cilium
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: platform-project
      source:
        repoURL: https://helm.cilium.io
        chart: cilium
        targetRevision: "1.17.17"
        helm:
          version: v3
          values: |
            kubeProxyReplacement: true
            k8sServiceHost: k8s-api.lab.ipv1337.dev
            k8sServicePort: 6443
            ipam:
              mode: kubernetes
            routingMode: tunnel
            tunnelProtocol: vxlan
            devices:
              - tailscale0
              - lima+
              - enp+
              - eth+
            mtu: 1280
            enableIPv4Masquerade: true
            bpf:
              masquerade: true
            ipv4NativeRoutingCIDR: 10.42.0.0/16
            l2announcements:
              enabled: true
            externalIPs:
              enabled: true
            k8sClientRateLimit:
              qps: 50
              burst: 100
            gatewayAPI:
              enabled: false
            hubble:
              enabled: false
            envoy:
              enabled: false
            operator:
              replicas: 2
              rollOutPods: true
            rollOutCiliumPods: true
            # MIGRATION GATE — agent runs only on reconfigured nodes. Removed in
            # Stage 5 (all nodes Cilium) so future nodes get Cilium by default.
            nodeSelector:
              cilium.ipv1337.dev/ready: "true"
      destination:
        server: '{{.server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
