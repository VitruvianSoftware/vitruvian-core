# cilium — CNI (Flannel + kube-proxy + MetalLB replacement) for the GKE-shaped
# migration. Chart pinned 1.17.17 (helm.cilium.io). Phase 2 of
# docs/design/cilium-gateway-api-migration.md.
#
# Cilium is live on all nodes (Flannel + kube-proxy migrated out, 2026-06-24). The
# rolling migration used a nodeSelector gate (now removed) so the agent ran only on
# reconfigured nodes; servers got --flannel-backend=none/--disable-kube-proxy in
# /etc/rancher/k3s/config.yaml, agents inherited it. Notes:
#   - ipam=kubernetes reuses the existing per-node Node.spec.podCIDR (10.42.x/24) —
#     no IPAM conflict with Flannel, pod CIDR preserved.
#   - kube-proxy-replacement needs a DIRECT API endpoint (kube-proxy is gone):
#     k8sServiceHost=k8s-api.lab.ipv1337.dev (DNS -> 3 CP tailnet IPs, Go dials all).
#   - routingMode TUNNEL (Geneve) over tailscale (#271 fix; was native): pod traffic
#     is encapsulated in node-sourced Geneve UDP between node InternalIPs (all tailnet
#     100.x) -> egresses the host stack over tailscale0, the SAME path host-net
#     transfers proved byte-clean wired-to-wired. Native routing instead bpf_redirect'd
#     raw pod frames into the tailscale0 WireGuard TUN, whose userspace TX black-holes
#     a segment on sustained transfers (#271). The earlier "NOT vxlan" note (vxlan
#     dropped Mac-Lima pod egress) was a WiFi/Lima artifact, not encap being broken.
#     Nodes still advertise pod CIDRs (auto-approved) + run tailscale --accept-routes
#     (harmless/unused under tunnel, but every node MUST --accept-routes — Fedora
#     shipped with it off, which broke cross-node). devices tailscale0 (+ lima+/enp+).
#   - gatewayAPI OFF — Envoy Gateway owns Gateway API; Cilium must NOT install a 2nd
#     controller over the .211 Gateway cloudflared depends on.
#   - l2announcements feature ON but no CiliumL2AnnouncementPolicy/LB-IPAM pool yet
#     (those land at the Stage-4 MetalLB cutover) -> announces nothing until then.
#   - envoy.enabled false -> embedded Envoy (gated with the agent), no un-gated DS.
#   - hubble enabled (relay + UI) now that all agents are up.
#   - L2/LB-IPAM feature ON but no pool/policy CR yet — MetalLB still owns the LB IPs
#     (.210/.211); MetalLB->Cilium-L2 cutover is a follow-up (they coexist fine).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd
  labels:
    environment: cilium
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: cilium
      labels:
        app: cilium
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: platform-project
      source:
        repoURL: https://helm.cilium.io
        chart: cilium
        targetRevision: "1.17.17"
        helm:
          version: v3
          values: |
            kubeProxyReplacement: true
            k8sServiceHost: k8s-api.lab.ipv1337.dev
            k8sServicePort: 6443
            ipam:
              mode: kubernetes
            # Tunnel (Geneve) over tailscale — #271 fix (was native routing). Native
            # routing bpf_redirect'd raw pod frames into the tailscale0 WireGuard TUN,
            # whose userspace TX black-holes a TCP segment on sustained transfers
            # (CNPG base-backup / WAL->MinIO stall after ~10-37MB, never retransmitted).
            # Geneve wraps pod traffic in node-sourced UDP between node InternalIPs
            # (all tailnet 100.x) -> it egresses the host stack over tailscale0, the
            # SAME path host-net transfers proved byte-clean wired-to-wired (0/6 stalls
            # vs 9/10 for the pod overlay). The earlier "NO vxlan" rationale (vxlan
            # dropped Mac-Lima pod egress) was a WiFi/Lima artifact, not encap being
            # broken — #271's wired-wired test isolated it. Pod MTU = 1280 underlay -
            # 50B Geneve = 1230 (Cilium derives it). autoDirectNodeRoutes stays off.
            routingMode: tunnel
            tunnelProtocol: geneve
            devices:
              - tailscale0
              - lima+
              - enp+
              - eno+   # nuc9's LAN NIC is eno1 — without this Cilium skips BPF-masquerade
              - eth+    # on it and nuc9 CoreDNS upstream forwards get dropped
            # Underlay (tailscale0) MTU. Cilium's GetRouteMTU subtracts the 50B Geneve
            # tunnel overhead -> pod eth0 = 1280-50 = 1230, so the encapsulated frame =
            # 1230+50 = 1280 = tailscale0 (no fragmentation). MUST be uppercase `MTU`: the
            # chart only renders the config from the uppercase MTU value; lowercase `mtu` is
            # dropped by Helm (it was a no-op -> --mtu=0 auto-detect -> pod stuck at 1280
            # with the encapsulated frame at 1330 relying on fragmentation).
            MTU: 1280
            enableIPv4Masquerade: true
            bpf:
              masquerade: true
            ipv4NativeRoutingCIDR: 10.42.0.0/16
            l2announcements:
              enabled: true
            externalIPs:
              enabled: true
            k8sClientRateLimit:
              qps: 50
              burst: 100
            gatewayAPI:
              enabled: false
            hubble:
              enabled: true
              relay:
                enabled: true
              ui:
                enabled: true
            envoy:
              enabled: false
            operator:
              replicas: 2
              rollOutPods: true
            rollOutCiliumPods: true
            # Migration nodeSelector gate REMOVED (Stage 5) — all nodes are Cilium, so
            # the agent runs everywhere by default and future nodes get Cilium with no
            # per-node label. The cilium.ipv1337.dev/ready labels on the nodes are now
            # inert and can be cleaned up.
      destination:
        server: '{{.server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
