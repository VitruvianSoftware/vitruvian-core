# The runner scale set "vitruvian-queue": merge-queue and push-to-main jobs for
# vitruvian-core, one fresh pod per job, deleted when the job ends.
# Spec: docs/superpowers/specs/2026-10-19-queue-runners-on-homelab-design.md
#   chart gha-runner-scale-set 0.15.0 (OCI ghcr.io/actions), ns arc-runners.
#
# PHASE 0: registered and idle. minRunners is 0 and no workflow names this
# runner until QUEUE_RUNNER is "on", so no pod runs. The image is the
# project-built Ubuntu 26.04 one (tools/ci-runner, built and checked by the
# ci-runner-image workflow), pinned by digest: the build of f193271ae (#4202),
# the first with a pinned rustc (#4183).
#
# Credentials: the vitruvian-arc GitHub App (repository Administration
# read/write, Metadata read, vitruvian-core only), sealed by
# `bazel run //tools/gitops:seal-arc-github-app` into
# sealed-secrets-manifests/vitruvian-arc-github-app.sealedsecret.yaml.
#
# Isolation (spec §5): the namespace enforces Pod Security "baseline" and an
# egress policy allows DNS and the internet only, never the cluster, the LAN or
# the tailnet (actions-runners-manifests). Pods get no service-account token.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: actions-runners
  namespace: argocd
  labels:
    environment: actions-runners
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: actions-runners
      labels:
        app: actions-runners
      annotations:
        # After the controller's CRDs (wave 1) and the namespace + egress
        # policy (actions-runners-manifests, wave 1).
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform-project
      source:
        repoURL: ghcr.io/actions/actions-runner-controller-charts
        chart: gha-runner-scale-set
        targetRevision: "0.15.1"
        helm:
          version: v3
          releaseName: vitruvian-queue
          values: |
            githubConfigUrl: https://github.com/VitruvianSoftware/vitruvian-core
            githubConfigSecret: vitruvian-arc-github-app
            # The runs-on label workflows name.
            runnerScaleSetName: vitruvian-queue
            minRunners: 0
            # Fits fedora (24c/64G) and nuc9i9 (16c/64G) beside what they run.
            maxRunners: 8
            controllerServiceAccount:
              namespace: arc-system
              name: arc-gha-rs-controller
            # The listener holds the long poll that tells the controller to start
            # runners: keep it on the always-on servers, not a laptop (it landed
            # on james-mbp16, on Wi-Fi, on 2026-10-20). Same rule as CoreDNS.
            listenerTemplate:
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                containers:
                  - name: listener
            template:
              spec:
                automountServiceAccountToken: false
                # nfs StorageClass mounts with 0775; fsGroup 1001 lets the
                # non-root runner user (1001) write into the shared cache PVC.
                securityContext:
                  fsGroup: 1001
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: In
                              values: [fedora, nuc9i9]
                containers:
                  - name: runner
                    image: ghcr.io/vitruviansoftware/vitruvian-ci-runner@sha256:0bb1b40b9e1f62eec01bd6e615ce6588befb36b41f3fa5a51226297e25e474b4
                    command: ["/home/runner/run.sh"]
                    volumeMounts:
                      - name: runner-cache
                        mountPath: /home/runner/.cache/bazel-repo
                        subPath: bazel-repo
                      - name: runner-cache
                        mountPath: /home/runner/.cache/bazelisk
                        subPath: bazelisk
                      - name: runner-cache
                        mountPath: /home/runner/go/pkg/mod
                        subPath: go-pkg-mod
                      - name: runner-cache
                        mountPath: /home/runner/.local/share/pnpm/store
                        subPath: pnpm-store
                    resources:
                      requests:
                        # 3500m lets all 8 maxRunners schedule across fedora (5 pods)
                        # and nuc9i9 (3 pods beside ~4.14 CPU of baseline workloads).
                        cpu: "3500m"
                        memory: 8Gi
                        # 15Gi prevents scheduler from packing runner pods onto nodes lacking free rootfs disk.
                        ephemeral-storage: 15Gi
                      limits:
                        cpu: "8"
                        memory: 16Gi
                        # 40Gi isolates runaway builds to protect sibling runner pods from node eviction.
                        ephemeral-storage: 40Gi
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1001
                      privileged: false
                      # setup-bazel runs `sudo dpkg -i`; sudo needs it.
                      allowPrivilegeEscalation: true
                volumes:
                  - name: runner-cache
                    persistentVolumeClaim:
                      claimName: vitruvian-queue-cache
      destination:
        server: '{{.server}}'
        namespace: arc-runners
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The two apps that use arc-runners sync under different parents, so
          # either may come first; actions-runners-manifests adds the labels.
          - CreateNamespace=true
          - ServerSideApply=true
