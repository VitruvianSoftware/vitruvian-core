# cnpg-cluster — Pulumi -> ArgoCD platform cutover.
# A CloudNativePG CLUSTER (Postgres) — this is the application database and
# HOLDS LIVE DATA on local-path PVCs. Values mirror the LIVE Pulumi/Helm release
# EXACTLY (verified against `helm get values cnpg-cluster -a` plus the Pulumi
# DeployCnpgCluster code: values/cnpg-cluster.yaml MERGED with the code-supplied
# cluster.initdb overrides).
#   chart cluster-0.2.1 (cloudnative-pg charts repo), namespace cnpg-cluster
#   mode=standalone, cluster.instances=3 (1 primary + 2 streaming standbys),
#   cluster.storage.size=1Gi storageClass=local-path (node-local, NOT Longhorn),
#   enableSuperuserAccess=true, superuserSecret="",
#   initdb {database=app, owner=app_user, secret.name=cnpg-initial-app-credentials},
#   monitoring.enabled=false + podMonitor.enabled=true,
#   inheritedMetadata annotation-based scrape on :9187, backups.enabled=false.
#
# DATA / CRD RETENTION (read before any cutover):
#   * The 3 instance PVCs (local-path, hostname-pinned) carry the actual Postgres
#     data and MUST be retained across the cutover — no PVC churn, no pod
#     restart. ArgoCD must ADOPT the existing Cluster CR + PVCs in place; it must
#     never delete/recreate them. Do NOT let prune touch the PVCs.
#   * The CloudNativePG CRDs (cluster.postgresql.cnpg.io et al.) are installed
#     out-of-band by Pulumi (crds/cnpg.crds.yaml, resource-policy=keep) and owned
#     by the operator Application (gitops/argocd/platform/cnpg). This chart must
#     not install or own CRDs — the `cluster` chart ships none.
#   * cnpg-initial-app-credentials Secret is created by Pulumi (and reconciled by
#     external-secrets); it is NOT templated by this chart. It must already exist
#     and survive the cutover (initdb.secret.name references it). Never prune it.
#
# CUTOVER (do NOT just merge): only after ArgoCD is bootstrapped, the platform
# root is applied, AND the cnpg-operator Application is Healthy. At cutover, set
# the cnpg cluster flag false in the dev-local stack and `pulumi up` so Pulumi
# releases ownership as ArgoCD adopts it — but the Cluster CR, PVCs, CRDs, and
# credentials Secret MUST survive. Take a fresh DB backup/snapshot first.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cnpg-cluster
  namespace: argocd
  labels:
    environment: cnpg
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: cnpg-cluster
      labels:
        app: cnpg
      annotations:
        # Workload that consumes the CNPG operator + CRDs: must sync AFTER the
        # operator (gitops/argocd/platform/cnpg, wave -1) so the Cluster CR's
        # controller and CRDs already exist. Positive wave keeps it last.
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform-project
      source:
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cluster
        # Pinned to the live release version (helm list: cluster-0.2.1).
        targetRevision: "0.2.1"
        helm:
          version: v3
          values: |
            # Faithful mirror of the LIVE merged release (values/cnpg-cluster.yaml
            # + Pulumi code overrides). Changing any of these risks a Cluster CR
            # rollout / PVC churn — keep byte-for-byte equivalent at cutover.
            mode: standalone
            cluster:
              # 3 instances (1 primary + 2 standby). The pod-overlay base-backup stall
              # (issue #271) that blocked building a 3rd replica is FIXED — Cilium moved
              # to Geneve tunnel mode (#275) and base-backups complete over the overlay
              # again (verified: grafana-db rebuilt its 3rd replica → 3/3). Restored from
              # the #272 workaround value of 2.
              instances: 3
              # Spread instances 1-per-node so a single node loss never takes the
              # whole DB down. WITHOUT this, the chart default topologyKey is
              # topology.kubernetes.io/zone — a NO-OP on these unlabelled nodes — so
              # all 3 instances co-located on fedora and a freeze killed the entire
              # DB (incident 2026-06-21). hostname mirrors grafana-db (which survived
              # 2/3). See docs/incidents/2026-06-21-fedora-freeze-cluster-cascade.md
              affinity:
                topologyKey: kubernetes.io/hostname
                # NOTE: link=wired nodeSelector reverted (issue #271). The overlay
                # base-backup stall makes relocating an existing replica impossible,
                # so keep replicas where they are (incl. WiFi nodes) until it's fixed.
              storage:
                # LIVE DATA. local-path is node-local + hostname-pinned; these
                # PVCs must be adopted in place (no resize, no class change).
                size: 1Gi
                storageClass: local-path
              inheritedMetadata:
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9187"
              # Retain more WAL on the primary so a returning OLD PRIMARY (after a
              # switchover) can pg_rewind directly from it instead of the backup
              # archive. The chart default (512MB) left cnpg-cluster-19 stranded in
              # CrashLoopBackOff for 15 days when the WAL it needed had aged out of
              # BOTH the primary and the (gap-prone) S3 archive (2026-07-20; see the
              # cnpg-old-primary rewind runbook). 4GB ≈ 256 WAL segments — ample for
              # these low-write DBs, negligible on the 465G local-path disks.
              # wal_keep_size is reloadable (SIGHUP) — no restart / PVC churn.
              postgresql:
                parameters:
                  wal_keep_size: "4GB"
              enableSuperuserAccess: true
              superuserSecret: ""
              monitoring:
                enabled: false
                podMonitor:
                  enabled: true
              # initdb is set in Pulumi code (overrides the values-file
              # placeholders); these are the resolved LIVE values. The owner
              # secret already exists out-of-band and must not be pruned.
              initdb:
                database: app
                owner: app_user
                secret:
                  name: cnpg-initial-app-credentials
            # Continuous WAL archiving + daily base backups to MinIO (R1: the app
            # DB previously had NO backup at all). Mirrors grafana-db's working
            # config. SSE disabled (MinIO has none) to avoid barman archive errors.
            backups:
              enabled: true
              provider: s3
              endpointURL: http://minio-amd64.minio.svc.cluster.local:9000
              destinationPath: s3://cnpg-cluster-backups/
              s3:
                region: us-east-1
                bucket: cnpg-cluster-backups
              # S3 creds from SealedSecret cnpg-cluster-minio-backup-creds (no
              # plaintext in git); create=false → reference the existing secret.
              secret:
                create: false
                name: cnpg-cluster-minio-backup-creds
              wal:
                compression: gzip
                encryption: ""
              data:
                compression: gzip
                encryption: ""
              scheduledBackups:
                - name: daily-backup
                  schedule: 0 0 0 * * *
                  backupOwnerReference: self
                  method: barmanObjectStore
              retentionPolicy: 7d
      destination:
        server: '{{.server}}'
        namespace: cnpg-cluster
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # CNPG Cluster CR is large/CRD-backed; CSA avoids the client-side
          # last-applied 256KB annotation failure (matches cnpg-operator appset).
          - ServerSideApply=true
          # Honor ignoreDifferences DURING sync: chart 0.2.1 renders backup
          # wal/data `encryption: null`, which CNPG rejects under SSA — drop those
          # paths from the apply so the live (absent) value is preserved.
          - RespectIgnoreDifferences=true
      # chart 0.2.1 always emits backup wal/data encryption as null (our empty
      # value); CNPG rejects null. Ignore both so the SSA sync succeeds (matches
      # grafana-db).
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          jsonPointers:
            - /spec/backup/barmanObjectStore/wal/encryption
            - /spec/backup/barmanObjectStore/data/encryption
