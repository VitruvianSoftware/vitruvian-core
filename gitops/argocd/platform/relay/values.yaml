# Live values for the Vitruvian Relay chart (apps/suites/vitruvian-relay/relay/deploy/chart).
# The digest is pinned by hand (no image updater): take a new one from the
# vitruvian-relay-image run's summary. The connector's compiled-in defaults
# must match this file (test defaults_match_relay_stack).
#
# The new relay: relay.vitruviansoftware.dev, devices and calls in Postgres
# (relay-db), no volume, access by the relay-user role, and the dashboard. One
# replica (the chart's own, with Recreate): the relay holds each computer's
# connection and each sign-in session in memory.
image:
  digest: "11156c123ccf79ced4088df992fbc36fbab3e02f@sha256:6c3af64c533b6ef08347fcd49b3618979d30b4fcf8c827a5523f1a4564a0106a"

hostname: relay.vitruviansoftware.dev

# From the zitadel-apps-relay stack's outputs (zitadel-apps-relay-apply run).
oidc:
  projectId: "398912441632687930"
  # claudeV2ClientId, geminiV2ClientId, appsClientId; add chatgptV2ClientId later
  mcpClientIds: "400571151425734985,400571151492842651,400830462458659920"
  # connectorV2ClientId
  connectorClientId: "400571151425800521"
  # dashboardClientId
  dashboardClientId: "400571151492909385"
  # appsClientId: the sign-in for apps that register themselves (Gemini)
  appsClientId: "400830462458659920"
  requiredRole: "relay-user"

# What the dashboard calls each AI app.
mcpClientLabels:
  Claude: "400571151425734985"
  Gemini: "400571151492842651"
  "Gemini (app sign-in)": "400830462458659920"

# Apps that register themselves connect at /mcp/app/<device> with only the URL.
appSignin:
  enabled: true

# The CloudNativePG cluster relay-db (gitops/argocd/platform/relay/).
database:
  enabled: true

# The old relay's /data volume is gone. Argo CD leaves the claim (Prune=false).
persistence:
  enabled: false

# Keep the relay off laptop nodes. In spike C (2026-11-12) both outages came
# while the laptop node james-mbp16 went NotReady, and the pod was there again
# on 2026-11-15. "Wired" alone isn't enough: james-mbp and james-mbp32 are wired
# laptops. So this is an allow list of the pools of the always-on nodes
# fedora, nuc9i5 and nuc9i9: a node with any other pool label, or none, is
# never used. Add a new always-on node's pool here for the relay to use it.
# Tradeoff: if all three are down, the pod waits (Pending) rather than moving
# to a laptop.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node.ipv1337.dev/link
              operator: In
              values: [wired]
            - key: pool
              operator: In
              values: [linux, nuc-worker-1, nuc-worker-2]
