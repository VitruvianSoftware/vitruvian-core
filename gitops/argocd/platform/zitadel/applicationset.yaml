# zitadel — self-hosted Zitadel identity platform (OIDC/OAuth2/SAML + the v2
# login) for dev and the first-party apps we build. This is the GitOps-native,
# HA promotion of the prior throwaway eval.
#
# HA: 2 API/console replicas + 2 v2-login replicas, each hostname-anti-affine
# with a minAvailable=1 PDB; Zitadel is stateless/event-sourced so it scales out
# horizontally. All durable state lives in the zitadel-db CNPG cluster (HA
# Postgres, sibling AppSet). Every secret is sealed: the 32-byte master key
# (SealedSecret zitadel-masterkey, key `masterkey`); the DB password — injected
# via env from the CNPG-managed role secret zitadel-db-app-credentials, the
# SINGLE source of truth (CNPG sets the role password from it, Zitadel reads the
# same secret), so it is never duplicated; and the one-time bootstrap admin
# (SealedSecret zitadel-secret-config, key `config-yaml`). NOTHING sensitive is
# in this file.
#
# EDGE: Traefik + cert-manager (letsencrypt-cloudflare) + external-dns at
# https://auth.lab.ipv1337.dev (matches argocd/grafana). Zitadel v4 splits the
# login into a separate pod, so the ingress is PATH-ROUTED: /ui/v2/login -> the
# login Deployment, everything else -> the API/console Deployment. ExternalSecure
# + ExternalPort 443 with TLS terminated at Traefik (TLS.Enabled=false in-pod) so
# the issuer the login-client validates is the public https origin.
#
# MASTER KEY (critical): losing zitadel-masterkey means losing ALL encrypted data
# (tokens, keys, secrets). It is sealed in git AND must be backed up out-of-band
# with the sealed-secrets controller key (bazel run //tools/gitops:sealed-secrets-backup,
# Bitwarden). A cluster rebuild that restores the controller key restores it.
#   chart zitadel-10.0.4 (https://charts.zitadel.com), Zitadel v4.x, ns zitadel,
#   external CNPG DB zitadel-db-cluster-rw, FirstInstance org "Vitruvian".
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zitadel
  namespace: argocd
  labels:
    environment: zitadel
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: zitadel
      labels:
        app: zitadel
      annotations:
        # After its DB (zitadel-db, wave 0) and the sealed secrets (wave -5).
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform-project
      source:
        repoURL: https://charts.zitadel.com
        chart: zitadel
        targetRevision: "10.0.4"
        helm:
          version: v3
          values: |
            # 2 API/console replicas across distinct nodes.
            replicaCount: 2
            zitadel:
              # Master key + sensitive config from SealedSecrets (never inline).
              masterkeySecretName: zitadel-masterkey
              # config-yaml carries ONLY the one-time FirstInstance bootstrap
              # admin (the DB password comes from env, below). Merged into config
              # at startup.
              configSecretName: zitadel-secret-config
              configSecretKey: config-yaml
              # Non-secret connection config; the DB password is supplied by the
              # ZITADEL_* env vars below (which override config). configmap values
              # take priority over config-yaml for shared keys.
              configmapConfig:
                ExternalDomain: auth.lab.ipv1337.dev
                ExternalPort: 443
                ExternalSecure: true
                # TLS terminated at Traefik; pod speaks plaintext h2c behind it.
                TLS:
                  Enabled: false
                Database:
                  Postgres:
                    Host: zitadel-db-cluster-rw.zitadel.svc.cluster.local
                    Port: 5432
                    Database: zitadel
                    MaxOpenConns: 20
                    MaxIdleConns: 10
                    # Runtime app user (owns the zitadel db) — password in config-yaml.
                    User:
                      Username: zitadel
                      SSL:
                        Mode: require
                    # Migration/admin user — same app user (owns the db, pre-created
                    # by CNPG initdb so no CREATE DATABASE / superuser is needed).
                    Admin:
                      Username: zitadel
                      SSL:
                        Mode: require
            # DB password from the CNPG-managed role secret (single source of
            # truth — CNPG sets the `zitadel` role password from this same secret
            # via initdb). ZITADEL_* env overrides config and reaches exactly the
            # Postgres-connecting pods (start Deployment + init/setup jobs), so the
            # password is never copied into config-yaml and cannot drift.
            env:
              - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: zitadel-db-app-credentials
                    key: password
              - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: zitadel-db-app-credentials
                    key: password
            # HA for the API/console pods.
            pdb:
              enabled: true
              minAvailable: 1
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: start
                    topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            # API/console ingress: host root -> this Deployment.
            ingress:
              enabled: true
              className: traefik
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-cloudflare
                external-dns.alpha.kubernetes.io/sync-enabled: "true"
              hosts:
                - host: auth.lab.ipv1337.dev
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - secretName: zitadel-tls
                  hosts:
                    - auth.lab.ipv1337.dev
            # Zitadel v4 split login (separate Next.js Deployment).
            login:
              enabled: true
              # 2 login replicas across distinct nodes.
              replicaCount: 2
              pdb:
                enabled: true
                minAvailable: 1
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: login
                      topologyKey: kubernetes.io/hostname
              # Login ingress: /ui/v2/login -> the login Deployment. Shares the
              # auth.lab.ipv1337.dev host + zitadel-tls cert (issued by the API
              # ingress above); Traefik longest-prefix routes the two together.
              ingress:
                enabled: true
                className: traefik
                hosts:
                  - host: auth.lab.ipv1337.dev
                    paths:
                      - path: /ui/v2/login
                        pathType: Prefix
                tls:
                  - secretName: zitadel-tls
                    hosts:
                      - auth.lab.ipv1337.dev
      destination:
        server: '{{.server}}'
        namespace: zitadel
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
