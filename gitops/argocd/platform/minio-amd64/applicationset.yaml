# minio-amd64 -- the amd64 rebuild of the object store, deployed in PARALLEL to the
# live arm64 `minio` for a blue-green migration (issue #318). Background: distributed
# MinIO cannot mix CPU architectures (binary-checksum gate -- see the `minio` appset),
# so the original 4-drive arm64 set can only live on the lab's arm64 nodes. The only
# STABLE arm64 nodes are james-mbp32 + james-macbook-pro (2), which forced the 4th
# drive onto james-mbp16 -- a ROAMING WiFi laptop that must be an ephemeral stateless
# worker, not a stateful host. Fix: move the store to the 3 stable wired AMD64 nodes
# (fedora, nuc9, james-mbp).
#
# Blue-green migration (old `minio` stays live + intact until the final teardown):
#   1. This deploys an EMPTY amd64 cluster alongside the live arm64 one. Release-scoped
#      Services ({app: minio, release: minio-amd64}) -> no cross-selection with `minio`.
#   2. `mc mirror` copies all 4 buckets old -> new; object counts verified.
#   3. The 4 consumers (tempo, grafana-db, cnpg-cluster, zitadel-db) repoint their
#      endpoint to minio-amd64.minio.svc.cluster.local:9000.
#   4. The old arm64 `minio` is decommissioned -> frees mbp16 + the arm64 nodes.
#
# Identical to `minio` except nodeSelector (amd64) -- same chart 5.4.0, mode, replicas,
# buckets, and `minio-root` creds, so the erasure format + root auth match and the
# consumers' existing creds keep working at cutover (no cred changes). 4 drives now
# spread 1-per-node across the 4 wired amd64 nodes (fedora, james-mbp, nuc9i5,
# nuc9i9) via REQUIRED (hard) anti-affinity -- the 4th wired amd64 node (the second
# NUC) now exists, so we flipped off the soft 2+1+1 fallback that piled two drives on
# fedora. Optional later cleanup: rename minio-amd64 -> minio. The NUCs are the
# disk-tightest amd64 nodes -- watch them as the store grows; the whole store is
# ~227 MiB today.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: minio-amd64
  namespace: argocd
  labels:
    environment: minio
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: minio-amd64
      labels:
        app: minio-amd64
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://charts.min.io/
        chart: minio
        # Same pinned version as the live `minio` (byte-identical erasure format).
        targetRevision: "5.4.0"
        helm:
          version: v3
          values: |
            # Distributed erasure-coded mode, fixed 4-drive set -- identical to `minio`.
            mode: distributed
            replicas: 4
            # SAME root creds as `minio` (ns minio, keys rootUser/rootPassword), so the
            # consumers' existing creds stay valid across the cutover. No plaintext (R8).
            existingSecret: minio-root
            # Buckets created empty by the chart post-job (the original 4 were then
            # mc-mirror filled at the arm64->amd64 cutover; `thanos` is net-new).
            buckets:
              - name: tempo
                policy: none
                purge: false
              - name: grafana-db-backups
                policy: none
                purge: false
              - name: cnpg-cluster-backups
                policy: none
                purge: false
              - name: zitadel-db-backups
                policy: none
                purge: false
              # Thanos TSDB block storage for the HA Prometheus migration (sidecar
              # upload + Store Gateway reads + Compactor). See
              # docs/archive/design/prometheus-thanos-ha.md.
              - name: thanos
                policy: none
                purge: false
              # devx in-cluster registry storage (S3 driver) -- lets the registry run
              # 2 replicas active-active instead of a single RWO-PVC pod. devx ensures
              # this bucket idempotently too (mc mb) for fresh-cluster ordering.
              - name: registry
                policy: none
                purge: false
            persistence:
              enabled: true
              storageClass: local-path
              size: 10Gi
            # PIN to amd64 -- the stable wired tier (fedora, nuc9, james-mbp). Single-arch
            # erasure set (same hard requirement as the arm64 original; mixing arch breaks
            # quorum via the binary-checksum gate). This pins the store OFF the roaming
            # arm64 laptop james-mbp16.
            nodeSelector:
              kubernetes.io/arch: amd64
            # 4 drives across 4 wired amd64 nodes (fedora, james-mbp, nuc9i5, nuc9i9)
            # -- REQUIRED (hard): exactly 1 drive per node, no co-location. The 4th
            # wired amd64 node (the second NUC) now exists, so the soft rule that
            # previously allowed a 2+1+1 pile-up on fedora is upgraded to hard
            # 1-per-node per the original plan. With 4 replicas and 4 amd64 nodes the
            # fit is exact; the StatefulSet rolling update converges to 1-per-node
            # (each recreated pod has exactly one free amd64 node). Trade-off: if an
            # amd64 node is down its drive stays Pending until the node returns
            # (acceptable -- the 4-drive erasure set already tolerates 1 lost drive,
            # and PDB maxUnavailable:1 caps voluntary disruption).
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: minio
                    topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              enabled: true
              maxUnavailable: 1
            resources:
              requests:
                memory: 512Mi
      destination:
        server: '{{.server}}'
        namespace: minio
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
