# minio-amd64 -- the amd64 rebuild of the object store, deployed in PARALLEL to the
# live arm64 `minio` for a blue-green migration (issue #318). Background: distributed
# MinIO cannot mix CPU architectures (binary-checksum gate -- see the `minio` appset),
# so the original 4-drive arm64 set can only live on the lab's arm64 nodes. The only
# STABLE arm64 nodes are james-mbp32 + james-macbook-pro (2), which forced the 4th
# drive onto james-mbp16 -- a ROAMING WiFi laptop that must be an ephemeral stateless
# worker, not a stateful host. Fix: move the store to the 3 stable wired AMD64 nodes
# (fedora, nuc9, james-mbp).
#
# Blue-green migration (old `minio` stays live + intact until the final teardown):
#   1. This deploys an EMPTY amd64 cluster alongside the live arm64 one. Release-scoped
#      Services ({app: minio, release: minio-amd64}) -> no cross-selection with `minio`.
#   2. `mc mirror` copies all 4 buckets old -> new; object counts verified.
#   3. The 4 consumers (tempo, grafana-db, cnpg-cluster, zitadel-db) repoint their
#      endpoint to minio-amd64.minio.svc.cluster.local:9000.
#   4. The old arm64 `minio` is decommissioned -> frees mbp16 + the arm64 nodes.
#
# Identical to `minio` except nodeSelector (amd64) -- same chart 5.4.0, mode, replicas,
# buckets, and `minio-root` creds, so the erasure format + root auth match and the
# consumers' existing creds keep working at cutover (no cred changes). 4 drives now
# spread 1-per-node across the 4 wired amd64 nodes (fedora, james-mbp, nuc9i5,
# nuc9i9) via REQUIRED (hard) anti-affinity -- the 4th wired amd64 node (the second
# NUC) now exists, so we flipped off the soft 2+1+1 fallback that piled two drives on
# fedora. Optional later cleanup: rename minio-amd64 -> minio. The NUCs are the
# disk-tightest amd64 nodes -- watch them as the store grows. Store size as of
# 2026-09-02: ~55 GiB PER DRIVE (51-59G observed), of which `thanos` is ~53G --
# i.e. Prometheus long-term blocks are effectively the entire store. (An earlier
# revision of this comment said "~227 MiB today"; that was true at the cutover
# and is now stale by ~250x -- re-measure with
# `kubectl -n minio exec minio-amd64-0 -- du -sh /export` before any capacity
# decision.) NOTE the PVCs still REQUEST 10Gi while holding ~55G: local-path does
# not enforce size, and volumeClaimTemplates are immutable, so this cannot be
# corrected in place without recreating the StatefulSet. Do not assume the
# scheduler knows how big these drives really are.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: minio-amd64
  namespace: argocd
  labels:
    environment: minio
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: minio-amd64
      labels:
        app: minio-amd64
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://charts.min.io/
        chart: minio
        # Same pinned version as the live `minio` (byte-identical erasure format).
        targetRevision: "5.4.0"
        helm:
          version: v3
          values: |
            # Distributed erasure-coded mode, fixed 4-drive set -- identical to `minio`.
            mode: distributed
            replicas: 4
            # SAME root creds as `minio` (ns minio, keys rootUser/rootPassword), so the
            # consumers' existing creds stay valid across the cutover. No plaintext (R8).
            existingSecret: minio-root
            # Buckets created empty by the chart post-job (the original 4 were then
            # mc-mirror filled at the arm64->amd64 cutover; `thanos` is net-new).
            buckets:
              - name: tempo
                policy: none
                purge: false
              - name: grafana-db-backups
                policy: none
                purge: false
              - name: cnpg-cluster-backups
                policy: none
                purge: false
              - name: zitadel-db-backups
                policy: none
                purge: false
              # CNPG Barman backups for backstage-db and buzz-db, which had no
              # backups at all until 2026-09-25. Created here FIRST, one PR
              # ahead of the Cluster specs that start archiving into them, so
              # WAL never piles up on a failing archive_command.
              - name: backstage-db-backups
                policy: none
                purge: false
              - name: buzz-db-backups
                policy: none
                purge: false
              # Thanos TSDB block storage for the HA Prometheus migration (sidecar
              # upload + Store Gateway reads + Compactor). See
              # docs/archive/design/prometheus-thanos-ha.md.
              - name: thanos
                policy: none
                purge: false
              # devx in-cluster registry storage (S3 driver) -- lets the registry run
              # 2 replicas active-active instead of a single RWO-PVC pod. devx ensures
              # this bucket idempotently too (mc mb) for fresh-cluster ordering.
              - name: registry
                policy: none
                purge: false
              # Buzz relay media storage (Blossom / S3). Buzz stores uploaded
              # images, files, and git pack data in this bucket.
              - name: buzz-media
                policy: none
                purge: false
            # MinIO stopped publishing images: quay.io/minio/* and docker.io/minio/*
            # both answer 401 for every tag (checked 2026-09-26), so the chart's
            # default mc image cannot be pulled and its post-sync job (buckets,
            # policies, users) hangs in ImagePullBackOff, which also stalls every
            # later sync of this app. Chainguard's free build of the same client
            # carries mc plus the busybox shell the job scripts need; it runs as
            # uid 65532, and the job's /etc/minio/mc and /tmp are emptyDirs. The
            # chart's scripts were run end to end against it before pinning.
            # Only `latest-dev` is free, so it is pinned by digest.
            mcImage:
              repository: cgr.dev/chainguard/minio-client
              tag: "latest-dev@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8"
            # Scoped logins. Each database's backups use a login that can reach
            # ONLY its own bucket, instead of the root user, so one leaked
            # credential no longer exposes every other database's backups.
            # Passwords come from SealedSecrets in this namespace
            # (minio-user-<name>); the matching copy each database reads is
            # <db>-backup-s3 in its own namespace. The chart's post-sync job
            # creates the policies and users. It never deletes a user, changes
            # an existing user's password, or detaches a policy: those need a
            # one-off `mc admin` command (see buzz-media-user and console below).
            policies:
              - name: grafana-db-backup
                statements:
                  - resources:
                      - 'arn:aws:s3:::grafana-db-backups'
                    actions:
                      - "s3:GetBucketLocation"
                      - "s3:ListBucket"
                      - "s3:ListBucketMultipartUploads"
                  - resources:
                      - 'arn:aws:s3:::grafana-db-backups/*'
                    actions:
                      - "s3:GetObject"
                      - "s3:PutObject"
                      - "s3:DeleteObject"
                      - "s3:AbortMultipartUpload"
                      - "s3:ListMultipartUploadParts"
              - name: cnpg-cluster-backup
                statements:
                  - resources:
                      - 'arn:aws:s3:::cnpg-cluster-backups'
                    actions:
                      - "s3:GetBucketLocation"
                      - "s3:ListBucket"
                      - "s3:ListBucketMultipartUploads"
                  - resources:
                      - 'arn:aws:s3:::cnpg-cluster-backups/*'
                    actions:
                      - "s3:GetObject"
                      - "s3:PutObject"
                      - "s3:DeleteObject"
                      - "s3:AbortMultipartUpload"
                      - "s3:ListMultipartUploadParts"
              - name: zitadel-db-backup
                statements:
                  - resources:
                      - 'arn:aws:s3:::zitadel-db-backups'
                    actions:
                      - "s3:GetBucketLocation"
                      - "s3:ListBucket"
                      - "s3:ListBucketMultipartUploads"
                  - resources:
                      - 'arn:aws:s3:::zitadel-db-backups/*'
                    actions:
                      - "s3:GetObject"
                      - "s3:PutObject"
                      - "s3:DeleteObject"
                      - "s3:AbortMultipartUpload"
                      - "s3:ListMultipartUploadParts"
              - name: backstage-db-backup
                statements:
                  - resources:
                      - 'arn:aws:s3:::backstage-db-backups'
                    actions:
                      - "s3:GetBucketLocation"
                      - "s3:ListBucket"
                      - "s3:ListBucketMultipartUploads"
                  - resources:
                      - 'arn:aws:s3:::backstage-db-backups/*'
                    actions:
                      - "s3:GetObject"
                      - "s3:PutObject"
                      - "s3:DeleteObject"
                      - "s3:AbortMultipartUpload"
                      - "s3:ListMultipartUploadParts"
              - name: buzz-db-backup
                statements:
                  - resources:
                      - 'arn:aws:s3:::buzz-db-backups'
                    actions:
                      - "s3:GetBucketLocation"
                      - "s3:ListBucket"
                      - "s3:ListBucketMultipartUploads"
                  - resources:
                      - 'arn:aws:s3:::buzz-db-backups/*'
                    actions:
                      - "s3:GetObject"
                      - "s3:PutObject"
                      - "s3:DeleteObject"
                      - "s3:AbortMultipartUpload"
                      - "s3:ListMultipartUploadParts"
              - name: buzz-media
                statements:
                  - resources:
                      - 'arn:aws:s3:::buzz-media'
                    actions:
                      - "s3:GetBucketLocation"
                      - "s3:ListBucket"
                      - "s3:ListBucketMultipartUploads"
                  - resources:
                      - 'arn:aws:s3:::buzz-media/*'
                    actions:
                      - "s3:GetObject"
                      - "s3:PutObject"
                      - "s3:DeleteObject"
                      - "s3:AbortMultipartUpload"
                      - "s3:ListMultipartUploadParts"
            users:
              - accessKey: grafana-db-backup
                existingSecret: minio-user-grafana-db-backup
                existingSecretKey: secretKey
                policy: grafana-db-backup
              - accessKey: cnpg-cluster-backup
                existingSecret: minio-user-cnpg-cluster-backup
                existingSecretKey: secretKey
                policy: cnpg-cluster-backup
              - accessKey: zitadel-db-backup
                existingSecret: minio-user-zitadel-db-backup
                existingSecretKey: secretKey
                policy: zitadel-db-backup
              - accessKey: backstage-db-backup
                existingSecret: minio-user-backstage-db-backup
                existingSecretKey: secretKey
                policy: backstage-db-backup
              - accessKey: buzz-db-backup
                existingSecret: minio-user-buzz-db-backup
                existingSecretKey: secretKey
                policy: buzz-db-backup
              # Buzz's media store. This login was created by hand with the
              # built-in readwrite policy, which reaches EVERY bucket, database
              # backups included. Same name and password as buzz-secrets holds.
              # The job only ADDS a policy to an existing user, so the old
              # readwrite grant was detached by hand once:
              #   mc admin policy detach <alias> readwrite --user buzz-media-user
              - accessKey: buzz-media-user
                existingSecret: minio-user-buzz-media
                existingSecretKey: secretKey
                policy: buzz-media
              # Deliberately NOT listed: `console`. The chart's DEFAULT users
              # list creates console / console123 with full admin rights; any
              # `users:` list replaces that default. The live one (created at
              # install) was removed by hand, since the job never deletes users:
              #   mc admin user remove <alias> console
            persistence:
              enabled: true
              storageClass: local-path
              size: 10Gi
            # PIN to amd64 -- the healthy wired tier (fedora, nuc9i5, nuc9i9); james-mbp
            # is amd64 but excluded by the nodeAffinity allowlist below (thermal, see
            # there). Single-arch erasure set: mixing arm64/amd64 is NOT supported --
            # MinIO validates a binary checksum across members and a mixed set fails
            # to form with "has incorrect configuration: Expected MinIO binary
            # checksum", confirmed by a MinIO maintainer in minio/minio#20605; the
            # check bites at >=3 nodes, where erasure parity validation kicks in. So
            # arm64 nodes cannot take a drive here at any disk size, and this also
            # pins the store OFF the roaming WiFi laptop james-mbp16.
            nodeSelector:
              kubernetes.io/arch: amd64
            # 4 drives across THREE nodes (2 on nuc9i9, 1 each on fedora + nuc9i5).
            # james-mbp is deliberately OUT of the erasure set: it is a Lima VM on a
            # 2019 Intel MacBookPro16,2 that runs THERMALLY THROTTLED at ~29-39% of
            # rated clock (`pmset -g therm` -> CPU_Speed_Limit 29..39, sustained),
            # with 6 vCPUs over 4 physical cores. Its drive cost 0.67-1.62 cores
            # against 0.096-0.135 on every other node for the identical job, and it
            # stopped answering peer data-path calls often enough to drop the set
            # under read quorum ("InsufficientReadQuorum" on .minio.sys IAM reads,
            # 2026-09-02). A drive that is chronically slow degrades the whole set,
            # so three healthy nodes beat four with one sick one.
            #
            # MinIO's minimum for erasure coding is 4 DRIVES, not 4 nodes, so the
            # count is unchanged -- only their placement. Anti-affinity therefore
            # drops from required to PREFERRED so two pods may share a node; the
            # nodeAffinity allowlist below is what actually bounds placement.
            # Allowlist (not a james-mbp denylist) on purpose: an erasure drive is a
            # deliberate placement, so a new node must be opted IN here, never
            # inherited by matching a broad label.
            #
            # WARNING -- soft anti-affinity does NOT choose WHICH node doubles up,
            # and the scheduler cannot see local disk: these PVCs request 10Gi while
            # actually holding ~55G (local-path does not enforce size). Left to the
            # scheduler the second drive could land on nuc9i5 (44.7 GiB free) or
            # fedora (63.4 GiB free) and fill it. Only nuc9i9 (772 GiB free) has
            # room. Placement of the moved drive is pinned deterministically by
            # PRE-BINDING its PVC to a nuc9i9-pinned PV -- see
            # docs/operations/minio-drive-migration-runbook.md. Do not merge this
            # without following that runbook.
            #
            # Availability trade-off, stated plainly: with EC:2 on a 4-drive set the
            # parity is exactly half, so write quorum is K+1 = 3. Losing any
            # single-drive node still leaves 3 -> reads AND writes fine. Losing
            # nuc9i9 drops 2 -> reads fine, WRITES BLOCKED until it returns. That
            # makes nuc9i9 a write-availability SPOF, accepted because james-mbp was
            # degrading the set unconditionally, every day. Revert to hard 1-per-node
            # if a 4th healthy amd64 node ever exists.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - fedora
                            - nuc9i5
                            - nuc9i9
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app: minio
                      topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              enabled: true
              maxUnavailable: 1
            # CPU request is load-bearing, not cosmetic. With no cpu request a
            # container gets the *minimum* CPU weight, so it loses every
            # contention round on a busy node. james-mbp (the smallest amd64
            # node at 6 cores, and one of the four required drive holders) also
            # hosts four CNPG Postgres clusters; it measured 5222m/6000m (87%)
            # actual CPU against just 830m (13%) of declared requests, i.e. the
            # scheduler saw an idle node while the kernel starved everything on
            # it near-equally. minio-amd64-1 lost that fight and stopped
            # answering its peers' data-path calls:
            #   "Marking minio-amd64-1...:9000 offline temporarily; caused by
            #    ... dial tcp 10.42.3.103:9000: i/o timeout"
            # which dropped the 4-drive erasure set under read quorum:
            #   "Storage resources are insufficient for the read operation
            #    .minio.sys/config/iam/users/buzz-media-user/identity.json
            #    (cmd.InsufficientReadQuorum)"
            # That cascades to every consumer of this store (thanos blocks,
            # buzz-media, registry, the *-backups buckets). The node's kubelet
            # was starved to the same degree — `kubectl exec` into the pod
            # returned EOF and metrics-server could not scrape it at all.
            #
            # Requests ONLY, deliberately no limits: a CPU limit throttles via
            # CFS regardless of idle capacity (the same trap that was restarting
            # the redis replicas), and a memory limit would OOM-kill MinIO mid
            # read as its cache grows. 500m is ~3x the steady-state draw of the
            # quiet drives and still schedules on all four amd64 nodes with room
            # to spare (unreserved CPU: james-mbp ~5170m, nuc9i5 ~7650m,
            # nuc9i9 ~13060m, fedora ~20435m). Memory request raised to 1Gi to
            # match observed RSS, which sits well above the previous 512Mi.
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
      destination:
        server: '{{.server}}'
        namespace: minio
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
