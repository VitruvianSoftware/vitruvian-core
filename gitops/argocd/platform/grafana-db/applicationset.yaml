# grafana-db — Pulumi -> ArgoCD platform cutover (the SECOND CNPG Cluster).
# This is the CloudNativePG `cluster` chart backing Grafana's state DB: a
# 3-instance HA Postgres on local-path with LIVE DATA. Values mirror the LIVE
# Pulumi/Helm release EXACTLY so ArgoCD adopts in place with ZERO churn (no pod
# restart, no PVC change). Verified against `helm get values grafana-db -a`
# (== /tmp/cutover-values/grafana-db.values.yaml) and the Pulumi `dbValues` map
# in infrastructure/pulumi/dev-local/pkg/applications/grafana.go (DeployGrafana,
# grafana_ha_enabled branch). Pulumi sets NO ValuesFile for this release, so the
# live values are the in-code map alone — reproduced 1:1 below.
#   chart cluster-0.2.1 (repo https://cloudnative-pg.github.io/charts), ns grafana,
#   cluster.instances=3, storage 8Gi/local-path, resources mem req==limit 512Mi +
#   cpu request 500m (deliberately NO cpu limit), hostname-spread affinity,
#   async streaming replication (no synchronous block), initdb db/owner=grafana
#   from secret grafana-db-credentials, prometheus scrape annotations on :9187,
#   backups -> MinIO s3://grafana-db-backups/ (gzip WAL+data, SSE off, daily
#   00:00:00 base backup, 7d retention).
#
# DATA RETENTION (critical): the StatefulSet PVCs (grafana-db-cluster-1/-2/-3 on
# local-path) hold the LIVE database and MUST survive the cutover. CNPG owns the
# PVCs (CNPG-managed PersistentVolumeClaims, not chart-rendered), so a Helm/Argo
# ownership handoff of the Cluster object does NOT delete or resize them; storage
# size is pinned to 8Gi here so the chart can never request a shrink (local-path
# cannot shrink a PVC). Do NOT prune the PVCs/PVs during cutover.
#
# OUT-OF-BAND STATE (read grafana.go:106-121 before touching this): the LIVE
# grafana-db Cluster was rebuilt during the 2026-06-13 incident via a `recovery`
# bootstrap with a fresh backup serverName (grafana-db-cluster-r4 reading from
# grafana-db-cluster), so the running object is NOT labelled managed-by this Helm
# release and chart v0.2.1 cannot express that live backup serverName (it always
# writes under the cluster name). The `initdb` bootstrap rendered below is
# inert/ignored by CNPG on an existing cluster (server-side dry-run confirmed),
# so faithfully reproducing it is harmless — but a clean adopt requires the live
# Cluster to first be relabelled to ArgoCD's ownership (kubectl label/annotate
# app.kubernetes.io/instance + argocd.argoproj.io/tracking) out-of-band. CRDs are
# owned by the cnpg-operator path (managed out-of-band by Pulumi during cutover);
# this AppSet ships ONLY the Cluster (+ ScheduledBackup) custom resource.
#
# CUTOVER (do NOT just merge): only after ArgoCD is bootstrapped, the platform
# root is applied, AND the cnpg-operator AppSet (sync-wave -1) is healthy. At
# cutover set grafana_ha_enabled=false (or otherwise stop reconciling this
# release) in the dev-local stack — but NEVER let Pulumi prune the Cluster, its
# PVCs/PVs, the grafana-db-credentials secret, or the MinIO backup bucket.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-db
  namespace: argocd
  labels:
    environment: grafana-db
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: grafana-db
      labels:
        app: grafana-db
      annotations:
        # The CNPG Cluster is a workload: it must sync AFTER the CNPG operator
        # (cnpg-operator AppSet, sync-wave -1) and its CRDs are present. Wave 0
        # keeps it behind the operator but ahead of nothing it depends on.
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cluster
        # Pinned to the live release version (Pulumi Version: "0.2.1").
        targetRevision: "0.2.1"
        helm:
          version: v3
          values: |
            # Mirrors the LIVE grafana-db release exactly (Pulumi dbValues map in
            # grafana.go DeployGrafana). Reproduce verbatim — any drift here can
            # restart the Postgres pods or churn the PVCs.
            cluster:
              # 3 keeps a primary + replica through a single node loss.
              instances: 3
              # Spread across physical nodes (no zone labels on this homelab);
              # overrides the chart default topology.kubernetes.io/zone.
              affinity:
                topologyKey: kubernetes.io/hostname
              # Annotation-based scrape (no ServiceMonitor/PodMonitor here).
              inheritedMetadata:
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9187"
              # Memory request == limit pins the floor (no OOM/evict). NO cpu
              # limit on purpose: a cpu limit == request caused CFS throttling
              # that SIGTERM'd a recovering replica (2026-06-13). cpu request
              # still guarantees a baseline share.
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  memory: 512Mi
              # local-path (node-local, reliable I/O) — NOT Longhorn. Size pinned
              # to the chart default so a chart bump can't request a shrink
              # (local-path PVCs cannot shrink).
              storage:
                size: 8Gi
                storageClass: local-path
              # Async streaming replication (CNPG default — intentionally NO
              # `synchronous` block): laptop nodes sleep, so sync replication
              # would stall the primary on a sleeping standby.
              initdb:
                database: grafana
                owner: grafana
                secret:
                  name: grafana-db-credentials
            # Continuous WAL archiving + scheduled base backups to MinIO
            # (grafana_db_backups_enabled). SSE disabled (MinIO has no server-side
            # encryption by default) to avoid barman archive failures.
            backups:
              enabled: true
              provider: s3
              endpointURL: http://minio.minio.svc.cluster.local:9000
              destinationPath: s3://grafana-db-backups/
              s3:
                region: us-east-1
                bucket: grafana-db-backups
                accessKey: admin
                secretKey: minio-admin-password
              wal:
                compression: gzip
                encryption: ""
              data:
                compression: gzip
                encryption: ""
              scheduledBackups:
                - name: daily-backup
                  schedule: 0 0 0 * * *
                  backupOwnerReference: self
                  method: barmanObjectStore
              retentionPolicy: 7d
      destination:
        server: '{{.server}}'
        namespace: grafana
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # CNPG Cluster manifests are large/CRD-typed; CSA avoids the 256KB
          # client-side last-applied annotation failure (matches cnpg appset).
          - ServerSideApply=true
          # Honor ignoreDifferences DURING SYNC, not just in the diff. The cluster
          # chart 0.2.1 ALWAYS emits backup wal/data `encryption` (renders null for
          # our empty value), and CNPG rejects null (must be AES256/aws:kms/absent)
          # — so an SSA sync of the rendered manifest fails outright. With this, the
          # ignored paths (encryption + the recovery bootstrap/serverName/externalClusters)
          # are dropped from the apply, so ArgoCD preserves the live values (no
          # encryption, serverName grafana-db-cluster-r4) and the sync succeeds.
          - RespectIgnoreDifferences=true
      # grafana-db was rebuilt via a `recovery` bootstrap during the 2026-06-13
      # incident (live serverName grafana-db-cluster-r4). CNPG ignores bootstrap
      # post-init, and chart v0.2.1 cannot express the live backup serverName — so
      # ignore both divergent fields: ArgoCD adopts the Cluster faithfully WITHOUT
      # resetting the live recovery bootstrap or churning the WAL archive path
      # (preserves PITR continuity; no fresh base backup needed).
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          # Also ignore fields owned by the CNPG operator + the now-released Pulumi
          # field manager — they back the live spec and SSA leaves them be; clears
          # the cosmetic OutOfSync without touching the live object.
          managedFieldsManagers:
            - manager
            - pulumi-resource-kubernetes
            - kubectl-patch
          jsonPointers:
            - /spec/bootstrap
            - /spec/backup/barmanObjectStore/serverName
            # The recovery source (externalClusters) the chart doesn't render; SSA
            # leaves it in place, so ignore it to avoid a perpetual OutOfSync.
            - /spec/externalClusters
            # chart 0.2.1 emits these as null (our empty value); CNPG rejects null.
            # The live cluster has no encryption (backups to non-SSE MinIO work) — so
            # ignore + RespectIgnoreDifferences drops them from the apply, keeping the
            # live (absent) value. Verified: SSA server dry-run fails WITH these,
            # succeeds WITHOUT them.
            - /spec/backup/barmanObjectStore/wal/encryption
            - /spec/backup/barmanObjectStore/data/encryption
