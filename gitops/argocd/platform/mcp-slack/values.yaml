# Helm values for the mcp-slack Application (gitops/argocd/applications/mcp-slack.yaml),
# extracted out of that Application's inline `helm.values` block so
# argocd-image-updater's git write-back has a real file to patch
# (`image.digest`) — it can't target a string embedded in an Application
# manifest. Referenced via the `$values` source ref in mcp-slack.yaml.

image:
  # Updated automatically by argocd-image-updater when a new digest lands
  # behind ghcr.io/vitruviansoftware/mcp-slack:latest.
  digest: "sha256:56eb6aa48cdf168131e951895f10e9758a18077572537e17dd866cee57339399"

oidc:
  projectId: "385463212784486211"         # pulumi stack output projectId — REQUIRED
  allowedSubjects: "378818267051722263,379361013981513322"   # numeric Zitadel user ids — REQUIRED
  clientId: "385463214025999229"          # pulumi stack output clientId — REQUIRED (#1491)

slack:
  channelIds: "C08JV4R125V,C08JV4R3BGX,C0971J44295,C097P4652LU,C097P4BG2SG,C097U3EDPHS,C097VM92R0F,C097YGXR88Y,C098ESR131Q,C099QFEQW8Y,C09DQ14HHHT,C09E7Q9SL7L,C09GFEAP6GP,C09HR4BRU7K,C09NAFV7SCS,C09PP1CQC22,C09RKTXSPKP,C0A7K7A915E,C0AA6QBNTP1,C0ABGGL4QL8,C0AC39V85GX,C0AC453L4N7,C0AC5V5250R,C0AV6P0P8TH,C0B10MJ5C9H,C0B2JRSKUJH,C0B7SBWMYQ5,C0B8G344HN2,C0BLXAF4C91"
  userTokenEnabled: true                     # impersonation mode — posts as the human
  writeMode: "user"                          # "user" = impersonate, "bot" = post as bot

networkPolicy:
  enabled: true
