# Helm values for the backstage Application, split out of the ApplicationSet so
# argocd-image-updater can write the resolved image digest back into a real file
# (`writeBackTarget: helmvalues:...` cannot target inline values). Consumed via
# the ApplicationSet's `$values` ref source.
#
# NOTE: gitops/argocd/applications/backstage-resources.yaml recurses this
# directory, so this file is excluded there -- it is Helm values, not a manifest.
backstage:
  image:
    registry: ghcr.io
    repository: vitruviansoftware/backstage
    tag: latest@sha256:249c323f3d4ce5c979f203d5112b3d1811d33c1d196823e8b23978d9668eb46d
    pullPolicy: Always
  command:
  - node
  - packages/backend/dist/index.cjs.js
  args:
  - --config
  - /app/app-config-from-configmap.yaml
  extraEnvVars:
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: backstage-github-token
        key: GITHUB_TOKEN
  - name: GRAFANA_TOKEN
    valueFrom:
      secretKeyRef:
        name: grafana-backstage-token
        key: GRAFANA_TOKEN
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: backstage-secrets
        key: POSTGRES_PASSWORD
  - name: BACKSTAGE_AUTH_KEY
    valueFrom:
      secretKeyRef:
        name: backstage-secrets
        key: BACKSTAGE_AUTH_KEY
  - name: AUTH_SESSION_SECRET
    valueFrom:
      secretKeyRef:
        name: backstage-secrets
        key: AUTH_SESSION_SECRET
  - name: AUTH_GITHUB_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: backstage-secrets
        key: AUTH_GITHUB_CLIENT_ID
  - name: AUTH_GITHUB_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: backstage-secrets
        key: AUTH_GITHUB_CLIENT_SECRET
  appConfig:
    app:
      title: Vitruvian Developer Portal
      baseUrl: https://backstage.vitruviansoftware.dev
    backend:
      baseUrl: https://backstage.vitruviansoftware.dev
      listen:
        port: 7007
      # Without this, connect-src falls back to `default-src 'self'` and the
      # BROWSER blocks every frontend call to a third-party API before it is
      # sent -- surfacing as "Error: Failed to fetch" with no request in the
      # network tab and nothing in the backend logs. It is not an auth failure;
      # a scope or token problem returns 401/403 instead.
      #
      # Hit by the GitHub Actions plugin (#1739), the first frontend plugin here
      # that calls an external API (api.github.com) directly from the page. Any
      # future one needs this too.
      #
      # backstage/app-config.yaml has carried this since it was scaffolded --
      # upstream ships it by default. It was never mirrored here, and THIS file
      # is the config the container actually runs, so the repo looked correct
      # while production shipped the restrictive helmet default.
      csp:
        connect-src: ["'self'", 'http:', 'https:']
      database:
        client: pg
        pluginDivisionMode: schema
        connection:
          host: backstage-db-cluster-rw.backstage.svc.cluster.local
          port: 5432
          user: backstage
          password: ${POSTGRES_PASSWORD}
          # No dangerouslyDisableDefaultAuthPolicy here on purpose. With
          # it set, unauthenticated GET /api/catalog/entities returned
          # 200 and the whole catalog was readable by anyone on the
          # internet. Backstage's default policy requires user or
          # service credentials; plugins on the new backend system are
          # secure by default and need no backend.auth.keys, and
          # plugin-app-backend still serves the frontend publicly via
          # its own addAuthPolicy({allow:'unauthenticated', path:'/'}).
    auth:
      environment: production
      providers:
        # No guest provider: this portal is internet-facing, so
        # anonymous sign-in would expose the whole catalog to
        # anyone. GitHub SSO is the only way in, and the
        # usernameMatchingUserEntityName resolver below means a
        # GitHub account only works if a matching User entity
        # exists in the catalog.
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            # No `signIn.resolvers` here: the GitHub provider is replaced in
            # code (packages/backend/src/auth) by a resolver that proves org
            # membership and then resolves the catalog user. Naming a built-in
            # resolver here made startup fail with "Sign-in resolver
            # 'usernameMatchingUserEntityName' is not available".
    # Without `enabled: true` Backstage allows every request without
    # consulting a policy at all, so this flag is what makes the
    # Vitruvian permission policy load-bearing. Admins get
    # unrestricted access; other signed-in users are read-only.
    permission:
      enabled: true
      adminEntityRefs:
      - group:default/platform-team
      # Belt and braces: the group ref only grants admin if the
      # catalog resolved the User -> Group memberOf relation into
      # ownershipEntityRefs. The direct user ref always matches,
      # so a catalog hiccup cannot degrade the admin to read-only.
      - user:default/ipv1337
    # Without this block TechDocs defaults to generator.runIn
    # 'docker', which cannot spawn a container from inside the pod,
    # so every docs page failed to build. 'local' uses the
    # mkdocs-techdocs-core installed in the runtime image. publisher
    # 'local' keeps generated docs on the pod filesystem: rebuilt on
    # demand after a restart, which is fine for these small doc sets
    # and avoids introducing object-storage credentials.
    # Live workload state on the entity page. Backstage runs inside this cluster,
    # so it uses the in-cluster API endpoint with its own ServiceAccount token
    # (platform/backstage/rbac.yaml) -- no API credential to mint, seal or rotate.
    kubernetes:
      serviceLocatorMethod:
        type: "multiTenant"
      clusterLocatorMethods:
      - type: "config"
        clusters:
        - name: homelab
          url: https://kubernetes.default.svc
          authProvider: "serviceAccount"
          skipTLSVerify: false
          # serviceAccountToken deliberately omitted: with authProvider
          # serviceAccount the plugin falls back to the projected token the
          # kubelet already mounts, so there is no Secret to create or keep in
          # sync with the ServiceAccount.
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    techdocs:
      builder: "local"
      generator:
        runIn: "local"
      publisher:
        type: "local"
    # The Grafana plugin talks to Grafana through the backend proxy, never from
    # the browser: the token stays server-side and no CORS/CSP exception is
    # needed. Target is the in-cluster Service, not grafana.lab.ipv1337.dev --
    # it keeps the traffic off the ingress and works regardless of external DNS.
    proxy:
      endpoints:
        /grafana/api:
          target: http://grafana.grafana.svc.cluster.local
          headers:
            Authorization: "Bearer ${GRAFANA_TOKEN}"
          # The token is a Viewer-role service account, but the proxy would
          # otherwise happily forward writes; restrict it to reads.
          allowedMethods: ["GET"]
          # Do not let a browser-supplied cookie/authorization ride along to
          # Grafana -- the proxy's own bearer token is the only credential.
          allowedHeaders: ["Accept", "Content-Type"]
    grafana:
      # Used to build the click-through links the card renders. This is the
      # user-facing URL, unlike the proxy target above which is in-cluster.
      domain: https://grafana.lab.ipv1337.dev
    integrations:
      github:
      - host: github.com
        # Authenticates catalog-info.yaml fetches (previously anonymous, and so
        # capped at GitHub's 60 req/hr unauthenticated limit) and is the
        # credential publish:github uses to create scaffolded repositories.
        token: ${GITHUB_TOKEN}
    catalog:
      rules:
      - allow: [Component, System, API, Resource, Location, Template, User, Group]
      locations:
      - type: url
        target: https://github.com/VitruvianSoftware/vitruvian-core/blob/main/catalog-info.yaml
        rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
# Identity for the Kubernetes plugin's read-only cluster access. Defined in
# platform/backstage/rbac.yaml; `create: false` because the chart must bind to
# that ServiceAccount rather than mint its own without the ClusterRole.
#
# Top-level, NOT nested under `backstage:`. The chart declares serviceAccount as
# a top-level value and sets `additionalProperties: false` on `backstage`, so
# nesting it there fails values.schema.json and blocks rendering of the ENTIRE
# Application -- ArgoCD reports ComparisonError and every other change to this
# app (image digests included) silently stops deploying behind it.
serviceAccount:
  create: false
  name: backstage
ingress:
  enabled: false
httpRoute:
  enabled: true
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: platform
    namespace: envoy-gateway-system
  hostnames:
  - backstage.vitruviansoftware.dev
  - backstage.lab.ipv1337.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
