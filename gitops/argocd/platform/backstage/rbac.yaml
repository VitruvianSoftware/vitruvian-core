# Identity the Backstage backend uses to read workload state for the Kubernetes
# plugin. Backstage runs inside this cluster, so it authenticates with the token
# this ServiceAccount is issued -- there is no API token to mint, store, seal or
# rotate, and nothing to leak if the repo is cloned.
#
# The ClusterRole is READ-ONLY and deliberately narrow: exactly the resource
# types the plugin renders, with get/list/watch and nothing else. No secrets, no
# create/update/delete, no exec. Backstage surfaces information; it must never
# become a mutation path into the cluster.
#
# Cluster-scoped rather than namespaced because the plugin resolves workloads by
# label selector across namespaces -- a component's pods are not guaranteed to
# live in the backstage namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-kubernetes-reader
rules:
  # Core workload + service objects the plugin renders.
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: ["get", "list", "watch"]
  # Pod logs and events power the plugin's troubleshooting view -- the exact
  # signal that made a wedged rollout invisible until someone ran kubectl.
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: ["get", "list", "watch"]
  # Metrics are optional: the plugin degrades gracefully if metrics-server is
  # absent, but this cluster runs it (HA, #433) so CPU/memory render.
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-kubernetes-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-kubernetes-reader
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
