# backstage — developer portal for vitruvian-core services and catalog.
# Uses upstream chart (https://backstage.github.io/charts).
# Database defaults to in-memory better-sqlite3 for initial evaluation/standup.
# Production cutover to a dedicated CloudNativePG cluster (backstage-db) requires
# provisioning the CNPG Cluster CR and injecting credentials via SealedSecret.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage
  namespace: argocd
  labels:
    environment: backstage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: backstage
      labels:
        app: backstage
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: platform-project
      source:
        repoURL: https://backstage.github.io/charts
        chart: backstage
        targetRevision: "2.10.0"
        helm:
          version: v3
          values: |
            backstage:
              image:
                registry: ghcr.io
                repository: vitruviansoftware/backstage
                tag: latest
                pullPolicy: Always
              command:
                - node
                - packages/backend/dist/index.cjs.js
              args:
                - --config
                - /app/app-config-from-configmap.yaml
              extraEnvVars:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backstage-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKSTAGE_AUTH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backstage-secrets
                      key: BACKSTAGE_AUTH_KEY
                - name: AUTH_SESSION_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: backstage-secrets
                      key: AUTH_SESSION_SECRET
                - name: AUTH_GITHUB_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: backstage-secrets
                      key: AUTH_GITHUB_CLIENT_ID
                - name: AUTH_GITHUB_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: backstage-secrets
                      key: AUTH_GITHUB_CLIENT_SECRET
              appConfig:
                app:
                  title: Vitruvian Developer Portal
                  baseUrl: https://backstage.vitruviansoftware.dev
                backend:
                  baseUrl: https://backstage.vitruviansoftware.dev
                  listen:
                    port: 7007
                  database:
                    client: pg
                    pluginDivisionMode: schema
                    connection:
                      host: backstage-db-cluster-rw.backstage.svc.cluster.local
                      port: 5432
                      user: backstage
                      password: ${POSTGRES_PASSWORD}
                  auth:
                    dangerouslyDisableDefaultAuthPolicy: true

                auth:
                  environment: production

                  providers:
                    guest: {}
                    github:
                      production:
                        clientId: ${AUTH_GITHUB_CLIENT_ID}
                        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
                        signIn:
                          resolvers:
                            - resolver: usernameMatchingUserEntityName
                integrations:
                  github:
                    - host: github.com
                catalog:
                  rules:
                    - allow: [Component, System, API, Resource, Location, Template, User, Group]
                  locations:
                    - type: url
                      target: https://github.com/VitruvianSoftware/vitruvian-core/blob/main/catalog-info.yaml
                      rules:
                        - allow: [Component, System, API, Resource, Location, Template, User, Group]
            ingress:
              enabled: false
            httpRoute:
              enabled: true
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: platform
                  namespace: envoy-gateway-system
              hostnames:
                - backstage.vitruviansoftware.dev
                - backstage.lab.ipv1337.dev
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
      destination:
        server: '{{.server}}'
        namespace: backstage
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
