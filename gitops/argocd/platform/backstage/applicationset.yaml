# backstage — developer portal for vitruvian-core services and catalog.
# Uses upstream chart (https://backstage.github.io/charts).
# Database defaults to in-memory better-sqlite3 for initial evaluation/standup.
# Production cutover to a dedicated CloudNativePG cluster (backstage-db) requires
# provisioning the CNPG Cluster CR and injecting credentials via SealedSecret.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage
  namespace: argocd
  labels:
    environment: backstage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: backstage
      labels:
        app: backstage
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: platform-project
      source:
        repoURL: https://backstage.github.io/charts
        chart: backstage
        targetRevision: "2.10.0"
        helm:
          version: v3
          values: |
            backstage:
              appConfig:
                app:
                  title: Vitruvian Developer Portal
                  baseUrl: https://backstage.lab.ipv1337.dev
                backend:
                  baseUrl: https://backstage.lab.ipv1337.dev
                  listen:
                    port: 7007
                  database:
                    client: better-sqlite3
                    connection: ':memory:'
            ingress:
              enabled: false
            httpRoute:
              enabled: true
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: platform
                  namespace: envoy-gateway-system
              hostnames:
                - backstage.lab.ipv1337.dev
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
      destination:
        server: '{{.server}}'
        namespace: backstage
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
