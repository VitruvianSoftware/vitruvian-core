# File-level backup of the Prometheus TSDB to the NAS over NFS. Prometheus now
# runs as a 2-replica StatefulSet (prometheus-server-0/-1), each on a fedora-
# /nuc9i9-pinned local-path PVC — if that node's disk dies its copy is gone.
# Both replicas hold the same TSDB (HA scrape of the same targets), so backing
# up ONE replica is a complete snapshot. We back up replica-0's PVC
# (storage-volume-prometheus-server-0, StatefulSet-templated name), which is
# pinned to fedora — so this job pins to fedora too and co-mounts that RWO PVC
# read-only alongside the running prometheus-server-0 pod (same-node RWO mount).
# The admin snapshot API isn't enabled, so we tar the live /data dir: that's
# crash-consistent, which Prometheus recovers from on restore (WAL replay).
# 7-day retention.
#
# NB: the claimName below is the StatefulSet volumeClaimTemplate name
# (`storage-volume` + `prometheus-server` + ordinal). A prior single-instance
# deploy used a PVC literally named `prometheus-server`; when the HA StatefulSet
# replaced it (2026-06-29) that name vanished and this job failed to mount until
# retargeted here.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-backup
  namespace: monitoring
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-backup
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prometheus-nas-backup
  namespace: monitoring
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # The TSDB PVC is local-path on fedora — the backup must run there too.
          nodeSelector:
            kubernetes.io/hostname: fedora
          # root + no_root_squash export → writes to the NAS without uid mapping.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
          containers:
            - name: backup
              image: busybox:1.36
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  ts=$(date +%Y%m%d-%H%M%S)
                  out="/backup/prometheus-tsdb-${ts}.tar.gz"
                  echo "snapshot /data -> ${out} (crash-consistent; Prometheus replays WAL on restore)"
                  tar czf "${out}.partial" -C /data . 2>/dev/null || echo "tar finished (live-TSDB read warnings ignored)"
                  mv "${out}.partial" "${out}"
                  echo "prune snapshots older than 7d:"
                  find /backup -name 'prometheus-tsdb-*.tar.gz' -mtime +7 -print -delete || true
                  echo "current snapshots:"; ls -lh /backup | tail -8
              volumeMounts:
                - {name: tsdb, mountPath: /data, readOnly: true}
                - {name: nas, mountPath: /backup}
          volumes:
            - name: tsdb
              persistentVolumeClaim:
                claimName: storage-volume-prometheus-server-0
                readOnly: true
            - name: nas
              persistentVolumeClaim:
                claimName: nas-backup
