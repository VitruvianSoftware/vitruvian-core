#
# whoami-http-check — gates rollout.yaml's canary promotion. Uses the "web"
# metric provider (plain HTTP GET, no Prometheus needed — see
# https://github.com/argoproj/argo-rollouts/blob/master/docs/analysis/web.md):
# whoami returns a dynamic plain-text body (hostname/IP, changes every pod),
# so an exact-match successCondition won't work; `result != ''` just confirms
# the canary Service actually answered with a body at all. A non-2xx/timeout
# response is treated as a failed measurement by the provider itself, before
# successCondition is even evaluated, so this is a weak-but-real check: it
# catches "canary pod doesn't come up / isn't reachable via its Service",
# which is exactly what a first Rollouts pilot needs to prove.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: whoami-http-check
  namespace: whoami
spec:
  metrics:
    - name: web-check
      interval: 10s
      count: 3
      successCondition: "result != ''"
      provider:
        web:
          url: "http://whoami-canary.whoami.svc.cluster.local"
          timeoutSeconds: 5
