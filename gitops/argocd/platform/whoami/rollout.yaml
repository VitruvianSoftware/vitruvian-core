# whoami — converted from a plain Deployment to the FIRST Argo Rollouts pilot
# on this cluster (replaces deployment.yaml). Chosen because whoami is a
# first-party-owned Deployment (no external Helm chart to fork, unlike buzz —
# see docs/superpowers/specs/2026-07-31-buzz-argo-rollouts-pilot-scoping.md)
# and is already Gateway-API-routed via httproute.yaml.
#
# Canary strategy uses the Gateway API traffic-router plugin
# (argoproj-labs/gatewayAPI, registered on the controller in
# platform/argo-rollouts/applicationset.yaml) against whoami's existing
# HTTPRoute — see httproute.yaml for the two backendRefs (stable/canary) the
# plugin patches weights on, and service-stable.yaml/service-canary.yaml for
# the two Services it manages the pod-template-hash selector on.
#
# AnalysisTemplate (analysistemplate.yaml) uses the "web" metric provider — a
# plain HTTP check against the canary Service, no Prometheus needed. Fine for
# a proof-of-concept on a zero-criticality echo app; a real production canary
# would want a request-rate/error-rate signal instead (buzz's own gap, still
# open).
#
# image pinned to v1.10.1 (down from v1.11.0) deliberately, as a real,
# observable version change to prove the canary mechanism end-to-end: the
# Rollout's very first apply (#1345) was an "Initial deploy" with no prior
# stable revision, so Argo Rollouts correctly skipped straight to Healthy
# without running any canary steps — nothing to canary FROM yet. This bump
# creates revision 2, which has a real predecessor and will actually walk
# setWeight(50) -> pause(30s) -> analysis -> setWeight(100).
#
# containerPort.protocol is written explicitly (TCP) for the same reason
# httproute.yaml writes its Gateway-API defaults explicitly: the API server
# defaults an omitted protocol to TCP live, and ArgoCD only normalizes that
# default for workload kinds it recognizes natively (Deployment, StatefulSet,
# ...) — not for a third-party CRD's embedded PodSpec like this Rollout. Left
# omitted, the live object always carries "protocol: TCP" that the git target
# doesn't, so the Rollout never settles out of OutOfSync.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: whoami
  namespace: whoami
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.1
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  strategy:
    canary:
      canaryService: whoami-canary
      stableService: whoami-stable
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: whoami
            namespace: whoami
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: whoami-http-check
        - setWeight: 100
