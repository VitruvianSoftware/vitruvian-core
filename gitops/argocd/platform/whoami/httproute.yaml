# whoami HTTPRoute — attaches to the platform Gateway (cross-namespace; the Gateway
# allows All). external-dns (gateway-httproute source) publishes whoami.ipv1337.dev
# as a PROXIED CNAME to the tunnel (target annotation overrides the Gateway LB IP),
# so this hostname is reached via Cloudflare's edge, not the internal tailnet path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
  annotations:
    external-dns.alpha.kubernetes.io/sync-enabled: "true"
    external-dns.alpha.kubernetes.io/target: 1f7b9704-bb66-41f4-966f-5bb722e3c10e.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - whoami.ipv1337.dev
  rules:
    - backendRefs:
        - name: whoami
          port: 80
