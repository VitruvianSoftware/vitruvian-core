#
# whoami HTTPRoute — attaches to the platform Gateway (cross-namespace; the Gateway
# allows All). DNS for whoami.ipv1337.dev is owned by the DNSEndpoint CR (a PROXIED
# CNAME to the tunnel), NOT external-dns's gateway-httproute source. The match +
# backendRef fields below are written explicitly to the Gateway-API server defaults
# so ArgoCD doesn't flag them as drift (it doesn't normalize CRD-defaulted fields).
#
# Two backendRefs (stable/canary), not one — this is the Rollout pilot
# (rollout.yaml): the argoproj-labs/gatewayAPI traffic-router plugin patches the
# weight field of these live during a canary, matching them by Service name
# against rollout.yaml's stableService/canaryService. It does not add or remove
# backendRefs itself — both must already exist here (confirmed against the
# plugin's own quick-start guide).
#
# `weight: 1` is written explicitly on both backendRefs — same reasoning as
# the parentRef group/kind above (#255): Gateway API defaults an omitted
# weight to 1 live, and ArgoCD doesn't normalize CRD-schema defaults the way
# it does for a handful of built-in kinds, so an omitted field here just
# means perpetual OutOfSync (confirmed: autoHealAttemptsCount climbed past 12
# with the field left out, never settling).
#
# Tried omitting `weight` entirely first (relying on Rollouts to become sole
# owner the moment it wrote to the field) and, before that, explicit 100/0
# with ignoreDifferences (jsonPointers and jqPathExpressions syntax, both
# nested inside the backendRefs list). The ignoreDifferences path silently
# no-op'd the ENTIRE sync under ServerSideApply — verified live twice, the
# object's managedFields kept showing argocd-controller's Apply from over a
# month earlier despite the sync operation reporting "serverside-applied"
# success. Omitting the field didn't fight that bug, but it also meant
# self-heal was reapplying the whole `rules` list without `weight` on every
# reconcile, which would stomp the traffic-router plugin's live weight
# mid-canary, not just cause a cosmetic diff.
#
# The actual fix is two parts (see whoami.yaml's Application spec for the
# second): write the default here so steady-state git == live and the diff
# settles, then use ignoreDifferences' managedFieldsManagers (NOT
# jsonPointers/jqPathExpressions — a different, working mechanism that
# doesn't touch JSON paths inside the list at all) so self-heal backs off
# fields `rollouts-controller` actually owns once a canary is running.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    # group/kind are Gateway-API server defaults — set them explicitly so ArgoCD
    # doesn't perpetually flag the HTTPRoute OutOfSync against the populated values
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - whoami.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami-stable
          port: 80
          weight: 1
        - group: ""
          kind: Service
          name: whoami-canary
          port: 80
          weight: 1
