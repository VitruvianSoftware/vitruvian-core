# whoami HTTPRoute — attaches to the platform Gateway (cross-namespace; the Gateway
# allows All). DNS for whoami.ipv1337.dev is owned by the DNSEndpoint CR (a PROXIED
# CNAME to the tunnel), NOT external-dns's gateway-httproute source. The match +
# backendRef fields below are written explicitly to the Gateway-API server defaults
# so ArgoCD doesn't flag them as drift (it doesn't normalize CRD-defaulted fields).
#
# Two backendRefs (stable/canary), not one — this is the Rollout pilot
# (rollout.yaml): the argoproj-labs/gatewayAPI traffic-router plugin patches the
# weight field of these live during a canary, matching them by Service name
# against rollout.yaml's stableService/canaryService. It does not add or remove
# backendRefs itself — both must already exist here (confirmed against the
# plugin's own quick-start guide).
#
# `weight` is deliberately OMITTED here (matching the plugin's own quick-start
# example, which shows backendRefs with no weight field at all), NOT set to
# 100/0 — the Gateway API traffic-router plugin owns this field live during
# (and after) a canary; git should never assert a value for it.
#
# That omission alone does NOT stop the drift, though: Gateway API's CRD
# schema defaults an unset weight to 1, so the API server re-populates it on
# every apply regardless of what git says, and since backendRefs has no
# listType merge key, ArgoCD's structural diff sees git's "no weight" vs.
# live's "weight: 1" as a real difference on every reconcile — perpetual
# OutOfSync, and (worse) selfHeal re-syncing git's weight-less manifest can
# race an in-progress canary and reset its weight mid-step. The actual fix is
# whoami.yaml's `ignoreDifferences` (jqPathExpressions, scoped to this exact
# path) so the diff never considers this field at all.
#
# An earlier attempt combined that same ignoreDifferences path with the
# `RespectIgnoreDifferences=true` sync option AND an explicit weight: 100/0
# in git (see PR #1346/#1347 history) — verified twice on the real cluster
# that combination silently no-ops the entire sync under ServerSideApply when
# the ignored path is nested inside a list (managedFields showed
# argocd-controller's last real apply from over a month earlier despite
# every sync operation reporting success). RespectIgnoreDifferences works by
# stripping the ignored path from the applied manifest, which only matters
# when git declares a value there to strip; since weight is omitted here
# entirely, there is nothing for that sync option to strip, so it is not
# used — ignoreDifferences alone (diff-only, doesn't touch what gets applied)
# is the narrower change and doesn't hit the same failure mode.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    # group/kind are Gateway-API server defaults — set them explicitly so ArgoCD
    # doesn't perpetually flag the HTTPRoute OutOfSync against the populated values
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - whoami.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami-stable
          port: 80
        - group: ""
          kind: Service
          name: whoami-canary
          port: 80
