# whoami HTTPRoute — attaches to the platform Gateway (cross-namespace; the Gateway
# allows All). DNS for whoami.ipv1337.dev is owned by the DNSEndpoint CR (a PROXIED
# CNAME to the tunnel), NOT external-dns's gateway-httproute source. The match +
# backendRef fields below are written explicitly to the Gateway-API server defaults
# so ArgoCD doesn't flag them as drift (it doesn't normalize CRD-defaulted fields).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    # group/kind are Gateway-API server defaults — set them explicitly so ArgoCD
    # doesn't perpetually flag the HTTPRoute OutOfSync against the populated values
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - whoami.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1
