# whoami HTTPRoute — attaches to the platform Gateway (cross-namespace; the Gateway
# allows All). DNS for whoami.ipv1337.dev is owned by the DNSEndpoint CR (a PROXIED
# CNAME to the tunnel), NOT by external-dns's gateway-httproute source: that source
# publishes the Gateway's LB IP (10.44.86.211), which Cloudflare rejects as a proxied
# A-record target. So this route carries no external-dns annotations.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - whoami.ipv1337.dev
  rules:
    - backendRefs:
        - name: whoami
          port: 80
