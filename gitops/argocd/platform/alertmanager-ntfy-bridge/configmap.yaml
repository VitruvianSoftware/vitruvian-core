#
# alertmanager-ntfy-bridge — reshapes Alertmanager's raw webhook JSON (no
# title/message/priority fields ntfy understands) into ntfy's publish schema,
# then forwards it. Without this, ntfy has nothing it recognizes in the POST
# body and falls back to showing the literal Alertmanager JSON blob as the
# notification text. Stdlib-only Python (no pip deps, so a stock python:3.13
# base image is all that's needed — no first-party image to build/publish),
# mounted via ConfigMap in the style of ntfy's own server.yml.
#
# Self-clearing alerts: every Alertmanager alert GROUP maps to one ntfy
# notification, keyed by a sequence ID derived from the group's groupKey.
# A re-fire or a partial resolve republishes under the same ID, which REPLACES
# the notification instead of stacking a new one. When the whole group
# resolves, the bridge DELETEs that sequence ID, and ntfy tells every
# subscribed client (web app, Android) to remove it, so it disappears
# everywhere at once. Needs ntfy >= 2.16. Tests: bridge_test.py next to this
# file (bazel test //gitops/argocd/platform/alertmanager-ntfy-bridge:bridge_test).
#
# Changing server.py does not restart the pod by itself (Python reads it once
# at start): bump vitruvian.dev/bridge-code-version in deployment.yaml too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-ntfy-bridge
  namespace: monitoring
data:
  server.py: |
    """Alertmanager webhook -> ntfy publish-schema bridge (stdlib only)."""
    import base64
    import hashlib
    import http.server
    import json
    import os
    import socketserver
    import sys
    import urllib.error
    import urllib.request

    NTFY_BASE_URL = os.environ.get("NTFY_BASE_URL", "https://ntfy.ipv1337.dev")
    NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "vitruvian-alerts")
    NTFY_USERNAME = os.environ.get("NTFY_USERNAME", "alertmanager")
    NTFY_PASSWORD_FILE = os.environ.get(
        "NTFY_PASSWORD_FILE", "/etc/bridge/secrets/ntfy-password"
    )

    # Alertmanager's route only ever sends severity=~"page|warning" here (the
    # "null" receiver drops none|noise upstream) — the .get() default below is
    # just a defensive fallback, not a real third tier.
    PRIORITY_BY_SEVERITY = {"page": 5, "warning": 3}
    DEFAULT_PRIORITY = 3
    TAG_BY_STATUS = {"firing": "rotating_light", "resolved": "white_check_mark"}


    def read_password():
        with open(NTFY_PASSWORD_FILE, "r", encoding="utf-8") as f:
            return f.read().strip()


    # Alert names describing the cluster/host substrate itself (node
    # conditions, etcd quorum, disk/filesystem, scrape targets, Prometheus's
    # own health) rather than a specific workload. Keyed on alertname, not
    # labels: kube-state-metrics joins a `node` label onto WORKLOAD metrics
    # too (e.g. KubeJobFailed carries the node its pod ran on), and node
    # metrics get double-scraped through both a dedicated job (no namespace)
    # and the generic annotation-based job (namespace = wherever node-exporter
    # itself happens to run) — confirmed live, the same NodeFilesystemNearFull
    # alert showed up with and without a namespace label depending on which
    # scrape path produced it. Labels alone can't reliably tell "about this
    # workload" from "about the host it happens to run on"; alertname can.
    # Update this set when adding a new cluster/host-level alert rule.
    HOST_ALERTNAMES = {
        "KubeNodeNotReady",
        "KubeNodeUnreachable",
        "KubeNodeMemoryPressure",
        "KubeNodeDiskPressure",
        "NodeFilesystemNearFull",
        "NodeFilesystemNearFullCritical",
        "NodeFilesystemInodesNearFull",
        "NodeMemoryHigh",
        "EtcdServerNodeDown",
        "EtcdQuorumAtRisk",
        "EtcdNoLeader",
        "NodeContainersStuckWaiting",
        "PrometheusTargetDown",
        "PrometheusConfigReloadFailed",
        "PrometheusTSDBCompactionsFailing",
        "PrometheusNotificationsDropped",
        "CertManagerCertExpiringSoon",
        "CertManagerCertNotReady",
    }


    def classify_source(alertname, common_labels):
        # Cloud Run isn't wired into this pipeline at all yet — add a third
        # branch here when that integration exists.
        if alertname in HOST_ALERTNAMES:
            return "[host]", "computer"
        if common_labels.get("namespace"):
            return "[app]", "package"
        return "[cluster]", "large_blue_circle"


    def sequence_id(am_payload):
        """One stable ntfy sequence ID per Alertmanager alert group.

        groupKey is Alertmanager's own identity for a group (route + group
        labels), identical on every fire, re-fire and resolve of that group.
        Hashed because it contains characters ntfy's IDs don't allow; the
        "am-" prefix keeps these apart from anything else on the topic.
        """
        key = am_payload.get("groupKey") or json.dumps(
            am_payload.get("groupLabels", {}), sort_keys=True
        )
        return "am-" + hashlib.sha256(key.encode("utf-8")).hexdigest()[:32]


    def build_ntfy_payload(am_payload):
        status = am_payload.get("status", "firing")
        alerts = am_payload.get("alerts", [])
        # With send_resolved, a group that is only PARTLY resolved arrives as
        # status=firing with the resolved alerts still listed. Show only the
        # ones still firing, so the replaced notification says what's left.
        if status == "firing":
            still_firing = [a for a in alerts if a.get("status", "firing") == "firing"]
            alerts = still_firing or alerts
        common_labels = am_payload.get("commonLabels", {})
        alertname = (
            common_labels.get("alertname")
            or am_payload.get("groupLabels", {}).get("alertname")
            or "Alert"
        )
        source_prefix, source_tag = classify_source(alertname, common_labels)

        lines = []
        max_priority = 1
        for a in alerts:
            labels = a.get("labels", {})
            annotations = a.get("annotations", {})
            severity = labels.get("severity", "warning")
            summary = (
                annotations.get("summary")
                or annotations.get("description")
                or labels.get("alertname", alertname)
            )
            ns = labels.get("namespace")
            prefix = f"{ns}/" if ns else ""
            lines.append(
                f"- {prefix}{labels.get('alertname', alertname)} ({severity}): {summary}"
            )
            max_priority = max(max_priority, PRIORITY_BY_SEVERITY.get(severity, DEFAULT_PRIORITY))

        if status == "resolved":
            max_priority = min(max_priority, 2)

        title = "{} {} {} ({})".format(
            source_prefix, "resolved:" if status == "resolved" else "firing:", alertname, len(alerts)
        )
        message = "\n".join(lines) if lines else "(no alert detail)"

        return {
            "topic": NTFY_TOPIC,
            "title": title,
            "message": message,
            "priority": max_priority,
            "tags": [TAG_BY_STATUS.get(status, "bell"), source_tag],
            # Same ID on every publish for this group: ntfy replaces the
            # earlier notification rather than adding another.
            "sequence_id": sequence_id(am_payload),
        }


    def _authorized_request(url, data=None, method="POST"):
        req = urllib.request.Request(url, data=data, method=method)
        # ntfy.ipv1337.dev sits behind the Cloudflare Tunnel, and Cloudflare's
        # bot-fingerprint check 403s (error 1010) on urllib's default
        # "Python-urllib/3.x" User-Agent — confirmed live, curl with its own
        # UA was unaffected. Any real UA string clears it.
        req.add_header("User-Agent", "alertmanager-ntfy-bridge/1.1")
        auth = base64.b64encode(f"{NTFY_USERNAME}:{read_password()}".encode()).decode()
        req.add_header("Authorization", f"Basic {auth}")
        return req


    def forward_to_ntfy(payload):
        body = json.dumps(payload).encode("utf-8")
        req = _authorized_request(NTFY_BASE_URL, data=body, method="POST")
        req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req, timeout=10) as resp:
            return resp.status


    def delete_from_ntfy(seq_id):
        """Remove the group's notification from every client.

        DELETE /<topic>/<sequence_id> makes ntfy send a message_delete event,
        which the web and Android apps act on by dropping the notification.
        A 404 means there is nothing to delete (the firing message expired
        from ntfy's 12h cache, or the bridge restarted between fire and
        resolve with an older ID scheme): that is success, not an error.
        """
        url = f"{NTFY_BASE_URL.rstrip('/')}/{NTFY_TOPIC}/{seq_id}"
        req = _authorized_request(url, method="DELETE")
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                return resp.status
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return 200
            raise


    def handle_alertmanager(am_payload):
        """Fire/re-fire -> publish (replace); whole group resolved -> delete."""
        if am_payload.get("status") == "resolved":
            return delete_from_ntfy(sequence_id(am_payload))
        return forward_to_ntfy(build_ntfy_payload(am_payload))


    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            sys.stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path != "/webhook":
                self.send_response(404)
                self.end_headers()
                return
            length = int(self.headers.get("Content-Length", 0))
            raw = self.rfile.read(length)
            try:
                am_payload = json.loads(raw)
                status = handle_alertmanager(am_payload)
            except Exception as exc:
                # Any failure -> 502, so Alertmanager's own webhook retry logic
                # re-delivers instead of silently dropping the alert.
                sys.stderr.write(f"ERROR forwarding to ntfy: {exc}\n")
                self.send_response(502)
                self.end_headers()
                return
            self.send_response(200 if 200 <= status < 300 else 502)
            self.end_headers()


    class ThreadingServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8080"))
        server = ThreadingServer(("0.0.0.0", port), Handler)
        sys.stderr.write(f"alertmanager-ntfy-bridge listening on :{port}\n")
        server.serve_forever()
