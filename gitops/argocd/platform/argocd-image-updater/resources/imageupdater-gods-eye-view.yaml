#
# Watches gods-eye-view's floating `latest` tag
# (ghcr.io/vitruviansoftware/gods-eye-view) for a new digest and writes it into
# the `images:` entry of gitops/argocd/platform/gods-eye-view/kustomization.yaml.
#
# Why this exists: gods-eye-view is built from this repo on every merge that
# touches it and pushed to the same mutable `latest` tag. A tag push never
# changes a committed manifest, so ArgoCD saw no diff and the running pod kept
# the old image until something else happened to restart it. Pinning the digest
# in git makes an image change an ordinary git change: ArgoCD rolls it out, and a
# rollback is a revert. Same pattern as imageupdater-backstage.yaml; the only
# difference is that gods-eye-view is plain manifests rendered by Kustomize, so
# the target is the kustomization rather than Helm values.
#
# Namespace MUST be `argocd`, matching the `gods-eye-view` Application: an
# ImageUpdater CR only lists Applications in its own namespace.
#
# Credentials: reuses the argocd/buzz-image-updater-git-creds SSH deploy key, as
# imageupdater-backstage.yaml does.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: gods-eye-view
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/buzz-image-updater-git-creds"
    gitConfig:
      # Explicit, not inferred: the Application's repoURL is HTTPS, and the
      # deploy key is SSH.
      repository: "git@github.com:VitruvianSoftware/vitruvian-core.git"
      # Read from main (latest), write to a side branch -- never main itself.
      branch: "main:image-updates/gods-eye-view"
      # Bare `kustomization` resolves to the Application's own source path,
      # gitops/argocd/platform/gods-eye-view.
      writeBackTarget: "kustomization"
  applicationRefs:
    - namePattern: "gods-eye-view"
      images:
        - alias: "gods-eye-view"
          imageName: "ghcr.io/vitruviansoftware/gods-eye-view:latest"
          commonUpdateSettings:
            # Not semver/latest: `latest` is a floating tag with no version
            # ordering to compare -- "did the digest behind `latest` change" is
            # the only meaningful signal.
            updateStrategy: "digest"
            forceUpdate: true
          manifestTargets:
            kustomize:
              name: "ghcr.io/vitruviansoftware/gods-eye-view"
