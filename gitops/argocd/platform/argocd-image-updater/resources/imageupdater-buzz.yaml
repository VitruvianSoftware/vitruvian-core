#
# Watches buzz's floating `main` tag (ghcr.io/block/buzz) for a new digest and
# writes the resolved `main@sha256:...` back into
# gitops/argocd/platform/buzz/values.yaml's `image.tag` -- the only thing
# ArgoCD's own diff can't see today, since a mutable-tag push never touches a
# committed manifest.
#
# Namespace MUST be `argocd`, matching the `buzz` Application: an ImageUpdater
# CR only lists Applications in its own namespace (see reasoning in
# ../applicationset.yaml and buzz-image-updater-git-creds.sealedsecret.yaml).
#
# Write-back never touches `main` directly: pushes to `image-updates/buzz`
# (the `checkout:push` form of `branch`), and a separate Actions workflow
# (.github/workflows/image-updates-buzz-pr.yaml) opens/updates a PR from
# there into `main` so the change still goes through the merge queue like
# every other change to this repo.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: buzz
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/buzz-image-updater-git-creds"
    gitConfig:
      # Explicit, not inferred: the `buzz` Application is multi-source (an
      # OCI Helm chart source with no git repoURL, plus this git source over
      # HTTPS) -- inference from spec.source.repoURL would be ambiguous, and
      # our deploy key is SSH, not the HTTPS URL source 2 already uses.
      repository: "git@github.com:VitruvianSoftware/vitruvian-core.git"
      # Read from main (latest), write to a side branch -- never main itself.
      branch: "main:image-updates/buzz"
      writeBackTarget: "helmvalues:./gitops/argocd/platform/buzz/values.yaml"
  applicationRefs:
    - namePattern: "buzz"
      images:
        - alias: "relay"
          imageName: "ghcr.io/block/buzz:main"
          commonUpdateSettings:
            # Not semver/latest: `main` is a floating dev tag with no version
            # ordering to compare -- "did the digest behind `main` change" is
            # the only meaningful signal.
            updateStrategy: "digest"
            forceUpdate: true
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
