# zitadel-db — HA Postgres for the self-hosted Zitadel identity platform.
# A CloudNativePG cluster (1 primary + 2 streaming standbys) on local-path,
# backing Zitadel (auth.lab.ipv1337.dev). Unlike grafana-db / cnpg-cluster this
# is a NET-NEW cluster (no Pulumi adoption / recovery history) — CNPG bootstraps
# it fresh via initdb, so no managedFields / bootstrap / serverName ignores are
# needed. Mirrors the established CNPG pattern:
#   chart cluster-0.7.0 (https://cloudnative-pg.github.io/charts), ns zitadel,
#   cluster.instances=3, hostname-spread affinity (survive a single node loss),
#   storage 8Gi/local-path (node-local reliable I/O; Zitadel is event-sourced so
#   the store grows — local-path PVCs cannot shrink, size is pinned), memory
#   request==limit 1Gi + cpu request 500m (deliberately NO cpu limit: a cpu
#   limit==request caused CFS throttling that SIGTERM'd a recovering replica,
#   2026-06-13), async streaming replication (CNPG default — NO `synchronous`
#   block: laptop nodes sleep, sync would stall the primary), initdb
#   db/owner=zitadel from SealedSecret zitadel-db-app-credentials, prometheus
#   scrape on :9187, backups -> MinIO s3://zitadel-db-backups/ (gzip WAL+data,
#   SSE off, daily 00:00:00 base backup, 7d retention) via SealedSecret
#   zitadel-db-minio-backup-creds.
#
# DATA RETENTION: the 3 instance PVCs (zitadel-db-cluster-1/-2/-3 on local-path)
# carry the LIVE identity database (users, orgs, projects, the event store) and
# MUST survive — CNPG owns the PVCs (not chart-rendered), so an ownership handoff
# never deletes them; size pinned so a chart bump can't request a shrink. Never
# prune the PVCs/PVs. CRDs are owned out-of-band by the cnpg-operator path.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zitadel-db
  namespace: argocd
  labels:
    environment: zitadel-db
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: zitadel-db
      labels:
        app: zitadel-db
      annotations:
        # The CNPG Cluster is a workload: it must sync AFTER the CNPG operator
        # (cnpg-operator AppSet, sync-wave -1) and its CRDs are present.
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: platform-project
      source:
        repoURL: https://cloudnative-pg.github.io/charts
        chart: cluster
        # 0.7.0 — NOT grafana-db/cnpg-cluster's pinned 0.2.1. Those were ADOPTED
        # (Pulumi-created) so ArgoCD never had to CREATE them; 0.2.1 renders backup
        # wal/data `encryption: null` from our empty value, which CNPG's admission
        # webhook rejects on a fresh CREATE (the ignoreDifferences guard only helps
        # when adopting an existing object). 0.7.0 OMITS encryption when empty, so
        # this net-new cluster applies cleanly (server-side dry-run confirmed).
        targetRevision: "0.7.0"
        helm:
          version: v3
          values: |
            cluster:
              # ---- HA TOGGLE -------------------------------------------------
              # Set to 3 for a 3-node streaming-replication HA cluster (needs 3+
              # nodes labelled node.ipv1337.dev/link=wired). Until the WiFi nodes
              # are on Ethernet we run a SINGLE instance: a replica's initial
              # pg_basebackup is a sustained high-throughput stream that the homelab
              # WiFi path (~230ms RTT + packet loss) drops mid-stream, so the join
              # thrashes the primary. Single instance + WAL/base backups to MinIO
              # give durability now; flip to 3 once enough wired nodes exist and the
              # nodeSelector below lands the replicas on them automatically.
              instances: 1
              # ----------------------------------------------------------------
              # Spread 1-per-node (matters at instances>1); overrides the chart
              # default topology.kubernetes.io/zone (a no-op on this homelab).
              affinity:
                topologyKey: kubernetes.io/hostname
                # Pin every instance to a WIRED (Ethernet) node. WiFi nodes
                # (~230ms RTT + loss) can't sustain a base-backup stream; wired
                # nodes are ~1-3ms. The node.ipv1337.dev/link label is set by the
                # devx node provisioning (+ applied to running nodes); relabel a
                # node when its link changes (WiFi <-> Ethernet) and CNPG follows.
                nodeSelector:
                  node.ipv1337.dev/link: wired
              # Annotation-based scrape (no ServiceMonitor/PodMonitor).
              inheritedMetadata:
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "9187"
              # Memory request==limit pins the floor (no OOM/evict) with headroom
              # for Zitadel's migration + event-store load. NO cpu limit on
              # purpose (cpu limit==request caused CFS throttling, 2026-06-13).
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 1Gi
              # local-path (node-local, reliable I/O) — NOT Longhorn. Size pinned
              # so a chart bump can't request a shrink (local-path can't shrink).
              storage:
                size: 8Gi
                storageClass: local-path
              # CNPG defaults wal_sender_timeout to 5s (aggressive failover
              # detection). The homelab Tailscale mesh has high cross-node RTT
              # (measured avg ~400ms, spiking ~1s) and an initial base-backup
              # SATURATES that laggy link, blowing past 5s — so the primary kills
              # the replica's pg_basebackup ("server closed the connection
              # unexpectedly") and the INITIAL join never completes. (Steady-state
              # WAL trickle stays under 5s, which is why the older grafana-db /
              # cnpg-cluster joined fine and keep replicating.) Raise it so a fresh
              # join survives the laggy window; async replication is unaffected (a
              # dead async standby never blocks the primary).
              postgresql:
                parameters:
                  wal_sender_timeout: "600s"
              # Auto-managed postgres superuser secret (zitadel-db-cluster-superuser)
              # for ops/break-glass; Zitadel itself uses only the app user.
              enableSuperuserAccess: true
              superuserSecret: ""
              monitoring:
                enabled: false
                podMonitor:
                  enabled: true
              # Fresh bootstrap: create db `zitadel` owned by `zitadel`, with the
              # password from SealedSecret zitadel-db-app-credentials (basic-auth).
              # CNPG ignores this block once the cluster is initialized.
              initdb:
                database: zitadel
                owner: zitadel
                secret:
                  name: zitadel-db-app-credentials
            # Continuous WAL archiving + daily base backups to MinIO. SSE disabled
            # (MinIO has none) to avoid barman archive failures.
            backups:
              enabled: true
              provider: s3
              endpointURL: http://minio.minio.svc.cluster.local:9000
              destinationPath: s3://zitadel-db-backups/
              s3:
                region: us-east-1
                bucket: zitadel-db-backups
              # S3 creds from SealedSecret zitadel-db-minio-backup-creds (no
              # plaintext in git); create=false → reference the existing secret.
              secret:
                create: false
                name: zitadel-db-minio-backup-creds
              wal:
                compression: gzip
                encryption: ""
              data:
                compression: gzip
                encryption: ""
              scheduledBackups:
                - name: daily-backup
                  schedule: 0 0 0 * * *
                  backupOwnerReference: self
                  method: barmanObjectStore
              retentionPolicy: 7d
      destination:
        server: '{{.server}}'
        namespace: zitadel
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # CNPG Cluster CR is large/CRD-typed; CSA avoids the 256KB client-side
          # last-applied annotation failure (matches grafana-db / cnpg-cluster).
          - ServerSideApply=true
          # Honor ignoreDifferences during sync (defensive; see below).
          - RespectIgnoreDifferences=true
      # Defensive only: chart 0.7.0 OMITS backup wal/data encryption when empty, so
      # these paths are normally absent and this is a no-op. Retained so that if a
      # future chart bump re-emits `encryption: null`, ArgoCD keeps it out of the
      # SSA apply rather than letting CNPG reject the Cluster on sync.
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          jsonPointers:
            - /spec/backup/barmanObjectStore/wal/encryption
            - /spec/backup/barmanObjectStore/data/encryption
