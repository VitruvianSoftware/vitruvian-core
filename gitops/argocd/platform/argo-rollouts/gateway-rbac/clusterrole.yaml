#
# The argo-rollouts chart's default ClusterRole has no gateway.networking.k8s.io
# permissions — that's specific to the Gateway API traffic-router plugin, not
# something the chart grants by default (verified: no httproutes rule in any
# of its rendered RBAC templates). Exact rule set per the plugin's own
# quick-start guide:
# https://rollouts-plugin-trafficrouter-gatewayapi.readthedocs.io/en/latest/quick-start/
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-gatewayapi-plugin
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - patch
      - update
