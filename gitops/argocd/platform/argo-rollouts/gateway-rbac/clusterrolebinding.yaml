# Binds argo-rollouts-gatewayapi-plugin to the controller's own ServiceAccount
# (name/namespace "argo-rollouts", per the argo-rollouts ApplicationSet's chart
# defaults — verified live: PR #1343's synced resources list this exact SA).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-gatewayapi-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-gatewayapi-plugin
subjects:
  - kind: ServiceAccount
    name: argo-rollouts
    namespace: argo-rollouts
