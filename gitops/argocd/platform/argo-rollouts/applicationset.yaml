# argo-rollouts — controller-only install, no consumers yet.
#
# This brings in the Rollout/AnalysisTemplate/AnalysisRun/Experiment CRDs and
# the controller Deployment so progressive-delivery capability exists on the
# cluster ahead of need. It does NOT convert any app's Deployment to a
# Rollout — every existing Deployment (buzz included) is untouched and keeps
# reconciling exactly as it does today; a Rollout is purely opt-in per-app.
#
# See docs/superpowers/specs/2026-07-31-buzz-argo-rollouts-pilot-scoping.md
# (PR #1342) for the buzz-specific pilot scoping, which is separate follow-up
# work gated on resolving whether block/buzz's chart can render a Rollout
# directly or the Deployment/HTTPRoute rendering needs to be forked locally.
#
# CRDs are chart-managed (installCRDs: true, the chart default) — unlike
# cert-manager/CNPG here, there is no pre-existing out-of-band CRD ownership
# to preserve, so letting the chart own them is safe. No platform-project.yaml
# change needed: apiextensions.k8s.io/CustomResourceDefinition is already
# cluster-whitelisted generically (see clusterResourceWhitelist, issue #459).
#
# Single controller replica for now (chart default is 2/HA) — there is
# nothing depending on this yet, so HA doesn't buy anything; bump to 2 when
# buzz (or another app) actually starts gating promotions on it.
#
# Gateway API traffic-router plugin (added for the whoami pilot, PR follow-up
# to #1343): controller.trafficRouterPlugins only populates the
# argo-rollouts-config ConfigMap's `trafficRouterPlugins` key — the chart does
# NOT auto-generate an initContainer/volume for it. That's fine: for an
# http(s):// location (as opposed to file://) the controller downloads the
# plugin binary itself at startup (confirmed via
# https://argo-rollouts.readthedocs.io/en/stable/features/traffic-management/plugins/ —
# "Argo Rollouts will download the plugin at startup only once but if the pod
# is deleted it will need to download the plugin again on next startup").
# Pinned to the plugin's v0.16.0 release asset (verified via
# `gh api repos/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/tags/v0.16.0`
# — no upstream checksums file is published for this project, so this is
# version-pinned to an immutable release URL, not hash-verified).
#
# The controller's default RBAC has no gateway.networking.k8s.io permissions
# (that's a plugin-specific need, not something the chart grants by default) —
# see gitops/argocd/applications/argo-rollouts-resources.yaml for the
# ClusterRole/ClusterRoleBinding this plugin actually needs to read/patch
# HTTPRoutes.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-rollouts
  namespace: argocd
  labels:
    environment: argo-rollouts
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: argo-rollouts
      labels:
        app: argo-rollouts
      annotations:
        # CRD-bearing controller: lands before app workloads (buzz is
        # sync-wave "2") so the Rollout CRD exists before anything could
        # reference it. Same tier as CNPG/envoy-gateway (-1); no ordering
        # dependency on either.
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: platform-project
      source:
        repoURL: https://argoproj.github.io/argo-helm
        chart: argo-rollouts
        targetRevision: "2.41.1"
        helm:
          version: v3
          values: |
            controller:
              replicas: 1
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
              # Annotation-based scrape in lieu of a ServiceMonitor/PodMonitor
              # (no Prometheus Operator here — see buzz.yaml for the same
              # pattern and the reason).
              podAnnotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8090"
            metrics:
              enabled: true
            # Not installed yet: no operator UI need until a pilot app is
            # actually gating promotions through this controller.
            dashboard:
              enabled: false
            trafficRouterPlugins:
              - name: argoproj-labs/gatewayAPI
                location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.16.0/gatewayapi-plugin-linux-amd64
      destination:
        server: '{{.server}}'
        namespace: argo-rollouts
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
