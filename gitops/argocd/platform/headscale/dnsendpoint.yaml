# headscale DNS — external endpoints published via external-dns's crd source.
#
# - headscale.ipv1337.dev MUST NOT be proxied through Cloudflare Edge (Orange Cloud /
#   cfargotunnel.com): Cloudflare Edge strictly enforces RFC 6455 and strips `Upgrade`
#   headers on HTTP `POST` requests, which breaks Tailscale's TS2021 Noise handshake
#   (`POST /ts2021` with `Upgrade: tailscale-control-protocol`, returning HTTP 500).
#   Instead, publish an unproxied (DNS-only) A record pointing to the platform Envoy
#   Gateway's LAN LoadBalancer VIP (192.168.86.211), where Envoy terminates TLS with a
#   cert-manager Let's Encrypt certificate and passes `tailscale-control-protocol`
#   upgrades directly to Headscale.
# - headplane.ipv1337.dev is a standard web UI and remains proxied via Cloudflare Tunnel.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: headscale-tunnel
  namespace: headscale
  annotations:
    external-dns.alpha.kubernetes.io/sync-enabled: "true"
spec:
  endpoints:
    - dnsName: headscale.ipv1337.dev
      recordType: A
      recordTTL: 60
      targets:
        - 136.115.252.139
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: headplane.ipv1337.dev
      recordType: CNAME
      recordTTL: 1
      targets:
        - 1f7b9704-bb66-41f4-966f-5bb722e3c10e.cfargotunnel.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
