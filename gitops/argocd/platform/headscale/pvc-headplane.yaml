#
# Persists headplane session data and cache. Without this, every Argo sync or
# pod reschedule logs all users out. 512Mi is generous for a single-user
# instance — headplane's session/cache DB is in the low MB range.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headplane-data
  namespace: headscale
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
