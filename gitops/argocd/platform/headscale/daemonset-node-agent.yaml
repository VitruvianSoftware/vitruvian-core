# Unprivileged userspace Tailscale DaemonSet that registers every k3s node
# (fedora, nuc9i5, nuc9i9, james-macbook-pro, james-mbp, james-mbp16, james-mbp32)
# onto the self-hosted Headscale mesh (`https://headscale.ipv1337.dev`) while
# leaving each host's primary `tailscale0` daemon on commercial Tailscale untouched
# as the k3s etcd underlay and break-glass network.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: headscale-node-agent
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale-node-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - operator: Exists
      containers:
        - name: node-agent
          image: tailscale/tailscale:v1.76.6
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: headscale-subnet-router-auth
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.ipv1337.dev --accept-routes=false --hostname=$(NODE_NAME)"
            - name: TS_STATE_DIR
              value: "/var/tmp/headscale-node-agent"
          volumeMounts:
            - name: host-var-tmp
              mountPath: /var/tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: host-var-tmp
          hostPath:
            path: /var/tmp
            type: Directory
