# Unprivileged userspace Tailscale subnet router joined to Headscale and
# advertising homelab LANs (192.168.86.0/24, 10.44.86.0/24) so mobile/external
# clients on cellular data can access homelab services over the Headscale mesh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale-subnet-router
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale-subnet-router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale-subnet-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale-subnet-router
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: subnet-router
          image: tailscale/tailscale:v1.76.6
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: headscale-subnet-router-auth
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.ipv1337.dev --advertise-routes=192.168.86.0/24,10.44.86.0/24 --accept-routes=false --hostname=homelab-subnet-router"
            - name: TS_STATE_DIR
              value: "/tmp/tailscale"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
