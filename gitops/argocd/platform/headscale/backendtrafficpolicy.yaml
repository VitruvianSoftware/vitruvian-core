# Allow Tailscale's TS2021 Noise protocol upgrade (`Upgrade: tailscale-control-protocol`)
# and standard WebSockets (`Upgrade: websocket`) through Envoy Gateway to Headscale.
# Without `tailscale-control-protocol` explicitly listed in `httpUpgrade`, Envoy Gateway
# strips the Upgrade header on `POST /ts2021` and Headscale rejects the handshake with HTTP 500.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: headscale-upgrades
  namespace: headscale
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headscale
  httpUpgrade:
    - type: websocket
    - type: tailscale-control-protocol
