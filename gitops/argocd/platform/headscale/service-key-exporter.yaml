# Cluster-internal only. The prometheus.io annotations put it in the
# Prometheus chart's kubernetes-service-endpoints scrape job (this cluster has
# no prometheus-operator, so a ServiceMonitor would do nothing).
apiVersion: v1
kind: Service
metadata:
  name: headscale-key-exporter
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale-key-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: headscale-key-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
