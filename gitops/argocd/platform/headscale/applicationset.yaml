apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headscale
  namespace: argocd
  labels:
    environment: headscale
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: headscale
      labels:
        app: headscale
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform-project
      source:
        repoURL: https://bjw-s.github.io/helm-charts
        chart: headscale
        targetRevision: "2.0.0"
        helm:
          version: v3
          values: |
            config:
              server_url: https://headscale.lab.ipv1337.dev
              listen_addr: 0.0.0.0:8080
              metrics_listen_addr: 0.0.0.0:9090
              grpc_listen_addr: 0.0.0.0:50443
              dns:
                magic_dns: true
                base_domain: lab.ipv1337.dev
            persistence:
              config:
                enabled: true
                storageClass: local-path
                size: 1Gi
            ingress:
              main:
                enabled: true
                ingressClassName: traefik
                annotations:
                  cert-manager.io/cluster-issuer: letsencrypt-cloudflare
                  external-dns.alpha.kubernetes.io/sync-enabled: "true"
                hosts:
                  - host: headscale.lab.ipv1337.dev
                    paths:
                      - path: /
                        pathType: Prefix
                tls:
                  - secretName: headscale-tls
                    hosts:
                      - headscale.lab.ipv1337.dev
      destination:
        server: '{{.server}}'
        namespace: headscale
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
