apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headscale
  namespace: argocd
  labels:
    environment: headscale
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: headscale
      labels:
        app: headscale
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform-project
      source:
        repoURL: https://charts.gabe565.com
        chart: headscale
        targetRevision: "0.16.0"
        helm:
          version: v3
          values: |
            env:
              HEADSCALE_SERVER_URL: https://headscale.lab.ipv1337.dev
              HEADSCALE_LISTEN_ADDR: 0.0.0.0:8080
              HEADSCALE_METRICS_LISTEN_ADDR: 0.0.0.0:9090
              HEADSCALE_GRPC_LISTEN_ADDR: 0.0.0.0:50443
              HEADSCALE_DNS_MAGIC_DNS: "true"
              HEADSCALE_DNS_BASE_DOMAIN: lab.ipv1337.dev
            persistence:
              config:
                enabled: true
                storageClass: local-path
                size: 1Gi
            ingress:
              main:
                enabled: false
            route:
              main:
                enabled: false
      destination:
        server: '{{.server}}'
        namespace: headscale
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
