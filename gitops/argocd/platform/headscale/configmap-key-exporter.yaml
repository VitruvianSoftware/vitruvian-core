#
# headscale-key-exporter: tells Prometheus when each Headscale credential
# expires, so an expiry is an alert weeks ahead instead of an outage on the
# day. It reads Headscale's own API (the source of truth, not a date written
# down in a README) every few minutes and serves one gauge per credential:
#
#   headscale_credential_expiration_timestamp_seconds{kind, id, name, user, ...}
#     kind="preauthkey"  pre-auth keys (the CI key HEADSCALE_CI_AUTHKEY, the
#                        node agents' key, ...); spent single-use keys skipped
#     kind="apikey"      API keys (Headplane's, and this exporter's own)
#     kind="node"        devices with a login expiry (OIDC logins)
#   headscale_key_exporter_up                       1 if the last read worked
#   headscale_key_exporter_last_success_timestamp_seconds
#   headscale_key_exporter_unreadable_records       records skipped last read
#
# `user` is the Headscale user's name, or its numeric id for a login that has
# no name (OIDC): never an email, since /metrics is unauthenticated.
#
# An expired credential is left out, so its alert resolves at the moment it
# expires. That is deliberate: expiring a key by hand (the way to retire one)
# looks exactly the same to the API, and must clear the alert. The warning a
# month out and the page three days out are the signal; after the date, the
# thing that used the key failing is.
#
# The alert rules (group `headscale`) are in
# gitops/argocd/platform/prometheus/applicationset.yaml; their tests in
# tools/ci/prometheus-rule-tests/headscale.test.yml. Tests for this script:
# bazel test //gitops/argocd/platform/headscale:key_exporter_test, which run
# the code straight out of this ConfigMap.
#
# Stdlib-only Python on a stock image, like alertmanager-ntfy-bridge. Changing
# exporter.py does not restart the pod by itself: bump
# vitruvian.dev/key-exporter-code-version in deployment-key-exporter.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-key-exporter
  namespace: headscale
data:
  exporter.py: |
    """Headscale credential-expiry Prometheus exporter (stdlib only)."""
    import datetime
    import http.server
    import json
    import os
    import socketserver
    import sys
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    HEADSCALE_URL = os.environ.get(
        "HEADSCALE_URL", "http://headscale.headscale.svc.cluster.local:8080"
    ).rstrip("/")
    API_KEY_FILE = os.environ.get("API_KEY_FILE", "/etc/exporter/secrets/api-key")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "9100"))
    REFRESH_SECONDS = int(os.environ.get("REFRESH_SECONDS", "300"))
    # Per request, and for a whole read of every endpoint.
    TIMEOUT_SECONDS = 15
    REFRESH_BUDGET_SECONDS = 120

    METRIC = "headscale_credential_expiration_timestamp_seconds"


    def log(msg):
        print(msg, file=sys.stderr, flush=True)


    def parse_time(value):
        """RFC 3339 (Headscale sends nanoseconds) -> epoch seconds, or None.

        None for a missing value and for the zero time Go uses for "never".
        Raises ValueError for anything else it cannot read.
        """
        if not value:
            return None
        s = value.strip()
        if s.endswith("Z"):
            s = s[:-1] + "+00:00"
        # Python's fromisoformat takes at most 6 fractional digits.
        if "." in s:
            head, rest = s.split(".", 1)
            digits = ""
            while rest and rest[0].isdigit():
                digits, rest = digits + rest[0], rest[1:]
            s = head + "." + (digits + "000000")[:6] + rest
        dt = datetime.datetime.fromisoformat(s)
        if dt.tzinfo is None:
            dt = dt.replace(tzinfo=datetime.timezone.utc)
        if dt.year <= 1:
            return None
        return dt.timestamp()


    def read_api_key():
        """The key, or "" while the Secret is not mounted yet. Other read
        errors (permissions) propagate: they are a broken deployment."""
        try:
            with open(API_KEY_FILE, encoding="utf-8") as f:
                return f.read().strip()
        except FileNotFoundError:
            return ""


    def get(path, api_key):
        req = urllib.request.Request(
            HEADSCALE_URL + path,
            headers={"Authorization": "Bearer " + api_key, "Accept": "application/json"},
        )
        with urllib.request.urlopen(req, timeout=TIMEOUT_SECONDS) as resp:
            return json.load(resp)


    def user_label(u):
        """A user's name, else its id. Never the email: /metrics is open."""
        return u.get("name") or str(u.get("id", ""))


    def collect(fetch, now, skipped=None):
        """Every unexpired credential as (labels, expiry epoch seconds).

        `fetch(path)` returns Headscale's decoded JSON for an /api/v1 path. A
        record whose expiry cannot be read is logged, counted in `skipped`
        (a one-element list) and left out; the rest are still reported.
        """
        if skipped is None:
            skipped = [0]
        out = []

        def expiry(kind, rec, field):
            try:
                return parse_time(rec.get(field))
            except (ValueError, TypeError, AttributeError):
                skipped[0] += 1
                log("skipping " + kind + " id " + str(rec.get("id", "?")) + ": unreadable " + field)
                return None

        users = fetch("/api/v1/user").get("users") or []
        for u in users:
            uid = str(u.get("id", ""))
            uname = user_label(u)
            q = urllib.parse.urlencode({"user": uid})
            for k in fetch("/api/v1/preauthkey?" + q).get("preAuthKeys") or []:
                exp = expiry("preauthkey", k, "expiration")
                if exp is None or exp <= now:
                    continue
                if k.get("used") and not k.get("reusable"):
                    continue  # a spent single-use key can never be used again
                tags = ",".join(sorted(k.get("aclTags") or []))
                out.append((
                    {
                        "kind": "preauthkey",
                        "id": str(k.get("id", "")),
                        "name": tags or "untagged",
                        "user": uname,
                        "reusable": str(bool(k.get("reusable"))).lower(),
                        "ephemeral": str(bool(k.get("ephemeral"))).lower(),
                    },
                    exp,
                ))
        for k in fetch("/api/v1/apikey").get("apiKeys") or []:
            exp = expiry("apikey", k, "expiration")
            if exp is None or exp <= now:
                continue
            out.append((
                {"kind": "apikey", "id": str(k.get("id", "")), "name": k.get("prefix", ""), "user": ""},
                exp,
            ))
        for n in fetch("/api/v1/node").get("nodes") or []:
            exp = expiry("node", n, "expiry")
            if exp is None or exp <= now:
                continue
            out.append((
                {
                    "kind": "node",
                    "id": str(n.get("id", "")),
                    "name": n.get("givenName") or n.get("name") or "",
                    "user": user_label(n.get("user") or {}),
                },
                exp,
            ))
        return out


    def escape(v):
        return str(v).replace("\\", "\\\\").replace("\n", "\\n").replace('"', '\\"')


    def render(credentials, up, last_success, unreadable=0):
        lines = [
            "# HELP " + METRIC + " When a Headscale credential expires (unix seconds).",
            "# TYPE " + METRIC + " gauge",
        ]
        for labels, exp in credentials:
            body = ",".join(k + '="' + escape(v) + '"' for k, v in sorted(labels.items()))
            lines.append(METRIC + "{" + body + "} " + repr(float(exp)))
        lines += [
            "# HELP headscale_key_exporter_up 1 if the last read of the Headscale API worked.",
            "# TYPE headscale_key_exporter_up gauge",
            "headscale_key_exporter_up " + ("1" if up else "0"),
            "# HELP headscale_key_exporter_last_success_timestamp_seconds When the Headscale API was last read successfully.",
            "# TYPE headscale_key_exporter_last_success_timestamp_seconds gauge",
            "headscale_key_exporter_last_success_timestamp_seconds " + repr(float(last_success)),
            "# HELP headscale_key_exporter_unreadable_records Records the last read skipped because their expiry was unreadable.",
            "# TYPE headscale_key_exporter_unreadable_records gauge",
            "headscale_key_exporter_unreadable_records " + str(int(unreadable)),
        ]
        return "\n".join(lines) + "\n"


    class State:
        """Last good credential list. A failed read keeps it (so the expiry
        alerts keep working) and only flips `up` to 0."""

        def __init__(self):
            self.lock = threading.Lock()
            self.credentials = []
            self.up = False
            self.last_success = 0.0
            self.unreadable = 0

        def fail(self, msg):
            log(msg)
            with self.lock:
                self.up = False

        def refresh(self, now=None, clock=time.monotonic):
            now = time.time() if now is None else now
            api_key = read_api_key()
            if not api_key:
                self.fail("no API key at " + API_KEY_FILE + " yet (Secret headscale-key-exporter not sealed?)")
                return
            deadline = clock() + REFRESH_BUDGET_SECONDS

            def fetch(path):
                if clock() > deadline:
                    raise TimeoutError("read took over " + str(REFRESH_BUDGET_SECONDS) + "s")
                return get(path, api_key)

            skipped = [0]
            try:
                creds = collect(fetch, now, skipped)
            except urllib.error.HTTPError as e:
                e.close()
                hint = " (API key expired or revoked?)" if e.code == 401 else ""
                self.fail("Headscale API returned HTTP " + str(e.code) + hint)
                return
            except Exception as e:  # network, timeout, bad JSON
                self.fail("reading the Headscale API failed: " + repr(e))
                return
            with self.lock:
                self.credentials = creds
                self.up = True
                self.last_success = now
                self.unreadable = skipped[0]

        def metrics(self):
            with self.lock:
                return render(self.credentials, self.up, self.last_success, self.unreadable)


    STATE = State()


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body, ctype = b"ok\n", "text/plain"
            elif self.path == "/metrics":
                body = STATE.metrics().encode("utf-8")
                ctype = "text/plain; version=0.0.4; charset=utf-8"
            else:
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            pass  # scrapes every 30s would drown the useful lines


    def refresh_once(state):
        """One loop iteration. Nothing may escape it: if the loop died,
        /metrics would keep serving the last values with up=1. (The alert
        also checks the age of last_success, for anything this misses.)"""
        try:
            state.refresh()
        except Exception as e:
            state.fail("refresh failed unexpectedly: " + repr(e))


    def refresh_loop():
        while True:
            refresh_once(STATE)
            time.sleep(REFRESH_SECONDS)


    class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    if __name__ == "__main__":
        threading.Thread(target=refresh_loop, daemon=True).start()
        log("headscale-key-exporter on :" + str(LISTEN_PORT) + ", reading " + HEADSCALE_URL)
        Server(("", LISTEN_PORT), Handler).serve_forever()
