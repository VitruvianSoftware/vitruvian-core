# headplane Deployment — modern web UI and management dashboard for Headscale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headscale
  labels:
    app: headplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headplane
  template:
    metadata:
      labels:
        app: headplane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane:0.5.4
          env:
            - name: HEADPLANE_LOAD_ENV_OVERRIDES
              value: "true"
            - name: HEADPLANE_SERVER__HOST
              value: "0.0.0.0"
            - name: HEADPLANE_SERVER__PORT
              value: "3000"
            - name: HEADPLANE_HEADSCALE__URL
              value: "http://headscale.headscale.svc.cluster.local:8080"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: headplane-secret
                  key: cookie-secret
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: config
              mountPath: /etc/headplane
              readOnly: true
            - name: data
              mountPath: /var/lib/headplane
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: headplane-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
