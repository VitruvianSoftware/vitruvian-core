# Persistent outbound SSH reverse tunnel connecting in-cluster Envoy Gateway :443
# to the GCP headscale-edge-relay VM (:8443 -> :443 via socat) so cellular and
# external clients can reach headscale.ipv1337.dev across double NAT without
# Cloudflare stripping TS2021 POST Upgrade headers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale-edge-tunnel
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale-edge-tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale-edge-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale-edge-tunnel
    spec:
      containers:
        - name: tunnel
          image: alpine/openssh:latest
          command:
            - /bin/sh
            - -c
            - |
              cp /etc/ssh-key-ro/id_ed25519 /tmp/id_ed25519
              chmod 600 /tmp/id_ed25519
              ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i /tmp/id_ed25519 \
                "tunnel@${HEADSCALE_EDGE_IP}" \
                'for p in $(pgrep -u tunnel sshd 2>/dev/null); do [ "$p" != "$PPID" ] && kill -9 "$p" 2>/dev/null || true; done' || true
              exec ssh \
                -N \
                -o StrictHostKeyChecking=accept-new \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                -o ExitOnForwardFailure=yes \
                -i /tmp/id_ed25519 \
                -R 127.0.0.1:8443:envoy-envoy-gateway-system-platform-f2076d6c.envoy-gateway-system.svc.cluster.local:443 \
                "tunnel@${HEADSCALE_EDGE_IP}"
          env:
            - name: HEADSCALE_EDGE_IP
              valueFrom:
                configMapKeyRef:
                  name: headscale-edge-config
                  key: edge_ip
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/ssh-key-ro
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: headscale-edge-tunnel-ssh
            defaultMode: 0400
