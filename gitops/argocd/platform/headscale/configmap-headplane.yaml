# headplane ConfigMap — server and Headscale integration configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
  labels:
    app: headplane
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      cookie_secure: true
      data_path: "/var/lib/headplane"

    headscale:
      url: "http://headscale.headscale.svc.cluster.local:8080"
