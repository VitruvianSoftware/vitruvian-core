#
# headplane config — non-secret server and Headscale connection settings.
#
# Running in "simple mode": the gabe565 Helm chart configures Headscale via
# env vars, not a config file, so Integrated Mode (config_path /
# config_strict / integration.kubernetes) is unavailable. Simple mode is the
# right call — Headplane connects to Headscale's gRPC/REST API only.
#
# cookie_secret is NOT here — it's a 32-char random value injected from the
# headplane-secret SealedSecret via HEADPLANE_SERVER__COOKIE_SECRET env var.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
  labels:
    app: headplane
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      base_url: "https://headplane.ipv1337.dev"
      cookie_secure: true
      cookie_secret_path: "/var/run/secrets/headplane/cookie-secret"
      data_path: "/var/lib/headplane"

    headscale:
      url: "http://headscale.headscale.svc.cluster.local:8080"
      config_strict: false
