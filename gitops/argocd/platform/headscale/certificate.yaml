# cert-manager Certificate for direct HTTPS termination of headscale.ipv1337.dev
# on the platform Envoy Gateway (DNS-01 via letsencrypt-cloudflare), plus the
# ReferenceGrant allowing the Gateway in envoy-gateway-system to read headscale-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  secretName: headscale-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  dnsNames:
    - headscale.ipv1337.dev
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-tls
  namespace: headscale
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: headscale-tls
