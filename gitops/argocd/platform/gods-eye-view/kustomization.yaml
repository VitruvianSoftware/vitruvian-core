#
# The gods-eye-view Application renders this directory as a Kustomize source
# (gitops/argocd/applications/gods-eye-view.yaml has no `directory:` block), so
# the image the Deployment runs is pinned here by digest. argocd-image-updater
# writes each new digest behind ghcr.io/vitruviansoftware/gods-eye-view:latest
# into `images:` below, on the image-updates/gods-eye-view branch (see
# gitops/argocd/platform/argocd-image-updater/resources/imageupdater-gods-eye-view.yaml),
# and merging that branch's PR rolls the pod out.
#
# secrets.template.yaml documents the sealed secret's keys; it is not a resource
# and is deliberately not listed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - dnsendpoint.yaml
  - httproute.yaml
  - service.yaml
images:
  - name: ghcr.io/vitruviansoftware/gods-eye-view
    newName: ghcr.io/vitruviansoftware/gods-eye-view
    newTag: latest
    digest: sha256:15d475d03254aa6174131c96bd9c834ecf9afadece8acf28f20b71fe5d559e10
