# God's Eye View Deployment — geospatial 3D intelligence console & backend proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-eye-view
  namespace: gods-eye-view
  labels:
    app: gods-eye-view
    app.kubernetes.io/name: gods-eye-view
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gods-eye-view
      app.kubernetes.io/name: gods-eye-view
  template:
    metadata:
      labels:
        app: gods-eye-view
        app.kubernetes.io/name: gods-eye-view
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gods-eye-view
          image: ghcr.io/vitruviansoftware/gods-eye-view:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: gods-eye-view-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
