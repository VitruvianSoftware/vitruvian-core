# ntfy — self-hosted push-notification server for Alertmanager (PR #966) and
# any other in-cluster alert source that needs to reach a phone. Single
# replica: it's a personal alert channel, not a shared system of record, and
# ntfy has no built-in clustering (replicaCount>1 would just split the SQLite
# auth/cache DBs across pods with no coordination). The upstream image runs as
# root by default (no USER in its Dockerfile) — runAsNonRoot here with an
# arbitrary uid/fsGroup instead, since the ntfy binary needs nothing root-only
# once listen-http is off the privileged <1024 range (see configmap.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  # Stop the old pod before starting the new one. ntfy keeps its message
  # cache and its users (auth.db) in SQLite files on one RWO volume. The
  # default RollingUpdate (maxSurge 25%) would start the new version, and run
  # its schema migrations, while the old one still has those files open.
  #
  # maxSurge 0 / maxUnavailable 1 gives the same order as Recreate. Not
  # `type: Recreate`: Argo CD syncs this app with server-side apply, which
  # keeps the API server's defaulted rollingUpdate block, and the API then
  # rejects the Deployment ("rollingUpdate: Forbidden ... when strategy type
  # is 'Recreate'"). That failed the sync after #4667; `rollingUpdate: null`
  # doesn't clear it under server-side apply either (both checked with a
  # server-side dry run on 2026-11-12).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          # Pinned by digest (checked on Docker Hub 2026-11-12). Going back to
          # an older ntfy after this is NOT a plain image revert: v2.31.1
          # moved the message cache schema 16 -> 17, and older versions need
          # `UPDATE schemaVersion SET version = 16 WHERE id = 1` in cache.db
          # first (ntfy release notes). The cache only holds 12h of messages,
          # so deleting cache.db is the simpler way back.
          image: binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
          args: ["serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - name: http
              containerPort: 8080
          # tcpSocket, not an HTTP path: ntfy has no documented, verifiable
          # health-check endpoint (checked config.md, the Dockerfile, and the
          # examples/ dir — none define one), and guessing a path risks a
          # false-negative probe crash-looping a healthy pod.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
            # ntfy writes its PID/runtime state under /var/cache/ntfy even
            # when cache-file/attachment-cache-dir point elsewhere; without a
            # writable mount there readOnlyRootFilesystem crash-loops it.
            - name: tmp-cache
              mountPath: /var/cache/ntfy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: tmp-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
