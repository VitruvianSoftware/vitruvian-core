#
# ntfy server config. auth-default-access: deny-all means every topic is
# unreadable/unwritable until a user is explicitly granted access via
# `ntfy access` (see tools/gitops/ntfy_bootstrap_users.sh) — required because
# base-url is public (ntfy.ipv1337.dev, via the Cloudflare Tunnel), so anyone
# on the internet can reach this server.
# upstream-base-url: ntfy.sh only relays iOS push (APNs requires Apple's own
# cert, which a self-host can't provide); Android delivers directly via a
# foreground "instant delivery" connection and never touches the upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: |
    base-url: "https://ntfy.ipv1337.dev"
    # 8080, not 80: the container runs non-root (no CAP_NET_BIND_SERVICE), and
    # binding <1024 is kernel-enforced regardless of container UID namespace.
    listen-http: ":8080"
    behind-proxy: true
    upstream-base-url: "https://ntfy.sh"
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "12h"
    attachment-cache-dir: "/var/lib/ntfy/attachments"
    auth-file: "/var/lib/ntfy/auth.db"
    auth-default-access: "deny-all"
    enable-signup: false
    enable-login: true
