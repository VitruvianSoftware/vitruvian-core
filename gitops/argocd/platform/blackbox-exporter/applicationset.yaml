#
# blackbox-exporter -- probes public URLs from inside the cluster, so
# Prometheus can page when a site stops answering. Nothing else here watches
# a public URL: uptime-kuma is configured by hand, and the self-hosted Sentry
# runs no uptime checker. Mini Party was down for an hour on 2026-11-19 and
# nothing paged.
#
# Prometheus scrapes it through the 'blackbox-http' job in the prometheus
# appset's extraScrapeConfigs (the target list lives there), and the
# PublicUrlDown rule pages on a failing probe. To watch another URL, add it to
# that job; nothing changes here.
#
# Chart prometheus-blackbox-exporter 11.21.3 (prometheus-community), app
# v0.29.1, namespace monitoring beside Prometheus. fullnameOverride pins the
# Service name the scrape job points at.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blackbox-exporter
  namespace: argocd
  labels:
    environment: monitoring
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: blackbox-exporter
      labels:
        app: blackbox-exporter
      annotations:
        # Alongside Prometheus (wave 0), which scrapes it.
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform-project
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus-blackbox-exporter
        targetRevision: "11.22.0"
        helm:
          version: v3
          values: |
            fullnameOverride: blackbox-exporter
            config:
              modules:
                # A public page or health endpoint answers 2xx over IPv4,
                # after redirects (GitHub Pages sends http to https).
                http_2xx:
                  prober: http
                  timeout: 10s
                  http:
                    preferred_ip_protocol: ip4
                    follow_redirects: true
                    valid_status_codes: []
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            # Keep it on the always-on servers, like the rooms server it
            # watches: a laptop node that sleeps would make every probe fail.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
