# cloudflared config — locally-managed tunnel (config in git, not the CF dashboard).
# Single catch-all -> the platform Gateway LB IP (MetalLB 10.44.86.211, default-pool;
# migration-stable, survives the Cilium cutover which reuses the pool). cloudflared
# preserves the Host header, so the Gateway does all hostname routing via HTTPRoutes;
# only hostnames whose DNS points at this tunnel ever reach here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 1f7b9704-bb66-41f4-966f-5bb722e3c10e
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - service: http://10.44.86.211:80
