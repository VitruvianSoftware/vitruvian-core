#
# OCI registry registration — registers docker.io/envoyproxy as an anonymous
# (public, no-credential) OCI Helm registry so ArgoCD's repo-server pulls the
# gateway-helm chart via `helm pull oci://docker.io/envoyproxy/gateway-helm`.
# REQUIRED: ArgoCD only treats a repoURL as OCI when a matching repository is
# declared with enableOCI=true and type=helm; without it the repoURL is parsed
# as an HTTPS Helm repo and the chart name is dropped from the OCI path
# (envoyproxy/manifests/<v> -> 401). No credentials — docker.io OCI is public.
apiVersion: v1
kind: Secret
metadata:
  name: oci-docker-io-envoyproxy
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: docker-io-envoyproxy
  type: helm
  url: docker.io/envoyproxy
  enableOCI: "true"
