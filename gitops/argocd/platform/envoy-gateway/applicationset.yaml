# envoy-gateway — Gateway API controller (Envoy data plane). Interim GatewayClass
# for the Cilium + Gateway-API migration (Phase 0); Envoy is the same data plane
# Cilium Gateway and GKE Gateway use, so HTTPRoutes carry over to the eventual
# Cilium Gateway (Phase 3). Gateway API CRDs are already installed cluster-wide, so
# this chart installs ONLY the controller (no CRDs).
# See docs/archive/design/cilium-gateway-api-migration.md.
#   chart gateway-helm v1.8.1 (OCI docker.io/envoyproxy), ns envoy-gateway-system.
#   repoURL is SCHEME-LESS on purpose — ArgoCD v3.4 resolves docker.io/<ns> + chart
#   as OCI natively (no repo registration needed); an oci:// scheme makes it drop
#   the chart name from the OCI path and 401.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envoy-gateway
  namespace: argocd
  labels:
    environment: envoy-gateway
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: envoy-gateway
      labels:
        app: envoy-gateway
      annotations:
        # Gateway controller — lands before the Gateway/HTTPRoute resources that
        # depend on it (gateway-resources, wave 1).
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      project: platform-project
      source:
        repoURL: docker.io/envoyproxy
        chart: gateway-helm
        targetRevision: 1.8.3
        helm:
          version: v3
          values: |
            # Controller-only install; defaults suit a homelab. The Gateway
            # data-plane (proxy) Service type + LB IP are set per-Gateway via the
            # EnvoyProxy CR in gateway-resources, not here.
            #
            # HA: 2 controller replicas. Envoy Gateway is leader-elected, so only
            # one reconciles at a time, but a standby gives instant failover when
            # the active node sleeps/reboots (xDS to the proxies keeps serving from
            # the surviving replica). Soft hostname anti-affinity keeps the two off
            # the same node without risking Pending if scheduling is tight.
            deployment:
              replicas: 2
              pod:
                affinity:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          topologyKey: kubernetes.io/hostname
                          labelSelector:
                            matchLabels:
                              control-plane: envoy-gateway
      destination:
        server: '{{.server}}'
        namespace: envoy-gateway-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
