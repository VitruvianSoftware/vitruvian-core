# Gateway `platform` — the shared cluster Gateway. Phase 0b ships an HTTP :80
# listener only: it serves the Cloudflare Tunnel path (cloudflared -> this Gateway;
# TLS terminates at Cloudflare's edge) and any internal HTTP route. An HTTPS :443
# listener with cert-manager-issued certs is added before migrating the production
# TLS apps (argocd/grafana/otel) so they are never downgraded mid-flight.
# allowedRoutes: All — apps in any namespace attach HTTPRoutes to this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
