# Gateway `platform` — the shared cluster Gateway. Exposes HTTP :80 for Cloudflare
# Tunnel ingress and internal HTTP routing, and HTTPS :443 with cert-manager-issued
# TLS certificates for internal production services via ReferenceGrants.
# allowedRoutes: All — apps in any namespace attach HTTPRoutes to this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: "argocd.lab.ipv1337.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-server-tls
            namespace: argocd
      allowedRoutes:
        namespaces:
          from: All
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: "grafana.lab.ipv1337.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-tls
            namespace: grafana
      allowedRoutes:
        namespaces:
          from: All
    - name: https-pushgateway
      protocol: HTTPS
      port: 443
      hostname: "pushgateway.lab.ipv1337.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: pushgateway-tls
            namespace: monitoring
      allowedRoutes:
        namespaces:
          from: All
    - name: https-otel
      protocol: HTTPS
      port: 443
      hostname: "otel.lab.ipv1337.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: otel-tls
            namespace: opentelemetry
      allowedRoutes:
        namespaces:
          from: All
