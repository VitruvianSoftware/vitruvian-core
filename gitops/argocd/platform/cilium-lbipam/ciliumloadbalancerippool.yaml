# Cilium LB-IPAM pool for dev-local LoadBalancer Services — the Cilium-native
# replacement for the MetalLB IPAddressPool. Same 10.44.86.210-.215 range on the
# physical LAN (advertised over tailscale via the 10.44.86.0/24 subnet route).
# Allocation: Envoy is pinned to .211 via lbipam.cilium.io/ips (cloudflared's tunnel
# target); other Services take the lowest free address (Traefik → .210).
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    - start: "10.44.86.210"
      stop: "10.44.86.215"
