# Cilium LB-IPAM pool for dev-local LoadBalancer Services — the Cilium-native
# replacement for the MetalLB IPAddressPool.
# - 10.44.86.210-.215: cluster/tailnet VIP range (Envoy is pinned to .211 for
#   cloudflared's tunnel target; Traefik takes .210).
# - 192.168.86.211: physical home LAN VIP on the 192.168.86.0/24 segment, announced
#   via Cilium L2 ARP on the wired nodes (fedora, nuc9i5, nuc9i9) so LAN/Wi-Fi
#   devices (e.g. phones bootstrapping onto the tailnet via headscale.ipv1337.dev)
#   can reach Envoy Gateway directly on :80/:443 without already being on the tailnet.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    - start: "10.44.86.210"
      stop: "10.44.86.215"
    - start: "192.168.86.211"
      stop: "192.168.86.211"
