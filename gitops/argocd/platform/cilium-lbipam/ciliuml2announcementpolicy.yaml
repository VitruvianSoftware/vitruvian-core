# Cilium L2 (ARP) announcement for LoadBalancer VIPs — the Cilium-native replacement
# for the MetalLB L2Advertisement. ARP is L2 broadcast, so it MUST egress a physical
# LAN NIC on the 10.44.86.0/24 segment, never tailscale0 (an L3 TUN with no broadcast
# domain). Announce only from the wired native nodes that are on the LAN:
# fedora, nuc9i5, nuc9i9. (This also fixes the prior MetalLB SPOF, whose
# L2Advertisement was pinned to fedora + a stale, non-existent `nuc9` node, so only
# fedora actually announced.)
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2
spec:
  # Announce LoadBalancer IPs (the LB-IPAM-assigned VIPs). externalIPs not used here.
  loadBalancerIPs: true
  # Physical LAN NICs only — match the wired interface families, never tailscale0/cilium_*.
  interfaces:
    - "^enp[0-9]+"
    - "^eno[0-9]+"
    - "^eth[0-9]+"
  # Only wired native nodes physically attached to 10.44.86.0/24 may answer ARP.
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
          - fedora
          - nuc9i5
          - nuc9i9
