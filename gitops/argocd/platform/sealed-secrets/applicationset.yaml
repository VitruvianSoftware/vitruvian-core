# sealed-secrets — NEW ArgoCD-native install (not a Pulumi adopt).
# Provides git-safe secret management for the orphaned secrets left by the
# Pulumi->ArgoCD cutover (Cloudflare token, CNPG/Grafana DB credentials):
# secrets are sealed with kubeseal and committed as SealedSecrets, which this
# controller decrypts in-cluster. Pinned to a current chart.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    environment: sealed-secrets
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: sealed-secrets
      labels:
        app: sealed-secrets
      annotations:
        # Controller must exist before any SealedSecret syncs.
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: platform-project
      source:
        repoURL: https://bitnami.github.io/sealed-secrets
        chart: sealed-secrets
        targetRevision: "2.19.1"
        helm:
          version: v3
          values: |
            fullnameOverride: sealed-secrets-controller
            namespace: sealed-secrets
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
      destination:
        server: '{{.server}}'
        namespace: sealed-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
