# INTERNAL umami route — the dashboard on umami.lab.ipv1337.dev, same pattern as
# grafana.lab / argocd.lab (platform-config/lab-internal-*.yaml): an A record to
# the Gateway's private LB IP (dnsendpoint-internal.yaml), so it only resolves
# to something reachable from the LAN or the tailnet, plus an HTTPS listener on
# the platform Gateway (https-umami) with a cert-manager certificate
# (certificate.yaml). No tunnel CNAME exists for this name, so Cloudflare never
# forwards it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-dashboard
  namespace: umami
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - umami.lab.ipv1337.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: umami
          port: 80
          weight: 1
