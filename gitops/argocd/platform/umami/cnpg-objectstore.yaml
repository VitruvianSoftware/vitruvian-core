#
# Where umami-db's Barman Cloud plugin writes WAL and base backups. Same shape
# as buzz-db-backups. The bucket, its policy and the umami-db-backup MinIO user
# (which can reach only this bucket) are declared in minio-amd64's
# applicationset.yaml; the credentials are the umami-db-backup-s3 SealedSecret.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: umami-db-backups
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://umami-db-backups/
    endpointURL: http://minio-amd64.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: umami-db-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: umami-db-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 1
    data:
      compression: gzip
      jobs: 2
