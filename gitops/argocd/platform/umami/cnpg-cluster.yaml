# umami-db — dedicated CloudNativePG Postgres cluster for Umami. Copies the
# buzz-db / backstage-db conventions rather than inventing new ones: 3
# instances spread 1-per-node across WIRED nodes, switchover on primary
# updates, local-path storage, memory request==limit with no cpu limit, and
# Barman Cloud plugin WAL archiving + nightly backups to MinIO
# (cnpg-objectstore.yaml, cnpg-scheduledbackup.yaml). Umami connects via the
# -rw Service at umami-db-rw.umami.svc.cluster.local:5432 with the
# umami-db-credentials Secret (SealedSecret in sealed-secrets-manifests/).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-db
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node.ipv1337.dev/link: wired
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
  # Umami's write load is one INSERT per pageview for a low-traffic site;
  # 512Mi is half the buzz/backstage sizing, still well clear of the <256Mi
  # that OOMKilled buzz-db under load. Memory request==limit, no cpu limit
  # (cpu limits caused CFS throttling kills in zitadel-db/grafana-db).
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 512Mi
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: umami
      owner: umami
      secret:
        name: umami-db-credentials
  postgresql:
    parameters:
      wal_sender_timeout: "600s"
      wal_receiver_timeout: "600s"
      wal_keep_size: "1GB"
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # CNPG defaults this to true; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: umami-db-backups
