#
# Nightly base backup of umami-db to MinIO (s3://umami-db-backups/), matching
# buzz-db. `immediate: true` takes the first one as soon as this is created so
# the backup path is proven the same day.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: umami-db-daily-backup
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
  cluster:
    name: umami-db
