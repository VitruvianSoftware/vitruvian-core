#
# The websites Umami tracks, one per line: "domain" or "domain=id" (with an id,
# the site is created with that id, so its tracker snippet can be committed in
# the same change). Read by the umami-admin-bootstrap PostSync job.
#
# This lives in a plain ConfigMap, not in the job, ON PURPOSE: Argo CD runs a
# PostSync hook only during a sync, and editing a hook does not make the app
# OutOfSync, so a site added to the job itself never got registered
# (mini-games.vitruviansoftware.dev, 2026-11-20). Changing this ConfigMap does
# make the app OutOfSync; auto-sync then runs the sync, and the hook with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: umami-sites
  namespace: umami
data:
  # vitruviansoftware.dev predates the list; its id is in the site's
  # _config.yml. mini-games.vitruviansoftware.dev is Mini Party
  # (apps/web/mini-party/index.html).
  SITES: |
    vitruviansoftware.dev
    mini-games.vitruviansoftware.dev=b59edda9-e89f-414b-abf3-f0a9c8e80932
