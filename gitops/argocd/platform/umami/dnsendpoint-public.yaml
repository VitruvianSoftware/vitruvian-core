# PUBLIC umami DNS — external-dns crd source, same pattern as ntfy/backstage.
# A PROXIED CNAME stats.vitruviansoftware.dev -> <tunnel>.cfargotunnel.com
# routes the hostname through Cloudflare's edge into the tunnel
# (cfargotunnel.com only resolves behind the proxy, so cloudflare-proxied=true
# is REQUIRED). external-dns already manages vitruviansoftware.dev
# (domainFilters in external-dns/applicationset.yaml; backstage/storybook use
# it). What is reachable on this name is limited by httproute-public.yaml.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: umami-tunnel
  namespace: umami
  annotations:
    external-dns.alpha.kubernetes.io/sync-enabled: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  endpoints:
    - dnsName: stats.vitruviansoftware.dev
      recordType: CNAME
      recordTTL: 1
      targets:
        - 1f7b9704-bb66-41f4-966f-5bb722e3c10e.cfargotunnel.com
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
