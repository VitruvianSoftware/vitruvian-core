# umami — git-source Application (raw manifests), same pattern as ntfy.
# Self-hosted, cookieless web analytics for vitruviansoftware.dev.
#
# Two hostnames, deliberately split (see gitops/argocd/platform/umami/):
#   - stats.vitruviansoftware.dev (PUBLIC, Cloudflare Tunnel): ONLY the tracker
#     (/script.js) and the collector (/api/send) are routed. Every other path,
#     including the login page and the rest of the API, 404s at the Gateway.
#   - umami.lab.ipv1337.dev (LAN/tailnet only): the dashboard. Its A record is
#     the Gateway's private LB IP, same pattern as grafana/argocd.lab.
#
# sync-wave 2, same as ntfy: needs the Gateway (envoy-gateway), the tunnel
# (cloudflared), the CNPG operator + Barman plugin, and the umami-* SealedSecrets
# (sealed-secrets-manifests, wave -4) first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/umami
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: umami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
