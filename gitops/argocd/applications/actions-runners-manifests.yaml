# The runners' namespace and egress policy, before the scale set that runs in
# them (platform/actions-runners, wave 2).
# Spec: docs/superpowers/specs/2026-10-19-queue-runners-on-homelab-design.md §5
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actions-runners-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/actions-runners-manifests
    directory:
      recurse: true
      exclude: "BUILD"
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
