# git-source Application for the SealedSecrets (git-safe encrypted secrets for the
# orphaned Cloudflare token + CNPG/Grafana DB credentials). The sealed-secrets
# controller decrypts them in-cluster. Multi-namespace: each SealedSecret carries
# its own namespace (cert-manager / cnpg-cluster / grafana).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-manifests
  namespace: argocd
  labels:
    app: sealed-secrets-manifests
  annotations:
    # After the sealed-secrets controller (-5).
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/sealed-secrets-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
