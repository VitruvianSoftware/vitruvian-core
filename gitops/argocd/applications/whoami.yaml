# whoami — git-source Application (raw manifests; root-platform's include is
# applicationset-only). Part of the Cloudflare Tunnel / Gateway-API migration.
# Also this cluster's first Argo Rollouts pilot (rollout.yaml replaces the old
# Deployment) — see platform/whoami/rollout.yaml for why whoami specifically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Migrated to the fully-scoped per-app project (issue #459); see
  # gitops/argocd/projects/whoami-project.yaml.
  project: whoami-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/whoami
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  # ignoreDifferences uses managedFieldsManagers, not jsonPointers/
  # jqPathExpressions — those were tried first (targeting the HTTPRoute
  # backendRef weight field nested inside the rules list) and confirmed to
  # silently no-op the ENTIRE sync under ServerSideApply: the operation
  # reported "serverside-applied" success every time, but the live object's
  # managedFields kept showing argocd-controller's Apply from over a month
  # earlier. managedFieldsManagers ignores diffs by which controller owns a
  # field instead of by JSON path, so it doesn't touch that bug at all.
  #
  # rollouts-controller is the exact field-manager name the Argo Rollouts
  # controller/gatewayAPI plugin uses for its patches — confirmed empirically
  # via `kubectl get service whoami-stable -o
  # jsonpath='{.metadata.managedFields[*].manager}'` (rollouts-controller
  # also owns that Service's selector). httproute.yaml now writes `weight: 1`
  # explicitly (the Gateway API default for an omitted field) so steady-state
  # git == live and this Application is fully Synced when no canary is
  # running; this ignoreDifferences entry only matters while
  # rollouts-controller actually owns the weight fields mid-canary, so
  # self-heal doesn't fight it.
  #
  # This also needs the cluster's ArgoCD to have server-side diff OFF —
  # managedFieldsManagers is known to stop working when server-side diff is
  # enabled (argo-cd#20178). Confirmed off: no controller.diff.server.side
  # key in the argocd-cmd-params-cm consumed by argocd-application-controller.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: whoami
      managedFieldsManagers:
        - rollouts-controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
