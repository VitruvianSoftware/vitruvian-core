# whoami — git-source Application (raw manifests; root-platform's include is
# applicationset-only). Part of the Cloudflare Tunnel / Gateway-API migration.
# Also this cluster's first Argo Rollouts pilot (rollout.yaml replaces the old
# Deployment) — see platform/whoami/rollout.yaml for why whoami specifically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Migrated to the fully-scoped per-app project (issue #459); see
  # gitops/argocd/projects/whoami-project.yaml.
  project: whoami-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/whoami
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  # HTTPRoute backendRef weight is owned live by the Gateway API traffic-router
  # plugin (see platform/whoami/httproute.yaml, which omits the field from git
  # entirely) — ignore it here so ArgoCD's diff never flags the CRD-defaulted
  # live value as drift. jqPathExpressions, not jsonPointers: jq's `[]`
  # iterates whatever backendRefs exist rather than requiring a fixed index
  # (an RFC 6901 pointer to a not-yet-existing array index silently broke the
  # whole sync — see #1346). Deliberately NOT paired with
  # RespectIgnoreDifferences=true: that sync option strips the ignored path
  # from the applied manifest, which only matters when git declares a value
  # to strip. Git omits weight outright, so there's nothing to strip, and an
  # earlier attempt that combined RespectIgnoreDifferences with an explicit
  # git-side weight silently no-op'd the entire sync under ServerSideApply
  # (verified twice on the real cluster — see httproute.yaml's comment).
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
