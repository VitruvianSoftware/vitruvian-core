# whoami — git-source Application (raw manifests; root-platform's include is
# applicationset-only). Part of the Cloudflare Tunnel / Gateway-API migration.
# Also this cluster's first Argo Rollouts pilot (rollout.yaml replaces the old
# Deployment) — see platform/whoami/rollout.yaml for why whoami specifically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Migrated to the fully-scoped per-app project (issue #459); see
  # gitops/argocd/projects/whoami-project.yaml.
  project: whoami-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/whoami
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  # The Gateway API traffic-router plugin owns the HTTPRoute's backendRef
  # weights live during a canary (see httproute.yaml) — without this, selfHeal
  # would revert every weight change Rollouts makes back to git's 100/0
  # resting value mid-canary, fighting the rollout. RespectIgnoreDifferences
  # (below) is required too, or a routine sync still re-asserts git's value
  # (matches the cnpg-cluster ApplicationSet's identical pattern).
  #
  # jqPathExpressions, NOT jsonPointers: verified live that jsonPointers with
  # an array index that doesn't yet exist on the LIVE object silently breaks
  # ArgoCD's diff/apply for the whole resource (the sync reported "Synced" but
  # the live HTTPRoute never actually changed — backendRefs[1] didn't exist
  # pre-migration, and an RFC 6901 pointer to a missing array index is
  # invalid). jq's `[]` iterates whatever elements exist, so it doesn't have
  # this fixed-index fragility.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
