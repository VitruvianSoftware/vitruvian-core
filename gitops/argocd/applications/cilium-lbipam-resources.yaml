# cilium-lbipam-resources — Cilium LB-IPAM pool + L2 announcement policy (cluster-scoped
# Cilium CRs). Raw manifests, so they ride a git-source Application (the cilium AppSet's
# root-platform include is applicationset-only).
#
# MetalLB→Cilium LB-IPAM cutover is complete (MetalLB removed 2026-06-29), so this is now
# automated with self-heal: ArgoCD keeps the pool/policy converged. (It was intentionally
# manual-sync during the cutover to avoid a dual-announce ARP flap with MetalLB on .211.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-lbipam-resources
  namespace: argocd
  annotations:
    # After the Cilium AppSet (which installs the CRDs + enables lb-ipam/l2-announcements).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/cilium-lbipam
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    # Cluster-scoped CRs; namespace is required by Argo but otherwise inert.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
