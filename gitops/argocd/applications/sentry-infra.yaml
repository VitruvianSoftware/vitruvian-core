# sentry-infra — Wave 1 ArgoCD Application for self-hosted Sentry backing stores
# and routing (CNPG Postgres cluster, Valkey cluster, ClickHouse, Kafka KRaft,
# TLS Certificate, DNS endpoints, and Relay public HTTPRoute).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentry-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: sentry
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/sentry/infra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sentry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
