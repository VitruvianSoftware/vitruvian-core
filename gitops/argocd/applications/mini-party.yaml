# mini-party — git-source Application for the Mini Party rooms server
# (mini-games-rooms.vitruviansoftware.dev), the socket.io relay behind the
# GitHub Pages game's online play.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-party
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: mini-party-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: HEAD
    # Kustomize source: kustomization.yaml in this path lists the manifests
    # and pins the image digest that argocd-image-updater keeps current. No
    # `directory:` block, or ArgoCD would render the files as a plain directory
    # and ignore the pinned image.
    path: gitops/argocd/platform/mini-party
  destination:
    server: https://kubernetes.default.svc
    namespace: mini-party
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
