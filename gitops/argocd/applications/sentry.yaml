# sentry — Wave 2 ArgoCD Application for self-hosted Sentry.
# Deploys upstream Sentry Helm chart 36.0.0 using repo values from
# gitops/argocd/platform/sentry/values.yaml via $values multi-source ref.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: sentry
  sources:
    # Source 1: Upstream Sentry Helm chart.
    - repoURL: https://sentry-kubernetes.github.io/charts
      chart: sentry
      targetRevision: 36.0.0
      helm:
        releaseName: sentry
        valueFiles:
          - $values/gitops/argocd/platform/sentry/values.yaml

    # Source 2: Values file kept in platform/sentry, referenced from source 1 as $values.
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sentry
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
