# Applies the NFS StorageClasses (nfs, nfs-backup) from the csi-driver-nfs
# component's raw manifests. Separate from the driver AppSet so the two classes
# (two shares, different reclaim policies) live as plain manifests. Sync-wave -5:
# after the driver (-6), before any NFS-backed consumer (wave >= 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs-storageclasses
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/csi-driver-nfs/storageclasses
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
