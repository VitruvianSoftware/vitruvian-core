# minio-mcp — git-source Application (raw manifests), same pattern as ntfy.
# A read-only MinIO MCP server (quay.io/minio/aistor/mcp-server-aistor) so MCP
# clients can list buckets and objects in the homelab MinIO.
#
# Reachable only from the LAN and the tailnet, at https://minio-mcp.lab.ipv1337.dev/mcp
# (platform-config/lab-internal-*.yaml, the same way grafana.lab is). The server
# has no login of its own: the tailnet is the only boundary, and the MinIO
# credential it holds (mcp-readonly) can list but not read objects.
#
# sync-wave 2, same as ntfy: needs the Gateway (envoy-gateway) and the
# minio-mcp-credentials SealedSecret + namespace (sealed-secrets-manifests,
# wave -4) first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-mcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/minio-mcp
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
