# vitruvian-relay-spike: the Vitruvian Relay P0 spike server, public at relay-spike.ipv1337.dev.
# Plan: docs/superpowers/plans/2026-11-09-relay-p0-spikes.md. Delete this app
# (and its project and values) when P0 is done.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-spike
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: relay-spike-project
  sources:
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      path: apps/suites/vitruvian-relay/spike/deploy/chart
      helm:
        valueFiles:
          - $values/gitops/argocd/platform/relay-spike/values.yaml
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: relay-spike
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
