# vitruvian-relay: the Vitruvian Relay server, public at relay.ipv1337.dev.
# Plan: docs/superpowers/plans/2026-11-15-relay-p1-single-user-alpha.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: relay-project
  sources:
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      path: apps/suites/vitruvian-relay/relay/deploy/chart
      helm:
        valueFiles:
          - $values/gitops/argocd/platform/relay/values.yaml
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      ref: values
    # relay-db, the database cluster and its backups (sync-waves order them
    # before the chart's Deployment). Only the cnpg-*.yaml files: the folder
    # also holds the chart's values.
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      path: gitops/argocd/platform/relay
      directory:
        include: 'cnpg-*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: relay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
