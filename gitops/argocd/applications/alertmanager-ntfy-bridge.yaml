# alertmanager-ntfy-bridge — git-source Application (raw manifests), same
# pattern as ntfy. No sync-wave dependency: it only needs the
# alertmanager-ntfy-endpoint SealedSecret (sealed-secrets-manifests, wave -4)
# already resolved well before prometheus's own (unwaved, default 0)
# Alertmanager receiver ever tries to call it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-ntfy-bridge
  namespace: argocd
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/alertmanager-ntfy-bridge
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
