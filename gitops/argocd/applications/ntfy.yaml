# ntfy — git-source Application (raw manifests; root-platform's include is
# applicationset-only), same pattern as cloudflared/whoami. Self-hosted push
# notification server standing in for the public ntfy.sh topic that PR #966's
# Alertmanager receiver posts to (see gitops/argocd/platform/ntfy/*.yaml).
# sync-wave 2, same as cloudflared/whoami: needs the Gateway (envoy-gateway)
# and the tunnel (cloudflared) up first for its HTTPRoute/DNSEndpoint to
# resolve. No dependency the other direction — the alertmanager-ntfy-endpoint
# SealedSecret that prometheus's Alertmanager config mounts is created
# out-of-band by tools/gitops:seal-alert-ntfy once this app is live and a
# topic URL exists (same precondition PR #966 already documents).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/ntfy
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ntfy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
