# Off-cluster pg_dump backups (R2) for both CNPG databases — PVCs (nfs-backup) +
# daily CronJobs, in their respective namespaces (cnpg-cluster, grafana). Raw
# multi-namespace manifests under gitops/argocd/platform/db-nfs-backup, applied
# by this git-source Application (like platform-config). Requires the nfs-backup
# StorageClass (csi-driver-nfs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-nfs-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/db-nfs-backup
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
