# argo-rollouts-resources — RBAC the Gateway API traffic-router plugin needs
# that the argo-rollouts chart doesn't grant by default (gateway.networking.k8s.io
# httproutes get/patch/update). Raw manifests, same shape as
# envoy-gateway-resources.yaml: the chart's own ApplicationSet can't render
# these, so they ride a separate git-source Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-resources
  namespace: argocd
  annotations:
    # After the controller + its ServiceAccount exist (argo-rollouts AppSet is
    # sync-wave "-1"), before any app's Rollout might need this RBAC (whoami is
    # sync-wave "2").
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
    targetRevision: main
    path: gitops/argocd/platform/argo-rollouts/gateway-rbac
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
