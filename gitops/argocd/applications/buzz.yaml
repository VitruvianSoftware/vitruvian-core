# buzz — ArgoCD Application for the Buzz relay (block/buzz).
# Uses the upstream OCI Helm chart with homelab-specific values.
# Prerequisite: buzz-secrets SealedSecret (sealed-secrets-manifests/) and
# buzz-db CNPG cluster (platform/buzz/) must exist in the buzz namespace.
#
# Values live in gitops/argocd/platform/buzz/values.yaml (source 2, referenced
# by source 1 via the `$values` ref), not inline here — argocd-image-updater's
# git write-back needs a real file to patch `image.tag`/digest against, which
# an inline `helm.values` string embedded in this Application can't be. The
# file is excluded from source 2's own directory-recurse render (see
# `directory.exclude` below) so it's read as a values file only, never applied
# as a raw manifest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buzz
  namespace: argocd
  annotations:
    # Sync after platform infra (CNPG cluster, sealed secrets) is ready.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: buzz-project
  sources:
    # Source 1: Upstream Buzz Helm chart from GHCR.
    - repoURL: ghcr.io/block/buzz/charts
      chart: buzz
      targetRevision: 0.1.7
      helm:
        releaseName: buzz
        valueFiles:
          - $values/gitops/argocd/platform/buzz/values.yaml

    # Source 2: Platform manifests (DNSEndpoint, CNPG cluster) and the buzz
    # Helm values file, referenced from source 1 as `$values`.
    - repoURL: https://github.com/VitruvianSoftware/vitruvian-core.git
      targetRevision: main
      path: gitops/argocd/platform/buzz
      ref: values
      directory:
        recurse: true
        exclude: values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: buzz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
