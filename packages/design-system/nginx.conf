# Storybook SPA nginx config — `storybook build` produces a Single Page
# Application (index.html + iframe.html + assets/), not individual HTML files
# per story. Without try_files, direct navigation to deep-link paths like
# /?path=/story/components-button--primary returns 404 from nginx's default
# config because no physical file exists at that path.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed build assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML and JSON metadata — always revalidate so new deploys are picked up.
    location ~* \.(html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
