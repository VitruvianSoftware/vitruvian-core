# CI of the vitruvian-sdk mirror. This file is written in vitruvian-core at
# packages/vitruvian-sdk/.github/workflows/ci.yml and reaches the mirror's root
# with every Copybara export; it runs only there. vitruvian-core builds and
# tests the same package with Bazel; this checks what a person who clones the
# mirror gets: SwiftPM, and Cargo (verification/Cargo.toml) for the checks.
#
# Rust 1.75.0, the version vitruvian-core's Bazel builds the same checks with
# (rust.toolchain in its MODULE.bazel). The runners come with rustup.
#
# GitHub-hosted runners, free for a public repository. The Swift job uses the
# runner's default Xcode and prints its version, because that is the Swift a
# person with a current Mac has.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Which Swift
        run: swift --version

      - name: Build everything, and the tests
        run: swift build --build-tests

      # The Swift samples as tool folders: the manifest and bin/tool.
      # RunTests and the conformance run below need them built.
      - name: Make the sample folders
        run: |
          bin="$(swift build --show-bin-path)"
          for sample in hello-swift:HelloSwiftSample hello-panel-swift:HelloPanelSwiftSample front-window:FrontWindowSample; do
            folder="$RUNNER_TEMP/built/${sample%%:*}"
            mkdir -p "$folder/bin"
            cp "samples/${sample%%:*}/vitruvian-tool.json" "$folder/"
            cp "$bin/${sample#*:}" "$folder/bin/tool"
          done

      - name: swift test
        run: |
          bin="$(swift build --show-bin-path)"
          VITRUVIAN_TOOL_BINARY="$bin/vitruvian-tool" \
          VITRUVIAN_HELLO_SWIFT="$RUNNER_TEMP/built/hello-swift/vitruvian-tool.json" \
            swift test --skip-build

      - name: Rust 1.75.0
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          rustup default 1.75.0

      - name: The Swift samples, built, against the conformance validator
        run: |
          cargo test --manifest-path verification/Cargo.toml --test samples_test -- \
            "$RUNNER_TEMP/built/hello-swift/vitruvian-tool.json" \
            "$RUNNER_TEMP/built/hello-panel-swift/vitruvian-tool.json" \
            "$RUNNER_TEMP/built/front-window/vitruvian-tool.json"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 1.75.0
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          rustup default 1.75.0

      # The examples against the schemas, the conformance validator against
      # the two reference tools and the tools that each break it in one way,
      # every sample's manifest and the Python sample, and the templates
      # `init` holds against the samples. Standard library only: --locked
      # holds Cargo to the committed Cargo.lock, and there is nothing to
      # fetch. No Mac needed.
      - name: The protocol, the conformance validator, the samples and the templates
        run: |
          cargo test --locked --manifest-path verification/Cargo.toml
          cargo run --locked --manifest-path verification/Cargo.toml --bin sync-templates -- --check
