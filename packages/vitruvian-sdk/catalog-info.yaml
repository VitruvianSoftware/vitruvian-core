apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vitruvian-sdk
  description: JSON-RPC extension protocol, multi-language tool kits (Swift, Go, Rust, Python, TypeScript), conformance validator, and CLI for Vitruvian Atrium extensions.
  tags:
    - swift
    - go
    - rust
    - python
    - typescript
    - sdk
    - extensions
    - protocol
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/source-location: url:https://github.com/VitruvianSoftware/vitruvian-core/tree/main/packages/vitruvian-sdk
    vitruvian.dev/bazel-target: //packages/vitruvian-sdk:VitruvianToolKit, //packages/vitruvian-sdk:VitruvianToolProtocol, //packages/vitruvian-sdk/go/toolkit:toolkit, //packages/vitruvian-sdk/kits/rust:vitruvian_tool_kit, //packages/vitruvian-sdk:vitruvian_tool_kit, //packages/vitruvian-sdk/kits/typescript:tool-kit-typescript
spec:
  type: library
  lifecycle: production
  owner: platform-team
