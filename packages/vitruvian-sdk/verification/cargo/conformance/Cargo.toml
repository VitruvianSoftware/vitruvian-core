# The conformance validator, a member of verification/Cargo.toml. Its
# sources are conformance/src, which the package's BUILD builds as
# :conformance_rs_lib and :conformance. The manifest sits here, not in
# conformance/, so that every Cargo file of the checks is under one folder.

[package]
name = "vitruvian-sdk-conformance"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "conformance_rs_lib"
path = "../../../conformance/src/lib.rs"

[[bin]]
name = "conformance"
path = "../../../conformance/src/main.rs"
