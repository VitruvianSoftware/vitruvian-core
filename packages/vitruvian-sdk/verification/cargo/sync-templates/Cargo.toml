# The template writer, a member of verification/Cargo.toml. Its sources are
# samples/src, which the package's BUILD builds as :sync_templates_rs_lib and
# :sync-templates; its unit tests are :templates_in_sync_test. No Cargo.toml
# may sit in samples/ itself: Cargo would take it for the workspace of the
# Rust samples in the folders below it, and refuse to build them.

[package]
name = "vitruvian-sdk-sync-templates"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "sync_templates_rs_lib"
path = "../../../samples/src/lib.rs"

[[bin]]
name = "sync-templates"
path = "../../../samples/src/main.rs"
