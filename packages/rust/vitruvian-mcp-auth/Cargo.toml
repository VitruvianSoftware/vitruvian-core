# Token checking for the Vitruvian MCP servers that sit behind Zitadel: the
# Relay and the Slack MCP. One verifier that accepts several client ids, so a
# server can serve more than one sign-in client.
#
# Its own empty [workspace], like vitruvian-slack-mcp's, so cargo does not read
# this crate as an unlisted member of the repo-root workspace when a server
# path-depends on it. It has no lock of its own: each server locks it with its
# own crates and BUILD builds it once per crate hub. After changing a
# dependency here, re-lock every server that uses it:
#   bazel run //tools/crates:lock -- --dir apps/suites/vitruvian-relay
#   bazel run //tools/crates:lock -- --dir apps/mcp/vitruvian-slack-mcp/rs
#
# The Slack MCP's standalone repo carries a copy of this crate at mcp-auth/
# (tools/copybara/copy.bara.sky exports it there), so its image builds alone.
[workspace]

[package]
name = "vitruvian-mcp-auth"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[lib]
name = "vitruvian_mcp_auth"
path = "src/lib.rs"

[dependencies]
ring = "0.17"
# The same TLS stack as vitruvian-slack-mcp: rustls on ring only, roots from
# rustls-native-certs 0.8, and ureq without its `native-certs` feature (that
# one pulls rustls-native-certs 0.7 and the unmaintained rustls-pemfile,
# RUSTSEC-2025-0134).
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
