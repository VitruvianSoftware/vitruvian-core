# Token checking for the Vitruvian MCP servers that sit behind Zitadel: the
# Relay today, the Slack MCP once it moves over. One verifier that accepts
# several client ids, so a server can serve more than one sign-in client.
#
# Its own empty [workspace], like vitruvian-slack-mcp's, so cargo does not read
# this crate as an unlisted member of the repo-root workspace when the relay
# path-depends on it. Its dependencies are locked and built through the relay's
# hub (@vitruvian_relay_crates): re-lock with
#   bazel run //tools/crates:lock -- --dir apps/suites/vitruvian-relay
[workspace]

[package]
name = "vitruvian-mcp-auth"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[lib]
name = "vitruvian_mcp_auth"
path = "src/lib.rs"

[dependencies]
ring = "0.17"
# The same TLS stack as vitruvian-slack-mcp: rustls on ring only, roots from
# rustls-native-certs 0.8, and ureq without its `native-certs` feature (that
# one pulls rustls-native-certs 0.7 and the unmaintained rustls-pemfile,
# RUSTSEC-2025-0134).
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
