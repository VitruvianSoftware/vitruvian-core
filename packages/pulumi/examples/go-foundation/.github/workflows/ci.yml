# Repository CI — validates the reference foundation codebase itself.
#
# This is NOT the deployment pipeline. The deployment pipeline templates
# (pulumi preview on PRs, pulumi up on merges) live in build/ and
# are copied into the operator's per-stage repositories during onboarding.
# See ONBOARDING.md for details.
#
# Templates:
#   build/pulumi-preview.yml  — runs pulumi preview on PRs
#   build/pulumi-up.yml       — runs pulumi up on merges

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build: ${{ matrix.stage }}"
    runs-on: ubuntu-latest
    env:
      # Dependencies now resolve from the Go module proxy via tagged
      # versions (go/pkg/*/v0.2.0) — no local replace directives needed.
      GOWORK: "off"
      GONOSUMCHECK: "github.com/VitruvianSoftware/*"
      GONOSUMDB: "github.com/VitruvianSoftware/*"
      GOPRIVATE: "github.com/VitruvianSoftware/*"
    strategy:
      fail-fast: false
      matrix:
        stage:
          - 0-bootstrap
          - 1-org
          - 2-environments
          - 3-networks-hub-and-spoke
          - 3-networks-svpc
          - 4-projects
          - 5-app-infra
    steps:
      - name: Checkout foundation
        uses: actions/checkout@v4

      - name: Configure Go private modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # A stage is NOT itself a Go module -- only 0-bootstrap happens to be.
          # The other six keep their modules one level down (modules/, envs/*/,
          # business_unit_*/), so `${{ matrix.stage }}/go.mod` does not exist and
          # setup-go failed before a single line was compiled:
          #   The specified go version file at: 3-networks-hub-and-spoke/go.mod
          #   does not exist
          # Six of the seven stages had therefore never actually been built.
          # 0-bootstrap anchors the toolchain version instead: it is a real
          # module, and all 27 modules here declare the same `go` directive.
          go-version-file: 0-bootstrap/go.mod
          cache-dependency-path: ${{ matrix.stage }}/**/go.sum

      - name: Build every module in the stage
        working-directory: ${{ matrix.stage }}
        # One step rather than four, because the unit of work is a MODULE and a
        # stage holds several; each module path is grouped so a failure still
        # names exactly where it happened.
        run: |
          set -euo pipefail
          mods="$(find . -name go.mod -not -path './.*' | sort)"
          # A stage matching no module means the layout moved again. Failing
          # loudly is the point: the previous version of this job hit that
          # condition as a setup error, and the six stages it silently never
          # built are the reason this check exists.
          if [ -z "$mods" ]; then
            echo "::error::no Go module found under $PWD -- the stage layout changed and this matrix no longer matches it"
            exit 1
          fi
          echo "$mods" | while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            (
              cd "$dir"
              go mod tidy
              go vet ./...
              go build ./...
              go test ./... -race -count=1
            )
            echo "::endgroup::"
          done
