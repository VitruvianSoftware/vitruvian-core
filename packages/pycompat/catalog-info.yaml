# One package, two Rust crates (vitruvian-pycompat and vitruvian-pyjson), so
# one catalog file with one entity per crate, matching packages/design-system.

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vitruvian-pycompat
  description: Standard-library-only Rust crate reproducing Python string, error, JSON, argparse, and Unicode character-table behavior for ported CLI tools, plus an HTTP client that keeps tokens off the command line.
  tags:
    - rust
    - python-compat
    - json
    - argparse
    - unicode
    - http
    - curl
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/source-location: url:https://github.com/VitruvianSoftware/vitruvian-core/tree/main/packages/pycompat/vitruvian-pycompat
    vitruvian.dev/bazel-target: //packages/pycompat/vitruvian-pycompat:vitruvian_pycompat
spec:
  type: library
  lifecycle: production
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: vitruvian-pyjson
  description: Serde-backed JSON parser and Python-compatible value formatter preserving key insertion order and duplicate-key override rules.
  tags:
    - rust
    - json
    - python-compat
    - serde
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/source-location: url:https://github.com/VitruvianSoftware/vitruvian-core/tree/main/packages/pycompat/vitruvian-pyjson
    vitruvian.dev/bazel-target: //packages/pycompat/vitruvian-pyjson:vitruvian_pyjson
spec:
  type: library
  lifecycle: production
  owner: platform-team
