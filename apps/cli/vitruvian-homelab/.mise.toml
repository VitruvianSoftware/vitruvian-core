[env]
BINARY = "homelab"
CRATE = "vitruvian_homelab_rs"

[tools]
rust = "stable"

[tasks.build]
description = "Build the binary for the current platform"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo none)
DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
mkdir -p dist
rustc --edition 2021 --crate-type lib --crate-name $CRATE -Copt-level=3 rs/src/lib.rs -o dist/lib${CRATE}.rlib
HOMELAB_VERSION="$VERSION" HOMELAB_COMMIT="$COMMIT" HOMELAB_DATE="$DATE" \
  rustc --edition 2021 -Copt-level=3 --extern ${CRATE}=dist/lib${CRATE}.rlib rs/src/main.rs -o $BINARY
"""

[tasks.install]
description = "Build and install to /usr/local/bin"
run = """
mise run build
install -m 0755 $BINARY /usr/local/bin/$BINARY
"""

[tasks.test]
description = "Run all tests"
run = """
mkdir -p dist
rustc --edition 2021 --test rs/src/lib.rs -o dist/vitruvian_homelab_test
./dist/vitruvian_homelab_test
"""

[tasks.lint]
description = "Check warnings across library and binary targets"
run = """
mkdir -p dist
rustc --edition 2021 --crate-type lib --crate-name $CRATE -D warnings rs/src/lib.rs -o dist/lib${CRATE}.rlib
rustc --edition 2021 -D warnings --extern ${CRATE}=dist/lib${CRATE}.rlib rs/src/main.rs --emit=metadata -o dist/main.rmeta
"""

[tasks.fmt]
description = "Format all Rust source files"
run = "rustfmt --edition 2021 rs/src/*.rs"

[tasks.clean]
description = "Remove build artifacts"
run = """
rm -f $BINARY
rm -rf dist/
"""
