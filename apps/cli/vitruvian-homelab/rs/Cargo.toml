# Native Rust implementation of the `homelab` k3s cluster operations CLI.
#
# Its own workspace and Cargo.lock, apart from the root one, so
# apps/cli/vitruvian-homelab stays self-contained. Bazel reads this lock
# through the @vitruvian_homelab_crates hub (MODULE.bazel). Re-lock with:
#   bazel run //tools/crates:lock -- --dir apps/cli/vitruvian-homelab/rs

[workspace]

[package]
name = "homelab"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Declaratively provision and manage multi-node Kubernetes homelab clusters on macOS"
publish = false

[lib]
name = "homelab_rs"
path = "src/lib.rs"

[[bin]]
name = "homelab"
path = "src/main.rs"

[dependencies]
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "ureq"] }

[profile.release]
opt-level = 3
