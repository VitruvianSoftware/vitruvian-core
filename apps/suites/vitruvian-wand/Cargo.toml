# Vitruvian Wand's standalone Cargo workspace, read by MODULE.bazel into @vitruvian_wand_crates.
# Built with the gated Rust 1.98.1 toolchain (//apps/suites/vitruvian-wand/build:defs.bzl).
# Re-lock with: bazel run //tools/crates:lock -- --dir apps/suites/vitruvian-wand

[workspace]
resolver = "2"
members = [
    "build/smoke",
    "core",
    "desktop",
    "android/jni",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
android_logger = "0.15"
btleplug = "0.13"
core-foundation = "0.10"
core-graphics = "0.25"
dbus = { version = "0.9", features = ["vendored"] }
eframe = "0.37"
egui = "0.37"
evdev = "0.13"
futures = "0.3"
jni = "0.22"
log = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = "0.3"
sentry = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
uuid = "1"
