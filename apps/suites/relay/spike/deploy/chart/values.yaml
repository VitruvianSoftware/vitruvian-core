# Defaults for the relay spike chart. The live values (image digest, Zitadel
# ids) are set in gitops/argocd/platform/relay-spike/values.yaml.

image:
  repository: ghcr.io/vitruviansoftware/relay-spike
  # Required: "main@sha256:..." or "sha256:...". Never a tag.
  digest: ""
  pullPolicy: IfNotPresent

# Public hostname (must be under ipv1337.dev for external-dns).
hostname: relay-spike.ipv1337.dev

# The Cloudflare Tunnel the DNSEndpoint CNAMEs to. Same value as
# gitops/argocd/platform/cloudflared/configmap.yaml.
tunnel:
  id: 1f7b9704-bb66-41f4-966f-5bb722e3c10e

oidc:
  issuer: https://auth.ipv1337.dev
  # All required, from the zitadel-apps-relay stack's outputs.
  projectId: ""
  # Comma-separated: relay-claude (and relay-chatgpt once it exists).
  mcpClientIds: ""
  connectorClientId: ""
  # Comma-separated Zitadel user ids allowed in (the only identity check
  # beyond the client pin; aud is caller-authored in this instance).
  allowedSubjects: ""

terminationGracePeriodSeconds: 10

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
