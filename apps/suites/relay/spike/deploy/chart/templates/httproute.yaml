# Public paths only. /healthz stays off the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "relay-spike.name" . }}
  labels: {{- include "relay-spike.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/mcp"
        - path:
            type: PathPrefix
            value: "/.well-known/oauth-protected-resource"
        - path:
            type: Exact
            value: "/connect"
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "relay-spike.name" . }}
          port: 80
          # Explicit: unset weight makes Argo CD report permanent OutOfSync.
          weight: 1
