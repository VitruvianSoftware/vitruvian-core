# Always on: the pod may resolve DNS and make HTTPS calls out (Zitadel's public
# keys are fetched through Cloudflare), nothing else. "world", not CIDRs,
# because the IdP resolves to Cloudflare IPv6. Same shape as mcp-slack's.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "relay-spike.name" . }}-egress
  labels: {{- include "relay-spike.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {{- include "relay-spike.selectorLabels" . | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
