apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay-spike.name" . }}
  labels: {{- include "relay-spike.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "relay-spike.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "relay-spike.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay-spike
          image: {{ include "relay-spike.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: {{ printf "https://%s" .Values.hostname | quote }}
            - name: ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: PROJECT_ID
              value: {{ required "oidc.projectId is required (zitadel-apps-relay output projectId)" .Values.oidc.projectId | quote }}
            - name: MCP_CLIENT_IDS
              value: {{ required "oidc.mcpClientIds is required (zitadel-apps-relay output claudeClientId)" .Values.oidc.mcpClientIds | quote }}
            - name: CONNECTOR_CLIENT_ID
              value: {{ required "oidc.connectorClientId is required (zitadel-apps-relay output connectorClientId)" .Values.oidc.connectorClientId | quote }}
            - name: ALLOWED_SUBJECTS
              value: {{ required "oidc.allowedSubjects is required: an empty list would admit every account in the instance" .Values.oidc.allowedSubjects | quote }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
