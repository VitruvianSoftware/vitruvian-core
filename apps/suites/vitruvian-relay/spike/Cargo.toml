# The Vitruvian Relay P0 spike server. Its own workspace and lock file, like
# vitruvian-slack-mcp, because its image builds with cargo. It reuses
# vitruvian-slack-mcp's token verifier through a path dependency (and through
# //apps/mcp/vitruvian-slack-mcp:vitruvian_slack_mcp_lib under Bazel) rather
# than copying it.
# Re-lock: bazel run //tools/crates:lock -- --dir apps/suites/vitruvian-relay/spike

[workspace]

[package]
name = "vitruvian-relay-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.75.0"
publish = false
license = "MIT"

[lib]
name = "vitruvian_relay_spike"
path = "src/lib.rs"

[[bin]]
name = "vitruvian-relay-spike"
path = "src/main.rs"

# The spike's test client (spikes B and C). Not in the image.
[[bin]]
name = "vitruvian-relay-spike-client"
path = "src/client_main.rs"

[dependencies]
vitruvian-slack-mcp = { path = "../../../mcp/vitruvian-slack-mcp/rs" }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The client's HTTPS and TLS: the same ureq and rustls (ring only) that
# vitruvian-slack-mcp already brings in, so no new crates in the lock file.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# handshake only: derive_accept_key for the server, and the blocking client
# handshake over our own TLS stream for vitruvian-relay-spike-client. No bundled TLS.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
