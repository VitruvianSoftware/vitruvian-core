# vrelay: the connector that runs on the Mac: sign-in, the device key, token
# refresh, the rules, the bridge to desktop-commander, and the WebSocket link
# to the relay (`vrelay run`). The installer is scripts/ (`:install`).
# The crates are named here so the @vitruvian_relay_crates hub exposes them
# (it only labels crates a workspace member names itself).
[package]
name = "vitruvian-relay-connector"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[lib]
name = "vitruvian_relay_connector"
path = "src/lib.rs"

[[bin]]
name = "vrelay"
path = "src/main.rs"

[dependencies]
vitruvian-relay-protocol = { path = "../protocol" }
# The shared TLS setup (rustls on ring, the system's certificates).
vitruvian-mcp-auth = { path = "../../../../packages/rust/vitruvian-mcp-auth" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same features as the relay's (they unify through the crate hub). No
# `test-util`: it would unify into the production build.
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The relay's version (one lock). `connect` dials; `__rustls-tls` is what
# exposes `Connector::Rustls` for config.rs's TLS setup without bringing its
# own root-store crates (the `rustls-tls-*-roots` features would).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["__rustls-tls", "connect", "handshake"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# The login Keychain holds the sign-in and the device key (secrets.rs). Only
# on a Mac: elsewhere the secrets stay in files, so CI on Linux never builds it.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
