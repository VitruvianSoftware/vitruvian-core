# vrelay: the connector that runs on the Mac. This task adds sign-in, the
# device key and token refresh; the WebSocket bridge and install come later.
# The crates are named here so the @vitruvian_relay_crates hub exposes them
# (it only labels crates a workspace member names itself).
[package]
name = "vitruvian-relay-connector"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[lib]
name = "vitruvian_relay_connector"
path = "src/lib.rs"

[[bin]]
name = "vrelay"
path = "src/main.rs"

[dependencies]
vitruvian-relay-protocol = { path = "../protocol" }
base64 = "0.22"
libc = "0.2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
