# vrelay's own pnpm workspace, apart from the repo root's: it holds only the
# pinned desktop-commander, so that package's dependency tree lives in this
# folder's pnpm-lock.yaml and can never move a version in the main workspace
# (One Version Rule: a separate hub, @vrelay_npm in MODULE.bazel, is the
# sanctioned way to diverge). This file makes the folder a workspace root, so
# pnpm stops here instead of joining the root workspace.
# Re-lock: bazel run //tools/pnpm:lock -- --dir apps/suites/vitruvian-relay/connector/dc
packages:
  - "."
# No package runs install scripts (desktop-commander's postinstall reports the
# install over HTTPS). rules_js requires this to be stated.
onlyBuiltDependencies: []
