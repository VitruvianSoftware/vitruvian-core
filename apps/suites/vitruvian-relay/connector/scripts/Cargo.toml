# The installer for vrelay: `bazel run //apps/suites/vitruvian-relay/connector/scripts:install`
# (and `:uninstall`). A workspace member so its crates come from the
# @vitruvian_relay_crates hub, which only labels crates a member names itself.
[package]
name = "vitruvian-relay-install"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[lib]
name = "vrelay_install"
path = "src/lib.rs"

[[bin]]
name = "vrelay-install"
path = "src/main.rs"

[dependencies]
vitruvian-relay-connector = { path = ".." }
libc = "0.2"
serde_json = "1"
