# Envoy drops an idle upstream connection to the relay before the relay does.
# The relay closes a connection idle for 75 s (header_read_timeout, src/http.rs);
# Envoy Gateway's default upstream idle timeout is 1 h, so without this Envoy
# now and then sends a request down a connection the relay just closed, and the
# caller gets a 503. cloudflared does not talk to the pod: it goes to the
# Gateway (gitops/argocd/platform/cloudflared/configmap.yaml), so this is the
# only pool in front of the relay. An upgraded /connect WebSocket is an active
# stream, so this does not close it. Field per Envoy Gateway 1.10's
# BackendTrafficPolicy CRD (spec.timeout.http.connectionIdleTimeout).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "vitruvian-relay.name" . }}
  labels: {{- include "vitruvian-relay.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "vitruvian-relay.name" . }}
  timeout:
    http:
      connectionIdleTimeout: {{ include "vitruvian-relay.upstreamIdleTimeout" . | quote }}
