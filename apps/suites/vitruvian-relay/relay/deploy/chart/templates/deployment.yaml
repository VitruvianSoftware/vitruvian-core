# One replica, replaced with Recreate rather than rolled: the relay holds each
# device's /connect WebSocket in memory, so two relays at once would split
# devices between them. The old relay also owned devices.json, so two would race
# on the file; the new one keeps devices in Postgres (relay-db, a CloudNativePG
# cluster from gitops/argocd/platform/relay/) and does not.
#
# Two modes, by value, so this chart can be deployed before the new image
# exists: database.enabled and persistence.enabled (the old relay's file at
# /data); see values.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vitruvian-relay.name" . }}
  labels: {{- include "vitruvian-relay.labels" . | nindent 4 }}
  {{- if .Values.database.enabled }}
  annotations:
    # After the database cluster (wave 0) is healthy: the relay's first act is
    # to connect and migrate.
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "vitruvian-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vitruvian-relay.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      # fsGroup: the pod runs as UID 10001 and a fresh NFS volume starts
      # root-owned, so the group is what lets the relay write devices.json.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vitruvian-relay
          image: {{ include "vitruvian-relay.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The names src/config.rs reads.
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: {{ printf "https://%s" .Values.hostname | quote }}
            - name: ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: PROJECT_ID
              value: {{ required "oidc.projectId is required (zitadel-apps-relay output projectId)" .Values.oidc.projectId | quote }}
            - name: MCP_CLIENT_IDS
              value: {{ required "oidc.mcpClientIds is required: comma-separated zitadel-apps-relay outputs claudeV2ClientId, geminiV2ClientId, chatgptV2ClientId (each one configured)" .Values.oidc.mcpClientIds | quote }}
            - name: CONNECTOR_CLIENT_ID
              value: {{ required "oidc.connectorClientId is required (zitadel-apps-relay output connectorV2ClientId)" .Values.oidc.connectorClientId | quote }}
            {{- include "vitruvian-relay.whoMaySignIn" . }}
            {{- with .Values.oidc.allowedSubjects }}
            {{- /* The old relay's check: a list of Zitadel user ids. */}}
            - name: ALLOWED_SUBJECTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.requiredRole }}
            - name: REQUIRED_ROLE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.dashboardClientId }}
            - name: DASHBOARD_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.mcpClientLabels }}
            {{- /* What the dashboard calls each AI app: Label=<client id>, in label order. */}}
            - name: MCP_CLIENT_LABELS
              value: {{ include "vitruvian-relay.mcpClientLabels" . | quote }}
            {{- end }}
            {{- if .Values.appSignin.enabled }}
            {{- /* App sign-in: the relay is an OAuth server for AI apps such as Gemini. */}}
            - name: APPS_CLIENT_ID
              value: {{ include "vitruvian-relay.appsClientId" . | quote }}
            # 32 random bytes, base64: the key the relay seals its sign-in
            # state and codes with. Sealed secret in the relay namespace
            # (gitops/argocd/platform/sealed-secrets-manifests).
            - name: APP_SIGNIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSignin.secretName | quote }}
                  key: {{ .Values.appSignin.secretKey | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            {{- /* The old relay's device file. */}}
            - name: DATA_DIR
              value: /data
            {{- end }}
            {{- if .Values.database.enabled }}
            # CloudNativePG writes the app user's connection string to the
            # relay-db-app secret (key `uri`) when it creates the cluster.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            # The cluster's CA (relay-db-ca, key ca.crt): the relay checks the
            # database's certificate against it and refuses plain text.
            - name: DATABASE_CA_FILE
              value: /etc/relay-db-ca/ca.crt
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          {{- if or .Values.persistence.enabled .Values.database.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.database.enabled }}
            - name: db-ca
              mountPath: /etc/relay-db-ca
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.persistence.enabled .Values.database.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vitruvian-relay.name" . }}-data
        {{- end }}
        {{- if .Values.database.enabled }}
        - name: db-ca
          secret:
            secretName: {{ .Values.database.caSecretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- end }}
