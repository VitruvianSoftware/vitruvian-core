# One replica, replaced with Recreate rather than rolled: the relay holds each
# device's /connect WebSocket in memory, so two relays at once would split the
# devices between them. The devices themselves are in Postgres (relay-db, a
# CloudNativePG cluster from gitops/argocd/platform/relay/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vitruvian-relay.name" . }}
  labels: {{- include "vitruvian-relay.labels" . | nindent 4 }}
  annotations:
    # After the database cluster (wave 0) is healthy: the relay's first act is
    # to connect and migrate.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "vitruvian-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vitruvian-relay.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      # fsGroup: the pod runs as UID 10001 and the NFS volume starts root-owned,
      # so the group is what lets the relay read the old devices.json.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vitruvian-relay
          image: {{ include "vitruvian-relay.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The names src/config.rs reads.
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: {{ printf "https://%s" .Values.hostname | quote }}
            - name: ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: PROJECT_ID
              value: {{ required "oidc.projectId is required (zitadel-apps-relay output projectId)" .Values.oidc.projectId | quote }}
            - name: MCP_CLIENT_IDS
              value: {{ required "oidc.mcpClientIds is required: comma-separated zitadel-apps-relay outputs claudeClientId, geminiClientId, chatgptClientId (each one configured)" .Values.oidc.mcpClientIds | quote }}
            - name: CONNECTOR_CLIENT_ID
              value: {{ required "oidc.connectorClientId is required (zitadel-apps-relay output connectorClientId)" .Values.oidc.connectorClientId | quote }}
            - name: ALLOWED_SUBJECTS
              value: {{ required "oidc.allowedSubjects is required: an empty list would admit every account in the instance" .Values.oidc.allowedSubjects | quote }}
            # CloudNativePG writes the app user's connection string to the
            # relay-db-app secret (key `uri`) when it creates the cluster.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            # The cluster's CA (relay-db-ca, key ca.crt): the relay checks the
            # database's certificate against it and refuses plain text.
            - name: DATABASE_CA_FILE
              value: /etc/relay-db-ca/ca.crt
            # REMOVE IN TASK 13: the P1 device file, read once at start to copy
            # its device into Postgres when the database has none.
            - name: LEGACY_DEVICES_FILE
              value: /data/devices.json
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            # REMOVE IN TASK 13 (with the volume): read only, for the import.
            - name: data
              mountPath: /data
              readOnly: true
            - name: db-ca
              mountPath: /etc/relay-db-ca
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vitruvian-relay.name" . }}-data
        - name: db-ca
          secret:
            secretName: {{ .Values.database.caSecretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
