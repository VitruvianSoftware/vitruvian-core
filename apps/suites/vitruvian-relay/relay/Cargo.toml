# Stub for now: it exists so the lock and the crate hub carry the shared token
# checker's dependencies. The relay itself is filled in by later tasks.
#
# The hub only gives a short label (@vitruvian_relay_crates//:ureq) to crates
# that a workspace member names itself, not to a path dependency's own
# dependencies. packages/rust/vitruvian-mcp-auth/BUILD uses those labels, so the
# crates it needs are repeated here, at the same versions.
[package]
name = "vitruvian-relay"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[[bin]]
name = "vitruvian-relay"
path = "src/main.rs"

[dependencies]
vitruvian-mcp-auth = { path = "../../../../packages/rust/vitruvian-mcp-auth" }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
