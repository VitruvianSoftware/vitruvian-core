# The relay server: MCP over Streamable HTTP for AI apps, device registration,
# and the /connect WebSocket the Mac connector dials.
#
# The hub only gives a short label (@vitruvian_relay_crates//:ureq) to crates
# that a workspace member names itself, not to a path dependency's own
# dependencies. packages/mcp-auth/BUILD uses those labels, so the
# crates it needs are repeated here, at the same versions.
[package]
name = "vitruvian-relay"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT"

[lib]
name = "vitruvian_relay"
path = "src/lib.rs"

[[bin]]
name = "vitruvian-relay"
path = "src/main.rs"

[dependencies]
vitruvian-mcp-auth = { path = "../../../../packages/mcp-auth" }
vitruvian-relay-protocol = { path = "../protocol" }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
# `client` is for the tests' in-process HTTP client; features unify through the
# crate hub either way.
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `test-util`: it would unify into the production build through the hub.
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# handshake only (server accept key, and the tests' client); no bundled TLS.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# The end-to-end test (tests/e2e.rs) runs the real connector against the relay.
[dev-dependencies]
vitruvian-relay-connector = { path = "../connector" }
