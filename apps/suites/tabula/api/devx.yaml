# Local development topology for the Tabula API.
#
#   devx up     — provision Postgres + Redis, then run the API against them
#   devx map    — validate/visualise this file (run from this directory)
#
# Bazel stays the build of record: the service command below is the same
# `bazel run` target you would invoke by hand.

name: tabula-api

databases:
  - engine: postgres
    port: 5432
  - engine: redis
    port: 6379

services:
  - name: api
    runtime: host
    command: ["bazel", "run", "//tabula/api:api_bin"]
    port: 8080
    depends_on:
      - name: postgres
        condition: service_healthy
      - name: redis
        condition: service_healthy
    healthcheck:
      http: "http://localhost:8080/health"
      interval: "2s"
      # Generous: a cold `bazel run` may need to build the API first.
      timeout: "180s"
      retries: 3
    # `devx up` injects ONLY this map plus PORT — it does not write or read a
    # .env file. Everything else the API needs (JWT_SECRET, WORKOS_*, ...) is
    # loaded by the app itself from the gitignored tabula/api/.env via dotenv,
    # which does not override variables already set here.
    env:
      DATABASE_URL: "postgresql://devx:devx@localhost:5432/devx"
      REDIS_URL: "redis://localhost:6379"

# Local pre-flight checks. `lint` runs the repo hygiene entrypoint, which
# REWRITES files (gazelle + formatters) rather than only reporting.
pipeline:
  test:
    command: ["bazel", "test", "//tabula/api/..."]
  lint:
    command: ["bazel", "run", "//:tidy"]
  build:
    command: ["bazel", "build", "//tabula/api/..."]
