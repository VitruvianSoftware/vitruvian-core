{%- comment -%}
  Client-side error reporting via Sentry.
  Emits only in production builds, ignores localhost, and fails silently if blocked by adblockers.
{%- endcomment -%}
{%- if jekyll.environment == "production" -%}
<script>
  (function () {
    try {
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        return;
      }
      var s = document.createElement("script");
      s.src = "https://browser.sentry-cdn.com/8.48.0/bundle.min.js";
      s.crossOrigin = "anonymous";
      s.onload = function () {
        if (window.Sentry) {
          window.Sentry.init({
            dsn: "https://34b5aa0bbf2fa5ccb80e26f52af97a05@sentry-ingest.ipv1337.dev/6",
            environment: "production",
            tracesSampleRate: 0.0
          });
        }
      };
      s.onerror = function () {};
      document.head.appendChild(s);
    } catch (e) {}
  })();
</script>
{%- endif -%}
