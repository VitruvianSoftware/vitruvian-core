  - id: mobile
    title: Mobile & Companion Apps
    blurb: Native mobile companion applications for remote agent control, session monitoring, and real-time alerts.
    items:
      - id: android-remote
        name: Vitruvian Remote
        version: "0.1.1"
        summary: >-
          Android companion app for Vitruvian. Answer agent permission prompts, monitor
          coding sessions, and review status updates directly from your phone.
        platforms: ["Android (arm64-v8a, x86_64)"]
        downloads:
          - label: Android APK
            url: https://github.com/VitruvianSoftware/vitruvian-core/releases/download/android-remote-v0.1.1/VitruvianRemote-0.1.1.apk
            size: 7.9 MB
        releases_url: https://github.com/VitruvianSoftware/vitruvian-core/releases/tag/android-remote-v0.1.1
        source_url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/apps/mobile/android-remote

  - id: cli
    title: Developer Tools & CLI
    blurb: High-performance CLI tools for local development orchestration, declarative K3s clusters, and peripheral control.
    items:
      - id: devx
        name: devx
        version: "0.74.2"
        summary: >-
          A local development orchestrator. One CLI provisions container VMs, ephemeral
          databases and cloud emulators, local K3s clusters, and Cloudflare tunnel ingress in dependency order.
        platforms: ["macOS (arm64, amd64)", "Linux (arm64, amd64)"]
        brew_formula: VitruvianSoftware/tap/devx
        releases_url: https://github.com/VitruvianSoftware/devx/releases
        source_url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/apps/cli/devx

      - id: homelab
        name: homelab
        version: "1.6.1"
        summary: >-
          Declarative multi-node K3s clusters on macOS. Describe nodes in one file and homelab
          provisions Lima VZ virtual machines, networking, and the cluster to match.
        platforms: ["macOS (Apple Silicon, Intel)"]
        brew_formula: VitruvianSoftware/tap/homelab
        releases_url: https://github.com/VitruvianSoftware/homelab/releases
        source_url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/apps/cli/homelab

      - id: gravastar-mouse
        name: gravastar-mouse
        version: "0.1.2"
        summary: >-
          Low-level USB/HID hardware configuration and battery telemetry CLI for GravaStar
          wireless gaming mice on macOS.
        platforms: ["macOS (Apple Silicon, Intel)"]
        brew_formula: VitruvianSoftware/tap/gravastar-mouse
        releases_url: https://github.com/VitruvianSoftware/vitruvian-core/releases/tag/gravastar-mouse-v0.1.2
        source_url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/packages/peripherals/Sources/gravastar-mouse

  - id: hardware
    title: Embedded & Hardware Firmware
    blurb: Pre-compiled firmware binaries and companion controller tools for microcontroller displays and desk pads.
    items:
      - id: esp32-s3
        name: ESP32-S3 Desk Companion
        version: "0.1.12"
        summary: >-
          Firmware that turns a 1.69-inch ESP32-S3 touch board into a desk display for live Mac
          metrics and a USB and Bluetooth shortcut macro pad.
        platforms: ["ESP32-S3", "macOS"]
        downloads:
          - label: Mac Controller ZIP
            url: https://github.com/VitruvianSoftware/vitruvian-core/releases/download/esp32-s3-v0.1.12/esp32-s3-mac-controller.zip
            size: 994 KB
          - label: Firmware Binary
            url: https://github.com/VitruvianSoftware/vitruvian-core/releases/download/esp32-s3-v0.1.12/firmware.bin
            size: 1.5 MB
          - label: Bootloader Binary
            url: https://github.com/VitruvianSoftware/vitruvian-core/releases/download/esp32-s3-v0.1.12/bootloader.bin
            size: 15 KB
          - label: Partition Table
            url: https://github.com/VitruvianSoftware/vitruvian-core/releases/download/esp32-s3-v0.1.12/partitions.bin
            size: 3 KB
        flash_command: esptool.py write_flash 0x0 bootloader.bin 0x8000 partitions.bin 0x10000 firmware.bin
        releases_url: https://github.com/VitruvianSoftware/vitruvian-core/releases/tag/esp32-s3-v0.1.12
        source_url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/apps/embedded/esp32-s3
