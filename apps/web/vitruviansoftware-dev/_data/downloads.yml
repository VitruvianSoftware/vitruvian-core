# Downloads catalog for vitruviansoftware.dev.
#
# Categorized lists of packaged desktop applications, Homebrew formulae & casks,
# and embedded hardware firmware releases.

tap:
  name: VitruvianSoftware/tap
  repo: https://github.com/VitruvianSoftware/homebrew-tap
  command: brew tap VitruvianSoftware/tap
  summary: >-
    The official Homebrew tap for Vitruvian Software applications and command-line tools.
    Formulae and casks are built, verified, and updated with every release.

categories:
  - id: desktop
    title: Desktop & Menu Bar Apps
    blurb: Native macOS applications built for high-performance agent workflows, speech notifications, and menu bar control.
    items:
      - id: nexus-agent
        name: NexusAgent
        version: "1.20.1"
        summary: >-
          macOS menu bar companion for AI coding assistants. Bridges Claude Code,
          Gemini Antigravity, and local LLMs to your phone via Telegram, with
          native toast notifications and streaming output.
        platforms: ["macOS Universal", "Apple Silicon", "Intel"]
        brew_cask: VitruvianSoftware/tap/nexus-agent
        downloads:
          - label: Universal DMG
            url: https://github.com/VitruvianSoftware/nexus-agent/releases/download/v1.20.1/NexusAgent-1.20.1-universal.dmg
            size: 4.2 MB
            arch: Universal
          - label: Apple Silicon DMG
            url: https://github.com/VitruvianSoftware/nexus-agent/releases/download/v1.20.1/NexusAgent-1.20.1-arm64.dmg
            size: 3.0 MB
            arch: arm64
          - label: Intel x86_64 DMG
            url: https://github.com/VitruvianSoftware/nexus-agent/releases/download/v1.20.1/NexusAgent-1.20.1-x86_64.dmg
            size: 3.1 MB
            arch: x86_64
          - label: Universal ZIP
            url: https://github.com/VitruvianSoftware/nexus-agent/releases/download/v1.20.1/NexusAgent-1.20.1-universal.zip
            size: 4.2 MB
            arch: Universal
        releases_url: https://github.com/VitruvianSoftware/nexus-agent/releases
        source_url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/apps/desktop/nexus-agent

