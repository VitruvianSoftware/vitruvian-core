# Downloads catalog for vitruviansoftware.dev.
#
# Categorized lists of packaged desktop applications, Homebrew formulae & casks,
# and embedded hardware firmware releases.

tap:
  name: VitruvianSoftware/tap
  repo: https://github.com/VitruvianSoftware/homebrew-tap
  # Homebrew 7 refuses to load anything from a third-party tap until the user
  # trusts it, so the setup is two commands, and every install line below uses
  # the full vitruviansoftware/tap/<name>. //tools/conformance:check holds
  # this file (and every other published install line) to that.
  commands:
    - brew tap vitruviansoftware/tap
    - brew trust vitruviansoftware/tap
  summary: >-
    The official Homebrew tap for Vitruvian Software applications and command-line tools.
    Formulae and casks are built, verified, and updated with every release.
  trust_note: >-
    Homebrew 7 refuses to load apps and tools from a tap you have not trusted, and
    brew upgrade skips that tap without saying so. If an install stopped updating,
    run brew trust vitruviansoftware/tap, then upgrade it again.

