# Where each app's Donate button lands.
#
# Apps never embed a Stripe URL: a Payment Link that is replaced gets a new
# address, and shipped builds can't be updated. They open
# https://vitruviansoftware.dev/donate/<key>/ instead (donate/<key>.html),
# which forwards to the `url` here.
#
# `url` is the app's live-mode Payment Link: the `donationLinks` output of the
# production stack in infrastructure/pulumi/platform/stripe, under the same
# key. Never a sandbox (test-mode) link. While it is empty, the page says
# donations are not open yet instead of forwarding, and offers a star on
# `repo`, the app's public repository.
#
# Every app has its own key, link and page, so Stripe shows which app each
# donation backs. The keys here, the stack configs' donations.apps and the
# donate/<key>.html pages must match; the stripe stack's
# donations_pages_test.go fails the build when they don't.

# Not an app: the general "support development" link that the site's header,
# footer and About page open (donate/index.html, /donate/).
development:
  name: Vitruvian Software
  url: "https://donate.stripe.com/9B64gycIt7Ff4Mh7abbwk01"

