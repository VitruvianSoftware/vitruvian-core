<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1040 640" width="100%" height="auto" role="img" aria-labelledby="t1 d1" style="background:#0e1317; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; border-radius: 6px;">
  <title id="t1">Stock Google TV Home versus Reclaimed Sony Bravia OLED</title>
  <desc id="d1">Side-by-side comparison of a stock Sony Bravia XR-65A80J running Google TV Home with sponsored carousels, Samba ACR telemetry, 20+ background bloat packages, 1.0x animations, and under 500 MB of free RAM versus the reclaimed setup running Projectivy Launcher, Aerial Views 4K Dolby Vision screensaver, SmartTube with SponsorBlock, 19 bloat packages disabled over wireless ADB, 0.5x animations, and 1.3 GB of free RAM.</desc>
  <defs>
    <style>
      .title { fill: #e7e4dd; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
      .subtitle { fill: #8fa5b5; font-size: 12px; }
      .box-bg { fill: #151d26; stroke: #26384a; stroke-width: 1.5; }
      .box-bg-highlight { fill: #182330; stroke: #3c5975; stroke-width: 1.5; }
      .box-head { fill: #e7e4dd; font-size: 14px; font-weight: 600; }
      .box-subhead { fill: #e7e4dd; font-size: 12px; font-weight: 600; }
      .box-body { fill: #8fa5b5; font-size: 11px; }
      .small { fill: #687f91; font-size: 10px; }
      .code { fill: #e7e4dd; font-size: 11px; }
      .accent-text { fill: #93b0ca; font-size: 11px; font-weight: 500; }
      .ok-text { fill: #7fbf9a; font-size: 11px; font-weight: 500; }
      .warn-text { fill: #d9b264; font-size: 11px; font-weight: 500; }
      .err-text { fill: #d2907b; font-size: 11px; font-weight: 500; }
      .chip-err { fill: #241918; stroke: #6e3f35; stroke-width: 1; }
      .chip-ok { fill: #15241d; stroke: #315e47; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1040" height="640" fill="#0e1317" rx="6" />

  <!-- Header -->
  <rect x="24" y="24" width="992" height="60" fill="#131c26" stroke="#233547" rx="6" />
  <text x="44" y="49" class="title">Sony Bravia XR-65A80J OLED: Stock Google TV vs. Reclaimed via Wireless ADB</text>
  <text x="44" y="69" class="subtitle">Same 4K 120 Hz OLED panel and MediaTek MT5895 SoC (3 GB RAM) — zero root required</text>

  <!-- Left Column: Stock Google TV -->
  <rect x="24" y="104" width="484" height="512" rx="6" class="box-bg" />
  <rect x="24" y="104" width="4" height="512" fill="#d2907b" />
  <text x="44" y="132" class="box-head">BEFORE · Stock Google TV Home</text>
  <rect x="372" y="116" width="120" height="22" rx="4" class="chip-err" />
  <text x="432" y="131" text-anchor="middle" class="err-text">&lt; 500 MB Free</text>

  <!-- Stock Screen Mockup -->
  <rect x="44" y="150" width="444" height="128" rx="4" fill="#11171f" stroke="#3a2927" stroke-width="1" />
  <rect x="56" y="162" width="420" height="56" rx="3" fill="#231918" stroke="#5c362e" stroke-dasharray="4,3" />
  <text x="68" y="182" class="err-text">AUTO-PLAYING SPONSORED BILLBOARD</text>
  <text x="68" y="200" class="box-body">com.google.android.tvlauncher · unskippable ad carousel</text>
  <rect x="56" y="228" width="132" height="38" rx="3" fill="#17202a" />
  <text x="66" y="245" class="small">"For You" Row</text>
  <text x="66" y="259" class="err-text">Promoted Shows</text>
  <rect x="200" y="228" width="132" height="38" rx="3" fill="#17202a" />
  <text x="210" y="245" class="small">Samba ACR Daemon</text>
  <text x="210" y="259" class="err-text">Screen Fingerprinting</text>
  <rect x="344" y="228" width="132" height="38" rx="3" fill="#17202a" />
  <text x="354" y="245" class="small">Stock YouTube TV</text>
  <text x="354" y="259" class="err-text">Pre-Roll + Mid-Roll</text>

  <!-- Stock Breakdown -->
  <text x="44" y="304" class="err-text">1. Home Screen &amp; Launcher Lock-In</text>
  <text x="44" y="322" class="box-body">• Home button hardcoded to com.google.android.tvlauncher</text>
  <text x="44" y="338" class="box-body">• com.google.android.tungsten.setupwraith re-asserts defaults</text>

  <text x="44" y="368" class="err-text">2. Background Telemetry &amp; Bloat (20+ Active Packages)</text>
  <text x="44" y="386" class="box-body">• tv.samba.ssm (Samba Interactive TV ACR content tracking)</text>
  <text x="44" y="402" class="box-body">• Retail demo loops, Bravia Sync promotions, Crackle, Play Games</text>

  <text x="44" y="432" class="err-text">3. UI Latency &amp; Compositor Drag</text>
  <text x="44" y="450" class="box-body">• 1.0x window/transition/animator scales + heavy artwork decoding</text>
  <text x="44" y="466" class="box-body">• Frequent home-screen redraw stalls when exiting 4K HDR apps</text>

  <text x="44" y="496" class="err-text">4. Ambient &amp; Media Experience</text>
  <text x="44" y="514" class="box-body">• Static backdrop slideshow with account prompts</text>
  <text x="44" y="530" class="box-body">• Stock YouTube client with unskippable ad breaks &amp; sponsor reads</text>

  <!-- Memory Bar Before -->
  <rect x="44" y="554" width="444" height="44" rx="4" fill="#11171f" stroke="#26384a" />
  <text x="58" y="573" class="small">MEMAVAILABLE (/proc/meminfo · 3072 MB total)</text>
  <text x="474" y="573" text-anchor="end" class="err-text">460 MB (15%)</text>
  <rect x="58" y="581" width="416" height="8" rx="4" fill="#1e2936" />
  <rect x="58" y="581" width="353" height="8" rx="4" fill="#d2907b" />

  <!-- Right Column: Reclaimed Sony Bravia OLED -->
  <rect x="532" y="104" width="484" height="512" rx="6" class="box-bg-highlight" />
  <rect x="532" y="104" width="4" height="512" fill="#7fbf9a" />
  <text x="552" y="132" class="box-head">AFTER · Reclaimed Sony Bravia OLED</text>
  <rect x="872" y="116" width="128" height="22" rx="4" class="chip-ok" />
  <text x="936" y="131" text-anchor="middle" class="ok-text">~1,310 MB Free</text>

  <!-- Reclaimed Screen Mockup -->
  <rect x="552" y="150" width="444" height="128" rx="4" fill="#11171f" stroke="#2d5440" stroke-width="1" />
  <rect x="564" y="162" width="420" height="56" rx="3" fill="#14221c" stroke="#315e47" />
  <text x="576" y="182" class="ok-text">PROJECTIVY LAUNCHER · CLEAN APPS &amp; HDMI INPUTS</text>
  <text x="576" y="200" class="box-body">com.spocky.projengmenu · zero ads, direct HDMI 1–4 tiles</text>
  <rect x="564" y="228" width="132" height="38" rx="3" fill="#17202a" stroke="#26384a" />
  <text x="574" y="245" class="small">Screensaver (5m)</text>
  <text x="574" y="259" class="ok-text">Aerial Views 4K DV</text>
  <rect x="708" y="228" width="132" height="38" rx="3" fill="#17202a" stroke="#26384a" />
  <text x="718" y="245" class="small">Video Client</text>
  <text x="718" y="259" class="ok-text">SmartTube 4K HDR</text>
  <rect x="852" y="228" width="132" height="38" rx="3" fill="#17202a" stroke="#26384a" />
  <text x="862" y="245" class="small">Remote Control</text>
  <text x="862" y="259" class="accent-text">Mac Notch + Fold</text>

  <!-- Reclaimed Breakdown -->
  <text x="552" y="304" class="ok-text">1. Native Home-Button Takeover</text>
  <text x="552" y="322" class="box-body">• Projectivy AccessibilityService enabled via settings put secure</text>
  <text x="552" y="338" class="box-body">• tvlauncher + setupwraith disabled via pm disable-user --user 0</text>

  <text x="552" y="368" class="ok-text">2. 19 Telemetry &amp; Bloat Packages Disabled</text>
  <text x="552" y="386" class="box-body">• Samba ACR, Sony shelf promotions, retail demos, and ad services off</text>
  <text x="552" y="402" class="box-body">• Reversible per-user disablement without touching /system or root</text>

  <text x="552" y="432" class="ok-text">3. 0.5x Animation Scales &amp; Cache Trim</text>
  <text x="552" y="450" class="box-body">• window_animation, transition_animation &amp; animator_duration = 0.5</text>
  <text x="552" y="466" class="box-body">• Instant D-pad focus response; zero launcher cold-start reloads</text>

  <text x="552" y="496" class="ok-text">4. 4K Dolby Vision Aerials &amp; First-Party Control</text>
  <text x="552" y="514" class="box-body">• Aerial Views wired as active DreamService (5-min idle trigger)</text>
  <text x="552" y="530" class="box-body">• Controlled from Vitruvian macOS Notch Island &amp; Pixel Fold app</text>

  <!-- Memory Bar After -->
  <rect x="552" y="554" width="444" height="44" rx="4" fill="#11171f" stroke="#26384a" />
  <text x="566" y="573" class="small">MEMAVAILABLE (/proc/meminfo · 3072 MB total)</text>
  <text x="982" y="573" text-anchor="end" class="ok-text">1,310 MB (43%)</text>
  <rect x="566" y="581" width="416" height="8" rx="4" fill="#1e2936" />
  <rect x="566" y="581" width="238" height="8" rx="4" fill="#7fbf9a" />
</svg>
