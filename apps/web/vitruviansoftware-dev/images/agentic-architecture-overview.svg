<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="100%" height="auto" style="background:#0e1317; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; border-radius: 6px;">
  <defs>
    <style>
      .title { fill: #e7e4dd; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
      .subtitle { fill: #8fa5b5; font-size: 12px; }
      .box-bg { fill: #151d26; stroke: #26384a; stroke-width: 1.5; rx: 6px; }
      .box-bg-highlight { fill: #182330; stroke: #3c5975; stroke-width: 1.5; rx: 6px; }
      .box-head { fill: #e7e4dd; font-size: 13px; font-weight: 600; }
      .box-body { fill: #8fa5b5; font-size: 11px; line-height: 1.4; }
      .accent-text { fill: #93b0ca; font-size: 11px; font-weight: 500; }
      .ok-text { fill: #7fbf9a; font-size: 11px; font-weight: 500; }
      .warn-text { fill: #d9b264; font-size: 11px; font-weight: 500; }
      .err-text { fill: #d2907b; font-size: 11px; font-weight: 500; }
      .flow-line { stroke: #3d566e; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .arrow { fill: #4f6e8d; }
      .tag-badge { fill: #1c2b3a; stroke: #3a536b; stroke-width: 1; rx: 3px; }
      .badge-text { fill: #a5c3de; font-size: 10px; font-weight: 500; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f6e8d" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fbf9a" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="24" y="24" width="992" height="60" fill="#131c26" stroke="#233547" rx="6" />
  <text x="44" y="49" class="title">The Modern Agentic Codebase Architecture</text>
  <text x="44" y="69" class="subtitle">Deterministic Guardrails, Hermetic Boundaries, and Autonomous Verification in vitruvian-core</text>

  <!-- Column 1: Multi-Agent Specialization & Identity -->
  <g transform="translate(24, 104)">
    <rect width="310" height="550" class="box-bg" />
    <rect x="14" y="14" width="282" height="28" fill="#1a2634" rx="4" />
    <text x="24" y="33" class="box-head">1. SPECIALIZED AGENTS &amp; IDENTITY</text>

    <!-- Subagents -->
    <rect x="14" y="52" width="282" height="154" class="box-bg-highlight" />
    <text x="24" y="72" class="accent-text">Multi-Domain Agent Roles (AGENTS.md)</text>
    <text x="24" y="92" class="box-body">• <tspan fill="#e7e4dd">beacon</tspan>: Lead architect &amp; dispatcher</text>
    <text x="24" y="110" class="box-body">• <tspan fill="#e7e4dd">wren</tspan>: App implementation (Go / TS)</text>
    <text x="24" y="128" class="box-body">• <tspan fill="#e7e4dd">atlas</tspan>: Pulumi IaC &amp; Cloudflare/GCP</text>
    <text x="24" y="146" class="box-body">• <tspan fill="#e7e4dd">scout</tspan>: Bazel build/tests &amp; CI watchdog</text>
    <text x="24" y="164" class="box-body">• <tspan fill="#e7e4dd">aegis</tspan>: Security &amp; peer code review</text>
    <text x="24" y="182" class="box-body">• <tspan fill="#e7e4dd">ridge</tspan>: Homelab k3s ops &amp; flapping triage</text>
    <text x="24" y="198" style="fill:#687f91; font-size:10px;">Scoped AGENTS.md per subtree prevents context bleed</text>

    <!-- GitHub App Identity -->
    <rect x="14" y="218" width="282" height="162" class="box-bg-highlight" />
    <text x="24" y="238" class="accent-text">Per-Agent GitHub App Identity</text>
    <text x="24" y="256" class="box-body">tools/agent-app -- env &lt;agent&gt;</text>
    <rect x="24" y="266" width="262" height="52" fill="#0d141b" stroke="#1d2c3b" rx="3" />
    <text x="32" y="284" class="ok-text">GH_TOKEN: 1-hr ephemeral JWT token</text>
    <text x="32" y="302" class="ok-text">GIT_AUTHOR: &lt;id&gt;+vitruvian-wren[bot]@...</text>
    <text x="24" y="336" class="box-body">• Cryptographic commit attribution</text>
    <text x="24" y="352" class="box-body">• Enables cross-agent peer reviews</text>
    <text x="24" y="368" class="box-body">• Satisfies branch protection rules</text>

    <!-- Worktree Hygiene -->
    <rect x="14" y="392" width="282" height="144" class="box-bg-highlight" />
    <text x="24" y="412" class="accent-text">Isolated Worktrees &amp; Hygiene</text>
    <text x="24" y="432" class="box-body">• Ephemeral git worktree per session</text>
    <text x="24" y="450" class="box-body">• bazel run //tools/worktree-hygiene</text>
    <text x="24" y="468" class="box-body">• Prunes stale trees &amp; merged local branches</text>
    <text x="24" y="486" class="box-body">• Checks PR collisions before editing</text>
    <text x="24" y="512" class="ok-text">✓ Zero cross-contamination between tasks</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 334 320 L 364 320" class="flow-line" marker-end="url(#arrow)" />

  <!-- Column 2: Hermetic Engine & Fail-Closed Guardrails -->
  <g transform="translate(364, 104)">
    <rect width="310" height="550" class="box-bg" />
    <rect x="14" y="14" width="282" height="28" fill="#1a2634" rx="4" />
    <text x="24" y="33" class="box-head">2. HERMETICITY &amp; GUARDRAILS</text>

    <!-- Hermetic Engine -->
    <rect x="14" y="52" width="282" height="154" class="box-bg-highlight" />
    <text x="24" y="72" class="accent-text">Hermetic Build &amp; Test (Bazel)</text>
    <text x="24" y="92" class="box-body">• Pinned multi-ecosystem toolchains</text>
    <text x="24" y="110" class="box-body">• Sandboxed execution (Go, TS, Python, Rust)</text>
    <text x="24" y="128" class="box-body">• bazel test //... runs locally &amp; in CI</text>
    <text x="24" y="146" class="box-body">• Gazelle maintains BUILD files</text>
    <text x="24" y="164" class="box-body">• One-Version-Rule enforces alignment</text>
    <text x="24" y="190" class="ok-text">✓ Deterministic verification across all machines</text>

    <!-- Deterministic Pre-Tool Guardrails -->
    <rect x="14" y="218" width="282" height="162" class="box-bg-highlight" />
    <text x="24" y="238" class="warn-text">PreToolUse Hooks (.claude/hooks)</text>
    <text x="24" y="258" class="box-body">block-queue-bypass.sh intercepts shell:</text>
    <rect x="24" y="266" width="262" height="52" fill="#0d141b" stroke="#1d2c3b" rx="3" />
    <text x="32" y="284" class="err-text">DENY: gh pr merge --admin</text>
    <text x="32" y="302" class="err-text">DENY: git push origin main / REST merge</text>
    <text x="24" y="336" class="box-body">• Fails closed: permissionDecision "deny"</text>
    <text x="24" y="352" class="box-body">• Code-level refusal, not soft prompt advice</text>
    <text x="24" y="368" class="box-body">• Prevents impatient queue bypasses</text>

    <!-- Stackguards -->
    <rect x="14" y="392" width="282" height="144" class="box-bg-highlight" />
    <text x="24" y="412" class="warn-text">IaC Stackguards (stackguard.go)</text>
    <text x="24" y="432" class="box-body">• Blocks destructive implicit defaults</text>
    <text x="24" y="450" class="box-body">• Requires explicit argocd_enabled key</text>
    <text x="24" y="468" class="box-body">• Aborts if run from unconfigured worktree</text>
    <text x="24" y="494" class="err-text">✗ Aborts BEFORE touching cloud infrastructure</text>
    <text x="24" y="512" class="ok-text">✓ Guarantees safe local pulumi previews</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 674 320 L 704 320" class="flow-line" marker-end="url(#arrow)" />

  <!-- Column 3: Autonomous Verification & Pipeline Landing -->
  <g transform="translate(704, 104)">
    <rect width="310" height="550" class="box-bg" />
    <rect x="14" y="14" width="282" height="28" fill="#1a2634" rx="4" />
    <text x="24" y="33" class="box-head">3. VERIFICATION &amp; LANDING</text>

    <!-- Autonomous Watch-PR -->
    <rect x="14" y="52" width="282" height="154" class="box-bg-highlight" />
    <text x="24" y="72" class="accent-text">Autonomous Watchdog (tools/watch-pr)</text>
    <text x="24" y="92" class="box-body">• Background polling of GitHub Actions CI</text>
    <text x="24" y="110" class="box-body">• Automatically pulls failing job logs</text>
    <text x="24" y="128" class="box-body">• Triggers subagent triage &amp; auto-repair</text>
    <text x="24" y="146" class="box-body">• Monitors merge queue trial commit</text>
    <text x="24" y="164" class="box-body">• Hard timeout prevents infinite loops</text>
    <text x="24" y="190" class="ok-text">✓ Zero waiting around by human engineers</text>

    <!-- Merge Queue & Peer Review -->
    <rect x="14" y="218" width="282" height="162" class="box-bg-highlight" />
    <text x="24" y="238" class="accent-text">Merge Queue &amp; Peer Sign-Off</text>
    <text x="24" y="258" class="box-body">Independent peer bot review:</text>
    <rect x="24" y="266" width="262" height="52" fill="#0d141b" stroke="#1d2c3b" rx="3" />
    <text x="32" y="284" class="ok-text">aegis reviews &amp; approves wren's PR</text>
    <text x="32" y="302" class="ok-text">Branch Protection requires 1 approval</text>
    <text x="24" y="336" class="box-body">• Enqueued: gh pr merge --auto --squash</text>
    <text x="24" y="352" class="box-body">• CI runs against trial commit (HEAD + main)</text>
    <text x="24" y="368" class="box-body">• Squash merge guarantees atomic trunk</text>

    <!-- Copybara Sync & GitOps -->
    <rect x="14" y="392" width="282" height="144" class="box-bg-highlight" />
    <text x="24" y="412" class="accent-text">Single Truth &amp; Copybara Sync</text>
    <text x="24" y="432" class="box-body">• Monorepo is single source of truth</text>
    <text x="24" y="450" class="box-body">• One-way near-real-time push to mirrors</text>
    <text x="24" y="468" class="box-body">• Hourly gated PR import (import-to-monorepo)</text>
    <text x="24" y="494" class="ok-text">• Post-merge health: pipeline-status</text>
    <text x="24" y="512" class="ok-text">✓ No bidirectional bounce or silent drift</text>
  </g>
</svg>