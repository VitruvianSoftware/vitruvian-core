<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="auto" style="background:#0e1317; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; border-radius: 6px;">
  <defs>
    <style>
      .title { fill: #e7e4dd; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
      .subtitle { fill: #8fa5b5; font-size: 12px; }
      .card-author { fill: #121c24; stroke: #2a4863; stroke-width: 1.5; rx: 6px; }
      .card-reviewer { fill: #1a1622; stroke: #543769; stroke-width: 1.5; rx: 6px; }
      .card-github { fill: #13211c; stroke: #2a523e; stroke-width: 1.5; rx: 6px; }
      .box-head { fill: #e7e4dd; font-size: 13px; font-weight: 600; }
      .box-sub { fill: #93b0ca; font-size: 11px; }
      .box-body { fill: #8fa5b5; font-size: 11px; line-height: 1.4; }
      .pill-auth { fill: #0e151c; stroke: #203547; stroke-width: 1; rx: 3px; }
      .ok-text { fill: #7fbf9a; font-size: 11px; font-weight: 500; }
      .accent-blue { fill: #93b0ca; font-size: 11px; font-weight: 500; }
      .accent-purple { fill: #cba6e8; font-size: 11px; font-weight: 500; }
      .flow-arrow { stroke: #4f6e8d; stroke-width: 1.5; fill: none; }
      .flow-arrow-green { stroke: #7fbf9a; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ar-id-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f6e8d" />
    </marker>
    <marker id="ar-id-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fbf9a" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="20" y="20" width="920" height="50" fill="#131c26" stroke="#233547" rx="6" />
  <text x="36" y="42" class="title">Cryptographic Bot Identity &amp; Cross-Agent Peer Review</text>
  <text x="36" y="60" class="subtitle">Distinct GitHub App Credentials Satisfy Branch Protection Without Human Intervention</text>

  <!-- Left: Wren (Author) -->
  <g transform="translate(20, 85)">
    <rect width="280" height="345" class="card-author" />
    <text x="20" y="30" class="box-head" fill="#93b0ca">1. AUTHOR: WREN</text>
    <text x="20" y="48" class="box-sub">vitruvian-wren-agent[bot]</text>

    <!-- Token box -->
    <rect x="16" y="64" width="248" height="66" class="pill-auth" />
    <text x="24" y="82" class="accent-blue">eval "$(tools/agent-app env wren)"</text>
    <text x="24" y="100" class="ok-text">• GH_TOKEN: Ephemeral 1-hr JWT</text>
    <text x="24" y="116" class="ok-text">• BOT_USER_ID: 314429222</text>

    <text x="20" y="152" class="box-body"><tspan fill="#e7e4dd">Git Commit Attribution:</tspan></text>
    <rect x="16" y="162" width="248" height="54" fill="#0d1318" stroke="#1c2d3b" rx="4" />
    <text x="24" y="180" fill="#8fa5b5" style="font-size:10px;">GIT_AUTHOR_EMAIL=</text>
    <text x="24" y="196" fill="#93b0ca" style="font-size:9.5px;">314429222+wren[bot]@noreply...</text>

    <text x="20" y="238" class="box-body">• Writes Go/TS application code</text>
    <text x="20" y="256" class="box-body">• Hermetically verifies with Bazel</text>
    <text x="20" y="274" class="box-body">• Pushes commit &amp; opens PR #2894</text>

    <rect x="16" y="292" width="248" height="38" fill="#13241c" stroke="#25593e" rx="4" />
    <text x="24" y="315" class="ok-text">PR #2894: Authorship Pinned</text>
  </g>

  <!-- Flow 1 to Central Gate -->
  <path d="M 300 240 L 335 240" class="flow-arrow" marker-end="url(#ar-id-blue)" />

  <!-- Center: GitHub Branch Protection Gate -->
  <g transform="translate(340, 85)">
    <rect width="280" height="345" class="card-github" />
    <text x="20" y="30" class="box-head" fill="#7fbf9a">2. GITHUB RULES ENGINE</text>
    <text x="20" y="48" class="box-sub">Branch Protection &amp; Rulesets</text>

    <rect x="16" y="64" width="248" height="74" fill="#0e1f18" stroke="#1d4d35" rx="4" />
    <text x="24" y="84" class="ok-text">RULE: required_approvals: 1</text>
    <text x="24" y="104" fill="#e7e4dd" style="font-size:10px;">INVARIANT: Self-approval BLOCKED</text>
    <text x="24" y="122" fill="#8fa5b5" style="font-size:9.5px;">GitHub rejects author approving own PR</text>

    <text x="20" y="162" class="box-body"><tspan fill="#e7e4dd">Identity Evaluation:</tspan></text>
    <rect x="16" y="172" width="248" height="90" fill="#0d1813" stroke="#1c3e2b" rx="4" />
    <text x="24" y="192" fill="#8fa5b5" style="font-size:10.5px;">PR Author:   <tspan fill="#93b0ca">wren (314429222)</tspan></text>
    <text x="24" y="212" fill="#8fa5b5" style="font-size:10.5px;">PR Reviewer: <tspan fill="#cba6e8">aegis (314430403)</tspan></text>
    <text x="24" y="232" class="ok-text">Result: Author != Reviewer</text>
    <text x="24" y="248" class="ok-text">Distinct cryptographic Apps!</text>

    <rect x="16" y="280" width="248" height="50" fill="#153625" stroke="#2a6e48" rx="4" />
    <text x="140" y="302" class="ok-text" text-anchor="middle" style="font-weight:600; font-size:12px;">✓ REVIEW GATE PASSED</text>
    <text x="140" y="318" fill="#a8e6c1" text-anchor="middle" style="font-size:10px;">Enqueues into Merge Queue</text>
  </g>

  <!-- Flow 2 from Right to Center -->
  <path d="M 660 240 L 625 240" class="flow-arrow" marker-end="url(#ar-id-blue)" />

  <!-- Right: Aegis (Peer Reviewer) -->
  <g transform="translate(660, 85)">
    <rect width="280" height="345" class="card-reviewer" />
    <text x="20" y="30" class="box-head" fill="#cba6e8">3. REVIEWER: AEGIS</text>
    <text x="20" y="48" class="box-sub">vitruvian-aegis-agent[bot]</text>

    <!-- Token box -->
    <rect x="16" y="64" width="248" height="66" class="pill-auth" />
    <text x="24" y="82" class="accent-purple">eval "$(tools/agent-app env aegis)"</text>
    <text x="24" y="100" class="ok-text">• GH_TOKEN: Dedicated aegis token</text>
    <text x="24" y="116" class="ok-text">• BOT_USER_ID: 314430403</text>

    <text x="20" y="152" class="box-body"><tspan fill="#e7e4dd">Independent Audit Pass:</tspan></text>
    <rect x="16" y="162" width="248" height="54" fill="#140f1a" stroke="#362242" rx="4" />
    <text x="24" y="180" fill="#8fa5b5" style="font-size:10px;">Security check &amp; diff audit</text>
    <text x="24" y="196" class="ok-text">No secret leakage / escalation</text>

    <text x="20" y="238" class="box-body">• Inspects PR #2894 diff</text>
    <text x="20" y="256" class="box-body">• Verifies license &amp; permissions</text>
    <text x="20" y="274" class="box-body">• Submits formal bot approval:</text>

    <rect x="16" y="292" width="248" height="38" fill="#2b1a38" stroke="#5d337d" rx="4" />
    <text x="24" y="315" class="accent-purple">gh pr review 2894 --approve</text>
  </g>
</svg>
