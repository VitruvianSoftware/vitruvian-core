<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="auto" style="background:#0e1317; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; border-radius: 6px;">
  <defs>
    <style>
      .title { fill: #e7e4dd; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
      .subtitle { fill: #8fa5b5; font-size: 12px; }
      .mono-box { fill: #132433; stroke: #2a5f8a; stroke-width: 1.5; rx: 6px; }
      .mirror-box { fill: #131c26; stroke: #26384a; stroke-width: 1.5; rx: 6px; }
      .box-head { fill: #e7e4dd; font-size: 13px; font-weight: 600; }
      .box-sub { fill: #93b0ca; font-size: 11px; }
      .box-body { fill: #8fa5b5; font-size: 11px; line-height: 1.4; }
      .accent-blue { fill: #93b0ca; font-size: 11px; font-weight: 500; }
      .ok-text { fill: #7fbf9a; font-size: 11px; font-weight: 500; }
      .warn-text { fill: #d9b264; font-size: 11px; font-weight: 500; }
      .export-line { stroke: #7fbf9a; stroke-width: 1.5; fill: none; }
      .import-line { stroke: #93b0ca; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .pill { fill: #0e151c; stroke: #1f3040; stroke-width: 1; rx: 3px; }
    </style>
    <marker id="ar-export" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7fbf9a" />
    </marker>
    <marker id="ar-import" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#93b0ca" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="20" y="20" width="920" height="50" fill="#131c26" stroke="#233547" rx="6" />
  <text x="36" y="42" class="title">Single Source of Truth &amp; Copybara Distribution Engine</text>
  <text x="36" y="60" class="subtitle">Deterministic One-Way Export and Gated PR Import Eliminate Bidirectional Sync Loops</text>

  <!-- Top: Vitruvian Core (Single Source of Truth) -->
  <g transform="translate(20, 85)">
    <rect width="920" height="150" class="mono-box" />
    <text x="24" y="28" class="box-head" fill="#7fbf9a">vitruvian-core (THE SINGLE SOURCE OF TRUTH)</text>
    <text x="24" y="46" class="box-sub">All AI agents and maintainers work exclusively here. Trunk is protected by Bazel &amp; Merge Queue.</text>

    <!-- Subtrees representation -->
    <g transform="translate(24, 60)">
      <rect width="270" height="70" class="pill" />
      <text x="14" y="24" class="accent-blue">apps/web/vitruviansoftware-dev/</text>
      <text x="14" y="42" class="box-body">• Jekyll marketing &amp; engineering site</text>
      <text x="14" y="58" class="ok-text">• Shape: export_only=True</text>

      <rect x="295" width="270" height="70" class="pill" />
      <text x="309" y="24" class="accent-blue">apps/cli/devx/</text>
      <text x="309" y="42" class="box-body">• DevX workflow CLI &amp; agents</text>
      <text x="309" y="58" class="warn-text">• Shape: is_one_way=True (w/ PR import)</text>

      <rect x="590" width="280" height="70" class="pill" />
      <text x="604" y="24" class="accent-blue">apps/cli/homelab/</text>
      <text x="604" y="42" class="box-body">• Cluster ops CLI &amp; diagnostics</text>
      <text x="604" y="58" class="warn-text">• Shape: is_one_way=True (w/ PR import)</text>
    </g>
  </g>

  <!-- Export Paths (Downwards) -->
  <path d="M 180 235 L 180 275" class="export-line" marker-end="url(#ar-export)" />
  <text x="188" y="258" class="ok-text" style="font-size:10px;">ON-PUSH EXPORT</text>

  <path d="M 475 235 L 475 275" class="export-line" marker-end="url(#ar-export)" />
  <text x="483" y="258" class="ok-text" style="font-size:10px;">ON-PUSH EXPORT</text>

  <!-- Import Path (Upward dashed from DevX mirror) -->
  <path d="M 760 275 L 760 235" class="import-line" marker-end="url(#ar-import)" />
  <text x="768" y="258" class="accent-blue" style="font-size:10px;">HOURLY PR IMPORT</text>

  <!-- Bottom: Standalone Mirrors & Community -->
  <g transform="translate(20, 280)">
    <!-- Mirror 1: site-vitruviansoftware-dev -->
    <rect width="285" height="155" class="mirror-box" />
    <text x="20" y="28" class="box-head">site-vitruviansoftware-dev</text>
    <text x="20" y="46" class="box-sub">Read-Only GitHub Pages Mirror</text>
    <text x="20" y="70" class="box-body">• Automated Copybara git export</text>
    <text x="20" y="88" class="box-body">• GitHub Actions jekyll.yml builds pages</text>
    <text x="20" y="106" class="box-body">• Direct edits overwritten on next push</text>
    <rect x="16" y="118" width="253" height="26" fill="#11221a" stroke="#235439" rx="3" />
    <text x="24" y="135" class="ok-text">Production: vitruviansoftware.dev</text>

    <!-- Mirror 2: devx standalone repo -->
    <g transform="translate(305, 0)">
      <rect width="285" height="155" class="mirror-box" />
      <text x="20" y="28" class="box-head">VitruvianSoftware/devx</text>
      <text x="20" y="46" class="box-sub">Standalone Open Source Mirror</text>
      <text x="20" y="70" class="box-body">• Exported automatically on trunk push</text>
      <text x="20" y="88" class="box-body">• Releases generated from mirror tags</text>
      <text x="20" y="106" class="box-body">• Includes standalone-only workflows</text>
      <rect x="16" y="118" width="253" height="26" fill="#13241c" stroke="#25593e" rx="3" />
      <text x="24" y="135" class="ok-text">Downstream binary releases</text>
    </g>

    <!-- Mirror 3: External Contributor Workflow -->
    <g transform="translate(610, 0)">
      <rect width="310" height="155" class="mirror-box" />
      <text x="20" y="28" class="box-head" fill="#93b0ca">COMMUNITY CONTRIBUTIONS</text>
      <text x="20" y="46" class="box-sub">External PRs on Satellite Mirrors</text>
      <text x="20" y="70" class="box-body">• Contributor forks mirror &amp; opens PR</text>
      <text x="20" y="88" class="box-body">• Label applied: <tspan fill="#d9b264">import-to-monorepo</tspan></text>
      <text x="20" y="106" class="box-body">• Imported as monorepo PR for CI &amp; review</text>
      <rect x="16" y="118" width="278" height="26" fill="#162230" stroke="#32506e" rx="3" />
      <text x="24" y="135" class="accent-blue">Zero drift: rev-id labels block bounce</text>
    </g>
  </g>
</svg>
