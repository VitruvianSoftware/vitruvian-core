# Site configuration for vitruviansoftware.dev.
#
# The production build runs in the standalone mirror's jekyll.yml through
# actions/jekyll-build-pages, i.e. the github-pages gem (Jekyll 3.x, safe mode,
# whitelisted plugins only). Keep everything here compatible with that: no
# custom plugins, no Sass modules. The stylesheet is plain CSS for that reason.
#
# This file is not reloaded by `jekyll serve`; restart the server after editing.

title: Vitruvian Software
tagline: Open-source developer tooling and platform engineering
email: git@nocentre.net
description: >-
  Vitruvian Software builds open-source developer tooling, cloud foundations as
  code, and AI agents that work under the same review rules as engineers.
  Everything ships from one public monorepo.
baseurl: ""
url: "https://vitruviansoftware.dev"
logo: /images/logo-dark.jpeg
github_username: VitruvianSoftware
monorepo: https://github.com/VitruvianSoftware/vitruvian-core

# jekyll-seo-tag
social:
  name: Vitruvian Software
  links:
    - https://github.com/VitruvianSoftware

# Primary navigation, in order. Each entry is matched against page.url to mark
# the current section.
navigation:
  - title: Projects
    url: /projects/
  - title: Downloads
    url: /downloads/
  - title: Engineering
    url: /engineering/
  - title: Blog
    url: /blog/
  - title: About
    url: /about/

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Vitruvian Software
  # The preview image a link to any page shows when shared. A page can set its
  # own `image:` to override it.
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.png

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# Monorepo files that are not part of the site.
exclude:
  - BUILD
  - README.md
  - catalog-info.yaml
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
