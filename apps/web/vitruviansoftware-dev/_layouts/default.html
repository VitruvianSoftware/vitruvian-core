<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Apply the saved or preferred theme before first paint, so a light-mode
      // visitor never sees a dark flash.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    {%- seo -%}
    <meta name="theme-color" content="#0e1317">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {%- feed_meta -%}
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {%- include header.html -%}

    <main id="main">
      {{ content }}
    </main>

    {%- include footer.html -%}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
