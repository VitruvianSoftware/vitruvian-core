# Builds the game and publishes it to GitHub Pages (mini-games.vitruviansoftware.dev).
#
# This file only runs in the standalone mirror, VitruvianSoftware/vitruvian-party:
# the monorepo exports apps/web/mini-party/ there on every change, and that push
# starts this workflow. GitHub Pages has no server, so online rooms go to the
# rooms server on the homelab cluster; .env.pages holds that and the other
# public-site settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install
        # The monorepo's lockfile does not travel with the mirror, so this
        # resolves from package.json's ranges.
        run: npm install --no-audit --no-fund
      - name: Build
        # --mode pages reads .env.pages: the rooms server, analytics and
        # Sentry settings for this public site.
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
