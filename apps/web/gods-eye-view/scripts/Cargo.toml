# The crates gods-eye-view's Rust helpers and CLI tools use. Bazel builds them
# (BUILD.bazel, `@crates//:<name>`); this manifest only feeds the root Cargo
# workspace that the @crates hub and Cargo.lock are resolved from.
[package]
name = "gev-scripts"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "gev_scripts_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1"
# JPEG/PNG decode and JPEG encode for pano-pinhole, sat-ortho and
# streetview-panorama (the JS tools used sharp/libvips).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
