apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: cloud-run-service
  title: Cloud Run Microservice (Go / TypeScript)
  description: >-
    Scaffolds a production-ready API service targeting Google Cloud Run with
    Zitadel OIDC authentication, container build rules, and a compliant Backstage catalog-info.yaml.
  tags:
    - cloud-run
    - gcp
    - microservice
    - serverless
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - description
        - language
      properties:
        name:
          title: Service Name
          type: string
          description: snake_case identifier for the service and directory.
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
          maxLength: 30
          ui:autofocus: true
          ui:placeholder: payment_processor
        description:
          title: Description
          type: string
          description: High-level overview of the service's purpose and functionality.
          ui:placeholder: Processes webhook events and dispatches settlement records
        language:
          title: Implementation Language
          type: string
          enum:
            - go
            - typescript
          enumNames:
            - Go
            - TypeScript (Node.js)
          default: go

  steps:
    - id: fetch
      name: Fetch Base Service Skeleton
      action: fetch:plain
      input:
        url: https://github.com/VitruvianSoftware/vitruvian-core

    - id: render
      name: Render Cloud Run Service
      action: vitruvian:app:render
      input:
        name: ${{ parameters.name }}
        language: ${{ parameters.language }}
        targetPath: apps/${{ parameters.name }}

    - id: pr
      name: Open Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=VitruvianSoftware&repo=vitruvian-core
        sourcePath: ${{ steps.render.output.stagePath }}
        branchName: scaffolder/cloud-run-${{ parameters.name }}
        title: "feat(${{ parameters.name }}): scaffold Cloud Run service"
        description: |
          ### Scaffolded Cloud Run Microservice: `${{ parameters.name }}`
          - **Language**: `${{ parameters.language }}`
          - **Description**: ${{ parameters.description }}
        draft: true

  output:
    links:
      - title: Review Draft Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
