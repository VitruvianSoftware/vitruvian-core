# The Slack MCP server.
#
# Its own workspace and its own Cargo.lock, deliberately apart from the root
# one: the image is built from apps/mcp/slack alone (the Dockerfile's context,
# and all the standalone mirror receives), so the lock has to live in here for
# `cargo build --locked` to work. Bazel reads the same lock through the
# @mcp_slack_crates hub (MODULE.bazel). Re-lock with
#   bazel run //tools/crates:lock -- --dir apps/mcp/slack/rs
#
# Everything that touches the network or crypto is a vetted crate, never
# hand-rolled: hyper/tokio serve HTTP, ureq over rustls makes every HTTPS call
# (Slack and the issuer's JWKS), ring checks the RS256 signature, serde_json
# parses JSON. rust-version is the Bazel toolchain's, so the lock only holds
# versions that toolchain can build.
[workspace]

[package]
name = "mcp-slack"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "mcp_slack_rs_lib"
path = "src/lib.rs"

[[bin]]
name = "mcp-slack"
path = "src/main.rs"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
# The same rustls ureq uses, ring only (no aws-lc). TLS roots come from
# rustls-native-certs 0.8 through crate::tls, not ureq's `native-certs`
# feature: that one pulls rustls-native-certs 0.7 and the unmaintained
# rustls-pemfile (RUSTSEC-2025-0134).
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
