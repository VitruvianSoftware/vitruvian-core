[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vitruvian-roborock"
dynamic = ["version"]
description = "Local daemon, CLI (rrctl) and MCP server for Roborock vacuums"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "VitruvianSoftware" }]
keywords = ["roborock", "vacuum", "mcp", "home-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
# Ranges, not pins: //requirements holds the resolved versions Bazel tests against
# (the root pyproject.toml mirrors these bounds). The upper bounds are
# the next major of each library, since both changed their public API at the
# last one (python-roborock's device manager, mcp's FastMCP -> MCPServer).
dependencies = [
    "aiohttp>=3.11",
    "mcp>=2.3,<3",
    "python-roborock>=7.12,<8",
]

[project.scripts]
rrctl = "vitruvian_roborock.cli.main:main"
# Same entrypoint under the distribution's name, so `uvx vitruvian-roborock mcp` resolves.
vitruvian-roborock = "vitruvian_roborock.cli.main:main"

[project.urls]
Repository = "https://github.com/VitruvianSoftware/vitruvian-core/tree/main/apps/mcp/roborock"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/vitruvian_roborock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vitruvian_roborock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
