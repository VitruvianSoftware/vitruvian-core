# Publish-on-version-bump: rrctl binaries on a GitHub release.
#
# This file is developed in the vitruvian-core monorepo and exported to the
# VitruvianSoftware/mcp-roborock mirror, which is where it runs. It never runs
# in the monorepo: a workflow only runs from a repository's root .github/.
#
# On every push to the mirror's main it reads the version from Cargo.toml's
# [package] and checks for a v<version> tag. If there is none, this is a new
# release: build rrctl for macOS (one universal binary, Apple silicon and
# Intel) and Linux (x86_64), and publish them with their SHA-256 sums on a
# GitHub release tagged v<version>. So a release is cut by bumping the version
# in Cargo.toml (and the plugin manifests, which a test keeps in step), and
# nothing else.
#
# The build is `cargo build --release --locked` against the Cargo.lock that
# Bazel also builds from, so the release has the same dependency set as CI.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect an unreleased version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: |
          V="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read an X.Y.Z version from Cargo.toml's [package] (got '${V}')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
            echo "v${V} is already released -- nothing to do."
            exit 0
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Detected UNRELEASED version ${V}."

  build:
    name: Build rrctl (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.version
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-universal
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      V: ${{ needs.detect.outputs.version }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          rustc --version
          if [ "$NAME" = macos-universal ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked --bin rrctl --target aarch64-apple-darwin
            cargo build --release --locked --bin rrctl --target x86_64-apple-darwin
            mkdir -p out
            lipo -create -output out/rrctl \
              target/aarch64-apple-darwin/release/rrctl \
              target/x86_64-apple-darwin/release/rrctl
            lipo -archs out/rrctl
          else
            cargo build --release --locked --bin rrctl
            mkdir -p out
            cp target/release/rrctl out/rrctl
          fi
          out/rrctl --version | grep -qx "rrctl ${V}" || { echo "::error::the binary does not say rrctl ${V}"; exit 1; }
      - name: Package
        run: |
          asset="rrctl-${V}-${NAME}.tar.gz"
          tar -C out -czf "$asset" rrctl
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rrctl-${{ matrix.name }}
          path: rrctl-*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the release and its tag.
      contents: write
    env:
      V: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          (cd dist && shasum -a 256 -c ./*.sha256)
          gh release create "v${V}" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "v${V}" \
            --notes "rrctl ${V}: the Roborock daemon, CLI and MCP server. Download the archive for your platform, check it against its .sha256, and put rrctl on your PATH. Or build it: cargo install --locked --git https://github.com/${REPO} --tag v${V}" \
            dist/*
