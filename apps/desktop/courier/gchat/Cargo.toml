[workspace]

[package]
name = "gchat_ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "gchat_ffi"
crate-type = ["staticlib", "rlib"]

[features]
default = []
test-loopback = []

[dependencies]
base64 = "0.22"
bytes = "1.6"
once_cell = "1.19"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
prost-types = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
url = "2.5"

[build-dependencies]
prost-build = "0.13"
prost-reflect-build = "0.14"
