# Publish-on-version-bump. The monorepo (vitruvian-core) authors vitruvian-code's
# version bump via release-please (bumping .release-please-manifest.json AND
# macos/Sources/VitruvianCode/Version.swift via extra-files), exported here. When
# the exported version has no matching tag yet, this is a new release: tag the
# exported commit, build the universal macOS app, sign and notarize all apps,
# the standalone tool binary, and the DMGs with the Apple Developer ID inside
# the `vitruvian-code-release` GitHub Environment, publish the DMGs/ZIPs, and
# update the Homebrew cask -- all with the mirror's existing RELEASE_AUTOMATION_
# TOKEN. Replaces the in-mirror release-please job (now in the monorepo).
#
# TAG SCHEME: this tags plain `vX.Y.Z` (matching the cask URL, which fixes the
# old bug where releases were tagged `nexus-agent-vX.Y.Z` but the cask pointed
# at `vX.Y.Z` -> brew install 404). The detect step also treats the LEGACY
# `nexus-agent-v$V` tag as "already released" so the cutover (current version
# 1.10.2, tagged nexus-agent-v1.10.2) is a NO-OP instead of a spurious rebuild.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - id: detect
        name: Detect a new release from the exported manifest
        run: |
          if [ ! -f .release-please-manifest.json ]; then
            echo "No manifest yet -- monorepo release-please has not cut a release."
            exit 0
          fi
          V="$(jq -r 'to_entries[0].value' .release-please-manifest.json)"
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "No version in manifest."
            exit 0
          fi
          # New plain tag OR a component-prefixed tag (vitruvian-code-v, or nexus-agent-v
          # before the rename) => already released.
          if git rev-parse "v$V" >/dev/null 2>&1 || git rev-parse "vitruvian-code-v$V" >/dev/null 2>&1 || git rev-parse "nexus-agent-v$V" >/dev/null 2>&1; then
            echo "v$V (or vitruvian-code-v$V, or legacy nexus-agent-v$V) already released -- nothing to do."
          else
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "Detected new release v$V."
          fi

      - name: Tag the exported commit + create the release
        if: steps.detect.outputs.version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          V="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"
          gh release create "v$V" --title "v$V" --generate-notes

  build-macos:
    needs: detect
    if: needs.detect.outputs.version
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build for ${{ matrix.arch }}
        run: |
          cd macos
          swift build -c release --arch ${{ matrix.arch }}

      # The executable and, beside it, the folder SwiftPM writes the chat
      # view's resources to (the copy of Mermaid that draws diagrams).
      # macos/scripts/bundle.sh copies that folder into the app and stops
      # when it is missing.
      - name: Upload arch binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VitruvianCode-${{ matrix.arch }}
          path: |
            macos/.build/release/VitruvianCode
            macos/.build/release/VitruvianCode_VitruvianCodeUI.bundle
            macos/.build/release/vitruvian-code-tool
          if-no-files-found: error

      # The bridge: the last release of Nexus Agent, the one old installs
      # update to. It installs Vitruvian Code (bridge/ holds its own package).
      - name: Build the bridge for ${{ matrix.arch }}
        run: |
          cd bridge
          swift build -c release --arch ${{ matrix.arch }}

      - name: Upload bridge binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NexusAgent-${{ matrix.arch }}
          path: bridge/.build/release/NexusAgent
          if-no-files-found: error

  package:
    needs: [detect, build-macos]
    if: needs.detect.outputs.version
    environment: vitruvian-code-release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SIGNING: developer-id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VitruvianCode-arm64
          path: /tmp/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VitruvianCode-x86_64
          path: /tmp/x86_64

      - name: Download the bridge binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NexusAgent-*
          path: /tmp/bridge

      - name: Create universal binary
        run: |
          mkdir -p /tmp/universal
          lipo -create \
            /tmp/arm64/VitruvianCode \
            /tmp/x86_64/VitruvianCode \
            -output /tmp/universal/VitruvianCode
          echo "==> Universal binary architectures:"
          lipo -info /tmp/universal/VitruvianCode
          # The resources are the same files for both architectures.
          cp -R /tmp/arm64/VitruvianCode_VitruvianCodeUI.bundle /tmp/universal/
          # The tool for the Vitruvian app, one binary for both as well.
          lipo -create \
            /tmp/arm64/vitruvian-code-tool \
            /tmp/x86_64/vitruvian-code-tool \
            -output /tmp/universal/vitruvian-code-tool
          lipo -info /tmp/universal/vitruvian-code-tool
          # The bridge, one binary for both as well.
          mkdir -p /tmp/bridge-universal
          lipo -create \
            /tmp/bridge/NexusAgent-arm64/NexusAgent \
            /tmp/bridge/NexusAgent-x86_64/NexusAgent \
            -output /tmp/bridge-universal/NexusAgent
          lipo -info /tmp/bridge-universal/NexusAgent

      - name: Assemble .app bundles
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          rustc --edition 2021 --crate-type lib --crate-name vitruvian_code_scripts_lib macos/scripts/src/lib.rs -o "$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib"
          rustc --edition 2021 macos/scripts/src/bin/bundle.rs -L "$RUNNER_TEMP" --extern vitruvian_code_scripts_lib="$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib" -o "$RUNNER_TEMP/bundle-app"

          # Universal
          mkdir -p /tmp/dist-universal
          "$RUNNER_TEMP/bundle-app" /tmp/universal/VitruvianCode "$VERSION" /tmp/dist-universal

          # arm64
          mkdir -p /tmp/dist-arm64
          "$RUNNER_TEMP/bundle-app" /tmp/arm64/VitruvianCode "$VERSION" /tmp/dist-arm64

          # x86_64
          mkdir -p /tmp/dist-x86_64
          "$RUNNER_TEMP/bundle-app" /tmp/x86_64/VitruvianCode "$VERSION" /tmp/dist-x86_64

          # The bridge: NexusAgent.app, under the name and ID old installs know.
          mkdir -p /tmp/dist-bridge
          "$RUNNER_TEMP/bundle-app" /tmp/bridge-universal/NexusAgent "$VERSION" /tmp/dist-bridge --bridge

      - name: Sign and notarize apps and tool
        env:
          VITRUVIAN_SIGNING_CERT_P12: ${{ secrets.VITRUVIAN_SIGNING_CERT_P12 }}
          VITRUVIAN_SIGNING_CERT_PASSWORD: ${{ secrets.VITRUVIAN_SIGNING_CERT_PASSWORD }}
          VITRUVIAN_NOTARY_API_KEY_P8: ${{ secrets.VITRUVIAN_NOTARY_API_KEY_P8 }}
          VITRUVIAN_NOTARY_KEY_ID: ${{ secrets.VITRUVIAN_NOTARY_KEY_ID }}
          VITRUVIAN_NOTARY_ISSUER_ID: ${{ secrets.VITRUVIAN_NOTARY_ISSUER_ID }}
        run: |
          scripts/sign-and-notarize.sh apps \
            --entitlements-app "/tmp/dist-universal/Vitruvian Code.app" \
            --entitlements-app "/tmp/dist-arm64/Vitruvian Code.app" \
            --entitlements-app "/tmp/dist-x86_64/Vitruvian Code.app" \
            --plain-app /tmp/dist-bridge/NexusAgent.app \
            --macho /tmp/universal/vitruvian-code-tool

      - name: Check the apps
        run: |
          set -euo pipefail
          export CHECK_NOTARIZED=0
          if [ "${SIGNING:-developer-id}" != "adhoc" ]; then
            export CHECK_NOTARIZED=1
          fi
          rustc --edition 2021 --crate-type lib --crate-name vitruvian_code_scripts_lib macos/scripts/src/lib.rs -o "$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib"
          rustc --edition 2021 macos/scripts/src/bin/check_packaged_app.rs -L "$RUNNER_TEMP" --extern vitruvian_code_scripts_lib="$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib" -o "$RUNNER_TEMP/check-packaged-app"
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-universal/Vitruvian Code.app" arm64 x86_64
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-arm64/Vitruvian Code.app" arm64
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-x86_64/Vitruvian Code.app" x86_64
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-bridge/NexusAgent.app" arm64 x86_64

      - name: Create DMGs
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"

          for arch in universal arm64 x86_64; do
            # The build for every Mac is the "macos" one: no new file says
            # "universal". Old updaters take the zip that does, and only the
            # bridge's zip is to be that.
            name="$arch"
            if [ "$arch" = universal ]; then name="macos"; fi
            stage="$RUNNER_TEMP/dmg-stage-${arch}"
            /bin/rm -rf "$stage"
            /bin/mkdir -p "$stage"
            /usr/bin/ditto "/tmp/dist-${arch}/Vitruvian Code.app" "$stage/Vitruvian Code.app"
            /bin/ln -s /Applications "$stage/Applications"
            /usr/bin/hdiutil create \
              -volname "Vitruvian Code" \
              -srcfolder "$stage" \
              -ov \
              -format UDZO \
              "VitruvianCode-${VERSION}-${name}.dmg"
            /bin/rm -rf "$stage"
          done

          ls -lh *.dmg

      - name: Sign and notarize DMGs
        env:
          VITRUVIAN_SIGNING_CERT_P12: ${{ secrets.VITRUVIAN_SIGNING_CERT_P12 }}
          VITRUVIAN_SIGNING_CERT_PASSWORD: ${{ secrets.VITRUVIAN_SIGNING_CERT_PASSWORD }}
          VITRUVIAN_NOTARY_API_KEY_P8: ${{ secrets.VITRUVIAN_NOTARY_API_KEY_P8 }}
          VITRUVIAN_NOTARY_KEY_ID: ${{ secrets.VITRUVIAN_NOTARY_KEY_ID }}
          VITRUVIAN_NOTARY_ISSUER_ID: ${{ secrets.VITRUVIAN_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          scripts/sign-and-notarize.sh dmgs \
            "VitruvianCode-${VERSION}-macos.dmg" \
            "VitruvianCode-${VERSION}-arm64.dmg" \
            "VitruvianCode-${VERSION}-x86_64.dmg"

      - name: Create ZIP for auto-updater
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          ditto -c -k --keepParent "/tmp/dist-universal/Vitruvian Code.app" "${GITHUB_WORKSPACE}/VitruvianCode-${VERSION}-macos.zip"
          # The bridge, in the zip old updaters take: the only one that says
          # "universal", with NexusAgent.app inside.
          ditto -c -k --keepParent /tmp/dist-bridge/NexusAgent.app "${GITHUB_WORKSPACE}/NexusAgent-${VERSION}-universal.zip"
          cd "${GITHUB_WORKSPACE}"
          # What the bridge and the new updater check the new app's zip against.
          shasum -a 256 "VitruvianCode-${VERSION}-macos.zip" > "VitruvianCode-${VERSION}-macos.zip.sha256"
          cat "VitruvianCode-${VERSION}-macos.zip.sha256"
          ls -lh *.zip

      # The tool as the Vitruvian app installs it: a zip of its folder with
      # vitruvian-tool.json at the top, bin/tool, and the copy of Mermaid
      # the chat's diagram cards draw with beside the program, where it
      # looks for an executable that is no bundle. The zip is what the
      # app's catalog (catalog/tools.json in vitruvian-core) pins by its
      # size and checksum, which the sidecar and the release notes carry.
      - name: Zip the tool's folder
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          folder="/tmp/tool/vitruvian-code"
          mkdir -p "$folder/bin"
          cp macos/tool/vitruvian-tool.json "$folder/"
          cp /tmp/universal/vitruvian-code-tool "$folder/bin/tool"
          chmod 755 "$folder/bin/tool"
          cp macos/Sources/VitruvianCodeUI/Resources/mermaid.min.js "$folder/bin/"
          asset="vitruvian-code-tool-${VERSION}.zip"
          (cd "$folder" && zip -r -X "${GITHUB_WORKSPACE}/${asset}" .)
          cd "${GITHUB_WORKSPACE}"
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          ls -l "$asset"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          TAG="v${VERSION}"

          for f in *.dmg *.zip *.sha256; do
            echo "Uploading $f..."
            gh release upload "$TAG" "$f" --clobber
          done

      # What a catalog entry for the tool pins, appended to the generated
      # notes, so a pull request to vitruvian-core can copy it off the
      # release page.
      - name: Say what the catalog entry pins
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          TAG="v${VERSION}"
          asset="vitruvian-code-tool-${VERSION}.zip"
          size="$(stat -f %z "$asset")"
          sha256="$(cut -d' ' -f1 "$asset.sha256")"
          notes="$(gh release view "$TAG" --json body -q .body)"
          printf '%s\n\n## The tool for the Vitruvian app\n\n`%s`: `size`: %s, `sha256`: %s\n' "$notes" "$asset" "$size" "$sha256" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          DMG_FILE="VitruvianCode-${VERSION}-macos.dmg"

          # Calculate SHA256 of the macOS (all Macs) dmg
          SHA256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')

          # Clone the tap repository
          git clone https://x-access-token:${GH_TOKEN}@github.com/VitruvianSoftware/homebrew-tap.git tap-repo
          cd tap-repo

          # Ensure Casks directory exists
          mkdir -p Casks

          # Write the Cask formula. The url tag (vX.Y.Z) now matches the release
          # tag created above -- this is the fix for the old 404 (releases were
          # tagged nexus-agent-vX while the cask pointed at vX).
          cat > Casks/nexus-agent.rb << EOF
          cask "nexus-agent" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/VitruvianSoftware/vitruvian-code/releases/download/v${VERSION}/${DMG_FILE}"
            name "Vitruvian Code"
            desc "Advanced multi-provider agent GUI"
            homepage "https://github.com/VitruvianSoftware/vitruvian-code"

            app "Vitruvian Code.app"
          end
          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nexus-agent.rb
          git commit -m "chore: update nexus-agent Cask to v${VERSION}" || echo "No changes to commit"
          git push origin main
