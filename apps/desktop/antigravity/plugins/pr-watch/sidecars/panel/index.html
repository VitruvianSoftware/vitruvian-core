<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Watch</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- Bridge to Antigravity: applies the host theme and defines window.sidecar. -->
  <script src="/preload.js"></script>
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <div>
        <h1>PR Watch</h1>
        <p id="summary" class="muted small">Loading…</p>
      </div>
      <div class="header-actions">
        <button id="font-down" type="button" class="secondary" aria-label="Smaller text">A−</button>
        <span id="font-size" class="muted small" aria-live="polite">100%</span>
        <button id="font-up" type="button" class="secondary" aria-label="Larger text">A+</button>
        <button id="refresh" type="button" class="secondary">Check now</button>
      </div>
    </header>

    <section class="card" aria-labelledby="add-title">
      <h2 id="add-title">Watch a pull request</h2>
      <p id="add-hint" class="muted small"></p>
      <form id="add-form" class="row">
        <label class="sr-only" for="add-ref">Pull request URL or number</label>
        <input id="add-ref" type="text" autocomplete="off" placeholder="PR URL or number (blank = this branch)">
        <button id="add-submit" type="submit">Watch</button>
      </form>
      <p id="add-error" class="error small" role="alert" hidden></p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title" class="sr-only">Watched pull requests</h2>
      <div id="list"></div>
      <p id="empty" class="muted" hidden>Nothing is being watched yet.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
