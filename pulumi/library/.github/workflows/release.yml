# Publish-on-version-bump (multi-package). The monorepo (vitruvian-core) authors
# this library's version bumps via release-please (.github/workflows/apps-release.yml,
# matrix leg pulumi/library); copybara exports each package's bumped
# .release-please-manifest.json into its own directory here (there is NO consolidated
# root manifest). This workflow scans those per-package manifests and detects each
# package whose version has no matching
# tag yet, tags the exported commit in the mirror's PATH-based Go format
# (go/pkg/<name>/vX.Y.Z -- required for `go get`) or the npm component format
# (foundation-<name>-vX.Y.Z), and `npm publish`es the bumped node packages with the
# mirror's existing tokens.
#
# It REPLACES the in-mirror release-please job (which authored version/changelog
# commits here -- the two-writable-copies drift the one-way migration removes). It
# never authors source; it only tags + publishes. This is the standard one-way
# pattern (devx/homelab/...) scaled to the library's 55 independently-versioned
# packages: the tag FORMAT stays owned by the mirror's release-please-config.json
# (standalone_only), the version NUMBERS come from the exported manifest.
#
# Idempotent: a package is tagged/published only when its manifest version has no
# existing tag, so the copybara seed (all packages already at their published
# versions) is a no-op, and re-runs never double-publish.
name: release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    packages: write
    # OIDC for npm TRUSTED PUBLISHING (see the publish step for why no token).
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"
                  scope: "@vitruviansoftware"

            # TRUSTED PUBLISHING (OIDC) -- no long-lived npm token anywhere.
            #
            # WHY NOT A TOKEN. NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} stopped
            # working; the stored credentials return E401 against the registry, and
            # ALL 31 public packages here are behind on npm as a result (three were
            # never published at all). Minting a replacement is a dead end rather
            # than a fix: GitHub deprecated 2FA-bypass granular access tokens on
            # 2026-07-08 -- phase 1 landed early August 2026, phase 2 (~January
            # 2027) removes direct publishing from them entirely.
            # https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
            #
            # REQUIRES a Trusted Publisher entry on npmjs.com for EACH published
            # package (organization VitruvianSoftware, repository pulumi-library,
            # workflow filename `release.yml`). The publishing workflow is the
            # MIRROR's copy of this file, so the repository registered there is
            # pulumi-library, not vitruvian-core.
            - name: Ensure npm can do trusted publishing
              run: |
                  set -euo pipefail
                  # Node 22 bundles npm 10.x; trusted publishing needs >= 11.5.1.
                  # Upgrade and then ASSERT: an npm too old does not say so, it
                  # quietly looks for a token that is no longer there.
                  npm install -g npm@latest >/dev/null
                  have="$(npm --version)"
                  if [ "$(printf "11.5.1\n%s" "$have" | sort -V | head -1)" != "11.5.1" ]; then
                    echo "::error::npm $have is older than 11.5.1; trusted publishing unsupported"
                    exit 1
                  fi
                  echo "npm $have (>= 11.5.1)"

                  # setup-node's `registry-url` writes `_authToken=${NODE_AUTH_TOKEN}`
                  # into the .npmrc it generates. With the token gone that expands to
                  # an EMPTY value, and npm then believes auth is already configured
                  # and never performs the OIDC exchange -- publishing fails with
                  # ENEEDAUTH, which reads like a credential problem rather than the
                  # configuration problem it is. Strip the line, then ASSERT it is
                  # gone; a silent no-op here would look exactly like a broken token.
                  # actions/setup-node#1551, npm/documentation#1960
                  rc="$(npm config get userconfig)"
                  if [ -n "$rc" ] && [ -f "$rc" ]; then
                    sed -i.bak '/_authToken/d' "$rc" && rm -f "$rc.bak"
                    if grep -q '_authToken' "$rc"; then
                      echo "::error::_authToken still present in $rc; OIDC will not trigger"
                      exit 1
                    fi
                    echo "npmrc cleared of _authToken: $rc"
                  fi

            - name: Build the ts workspace (for npm publish)
              working-directory: ts
              run: |
                  npm install
                  npm run build

            - name: Tag + publish newly-bumped packages (idempotent)
              env:
                  # No NODE_AUTH_TOKEN: publish authenticates via OIDC.
                  GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ ! -f release-please-config.json ]; then
                    echo "No exported release-please-config.json yet -- nothing to release."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  python3 - <<'PY'
                  import json, os, subprocess, glob, sys

                  config = json.load(open("release-please-config.json"))["packages"]
                  head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()

                  def tag_exists(t):
                      return subprocess.run(
                          ["git", "rev-parse", "-q", "--verify", "refs/tags/" + t],
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0

                  released = 0
                  # Collected rather than raised inline so ONE bad package does not hide the
                  # state of the rest; the job still fails at the end if any entry survives.
                  publish_failures = []
                  for mf in sorted(glob.glob("**/.release-please-manifest.json", recursive=True)):
                      if "node_modules" in mf:
                          continue
                      path = os.path.dirname(mf)
                      if not path:                                    # skip a consolidated root manifest if ever present
                          continue
                      data = json.load(open(mf))
                      if not data:
                          continue
                      version = next(iter(data.values()))             # per-package manifest has one entry; its key (monorepo path) is ignored
                      # A manifest with NO config entry is not "not an npm package" -- it is
                      # an unregistered one. `config.get(path, {})` used to make those
                      # indistinguishable, so the package was tagged, counted as released,
                      # and never published: `npm publish` was never CALLED, so there was no
                      # failure to classify and the job stayed green.
                      #
                      # release-please-config.json is standalone_only in copybara (the mirror
                      # owns it, because `go get` needs the Go arm's path-based tags), so
                      # adding a TS package in the monorepo adds nothing here -- and nothing
                      # noticed. ts/packages/app, -cicd and -data sat unpublished this way
                      # until 2026-08-21; foundation-app v0.4.1 tagged green with npm still
                      # serving 0.4.0 (run 32531859181).
                      if path not in config:
                          print("::error::{} has a release manifest but no entry in "
                                "release-please-config.json -- it would be tagged and "
                                "silently NOT published. Register it there.".format(path))
                          publish_failures.append("{} (unregistered)".format(path))
                          continue
                      cfg = config[path]
                      component = cfg.get("component", path)          # tag stem (mirror-owned format)
                      separator = cfg.get("tag-separator", "-")       # go/pkg/* use "/"; node uses "-"
                      tag = "{}{}v{}".format(component, separator, version)
                      # PUBLISH FIRST, TAG AFTER. The tag is the "this shipped" marker and the
                      # skip above reads it, so writing it BEFORE the publish makes a failed
                      # publish permanent: the tag exists, every later run skips the package,
                      # and the version never reaches the registry.
                      #
                      # Not hypothetical. On 2026-08-21 six releases tagged and then failed to
                      # publish, leaving foundation-log-export, -pubsub and -gcloud tagged at
                      # 0.4.1 while npm still served 0.2.0 -- unrecoverable without deleting
                      # tags by hand. mcp-slack's release.yml fixed exactly this ("TAG LAST,
                      # and only after a successful publish"); this workflow never got it.
                      #
                      # The skip is also no longer "a tag exists". For an npm package it is
                      # "a tag exists AND the registry actually has that version", so an orphan
                      # tag from a failed run SELF-HEALS on the next attempt.
                      is_npm = (cfg.get("release-type") == "node"
                                and path.startswith("ts/packages/")
                                and not json.load(open(os.path.join(path, "package.json"))).get("private"))
                      if tag_exists(tag):
                          if not is_npm:
                              continue
                          _nm = json.load(open(os.path.join(path, "package.json")))["name"]
                          if subprocess.run(["npm", "view", "{}@{}".format(_nm, version), "version"],
                                            capture_output=True, text=True).returncode == 0:
                              continue
                          print("  {} v{} is tagged but NOT on the registry -- retrying the publish".format(_nm, version))

                      print("Releasing {} v{} -> tag {}".format(path, version, tag))
                      publish_failed_here = False
                      # npm publish only the published node packages (ts/packages/*); the private
                      if cfg.get("release-type") == "node" and path.startswith("ts/packages/"):
                          pj = json.load(open(os.path.join(path, "package.json")))
                          if not pj.get("private"):
                              r = subprocess.run(["npm", "publish", "--access", "public"], cwd=path,
                                                 capture_output=True, text=True)
                              sys.stdout.write(r.stdout); sys.stderr.write(r.stderr)
                              if r.returncode != 0:
                                  # CLASSIFY, DO NOT SWALLOW. The only benign failure is npm
                                  # refusing because this exact version is already on the
                                  # registry -- which happens on a re-run. Everything else
                                  # (auth, network, policy) is a REAL publish failure and must
                                  # fail the job.
                                  blob = (r.stdout or "") + (r.stderr or "")
                                  already = ("EPUBLISHCONFLICT" in blob
                                             or "cannot publish over" in blob.lower()
                                             or "previously published version" in blob.lower())
                                  if already:
                                      print("  note: {} v{} is already on npm -- nothing to do".format(
                                          pj.get("name"), version))
                                  else:
                                      print("::error::npm publish failed for {} v{}".format(
                                          pj.get("name"), version))
                                      publish_failures.append("{}@{}".format(pj.get("name"), version))
                                      publish_failed_here = True
                      # Only now, with the publish succeeded (or nothing to publish), is the
                      # tag written -- so a failed publish leaves NO marker and the next run
                      # retries instead of skipping.
                      #
                      # This was a COMMENT, not code: #1878 moved the tagging after the
                      # publish call but never gated it on the result, so a failed publish
                      # still wrote its tag. Run 32532378474 pushed foundation-app-v0.4.1,
                      # -cicd-v0.4.0 and -data-v0.4.0 while all three publishes failed
                      # ENEEDAUTH. The self-heal above recovers it, but the marker should
                      # never have been written -- an invariant asserted in prose and not in
                      # code is not an invariant.
                      if publish_failed_here:
                          print("  not tagging {} v{} -- its publish failed; the next run "
                                "retries instead of skipping".format(path, version))
                          continue
                      if not tag_exists(tag):
                          subprocess.run(["git", "tag", "-a", tag, "-m", "{} v{}".format(path, version), head], check=True)
                          subprocess.run(["git", "push", "origin", tag], check=True)
                          # GitHub Release for parity with the prior release-please behaviour (best-effort).
                          subprocess.run(
                              ["gh", "release", "create", tag, "--title", tag,
                               "--notes", "Automated release of {} v{}.".format(path, version)],
                              check=False)
                      released += 1

                  print("Released {} newly-bumped package(s).".format(released) if released
                        else "No newly-bumped packages; nothing to tag/publish.")

                  # A publish that did not happen MUST turn this job red.
                  #
                  # This previously printed "warn: npm publish ... failed (may already be
                  # published)" and carried on, so the job went GREEN while nothing reached
                  # the registry. Measured 2026-08-20: ALL 31 public packages were behind --
                  # foundation-bootstrap at 0.4.0 in-repo vs 0.2.0 on npm, three never
                  # published at all -- across three months of "successful" releases. It also
                  # defeated the mirror alerting added in #1851, which keys on a run
                  # concluding `failure`: a workflow that lies about success is invisible to
                  # any watcher downstream of it.
                  if publish_failures:
                      print("::error::{} package(s) failed to publish: {}".format(
                          len(publish_failures), ", ".join(publish_failures)))
                      sys.exit(1)
                  PY
