# Backstage Software Catalog entities for the Pulumi ComponentResource Library
# and Google Cloud Example Foundation reference architectures.

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: pulumi-library-go
  title: Pulumi GCP Component Library (Go)
  description: Enterprise-grade Pulumi Go ComponentResources enforcing Google Cloud security best practices (bootstrap, project factory, IAM scopes, VPC networking, org policies, Cloud Run apps, BigQuery datasets, and WIF CI/CD)
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:./library/go
    vitruvian.dev/mirror: VitruvianSoftware/pulumi-library
    vitruvian.dev/release-model: goreleaser-pkg
    vitruvian.dev/environments: production
    vitruvian.dev/deploy-workflow: ci.yaml
  links:
    - url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/pulumi/library/go
      title: Go Source Code
      icon: github
    - url: https://github.com/VitruvianSoftware/pulumi-library
      title: GitHub Mirror Repository
      icon: github
    - url: https://pkg.go.dev/github.com/VitruvianSoftware/pulumi-library/go
      title: Go Package Docs (pkg.go.dev)
      icon: docs
spec:
  type: library
  lifecycle: production
  owner: platform-team
  system: pulumi-libraries
