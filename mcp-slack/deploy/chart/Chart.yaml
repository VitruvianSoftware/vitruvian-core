apiVersion: v2
name: mcp-slack
description: >-
  Remote HTTP transport for the mcp-slack MCP server — the internet-facing half
  of the Gemini Spark integration. The stdio/npx path is unaffected and is not
  deployed by this chart.
type: application
# The CHART's own packaging version, deliberately independent of the app's.
# Nothing publishes this chart to a registry — ArgoCD reads it from a git path —
# so this moves only when the chart's structure changes, not on every app
# release.
#
# It is already protected, and not by this comment: the release updater rewrites
# only lines carrying the trailing marker, so an unmarked line is untouched BY
# CONSTRUCTION. Asking nobody to wire it is the weaker half; the mechanism does
# the work. Adding the marker here is what would break it.
version: 0.1.0
# The APP version, and it must track mcp-slack/package.json or it lies about
# what the chart ships. It said "0.1.0" while the app was on 1.7.0, because
# release-please bumps package.json and had no reason to look in here.
#
# Cosmetic rather than dangerous — but CONDITIONALLY so, and the condition
# lives in another file. appVersion selects nothing *while the image is pinned
# by DIGEST in values.yaml*. It is metadata a human reads to answer "what is
# running?", which is exactly when a stale answer costs the most.
#
# READ THIS BEFORE MOVING THE IMAGE FROM A DIGEST TO A TAG. The standard Helm
# idiom for this field is `image: repo:{{ .Chart.AppVersion }}`. Adopt it and
# appVersion stops being metadata and starts selecting the artifact — at which
# point release-please changes the DEPLOYED IMAGE on every release, from a
# version-bump PR that touches no deployment file and names no image. Nothing
# in the PR that caused it would point here. Today there are zero
# `.Chart.AppVersion` references in this chart, and that is what makes the
# sentence above true; it is not a property of the field.
#
# The trailing marker below is what keeps it honest: release-please rewrites the
# version on any line carrying that marker, so appVersion now moves with the
# release instead of waiting for someone to notice. Wired via `extra-files` in
# mcp-slack/release-please-config.json; same mechanism as the precedent at
# nexus-agent/macos/Sources/NexusAgent/Version.swift.
#
# Deliberately NOT spelling the marker out anywhere in this comment block. The
# updater matches any line containing it and rewrites a version found there, so
# a comment that quotes the marker becomes a second, invisible substitution site
# — a doc string the release tooling would edit.
appVersion: "1.10.1" # x-release-please-version
