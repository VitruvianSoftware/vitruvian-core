# EVERY security-relevant value here is REQUIRED and has no default. The chart
# fails to render rather than deploying an endpoint that is reachable but
# unbounded — the same fail-closed reasoning applied throughout this build:
# a value we cannot interpret must never resolve to the permissive case.

image:
  # Digest, never a tag. A tag is a moving reference to an internet-facing
  # workload; a digest is the thing that was reviewed.
  repository: ghcr.io/vitruviansoftware/mcp-slack
  digest: ""            # REQUIRED — sha256:...
  pullPolicy: IfNotPresent

# Public hostname. Permanent name chosen deliberately rather than "-poc":
# renaming later costs a DNS/HTTPRoute change plus reconfiguring the client.
hostname: mcp-slack.ipv1337.dev

tunnel:
  # Cloudflare Tunnel UUID, from gitops/argocd/platform/cloudflared/configmap.yaml.
  # Not a secret — it is the CNAME target every tunnel-exposed app in this
  # cluster points at, and it is already in the repo in plaintext. Defaulted
  # rather than required because a wrong value here fails loudly (the name does
  # not resolve) rather than quietly widening anything.
  id: 1f7b9704-bb66-41f4-966f-5bb722e3c10e

# The MCP endpoint path. The HTTPRoute matches ONLY this prefix, which is what
# keeps /health off the internet — see templates/httproute.yaml.
mcpPath: /mcp

oidc:
  # Zitadel issuer. JWKS is fetched from here; nothing else is trusted.
  issuer: https://auth.ipv1337.dev
  # REQUIRED — `pulumi stack output projectId` from zitadel-apps-mcp-slack.
  # Never hand-typed: a wrong value here means the audience check validates
  # against the wrong project, which is the boundary, not a setting.
  projectId: ""

slack:
  # REQUIRED — comma-separated channel IDs. This is the allow-list, and it is
  # the only thing bounding which conversations a caller can reach. Empty is
  # not "no restriction", it is a render failure.
  #
  # THE MANIFEST NOW CARRIES groups:read AND groups:history, so this list
  # gates PRIVATE channels too, not only public ones. That changes what a
  # defect here costs: a wrong or over-broad entry is a private-conversation
  # disclosure, not a wider-than-intended public read. The value is unchanged
  # — required, fail-closed — but the reason it is required got stronger.
  #
  # Practical consequence for whoever fills this in: the IDs are opaque, and a
  # typo cannot be caught by reading them. Confirm each ID resolves to the
  # conversation you intend BEFORE putting it here, rather than after the
  # endpoint is live.
  channelIds: ""
  # Name of the SealedSecret-produced Secret carrying SLACK_BOT_TOKEN and
  # SLACK_TEAM_ID. No user token is ever mounted on this path.
  secretName: mcp-slack-tokens

# Hosts this pod may reach. Anything not listed is denied by the
# CiliumNetworkPolicy. Kept explicit rather than derived from other values so
# that widening egress is a visible diff.
egress:
  slackHost: slack.com
  idpHost: auth.ipv1337.dev

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { cpu: 500m, memory: 256Mi }

# Seconds the pod is given to finish in-flight requests. Inert unless the
# process handles SIGTERM — that half is the application's, and until it lands
# this only delays SIGKILL rather than draining.
terminationGracePeriodSeconds: 30

# NO ALERTING VALUES HERE, AND THE OMISSION IS DELIBERATE.
#
# The sustained-5xx alert for this workload is real, and it lives in
# gitops/argocd/platform/prometheus/applicationset.yaml under the `mcp-slack`
# rule group — not in this chart.
#
# This chart originally shipped it as a PrometheusRule, which was wrong: the
# cluster runs the plain prometheus chart, and there is no prometheus-operator
# and no `prometheuses.monitoring.coreos.com` CRD. The PrometheusRule CRD does
# exist (the valkey operator installs it), so the object would have been
# accepted by the apiserver, synced, and reported Healthy by ArgoCD — while
# never being loaded by anything. Prometheus reads its rules from
# `serverFiles.alerting_rules.yml`, full stop.
#
# That failure mode is worth naming because it is the one this alert exists to
# catch, reproduced one level up: a thing that looks like coverage, reports
# green, and is inert. Verified 2026-08-06 by `kubectl get crd` (no Prometheus
# CRD) and the deployment list (kube-state-metrics and pushgateway present, no
# operator).
