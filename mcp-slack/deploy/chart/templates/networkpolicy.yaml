# WHY THIS EXISTS
#
# Every other control on this endpoint is enforced by our own process: the
# channel allow-list, the audience check, the tool-list filter. All of them are
# void the moment the bot token leaves the pod. This policy is the layer that
# still holds in that case — it bounds where a compromised process can send
# the credential, not merely what our code chooses to do with it.
#
# THIS IS THE CLUSTER'S FIRST CiliumNetworkPolicy AND THE LAST ATTEMPT WAS
# REVERTED. Read `cecb67b7` and its revert `ec08150b` before changing this.
# The argocd-image-updater policy denied apiserver egress because it allowed
# the apiserver's *endpoint* IPs while traffic actually goes to the ClusterIP
# `10.43.0.1:443`; leader election failed every ~8s until it was reverted. The
# revert message records the fix: `toEntities: kube-apiserver` is the correct
# Cilium primitive, because a post-DNAT endpoint allow does not match.
#
# mcp-slack is a better first candidate than that controller was, and the
# reason is specific rather than optimistic: **it never talks to the
# apiserver.** It reads no Kubernetes objects and watches nothing. The exact
# failure that caused the revert is not in this workload's path.
#
# STILL UNVALIDATED AGAINST LIVE CLUSTER BEHAVIOUR. The revert's own
# instruction was to validate before re-merge and that has not been possible —
# ArgoCD reconciles from a repo whose CI is down. Treat this file as reviewed
# but unexercised until a preview against the live cluster says otherwise.
# DO NOT ADD AN EMERGENCY ingressDeny POLICY TO THIS CHART.
#
# The incident lever is a hand-created CiliumNetworkPolicy with an
# `ingressDeny` rule selecting these pods. It works because it is untracked:
# ArgoCD reverts drift on resources it owns, and a resource that was never in
# git carries no tracking label, so no Application touches it. Deny beats
# allow in Cilium regardless of which policy object grants the allow, so it
# actually cuts traffic — and `kubectl delete ciliumnetworkpolicy` restores
# service in seconds with no git change, no merge queue and nobody's
# permission. That reversibility is the whole point.
#
# Templating it destroys it, and not merely by adding a reconciler: a deny
# policy in the chart is PERMANENTLY ON. The lever's entire content is that it
# does not exist until someone creates it. Gating it behind a value puts
# ArgoCD between an operator and their stop button — toggle it during an
# incident and the next reconcile turns your containment back off — and the
# `IgnoreChanges`-style escape from that is the pattern that produced
# `accessTokenType` in zitadel-apps-mcp-slack: a security-relevant field the
# stack never reconciles while reporting clean.
#
# Verified on this cluster 2026-08-06, because a lever nobody tested is the
# thing this comment exists to prevent:
#   - Cilium is v1.17.17. Deny policies for peers OUTSIDE the cluster were
#     unreliable before 1.14 (cilium#15198), and our traffic arrives through
#     the tunnel from outside — so the version is load-bearing, not trivia.
#   - Untracked resources genuinely survive: kube-root-ca.crt has sat in the
#     whoami namespace since 2026-06-23 with no argocd tracking label, under
#     an Application running prune: true + selfHeal: true.
# Still unexercised: that a deny policy actually cuts tunnel-origin traffic
# here. The version check addresses the known bug; it is not a live test.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "mcp-slack.name" . }}-egress
  labels: {{- include "mcp-slack.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {{- include "mcp-slack.selectorLabels" . | nindent 6 }}
  egress:
    # DNS first, and it is not optional plumbing. `toFQDNs` matches nothing at
    # all unless the DNS proxy sees the lookup — so without this rule the
    # policy below silently denies everything rather than allowing the two
    # hosts named. That is a fail-open-shaped mistake in the other direction:
    # it fails closed, but for a reason nobody would guess from reading the
    # FQDN rules alone.
    #
    # The names are enumerated rather than `matchPattern: "*"`, and that is
    # the difference between this policy meeting its stated purpose and only
    # appearing to. kube-dns forwards upstream, so an unrestricted resolver
    # is an unrestricted egress channel: a compromised process encodes the
    # bot token into DNS labels and it leaves the cluster without ever
    # opening a connection to a host the TCP rules would deny. Bounding where
    # the credential can go is the whole reason this file exists — a rule
    # that bounds TCP and not DNS does not do it.
    #
    # Requires the pod's ndots:1 (see deployment.yaml): under the default
    # ndots:5 every lookup of these two names is preceded by refused
    # search-domain queries.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: {{ .Values.egress.slackHost | quote }}
              - matchName: {{ .Values.egress.idpHost | quote }}

    # Slack API — the workload's entire purpose.
    - toFQDNs:
        - matchName: {{ .Values.egress.slackHost | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Zitadel JWKS. Note this is the only reason the pod reaches the IdP at
    # all: tokens are verified locally against public keys, so there is no
    # introspection call and no client credential in this pod.
    - toFQDNs:
        - matchName: {{ .Values.egress.idpHost | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

  # No apiserver rule, deliberately — see the header. If a future change needs
  # one, it must use `toEntities: kube-apiserver` rather than endpoint IPs.
  #
  # Everything not listed above is denied: Cilium treats the presence of an
  # egress section as default-deny for this endpoint.
