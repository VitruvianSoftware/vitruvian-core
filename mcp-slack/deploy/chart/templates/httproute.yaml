#
# THE PATH MATCH IS A SECURITY CONTROL, NOT ROUTING TIDINESS.
#
# The server listens on one port and serves both /mcp and /health. /health is
# unauthenticated by design — a probe that required a token would be testing
# the IdP rather than the process — and that is correct *because* it is only
# reachable in-cluster. Kubelet probes address the pod IP directly and never
# traverse this route.
#
# Matching only the MCP path is therefore what keeps /health off the internet.
# Widen this to `/` and an anonymous liveness oracle for a laptop-hosted
# cluster appears, confirming the endpoint exists and is up without presenting
# a credential.
#
# The alternative — a second listener on a second port — was considered and
# rejected: it implements one security property in two places that then have
# to stay consistent. This version cannot drift because the server is unaware
# the distinction exists.
# This HTTPRoute does NOT create the public DNS name — see
# templates/dnsendpoint.yaml, which does, and which also explains why shipping
# it costs us a containment lever.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-slack.name" . }}
  labels: {{- include "mcp-slack.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: envoy-gateway-system
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcpPath | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "mcp-slack.name" . }}
          port: 80
          # Written explicitly even with a single backendRef. Gateway API
          # defaults an omitted weight to 1 server-side and ArgoCD does not
          # normalise CRD-schema defaults, so leaving it unset produces
          # perpetual OutOfSync — confirmed live on this cluster's whoami and
          # ntfy routes.
          weight: 1
