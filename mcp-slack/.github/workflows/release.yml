# Publish-on-version-bump. The monorepo (vitruvian-core) authors mcp-slack's
# version bump via release-please (bumping package.json + .release-please-
# manifest.json), exported here. When the version has no matching tag yet, this
# is a new release: tag the exported commit and npm-publish with the mirror's
# existing token. Replaces the in-mirror release-please job (now in the
# monorepo). Never authors source; only tags + ships.
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - id: detect
        name: Detect a new release from the exported manifest
        run: |
          if [ ! -f .release-please-manifest.json ]; then
            echo "No manifest yet -- monorepo release-please has not cut a release."
            exit 0
          fi
          V="$(jq -r 'to_entries[0].value' .release-please-manifest.json)"
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "No version in manifest."
            exit 0
          fi
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "v$V already released -- nothing to do."
          else
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "Detected new release v$V."
          fi

      - name: Tag the exported release commit
        if: steps.detect.outputs.version
        run: |
          V="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.version
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
        if: steps.detect.outputs.version

      - run: npm run build
        if: steps.detect.outputs.version

      - run: npm publish --access public
        if: steps.detect.outputs.version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_TOKEN }}
