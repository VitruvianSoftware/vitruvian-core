# Machine-readable app metadata (#500): the single per-app source for
# ownership, deploy identity, and release model. Backstage-compatible
# Component; consumed today by tools/conformance (owner must match
# .github/CODEOWNERS) and by humans/agents doing impact analysis.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mcp-slack
  description: MCP server exposing Slack tools — TypeScript, published to npm as @vitruviansoftware/mcp-slack, and deployed as a hosted Streamable HTTP OAuth service
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
    opentelemetry.io/service-name: mcp-slack
    prometheus.io/rule: mcp-slack
    prometheus.io/alert: all
    backstage.io/kubernetes-id: mcp-slack
    backstage.io/kubernetes-namespace: mcp-slack
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=mcp-slack
    argocd/app-name: mcp-slack
    vitruvian.dev/release-workflow: apps-release.yaml
    vitruvian.dev/release-model: npm-publish
    vitruvian.dev/environments: production
    vitruvian.dev/mirror: VitruvianSoftware/mcp-slack
  links:
    - url: https://status.ipv1337.dev
      title: Uptime Status
      icon: web
    - url: https://www.npmjs.com/package/@vitruviansoftware/mcp-slack
      title: npm Package
      icon: web
    - url: https://github.com/VitruvianSoftware/mcp-slack
      title: GitHub Mirror
      icon: github
    - url: https://argocd.lab.ipv1337.dev/applications/mcp-slack
      title: ArgoCD Application
      icon: cloud
    - url: https://github.com/VitruvianSoftware/vitruvian-core/pkgs/container/mcp-slack
      title: Container Image (GHCR)
      icon: docker
    - url: https://github.com/VitruvianSoftware/vitruvian-core/blob/main/docs/operations/incident-triage-runbook.md
      title: Incident Triage Runbook
      icon: docs
spec:
  type: service
  lifecycle: production
  owner: mcp-slack-team
  system: mcp-slack
  providesApis:
    - mcp-slack-api
  dependsOn:
    - resource:default/sealed-secrets
    - resource:default/pulumi-zitadel-apps-mcp-slack
