# osv-scanner baseline — accepted findings with no same-major upstream fix.
#
# The required `osv-scan` gate (and `bazel run //tools/osv-scan`) fails on any
# unaccepted advisory in this repo's dependencies.
#
# TWO CLASSES OF ENTRY BELOW:
#
#  1. TIME-BOXED (ignoreUntil = YYYY-MM-DD). Either the fix is only in a newer
#     major version that the depending package does not accept (forcing it would
#     ship an untested breaking release under that package), or no fixed release
#     exists yet upstream. When the date lapses the gate goes red and the call
#     must be made again -- upgrade if an upstream release has landed, or
#     re-evaluate.
#
#  2. PERMANENT (no expiry). Advisories that report a package as unmaintained or
#     unsafe by design with no fixed version in any range (GO-2026-5932 for
#     golang.org/x/crypto/openpgp, GHSA-848j-6mx2-7j84 for npm elliptic, and
#     3 RUSTSEC "unmaintained crate" notices from libsignal's Rust tree). An
#     expiry date on an unfixable design/maintenance notice would be a fiction:
#     no future date makes it actionable. Revisit only if the dependency itself
#     is dropped.

[[IgnoredVulns]]
