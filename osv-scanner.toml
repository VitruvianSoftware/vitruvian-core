# osv-scanner baseline — pre-existing findings, accepted explicitly.
#
# The required `osv-scan` gate (and `bazel run //tools/osv-scan`) fails on any
# advisory in this repo's dependencies. Everything listed here was ALREADY
# PRESENT when the gate landed. Failing on them would have made a REQUIRED check
# red on day one, and a permanently-red gate is one everybody learns to ignore
# -- the same reasoning that makes tools/ci/secret-scan.sh diff-scoped over this
# repo's known historical findings.
#
# This is a BASELINE, not an absolution. What it buys immediately is the point
# of a pre-merge gate: any NEWLY introduced vulnerable dependency fails the
# build. What it explicitly does not do is pretend the backlog is clean.
#
# Measured with osv-scanner v2.4.0 on 2026-07-25, `--recursive` from the PRIMARY
# checkout: 104 sources, 143 distinct advisories (npm 79, Go 56, PyPI 8).
# Generated from `--format json`, never from the human-readable table -- the
# table paginates and reports aliases, and parsing it produced four different
# wrong counts before this file was written correctly.
#
# TWO CLASSES OF ENTRY BELOW:
#
#  1. TIME-BOXED (ignoreUntil = 2026-10-23). Fixable today. When the date lapses
#     the gate goes red and the call must be made again -- upgrade, or re-accept
#     with a fresh reason. Do NOT bump these dates as routine maintenance; that
#     converts a time-box into a permanent suppression, which is precisely what
#     this format exists to prevent.
#
#  2. PERMANENT (no expiry). 2 advisories have NO fixed version in any
#     range -- chiefly GO-2026-5932, which reports golang.org/x/crypto/openpgp as
#     unmaintained and unsafe by design, and fires on 99 of 102 go.mod. An
#     expiry date on an unfixable advisory would be a fiction: no future date
#     makes it actionable. These are suppressed outright and must be revisited
#     only if the dependency itself is dropped.
#
# KNOWN REMEDIATION, deliberately NOT bundled into the CI swap that introduced
# this file: infrastructure/pulumi/go.mod and infrastructure/pulumi/pkg/secrets/
# go.mod are stranded on golang.org/x/crypto 0.48.0 while the rest of the repo
# runs 0.53/0.54, carrying a 15-advisory cluster incl. a CVSS 10.0. That is live
# infra deployed through CI. The vulnerable surface is the SSH server/agent path
# this repo does not run, so it is dependency hygiene rather than an exploit
# path -- but it is the single most worthwhile follow-up here.

