# NOTE: The API spec.definition blocks below are placeholder registrations.
# They declare the API entity and its type for the dependency graph, but the
# definitions are NOT the real API contracts. Replace with $text: references
# to the actual OpenAPI/proto/JSON-RPC spec files as they are authored.

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tabula-api
  title: Tabula REST API
  description: REST API specification for Tabula workspace data, document schemas, and session synchronization
  links:
    - url: https://github.com/VitruvianSoftware/tabula
      title: Source Code
      icon: github
spec:
  type: openapi
  lifecycle: production
  owner: tabula-team
  system: tabula-platform
  definition: |
    openapi: "3.0.0"
    info:
      version: 1.0.0
      title: Tabula API
      description: Workspace backend and document persistence API
    paths:
      /v1/workspaces:
        get:
          summary: List workspaces
          responses:
            '200':
              description: OK
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: oauth-inspector-api
  title: OAuth Inspector API
  description: Express/OIDC token inspection and introspection endpoint specification
  links:
    - url: https://github.com/VitruvianSoftware/oauth-user-inspector
      title: Source Code
      icon: github
spec:
  type: openapi
  lifecycle: production
  owner: oauth-user-inspector-team
  system: oauth-user-inspector
  definition: |
    openapi: "3.0.0"
    info:
      version: 1.0.0
      title: OAuth Inspector API
      description: User session and token inspection endpoints
    paths:
      /api/inspect:
        post:
          summary: Inspect JWT token
          responses:
            '200':
              description: Token inspection details
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: buzz-relay-api
  title: Buzz Relay gRPC Protocol
  description: High-speed protocol buffer and gRPC relay specification for agent coordination
  links:
    - url: https://github.com/VitruvianSoftware/vitruvian-core/tree/main/gitops/argocd/platform/buzz
      title: Buzz Service Manifests
      icon: docs
spec:
  type: grpc
  lifecycle: production
  owner: platform-team
  system: buzz-relay
  definition: |
    syntax = "proto3";
    package vitruvian.buzz.v1;
    service BuzzRelay {
      rpc DispatchAgentTask (TaskRequest) returns (TaskResponse);
    }
    message TaskRequest { string task_id = 1; string payload = 2; }
    message TaskResponse { string task_id = 1; string status = 2; }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mcp-slack-api
  title: MCP Slack Tool Protocol
  description: Model Context Protocol (MCP) JSON-RPC schema for Slack channels, messaging, and canvas tools
  links:
    - url: https://www.npmjs.com/package/@vitruviansoftware/mcp-slack
      title: npm Package
      icon: web
spec:
  type: mcp-jsonrpc
  lifecycle: production
  owner: mcp-slack-team
  system: mcp-slack
  definition: |
    jsonrpc: "2.0"
    title: MCP Slack Tools
    tools:
      - name: slack_post_message
        description: Post a message to a Slack channel
      - name: slack_list_channels
        description: List public channels in the workspace
      - name: slack_search_messages
        description: Search Slack message history
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: backstage-mcp-api
  title: Backstage MCP Actions API
  description: Model Context Protocol (MCP) Streamable HTTP endpoint exposing Software Catalog discovery and action execution
  links:
    - url: https://backstage.vitruviansoftware.dev/api/mcp-actions/v1
      title: Live MCP Endpoint
      icon: api
spec:
  type: mcp-jsonrpc
  lifecycle: production
  owner: platform-team
  system: developer-portal
  definition: |
    jsonrpc: "2.0"
    title: Backstage MCP Actions
    tools:
      - name: catalog.get-entities
        description: Fetch entities from Backstage software catalog
      - name: catalog.get-entity-by-name
        description: Fetch a specific entity by kind, namespace, and name
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: whoami-http-api
  title: whoami Echo & Canary HTTP API
  description: HTTP echo and header introspection endpoint for progressive delivery testing
  links:
    - url: https://whoami.ipv1337.dev
      title: Live whoami Endpoint
      icon: web
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: reference-workloads
  definition: |
    openapi: "3.0.0"
    info:
      version: 1.0.0
      title: whoami Echo API
      description: Canary echo and HTTP header introspection API
    paths:
      /:
        get:
          summary: Echo HTTP headers, hostname, and request IP
          responses:
            '200':
              description: Text output of request details
