<svg preserveAspectRatio="none" width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css">
        :root {
          color: rgba(0, 0, 0, 0.1);
          @media (prefers-color-scheme: dark) {
            color: rgba(255, 255, 255, 0.15);
          }
        }

        #bg {
          fill: currentColor;
        }

        #flashes {
          animation: slide-across 4s ease-in-out infinite;
        }

        #flashes rect {
          fill: url(#gradient);
          height: 100%;
          width: 400%;
          opacity: 0.5;
        }

        @keyframes slide-across {
          from { transform: translateX(-1350%); }
          to { transform: translateX(-150%); }
        }
    </style>
    <rect id="bg" x="0" y="0" width="100%" height="100%" />
    <g id="flashes">
      <rect x="0"/>
      <rect x="400%" />
      <rect x="800%" />
      <rect x="1200%" />
    </g>
    <defs>
      <linearGradient id="gradient">
        <stop stop-color="transparent" offset="0%" />
        <stop stop-color="currentColor" stop-opacity="0.1" offset="15%" />
        <stop stop-color="currentColor" offset="40%" />
        <stop stop-color="currentColor" offset="60%" />
        <stop stop-color="currentColor" stop-opacity="0.1" offset="85%" />
        <stop stop-color="transparent" offset="100%" />
      </linearGradient>
    </defs>
</svg>
