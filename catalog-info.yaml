# Repo-level catalog root (#500): the System plus a Location pointing at each
# app's own catalog-info.yaml — the per-app files are the source of truth for
# ownership/deploy metadata (enforced against .github/CODEOWNERS by
# tools/conformance). This replaces the stale Aspect scaffold placeholder
# ("javascript-generated-blueprint") that carried a wrong name, owner, and
# repo URL.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: vitruvian-core
  description: VitruvianSoftware polyglot Bazel monorepo — apps, IaC, developer tooling, homelab platform
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: vitruvian-core-apps
  description: Per-app component metadata (one catalog-info.yaml per app directory)
spec:
  targets:
    - ./apps/web/backstage/catalog-info.yaml
    - ./apps/cli/devx/catalog-info.yaml
    - ./apps/cli/homelab/catalog-info.yaml
    - ./apps/embedded/esp32-s3/catalog-info.yaml
    - ./apps/mcp/slack/catalog-info.yaml
    - ./apps/desktop/nexus-agent/catalog-info.yaml
    - ./apps/web/oauth-user-inspector/catalog-info.yaml
    - ./apps/mobile/android-remote/catalog-info.yaml
    - ./apps/suites/tabula/catalog-info.yaml
    - ./packages/design-system-android/catalog-info.yaml
    - ./tools/catalog-info.yaml
    - ./infrastructure/catalog-info.yaml
    - ./packages/pulumi/catalog-info.yaml
    # Platform infrastructure we operate (not applications we build)
    - ./gitops/catalog-info.yaml
---
# Scaffolder templates served on Backstage's Create page. Kept in its own
# Location rather than folded into vitruvian-core-apps above because that list
# is per-APP component metadata and is appended to automatically by the
# `vitruvian:app:render` action; a Template is neither an app nor something that
# action should ever touch.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: vitruvian-core-templates
  description: Software templates (scaffolder) published by this repository
spec:
  targets:
    - ./apps/web/backstage/templates/stamp-application/template.yaml
    - ./apps/web/backstage/templates/cloud-run-service/template.yaml
    - ./apps/web/backstage/templates/mcp-server/template.yaml
    - ./apps/web/backstage/templates/k8s-canary-microservice/template.yaml
---
# Users and Groups are NOT declared here. They are ingested from the
# VitruvianSoftware GitHub organisation by the githubOrg entity provider
# (catalog.providers.githubOrg), which emits user:default/<login> and
# group:default/<team-slug> -- the same refs this file used to hand-declare, so
# every `owner:` below still resolves. Add a person to the org or a GitHub team
# and the catalog follows within the hour; there is nothing to edit here.
---
# External VitruvianSoftware repositories. Each already ships its own
# catalog-info.yaml, so these are Locations pointing at the source of truth in
# that repo rather than copies maintained here -- the same pattern as the
# per-app Location above.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: vitruvian-external-repos
  description: Repositories outside the monorepo that publish their own catalog metadata
spec:
  type: url
  targets:
    - https://github.com/VitruvianSoftware/aspect-workflows-template/blob/platform-v2.0/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-kitchen-sink/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-cpp/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-go/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-java/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-js/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-kotlin/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-minimal/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-py/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-ruby/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-rust/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-scala/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-shell/blob/main/catalog-info.yaml
    - https://github.com/VitruvianSoftware/backstage-swift/blob/main/catalog-info.yaml
---
# site-vitruviansoftware-dev is the one repo here with no catalog-info.yaml of
# its own, so its Component is declared inline. Move it into that repo if it
# ever grows its own metadata.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: site-vitruviansoftware-dev
  title: Vitruvian Software Site
  description: Vitruvian Software open source landing portal and technical documentation site
  annotations:
    github.com/project-slug: VitruvianSoftware/site-vitruviansoftware-dev
    backstage.io/techdocs-ref: dir:.
    vitruvian.dev/release-model: cloudflare-pages
    vitruvian.dev/environments: production
    vitruvian.dev/deploy-workflow: deploy.yaml
  links:
    - url: https://vitruviansoftware.dev
      title: Live Site
      icon: web
    - url: https://github.com/VitruvianSoftware/site-vitruviansoftware-dev
      title: Source Code
      icon: github
    - url: https://github.com/VitruvianSoftware/site-vitruviansoftware-dev/releases
      title: Releases & Deployments
      icon: cloud
spec:
  type: website
  lifecycle: production
  owner: platform-team
  system: vitruvian-core

