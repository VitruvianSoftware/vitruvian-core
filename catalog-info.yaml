# Repo-level catalog root (#500): the System plus a Location pointing at each
# app's own catalog-info.yaml — the per-app files are the source of truth for
# ownership/deploy metadata (enforced against .github/CODEOWNERS by
# tools/conformance). This replaces the stale Aspect scaffold placeholder
# ("javascript-generated-blueprint") that carried a wrong name, owner, and
# repo URL.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: vitruvian-core
  description: VitruvianSoftware polyglot Bazel monorepo — apps, IaC, developer tooling, homelab platform
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: vitruvian-core-apps
  description: Per-app component metadata (one catalog-info.yaml per app directory)
spec:
  targets:
    - ./devx/catalog-info.yaml
    - ./homelab/catalog-info.yaml
    - ./mcp-slack/catalog-info.yaml
    - ./nexus-agent/catalog-info.yaml
    - ./oauth-user-inspector/catalog-info.yaml
    - ./tabula/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: ipv1337
  annotations:
    github.com/user-login: ipv1337
spec:
  profile:
    displayName: James Nguyen
    email: james.nguyen@gmail.com
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
spec:
  type: team
  profile:
    displayName: Platform Team
    email: platform@vitruviansoftware.dev
  children: []
