# Runner labels actionlint does not know yet.
#
# ubuntu-26.04 is a GitHub-hosted, generally-available image
# (actions/runner-images#14748), but actionlint's built-in label list stops at
# ubuntu-24.04 as of v1.7.12 -- the latest release. Without this entry every
# `runs-on: ubuntu-26.04` fails the required `actionlint` check.
#
# REMOVE THIS once an actionlint release lists ubuntu-26.04 in
# rule_runner_label.go; this block then does nothing but hide a typo.
self-hosted-runner:
  labels:
    - ubuntu-26.04
