name: Bug Report
description: File a bug report or report unexpected behavior
title: "fix(<component>): <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Before opening, please search existing issues and discussions to see if this has already been reported.

        > For security vulnerabilities, do not open an issue — see our [Security Policy](https://github.com/VitruvianSoftware/vitruvian-core/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Affected Component / Area
      description: Which area or package in the repository is affected?
      options:
        - apps/cli/devx
        - apps/cli/homelab
        - apps/suites/tabula
        - apps/mcp/slack
        - apps/desktop/nexus-agent
        - apps/web/oauth-user-inspector
        - apps/web/backstage
        - infrastructure/pulumi
        - gitops/argocd
        - tools/platform
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What commands or steps lead to the issue?
      placeholder: |
        1. Run `bazel test //...`
        2. Execute `devx ...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Version Details
      description: Details regarding your development environment.
      placeholder: |
        - OS: macOS 14.x / Ubuntu 22.04
        - Architecture: arm64 / x86_64
        - Bazel version: (bazel --version)
        - Branch / commit: (git rev-parse HEAD)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Terminal Output
      description: Please provide full error output or logs (wrapped in code blocks).
      render: shell
    validations:
      required: false
