name: Feature Request
description: Propose a new feature, architecture enhancement, or tool improvement
title: "feat(<component>): <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to vitruvian-core!
  - type: dropdown
    id: component
    attributes:
      label: Target Component / Area
      description: Which area or package in the repository will this feature target?
      options:
        - apps/cli/devx
        - apps/cli/homelab
        - apps/suites/tabula
        - apps/mcp/slack
        - apps/desktop/nexus-agent
        - apps/web/oauth-user-inspector
        - apps/web/backstage
        - infrastructure/pulumi
        - gitops/argocd
        - tools/platform
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation & Problem Statement
      description: What problem does this feature solve? What is the user need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Technical Design
      description: How should this work? Detail APIs, commands, or architecture changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs or workarounds that were explored?
    validations:
      required: false
  - type: checkboxes
    id: contributions
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am willing to submit a pull request implementing this feature
