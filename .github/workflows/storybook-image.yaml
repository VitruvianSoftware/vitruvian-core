# Builds and publishes the Vitruvian Storybook container image to GHCR,
# which is deployed to the homelab k3s cluster via GitOps (ArgoCD).

name: storybook-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - '.github/workflows/storybook-image.yaml'
  pull_request:
    paths:
      - 'packages/design-system/**'
      - '.github/workflows/storybook-image.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/storybook
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @vitruviansoftware/design-system build-storybook

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: packages/design-system
          file: packages/design-system/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Without a layer cache every run reinstalls the whole dependency tree
          # from scratch -- and does it twice, because linux/arm64 is emulated
          # under QEMU on an amd64 runner. The pnpm install layer is keyed on the
          # lockfile + package.json, so a source-only change now reuses it.
          # Scoped per image so the two builds cannot evict each other from the
          # shared 10GB GitHub Actions cache.
          cache-from: type=gha,scope=storybook-image
          cache-to: type=gha,mode=max,scope=storybook-image
