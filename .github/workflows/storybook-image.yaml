# Builds and publishes the Vitruvian Storybook container image to GHCR,
# which is deployed to the homelab k3s cluster via GitOps (ArgoCD).

name: storybook-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages/design-system/web/**'
      - '!packages/design-system/web/**/BUILD'
      - '!packages/design-system/web/**/BUILD.bazel'
      - '!packages/design-system/web/**/OWNERS'
      - '!packages/design-system/web/deploy/**'
      - '!packages/design-system/web/mkdocs.yml'
      - '!packages/design-system/web/tools/**'
      - '!packages/design-system/web/**/*.md'
      - '.github/workflows/storybook-image.yaml'
  pull_request:
    paths:
      - 'packages/design-system/web/**'
      - '!packages/design-system/web/**/BUILD'
      - '!packages/design-system/web/**/BUILD.bazel'
      - '!packages/design-system/web/**/OWNERS'
      - '!packages/design-system/web/deploy/**'
      - '!packages/design-system/web/mkdocs.yml'
      - '!packages/design-system/web/tools/**'
      - '!packages/design-system/web/**/*.md'
      - '.github/workflows/storybook-image.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/storybook
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store (read-only)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-pnpm-

      - name: Restore and save pnpm store (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Storybook's build transpiles stories with esbuild, which strips types
      # without checking them -- a story passing a bad prop still builds and
      # ships. This is the only lane that typechecks the stories.
      - name: Typecheck stories
        run: pnpm --filter @vitruviansoftware/design-system typecheck

      - name: Build Storybook
        run: pnpm --filter @vitruviansoftware/design-system build-storybook

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/design-system/web
          file: packages/design-system/web/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Without a layer cache every run reinstalls the whole dependency tree
          # from scratch -- and does it twice, because linux/arm64 is emulated
          # under QEMU on an amd64 runner. The pnpm install layer is keyed on the
          # lockfile + package.json, so a source-only change now reuses it.
          # Scoped per image so the two builds cannot evict each other from the
          # shared 10GB GitHub Actions cache.
          # Layer cache (#2841). On main it lives in the registry, next to the
          # image, as the `buildcache` tag -- NOT in the Actions cache, where
          # these three image builds held about 2.2 GiB of the repo's shared
          # 10 GiB budget and pushed it over the limit, evicting other jobs'
          # entries. Non-main runs (PRs, merge queue) read from the registry and
          # gha caches without writing; only main writes cache-to.
          # ignore-error: a failed cache upload must not fail the image build.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha,scope=storybook-image
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.IMAGE) || '' }}
