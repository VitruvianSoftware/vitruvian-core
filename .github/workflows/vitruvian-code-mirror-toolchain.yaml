name: Vitruvian Code Mirror Toolchain

# Rehearses the standalone Vitruvian Code app's release the way its public mirror
# runs it: the same runner image and the same steps as the build-macos and
# package jobs of apps/desktop/vitruvian-code/.github/workflows/release.yml, from
# `swift build` to the three .app bundles, the DMGs and the ZIP. That file is
# exported to the mirror and never runs here, so without this a change to it,
# or to macos/scripts/src/bundle.rs, first runs on a real release.
#
# Why this exists beside //apps/desktop/vitruvian-code/macos:mirror_build_test:
# that test runs on this repository's pinned Xcode, which is newer than the one
# the mirror builds with, and it never passes the build through an artifact.
# It catches a library missing from Package.swift. It cannot catch code that
# only the newer Swift accepts, a resource folder the older Swift names or lays
# out differently, or an upload that leaves a file behind. The mirror tags a
# release BEFORE it builds, so each of those would ship a release with no
# binaries, or with an app whose diagrams do not draw.
#
# It also runs the package's tests with that Swift, which the mirror's release
# does not: the tests otherwise run only under Bazel, on the newer Xcode.
#
# Left out, because they publish or need the mirror's token: the detect job
# (which tags and creates the release), "Upload release assets", "Say what
# the catalog entry pins" and "Update Homebrew Cask". The mirror's release
# signs and notarizes with the Apple Developer ID inside its
# `vitruvian-code-release` environment; this rehearsal runs on pull requests
# without release secrets, so it opts out explicitly with `SIGNING: adhoc`.
#
# Only when the package or its release changes, so it runs rarely. A standard
# GitHub-hosted runner on a public repository is not billed. NOT a required
# check: a red run here means "the next standalone release would fail".
# It also runs on pushes to main, to warm the Rust toolchain and Node tarball caches.
#
# The steps the two files share must stay word for word the same, apart from
# this repository's path to the package and the pinned actions.
# //tools/ci:vitruvian_code_release_rehearsal_test compares them and fails when
# one changes without the other.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/vitruvian-code/macos/Package.swift'
      - 'apps/desktop/vitruvian-code/macos/Sources/**'
      - 'apps/desktop/vitruvian-code/macos/Tests/**'
      - 'apps/desktop/vitruvian-code/macos/Resources/**'
      - 'apps/desktop/vitruvian-code/macos/claude-helper/bundle/**'
      - 'apps/desktop/vitruvian-code/macos/claude-helper/node.lock'
      - 'apps/desktop/vitruvian-code/macos/scripts/**'
      - 'apps/desktop/vitruvian-code/scripts/**'
      - 'apps/desktop/vitruvian-code/src/**'
      - 'apps/desktop/vitruvian-code/testdata/**'
      - 'apps/desktop/vitruvian-code/THIRD_PARTY_NOTICES.md'
      - 'apps/desktop/vitruvian-code/.github/workflows/release.yml'
      - '.github/workflows/vitruvian-code-mirror-toolchain.yaml'
  pull_request:
    paths:
      - 'apps/desktop/vitruvian-code/macos/Package.swift'
      - 'apps/desktop/vitruvian-code/macos/Sources/**'
      - 'apps/desktop/vitruvian-code/macos/Tests/**'
      - 'apps/desktop/vitruvian-code/macos/Resources/**'
      - 'apps/desktop/vitruvian-code/macos/claude-helper/bundle/**'
      - 'apps/desktop/vitruvian-code/macos/claude-helper/node.lock'
      - 'apps/desktop/vitruvian-code/macos/scripts/**'
      - 'apps/desktop/vitruvian-code/scripts/**'
      - 'apps/desktop/vitruvian-code/src/**'
      - 'apps/desktop/vitruvian-code/testdata/**'
      - 'apps/desktop/vitruvian-code/THIRD_PARTY_NOTICES.md'
      - 'apps/desktop/vitruvian-code/.github/workflows/release.yml'
      - '.github/workflows/vitruvian-code-mirror-toolchain.yaml'
  # Run it by hand after changing the mirror's runner image.
  workflow_dispatch:

# Per-commit keying on non-PR events so pushes to main do not evict each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout and build.
permissions:
  contents: read

jobs:
  # release.yml: build-macos.
  build:
    name: swift build (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain the mirror builds with
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Compute Rust 1.98.1 cache key and path
        id: rust-cache-key
        env:
          ARCH: ${{ matrix.arch }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
            arm64) rust_target="aarch64-apple-darwin" ;;
            x86_64) rust_target="x86_64-apple-darwin" ;;
            *) echo "::error::Unsupported arch ${ARCH}" >&2; exit 1 ;;
          esac
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          host_triple="$({ rustc -vV 2>/dev/null || true; } | awk '/^host:/ { print $2 }')"
          if [ -z "$host_triple" ]; then
            case "${RUNNER_OS}:${RUNNER_ARCH}" in
              macOS:ARM64) host_triple="aarch64-apple-darwin" ;;
              macOS:X64) host_triple="x86_64-apple-darwin" ;;
              *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
            esac
          fi
          {
            echo "rust-target=${rust_target}"
            echo "path=${rustup_home}/toolchains/1.98.1-${host_triple}"
            # Bump the v1 segment to drop a bad cache entry.
            if [ "${rust_target}" = "${host_triple}" ]; then
              echo "key=rustup-toolchain-v1-${RUNNER_OS}-${RUNNER_ARCH}-1.98.1-minimal"
            else
              echo "key=rustup-toolchain-v1-${RUNNER_OS}-${RUNNER_ARCH}-1.98.1-minimal-${rust_target}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Restore Rust 1.98.1 toolchain cache (read-only)
        id: rust-cache-restore
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Restore and save Rust 1.98.1 toolchain cache (main only)
        id: rust-cache-save
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Check the restored Rust 1.98.1 toolchain
        id: rust-cache-verify
        env:
          CACHE_HIT: ${{ steps.rust-cache-restore.outputs.cache-hit == 'true' || steps.rust-cache-save.outputs.cache-hit == 'true' }}
          TOOLCHAIN_DIR: ${{ steps.rust-cache-key.outputs.path }}
          RUST_TARGET: ${{ steps.rust-cache-key.outputs.rust-target }}
        run: |
          set -euo pipefail
          verify_toolchain() {
            if [ -z "${RUST_TARGET}" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/rustc" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/cargo" ]; then
              return 1
            fi
            local probe_dir rc=0
            probe_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rust-probe.XXXXXX")" || return 1
            if [ -z "${probe_dir}" ] || [ ! -d "${probe_dir}" ]; then
              return 1
            fi
            if ! printf 'fn main(){}\n' > "${probe_dir}/probe.rs"; then
              rm -rf "${probe_dir}" || true
              return 1
            fi
            if ! "${TOOLCHAIN_DIR}/bin/rustc" --edition 2021 --target "${RUST_TARGET}" "${probe_dir}/probe.rs" -o "${probe_dir}/probe" >/dev/null 2>&1; then
              rc=1
            elif ! "${TOOLCHAIN_DIR}/bin/cargo" --version >/dev/null 2>&1; then
              rc=1
            fi
            rm -rf "${probe_dir}" || return 1
            return "${rc}"
          }

          usable=false
          if [ "${CACHE_HIT}" = "true" ]; then
            if verify_toolchain; then
              usable=true
            else
              echo "::warning::Cached Rust toolchain at ${TOOLCHAIN_DIR} failed its check; deleting it so the workflow installs"
              rm -rf "${TOOLCHAIN_DIR}"
            fi
          fi
          echo "usable=${usable}" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.98.1 toolchain
        env:
          CACHED_TOOLCHAIN_USABLE: ${{ steps.rust-cache-verify.outputs.usable }}
          RUST_TARGET: ${{ steps.rust-cache-key.outputs.rust-target }}
        run: |
          set -euo pipefail
          if [ "${CACHED_TOOLCHAIN_USABLE}" != "true" ]; then
            rustup toolchain install 1.98.1 --profile minimal --target "${RUST_TARGET}"
          fi
          rustup default 1.98.1
          rustc --version

      - name: Build for ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ steps.rust-cache-key.outputs.rust-target }}
        run: |
          set -euo pipefail
          cd apps/desktop/vitruvian-code/macos
          swift build -c release --arch "$ARCH"
          rustc --edition 2021 -O --target "$RUST_TARGET" --crate-type lib --crate-name vitruvian_code_src_lib ../src/rs/lib.rs -o "$RUNNER_TEMP/libvitruvian_code_src_lib.rlib"
          rustc --edition 2021 -O --target "$RUST_TARGET" ../src/rs/main.rs -L "$RUNNER_TEMP" --extern vitruvian_code_src_lib="$RUNNER_TEMP/libvitruvian_code_src_lib.rlib" -o .build/release/bot-engine

      # The executable and, beside it, the folder SwiftPM writes the chat
      # view's resources to (the copy of Mermaid that draws diagrams).
      # macos/scripts/src/bundle.rs copies that folder into the app and stops
      # when it is missing. One day is enough: only the package job below
      # reads it.
      - name: Upload arch binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VitruvianCode-${{ matrix.arch }}
          path: |
            apps/desktop/vitruvian-code/macos/.build/release/VitruvianCode
            apps/desktop/vitruvian-code/macos/.build/release/VitruvianCode_VitruvianCodeUI.bundle
            apps/desktop/vitruvian-code/macos/.build/release/vitruvian-code-tool
            apps/desktop/vitruvian-code/macos/.build/release/bot-engine
          if-no-files-found: error
          retention-days: 1

      # The mirror's release does not run the tests, so this is the one place
      # they are compiled and run with its Swift. Once is enough: the runner
      # is arm64. The pipe keeps the full log and the check below fails a run
      # that found no tests, which `swift test` alone reports as a pass.
      - name: Run the tests
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          cd apps/desktop/vitruvian-code/macos
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          grep -E 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/swift-test.log"

  # release.yml: package, up to the ZIP. Then what the release never checks:
  # that each app it would publish can draw a diagram.
  package:
    name: package the apps
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SIGNING: adhoc
      VERSION: 0.0.0-rehearsal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VitruvianCode-arm64
          path: /tmp/arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VitruvianCode-x86_64
          path: /tmp/x86_64

      # What came through the artifacts, before anything reads it: when a
      # later step fails, this says whether a file was missing or misplaced.
      - name: Show what was downloaded
        run: |
          set -euo pipefail
          find /tmp/arm64 /tmp/x86_64 -maxdepth 4 -exec ls -ld {} +

      - name: Compute bundled Node cache key
        id: node-cache-key
        run: |
          set -euo pipefail
          lock_file="apps/desktop/vitruvian-code/macos/claude-helper/node.lock"
          NODE_VERSION="$(awk -F= '$1 == "version" { print $2; exit }' "$lock_file")"
          ARM64_SHA="$(awk -F= '$1 == "darwin-arm64" { print $2; exit }' "$lock_file")"
          X64_SHA="$(awk -F= '$1 == "darwin-x64" { print $2; exit }' "$lock_file")"
          test -n "$NODE_VERSION" && test -n "$ARM64_SHA" && test -n "$X64_SHA"
          {
            echo "path=${RUNNER_TEMP}/node-tarballs"
            # Bump the v1 segment to drop a bad cache entry.
            echo "key=vitruvian-code-node-v1-${NODE_VERSION}-${ARM64_SHA}-${X64_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore bundled Node cache (read-only)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.node-cache-key.outputs.path }}
          key: ${{ steps.node-cache-key.outputs.key }}

      - name: Restore and save bundled Node cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.node-cache-key.outputs.path }}
          key: ${{ steps.node-cache-key.outputs.key }}

      - name: Fetch and verify bundled Node
        env:
          NODE_CACHE_DIR: ${{ steps.node-cache-key.outputs.path }}
        run: |
          set -euo pipefail
          lock_file="apps/desktop/vitruvian-code/macos/claude-helper/node.lock"
          NODE_VERSION="$(awk -F= '$1 == "version" { print $2; exit }' "$lock_file")"
          ARM64_SHA="$(awk -F= '$1 == "darwin-arm64" { print $2; exit }' "$lock_file")"
          X64_SHA="$(awk -F= '$1 == "darwin-x64" { print $2; exit }' "$lock_file")"
          test -n "$NODE_VERSION" && test -n "$ARM64_SHA" && test -n "$X64_SHA"

          fetch_dir="$RUNNER_TEMP/node-fetch"
          rm -rf "$fetch_dir"
          mkdir -p "$NODE_CACHE_DIR" "$fetch_dir" /tmp/arm64/claude-helper /tmp/x86_64/claude-helper

          for spec in "darwin-arm64:${ARM64_SHA}:arm64" "darwin-x64:${X64_SHA}:x86_64"; do
            IFS=: read -r node_arch want_sha out_arch <<< "$spec"
            name="node-v${NODE_VERSION}-${node_arch}"
            tarball="${NODE_CACHE_DIR}/${name}.tar.gz"
            if [ -f "$tarball" ]; then
              if ! printf '%s  %s\n' "$want_sha" "$tarball" | shasum -a 256 -c -; then
                echo "::warning::Cached ${name}.tar.gz failed sha256 check; re-downloading"
                rm -f "$tarball"
              fi
            fi
            if [ ! -f "$tarball" ]; then
              tmp_tarball="${fetch_dir}/${name}.tar.gz"
              curl -fsSL --retry 3 --retry-all-errors \
                "https://nodejs.org/dist/v${NODE_VERSION}/${name}.tar.gz" \
                -o "$tmp_tarball"
              printf '%s  %s\n' "$want_sha" "$tmp_tarball" | shasum -a 256 -c -
              mv "$tmp_tarball" "$tarball"
            fi
            printf '%s  %s\n' "$want_sha" "$tarball" | shasum -a 256 -c -
            tar -xzf "$tarball" -C "$fetch_dir" "${name}/bin/node"
            cp "${fetch_dir}/${name}/bin/node" "/tmp/${out_arch}/node"
            chmod 755 "/tmp/${out_arch}/node"
            /usr/bin/strip -x "/tmp/${out_arch}/node"
            got_archs="$(lipo -archs "/tmp/${out_arch}/node")"
            test "$got_archs" = "$out_arch"
          done

          cp apps/desktop/vitruvian-code/macos/claude-helper/bundle/claude-helper.mjs /tmp/arm64/claude-helper/claude-helper.mjs
          cp apps/desktop/vitruvian-code/macos/claude-helper/bundle/claude-helper.mjs /tmp/x86_64/claude-helper/claude-helper.mjs
          rm -rf "$fetch_dir"

      - name: Create universal binary
        run: |
          mkdir -p /tmp/universal/claude-helper
          lipo -create \
            /tmp/arm64/VitruvianCode \
            /tmp/x86_64/VitruvianCode \
            -output /tmp/universal/VitruvianCode
          echo "==> Universal binary architectures:"
          lipo -info /tmp/universal/VitruvianCode
          # The resources are the same files for both architectures.
          cp -R /tmp/arm64/VitruvianCode_VitruvianCodeUI.bundle /tmp/universal/
          # The tool for the Vitruvian app, one binary for both as well.
          lipo -create \
            /tmp/arm64/vitruvian-code-tool \
            /tmp/x86_64/vitruvian-code-tool \
            -output /tmp/universal/vitruvian-code-tool
          lipo -info /tmp/universal/vitruvian-code-tool
          # The bundled Rust bot helper and Node runtime. XProtect refuses a
          # universal app that holds a fat helper ("Internal Xprotect Error" from
          # syspolicy_check), so the universal app holds one thin copy of each
          # per architecture, side by side, and the program picks the one for
          # the architecture it runs as. The bundler takes both when they sit
          # beside the executable.
          cp /tmp/arm64/bot-engine /tmp/universal/bot-engine-arm64
          cp /tmp/x86_64/bot-engine /tmp/universal/bot-engine-x86_64
          cp /tmp/arm64/node /tmp/universal/node-arm64
          cp /tmp/x86_64/node /tmp/universal/node-x86_64
          chmod 755 /tmp/universal/bot-engine-arm64 /tmp/universal/bot-engine-x86_64 /tmp/universal/node-arm64 /tmp/universal/node-x86_64
          lipo -info /tmp/universal/bot-engine-arm64 /tmp/universal/bot-engine-x86_64 /tmp/universal/node-arm64 /tmp/universal/node-x86_64
          # The tool's folder is not assessed as an app and holds one Node for
          # both architectures: a fat copy, under a name the bundler does not
          # pick up, for that folder only.
          lipo -create \
            /tmp/arm64/node \
            /tmp/x86_64/node \
            -output /tmp/universal/tool-node
          chmod 755 /tmp/universal/tool-node
          lipo -info /tmp/universal/tool-node
          # The Claude helper is one JS file for both.
          cp /tmp/arm64/claude-helper/claude-helper.mjs /tmp/universal/claude-helper/claude-helper.mjs

      - name: Compute Rust 1.98.1 cache key and path
        id: rust-cache-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          host_triple="$({ rustc -vV 2>/dev/null || true; } | awk '/^host:/ { print $2 }')"
          if [ -z "$host_triple" ]; then
            case "${RUNNER_OS}:${RUNNER_ARCH}" in
              macOS:ARM64) host_triple="aarch64-apple-darwin" ;;
              macOS:X64) host_triple="x86_64-apple-darwin" ;;
              *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
            esac
          fi
          {
            echo "rust-target=${host_triple}"
            echo "path=${rustup_home}/toolchains/1.98.1-${host_triple}"
            # Bump the v1 segment to drop a bad cache entry.
            echo "key=rustup-toolchain-v1-${RUNNER_OS}-${RUNNER_ARCH}-1.98.1-minimal"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Rust 1.98.1 toolchain cache (read-only)
        id: rust-cache-restore
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Restore and save Rust 1.98.1 toolchain cache (main only)
        id: rust-cache-save
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Check the restored Rust 1.98.1 toolchain
        id: rust-cache-verify
        env:
          CACHE_HIT: ${{ steps.rust-cache-restore.outputs.cache-hit == 'true' || steps.rust-cache-save.outputs.cache-hit == 'true' }}
          TOOLCHAIN_DIR: ${{ steps.rust-cache-key.outputs.path }}
          RUST_TARGET: ${{ steps.rust-cache-key.outputs.rust-target }}
        run: |
          set -euo pipefail
          verify_toolchain() {
            if [ -z "${RUST_TARGET}" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/rustc" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/cargo" ]; then
              return 1
            fi
            local probe_dir rc=0
            probe_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rust-probe.XXXXXX")" || return 1
            if [ -z "${probe_dir}" ] || [ ! -d "${probe_dir}" ]; then
              return 1
            fi
            if ! printf 'fn main(){}\n' > "${probe_dir}/probe.rs"; then
              rm -rf "${probe_dir}" || true
              return 1
            fi
            if ! "${TOOLCHAIN_DIR}/bin/rustc" --edition 2021 --target "${RUST_TARGET}" "${probe_dir}/probe.rs" -o "${probe_dir}/probe" >/dev/null 2>&1; then
              rc=1
            elif ! "${TOOLCHAIN_DIR}/bin/cargo" --version >/dev/null 2>&1; then
              rc=1
            fi
            rm -rf "${probe_dir}" || return 1
            return "${rc}"
          }

          usable=false
          if [ "${CACHE_HIT}" = "true" ]; then
            if verify_toolchain; then
              usable=true
            else
              echo "::warning::Cached Rust toolchain at ${TOOLCHAIN_DIR} failed its check; deleting it so the workflow installs"
              rm -rf "${TOOLCHAIN_DIR}"
            fi
          fi
          echo "usable=${usable}" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.98.1 toolchain
        env:
          CACHED_TOOLCHAIN_USABLE: ${{ steps.rust-cache-verify.outputs.usable }}
        run: |
          set -euo pipefail
          if [ "${CACHED_TOOLCHAIN_USABLE}" != "true" ]; then
            rustup toolchain install 1.98.1 --profile minimal
          fi
          rustc +1.98.1 --version

      - name: Assemble .app bundles
        run: |
          rustc +1.98.1 --edition 2021 --crate-type lib --crate-name vitruvian_code_scripts_lib apps/desktop/vitruvian-code/macos/scripts/src/lib.rs -o "$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib"
          rustc +1.98.1 --edition 2021 apps/desktop/vitruvian-code/macos/scripts/src/bin/bundle.rs -L "$RUNNER_TEMP" --extern vitruvian_code_scripts_lib="$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib" -o "$RUNNER_TEMP/bundle-app"

          # Universal
          mkdir -p /tmp/dist-universal
          "$RUNNER_TEMP/bundle-app" /tmp/universal/VitruvianCode "$VERSION" /tmp/dist-universal

          # arm64
          mkdir -p /tmp/dist-arm64
          "$RUNNER_TEMP/bundle-app" /tmp/arm64/VitruvianCode "$VERSION" /tmp/dist-arm64

          # x86_64
          mkdir -p /tmp/dist-x86_64
          "$RUNNER_TEMP/bundle-app" /tmp/x86_64/VitruvianCode "$VERSION" /tmp/dist-x86_64

      - name: Sign and notarize apps and tool
        run: |
          apps/desktop/vitruvian-code/scripts/sign-and-notarize.sh apps \
            --entitlements-app "/tmp/dist-universal/Vitruvian Code.app" \
            --entitlements-app "/tmp/dist-arm64/Vitruvian Code.app" \
            --entitlements-app "/tmp/dist-x86_64/Vitruvian Code.app" \
            --macho /tmp/universal/vitruvian-code-tool \
            --node-macho /tmp/universal/tool-node

      # Each app holds the copy of Mermaid where the chat view looks for it,
      # unchanged, with its licence, and is the signed executable for the
      # processors its name says.
      - name: Check the apps
        run: |
          set -euo pipefail
          export CHECK_NOTARIZED=0
          if [ "${SIGNING:-developer-id}" != "adhoc" ]; then
            export CHECK_NOTARIZED=1
          fi
          rustc +1.98.1 --edition 2021 --crate-type lib --crate-name vitruvian_code_scripts_lib apps/desktop/vitruvian-code/macos/scripts/src/lib.rs -o "$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib"
          rustc +1.98.1 --edition 2021 apps/desktop/vitruvian-code/macos/scripts/src/bin/check_packaged_app.rs -L "$RUNNER_TEMP" --extern vitruvian_code_scripts_lib="$RUNNER_TEMP/libvitruvian_code_scripts_lib.rlib" -o "$RUNNER_TEMP/check-packaged-app"
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-universal/Vitruvian Code.app" arm64 x86_64
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-arm64/Vitruvian Code.app" arm64
          "$RUNNER_TEMP/check-packaged-app" "/tmp/dist-x86_64/Vitruvian Code.app" x86_64

      # The checks above read the app; this starts it, which nothing else
      # does between a change and a release. A runner has no settings and no
      # bot of anyone's, and a logged-in desktop session, so a menu-bar app
      # can start here. Rehearsal only: the release itself starts nothing.
      #
      # The home folder is a throwaway one whose bot folder is empty: with no
      # bot token the bot is never started (auto-start is off by default as
      # well). What a first launch does do: put its icon in the menu bar,
      # register the global hotkey, ask the system for notification and
      # accessibility permission (the system's own prompts, which the app
      # does not wait for), and after three seconds ask GitHub whether a
      # newer release exists. None of that ends the app, so it must still be
      # running fifteen seconds in, must stop when told to, and must leave
      # no crash report. The reports are looked for in the runner's real
      # Library, where the system writes them whatever home the app is given.
      - name: Start the packaged app
        run: |
          set -euo pipefail
          app="/tmp/dist-universal/Vitruvian Code.app"
          reports="$HOME/Library/Logs/DiagnosticReports"
          scratch="$RUNNER_TEMP/first-launch"
          mkdir -p "$scratch/home/.config/vitruvian-code"
          touch "$scratch/launched"

          HOME="$scratch/home" CFFIXED_USER_HOME="$scratch/home" \
            "$app/Contents/MacOS/VitruvianCode" >"$scratch/output.log" 2>&1 &
          pid=$!

          # A process that has ended stays listed, as a zombie, until it is
          # waited for, and `kill -0` still finds it: so the state is read.
          running() {
            state="$(ps -o state= -p "$pid" 2>/dev/null || true)"
            [ -n "$state" ] && [ "${state#Z}" = "$state" ]
          }

          survived=yes
          for _ in $(seq 15); do
            sleep 1
            running || { survived=no; break; }
          done

          stopped=yes
          if [ "$survived" = yes ]; then
            kill -TERM "$pid"
            stopped=no
            for _ in $(seq 10); do
              running || { stopped=yes; break; }
              sleep 1
            done
            [ "$stopped" = yes ] || kill -KILL "$pid"
          fi
          status=0
          wait "$pid" || status=$?

          echo "==> What the app printed (exit status $status; 143 is the stop it was sent):"
          cat "$scratch/output.log"

          # A crash report is written a moment after the process is gone.
          sleep 5
          crash=""
          if [ -d "$reports" ]; then
            crash="$(find "$reports" -name 'VitruvianCode*' -newer "$scratch/launched" -print)"
          fi
          failed=no
          if [ -n "$crash" ]; then
            echo "error: the app left a crash report:" >&2
            echo "$crash" | while IFS= read -r report; do
              echo "--- $report" >&2
              head -n 60 "$report" >&2
            done
            failed=yes
          fi
          if [ "$survived" != yes ]; then
            echo "error: the app ended by itself within fifteen seconds, with status $status" >&2
            failed=yes
          fi
          if [ "$stopped" != yes ]; then
            echo "error: the app was still running ten seconds after it was told to stop" >&2
            failed=yes
          fi
          [ "$failed" = no ]
          echo "==> The app started, stayed up for fifteen seconds, stopped when told to, and left no crash report"

      # Each app now holds about 227 MB of Node, and a runner's disk no longer
      # fits the three apps, the per-architecture inputs they were made from and
      # the disk images (`hdiutil create` stopped with "No space left on
      # device"). Nothing after this step reads the per-architecture folders,
      # the thin helper copies in /tmp/universal (the universal app holds them
      # already; the ZIP reads that app and the tool's folder reads tool-node)
      # or the Node download. There is no SwiftPM `.build` folder to remove in this
      # job before this step; the rehearsal's later check fetches one.
      - name: Free disk space before the DMGs
        run: |
          set -euo pipefail
          echo "==> Disk before:"
          df -h /
          rm -rf /tmp/arm64 /tmp/x86_64 "$RUNNER_TEMP/node-fetch"
          # The thin helper copies are inside the universal app already.
          rm -f /tmp/universal/bot-engine-arm64 /tmp/universal/bot-engine-x86_64 /tmp/universal/node-arm64 /tmp/universal/node-x86_64
          echo "==> Disk after:"
          df -h /

      - name: Create DMGs
        run: |
          set -euo pipefail

          for arch in universal arm64 x86_64; do
            # The build for every Mac is the "macos" one.
            name="$arch"
            if [ "$arch" = universal ]; then name="macos"; fi
            stage="$RUNNER_TEMP/dmg-stage-${arch}"
            /bin/rm -rf "$stage"
            /bin/mkdir -p "$stage"
            /usr/bin/ditto "/tmp/dist-${arch}/Vitruvian Code.app" "$stage/Vitruvian Code.app"
            /bin/ln -s /Applications "$stage/Applications"
            # Size the volume explicitly (+25% + 32 MiB) so hdiutil's automatic
            # -srcfolder estimate cannot undersize it on macos-15; UDZO compresses
            # unused space away.
            stage_kb="$(/usr/bin/du -sk "$stage" | /usr/bin/awk '{print $1}')"
            dmg_mb=$(( (stage_kb * 125 / 100 + 1023) / 1024 + 32 ))
            # hdiutil sometimes stops with "Resource busy" when macOS still
            # holds the scratch volume it just used (seen on main after #5569,
            # the second of three images). Detach any leftover volume and try
            # again, up to five times; a real error fails all five.
            dmg="VitruvianCode-${VERSION}-${name}.dmg"
            attempt=1
            until /usr/bin/hdiutil create \
              -volname "Vitruvian Code" \
              -srcfolder "$stage" \
              -size "${dmg_mb}m" \
              -ov \
              -format UDZO \
              "$dmg"; do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::hdiutil create failed ${attempt} times for ${dmg}" >&2
                exit 1
              fi
              echo "::warning::hdiutil create failed for ${dmg} (attempt ${attempt}); retrying"
              /bin/rm -f "$dmg"
              for vol in "/Volumes/Vitruvian Code"*; do
                if [ -d "$vol" ]; then /usr/bin/hdiutil detach -force "$vol" || true; fi
              done
              /bin/sleep $(( attempt * 10 ))
              attempt=$(( attempt + 1 ))
            done
            /bin/rm -rf "$stage"
            # The ZIP reads the universal app; nothing reads these two again.
            if [ "$arch" != universal ]; then /bin/rm -rf "/tmp/dist-${arch}"; fi
          done

          ls -lh *.dmg

      - name: Sign and notarize DMGs
        run: |
          apps/desktop/vitruvian-code/scripts/sign-and-notarize.sh dmgs \
            "VitruvianCode-${VERSION}-macos.dmg" \
            "VitruvianCode-${VERSION}-arm64.dmg" \
            "VitruvianCode-${VERSION}-x86_64.dmg"

      - name: Create ZIP for auto-updater
        run: |
          ditto -c -k --keepParent "/tmp/dist-universal/Vitruvian Code.app" "${GITHUB_WORKSPACE}/VitruvianCode-${VERSION}-macos.zip"
          cd "${GITHUB_WORKSPACE}"
          shasum -a 256 "VitruvianCode-${VERSION}-macos.zip" > "VitruvianCode-${VERSION}-macos.zip.sha256"
          cat "VitruvianCode-${VERSION}-macos.zip.sha256"
          ls -lh *.zip

      # The tool as the Vitruvian app installs it: a zip of its folder with
      # vitruvian-tool.json at the top, bin/tool, bundled Node + Claude helper,
      # and the copy of Mermaid the chat's diagram cards draw with beside the
      # program, where it looks for an executable that is no bundle. The zip is
      # what the app's catalog (catalog/tools.json in vitruvian-core) pins by
      # its size and checksum, which the sidecar and the release notes carry.
      - name: Zip the tool's folder
        run: |
          folder="/tmp/tool/vitruvian-code"
          mkdir -p "$folder/bin/claude-helper"
          cp apps/desktop/vitruvian-code/macos/atrium-extension/vitruvian-tool.json "$folder/"
          cp /tmp/universal/vitruvian-code-tool "$folder/bin/tool"
          chmod 755 "$folder/bin/tool"
          cp apps/desktop/vitruvian-code/macos/Sources/VitruvianCodeUI/Resources/mermaid.min.js "$folder/bin/"
          cp /tmp/universal/tool-node "$folder/bin/node"
          chmod 755 "$folder/bin/node"
          cp apps/desktop/vitruvian-code/macos/claude-helper/bundle/claude-helper.mjs "$folder/bin/claude-helper/claude-helper.mjs"
          # Node and the helper are in the folder, Node holds both architectures
          # and is signed with the JIT entitlements, before any of it is zipped.
          "$RUNNER_TEMP/check-packaged-app" --tool-folder "$folder" arm64 x86_64
          asset="vitruvian-code-tool-${VERSION}.zip"
          (cd "$folder" && zip -r -X "${GITHUB_WORKSPACE}/${asset}" .)
          cd "${GITHUB_WORKSPACE}"
          shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"
          ls -l "$asset"

      - name: Zip the per-Mac tool folders
        run: |
          set -euo pipefail
          max_bytes=268435456
          for arch in arm64 x86_64; do
            folder="/tmp/tool-${arch}/vitruvian-code"
            rm -rf "$folder"
            mkdir -p "$folder/bin/claude-helper"
            cp apps/desktop/vitruvian-code/macos/atrium-extension/vitruvian-tool.json "$folder/"
            lipo /tmp/universal/vitruvian-code-tool -thin "$arch" -output "$folder/bin/tool"
            chmod 755 "$folder/bin/tool"
            codesign --verify --strict "$folder/bin/tool"
            cp apps/desktop/vitruvian-code/macos/Sources/VitruvianCodeUI/Resources/mermaid.min.js "$folder/bin/"
            lipo /tmp/universal/tool-node -thin "$arch" -output "$folder/bin/node"
            chmod 755 "$folder/bin/node"
            cp apps/desktop/vitruvian-code/macos/claude-helper/bundle/claude-helper.mjs "$folder/bin/claude-helper/claude-helper.mjs"
            "$RUNNER_TEMP/check-packaged-app" --tool-folder "$folder" "$arch"
            asset="vitruvian-code-tool-${VERSION}-${arch}.zip"
            (cd "$folder" && zip -r -X "${GITHUB_WORKSPACE}/${asset}" .)
            cd "${GITHUB_WORKSPACE}"
            shasum -a 256 "$asset" > "$asset.sha256"
            cat "$asset.sha256"
            ls -l "$asset"
            size="$(stat -f %z "$asset")"
            echo "${asset}: ${size} bytes"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::${asset} is ${size} bytes, exceeding the ${max_bytes}-byte cap" >&2
              exit 1
            fi
            rm -rf "/tmp/tool-${arch}"
          done

      # What the Vitruvian app does with the zip, on a Mac with nothing of
      # ours on it: unpack it, judge the folder with `vitruvian-tool
      # validate`, built from the kit SwiftPM resolved, and play the app to
      # the program with the SDK's conformance validator, under a home of its
      # own. A release attaches the zip and judges nothing.
      #
      # This job builds nothing, so it has no checkout of the kit: the
      # artifacts carry what the build job built, not what SwiftPM fetched
      # to build it. `swift package resolve` fetches the kit here, by the
      # same rule in Package.swift the build job's `swift build` followed.
      - name: Check the tool's folder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tool"
          ditto -x -k "vitruvian-code-tool-${VERSION}.zip" "$RUNNER_TEMP/tool"
          test -f "$RUNNER_TEMP/tool/vitruvian-tool.json"
          test -x "$RUNNER_TEMP/tool/bin/tool"
          test -f "$RUNNER_TEMP/tool/bin/mermaid.min.js"
          test -x "$RUNNER_TEMP/tool/bin/node"
          test -s "$RUNNER_TEMP/tool/bin/claude-helper/claude-helper.mjs"
          lipo -archs "$RUNNER_TEMP/tool/bin/tool"
          node_archs="$(lipo -archs "$RUNNER_TEMP/tool/bin/node")"
          test "$node_archs" = "x86_64 arm64" -o "$node_archs" = "arm64 x86_64"
          codesign --verify --strict "$RUNNER_TEMP/tool/bin/node"
          node_ent="$(codesign -d --entitlements - --xml "$RUNNER_TEMP/tool/bin/node" 2>&1)"
          grep -q "com.apple.security.cs.allow-jit" <<<"$node_ent"
          grep -q "com.apple.security.cs.allow-unsigned-executable-memory" <<<"$node_ent"
          swift package resolve --package-path apps/desktop/vitruvian-code/macos
          sdk="$(find apps/desktop/vitruvian-code/macos/.build/checkouts -maxdepth 1 -name 'vitruvian-sdk*' -type d | head -1)"
          test -n "$sdk"
          swift build --package-path "$sdk" --product vitruvian-tool
          "$(swift build --package-path "$sdk" --show-bin-path)/vitruvian-tool" validate "$RUNNER_TEMP/tool"
          # The conformance validator is this checkout's, built with Cargo
          # (packages/vitruvian-sdk/verification/Cargo.toml) as the SDK
          # mirror builds it, with the Rust Bazel uses here (MODULE.bazel,
          # rust.toolchain). Released kits up to 1.9.0 carry it only as a
          # Python script, which this repository no longer has. Built
          # before HOME is changed: Cargo and rustup keep their files there.
          cargo +1.98.1 build --locked --release \
            --manifest-path packages/vitruvian-sdk/verification/Cargo.toml --bin conformance
          mkdir -p "$RUNNER_TEMP/tool-home"
          HOME="$RUNNER_TEMP/tool-home" CFFIXED_USER_HOME="$RUNNER_TEMP/tool-home" \
            packages/vitruvian-sdk/verification/target/release/conformance "$RUNNER_TEMP/tool"

      # The ZIP is what an installed app updates itself from, so the app that
      # comes back out of it is checked as well: `zip` must have kept the
      # resource folder and the signature.
      - name: Check the app inside the ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k "VitruvianCode-${VERSION}-macos.zip" "$RUNNER_TEMP/unzipped"
          "$RUNNER_TEMP/check-packaged-app" \
            "$RUNNER_TEMP/unzipped/Vitruvian Code.app" arm64 x86_64
          shasum -a 256 -c "VitruvianCode-${VERSION}-macos.zip.sha256"
