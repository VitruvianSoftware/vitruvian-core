# Builds and publishes the Vitruvian Backstage container image to GHCR,
# which is deployed to the homelab k3s cluster via GitOps (ArgoCD).

name: backstage-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'backstage/**'
      - '.github/workflows/backstage-image.yaml'
      - 'tools/ci/backstage-boot-smoke.sh'
  pull_request:
    paths:
      - 'backstage/**'
      - '.github/workflows/backstage-image.yaml'
      - 'tools/ci/backstage-boot-smoke.sh'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/backstage
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Unit tests for the backstage packages. Backstage is gazelle-excluded, so it
  # gets no Bazel test lane — without this job the permission policy that
  # decides who can administer the portal would ship untested.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backstage backend
        run: pnpm --filter @vitruviansoftware/backstage-backend test

  image:
    runs-on: ubuntu-latest
    # 30 was already marginal, and #1738 proved it: the multi-arch build hit
    # the ceiling and was CANCELLED mid-build, so no image was published. A
    # lockfile change evicts the cached dependency layer for both arches, and
    # linux/arm64 is QEMU-emulated on an amd64 runner. The smoke step adds ~3m.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backstage/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Without a layer cache every run reinstalls the whole dependency tree
          # from scratch -- and does it twice, because linux/arm64 is emulated
          # under QEMU on an amd64 runner. The pnpm install layer is keyed on the
          # lockfile + package.json, so a source-only change now reuses it.
          # Scoped per image so the two builds cannot evict each other from the
          # shared 10GB GitHub Actions cache.
          cache-from: type=gha,scope=backstage-image
          cache-to: type=gha,mode=max,scope=backstage-image

      # buildx cannot --load a multi-arch manifest, so export an amd64-only copy
      # the runner can actually execute. Every layer was just built by the step
      # above and is in the shared cache, so this is an export, not a rebuild.
      - name: Load image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backstage/Dockerfile
          platforms: linux/amd64
          load: true
          tags: backstage:smoke
          cache-from: type=gha,scope=backstage-image

      # Boots the image and asserts every plugin initializes and readiness
      # serves 200. Unit tests cannot catch a plugin that fails to REGISTER --
      # #1709 shipped with a green suite and wedged production for hours.
      - name: Boot smoke test
        run: tools/ci/backstage-boot-smoke.sh backstage:smoke
