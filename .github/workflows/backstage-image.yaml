# Builds and publishes the Vitruvian Backstage container image to GHCR,
# which is deployed to the homelab k3s cluster via GitOps (ArgoCD).

name: backstage-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'backstage/**'
      - '.github/workflows/backstage-image.yaml'
  pull_request:
    paths:
      - 'backstage/**'
      - '.github/workflows/backstage-image.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/backstage
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Unit tests for the backstage packages. Backstage is gazelle-excluded, so it
  # gets no Bazel test lane — without this job the permission policy that
  # decides who can administer the portal would ship untested.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backstage backend
        run: pnpm --filter @vitruviansoftware/backstage-backend test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backstage/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
