name: Buzz image update PR

# argocd-image-updater's git write-back (gitops/argocd/platform/argocd-image-updater/
# resources/imageupdater-buzz.yaml) pushes a resolved `main@sha256:...` digest
# straight onto `image-updates/buzz` using its own sealed SSH deploy key -- it
# never touches `main`. This workflow is the other half: it turns that branch
# into a normal, mergeable PR so the digest bump goes through the merge queue
# like every other change, instead of sitting on a branch nobody looks at.
#
# Trigger is `push` on the write-back branch itself, not pull_request_target and
# not repository_dispatch -- the only external input is the digest the
# controller already resolved from the public ghcr.io/block/buzz registry, and
# this job never checks out or executes anything from a fork/PR head.
#
# Idempotent by design: GitHub auto-updates an existing open PR when its head
# branch gets new commits, so this only needs to open one the first time the
# branch appears (or after the previous bump's PR merged and closed it).
on:
  push:
    branches:
      - image-updates/buzz

# The branch is already pushed by the controller's own deploy key; the ambient
# GITHUB_TOKEN here only needs to read this repo and the PUBLIC block/buzz
# compare API for the changelog. Opening/editing the PR runs on the
# vitruvian-copybara-sync App token instead (see the job) -- hence no
# `pull-requests: write` on the ambient token.
permissions:
  contents: read

concurrency:
  group: image-updates-buzz-pr
  cancel-in-progress: false

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolves the upstream commit range behind this digest bump so the PR
      # description shows what actually changed, not just a digest string.
      #
      # ghcr.io/block/buzz images carry OCI labels (confirmed live via
      # `docker buildx imagetools inspect` -- org.opencontainers.image.revision
      # is the exact source commit, org.opencontainers.image.source is the
      # public github.com/block/buzz repo). The image is a multi-platform
      # index, so labels live on a platform-specific manifest, not the index
      # itself -- hence the two-step inspect (index -> amd64 manifest digest
      # -> that manifest's config.Labels).
      #
      # Best-effort: if a label is missing, the compare API 404s, or the two
      # commits aren't actually related (e.g. upstream force-pushed/rebased
      # main), this step still succeeds with an empty changelog rather than
      # failing the whole PR-open job over a changelog nicety.
      - name: Resolve upstream commit range for the digest bump
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_revision() {
            local digest="$1"
            local platform_digest
            platform_digest="$(docker buildx imagetools inspect "ghcr.io/block/buzz@${digest}" --raw 2>/dev/null \
              | jq -r '.manifests[]? | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' \
              | head -1)"
            [ -z "$platform_digest" ] && return 0
            docker buildx imagetools inspect "ghcr.io/block/buzz@${platform_digest}" --format '{{json .}}' 2>/dev/null \
              | jq -r '.image.config.Labels["org.opencontainers.image.revision"] // empty'
          }

          extract_tag() {
            grep -oP '(?<=tag: "main@sha256:)[a-f0-9]+' "$1" | head -1
          }

          old_tag="$(git show origin/main:gitops/argocd/platform/buzz/values.yaml 2>/dev/null | extract_tag /dev/stdin || true)"
          new_tag="$(extract_tag gitops/argocd/platform/buzz/values.yaml || true)"

          changelog=""
          if [ -n "$old_tag" ] && [ -n "$new_tag" ] && [ "$old_tag" != "$new_tag" ]; then
            old_rev="$(resolve_revision "sha256:${old_tag}" || true)"
            new_rev="$(resolve_revision "sha256:${new_tag}" || true)"

            if [ -n "$old_rev" ] && [ -n "$new_rev" ] && [ "$old_rev" != "$new_rev" ]; then
              compare_json="$(gh api "repos/block/buzz/compare/${old_rev}...${new_rev}" 2>/dev/null || true)"
              if [ -n "$compare_json" ]; then
                changelog="$(echo "$compare_json" | jq -r '
                  .commits[]? |
                  "- [`\(.sha[0:7])`](https://github.com/block/buzz/commit/\(.sha)) \(.commit.message | split("\n")[0])"
                ')"
              fi
            fi
          fi

          {
            echo "changelog<<BUZZ_CHANGELOG_EOF"
            echo "$changelog"
            echo "BUZZ_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # A PR opened with the ambient GITHUB_TOKEN is authored by
      # github-actions[bot], and GitHub deliberately does not let that PR's
      # `pull_request` event start normal workflow runs -- so the digest bump
      # arrives with none of its 15 required status checks. Observed both ways:
      # #1395 and #1407 got ZERO check runs when they were opened (they only
      # went green later, by luck, when the next digest push fired a
      # `synchronize`), and #1409 got 8 runs parked in `action_required`
      # awaiting a manual "Approve and run" click, leaving the PR BLOCKED.
      # Either way the bump can sit unmergeable indefinitely if upstream
      # block/buzz goes quiet.
      #
      # The App token is the repo's established fix for exactly this: every
      # other automation PR here (release-please #1397-#1405, copybara import,
      # dependabot reconcile) is authored by vitruvian-copybara-sync, and those
      # PRs' required checks run and merge through the queue normally.
      - name: Mint a short-lived App token so the PR's checks actually run
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Open or update the PR into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -euo pipefail

          body="Opened automatically by argocd-image-updater's git write-back after a new digest landed behind ghcr.io/block/buzz:main. Review the resolved digest in gitops/argocd/platform/buzz/values.yaml, then merge through the normal queue."

          if [ -n "$CHANGELOG" ]; then
            body="$(printf '%s\n\n### Upstream changes\n\n%s\n' "$body" "$CHANGELOG")"
          else
            body="$(printf '%s\n\n### Upstream changes\n\nCould not resolve the upstream commit range for this bump (missing OCI revision label, or the compare API had nothing to report) -- check gitops/argocd/platform/buzz/values.yaml for the raw digest.\n' "$body")"
          fi

          existing="$(gh pr list \
            --head image-updates/buzz \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for image-updates/buzz -- updating its description with the new commit range."
            gh pr edit "$existing" --body "$body"
            exit 0
          fi

          gh pr create \
            --head image-updates/buzz \
            --base main \
            --title "chore(buzz): bump image digest (automated)" \
            --body "$body"
