# release-please and asset publisher for the Vitruvian Wear OS Apps Suite:
# 1. Authors release PRs from conventional commits under apps/mobile/wearos/apps/.
# 2. When the release PR merges, cuts the GitHub Release (tag: wearos-apps-vX.Y.Z).
# 3. Compiles all 4 multi-ABI Wear OS release APKs (VitruvianPulse, VitruvianWearRemote,
#    VitruvianHomeControl, VitruvianNexusWrist) on Linux, computes SHA-256 sidecars,
#    and attaches all 8 files to the GitHub Release.
# 4. Verifies the GitHub Release holds every APK and matching SHA-256 checksum.
name: wearos-apps-release

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/wearos/apps/**"
      - ".github/workflows/wearos-apps-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. wearos-apps-v0.1.0). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: wearos-apps-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/mobile/wearos/apps--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/mobile/wearos/apps--tag_name'] }}
      version: ${{ steps.release.outputs['apps/mobile/wearos/apps--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/mobile/wearos/apps/release-please-config.json
          manifest-file: apps/mobile/wearos/apps/.release-please-manifest.json
          target-branch: main

  publish-package:
    needs: release-please
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: wearos-apps-publish-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Publish downloadable Wear OS release APKs
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustc --edition 2021 --crate-name wearos_apps_scripts_lib --crate-type lib apps/mobile/wearos/apps/scripts/src/lib.rs -o /tmp/libwearos_apps_scripts_lib.rlib
          rustc --edition 2021 apps/mobile/wearos/apps/scripts/src/publish_main.rs --extern wearos_apps_scripts_lib=/tmp/libwearos_apps_scripts_lib.rlib -o /tmp/wearos-publish
          BUILD_WORKSPACE_DIRECTORY="$GITHUB_WORKSPACE" /tmp/wearos-publish

  check-release:
    needs: [release-please, publish-package]
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check the release has every file
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#wearos-apps-v}"
          listing="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"')"
          printf '%s\n' "${listing}"
          missing=0
          for file in \
            "VitruvianPulse-${version}.apk" \
            "VitruvianPulse-${version}.apk.sha256" \
            "VitruvianWearRemote-${version}.apk" \
            "VitruvianWearRemote-${version}.apk.sha256" \
            "VitruvianHomeControl-${version}.apk" \
            "VitruvianHomeControl-${version}.apk.sha256" \
            "VitruvianNexusWrist-${version}.apk" \
            "VitruvianNexusWrist-${version}.apk.sha256"; do
            size="$(awk -F '\t' -v f="${file}" '$1 == f { print $2 }' <<<"${listing}")"
            if [[ -z "${size}" || "${size}" == "0" ]]; then
              echo "::error::${TAG} has no ${file}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          dir="$(mktemp -d)"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
            --pattern "*.apk" \
            --pattern "*.apk.sha256"
          (
            cd "${dir}"
            for sha in *.apk.sha256; do
              sha256sum -c "${sha}"
            done
          )
