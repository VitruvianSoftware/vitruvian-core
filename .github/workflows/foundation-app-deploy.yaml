# Reusable workflow for deploying a single foundation projects (stage-4) leaf.
#
# This workflow deploys one business-unit leaf (shared, development,
# nonproduction, or production) of the gcp-projects foundation stage. It is
# called by the main foundation-release.yaml workflow in a chained sequence:
#
#   development (auto) → nonproduction (manual approval)
#     → shared (manual approval; the BU infra-pipeline) → production (manual approval)
#
# Upstream-leaf layout: each leaf is its own thin Pulumi project at
# {business_unit}/{environment}/ (upstream 4-projects/business_unit_N/<leaf>),
# with a single `production` stack
# (ipv1337/foundation-app-infra-bu1-<leaf>/production) and the stage logic
# shared via ../../modules. The `shared` leaf holds the BU infra-pipeline
# (modules/infra_pipelines); the env leaves hold base_env. Each leaf maps to:
#   - A leaf Pulumi project dir: {working_directory}/{business_unit}/{environment}
#     (committed non-secret config in that leaf's Pulumi.production.yaml)
#   - A GitHub Environment with optional protection rules (foundation-proj-{environment})
#
# This pattern replaces the upstream Terraform foundation's branch promotion
# strategy (development → nonproduction → production branches, with
# monorepo promotion) with a
# monorepo-compatible approach using GitHub Environment gates.

name: Foundation App-Infra Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target leaf: development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-app-infra"
        description: "Stage root directory; pulumi runs in {working_directory}/{business_unit}/{environment}"
      app_image_digests:
        description: >-
          Per-invocation image digests for the apps hosted in this leaf, as
          "<app>=<digest-ref>" comma-separated. Exported to the Pulumi program as
          <APP>_IMAGE_DIGEST, which is how the leaf sources the image
          (build-once / promote-by-digest: the value changes every release, so it
          is NOT stack config). Leaving it empty renders a Service with an EMPTY
          image, which on an adopted service means the apply STRIPS the image —
          so the deploy step below refuses to run when a workload is enabled and
          no digest was supplied.
        required: false
        type: string
        default: ""
      business_unit:
        description: "Business-unit leaf directory under the stage root (business_unit_1, business_unit_2, ...)"
        required: false
        type: string
        default: business_unit_1
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - shared
          - development
          - nonproduction
          - production
        description: "Target leaf: development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-app-infra"
        description: "Stage root directory; pulumi runs in {working_directory}/{business_unit}/{environment}"
      app_image_digests:
        description: >-
          Per-invocation image digests as "<app>=<digest-ref>", comma-separated.
          Exported as <APP>_IMAGE_DIGEST for the Pulumi program. Required
          whenever a workload is enabled — see the guard in the deploy job.
        required: false
        type: string
        default: ""
      business_unit:
        description: "Business-unit leaf directory under the stage root (business_unit_1, business_unit_2, ...)"
        required: false
        type: string
        default: business_unit_1
permissions:
  contents: read
  id-token: write

jobs:
  # On a DIRECT manual dispatch (not when foundation-release calls this via
  # workflow_call -- that run shows the changelog from its own `changelog` job),
  # render this stage's latest changelog into the run page before the gated
  # deploy. Ungated + independent of `deploy`, so it never delays the rollout.
  changelog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Changelog → step summary
        env:
          WORKDIR: ${{ inputs.working_directory }}
        run: bash tools/ci/changelog-summary.sh "$WORKDIR/CHANGELOG.md" "" "$(basename "$WORKDIR")"

  deploy:
    # Serialize per (stack dir + environment): a newer promotion run waits for an
    # older in-flight one rather than racing/deploying out of order onto live org
    # infra. Never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-app-deploy-${{ inputs.working_directory }}-${{ inputs.business_unit }}-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # BU-aware identity selection: bu1 keeps the legacy unsuffixed environment
    # (foundation-app-<env>); other BUs are suffixed (foundation-app-bu2-<env>),
    # each carrying its own sa-app-infra-<bu> — see repo_config appPhaseEnvironments.
    environment: foundation-app-${{ inputs.business_unit == 'business_unit_2' && 'bu2-' || '' }}${{ inputs.environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit that CI runners
      # routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this to
      # 5000/hr. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # An enabled workload with no digest renders a Service with an EMPTY
      # image. On a leaf that has ADOPTED a live service that is not a no-op —
      # the apply STRIPS the image off something that is serving traffic. The
      # §7 step-2 preview caught exactly this before it reached an apply, so it
      # is enforced here rather than trusted to the caller.
      - name: Export image digests and refuse an enabled workload without one
        env:
          APP_IMAGE_DIGESTS: ${{ inputs.app_image_digests }}
        working-directory: ${{ inputs.working_directory }}/${{ inputs.business_unit }}/${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Export each "<app>=<digest>" as <APP>_IMAGE_DIGEST for the program.
          if [ -n "${APP_IMAGE_DIGESTS}" ]; then
            IFS=',' read -ra pairs <<< "${APP_IMAGE_DIGESTS}"
            for pair in "${pairs[@]}"; do
              app="${pair%%=*}"; digest="${pair#*=}"
              [ -n "${app}" ] && [ -n "${digest}" ] || continue
              var="$(printf '%s' "${app}" | tr '[:lower:]-' '[:upper:]_')_IMAGE_DIGEST"
              echo "${var}=${digest}" >> "${GITHUB_ENV}"
              echo "exporting ${var}"
            done
          fi
          # Fail closed: any app with the cutover switch ON must have a digest.
          missing=""
          while IFS= read -r line; do
            app="$(printf '%s' "${line}" | sed -E 's/.*:([a-z0-9-]+)_workload_enabled:.*/\1/')"
            [ -n "${app}" ] || continue
            case ",${APP_IMAGE_DIGESTS}," in
              *",${app}="*) ;;
              *) missing="${missing} ${app}" ;;
            esac
          done < <(grep -E '_workload_enabled: *"true"' Pulumi.production.yaml || true)
          if [ -n "${missing}" ]; then
            echo "::error::workload enabled but no image digest supplied for:${missing} — deploying would render an EMPTY image and strip it off the live service. Pass app_image_digests as '<app>=<ref>'."
            exit 1
          fi
          echo "digest guard: OK"

      - name: Pulumi up (${{ inputs.environment }})
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        # Upstream-leaf layout: the environment selects the business-unit leaf
        # Pulumi project dir; every leaf has exactly one stack, `production`.
        working-directory: ${{ inputs.working_directory }}/${{ inputs.business_unit }}/${{ inputs.environment }}
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (${ENVIRONMENT} leaf / production stack)"
          { pulumi stack select -c "production" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      # Render the pulumi output digest onto the run's step-summary page. Runs
      # even when the deploy fails so the failure — and what it touched — is
      # surfaced. tools/ci/pulumi-summary.sh parses the counts, flags any
      # destructive replace/delete, and tucks the raw log into a <details>.
      - name: Pulumi digest → step summary
        if: always()
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          ENVIRONMENT: ${{ inputs.environment }}
          BUSINESS_UNIT: ${{ inputs.business_unit }}
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "$(basename "${WORKING_DIRECTORY}")/${BUSINESS_UNIT#business_unit_}-${ENVIRONMENT}" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"
