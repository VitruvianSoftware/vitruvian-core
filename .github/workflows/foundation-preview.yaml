name: Foundation Preview

on:
  pull_request:
    paths:
      - "infrastructure/pulumi/foundation/**"
      - "infrastructure/pulumi/pkg/**"
      - ".github/workflows/foundation-preview.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: foundation-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Upstream-leaf layout: every multi-env stage is a set of thin per-leaf
      # Pulumi projects (envs/<env> or business_unit_1/<leaf>), each with a
      # single `production` stack, all calling the stage's shared modules/
      # package. `dir` is the leaf Pulumi project; `stage_dir` is the stage
      # root — the change filter watches stage_dir/** so a modules/-only change
      # still triggers every affected leaf's preview. `modules_dir` (set on ONE
      # representative leg per stage, to avoid duplicate runs) additionally
      # vets/tests the shared modules Go module, which the per-leaf `go vet
      # ./...` compiles but does not analyze.
      matrix:
        include:
          - app: gcp-bootstrap
            dir: infrastructure/pulumi/foundation/gcp-bootstrap
            stage_dir: infrastructure/pulumi/foundation/gcp-bootstrap
            stack: production
            environment: foundation-bootstrap-preview
          - app: org-folders
            dir: infrastructure/pulumi/foundation/org-folders
            stage_dir: infrastructure/pulumi/foundation/org-folders
            stack: production
            environment: foundation-org-folders-preview
          # 1-org lives at envs/shared (upstream 1-org/envs/shared), a single
          # leaf; stack ipv1337/foundation-org-shared/production.
          - app: gcp-org
            dir: infrastructure/pulumi/foundation/gcp-org/envs/shared
            stage_dir: infrastructure/pulumi/foundation/gcp-org
            modules_dir: infrastructure/pulumi/foundation/gcp-org/modules
            stack: production
            environment: foundation-org-preview
          # gcp-environments: preview the development leaf as the representative
          # leg per the old stack-based matrix — it runs first in the promotion
          # chain and reads the cross-stack StackReference to the applied
          # ipv1337/foundation-org-shared/production stack, so `pulumi preview`
          # runs the program end-to-end and catches program-crashing panics
          # (e.g. the pre-#772 subnets_secondary_ranges nil-pointer class).
          - app: gcp-environments
            dir: infrastructure/pulumi/foundation/gcp-environments/envs/development
            stage_dir: infrastructure/pulumi/foundation/gcp-environments
            modules_dir: infrastructure/pulumi/foundation/gcp-environments/modules
            stack: production
            environment: foundation-env-preview
          # gcp-networks: the old development STACK deployed the hub AND a spoke
          # with secondary ranges in one program; the leaf split moved the hub
          # into envs/shared and the spoke into envs/development. Preview BOTH
          # leaves to keep the same code coverage (hub + spoke + the
          # subnets_secondary_ranges export).
          - app: gcp-networks-shared
            dir: infrastructure/pulumi/foundation/gcp-networks/envs/shared
            stage_dir: infrastructure/pulumi/foundation/gcp-networks
            stack: production
            environment: foundation-net-preview
          - app: gcp-networks-development
            dir: infrastructure/pulumi/foundation/gcp-networks/envs/development
            stage_dir: infrastructure/pulumi/foundation/gcp-networks
            modules_dir: infrastructure/pulumi/foundation/gcp-networks/modules
            stack: production
            environment: foundation-net-preview
          # gcp-projects (stage 4): the business_unit_1/shared leaf (BU
          # infra-pipeline, extracted modules/infra_pipelines) plus the
          # development leaf (floating-only base_env; reads the 2-environments
          # StackReference) — together the same coverage the old development
          # stack + prod-only infra_pipeline_enabled gave.
          - app: gcp-projects-shared
            dir: infrastructure/pulumi/foundation/gcp-projects/business_unit_1/shared
            stage_dir: infrastructure/pulumi/foundation/gcp-projects
            stack: production
            environment: foundation-proj-preview
          - app: gcp-projects-development
            dir: infrastructure/pulumi/foundation/gcp-projects/business_unit_1/development
            stage_dir: infrastructure/pulumi/foundation/gcp-projects
            modules_dir: infrastructure/pulumi/foundation/gcp-projects/modules
            stack: production
            environment: foundation-proj-preview
    environment: ${{ matrix.environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads (e.g. pulumiverse
      # pulumi-resource-time, pulled by gcp-bootstrap/gcp-networks for time.Sleep
      # propagation gates) so the job does not hit the 60/hr/IP unauthenticated
      # GitHub API rate limit that CI runners routinely exhaust (intermittent
      # 403s); GITHUB_TOKEN raises this to 5000/hr. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect ${{ matrix.app }} stack changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.base_ref }}
          filters: |
            stack:
              - '${{ matrix.stage_dir }}/**'
              - 'infrastructure/pulumi/pkg/**'
              - '.github/workflows/foundation-preview.yaml'

      # Hermetic fast-fail before the heavier, cloud-dependent preview: `go vet`
      # builds every package (using the go.mod-declared toolchain via
      # GOTOOLCHAIN=auto, same as Pulumi's own build), so a program that fails to
      # compile or trips a vet check is caught here without any GCP/Pulumi
      # credentials — even if Pulumi Cloud or a referenced stack is unavailable.
      # The preview below then runs the program to catch runtime faults (e.g. the
      # subnets_secondary_ranges nil-pointer panic that reached deploy uncaught).
      - name: go vet (${{ matrix.app }})
        if: steps.changes.outputs.stack == 'true'
        working-directory: ${{ matrix.dir }}
        run: go vet ./...

      # Run the module's own unit tests (config validation, transforms) in the
      # same hermetic pre-preview slot -- 4 of the 5 stacks ship *_test.go that no
      # workflow was executing (#806). No-ops cleanly for a stack with no tests.
      - name: go test (${{ matrix.app }})
        if: steps.changes.outputs.stack == 'true'
        working-directory: ${{ matrix.dir }}
        run: go test ./...

      # The shared modules/ package is its own Go module: the per-leaf vet/test
      # above compiles it (via the go.mod replace) but does not analyze or test
      # it. Run vet+test there too, on the one representative leg per stage that
      # sets modules_dir.
      - name: go vet + test (${{ matrix.app }} shared modules)
        if: steps.changes.outputs.stack == 'true' && matrix.modules_dir
        working-directory: ${{ matrix.modules_dir }}
        run: |
          go vet ./...
          go test ./...

      - name: Authenticate to GCP (WIF, keyless)
        if: steps.changes.outputs.stack == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        if: steps.changes.outputs.stack == 'true'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi preview (${{ matrix.app }} / ${{ matrix.stack }})
        if: steps.changes.outputs.stack == 'true'
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          STACK: ${{ matrix.stack }}
        working-directory: ${{ matrix.dir }}
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi preview --diff (${STACK})"
          { pulumi stack select -c "${STACK}" \
              && pulumi preview --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      # One digest feeds BOTH the step-summary page and the sticky PR comment, so
      # the two can never drift. This replaces the previous plain advisory block;
      # the sticky-comment marker (header:) is preserved so the comment updates in
      # place on each push. tools/ci/pulumi-summary.sh parses the counts, flags
      # any destructive replace/delete, and tucks the raw log into a <details>.
      - name: Build the pulumi digest
        if: always()
        env:
          LABEL: ${{ matrix.app }}
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
          STACK_CHANGED: ${{ steps.changes.outputs.stack }}
        run: |
          set -euo pipefail
          # When this stack was unchanged in the PR, vet/test/preview were skipped
          # (no pulumi-out.txt, empty exit_code) -- emit an "unchanged" digest rather
          # than running pulumi-summary.sh on a missing log (which would read as a
          # false failure). The sticky comment still posts, showing the leg is clean.
          if [ "${STACK_CHANGED}" != "true" ]; then
            # shellcheck disable=SC2016 # the backticks are markdown code spans, not expansion
            printf '### %s\n\n_No changes to `%s` in this PR — preview skipped._\n' \
              "${LABEL}" "${LABEL}" | tee "${RUNNER_TEMP}/pulumi-digest.md" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "${LABEL}" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" | tee "${RUNNER_TEMP}/pulumi-digest.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Post the sticky PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: foundation-preview-${{ matrix.app }}
          path: ${{ runner.temp }}/pulumi-digest.md
