# Reusable deploy gate (#498, #1351): decide whether a push to main affects an
# app's DEPLOYABLE artifacts, via tools/ci/deploy-affected.sh (Bazel graph
# attribution when `deploy-targets` is set, path-only mode otherwise). Deduped
# from tabula-deploy.yaml and oauth-user-inspector-deploy.yaml's near-identical
# copies. FAIL-OPEN INVARIANT lives in the script, not here: every uncertain or
# error path yields affected=true.

on:
  workflow_call:
    inputs:
      workflow-file:
        description: >-
          The CALLER's own workflow filename (e.g. "tabula-deploy.yaml"), fed
          to tools/ci/resolve-deploy-base.sh so it can query that workflow's
          own run history for a durable diff base.
        required: true
        type: string
      extra-path-regex:
        description: >-
          ERE (anchored at path start) of non-graph deploy inputs (Pulumi
          programs invisible to the Bazel graph, the deploy workflow files
          themselves, ...). In path-only mode (deploy-targets unset) this is
          the SOLE affected signal, not an extra one -- see
          tools/ci/deploy-affected.sh.
        required: true
        type: string
      exclude-path-regex:
        description: >-
          Optional ERE (anchored at path start); paths matching
          extra-path-regex but ALSO this are dropped before the match test.
        required: false
        type: string
        default: ""
      deploy-targets:
        description: >-
          Space-separated Bazel target labels for TD graph-attribution mode.
          Leave empty for PATH-ONLY MODE (apps with no Bazel-graph-tracked
          deploy artifact) -- this also skips the Bazel setup step.
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 5
    outputs:
      affected:
        description: >-
          "true" if the diff affects a deployable artifact, or on any
          uncertainty (fail-open); "false" only for a confidently-unaffected
          diff.
        value: ${{ jobs.gate.outputs.affected }}

jobs:
  gate:
    if: github.event_name == 'push'
    # Coalescing (non-sha), keyed per caller so two apps' gates never
    # serialize against each other. Two rapid pushes to the SAME app must not
    # race this decision concurrently; if GitHub evicts the older run (a
    # PENDING run in a coalescing group is evicted, not queued, when a newer
    # one joins -- #1311/#1335), resolve-deploy-base.sh's durable base (above)
    # is what recovers the skipped range rather than losing it forever (#1351).
    concurrency:
      group: deploy-gate-${{ inputs.workflow-file }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      # `actions: read` is the ONLY grant this gate needs (#1351) -- it lets
      # resolve-deploy-base.sh query this workflow's own run history via the
      # GitHub Actions API. No GCP IAM change: this job never talks to Cloud
      # Run, and does not need id-token: write (no GCP auth here).
      actions: read
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # TD diffs the pre-push tip; full history keeps it + the object
          # graph reachable (same invariant as ci.yaml's build-test).
          fetch-depth: 0

      - name: Set up Bazel
        if: inputs.deploy-targets != ''
        uses: ./.github/actions/setup-bazel

      - name: Resolve the durable deploy base (#1351)
        id: durable-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ${{ inputs.workflow-file }}
        run: bash tools/ci/resolve-deploy-base.sh

      - name: Decide whether the deploy artifacts are affected
        id: decide
        env:
          # A dropped run (constant concurrency group, #1311/#1335 eviction)
          # makes github.event.before alone unsafe -- it is the EVICTED run's
          # own push tip, a range no successor run ever re-diffs. Prefer the
          # durable base; fall back to today's behavior only when it could not
          # be resolved (empty is falsy in GH Actions expressions).
          BEFORE_REV: ${{ steps.durable-base.outputs.base_sha || github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          DEPLOY_TARGETS: ${{ inputs.deploy-targets }}
          EXTRA_PATH_REGEX: ${{ inputs.extra-path-regex }}
          EXCLUDE_PATH_REGEX: ${{ inputs.exclude-path-regex }}
        run: bash tools/ci/deploy-affected.sh
