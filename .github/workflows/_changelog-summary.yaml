# Reusable "render CHANGELOG.md onto the run's step summary before a gated
# deploy" job, deduped from four near-identical copies (foundation-app-deploy,
# foundation-net-deploy, foundation-proj-deploy, tabula-deploy). The caller
# controls WHEN this runs via its own job-level `if:` on the `uses:` call --
# this workflow has no opinion on that, it only renders.
#
# The oauth-user-inspector app deliberately declares NO changelog job: its
# hand-written one rendered a `git log <before>..<sha>` push-range digest via
# --range/--path, a genuinely different shape from this one (fetch-depth: 0 for
# history, no working-directory home for a single CHANGELOG.md), and that
# workflow was deleted with the rest of the per-app lanes in Phase 3. foundation-release.yaml's changelog job is
# also NOT migrated here: it fans in over 6 sibling release jobs' outputs with
# a bespoke `cl()` helper, not a single directory's changelog.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing CHANGELOG.md. Also the source for the default
          digest label (this directory's basename) and default changelog path
          (working-directory/CHANGELOG.md) -- override either below if the
          directory name doesn't match the label/path convention.
        required: true
        type: string
      changelog-path:
        description: >-
          Full path to CHANGELOG.md, overriding the default
          "<working-directory>/CHANGELOG.md". Leave empty to use the default.
        required: false
        type: string
        default: ""
      label:
        description: >-
          Digest label, overriding the default (working-directory's
          basename). Leave empty to use the default.
        required: false
        type: string
        default: ""

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Changelog → step summary
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          path="${CHANGELOG_PATH:-${WORKING_DIRECTORY}/CHANGELOG.md}"
          label="${LABEL:-$(basename "${WORKING_DIRECTORY}")}"
          bash tools/ci/changelog-summary.sh "${path}" "" "${label}"
