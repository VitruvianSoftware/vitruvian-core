# Regression guard for tools/ci/go-test-with-retry.sh — specifically the pure
# is_transient_go_test_error classifier that decides whether a failed IaC
# `go test` invocation gets retried. Sourced, not executed (no real `go test`,
# no network): this is the logic the CI-workflow-hygiene audit flagged as
# most in need of coverage, since it was previously inline YAML and
# untestable in place.

name: Go Test With Retry Test

on:
  pull_request:
    paths:
      - "tools/ci/go-test-with-retry.sh"
      - "tools/ci/go-test-with-retry_test.sh"
      - ".github/workflows/go-test-with-retry-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/go-test-with-retry.sh"
      - "tools/ci/go-test-with-retry_test.sh"
      - ".github/workflows/go-test-with-retry-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the go-test-with-retry script tests
        run: bash tools/ci/go-test-with-retry_test.sh
