name: Auto-merge release PRs

# release-please (foundation-release, apps-release, tabula-release,
# pulumi-library-release) opens ONE PR per released component on a
# `release-please--*` branch, authored by the vitruvian-copybara-sync App. That
# App is a bypass actor on the merge-queue ruleset's required-review rule (#804),
# so its release PRs are ALLOWED to merge without a human review -- but
# release-please never enables auto-merge, so each release PR sat in
# REVIEW_REQUIRED until a maintainer merged it by hand (the friction #804's
# bypass actor was meant to remove). This enables auto-merge on those PRs, as the
# bypass App, the moment they open, so they flow THROUGH the merge queue on green
# CI with no human step -- realizing the intent documented on the #804 bypass.
#
# Scope + safety:
#   * Only `release-please--*` branches authored by a bot are matched. Those
#     branches are created solely by release-please. Human PRs still require a
#     code-owner review; nothing here touches them.
#   * Merging a foundation release PR triggers only the AUTO development deploy;
#     nonproduction/production still gate on their GitHub Environment approvals,
#     so a maintainer remains the human gate for prod. (See #804.)
#
# pull_request (not workflow_run): a GitHub App installation token is NOT the
# recursion-blocked default GITHUB_TOKEN, so App-authored PRs DO trigger
# pull_request workflows (verified: the release PRs' full PR check suite runs).
# Secrets are available because release-please--* branches are in-repo (this is
# not a fork or a Dependabot PR, which is why dependabot-auto-merge.yml must use
# workflow_run instead).
on:
  pull_request:
    # labeled/unlabeled + ready_for_review so toggling the `do-not-automerge`
    # hold label (or un-drafting a held PR) re-triggers this and releases the PR
    # back into the auto-merge flow.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  auto-merge:
    # Only NON-DRAFT, bot-authored release-please PRs that are NOT held. The
    # branch prefix is the primary selector (only release-please creates it);
    # the Bot check is belt-and-braces. A `do-not-automerge` label OR leaving the
    # PR a draft HOLDS a release so a maintainer can act on it deliberately --
    # e.g. a deploy-triggering phase release, or a breaking major that needs a
    # coordinated cut. To release a held PR into the auto-merge flow, remove the
    # label (and mark it ready if drafted).
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      github.event.pull_request.user.type == 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # cancel-in-progress: false, deliberately. release-please fires TWO
    # pull_request events on a release PR within about a second of each other
    # (opened, then an immediate labeled) -- both trigger this job, and with
    # cancel-in-progress: true the second event killed whichever run the
    # first started, every single time, showing as a spurious "cancelled"
    # check that needed a manual re-run to go green (it usually didn't
    # actually need one: the surviving sibling run had already enabled
    # auto-merge -- the cancellation was cosmetic, but still read as a
    # failure and forced action). The job is fast (seconds) and genuinely
    # idempotent (see the enabled-check below), so queuing instead of
    # cancelling is free: the second run just observes auto-merge already on
    # and exits cleanly, with no race, since the group still caps this at one
    # execution at a time.
    concurrency:
      group: release-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Mint App token
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Enable auto-merge so the PR merges through the queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Idempotent: on `synchronize` (release-please pushing an update) the PR
          # may already have auto-merge enabled -- don't error, just no-op.
          # NOTE: `gh --jq '.autoMergeRequest'` prints an EMPTY string (not "null")
          # when auto-merge is unset, so a `!= "null"` test misfires and skips
          # enabling on EVERY PR. Compare the boolean `!= null` expression instead,
          # which prints a clean "true"/"false".
          enabled="$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$enabled" = "true" ]; then
            echo "Auto-merge already enabled on release PR #$PR."
            exit 0
          fi
          echo "Enabling auto-merge for release PR #$PR; the merge queue merges it on green CI."
          gh pr merge "$PR" -R "$REPO" --squash --auto
