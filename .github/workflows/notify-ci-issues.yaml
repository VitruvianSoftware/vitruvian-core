# Pushes an ntfy notification for the two concrete pain points from
# 2026-08-04 (the gcp-networks billing migration + ntfy bridge deploys):
# James twice had to be manually told a deploy needed his approval click, and
# separately that a deploy had failed after landing on main.
#
# Polling, not event-driven, and DELIBERATELY so: GitHub Actions has no
# trigger event for "a workflow run is waiting on a required-reviewer
# approval" — deployment/deployment_status only fire AFTER a deployment (and
# therefore approval) already happened, too late for what this needs
# (confirmed against GitHub's own docs before building this). workflow_run
# would cover the main-failure half event-driven, but it requires an
# explicit `workflows:` allowlist of workflow *names* — this repo has 60+
# workflow files, and keeping that list in sync by hand defeats the point.
# One polling job covering both cases is simpler and more complete than a
# hand-maintained allowlist plus a second, different mechanism for the half
# nothing can trigger on anyway.
#
# No persistent dedup state (no actions/cache): each poll only considers
# runs updated in the last 20 minutes, comfortably wider than the 5-minute
# schedule (schedule triggers are best-effort and can slip under load) with
# low duplicate risk in practice, since a run's updated_at is set once when
# it enters "waiting" or completes, not continuously. Silence on a real
# stuck approval is the failure mode this exists to prevent — an occasional
# duplicate push is the acceptable cost of erring away from that.
#
# v1, scoped deliberately narrow (Beacon/James, 2026-08-04): only these
# cases -- both flavours of "blocked on a human click" (`waiting` = deployment
# reviewer gate, `action_required` = run-approval gate) plus main breakage.
# NOT in scope yet: "required check fails on a PR James cares about"
# (the other half of the original ask — "cares about" has no crisp
# definition, deferred) or a weekly dependency-PR digest (separate,
# lower-priority ask). Expand from here rather than building every event
# type up front.
name: notify-ci-issues

# The schedule alone is not enough. GitHub treats `*/5` as a suggestion: over
# 2026-10-06..08 this workflow ran about once every 4-7 hours (13:16, 06:00,
# 00:11, 20:11 UTC ...), and each run only looks back 20 minutes, so nearly
# every failure on main went unannounced. So it also runs on the two events
# that matter most, with a shorter look-back:
#   push to main          -- catches a commit that skipped the merge queue the
#                            moment it lands (check 4 in the script);
#   a required workflow   -- the "main is broken" alert when it happens, not
#   failing on main          hours later.
# The workflow_run list is the handful of workflows behind main's required
# checks, not all 90: a short list that rarely changes is worth keeping by
# hand. The schedule stays for the approval checks nothing can trigger on.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI", "Presubmit", "Tidy Check", "Supply Chain", "Conformance Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

# Never overlap two polls — a slow gh api page or ntfy hiccup in one run
# shouldn't stack with the next scheduled tick.
# Event-triggered runs each get their own group: GitHub keeps only ONE pending
# run per group and cancels the rest, so sharing the schedule's group would
# silently drop the very alert a failing workflow just asked for. They are
# read-only and short, so overlapping is harmless.
concurrency:
  group: notify-ci-issues-${{ github.event_name == 'schedule' && 'schedule' || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    # A required workflow that finished green on main has nothing to announce.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_PASSWORD: ${{ secrets.NTFY_GITHUB_ACTIONS_PASSWORD }}
      REPO: ${{ github.repository }}
      # Event-triggered runs fire right after the thing they report, so a
      # short look-back is enough and keeps repeat alerts down. The schedule
      # keeps the script's wider default.
      CUTOFF_MINUTES: ${{ github.event_name == 'schedule' && '20' || '8' }}
    steps:
      # tools/ci/notify-ci-issues.sh must physically exist on the runner.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for stuck approvals and main-branch failures, notify
        env:
          # The copybara-exported mirrors run their own release pipelines, and
          # until now nothing in this repo could see them fail -- every query in
          # the script interpolates the repo it runs in (#1511). Kept as an
          # explicit list rather than derived from the copybara workflows: a
          # repo appearing here means "we alert on it", which is a decision, not
          # a side effect of an export existing.
          MIRRORS: >-
            VitruvianSoftware/mcp-slack
            VitruvianSoftware/nexus-agent
            VitruvianSoftware/devx
            VitruvianSoftware/homelab
            VitruvianSoftware/pulumi-library
            VitruvianSoftware/oauth-user-inspector
            VitruvianSoftware/pulumi_go-example-foundation
            VitruvianSoftware/pulumi_ts-example-foundation
        run: bash tools/ci/notify-ci-issues.sh
