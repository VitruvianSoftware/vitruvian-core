name: Copybara Import PR (devx)

# ONE-WAY devx PR-import (CHANGE_REQUEST) -- SCHEDULED-POLL variant (go-live).
#
# The MONOREPO polls VitruvianSoftware/devx for open PRs labelled
# 'import-to-monorepo' and, for EACH match, opens/updates a MONOREPO PR under
# devx/ for human review + merge. The monorepo is the single source of truth;
# nothing is pushed to monorepo main here.
#
# WHY POLL (NOT repository_dispatch): a scheduled poll keeps ALL control flow
# inside the monorepo. The standalone never triggers a monorepo workflow and
# never supplies workflow inputs, so there is no path for PR-influenced input
# (e.g. an attacker-controlled copybara_options or PR number) to reach this job.
# The maintainer approval gate is simply "apply the label in the devx UI"; the
# monorepo decides what to import, on its own schedule, with its own credential.
#
# CREDENTIALS (single token, HTTPS only -- do NOT reintroduce SSH):
#   * secrets.DEVX_IMPORT_TOKEN is a fine-grained PAT (resource owner
#     VitruvianSoftware) provisioned by infrastructure/pulumi/repo_config and
#     materialized as an Actions secret by main.go's actionsSecrets(). Scope:
#       - READ  VitruvianSoftware/devx           (Pull requests + Contents) --
#         lets `gh pr list` and Copybara's git.github_pr_origin REST calls read
#         devx PR metadata (title, body, labels) and fetch the PR head.
#       - WRITE VitruvianSoftware/vitruvian-core (Pull requests + Contents) --
#         lets Copybara's git.github_pr_destination push the import branch /
#         open the monorepo PR, and lets the tidy step push BUILD regeneration.
#     Expires 2027-06-13 (track rotation in the runbook).
#   * The old DEVX_SYNC_SSH_KEY is NOT used here. git.github_pr_origin and
#     git.github_pr_destination are GitHub REST endpoints over HTTPS; an SSH key
#     cannot authenticate them, so mounting one was dead ceremony carried over
#     from the bidi export path. Removed.
#
# SECURITY POSTURE (do NOT weaken):
#   * Triggers are `schedule` (cron) + `workflow_dispatch` (manual). There is no
#     pull_request_target and no repository_dispatch, so DEVX_IMPORT_TOKEN is
#     never exposed to a trigger evaluated in the context of untrusted PR head
#     code, and no externally-supplied payload reaches the container.
#   * This job NEVER builds/tests/executes the imported PR content. Copybara
#     applies only core.move + the loop-prevention dynamic_transform. The single
#     build step (//:tidy) regenerates gazelle BUILD files and is monorepo-owned
#     tooling; it runs against the imported tree but does not execute arbitrary
#     PR scripts.
#   * Poll is best-effort and idempotent: a PR unlabelled between poll and import
#     is dropped by Copybara's required_labels skip-guard (exit 4, logged); a PR
#     labelled after the poll window is imported on the next cycle.

on:
    schedule:
        # Poll every 15 minutes for newly-labelled import PRs on devx.
        - cron: "*/15 * * * *"
    workflow_dispatch:
        inputs:
            poll_only:
                description: "If 'true', list matching PRs and exit without importing (debugging)."
                default: "false"
                required: false

permissions:
    contents: write
    pull-requests: write

# Serialize poll cycles so two runs cannot race the same monorepo PR branch /
# GitHub API. cancel-in-progress:false means a queued cycle waits rather than
# pre-empting an in-flight import.
concurrency:
    group: copybara-import-pr-devx-poll
    cancel-in-progress: false

jobs:
    poll-and-import:
        runs-on: ubuntu-latest
        # Bound the whole cycle well under the 15-minute cron interval so a slow
        # cycle cannot still be running when the next one is released from the
        # concurrency queue (prevents overlapping tidy pushes to the same branch).
        # If imports routinely approach this, raise the cron interval rather than
        # the timeout.
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: Set up Copybara auth (HTTPS cross-repo token only)
              env:
                IMPORT_TOKEN: ${{ secrets.DEVX_IMPORT_TOKEN }}
              run: |
                set -euo pipefail
                # HTTPS git-credentials cover BOTH repos: DEVX_IMPORT_TOKEN reads
                # devx (github_pr_origin) and writes vitruvian-core
                # (github_pr_destination + tidy push). No SSH key is mounted.
                printf 'https://x-access-token:%s@github.com\n' "$IMPORT_TOKEN" > ~/.git-credentials
                chmod 600 ~/.git-credentials
                printf '[credential]\n\thelper = store\n[user]\n\tname = VitruvianSoftware Sync\n\temail = sync@vitruviansoftware.com\n' > ~/.gitconfig

            - name: Poll devx for labelled import PRs
              id: poll
              env:
                GH_TOKEN: ${{ secrets.DEVX_IMPORT_TOKEN }}
              run: |
                set -euo pipefail

                # Fail fast if the gate label was deleted on devx -- otherwise the
                # poll silently returns zero PRs forever and imports just stop.
                if ! gh label list --repo VitruvianSoftware/devx --limit 200 \
                     | grep -q '^import-to-monorepo'; then
                  echo "::error::Label 'import-to-monorepo' not found on VitruvianSoftware/devx. Recreate it (see CONTRIBUTING.md) before imports can resume."
                  exit 1
                fi

                # Query open devx PRs carrying the maintainer gate label.
                # A failure here (network / API throttle / devx unavailable) exits
                # non-zero under `set -e`, failing this cycle visibly; the next
                # 15-minute cycle retries. See the runbook for the GitHub-status
                # check if imports stall.
                prs="$(gh pr list \
                  --repo VitruvianSoftware/devx \
                  --label import-to-monorepo \
                  --state open \
                  --json number \
                  --jq '.[].number')"

                printf '%s\n' "$prs" > /tmp/devx_import_prs.txt
                # Trim blanks for an accurate count / observability.
                count="$(printf '%s\n' "$prs" | grep -c . || true)"
                echo "count=${count}" >> "$GITHUB_OUTPUT"
                if [ "$count" -eq 0 ]; then
                  echo "No devx PRs labelled import-to-monorepo on this cycle (nothing to import)."
                else
                  echo "Found ${count} labelled import PR(s): $(printf '%s' "$prs" | tr '\n' ' ')"
                fi

            - name: Import each labelled PR (devx PR -> monorepo PR under devx/)
              if: steps.poll.outputs.count != '0' && github.event.inputs.poll_only != 'true'
              env:
                IMPORT_TOKEN: ${{ secrets.DEVX_IMPORT_TOKEN }}
              run: |
                set -euo pipefail

                prs="$(cat /tmp/devx_import_prs.txt)"

                # For EACH matching PR, run `copybara import_pr_devx <PR>` in the
                # PINNED olivr/copybara image. The positional PR number is the CLI
                # arg the smoke-test validated for git.github_pr_origin selection.
                # The concurrency group serializes whole cycles; this loop is
                # sequential within a cycle so each import finishes before the next.
                imported=0; noop=0
                while IFS= read -r pr_number; do
                  [ -z "$pr_number" ] && continue
                  echo "::group::Importing devx PR #${pr_number}"

                  set +e
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE":/usr/src/app \
                    -v "$HOME/.git-credentials":/root/.git-credentials \
                    -v "$HOME/.gitconfig":/root/.gitconfig \
                    -v "$GITHUB_WORKSPACE/tools/copybara/copy.bara.sky":/root/copy.bara.sky \
                    -e COPYBARA_CONFIG=/root/copy.bara.sky \
                    -e COPYBARA_WORKFLOW=import_pr_devx \
                    -e COPYBARA_OPTIONS="--ignore-noop" \
                    -e GITHUB_TOKEN="$IMPORT_TOKEN" \
                    olivr/copybara@sha256:87e2e9089344e64693faebb2ee0ed33b8797358c0420b0fa98325ca611e98679 \
                    copybara import_pr_devx "$pr_number"
                  rc=$?
                  set -e

                  # 0 = monorepo PR opened/updated; 4 = NO_OP. NO_OP means either the
                  # skip-guard dropped an export-origin change, OR the PR was
                  # unlabelled between poll and import (required_labels no longer
                  # match), OR there is nothing new to import. All are correct and
                  # idempotent, but we log exit 4 so a maintainer who labelled then
                  # unlabelled is not surprised by a missing import.
                  if [ "$rc" -eq 0 ]; then
                    echo "Copybara OK (exit 0) for PR #${pr_number} -- monorepo PR opened/updated."
                    imported=$((imported + 1))
                  elif [ "$rc" -eq 4 ]; then
                    echo "::warning::Copybara NO_OP (exit 4) for PR #${pr_number} -- skipped (export-origin change, nothing new, or unlabelled between poll and import). No monorepo PR change."
                    noop=$((noop + 1))
                  else
                    echo "::error::Copybara import_pr_devx failed for PR #${pr_number} (exit $rc)"
                    echo "::endgroup::"
                    exit "$rc"
                  fi
                  echo "::endgroup::"
                done <<< "$prs"

                echo "Import summary: ${imported} opened/updated, ${noop} no-op."

            - name: Install Bazel
              if: steps.poll.outputs.count != '0' && github.event.inputs.poll_only != 'true'
              uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                bazelisk-cache: true
                repository-cache: true

            - name: Regenerate gazelle BUILD files on each import PR branch
              if: steps.poll.outputs.count != '0' && github.event.inputs.poll_only != 'true'
              env:
                # Same cross-repo token: the push target is vitruvian-core, where
                # DEVX_IMPORT_TOKEN has Contents write.
                GH_TOKEN: ${{ secrets.DEVX_IMPORT_TOKEN }}
              run: |
                set -euo pipefail

                prs="$(cat /tmp/devx_import_prs.txt)"

                # For EACH imported PR, tidy the corresponding import branch. The
                # branch only exists if that PR's import was non-no-op, so a missing
                # branch is skipped cleanly (not an error). Per-PR tidy is slower
                # than a single batched run but keeps each PR's BUILD regeneration
                # isolated and individually debuggable; the 12-minute job timeout
                # bounds the worst case.
                while IFS= read -r pr_number; do
                  [ -z "$pr_number" ] && continue
                  BR="devx-import-pr-${pr_number}"
                  echo "::group::Tidy BUILD on ${BR}"

                  if ! git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
                    echo "No import PR branch (${BR}) -- skipping tidy (import no-op'd or PR unlabelled)."
                    echo "::endgroup::"
                    continue
                  fi

                  pushed=""
                  for attempt in 1 2 3 4 5; do
                    git fetch origin "$BR"
                    git checkout -B "$BR" "origin/$BR"
                    bazel run //:tidy
                    git add -A
                    if git diff --cached --quiet; then
                      echo "BUILD already up to date on ${BR} -- nothing to regenerate."
                      pushed="ok"
                      break
                    fi
                    git commit -m "chore(bazel): tidy BUILD for devx import PR #${pr_number}"
                    if git push origin "HEAD:refs/heads/$BR"; then
                      echo "Pushed BUILD regeneration onto ${BR}."
                      pushed="ok"
                      break
                    fi
                    echo "push rejected (attempt ${attempt}/5) -- branch advanced; re-syncing"
                    sleep $((attempt * 3))
                  done

                  if [ -z "$pushed" ]; then
                    echo "::error::could not push BUILD regeneration onto ${BR}"
                    echo "::endgroup::"
                    exit 1
                  fi
                  echo "::endgroup::"
                done <<< "$prs"

