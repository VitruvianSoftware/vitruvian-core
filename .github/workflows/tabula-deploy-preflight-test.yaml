# Regression guard for tools/ci/tabula-deploy-preflight.sh — the opt-in gate
# that skips tabula's migrate + blue-green + smoke when the live service already
# serves the desired revision. The test is hermetic (fake gcloud + fake revname,
# no credentials, no network) and pins the FAIL-OPEN invariant: `unchanged=true`
# only on a confident desired==live match; every error path deploys. A
# regression that made it fail CLOSED would skip a real deploy, so this guard
# matters more than most.

name: Tabula Deploy Preflight Test

on:
  pull_request:
    paths:
      - "tools/ci/tabula-deploy-preflight.sh"
      - "tools/ci/tabula-deploy-preflight_test.sh"
      - ".github/workflows/tabula-deploy-preflight-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/tabula-deploy-preflight.sh"
      - "tools/ci/tabula-deploy-preflight_test.sh"
      - ".github/workflows/tabula-deploy-preflight-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run the deploy-preflight script tests
        run: bash tools/ci/tabula-deploy-preflight_test.sh
