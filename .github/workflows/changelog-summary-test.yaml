# Regression guard for tools/ci/changelog-summary.sh — the release-notes panel
# rendered into release/deploy run summaries so an approver reads what is
# shipping before approving a gated deploy. The extractor keys off release-please
# `## [x.y.z]` headings (awk/sed), so it ships with a fixture-backed test. Runs
# on the actual runner awk, proving the POSIX-awk parser is portable.

name: Changelog Summary Test

on:
  pull_request:
    paths:
      - "tools/ci/changelog-summary.sh"
      - "tools/ci/changelog-summary_test.sh"
      - ".github/workflows/changelog-summary-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/changelog-summary.sh"
      - "tools/ci/changelog-summary_test.sh"
      - ".github/workflows/changelog-summary-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Show the runner awk (portability signal)
        run: awk -W version 2>&1 | head -1 || awk --version 2>&1 | head -1 || true

      - name: Run the changelog-summary tests
        run: bash tools/ci/changelog-summary_test.sh
