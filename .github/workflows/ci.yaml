name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          bazelrc: |
            common --announce_rc --color=yes --curses=yes
            common --show_progress_rate_limit=60 --show_timestamps

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          bazelrc: |
            common --announce_rc --color=yes --curses=yes
            common --show_progress_rate_limit=60 --show_timestamps

      - name: Build macOS app
        # --config=macos-app activates Apple's CC toolchain (needed for the
        # objc-executable link). NexusAgent (macos_application) carries
        # tags=["manual"], so the wildcard skips it -- build it explicitly by
        # label. The wildcard still builds the rest of nexus-agent (Swift lib,
        # Node bridge, hooks) on macOS.
        run: bazel build --config=macos-app //nexus-agent/... //nexus-agent/macos:NexusAgent

  license-check:
    # Mirror devx's standalone license-header lint (addlicense) on the devx/
    # subtree, so a missing MIT header is caught HERE on the PR rather than
    # downstream when the change fans out and reddens devx's own CI. devx is the
    # only synced component that enforces headers; the monorepo-only gazelle
    # BUILD files are ignored (the standalone has none). See docs/copybara-bidi-sync.md §9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install addlicense
        run: go install github.com/google/addlicense@latest
      - name: Check devx license headers
        working-directory: devx
        run: |
          # go install drops the binary in GOPATH/bin, which isn't on PATH on the runner.
          "$(go env GOPATH)/bin/addlicense" -check -c "VitruvianSoftware" -l mit \
            -ignore "docs/**" -ignore "internal/scaffold/templates/**" \
            -ignore "**/BUILD" -ignore "**/BUILD.bazel" .
