name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue (#83): GitHub runs CI on the would-be-merged commit before it
  # fast-forwards main. Handled like postsubmit below -- a full //... sweep.
  merge_group:

# Cancel a PR's in-flight CI when it is superseded by a newer push to the same
# PR. NEVER cancels push-to-main or merge_group runs (the postsubmit + merge
# queue safety floor): cancellation is gated on the pull_request event, and
# push / merge_group runs key into their own (non-cancelling) ref groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # RBE auth for BuildBuddy (remote execution + cache on the Linux runner).
      # Endpoints come from the committed tools/remote.bazelrc (--config=remote);
      # the key is the BUILDBUDDY_API_KEY repo secret.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          # SAFETY INVARIANT (issue #81): affected-target selection needs the PR
          # merge-base with origin/main present locally. The default shallow
          # fetch (depth 1) lacks it and would break target-determinator (and the
          # diff guard). Full history makes the merge-base + before-rev reliable;
          # target-determinator may also check the before-rev out into a temp
          # worktree, which needs the full object graph.
          fetch-depth: 0

      - name: Set up Go (for target-determinator)
        # target-determinator's module is `go 1.24`; pin >= 1.24. The binary
        # lands in $(go env GOPATH)/bin, not on PATH (same as addlicense below).
        # Only meaningfully used on pull_request; harmless on push.
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # PRESUBMIT ONLY. `build-test` is a REQUIRED status check behind the merge
      # queue, so it must ALWAYS report a result -- a naive `paths-ignore` would
      # make it never report and wedge the PR "pending" forever, and merge_group
      # events ignore `paths:` anyway. So we keep triggering on every event and
      # only short-circuit the pull_request lane: when a PR's diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The push / merge_group full //... sweep below is left UNCONDITIONAL: this
      # gate never touches it, so the postsubmit + merge-queue safety floor is
      # exactly as strong as before.
      - name: Gate on changed paths (PR only)
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/relevant-paths.sh

      # --- POSTSUBMIT (push to main) + MERGE QUEUE: ALWAYS the full sweep. ----
      # This is the safety floor. The worst case must never be less safe than
      # today: every commit that lands on main -- whether pushed directly or
      # merged through the queue (#83) -- is built and tested over //...,
      # unconditionally. Auth flags preserved byte-for-byte from the original.
      - name: Build (full //... on main / merge queue)
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        run: bazel build --config=remote --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY //...

      - name: Test (full //... on main / merge queue)
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        run: bazel test --config=remote --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY //...

      # --- PRESUBMIT (pull_request): AFFECTED targets, fall back to //... . ---
      # All the logic (merge-base before-rev, global-impact guard -> //...,
      # target-determinator, empty-set skip, build-then-build_tests_only,
      # tolerate exit 4) lives in the committed helper so it is reviewable and
      # testable. Any error or uncertainty inside it falls back to a full
      # //... build+test, so the PR lane is never less safe than the old one.
      # Gated to pull_request ONLY: on push the full sweep above runs instead,
      # and on any future trigger (e.g. merge_group, where github.base_ref is
      # empty) this step is skipped rather than running with an unset BASE_REF.
      # Gated additionally on the changed-paths result: skipped (job still green)
      # when the PR is docs/gitops/markdown-only. `relevant` is empty on any
      # non-pull_request event, but this step is already pull_request-only, so
      # the extra clause only ever suppresses the docs-only case; the steps fail
      # safe to running whenever the gate is uncertain (relevant != 'false').
      - name: Build + test affected targets (PR)
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/affected-targets.sh

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history so the PR path filter can diff against the merge-base.
          fetch-depth: 0

      # Path-aware guard for the heavy macOS build on BOTH presubmit lanes:
      # regular PRs and merge_group (the merge queue). On push to main the filter
      # is skipped and the unconditional postsubmit build below is the safety
      # floor. dorny/paths-filter does a cheap name-only diff and never fails the
      # job on its own; it only decides whether to run the build, so the required
      # `build-macos` check always reports a result (fast when nothing macOS
      # changed, instead of a full macOS build on every queued PR).
      - name: Detect macOS-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # PR: diff against the target branch. merge_group: diff the queued
          # commit against the base the queue is merging onto (base_sha is
          # reachable because fetch-depth: 0 fetched the full history above).
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.base_ref }}
          filters: |
            macos:
              - 'nexus-agent/**'
              # ALL of tools/** -- the Apple CC toolchain + platforms live here,
              # and .bazelrc `import`s tools/preset.bazelrc, tools/java17.bazelrc
              # and tools/remote.bazelrc, any of which can change the .app build.
              - 'tools/**'
              # .bazelrc defines --config=macos-app; .bazelversion pins the
              # toolchain version; global build config -- rebuild on these too.
              - '.bazelrc'
              - '.bazelversion'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.github/workflows/ci.yaml'

      - name: Set up Bazel
        # Set up Bazel only when we are going to build: always on push (floor),
        # on merge_group unless the filter is SURE no macOS path changed, and on
        # a PR only when the filter matched.
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.macos != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.macos == 'true')
        uses: ./.github/actions/setup-bazel

      # POSTSUBMIT (push to main): ALWAYS build the macOS app -- the safety floor
      # for anything that lands on main outside the queue (direct / admin push).
      #
      # --config=macos-app activates Apple's CC toolchain (needed for the
      # objc-executable link). NexusAgent (macos_application) carries
      # tags=["manual"], so the wildcard skips it -- build it explicitly by
      # label. The wildcard still builds the rest of nexus-agent (Swift lib,
      # Node bridge, hooks) on macOS.
      - name: Build macOS app (postsubmit floor on push to main)
        if: github.event_name == 'push'
        run: bazel build --config=macos-app //nexus-agent/... //nexus-agent/macos:NexusAgent

      # PRESUBMIT (merge queue + PR): build only when the diff touches a
      # macOS-relevant path. On merge_group we build UNLESS the filter is certain
      # nothing macOS-relevant changed (macos == 'false'), so any filter
      # uncertainty (empty/missing result) fails safe to building rather than
      # letting a macOS-breaking change merge unbuilt.
      - name: Build macOS app (merge queue / PR, if macOS-relevant)
        if: >-
          (github.event_name == 'merge_group' && steps.changes.outputs.macos != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.macos == 'true')
        run: bazel build --config=macos-app //nexus-agent/... //nexus-agent/macos:NexusAgent

  license-check:
    # Whole-repo MIT license-header check (addlicense). Generated/tool-managed
    # files are ignored (BUILD = gazelle, lockfiles, baselines) so the tool never
    # fights their regeneration. Catches a missing header on the PR, before fan-out.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.2.0
      - name: Check license headers (whole repo)
        run: |
          # go install drops the binary in GOPATH/bin, which isn't on PATH on the runner.
          "$(go env GOPATH)/bin/addlicense" -check -c "VitruvianSoftware" -l mit \
            -ignore "**/BUILD" -ignore "**/BUILD.bazel" \
            -ignore "**/docs/**" -ignore "**/internal/scaffold/templates/**" \
            -ignore "pnpm-lock.yaml" -ignore "**/package-lock.json" -ignore "**/Cargo.lock" -ignore "MODULE.bazel.lock" \
            -ignore "**/gazelle_python.yaml" -ignore "**/*-baseline.xml" -ignore "**/.release-please-manifest.json" \
            -ignore "**/Pulumi.*.yaml" \
            -ignore "**/dev-local/crds/**" -ignore "**/dev-local/values/**" -ignore "**/dev-local/dashboards/**" \
            -ignore "**/prisma/migrations/**" \
            -ignore "bazel-*/**" -ignore "**/node_modules/**" -ignore "**/*.venv/**" -ignore ".git/**" \
            .
