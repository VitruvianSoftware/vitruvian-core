name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter here: this job backs several required merge-queue
  # checks (build-test, build-macos, license-check, go-lint, go-test-infra,
  # go-race, validate-butane). `pull_request: branches: [main]` filters on the
  # PR's BASE branch, and a stacked PR (opened against another open PR's
  # branch, not main) has a non-main base -- so a base-branch filter here
  # meant these required checks silently never ran on any stacked PR, which
  # then merges anyway via `bypass_actors: RepositoryRole:always`. Matches
  # tidy-check.yaml / conformance-check.yaml, which never had this filter.
  pull_request:
  # Merge queue (#83): GitHub runs CI on the would-be-merged commit before it
  # fast-forwards main. Builds/tests the AFFECTED targets vs the queue base
  # (same engine + fail-safe //... fallbacks as presubmit); the scheduled
  # periodic-full-sweep.yaml is the whole-graph backstop.
  merge_group:

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: every job here only checks out and builds/tests
# (build-test, build-macos, license-check) -- none writes to the repo or API.
# Pin contents: read explicitly so the floor is independent of the repo/org
# default-permissions setting (which can change out from under the workflow).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # RBE auth for BuildBuddy (remote execution + cache on the Linux runner).
      # Endpoints come from the committed tools/remote.bazelrc (--config=remote);
      # the key is the BUILDBUDDY_API_KEY repo secret.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # SAFETY INVARIANT (issue #81): affected-target selection needs the PR
          # merge-base with origin/main present locally. The default shallow
          # fetch (depth 1) lacks it and would break target-determinator (and the
          # diff guard). Full history makes the merge-base + before-rev reliable;
          # target-determinator may also check the before-rev out into a temp
          # worktree, which needs the full object graph.
          fetch-depth: 0

      # Free disk BEFORE any Bazel work -- see the free-disk-space composite
      # for the rationale (#404/#374 hit "No space left on device").
      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # Restore the extracted LLVM toolchain (#1039) and pair it with the
      # tripwire below -- see the llvm-cache-restore composite for the
      # rationale and the content-hash pin (kept in exactly one place there).
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: ./.github/actions/llvm-cache-restore

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).
      - name: Gate on changed paths
        id: gate
        if: github.event_name != 'merge_group'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE_REV: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash tools/ci/relevant-paths.sh

      # --- ALL LANES: AFFECTED targets, fall back to //... on any doubt. ------
      # Every lane runs tools/ci/affected-targets.sh; only the diff BASE differs:
      #   pull_request  merge-base vs origin/${{ github.base_ref }}
      #   merge_group   the queue base (github.event.merge_group.base_sha) --
      #                 exactly the main tip this group would land on
      #   push (main)   the pre-push tip (github.event.before); forced pushes
      #                 full-sweep (FORCED_PUSH) since history was rewritten
      # All the logic (global-impact guard -> //..., target-determinator,
      # empty-set skip, build-then-build_tests_only, tolerate exit 4) lives in
      # the committed helper so it is reviewable and testable. Any error or
      # uncertainty inside it falls back to a full //... build+test, so no lane
      # is ever less safe than a full sweep.
      #
      # SAFETY PAIRING: the whole-graph correctness backstop for affected
      # selection is the scheduled periodic-full-sweep.yaml (nightly //...,
      # files a P0 issue on red). `bazel run //tools/conformance:check` FAILS if
      # that workflow disappears while these lanes are affected-scoped -- do not
      # remove one without the other.

      # PRESUBMIT (pull_request). Additionally gated on the changed-paths
      # result: skipped (job still green) when the PR is docs/gitops/markdown-
      # only; fails safe to running whenever the gate is uncertain.
      - name: Build + test affected targets (PR)
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/affected-targets.sh

      # MERGE QUEUE (merge_group). base_sha is reachable because the checkout
      # above uses fetch-depth: 0 (build-macos already relies on the same).
      - name: Build + test affected targets (merge queue)
        if: github.event_name == 'merge_group'
        env:
          BEFORE_REV: ${{ github.event.merge_group.base_sha }}
        run: bash tools/ci/affected-targets.sh

      # POSTSUBMIT (push to main). Verifies the landed commit; queue-merged
      # commits were just tested as merge_group, so this is cheap re-verification
      # of the same diff (plus coverage for admin/break-glass direct pushes).
      # event.before is the zero SHA on ref creation -> script full-sweeps.
      # Additionally gated on relevant-paths: docs-only pushes skip the heavy
      # work (the nightly full sweep is the backstop).
      - name: Build + test affected targets (push to main)
        if: github.event_name == 'push' && steps.gate.outputs.relevant != 'false'
        env:
          BEFORE_REV: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: bash tools/ci/affected-targets.sh

  # macOS build, split so a premium macOS runner is claimed ONLY when a macOS-
  # relevant path actually changed (#821). Previously the whole build-macos job
  # ran on macos-latest and claimed a macOS runner on every PR/merge_group just
  # to run a path filter and then no-op. Three jobs now:
  #   detect-macos (Linux) -- cheap path filter; decides if the build is needed.
  #   macos-build  (macOS) -- the actual build; the ONLY macOS-runner claim.
  #   build-macos  (Linux) -- the REQUIRED merge-queue check; always reports and
  #                           reflects macos-build's result.
      # Tripwire -- see the llvm-cache-tripwire composite for the rationale
      # (hardened per review on #1304 after a placement-bug incident).
      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  detect-macos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.changes.outputs.macos }}
      # Push lane only: 'false' when the whole diff is docs/gitops/markdown, so
      # macos-build can decline to claim a macOS runner for a change that
      # provably cannot affect it. Empty on PR/merge_group (falsy -> no effect).
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Need history so the path filter can diff against the merge-base.
          fetch-depth: 0
      # dorny/paths-filter does a cheap name-only diff and never fails the job;
      # it only decides whether macos-build runs. Skipped on push (the postsubmit
      # floor always builds), so outputs.macos is empty there and macos-build's
      # own `push` branch triggers the build.
      # Postsubmit docs/gitops-only skip. detect-macos deliberately skips its
      # path filter on push (the postsubmit floor always built), which meant a
      # one-line gitops digest bump claimed a macOS runner and built the app:
      # 156s on 69436a56. Decide it HERE, on the cheap ubuntu gatekeeper, rather
      # than after the macOS runner is already claimed. Fails safe -- see
      # tools/ci/relevant-paths.sh; the nightly full sweep is unchanged.
      - name: Gate on changed paths (push lane)
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE_REV: ${{ github.event.before }}
        run: bash tools/ci/relevant-paths.sh

      - name: Detect macOS-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # merge_group: diff the queued commit against the base the queue is
          # merging onto (base_sha is reachable because fetch-depth: 0 fetched
          # the full history above).
          #
          # PR: deliberately EMPTY. paths-filter ignores `base` entirely on a
          # pull_request event -- it diffs the PR against its own base via the
          # API -- and warns for any non-empty value ("'base' input parameter is
          # ignored when action is triggered by pull request event"). Passing
          # github.base_ref here changed nothing but put a warning annotation on
          # every path-gated job of every PR run, 8 per run. Empty is falsy, so
          # the action takes the identical code path without the annotation.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            macos:
              - 'nexus-agent/**'
              # ALL of tools/** -- the Apple CC toolchain + platforms live here,
              # and .bazelrc `import`s tools/preset.bazelrc, tools/java17.bazelrc
              # and tools/remote.bazelrc, any of which can change the .app build.
              - 'tools/**'
              # .bazelrc defines --config=macos-app; .bazelversion pins the
              # toolchain version; global build config -- rebuild on these too.
              - '.bazelrc'
              - '.bazelversion'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.github/workflows/ci.yaml'

  macos-build:
    # The ONLY job that needs a macOS runner, so the ONLY place one is claimed.
    # Runs: always on push (postsubmit floor); on merge_group UNLESS the filter is
    # sure nothing macOS-relevant changed (filter uncertainty -> build, failing
    # safe); on a PR only when the filter matched. When it does not run it is
    # `skipped`, which build-macos treats as a pass. Not a required check itself.
    needs: detect-macos
    if: >-
      (github.event_name == 'push' && needs.detect-macos.outputs.relevant != 'false') ||
      (github.event_name == 'merge_group' && needs.detect-macos.outputs.macos != 'false') ||
      (github.event_name == 'pull_request' && needs.detect-macos.outputs.macos == 'true')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The premium macOS runner was the one Bazel lane with NO action cache at
      # all (setup-bazel gives only bazelisk + repository caches, which are
      # DOWNLOAD caches). --config=remotecache-ci adds the BuildBuddy remote action
      # cache and async BES but sets NO --remote_executor, so execution stays
      # LOCAL -- mandatory here, since the Apple toolchain cannot run on the
      # Linux RBE workers, and outputs stay materialised for the objc link and
      # XCTest run. The cache is self-warming: this job runs on every push to
      # main, so a nexus-agent PR branched off recent main pulls most unchanged
      # Swift/objc outputs instead of recompiling them. Content-addressed, so
      # macOS action digests only ever hit from prior macOS runs; a cache error
      # falls back to local execution (never slower, never incorrect).
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # --config=macos-app activates Apple's CC toolchain (needed for the
      # objc-executable link). NexusAgent (macos_application) carries
      # tags=["manual"], so the wildcard skips it -- build it explicitly by
      # label. The wildcard still builds the rest of nexus-agent (Swift lib,
      # Node bridge, hooks) on macOS.
      #
      # The remote cache is only wired when the key is present: a fork PR has no
      # secret, and passing an empty --remote_header would fail the build rather
      # than degrade to local.
      - name: Build macOS app
        run: |
          cache=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          else
            echo "::notice::no BuildBuddy key (fork PR?) -- building without the remote cache."
          fi
          bazel build "${cache[@]}" --config=macos-app //nexus-agent/... //nexus-agent/macos:NexusAgent
          # Swift unit tests (VersionCompare etc.) -- macos-only + manual, so run
          # by explicit label here where Xcode/XCTest is available (#807).
          bazel test "${cache[@]}" --config=macos-app //nexus-agent/macos:NexusAgent_tests

  build-macos:
    # REQUIRED merge-queue check. Runs on cheap Linux and ALWAYS reports (so the
    # queue never wedges), reflecting macos-build's result: pass when the build
    # SUCCEEDED or was correctly SKIPPED (no macOS-relevant change), fail when it
    # failed/was cancelled. This keeps the macOS-runner claim off the majority of
    # PRs that touch no macOS path (#821) WITHOUT the skipped-required-check
    # ambiguity this repo avoids -- the required job itself always runs + reports.
    needs: [detect-macos, macos-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reflect the macOS build result
        env:
          DETECT_RESULT: ${{ needs.detect-macos.result }}
          MACOS_RESULT: ${{ needs.macos-build.result }}
        run: |
          echo "detect-macos=${DETECT_RESULT}  macos-build=${MACOS_RESULT}"
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect-macos ${DETECT_RESULT} -- cannot determine macOS relevance; refusing to green build-macos."
            exit 1
          fi
          case "$MACOS_RESULT" in
            success|skipped) echo "macOS build OK (${MACOS_RESULT})." ;;
            *) echo "::error::macOS build ${MACOS_RESULT}." ; exit 1 ;;
          esac

  license-check:
    # Whole-repo MIT license-header check, now hermetic via Bazel. The addlicense
    # binary + the ignore set both live in //tools/license (BUILD.bazel), so the
    # check runs identically here and locally (`bazel run //tools/license:check`);
    # `bazel run //tools/license:add` fixes missing headers. Generated/tool-managed
    # files are ignored there (BUILD = gazelle, lockfiles, baselines, etc.).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The gate below diffs against the merge-base / before-rev.
          fetch-depth: 0
      # Deliberately UNGATED and ahead of the changed-paths gate: it is a few
      # seconds of pure bash with no Bazel, and it guards the verifier that this
      # required check's verdict rests on. A silent hole in :verify (see the
      # SIGPIPE case the test pins) is invisible in every other lane.
      - name: Self-test the license verifier
        run: bash tools/license/verify_test.sh
      # This was the last heavy Bazel lane with NO changed-paths gate, so a
      # docs-only PR still paid the full ~3min LLVM toolchain fetch here after
      # build-test/tidy-check/conformance-check had all already short-circuited.
      # Same run-then-noop-green shape as those lanes: the JOB always runs and
      # reports (it is a REQUIRED check -- skipping it would wedge the queue
      # "pending"), only the Bazel steps are gated.
      #
      # IGNORE_REGEX is deliberately NARROWER than the script default, which
      # also treats gitops/ as inert. addlicense does not ignore gitops/ (those
      # manifests carry MIT headers today) and //tools/license:{check,verify}
      # are `bazel run` sh_binaries with no sh_test, so `bazel test //...` and
      # the nightly periodic-full-sweep never cover them (the self-test step
      # above is what covers :verify). Treating gitops/ as
      # skippable here would let an unlicensed gitops file dodge a required
      # check with no backstop. docs/ and *.md ARE inert: addlicense ignores
      # **/docs/** and never headers markdown, and :verify only scans source
      # extensions.
      - name: Gate on changed paths
        id: gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE_REV: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          IGNORE_REGEX: '^docs/|\.md$'
        run: bash tools/ci/relevant-paths.sh
      - name: Set up Bazel
        if: steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/setup-bazel
      - name: Check license headers present (whole repo)
        if: steps.gate.outputs.relevant != 'false'
        run: bazel run //tools/license:check
      # addlicense -check above is PRESENCE-only (an Apache header with a wrong
      # holder passes it). This CONTENT gate enforces MIT + VitruvianSoftware in
      # every first-party LICENSE and any source header present (issue #457).
      - name: Verify license content is MIT + VitruvianSoftware
        if: steps.gate.outputs.relevant != 'false'
        run: bazel run //tools/license:verify

  go-lint:
    # Authoritative golangci-lint for the Go apps exported to standalone mirrors.
    # aspect_rules_lint has no golangci-lint aspect, and the per-app mirror CI is
    # being retired (the monorepo is the single CI authority), so Go lint runs
    # here as a matrix over each module -- standalone (GOWORK=off), exactly as it
    # lints in its mirror today.
    #
    # Each matrix leg is path-gated on presubmit lanes (same run-then-noop-green
    # pattern as build-macos): a required check must ALWAYS report a result, so
    # the JOB always runs and only the work inside is skipped when the diff
    # can't affect this module. GOWORK=off makes the module fully standalone,
    # so <module>/** (plus this workflow) is the complete input set. Push to
    # main stays unconditional (the postsubmit floor).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [devx, homelab]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # merge_group diffs need the base_sha reachable locally.
          fetch-depth: 0
      # Cheap name-only diff; never fails the job on its own. Fail-safe
      # asymmetry mirrors build-macos: a PR runs the work only when the filter
      # POSITIVELY matched, the merge queue runs it unless the filter is
      # CERTAIN nothing relevant changed (uncertainty -> run).
      # Postsubmit docs/gitops-only skip (mirrors build-test). Without this the
      # `github.event_name == 'push'` clause below bypasses the path filter
      # entirely, so a one-line gitops digest bump ran the full heavy step on
      # main. Measured on 69436a56 (gitops/argocd/platform/buzz/values.yaml,
      # ONE line): example-build 452s + macos-build 156s + go-race 144s = 12.5
      # min of runner time that the diff provably cannot affect. 83 of the last
      # 321 commits on main were gitops-only (~5.9/day) -> ~37 runner-hours a
      # month.
      #
      # relevant-paths.sh FAILS SAFE: any missing/uncomputable diff base yields
      # relevant=true, and the only way to get false is a fully-computed diff in
      # which EVERY changed file is docs/gitops/markdown. The whole-graph safety
      # floor is unchanged -- periodic-full-sweep.yaml still runs
      # `bazel build //...` + `bazel test //...` nightly at 06:00 UTC.
      - name: Gate on changed paths
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE_REV: ${{ github.event.before }}
        run: bash tools/ci/relevant-paths.sh

      - name: Detect ${{ matrix.module }}-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            module:
              - '${{ matrix.module }}/**'
              - '.github/workflows/ci.yaml'
      - uses: actions/setup-go@v7
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.module != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.module == 'true')
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # setup-go keys its module/build cache on a dependency file, defaulting
          # to a go.sum at the REPO ROOT. With GOWORK=off these are standalone
          # modules whose go.sum lives under <module>/, so the default key missed
          # and the cache never restored. Same wiring go-test already uses.
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: golangci-lint (${{ matrix.module }})
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.module != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.module == 'true')
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.1
          working-directory: ${{ matrix.module }}

  go-test-infra:
    # Go tests for the IaC programs (infrastructure/pulumi/** and <app>/infra/**).
    #
    # These had NO test lane at all. They are outside go.work, the `go-test`
    # matrix above covers only devx/homelab, and `pulumi_project` emits just
    # `bazel run` wrappers -- no go_test target -- so `bazel test //...` never
    # saw them either. Tests written for these programs were therefore DEAD:
    # they compiled on a developer's laptop and never executed in CI.
    #
    # That was not hypothetical. The floating-project toggle regression guard
    # (modules/base_env, added with the bu2 rollout) had never once run.
    #
    # Modules are discovered rather than listed so a new app's infra is covered
    # the day it lands, and only modules that actually contain a _test.go are
    # run -- `go test ./...` in a module with no tests is a slow no-op. GOWORK
    # is off because these modules are deliberately not workspace members.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Postsubmit docs/gitops-only skip (mirrors build-test). Without this the
      # `github.event_name == 'push'` clause below bypasses the path filter
      # entirely, so a one-line gitops digest bump ran the full heavy step on
      # main. Measured on 69436a56 (gitops/argocd/platform/buzz/values.yaml,
      # ONE line): example-build 452s + macos-build 156s + go-race 144s = 12.5
      # min of runner time that the diff provably cannot affect. 83 of the last
      # 321 commits on main were gitops-only (~5.9/day) -> ~37 runner-hours a
      # month.
      #
      # relevant-paths.sh FAILS SAFE: any missing/uncomputable diff base yields
      # relevant=true, and the only way to get false is a fully-computed diff in
      # which EVERY changed file is docs/gitops/markdown. The whole-graph safety
      # floor is unchanged -- periodic-full-sweep.yaml still runs
      # `bazel build //...` + `bazel test //...` nightly at 06:00 UTC.
      - name: Gate on changed paths
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE_REV: ${{ github.event.before }}
        run: bash tools/ci/relevant-paths.sh

      - name: Detect IaC-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            iac:
              - 'infrastructure/pulumi/**'
              - '*/infra/**'
              - '.github/workflows/ci.yaml'
      - uses: actions/setup-go@v7
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.iac != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.iac == 'true')
        with:
          go-version-file: go.mod
          # Cache module downloads across runs, keyed on every IaC module's own
          # go.sum. Without this, setup-go's default cache-dependency-path
          # assumes a single go.sum at the repo root (same gap go-lint above
          # already had to work around) -- which isn't any of these ~40
          # GOWORK=off modules, so the cache key never matched their actual
          # dependencies and every run re-downloaded the full graph from
          # proxy.golang.org from scratch. That's most of why a transient
          # proxy hiccup shows up here so often (#1596): a cache hit skips the
          # network entirely for a module whose deps haven't changed.
          cache-dependency-path: |
            infrastructure/pulumi/**/go.sum
            */infra/**/go.sum
      - name: go test (IaC modules with tests)
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.iac != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.iac == 'true')
        run: bash tools/ci/go-test-with-retry.sh

  go-race:
    # Race detector over EVERY Bazel go_test target (72 today).
    #
    # Until this lane existed, race coverage came only from the `go-test` matrix
    # above -- standalone `go test -race` over exactly two modules, devx and
    # homelab. Every other Go target in the repo, including all of tabula's, had
    # never been race-tested anywhere. `bazel test` does not enable -race (there
    # was no race config in any bazelrc), which the go-test job's own comment
    # noted without closing.
    #
    # Its own job, not a flag on build-test: `--@rules_go//go/config:race` is a
    # build-configuration change ("Build option ... has changed, discarding
    # analysis cache"), so folding it into the default lane would thrash that
    # cache on every non-race build. A separate runner pays the analysis once.
    #
    # Verified the flag genuinely arms the detector rather than being silently
    # accepted: a deliberately racy test PASSED without it and FAILED with
    # "WARNING: DATA RACE" with it. Measured 83s for all 72 targets.
    #
    # Always reports (the steps are gated, never the job) so it is safe to
    # require -- a skipped required check wedges the merge queue "pending".
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Postsubmit docs/gitops-only skip (mirrors build-test). Without this the
      # `github.event_name == 'push'` clause below bypasses the path filter
      # entirely, so a one-line gitops digest bump ran the full heavy step on
      # main. Measured on 69436a56 (gitops/argocd/platform/buzz/values.yaml,
      # ONE line): example-build 452s + macos-build 156s + go-race 144s = 12.5
      # min of runner time that the diff provably cannot affect. 83 of the last
      # 321 commits on main were gitops-only (~5.9/day) -> ~37 runner-hours a
      # month.
      #
      # relevant-paths.sh FAILS SAFE: any missing/uncomputable diff base yields
      # relevant=true, and the only way to get false is a fully-computed diff in
      # which EVERY changed file is docs/gitops/markdown. The whole-graph safety
      # floor is unchanged -- periodic-full-sweep.yaml still runs
      # `bazel build //...` + `bazel test //...` nightly at 06:00 UTC.
      - name: Gate on changed paths
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE_REV: ${{ github.event.before }}
        run: bash tools/ci/relevant-paths.sh

      - uses: ./.github/actions/setup-bazel
      # Restore the extracted LLVM toolchain (#1039) and pair it with the
      # tripwire below -- see the llvm-cache-restore composite for the
      # rationale and the content-hash pin (kept in exactly one place there).
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: ./.github/actions/llvm-cache-restore
      - name: Detect Go changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'MODULE.bazel'
              - '.bazelrc'
              - '.github/workflows/ci.yaml'
      - name: Race-test all Go targets
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          steps.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          # Only go_test targets: race instruments Go, and sweeping //... here
          # would duplicate build-test's work in a second configuration.
          bazel query 'kind(go_test, //...)' > /tmp/go-tests.txt
          count="$(wc -l < /tmp/go-tests.txt | tr -d ' ')"
          if [ "${count}" -eq 0 ]; then
            echo "::error::no go_test targets found — refusing to report green on an empty race run."
            exit 1
          fi
          echo "race-testing ${count} go_test target(s)"
          bazel test --config=race --config=remote \
            --remote_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY}" \
            --target_pattern_file=/tmp/go-tests.txt

      # Tripwire -- see the llvm-cache-tripwire composite for the rationale
      # (hardened per review on #1304 after a placement-bug incident).
      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  example-build:
    # The go-foundation EXAMPLE (pulumi/examples/go-foundation) is a reference
    # users copy. Its Go is otherwise compiled ONLY in its downstream copybara
    # mirror, so a change here that breaks it (e.g. #1097 broke the app-infra
    # example leaf while this repo's CI stayed green) was invisible until the
    # mirror re-ran. This compiles every example module IN THE SOURCE REPO.
    #
    # Own job (not folded into go-test-infra) + generous timeout because it is
    # ~27 standalone modules each pulling the Pulumi SDK; path-gated so it only
    # runs when the example — or a library it consumes — actually changes.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The push-lane gate below diffs against github.event.before; the
          # default depth-1 checkout has no such commit, so relevant-paths.sh
          # fails safe to relevant=true and the 474s example build ran anyway on
          # a one-line gitops digest bump (measured on d86305bc, #1762). Every
          # other gated job already fetches full history for exactly this reason.
          fetch-depth: 0
      # Postsubmit docs/gitops-only skip (mirrors build-test). Without this the
      # `github.event_name == 'push'` clause below bypasses the path filter
      # entirely, so a one-line gitops digest bump ran the full heavy step on
      # main. Measured on 69436a56 (gitops/argocd/platform/buzz/values.yaml,
      # ONE line): example-build 452s + macos-build 156s + go-race 144s = 12.5
      # min of runner time that the diff provably cannot affect. 83 of the last
      # 321 commits on main were gitops-only (~5.9/day) -> ~37 runner-hours a
      # month.
      #
      # relevant-paths.sh FAILS SAFE: any missing/uncomputable diff base yields
      # relevant=true, and the only way to get false is a fully-computed diff in
      # which EVERY changed file is docs/gitops/markdown. The whole-graph safety
      # floor is unchanged -- periodic-full-sweep.yaml still runs
      # `bazel build //...` + `bazel test //...` nightly at 06:00 UTC.
      - name: Gate on changed paths
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE_REV: ${{ github.event.before }}
        run: bash tools/ci/relevant-paths.sh

      - name: Detect example/library changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            ex:
              - 'pulumi/examples/go-foundation/**'
              - 'pulumi/library/**'
              - '.github/workflows/ci.yaml'
      - uses: actions/setup-go@v7
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.ex != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.ex == 'true')
        with:
          go-version-file: go.mod
      # Runs BEFORE the build, because it is the same failure with a usable
      # error message. The examples `replace` the library with a local path but
      # pin their own copy of its transitive graph, and Dependabot tidies only
      # the module it bumps -- so a library bump desyncs them and `go build`
      # reports the contextless "go: updates to go.mod needed; to update it: go
      # mod tidy", naming no module, no dependency and no PR. (#1166/#1175/#1179
      # each burned a diagnosis on that.) This names the module, prints the
      # diff, and gives the command that fixes it. Read-only: `go mod tidy
      # -diff` never writes, so this cannot dirty the tree it is checking.
      - name: Assert example/library module pins are in sync
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.ex != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.ex == 'true')
        run: bash tools/gomod/tidy.sh --check

      - name: go build (every example module)
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.ex != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.ex == 'true')
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            n=$((n + 1))
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done < <(find pulumi/examples/go-foundation -name go.mod -not -path '*/vendor/*' | sort)
          echo "compiled $n example module(s)"

  validate-butane:
    # devx's Fedora CoreOS Butane template must render to valid Ignition. There
    # is no Bazel target for this -- it is a devx-specific check ported verbatim
    # from the retired devx mirror CI so the coverage is not lost.
    #
    # Path-gated on presubmit lanes (run-then-noop-green, like go-lint/go-test
    # above). The check's only in-tree input is the template itself -- the
    # envsubst vars are dummies and butane comes from a container image -- so
    # the filter is exactly that file (plus this workflow). Push unconditional.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Postsubmit docs/gitops-only skip (mirrors build-test). Without this the
      # `github.event_name == 'push'` clause below bypasses the path filter
      # entirely, so a one-line gitops digest bump ran the full heavy step on
      # main. Measured on 69436a56 (gitops/argocd/platform/buzz/values.yaml,
      # ONE line): example-build 452s + macos-build 156s + go-race 144s = 12.5
      # min of runner time that the diff provably cannot affect. 83 of the last
      # 321 commits on main were gitops-only (~5.9/day) -> ~37 runner-hours a
      # month.
      #
      # relevant-paths.sh FAILS SAFE: any missing/uncomputable diff base yields
      # relevant=true, and the only way to get false is a fully-computed diff in
      # which EVERY changed file is docs/gitops/markdown. The whole-graph safety
      # floor is unchanged -- periodic-full-sweep.yaml still runs
      # `bazel build //...` + `bazel test //...` nightly at 06:00 UTC.
      - name: Gate on changed paths
        id: gate
        if: github.event_name == 'push'
        env:
          BEFORE_REV: ${{ github.event.before }}
        run: bash tools/ci/relevant-paths.sh

      - name: Detect Butane-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            butane:
              - 'devx/dev-machine.template.bu'
              - '.github/workflows/ci.yaml'
      - name: Validate Butane template
        if: >-
          (github.event_name == 'push' && steps.gate.outputs.relevant != 'false') ||
          (github.event_name == 'merge_group' && steps.changes.outputs.butane != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.butane == 'true')
        working-directory: devx
        run: |
          CF_TUNNEL_TOKEN=dummy DEV_HOSTNAME=ci-test \
            envsubst < dev-machine.template.bu | \
            docker run --rm -i quay.io/coreos/butane:release --strict
