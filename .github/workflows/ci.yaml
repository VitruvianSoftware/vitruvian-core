name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter here: this job backs several required merge-queue
  # checks (build-test, build-macos, license-check, lint-naming, go-lint, go-test-infra,
  # go-race, validate-butane). `pull_request: branches: [main]` filters on the
  # PR's BASE branch, and a stacked PR (opened against another open PR's
  # branch, not main) has a non-main base -- so a base-branch filter here
  # meant these required checks silently never ran on any stacked PR, which
  # then merges anyway via `bypass_actors: RepositoryRole:always`. Matches
  # tidy-check.yaml / conformance-check.yaml, which never had this filter.
  pull_request:
  # Merge queue (#83): GitHub runs CI on the would-be-merged commit before it
  # fast-forwards main. Builds/tests the AFFECTED targets vs the queue base
  # (same engine + fail-safe //... fallbacks as presubmit); the scheduled
  # periodic-full-sweep.yaml is the whole-graph backstop.
  merge_group:

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: every job here only checks out and builds/tests
# (build-test, build-macos, license-check, lint-naming) -- none writes to the repo or API.
# Pin contents: read explicitly so the floor is independent of the repo/org
# default-permissions setting (which can change out from under the workflow).
permissions:
  contents: read

jobs:
  # Push to main only (#3418): did the merge queue already pass this workflow
  # on the exact code that just landed? The queue squash-merges, so main's
  # commit has the same tree its merge_group run tested, and a re-test could
  # only repeat that answer or trip over a flaky test. On a hit every other job
  # below is skipped, which GitHub reports as passing, so the run ends green
  # and notify-ci-issues has nothing to announce. Any doubt is a miss and the
  # run is the full run it always was: a direct push, a red or missing queue
  # run, a lookup error, or a change to a file the main-only Actions caches
  # are keyed on (see tools/ci/src/queue_fast_pass/lib.rs). If this job itself
  # fails, `hit` is empty and everything runs.
  #
  # On a pull request or in the queue this job is skipped without taking a
  # runner, and the `!cancelled()` on every job below lets them start at once.
  queued:
    name: queue-already-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.lookup.outputs.verdict == 'hit' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the tool's sources and the action that builds them are
          # needed; HEAD's tree hash comes with any checkout.
          sparse-checkout: |
            .github/actions/build-ci-tool
            tools/ci/src/queue_fast_pass
            tools/shell-compat
      # Built with the runner's rustc: this job sets up no Bazel. A failed
      # build leaves the lookup below with no binary, which is a miss.
      - name: Build the merge-queue lookup
        id: tool
        continue-on-error: true
        uses: ./.github/actions/build-ci-tool
        with:
          tool: queue_fast_pass
      - name: Did the merge queue already pass this exact code?
        id: lookup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: .github/workflows/ci.yaml
          PUSH_BEFORE: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          QUEUE_FAST_PASS_BIN: ${{ steps.tool.outputs.path }}
        run: |
          "$QUEUE_FAST_PASS_BIN" queued | tee "$RUNNER_TEMP/queued.out"
          {
            echo "### Already passed in the merge queue?"
            echo ""
            echo "- verdict: $(sed -n 's/^verdict=//p' "$RUNNER_TEMP/queued.out")"
            echo "- why: $(sed -n 's/^reason=//p' "$RUNNER_TEMP/queued.out")"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pull requests only, and only when the PR carries the `agent-fast-lane`
  # label (#3418, Step 2b): may this PR skip the heavy test and build jobs?
  # Yes only for a PR from a branch in this repository, opened by one of our
  # agent apps (checked by bot user id), with the label; see
  # tools/ci/src/agent_fast_lane/lib.rs. The merge queue still runs everything on the
  # exact code that lands, so main stays protected; the cost is measured as
  # queue failures on #3418. The fast checks (license-check, lint-naming here,
  # and the separate secret-scan, osv-scan, conformance, tidy and actionlint
  # workflows) never read this.
  #
  # It builds the rule from a checkout of the PR's BASE commit and reads the
  # agent roster from there too, so both come from main and a PR cannot
  # rewrite what lets it skip. Only the build action comes from the PR. Unlabelled
  # PRs, the merge queue and pushes skip this job without taking a runner. If
  # it fails, `skip` is empty and everything runs.
  fast-lane:
    name: agent-fast-lane
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'agent-fast-lane')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.verdict == 'fast' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/build-ci-tool
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: |
            tools/ci/src/agent_fast_lane
            tools/shell-compat
            tools/agent-app
      - name: Build the base commit's fast-lane rule
        id: rule
        continue-on-error: true
        uses: ./.github/actions/build-ci-tool
        with:
          tool: agent_fast_lane
          source-root: base
      - name: May this PR skip the heavy jobs?
        id: decide
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AGENTS_TSV: base/tools/agent-app/agents.tsv
          FAST_LANE_BIN: ${{ steps.rule.outputs.path }}
        run: |
          "$FAST_LANE_BIN" | tee "$RUNNER_TEMP/fast-lane.out"
          {
            echo "### Agent fast lane?"
            echo ""
            echo "- verdict: $(sed -n 's/^verdict=//p' "$RUNNER_TEMP/fast-lane.out")"
            echo "- why: $(sed -n 's/^reason=//p' "$RUNNER_TEMP/fast-lane.out")"
          } >> "$GITHUB_STEP_SUMMARY"

  build-test:
    # Release-bot PRs skip this job on the PR (#3268 follow-up). A release PR
    # only bumps versions and the changelog of code main already tested, and
    # the merge queue runs this job in full on the exact commit that lands, so
    # the PR-side run was the same ~5 min of work done twice. A skipped job
    # still satisfies the required check. Only the bot's own same-repo
    # release-please branches qualify; the merge_group and push lanes are
    # untouched.
    needs: [queued, fast-lane]
    if: >-
      ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' &&
          !(github.event_name == 'pull_request' &&
            startsWith(github.head_ref, 'release-please--') &&
            github.event.pull_request.user.type == 'Bot' &&
            github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # RBE auth for BuildBuddy (remote execution + cache on the Linux runner).
      # Endpoints come from the committed tools/remote.bazelrc (--config=remote);
      # the key is the BUILDBUDDY_API_KEY repo secret.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # SAFETY INVARIANT (issue #81): affected-target selection needs the PR
          # merge-base with origin/main present locally. The default shallow
          # fetch (depth 1) lacks it and would break target-determinator (and the
          # diff guard). Full history makes the merge-base + before-rev reliable;
          # target-determinator may also check the before-rev out into a temp
          # worktree, which needs the full object graph.
          fetch-depth: 0

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).
      - name: Gate on changed paths
        id: gate
        if: github.event_name != 'merge_group'
        uses: ./.github/actions/changed-paths-gate

      # Everything from here to the tripwire is setup for the affected-targets
      # step, so it carries the same condition that step does (#2841): always
      # on the merge queue, and on the other lanes unless the gate above proved
      # the diff is docs/gitops/markdown-only. The gate used to run AFTER this
      # setup, so a docs-only change freed disk, set up Bazel and restored the
      # 2.2 GiB LLVM toolchain (about a minute) and then skipped the build.

      # Free disk BEFORE any Bazel work -- see the free-disk-space composite
      # for the rationale (#404/#374 hit "No space left on device").
      - name: Free up runner disk space
        if: github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/free-disk-space

      - name: Set up Bazel
        if: github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/setup-bazel
      # Restore the extracted LLVM toolchain (#1039) and pair it with the
      # tripwire below -- see the llvm-cache-restore composite for the
      # rationale and how the toolchain folder is found (never pinned; #2456).
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        if: github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/llvm-cache-restore

      # Dependency map for the diff base (#2841). Presubmit's push lane computes
      # "which tests depend on each package" once per main commit and caches it
      # (#2465); restoring it here turns the planner's whole-repo `bazel query`
      # (6-11 min on this job) into a lookup. The key must be the SAME base the
      # script diffs against, so the PR lane resolves the merge-base first. No
      # map (cache miss, unresolvable base) is fine: the planner validates the
      # map against the base and falls back to the live query.
      - name: Resolve the diff base
        id: base
        if: github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) sha="$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null || true)" ;;
            merge_group)  sha="$MQ_BASE_SHA" ;;
            push)         sha="$PUSH_BEFORE" ;;
            *)            sha="" ;;
          esac
          echo "diff base: ${sha:-unresolved}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # The map for a commit appears 16-39 min after it lands, later than
          # the next queue entry needs it (#2841). Offer the base's recent
          # ancestors as fallbacks, nearest first; //tools/ci:affected_targets decides
          # whether an older map is safe to use and compares against its commit.
          keys=""
          if [ -n "$sha" ] && git rev-parse --verify --quiet "${sha}^{commit}" >/dev/null; then
            # actions/cache allows 10 keys in all: the exact one plus 9 here.
            keys="$(git rev-list --first-parent -n 10 "$sha" | tail -n +2 | sed 's/^/pipeline-rdeps-map-v1-/')"
          fi
          {
            echo "fallback_keys<<FALLBACK_KEYS_EOF"
            echo "$keys"
            echo "FALLBACK_KEYS_EOF"
          } >> "$GITHUB_OUTPUT"

      # First choice: the map kept under a git ref (//tools/ci:rdeps_map_ref).
      # The Actions cache below evicts maps within the hour while the repo is
      # over its 10 GiB budget (#2841); a ref is never evicted. The cache step
      # stays as the fallback, so nothing is lost if the ref is not there.
      - name: Fetch the dependency map kept under a git ref
        id: mapref
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cache_flags=()
          if [ -n "${BUILDBUDDY_API_KEY:-}" ]; then
            cache_flags=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel build "${cache_flags[@]}" //tools/ci:rdeps_map_ref
          cp -f bazel-bin/tools/ci/rdeps_map_ref "$RUNNER_TEMP/rdeps-map-ref"
          chmod +x "$RUNNER_TEMP/rdeps-map-ref"
          git checkout -- MODULE.bazel.lock 2>/dev/null || true
          "$RUNNER_TEMP/rdeps-map-ref" fetch "$RUNNER_TEMP/pipeline-rdeps-map.json" "$BASE_SHA"

      # continue-on-error: the map is only ever a speed-up, so a cache problem
      # here must not fail a required check; the script copes with no map.
      - name: Restore the dependency map for the diff base
        if: steps.base.outputs.sha != '' && steps.mapref.outputs.commit == ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pipeline-rdeps-map.json
          key: pipeline-rdeps-map-v1-${{ steps.base.outputs.sha }}
          restore-keys: ${{ steps.base.outputs.fallback_keys }}

      # Build the planner to a standalone binary with `bazel build`
      # (--config=remotecache-ci), as Presubmit's plan job does. If this build
      # fails the script falls back to `bazel run`, so it can only cost time.
      - name: Build the planner
        if: github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false'
        run: |
          cache_flags=()
          if [ -n "${BUILDBUDDY_API_KEY:-}" ]; then
            cache_flags=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          if bazel build "${cache_flags[@]}" //tools/pipeline/plan && cp -f bazel-bin/tools/pipeline/plan/plan "$RUNNER_TEMP/pipeline-plan" && chmod +x "$RUNNER_TEMP/pipeline-plan"; then
            git checkout -- MODULE.bazel.lock 2>/dev/null || true
          else
            echo "::warning::Could not build the planner; affected-targets will use bazel run instead."
            git checkout -- MODULE.bazel.lock 2>/dev/null || true
            rm -f "$RUNNER_TEMP/pipeline-plan"
          fi

      # The selector itself, //tools/ci:affected_targets, copied out of bazel-bin:
      # it runs `bazel` itself, so it must not run under `bazel run`. Unlike the
      # planner this one is required, so a failed build fails the job.
      - name: Build affected-targets
        if: github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false'
        run: |
          cache_flags=()
          if [ -n "${BUILDBUDDY_API_KEY:-}" ]; then
            cache_flags=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel build "${cache_flags[@]}" //tools/ci:affected_targets
          cp -f bazel-bin/tools/ci/affected_targets "$RUNNER_TEMP/affected-targets"
          chmod +x "$RUNNER_TEMP/affected-targets"
          test -x "$RUNNER_TEMP/affected-targets" || { echo "::error::the affected-targets binary was not built"; exit 1; }
          # A build can rewrite the lockfile; a dirty MODULE.bazel.lock would
          # read as a global-impact change and force a full sweep.
          git checkout -- MODULE.bazel.lock 2>/dev/null || true

      # --- ALL LANES: AFFECTED targets, fall back to //... on any doubt. ------
      # Every lane runs the affected-targets binary; only the diff BASE differs:
      #   pull_request  merge-base vs origin/${{ github.base_ref }}
      #   merge_group   the queue base (github.event.merge_group.base_sha) --
      #                 exactly the main tip this group would land on
      #   push (main)   the pre-push tip (github.event.before); forced pushes
      #                 full-sweep (FORCED_PUSH) since history was rewritten
      # All the logic (global-impact guard -> //..., target-determinator,
      # empty-set skip, build-then-build_tests_only, tolerate exit 4) lives in
      # the committed helper so it is reviewable and testable. Any error or
      # uncertainty inside it falls back to a full //... build+test, so no lane
      # is ever less safe than a full sweep.
      #
      # SAFETY PAIRING: the whole-graph correctness backstop for affected
      # selection is the scheduled periodic-full-sweep.yaml (nightly //...,
      # files a P0 issue on red). `bazel run //tools/conformance:check` FAILS if
      # that workflow disappears while these lanes are affected-scoped -- do not
      # remove one without the other.

      # PRESUBMIT (pull_request). Additionally gated on the changed-paths
      # result: skipped (job still green) when the PR is docs/gitops/markdown-
      # only; fails safe to running whenever the gate is uncertain.
      - name: Build + test affected targets (PR)
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
          RDEPS_MAP: ${{ runner.temp }}/pipeline-rdeps-map.json
          PLAN_BIN: ${{ runner.temp }}/pipeline-plan
        run: ${{ runner.temp }}/affected-targets

      # MERGE QUEUE (merge_group). base_sha is reachable because the checkout
      # above uses fetch-depth: 0 (build-macos already relies on the same).
      - name: Build + test affected targets (merge queue)
        if: github.event_name == 'merge_group'
        env:
          BEFORE_REV: ${{ github.event.merge_group.base_sha }}
          RDEPS_MAP: ${{ runner.temp }}/pipeline-rdeps-map.json
          PLAN_BIN: ${{ runner.temp }}/pipeline-plan
        run: ${{ runner.temp }}/affected-targets

      # POSTSUBMIT (push to main). Verifies the landed commit. A queue-merged
      # commit whose exact tree just passed as merge_group never gets here: the
      # `queued` job skips this whole job (#3418). What does get here is a
      # direct push, a commit the queue did not pass, or a change to a file
      # the main-only caches are keyed on.
      # event.before is the zero SHA on ref creation -> script full-sweeps.
      # Additionally gated on relevant-paths: docs-only pushes skip the heavy
      # work (the nightly full sweep is the backstop).
      - name: Build + test affected targets (push to main)
        if: github.event_name == 'push' && steps.gate.outputs.relevant != 'false'
        env:
          BEFORE_REV: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          RDEPS_MAP: ${{ runner.temp }}/pipeline-rdeps-map.json
          PLAN_BIN: ${{ runner.temp }}/pipeline-plan
        run: ${{ runner.temp }}/affected-targets

  # macOS build, split so a premium macOS runner is claimed ONLY when a macOS-
  # relevant path actually changed (#821). Previously the whole build-macos job
  # ran on macos-latest and claimed a macOS runner on every PR/merge_group just
  # to run a path filter and then no-op. Three jobs now:
  #   detect-macos (Linux) -- cheap path filter; decides if the build is needed.
  #   macos-build  (macOS) -- the actual build; the ONLY macOS-runner claim.
  #   build-macos  (Linux) -- the REQUIRED merge-queue check; always reports and
  #                           reflects macos-build's result.
      # Tripwire -- see the llvm-cache-tripwire composite for the rationale
      # (hardened per review on #1304 after a placement-bug incident).
      - name: LLVM cache tripwire
        if: always() && (github.event_name == 'merge_group' || steps.gate.outputs.relevant != 'false')
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  detect-macos:
    needs: [queued, fast-lane]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.changes.outputs.macos }}
      # Push lane only: 'false' when the whole diff is docs/gitops/markdown, so
      # macos-build can decline to claim a macOS runner for a change that
      # provably cannot affect it. Empty on PR/merge_group (falsy -> no effect).
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need history so the path filter can diff against the merge-base.
          fetch-depth: 0
      # dorny/paths-filter does a cheap name-only diff and never fails the job;
      # it only decides whether macos-build runs. Skipped on push (the postsubmit
      # floor always builds), so outputs.macos is empty there and macos-build's
      # own `push` branch triggers the build.
      # Postsubmit docs/gitops-only skip. detect-macos deliberately skips its
      # path filter on push (the postsubmit floor always built), which meant a
      # one-line gitops digest bump claimed a macOS runner and built the app:
      # 156s on 69436a56. Decide it HERE, on the cheap ubuntu gatekeeper, rather
      # than after the macOS runner is already claimed. Fails safe -- see
      # tools/ci/src/relevant_paths/lib.rs; the nightly full sweep is unchanged.
      - name: Gate on changed paths (push lane)
        id: gate
        if: github.event_name == 'push'
        uses: ./.github/actions/changed-paths-gate

      - name: Detect macOS-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # merge_group: diff the queued commit against the base the queue is
          # merging onto (base_sha is reachable because fetch-depth: 0 fetched
          # the full history above).
          #
          # PR: deliberately EMPTY. paths-filter ignores `base` entirely on a
          # pull_request event -- it diffs the PR against its own base via the
          # API -- and warns for any non-empty value ("'base' input parameter is
          # ignored when action is triggered by pull request event"). Passing
          # github.base_ref here changed nothing but put a warning annotation on
          # every path-gated job of every PR run, 8 per run. Empty is falsy, so
          # the action takes the identical code path without the annotation.
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            macos:
              - 'apps/desktop/nexus-agent/**'
              - 'apps/desktop/home-speaker/**'
              - 'packages/peripherals/**'
              - 'apps/mobile/android-remote/macmenu/**'
              # The pinned Xcode: a bump changes every Swift build.
              - '.xcode-version'
              - '.github/actions/select-xcode/**'
              # ALL of tools/** -- the Apple CC toolchain + platforms live here,
              # and .bazelrc `import`s tools/preset.bazelrc, tools/java17.bazelrc
              # and tools/remote.bazelrc, any of which can change the .app build.
              - 'tools/**'
              # .bazelrc defines --config=macos-app; .bazelversion pins the
              # toolchain version; global build config -- rebuild on these too.
              - '.bazelrc'
              - '.bazelversion'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.github/workflows/ci.yaml'

  macos-build:
    # The ONLY job that needs a macOS runner, so the ONLY place one is claimed.
    # Runs: always on push (postsubmit floor); on merge_group UNLESS the filter is
    # sure nothing macOS-relevant changed (filter uncertainty -> build, failing
    # safe); on a PR only when the filter matched. When it does not run it is
    # `skipped`, which build-macos treats as a pass. Not a required check itself.
    # A release-bot PR never builds here: the merge queue builds the exact
    # commit that lands (see build-test).
    #
    # The explicit `needs.detect-macos.result == 'success'` is what the implicit
    # success() used to give. It has to be spelled out now that `queued` sits
    # upstream: on a pull request `queued` is skipped, and an implicit
    # success() looks at every job up the chain, so it would skip this job
    # too, although detect-macos ran.
    needs: [queued, fast-lane, detect-macos]
    if: >-
      ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && needs.detect-macos.result == 'success' && (
      (github.event_name == 'push' && needs.detect-macos.outputs.relevant != 'false') ||
      (github.event_name == 'merge_group' && needs.detect-macos.outputs.macos != 'false') ||
      (github.event_name == 'pull_request' && needs.detect-macos.outputs.macos == 'true' &&
       !(startsWith(github.head_ref, 'release-please--') &&
         github.event.pull_request.user.type == 'Bot' &&
         github.event.pull_request.head.repo.full_name == github.repository))) }}
    # xcode-27: GitHub's macOS 27 image, which ships Xcode 27.0 (build 27A266a),
    # 27.1 (27A9275, the image default) and 27.2 (27B48); select-xcode picks the
    # one pinned in .xcode-version (currently 27.0, deliberately below the
    # image's newest Xcode). The pin cannot follow 27.2 yet: the image's OS is
    # 27.0.1 and Xcode 27.2 ships only the macosx27.2 SDK, so a 27.2-built
    # XCTest aborts in dyld on the runner ("built for macOS 27.2 which is newer
    # than running OS" -- PR #4068). Bump the pin when the image runs
    # macOS >= 27.2.
    # macos-latest (macOS 26) only has Xcode 26.x, whose Swift rejected
    # code that 27.0 compiles (#2536).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # The premium macOS runner was the one Bazel lane with NO action cache at
      # all (setup-bazel gives only bazelisk + repository caches, which are
      # DOWNLOAD caches). --config=remotecache-ci adds the BuildBuddy remote action
      # cache and async BES but sets NO --remote_executor, so execution stays
      # LOCAL -- mandatory here, since the Apple toolchain cannot run on the
      # Linux RBE workers, and outputs stay materialised for the objc link and
      # XCTest run. The cache is self-warming: this job runs on every push to
      # main, so a nexus-agent PR branched off recent main pulls most unchanged
      # Swift/objc outputs instead of recompiling them. Content-addressed, so
      # macOS action digests only ever hit from prior macOS runs; a cache error
      # falls back to local execution (never slower, never incorrect).
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # --config=macos-app activates Apple's CC toolchain (needed for the
      # objc-executable link). NexusAgent (macos_application) carries
      # tags=["manual"], so the wildcard skips it -- build it explicitly by
      # label. The wildcard still builds the rest of nexus-agent (Swift lib,
      # Node bridge, hooks) on macOS.
      #
      # The remote cache is only wired when the key is present: a fork PR has no
      # secret, and passing an empty --remote_header would fail the build rather
      # than degrade to local.
      - name: Build macOS app
        run: |
          cache=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          else
            echo "::notice::no BuildBuddy key (fork PR?) -- building without the remote cache."
          fi
          bazel build "${cache[@]}" --config=macos-app //apps/desktop/nexus-agent/... //apps/desktop/nexus-agent/macos:NexusAgent
          # Swift unit tests (VersionCompare etc.) -- macos-only + manual, so run
          # by explicit label here where Xcode/XCTest is available (#807).
          # app_holds_mermaid_test opens the NexusAgent archive built just
          # above and fails when the copy of Mermaid its diagrams draw with is
          # missing; here, not in the nexus-agent-macos unit, because this is
          # the job that builds the app.
          bazel test "${cache[@]}" --config=macos-app //apps/desktop/nexus-agent/macos:NexusAgentTests //apps/desktop/nexus-agent/macos:app_holds_mermaid_test

          # home-speaker build, unit tests & packaging validation
          bazel build "${cache[@]}" --config=macos-app //apps/desktop/home-speaker/... //apps/desktop/home-speaker:HomeSpeaker
          bazel test "${cache[@]}" --config=macos-app //apps/desktop/home-speaker:HomeSpeakerTests
          # The Bitwarden -> HomeSpeaker secrets sync, against a fake `bw`.
          # `bazel build .../...` above compiles it but never RUNS it.
          bazel test "${cache[@]}" --config=macos-app //apps/desktop/home-speaker:sync_secrets_test
          # The HomeSpeaker tool for the Vitruvian app: its tests, the built
          # folder through the conformance script, and the release's zip of
          # it. All `manual`, so named here.
          bazel test "${cache[@]}" --config=macos-app //apps/desktop/home-speaker:HomeSpeakerToolTests //apps/desktop/home-speaker:tool_conformance_test //apps/desktop/home-speaker:tool_version_test //apps/desktop/home-speaker:zip_tool_test
          # Release packaging, under the bash the release runner uses. A Mac's
          # /bin/bash is 3.2, where an empty array under `set -u` ends a script
          # and an EXIT trap can turn that into exit 0: HomeSpeaker 1.12.0 and
          # 1.13.0 shipped with no files that way, and the dry run below was
          # green throughout. The Linux lane runs these two tests as well, but
          # its bash is too new to hit the case; REQUIRE_BASH32=1 makes them
          # fail here if they ever stop finding a bash 3.
          bazel test "${cache[@]}" --config=macos-app --test_env=REQUIRE_BASH32=1 //tools/desktop-package:package-desktop_test //apps/desktop/home-speaker:publish_test
          # The whole of it for real (SwiftPM build, codesign, hdiutil), short
          # of uploading. publish fails unless every artifact is in dist.
          bazel run "${cache[@]}" //apps/desktop/home-speaker:publish -- --dry-run

          # Vitruvian Remote menu bar app: the .app bundle is `manual`, so build
          # it by label. Its tests run in the generated remote-mac-menu unit.
          bazel build "${cache[@]}" --config=macos-app //apps/mobile/android-remote/macmenu:VitruvianRemote
          # The release's tool zip for the Vitruvian catalog, short of
          # uploading: both architectures built, joined, signed ad hoc and
          # zipped, as android-remote-release.yaml does. Otherwise the Intel
          # build would first run on release day. Uses the job's BuildBuddy
          # key itself, like the release.
          bazel run "${cache[@]}" //apps/mobile/android-remote/macmenu:publish-tool -- --dry-run

          # Vitruvian desktop app (GPL fork, apps/desktop/vitruvian): build only.
          # Changes to the app itself are built AND tested by the generated
          # vitruvian-desktop-macos presubmit unit, so its path is deliberately
          # not in the detect-macos filter (that would compile it twice per PR).
          # This line covers what the unit's planner does not: an Xcode or
          # toolchain bump (.xcode-version, tools/**) and the push-to-main run
          # that warms the remote cache for the unit.
          bazel build "${cache[@]}" --config=macos-app //apps/desktop/vitruvian:Vitruvian

  build-macos:
    # REQUIRED merge-queue check. Runs on cheap Linux and ALWAYS reports (so the
    # queue never wedges), reflecting macos-build's result: pass when the build
    # SUCCEEDED or was correctly SKIPPED (no macOS-relevant change), fail when it
    # failed/was cancelled. This keeps the macOS-runner claim off the majority of
    # PRs that touch no macOS path (#821) WITHOUT the skipped-required-check
    # ambiguity this repo avoids -- the required job itself always runs + reports.
    needs: [queued, fast-lane, detect-macos, macos-build]
    if: ${{ always() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Reflect the macOS build result
        env:
          DETECT_RESULT: ${{ needs.detect-macos.result }}
          MACOS_RESULT: ${{ needs.macos-build.result }}
        run: |
          echo "detect-macos=${DETECT_RESULT}  macos-build=${MACOS_RESULT}"
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect-macos ${DETECT_RESULT} -- cannot determine macOS relevance; refusing to green build-macos."
            exit 1
          fi
          case "$MACOS_RESULT" in
            success|skipped) echo "macOS build OK (${MACOS_RESULT})." ;;
            *) echo "::error::macOS build ${MACOS_RESULT}." ; exit 1 ;;
          esac

  license-check:
    # Whole-repo MIT license-header check, now hermetic via Bazel. The addlicense
    # binary + the ignore set both live in //tools/license (BUILD.bazel), so the
    # check runs identically here and locally (`bazel run //tools/license:check`);
    # `bazel run //tools/license:add` fixes missing headers. Generated/tool-managed
    # files are ignored there (BUILD = gazelle, lockfiles, baselines, etc.).
    needs: queued
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate below diffs against the merge-base / before-rev.
          fetch-depth: 0
      # Deliberately UNGATED and ahead of the changed-paths gate: it is a few
      # seconds of pure bash with no Bazel, and it guards the verifier that this
      # required check's verdict rests on. A silent hole in :verify (see the
      # SIGPIPE case the test pins) is invisible in every other lane.
      - name: Self-test the license verifier
        run: |
          set -euo pipefail
          rustc --test --edition 2021 --crate-name license_verify tools/license/src/lib.rs -o "$RUNNER_TEMP/license_verify_test"
          "$RUNNER_TEMP/license_verify_test"
      # This was the last heavy Bazel lane with NO changed-paths gate, so a
      # docs-only PR still paid the full ~3min LLVM toolchain fetch here after
      # build-test/tidy-check/conformance-check had all already short-circuited.
      # Same run-then-noop-green shape as those lanes: the JOB always runs and
      # reports (it is a REQUIRED check -- skipping it would wedge the queue
      # "pending"), only the Bazel steps are gated.
      #
      # ignore-regex is deliberately NARROWER than the script default, which
      # also treats gitops/ as inert. addlicense does not ignore gitops/ (those
      # manifests carry MIT headers today) and //tools/license:{check,verify}
      # are `bazel run` binaries, so `bazel test //...` and
      # the nightly periodic-full-sweep never cover them (the self-test step
      # above is what covers :verify). Treating gitops/ as
      # skippable here would let an unlicensed gitops file dodge a required
      # check with no backstop. docs/ and *.md ARE inert: addlicense ignores
      # **/docs/** and never headers markdown, and :verify only scans source
      # extensions.
      - name: Gate on changed paths
        id: gate
        uses: ./.github/actions/changed-paths-gate
        with:
          ignore-regex: '^docs/|\.md$'
      - name: Set up Bazel
        if: steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/setup-bazel
      - name: Check license headers present (whole repo)
        if: steps.gate.outputs.relevant != 'false'
        run: |
          cache=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel run "${cache[@]}" //tools/license:check
      # addlicense -check above is PRESENCE-only (an Apache header with a wrong
      # holder passes it). This CONTENT gate enforces MIT + VitruvianSoftware in
      # every first-party LICENSE and any source header present (issue #457).
      - name: Verify license content is MIT + VitruvianSoftware
        if: steps.gate.outputs.relevant != 'false'
        run: |
          cache=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel run "${cache[@]}" //tools/license:verify

  lint-naming:
    # Zero-tolerance naming convention enforcement across all monorepo assets
    # (Go, Python, TypeScript, React, Shell, Starlark, Pulumi, workflows, and directories).
    # Runs the hermetic Bazel test harness and verifies 0 naming violations monorepo-wide.
    needs: queued
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Bazel test naming linter harness
        run: |
          cache=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel test "${cache[@]}" //tools/lint-naming:lint-naming_test

  changes:
    # Decides ONCE, on one runner, whether each small path-gated job below has
    # any work to do. Those jobs then skip at the JOB level when they do not,
    # so they never take a runner at all.
    #
    # Why: every one of them used to start its own runner, check out the whole
    # history, run a path filter and, on most changes, do nothing. On release
    # PRs those jobs did 0.3 min of work after waiting a median 2.3 min (p90
    # 7.6 min) for a free runner: the account's concurrent-job cap is shared by
    # every PR, the merge queue and main, so idle checks queued ahead of real
    # work. Measured over 60 release PRs, 2026-09-14..10-14.
    #
    # A job skipped by its `if:` still satisfies a required check: GitHub
    # reports it as passing. The wedge that leaves a required check "pending"
    # is a workflow-level `paths:`/`branches:` filter (the workflow never
    # starts) or a skipped MATRIX job (its name is never expanded, so
    # "go-lint (devx)" is never reported). Neither applies here: this
    # workflow always starts, and go-lint is two literal jobs, not a matrix.
    #
    # Fails SAFE, two ways:
    #   - each decision below keeps the exact rule its job used inline before
    #     (a PR runs on a positive match, the merge queue runs unless the
    #     filter is CERTAIN nothing relevant changed, push runs unless the
    #     change is docs/gitops-only);
    #   - every dependent job runs in full when this job did not succeed
    #     (`needs.changes.result != 'success'`), so a broken decision costs
    #     runner time, never coverage.
    #
    # The postsubmit gate (changed-paths-gate) FAILS SAFE too: any missing or
    # uncomputable diff base yields relevant=true. The whole-graph floor is
    # unchanged -- periodic-full-sweep.yaml still runs `bazel build //...` +
    # `bazel test //...` nightly.
    needs: [queued, fast-lane]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      go-lint-devx: ${{ steps.decide.outputs.go-lint-devx }}
      go-lint-homelab: ${{ steps.decide.outputs.go-lint-homelab }}
      go-test-infra: ${{ steps.decide.outputs.go-test-infra }}
      go-race: ${{ steps.decide.outputs.go-race }}
      example-build: ${{ steps.decide.outputs.example-build }}
      validate-butane: ${{ steps.decide.outputs.validate-butane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge_group diffs need the base_sha reachable locally, and the push
          # gate diffs against github.event.before.
          fetch-depth: 0
      # Postsubmit docs/gitops-only skip (mirrors build-test). Measured on
      # 69436a56 (ONE line of gitops/argocd/platform/buzz/values.yaml):
      # example-build 452s + macos-build 156s + go-race 144s = 12.5 min of
      # runner time that the diff provably cannot affect.
      - name: Gate on changed paths
        id: gate
        if: github.event_name == 'push'
        uses: ./.github/actions/changed-paths-gate

      # One filter per job. Each keeps the job's own list, plus this workflow.
      - name: Detect what each job needs
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            devx:
              - 'apps/cli/devx/**'
              - '.github/workflows/ci.yaml'
            homelab:
              - 'apps/cli/homelab/**'
              - '.github/workflows/ci.yaml'
            iac:
              - 'infrastructure/pulumi/**'
              - '*/infra/**'
              - '.github/workflows/ci.yaml'
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'MODULE.bazel'
              - '.bazelrc'
              - '.github/workflows/ci.yaml'
            ex:
              - 'packages/pulumi/examples/go-foundation/**'
              - 'packages/pulumi/library/**'
              - '.github/workflows/ci.yaml'
            butane:
              - 'apps/cli/devx/dev-machine.template.bu'
              - '.github/workflows/ci.yaml'

      - name: Decide which jobs run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEVANT: ${{ steps.gate.outputs.relevant }}
          DEVX: ${{ steps.filter.outputs.devx }}
          HOMELAB: ${{ steps.filter.outputs.homelab }}
          IAC: ${{ steps.filter.outputs.iac }}
          GO: ${{ steps.filter.outputs.go }}
          EX: ${{ steps.filter.outputs.ex }}
          BUTANE: ${{ steps.filter.outputs.butane }}
        run: |
          set -u
          # The rule each job used inline before this job existed. Anything
          # unexpected (an unknown event, an empty filter output in the queue)
          # answers "run".
          want() {
            case "$EVENT_NAME" in
              push)         [ "$RELEVANT" != "false" ] ;;
              merge_group)  [ "$1" != "false" ] ;;
              pull_request) [ "$1" = "true" ] ;;
              *)            true ;;
            esac
          }
          say() { if want "$2"; then v=true; else v=false; fi; echo "$1=$v" | tee -a "$GITHUB_OUTPUT"; }
          say go-lint-devx "$DEVX"
          say go-lint-homelab "$HOMELAB"
          say go-test-infra "$IAC"
          say example-build "$EX"
          say validate-butane "$BUTANE"
          # go-race keeps its own rule: push (unless docs/gitops-only), or any
          # Go change on a PR or in the queue.
          race=false
          if [ "$EVENT_NAME" = "push" ] && [ "$RELEVANT" != "false" ]; then race=true; fi
          if [ "$GO" = "true" ]; then race=true; fi
          case "$EVENT_NAME" in push|pull_request|merge_group) ;; *) race=true ;; esac
          echo "go-race=$race" | tee -a "$GITHUB_OUTPUT"

  # Authoritative golangci-lint for the Go apps exported to standalone mirrors.
  # aspect_rules_lint has no golangci-lint aspect, and the per-app mirror CI is
  # being retired (the monorepo is the single CI authority), so Go lint runs
  # here per module -- standalone (GOWORK=off), exactly as it lints in its
  # mirror today.
  #
  # Two literal jobs, not a matrix: a matrix job skipped by its `if:` reports
  # the unexpanded name "go-lint (${{ matrix.module }})", so the required
  # checks "go-lint (devx)" / "go-lint (homelab)" would never report and the
  # queue would wedge. Keep the two jobs identical apart from the module.
  go-lint-devx:
    name: go-lint (devx)
    needs: [queued, fast-lane, changes]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.go-lint-devx == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/devx/go.mod
          # setup-go keys its module/build cache on a dependency file, defaulting
          # to a go.sum at the REPO ROOT. With GOWORK=off these are standalone
          # modules whose go.sum lives under <module>/, so the default key missed
          # and the cache never restored.
          cache-dependency-path: apps/cli/devx/go.sum
      - name: golangci-lint (devx)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.1
          working-directory: apps/cli/devx

  go-lint-homelab:
    name: go-lint (homelab)
    needs: [queued, fast-lane, changes]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.go-lint-homelab == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rustc test (homelab)
        run: |
          set -euo pipefail
          rustc --edition 2021 --test apps/cli/homelab/rs/src/lib.rs -o "$RUNNER_TEMP/homelab_test"
          (cd apps/cli/homelab && "$RUNNER_TEMP/homelab_test")

  go-test-infra:
    # Go tests for the IaC programs (infrastructure/pulumi/** and <app>/infra/**).
    #
    # These had NO test lane at all. They are outside go.work, the `go-test`
    # matrix above covers only devx/homelab, and `pulumi_project` emits just
    # `bazel run` wrappers -- no go_test target -- so `bazel test //...` never
    # saw them either. Tests written for these programs were therefore DEAD:
    # they compiled on a developer's laptop and never executed in CI.
    #
    # That was not hypothetical. The floating-project toggle regression guard
    # (modules/base_env, added with the bu2 rollout) had never once run.
    #
    # Modules are discovered rather than listed so a new app's infra is covered
    # the day it lands, and only modules that actually contain a _test.go are
    # run -- `go test ./...` in a module with no tests is a slow no-op. GOWORK
    # is off because these modules are deliberately not workspace members.
    needs: [queued, fast-lane, changes]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.go-test-infra == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Cache module downloads across runs, keyed on every IaC module's own
          # go.sum. Without this, setup-go's default cache-dependency-path
          # assumes a single go.sum at the repo root (same gap go-lint above
          # already had to work around) -- which isn't any of these ~40
          # GOWORK=off modules, so the cache key never matched their actual
          # dependencies and every run re-downloaded the full graph from
          # proxy.golang.org from scratch. That's most of why a transient
          # proxy hiccup shows up here so often (#1596): a cache hit skips the
          # network entirely for a module whose deps haven't changed.
          cache-dependency-path: |
            infrastructure/pulumi/**/go.sum
            */infra/**/go.sum
      - name: Build //tools/ci:go_test_with_retry (no Bazel on this job)
        id: go-test-bin
        uses: ./.github/actions/build-ci-tool
        with:
          tool: go_test_with_retry
          deps: transient_lib

      - name: go test (IaC modules with tests)
        env:
          GO_TEST_WITH_RETRY: ${{ steps.go-test-bin.outputs.path }}
        run: |
          set -euo pipefail
          "$GO_TEST_WITH_RETRY"

  go-race:
    # Race detector over EVERY Bazel go_test target (72 today).
    #
    # Until this lane existed, race coverage came only from the `go-test` matrix
    # above -- standalone `go test -race` over exactly two modules, devx and
    # homelab. Every other Go target in the repo, including all of tabula's, had
    # never been race-tested anywhere. `bazel test` does not enable -race (there
    # was no race config in any bazelrc), which the go-test job's own comment
    # noted without closing.
    #
    # Its own job, not a flag on build-test: `--@rules_go//go/config:race` is a
    # build-configuration change ("Build option ... has changed, discarding
    # analysis cache"), so folding it into the default lane would thrash that
    # cache on every non-race build. A separate runner pays the analysis once.
    #
    # Verified the flag genuinely arms the detector rather than being silently
    # accepted: a deliberately racy test PASSED without it and FAILED with
    # "WARNING: DATA RACE" with it. Measured 83s for all 72 targets.
    #
    # Skips at the job level when `changes` says there is no Go to race-test
    # (a skipped job still satisfies the required check; see `changes`).
    needs: [queued, fast-lane, changes]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.go-race == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      # Restore the extracted LLVM toolchain (#1039) and pair it with the
      # tripwire below -- see the llvm-cache-restore composite for the
      # rationale and how the toolchain folder is found (never pinned; #2456).
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: ./.github/actions/llvm-cache-restore
      - name: Race-test all Go targets
        run: |
          set -euo pipefail
          # Only go_test targets: race instruments Go, and sweeping //... here
          # would duplicate build-test's work in a second configuration.
          bazel query 'kind(go_test, //...)' > /tmp/go-tests.txt
          count="$(wc -l < /tmp/go-tests.txt | tr -d ' ')"
          if [ "${count}" -eq 0 ]; then
            echo "::error::no go_test targets found — refusing to report green on an empty race run."
            exit 1
          fi
          echo "race-testing ${count} go_test target(s)"
          # A pattern file makes every target explicit, and Bazel errors on an
          # explicit target this Linux runner cannot build (cgo against a
          # macOS-only library, e.g. Courier's gchat). Skip those; they are
          # race-tested on the macOS lane.
          bazel test --config=race --config=remote \
            --skip_incompatible_explicit_targets \
            --remote_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY}" \
            --target_pattern_file=/tmp/go-tests.txt

      # Tripwire -- see the llvm-cache-tripwire composite for the rationale
      # (hardened per review on #1304 after a placement-bug incident).
      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  example-build:
    # The go-foundation EXAMPLE (pulumi/examples/go-foundation) is a reference
    # users copy. Its Go is otherwise compiled ONLY in its downstream copybara
    # mirror, so a change here that breaks it (e.g. #1097 broke the app-infra
    # example leaf while this repo's CI stayed green) was invisible until the
    # mirror re-ran. This compiles every example module IN THE SOURCE REPO.
    #
    # Own job (not folded into go-test-infra) + generous timeout because it is
    # ~27 standalone modules each pulling the Pulumi SDK; runs only when the
    # example -- or a library it consumes -- actually changes (see `changes`).
    needs: [queued, fast-lane, changes]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.example-build == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Runs BEFORE the build, because it is the same failure with a usable
      # error message. The examples `replace` the library with a local path but
      # pin their own copy of its transitive graph, and Dependabot tidies only
      # the module it bumps -- so a library bump desyncs them and `go build`
      # reports the contextless "go: updates to go.mod needed; to update it: go
      # mod tidy", naming no module, no dependency and no PR. (#1166/#1175/#1179
      # each burned a diagnosis on that.) This names the module, prints the
      # diff, and gives the command that fixes it. Read-only: `go mod tidy
      # -diff` never writes, so this cannot dirty the tree it is checking.
      - name: Assert example/library module pins are in sync
        run: |
          set -euo pipefail
          # //tools/gomod:check, with the shared transient-error classifier
          # //tools/ci:transient_lib. //tools/ci:workflow_rustc_test runs these lines.
          rustc --edition 2021 -O --crate-type lib --crate-name transient_lib tools/ci/src/transient_lib/lib.rs -o "$RUNNER_TEMP/libtransient_lib.rlib"
          rustc --edition 2021 -O --crate-type lib --crate-name gomod_lib tools/gomod/src/lib.rs -L "$RUNNER_TEMP" --extern transient_lib="$RUNNER_TEMP/libtransient_lib.rlib" -o "$RUNNER_TEMP/libgomod_lib.rlib"
          rustc --edition 2021 -O tools/gomod/src/main.rs -L "$RUNNER_TEMP" --extern gomod_lib="$RUNNER_TEMP/libgomod_lib.rlib" -o "$RUNNER_TEMP/tidy"
          "$RUNNER_TEMP/tidy" --check

      - name: go build (every example module)
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            n=$((n + 1))
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done < <(find packages/pulumi/examples/go-foundation -name go.mod -not -path '*/vendor/*' | sort)
          echo "compiled $n example module(s)"

  validate-butane:
    # devx's Fedora CoreOS Butane template must render to valid Ignition. There
    # is no Bazel target for this -- it is a devx-specific check ported verbatim
    # from the retired devx mirror CI so the coverage is not lost. Its only
    # in-tree input is the template itself -- the envsubst vars are dummies and
    # butane comes from a container image -- so `changes` gates it on exactly
    # that file (plus this workflow).
    needs: [queued, fast-lane, changes]
    if: ${{ !cancelled() && needs.queued.outputs.hit != 'true' && needs.fast-lane.outputs.skip != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.validate-butane == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Butane template
        working-directory: apps/cli/devx
        run: |
          CF_TUNNEL_TOKEN=dummy DEV_HOSTNAME=ci-test \
            envsubst < dev-machine.template.bu | \
            docker run --rm -i quay.io/coreos/butane:release --strict
