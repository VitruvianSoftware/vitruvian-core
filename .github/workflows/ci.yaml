name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue (#83): GitHub runs CI on the would-be-merged commit before it
  # fast-forwards main. Builds/tests the AFFECTED targets vs the queue base
  # (same engine + fail-safe //... fallbacks as presubmit); the scheduled
  # periodic-full-sweep.yaml is the whole-graph backstop.
  merge_group:

# Cancel a PR's in-flight CI when it is superseded by a newer push to the same
# PR. NEVER cancels push-to-main or merge_group runs (their results gate/verify
# what lands on main): cancellation is gated on the pull_request event, and
# push / merge_group runs key into their own (non-cancelling) ref groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: every job here only checks out and builds/tests
# (build-test, build-macos, license-check) -- none writes to the repo or API.
# Pin contents: read explicitly so the floor is independent of the repo/org
# default-permissions setting (which can change out from under the workflow).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # RBE auth for BuildBuddy (remote execution + cache on the Linux runner).
      # Endpoints come from the committed tools/remote.bazelrc (--config=remote);
      # the key is the BUILDBUDDY_API_KEY repo secret.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SAFETY INVARIANT (issue #81): affected-target selection needs the PR
          # merge-base with origin/main present locally. The default shallow
          # fetch (depth 1) lacks it and would break target-determinator (and the
          # diff guard). Full history makes the merge-base + before-rev reliable;
          # target-determinator may also check the before-rev out into a temp
          # worktree, which needs the full object graph.
          fetch-depth: 0

      # Free disk BEFORE any Bazel work. PR #404 hit "No space left on device"
      # fetching the LLVM/clang-format toolchain (//tools/format) during a full
      # //... sweep; #374 saw the same. Reclaim large preinstalled SDKs this build
      # never touches (~13GB), mirroring the tabula-e2e lane, so the full //...
      # sweep that any lane can still fall back to (global-impact changes, any
      # affected-selection uncertainty) has headroom. Runs on every event.
      #
      # Do NOT remove /usr/local/lib/android: rules_android (in the module graph
      # for //tabula) fetches an android_sdk_repository at analysis time and
      # aborts the build if the SDK is gone ("No Android SDK apis found"), even
      # though no Android target is built here. Only CodeQL is pruned from the
      # toolcache (its Go/Node/Python are used by other jobs). `|| true` so a
      # missing path is never fatal to this required check.
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          echo "Disk after cleanup:" && df -h /

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).
      - name: Gate on changed paths
        id: gate
        if: github.event_name != 'merge_group'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE_REV: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash tools/ci/relevant-paths.sh

      # --- ALL LANES: AFFECTED targets, fall back to //... on any doubt. ------
      # Every lane runs tools/ci/affected-targets.sh; only the diff BASE differs:
      #   pull_request  merge-base vs origin/${{ github.base_ref }}
      #   merge_group   the queue base (github.event.merge_group.base_sha) --
      #                 exactly the main tip this group would land on
      #   push (main)   the pre-push tip (github.event.before); forced pushes
      #                 full-sweep (FORCED_PUSH) since history was rewritten
      # All the logic (global-impact guard -> //..., target-determinator,
      # empty-set skip, build-then-build_tests_only, tolerate exit 4) lives in
      # the committed helper so it is reviewable and testable. Any error or
      # uncertainty inside it falls back to a full //... build+test, so no lane
      # is ever less safe than a full sweep.
      #
      # SAFETY PAIRING: the whole-graph correctness backstop for affected
      # selection is the scheduled periodic-full-sweep.yaml (nightly //...,
      # files a P0 issue on red). `bazel run //tools/conformance:check` FAILS if
      # that workflow disappears while these lanes are affected-scoped -- do not
      # remove one without the other.

      # PRESUBMIT (pull_request). Additionally gated on the changed-paths
      # result: skipped (job still green) when the PR is docs/gitops/markdown-
      # only; fails safe to running whenever the gate is uncertain.
      - name: Build + test affected targets (PR)
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/affected-targets.sh

      # MERGE QUEUE (merge_group). base_sha is reachable because the checkout
      # above uses fetch-depth: 0 (build-macos already relies on the same).
      - name: Build + test affected targets (merge queue)
        if: github.event_name == 'merge_group'
        env:
          BEFORE_REV: ${{ github.event.merge_group.base_sha }}
        run: bash tools/ci/affected-targets.sh

      # POSTSUBMIT (push to main). Verifies the landed commit; queue-merged
      # commits were just tested as merge_group, so this is cheap re-verification
      # of the same diff (plus coverage for admin/break-glass direct pushes).
      # event.before is the zero SHA on ref creation -> script full-sweeps.
      # Additionally gated on relevant-paths: docs-only pushes skip the heavy
      # work (the nightly full sweep is the backstop).
      - name: Build + test affected targets (push to main)
        if: github.event_name == 'push' && steps.gate.outputs.relevant != 'false'
        env:
          BEFORE_REV: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        run: bash tools/ci/affected-targets.sh

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history so the PR path filter can diff against the merge-base.
          fetch-depth: 0

      # Path-aware guard for the heavy macOS build on BOTH presubmit lanes:
      # regular PRs and merge_group (the merge queue). On push to main the filter
      # is skipped and the unconditional postsubmit build below is the safety
      # floor. dorny/paths-filter does a cheap name-only diff and never fails the
      # job on its own; it only decides whether to run the build, so the required
      # `build-macos` check always reports a result (fast when nothing macOS
      # changed, instead of a full macOS build on every queued PR).
      - name: Detect macOS-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # PR: diff against the target branch. merge_group: diff the queued
          # commit against the base the queue is merging onto (base_sha is
          # reachable because fetch-depth: 0 fetched the full history above).
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.base_ref }}
          filters: |
            macos:
              - 'nexus-agent/**'
              # ALL of tools/** -- the Apple CC toolchain + platforms live here,
              # and .bazelrc `import`s tools/preset.bazelrc, tools/java17.bazelrc
              # and tools/remote.bazelrc, any of which can change the .app build.
              - 'tools/**'
              # .bazelrc defines --config=macos-app; .bazelversion pins the
              # toolchain version; global build config -- rebuild on these too.
              - '.bazelrc'
              - '.bazelversion'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.github/workflows/ci.yaml'

      - name: Set up Bazel
        # Set up Bazel only when we are going to build: always on push (floor),
        # on merge_group unless the filter is SURE no macOS path changed, and on
        # a PR only when the filter matched.
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.macos != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.macos == 'true')
        uses: ./.github/actions/setup-bazel

      # POSTSUBMIT (push to main): ALWAYS build the macOS app -- the safety floor
      # for anything that lands on main outside the queue (direct / admin push).
      #
      # --config=macos-app activates Apple's CC toolchain (needed for the
      # objc-executable link). NexusAgent (macos_application) carries
      # tags=["manual"], so the wildcard skips it -- build it explicitly by
      # label. The wildcard still builds the rest of nexus-agent (Swift lib,
      # Node bridge, hooks) on macOS.
      - name: Build macOS app (postsubmit floor on push to main)
        if: github.event_name == 'push'
        run: |
          bazel build --config=macos-app //nexus-agent/... //nexus-agent/macos:NexusAgent
          # Swift unit tests (VersionCompare etc.) -- macos-only + manual, so run
          # by explicit label here where Xcode/XCTest is available (#807).
          bazel test --config=macos-app //nexus-agent/macos:NexusAgent_tests

      # PRESUBMIT (merge queue + PR): build only when the diff touches a
      # macOS-relevant path. On merge_group we build UNLESS the filter is certain
      # nothing macOS-relevant changed (macos == 'false'), so any filter
      # uncertainty (empty/missing result) fails safe to building rather than
      # letting a macOS-breaking change merge unbuilt.
      - name: Build macOS app (merge queue / PR, if macOS-relevant)
        if: >-
          (github.event_name == 'merge_group' && steps.changes.outputs.macos != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.macos == 'true')
        run: |
          bazel build --config=macos-app //nexus-agent/... //nexus-agent/macos:NexusAgent
          # Swift unit tests (VersionCompare etc.) -- macos-only + manual, so run
          # by explicit label here where Xcode/XCTest is available (#807).
          bazel test --config=macos-app //nexus-agent/macos:NexusAgent_tests

  license-check:
    # Whole-repo MIT license-header check, now hermetic via Bazel. The addlicense
    # binary + the ignore set both live in //tools/license (BUILD.bazel), so the
    # check runs identically here and locally (`bazel run //tools/license:check`);
    # `bazel run //tools/license:add` fixes missing headers. Generated/tool-managed
    # files are ignored there (BUILD = gazelle, lockfiles, baselines, etc.).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      - name: Check license headers present (whole repo)
        run: bazel run //tools/license:check
      # addlicense -check above is PRESENCE-only (an Apache header with a wrong
      # holder passes it). This CONTENT gate enforces MIT + VitruvianSoftware in
      # every first-party LICENSE and any source header present (issue #457).
      - name: Verify license content is MIT + VitruvianSoftware
        run: bazel run //tools/license:verify

  go-lint:
    # Authoritative golangci-lint for the Go apps exported to standalone mirrors.
    # aspect_rules_lint has no golangci-lint aspect, and the per-app mirror CI is
    # being retired (the monorepo is the single CI authority), so Go lint runs
    # here as a matrix over each module -- standalone (GOWORK=off), exactly as it
    # lints in its mirror today.
    #
    # Each matrix leg is path-gated on presubmit lanes (same run-then-noop-green
    # pattern as build-macos): a required check must ALWAYS report a result, so
    # the JOB always runs and only the work inside is skipped when the diff
    # can't affect this module. GOWORK=off makes the module fully standalone,
    # so <module>/** (plus this workflow) is the complete input set. Push to
    # main stays unconditional (the postsubmit floor).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [devx, homelab]
    steps:
      - uses: actions/checkout@v7
        with:
          # merge_group diffs need the base_sha reachable locally.
          fetch-depth: 0
      # Cheap name-only diff; never fails the job on its own. Fail-safe
      # asymmetry mirrors build-macos: a PR runs the work only when the filter
      # POSITIVELY matched, the merge queue runs it unless the filter is
      # CERTAIN nothing relevant changed (uncertainty -> run).
      - name: Detect ${{ matrix.module }}-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.base_ref }}
          filters: |
            module:
              - '${{ matrix.module }}/**'
              - '.github/workflows/ci.yaml'
      - uses: actions/setup-go@v6
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.module != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.module == 'true')
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: golangci-lint (${{ matrix.module }})
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.module != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.module == 'true')
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.1
          working-directory: ${{ matrix.module }}

  go-test:
    # Race-detector tests for the Go apps. The monorepo Bazel runs these tests
    # but NOT under `-race` (no race config in the bazelrc); the retired mirror
    # CI ran `go test -race`, so this preserves that coverage -- standalone per
    # module (GOWORK=off), exactly as it ran in each mirror.
    #
    # Path-gated per leg exactly like go-lint above (run-then-noop-green;
    # GOWORK=off makes <module>/** the complete input set; push unconditional).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [devx, homelab]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect ${{ matrix.module }}-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.base_ref }}
          filters: |
            module:
              - '${{ matrix.module }}/**'
              - '.github/workflows/ci.yaml'
      - uses: actions/setup-go@v6
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.module != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.module == 'true')
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go test -race (${{ matrix.module }})
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.module != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.module == 'true')
        working-directory: ${{ matrix.module }}
        run: go test -race -cover ./...

  validate-butane:
    # devx's Fedora CoreOS Butane template must render to valid Ignition. There
    # is no Bazel target for this -- it is a devx-specific check ported verbatim
    # from the retired devx mirror CI so the coverage is not lost.
    #
    # Path-gated on presubmit lanes (run-then-noop-green, like go-lint/go-test
    # above). The check's only in-tree input is the template itself -- the
    # envsubst vars are dummies and butane comes from a container image -- so
    # the filter is exactly that file (plus this workflow). Push unconditional.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect Butane-relevant changes
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.base_ref }}
          filters: |
            butane:
              - 'devx/dev-machine.template.bu'
              - '.github/workflows/ci.yaml'
      - name: Validate Butane template
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'merge_group' && steps.changes.outputs.butane != 'false') ||
          (github.event_name == 'pull_request' && steps.changes.outputs.butane == 'true')
        working-directory: devx
        run: |
          CF_TUNNEL_TOKEN=dummy DEV_HOSTNAME=ci-test \
            envsubst < dev-machine.template.bu | \
            docker run --rm -i quay.io/coreos/butane:release --strict
