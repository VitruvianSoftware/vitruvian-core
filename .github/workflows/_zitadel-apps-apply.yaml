name: _zitadel-apps-apply

# Reusable per-environment apply of the zitadel-apps stack — the EXPAND step
# of the oauth-user-inspector promotion chain (principle §2.15): register the
# env's OIDC client (+ redirect URIs) in the self-hosted Zitadel instance and
# sync the minted client id/secret into the env's oss project's Secret
# Manager BEFORE the env's app revision serves, so hosted login works on
# arrival.
#
# Caller contract:
#   * job-level `environment: oauth-user-inspector-<environment>` supplies the
#     keyless-WIF vars (GCP_WORKLOAD_IDENTITY_PROVIDER,
#     GCP_DEPLOY_SERVICE_ACCOUNT) used for the stack's GCP Secret Manager
#     resources — pass `secrets: inherit` (Headscale key + Zitadel key + Pulumi
#     token).
#   * The Zitadel management API is reached over the Headscale mesh (the
#     Envoy gateway NodePort on a cluster node; see zitadel-tunnel-setup)
#     — NOT the public Cloudflare edge, whose bot-protection
#     (HTTP 1010) blocks the provider's Go client. See
#     infrastructure/pulumi/platform/zitadel-apps/APPLYING-FROM-CI.md.
#   * The env's Cloud Run run.app redirect URI is only known after the app
#     stack's first deploy, so this workflow PROBES for the app stack and
#     passes it via ZITADEL_APPS_APP_STACK when present — the first per-env
#     run cleanly skips it and the redirect self-heals on the next run.

on:
  workflow_call:
    inputs:
      environment:
        description: "development | nonproduction | production"
        required: true
        type: string

jobs:
  zitadel-apps:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # checkout (contents: read) + GCP Workload Identity Federation
    # (id-token: write) for the stack's Secret Manager writes.
    permissions:
      contents: read
      id-token: write
    environment: oauth-user-inspector-${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      # Authenticate Pulumi's github:// plugin downloads (pulumi-resource-zitadel
      # comes from github://api.github.com/pulumiverse) so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit CI runners routinely
      # exhaust (intermittent 403s); GITHUB_TOKEN raises this to 5000/hr. Same
      # class of fix as #756 / the identity-apply workflows. Seen live on
      # delivery run 37446763025 (2026-10-06): "rate limit exceeded: 403".
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Zitadel tunnel (Headscale join + TLS terminator prep)
        uses: ./.github/actions/zitadel-tunnel-setup
        with:
          headscale-authkey: ${{ secrets.HEADSCALE_CI_AUTHKEY }}

      # The stack writes the minted OIDC client id/secret into the env's oss
      # project's Secret Manager (cred-sync-to-GCP-SM), so it needs GCP
      # credentials: keyless WIF as the env's per-app deploy SA (its
      # prefix-conditioned secretmanager.admin covers this app's secrets; the
      # FIRST per-env apply — secret creation — is a gated sa-terraform-proj
      # apply, see the deploy-identity stack).
      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      # The env's Cloud Run host exists only after the app stack's first
      # deploy. Probe for the stack's serviceUrl (from the app project dir —
      # `pulumi stack output -s` must run inside a matching project) and hand
      # it to the program via ZITADEL_APPS_APP_STACK; absent, the program
      # keeps the committed redirect set (first-deploy guard).
      - name: Detect the env's app stack (run.app redirect)
        id: appstack
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: apps/web/oauth-user-inspector/infra/app
        run: |
          set -euo pipefail
          STACK="ipv1337/pulumi_oauth_user_inspector/${DEPLOY_ENV}"
          if pulumi stack output serviceUrl --stack "$STACK" >/dev/null 2>&1; then
            echo "app-stack=${STACK}" >> "$GITHUB_OUTPUT"
            echo "App stack found: ${STACK} — its run.app redirect will be registered."
          else
            echo "app-stack=" >> "$GITHUB_OUTPUT"
            echo "App stack not found yet (first per-env deploy): keeping the committed redirect set."
          fi

      - name: Apply the Zitadel application stack (Pulumi)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Machine-user JWT profile key, seeded once as a pipeline secret. The
          # Zitadel provider authenticates with it.
          ZITADEL_MACHINE_KEY_JSON: ${{ secrets.ZITADEL_MACHINE_KEY_JSON }}
          ZITADEL_APPS_APP_STACK: ${{ steps.appstack.outputs.app-stack }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GOWORK: off
        working-directory: infrastructure/pulumi/platform/zitadel-apps
        run: |
          set -euo pipefail
          # guarded-up (//tools/pulumi:guarded-up) runs `pulumi preview --json`, the
          # plan guard, then `pulumi up`, as one unit retried on Pulumi Cloud's
          # account-wide 409 (it replaces the bare retry helper here). This job sets
          # up no Bazel and the helper is std-only, so the runner's rustc builds it
          # from the checkout (about a second), before the tunnel. The guard
          # refuses a plan that deletes or replaces anything nobody approved: on
          # the Zitadel provider a replace of an OIDC app DELETES the live client
          # and breaks hosted login (2026-06-26).
          guarded_up="${RUNNER_TEMP}/guarded-up"
          rustc --edition 2021 -O "$GITHUB_WORKSPACE/tools/pulumi/src/bin/guarded_up.rs" -o "$guarded_up"
          # TLS terminator must live for this step (backgrounded processes don't
          # survive across steps): homelab-tunnel-setup maps auth.ipv1337.dev to
          # 127.0.0.1 in /etc/hosts, and socat bound to 127.0.0.1:443 forwards
          # to the Envoy gateway (Host preserved).
          # Target the gateway's NodePort on a cluster node's Headscale address
          # ($ZITADEL_GATEWAY, picked by the zitadel-tunnel-setup action from the
          # wired nodes that answer), NOT the LB VIP 10.44.86.211: that VIP is a
          # Cilium eBPF LB address and is unreachable from an off-cluster mesh
          # client (a subnet-router-forwarded packet to it is dropped by Cilium's
          # datapath before LB; conntrack never sees it). With the gateway service
          # externalTrafficPolicy: Cluster (see envoyproxy.yaml), any node
          # forwards to the Envoy endpoints.
          : "${ZITADEL_GATEWAY:?zitadel-tunnel-setup did not pick a gateway node}"
          sudo socat OPENSSL-LISTEN:443,bind=127.0.0.1,reuseaddr,fork,cert=/etc/auth-internal-ck.pem,verify=0 \
            TCP:"${ZITADEL_GATEWAY}" &
          trap 'sudo pkill -f "OPENSSL-LISTEN:443" 2>/dev/null || true' EXIT
          # confirm the internal path is up before applying (fail loudly otherwise)
          for _ in $(seq 1 15); do
            curl -fsS --max-time 5 https://auth.ipv1337.dev/debug/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 https://auth.ipv1337.dev/debug/healthz >/dev/null

          # plan-guard:begin
          # --create stays: the first promotion to an environment makes its stack.
          # A new stack is empty, so its plan can only create, never delete.
          pulumi stack select "$DEPLOY_ENV" --create
          pulumi config set --secret zitadel:jwtProfileJson "$ZITADEL_MACHINE_KEY_JSON"
          # Which deletes and replaces may apply: only ones a reviewed commit named
          # with an `Allow-destroy: <urn>` line. A push reads the pushed commits; a
          # release reads the commits since the product's previous release
          # (tools/pulumi/release_approvals.sh). A manual run approves nothing.
          allow=()
          case "${EVENT_NAME:-}" in
            push)
              allow=(--allow-destroy-from-event "${GITHUB_EVENT_PATH:?}")
              ;;
            release)
              approvals="${RUNNER_TEMP}/release-approvals.json"
              "$GITHUB_WORKSPACE/tools/pulumi/release_approvals.sh" "$approvals"
              allow=(--allow-destroy-from-event "$approvals")
              ;;
          esac
          "$guarded_up" "zitadel-apps ${DEPLOY_ENV}" ${allow[@]+"${allow[@]}"}
          # plan-guard:end
