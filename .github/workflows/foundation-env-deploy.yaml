# Reusable workflow for deploying a single foundation environment.
#
# This workflow deploys one environment leaf (development, nonproduction, or
# production) of the gcp-environments foundation stage. It is called by
# the main foundation-release.yaml workflow in a chained sequence:
#
#   development (auto) → nonproduction (manual approval) → production (manual approval)
#
# Upstream-leaf layout: each environment is its own thin Pulumi project at
# envs/{environment}/ (upstream 2-environments/envs/<env>), with a single
# `production` stack (ipv1337/foundation-environments-<env>/production) and the
# stage logic shared via ../../modules. Each environment maps to:
#   - A leaf Pulumi project dir: {working_directory}/envs/{environment}
#     (committed non-secret config in that leaf's Pulumi.production.yaml)
#   - A GitHub Environment with optional protection rules (foundation-env-{environment})
#
# This pattern replaces the upstream Terraform foundation's branch promotion
# strategy (development → nonproduction → production branches) with a
# monorepo-compatible approach using GitHub Environment gates.

name: Foundation Environment Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment: development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-environments"
        description: "Stage root directory; pulumi runs in {working_directory}/envs/{environment}"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Serialize per (stack dir + environment): a newer promotion run waits for an
    # older in-flight one rather than racing/deploying out of order onto live org
    # infra. Never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-env-deploy-${{ inputs.working_directory }}-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-env-${{ inputs.environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads (e.g. pulumiverse
      # pulumi-resource-time used for time.Sleep propagation gates) so the job
      # does not hit the 60/hr/IP unauthenticated GitHub API rate limit that CI
      # runners routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this
      # to 5000/hr. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # Upstream-leaf layout: the environment selects the leaf Pulumi project
      # dir; every leaf has exactly one stack, `production`.
      - name: Pulumi up (${{ inputs.environment }})
        id: pulumi
        uses: ./.github/actions/pulumi-run-captured
        with:
          command: up
          stack: production
          working-directory: ${{ inputs.working_directory }}/envs/${{ inputs.environment }}
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Render the pulumi output digest onto the run's step-summary page via the
      # shared composite (.github/actions/pulumi-summary). Runs even when the
      # deploy fails so the failure — and what it touched — is surfaced.
      - name: Compute the pulumi digest label
        if: always()
        id: label
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: echo "value=$(basename "${WORKING_DIRECTORY}")/${{ inputs.environment }}" >> "${GITHUB_OUTPUT}"

      - name: Pulumi digest → step summary
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: ${{ steps.label.outputs.value }}
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}
