name: pulumi-library-release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "packages/pulumi/library/**"
      - ".github/workflows/pulumi-library-release.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-26.04
    # Just a full-history checkout + changed-package diff; cap it so a hung
    # clone/step can't pin a runner. Matches the 10-min floor other lightweight
    # jobs use (the release-please job below is capped separately at 45).
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # need history for diff
      - id: set-matrix
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Detect changed files in this push. Fall back to all packages if
          # the before SHA is empty/zero-ref (manual dispatch, new branch, or force push).
          BEFORE_SHA="${BEFORE_SHA:-}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "${ZERO_SHA}" ] || ! git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "setup: cannot compute diff (manual dispatch, new branch, or force-push) → releasing all packages"
            ALL=true
          else
            CHANGED_FILES="$(git diff --name-only "${BEFORE_SHA}" HEAD)"
            ALL=false
          fi

          cd packages/pulumi/library
          # Discover all packages that have a release-please-config.json
          ALL_PKGS=$(find * -name "release-please-config.json" -exec dirname {} \;)

          if [ "${ALL}" = "true" ]; then
            MATCHED_PKGS="${ALL_PKGS}"
          else
            # Keep only packages where at least one changed file falls under
            # the package's directory AND the push includes a releasable conventional
            # commit (feat, fix, perf, revert, or breaking change).
            # Non-releasable bumps (e.g. chore(deps) across 26 go.mod files) never cut
            # releases and would otherwise exhaust the GitHub App installation API rate limit.
            MATCHED_PKGS=""
            while IFS= read -r pkg; do
              [ -z "${pkg}" ] && continue
              pkg_path="packages/pulumi/library/${pkg}"
              # Herestring, NOT `echo ... | grep -q`: `run:` blocks execute under
              # `bash -eo pipefail`, and `grep -q` exits on its first match, so a
              # CHANGED_FILES list past the 64 KiB pipe buffer makes the still-
              # writing echo take SIGPIPE and the pipeline report 141 -- dropping
              # a package that DID change out of the release matrix, silently.
              if grep -q "^${pkg_path}/" <<<"${CHANGED_FILES}"; then
                if git log "${BEFORE_SHA}..HEAD" --format="%s%n%b" -- "${pkg_path}" | grep -E -q "(^|\n)(feat|fix|perf|revert)(\([^\)]+\))?!?:|BREAKING[ -]CHANGE:"; then
                  MATCHED_PKGS="${MATCHED_PKGS}${MATCHED_PKGS:+$'\n'}${pkg}"
                fi
              fi
            done <<< "${ALL_PKGS}"
          fi

          if [ -z "${MATCHED_PKGS}" ]; then
            echo "setup: no library packages changed with releasable commits → empty matrix"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "setup: releasing packages:"
            echo "${MATCHED_PKGS}" | sed 's/^/  /'
            json_array=$(echo "${MATCHED_PKGS}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map("packages/pulumi/library/" + .)')
            echo "matrix=$json_array" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # Per-package concurrency: serialize each package's runs independently
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.package }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      # `mint-sync-app-token` is a LOCAL composite action; GitHub can't resolve
      # `uses: ./...` without the repo already checked out onto the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while its PR is in the merge queue. A
      # fix that lands on main while the release PR is queued then makes
      # release-please's push fail: the PR merges with stale notes and a tag
      # that holds the newer code (Courier 0.3.32 shipped #5268 and #5264 and
      # listed neither). Out of the queue it can be refreshed. After
      # release-please, `rearm` puts back a PR that release-please had nothing
      # to push to. See tools/ci/src/release_pr_dequeue/README.md.
      # The release branch is named for the package's `component` in its
      # release-please config: release-please--branches--main--components--<component>.
      - name: Find this package's release-please component
        id: component
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          component="$(jq -er '.packages[env.PACKAGE].component' "${PACKAGE}/release-please-config.json")"
          echo "name=${component}" >> "$GITHUB_OUTPUT"

      - name: Build //tools/ci:release_pr_dequeue (no Bazel on this job)
        id: dequeue-bin
        uses: ./.github/actions/build-ci-tool
        with:
          tool: release_pr_dequeue

      - name: Take a stale release PR out of the merge queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: ${{ steps.component.outputs.name }}
          CODE_PATH: ${{ matrix.package }}
          MAIN_SHA: ${{ github.sha }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN"'

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ matrix.package }}/release-please-config.json
          manifest-file: ${{ matrix.package }}/.release-please-manifest.json
          target-branch: main

      # release-please pushes only when the release PR's text changes, so a PR
      # that was dequeued for a commit that adds nothing to its notes would stay
      # out of the queue. Put it back (a held, draft or already-armed PR is left alone).
      - name: Put the release PR back in the merge queue
        if: ${{ !cancelled() && steps.dequeue-bin.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: ${{ steps.component.outputs.name }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN" rearm'
