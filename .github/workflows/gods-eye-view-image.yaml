# Builds and publishes the God's Eye View container image to GHCR,
# which is deployed to the homelab k3s cluster via GitOps (ArgoCD).

name: gods-eye-view-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/web/gods-eye-view/**'
      - '!apps/web/gods-eye-view/**/BUILD'
      - '!apps/web/gods-eye-view/**/BUILD.bazel'
      - '!apps/web/gods-eye-view/**/OWNERS'
      - '!apps/web/gods-eye-view/deploy/**'
      - '!apps/web/gods-eye-view/mkdocs.yml'
      - '!apps/web/gods-eye-view/.agents/**'
      - '!apps/web/gods-eye-view/.github/**'
      - '!apps/web/gods-eye-view/changelog.d/**'
      - '!apps/web/gods-eye-view/docs/**'
      - '!apps/web/gods-eye-view/pinokio/**'
      - '!apps/web/gods-eye-view/tests/**'
      - '!apps/web/gods-eye-view/tools/**'
      - '!apps/web/gods-eye-view/upstream/**'
      - '!apps/web/gods-eye-view/compose.yaml'
      - '!apps/web/gods-eye-view/*.md'
      - '!apps/web/gods-eye-view/**/README.md'
      - '.github/workflows/gods-eye-view-image.yaml'
      - 'tools/ci/src/pnpm_lock_gate/**'
      - '!tools/ci/src/pnpm_lock_gate/**/BUILD'
      - '!tools/ci/src/pnpm_lock_gate/**/BUILD.bazel'
      - '!tools/ci/src/pnpm_lock_gate/**/OWNERS'
      - '!tools/ci/src/pnpm_lock_gate/**/*.md'
      - 'tools/shell-compat/src/**'
      - '!tools/shell-compat/src/**/BUILD'
      - '!tools/shell-compat/src/**/BUILD.bazel'
      - '!tools/shell-compat/src/**/OWNERS'
      - '!tools/shell-compat/src/**/*.md'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/web/gods-eye-view/**'
      - '!apps/web/gods-eye-view/**/BUILD'
      - '!apps/web/gods-eye-view/**/BUILD.bazel'
      - '!apps/web/gods-eye-view/**/OWNERS'
      - '!apps/web/gods-eye-view/deploy/**'
      - '!apps/web/gods-eye-view/mkdocs.yml'
      - '!apps/web/gods-eye-view/.agents/**'
      - '!apps/web/gods-eye-view/.github/**'
      - '!apps/web/gods-eye-view/changelog.d/**'
      - '!apps/web/gods-eye-view/docs/**'
      - '!apps/web/gods-eye-view/pinokio/**'
      - '!apps/web/gods-eye-view/tests/**'
      - '!apps/web/gods-eye-view/tools/**'
      - '!apps/web/gods-eye-view/upstream/**'
      - '!apps/web/gods-eye-view/compose.yaml'
      - '!apps/web/gods-eye-view/*.md'
      - '!apps/web/gods-eye-view/**/README.md'
      - '.github/workflows/gods-eye-view-image.yaml'
      - 'tools/ci/src/pnpm_lock_gate/**'
      - '!tools/ci/src/pnpm_lock_gate/**/BUILD'
      - '!tools/ci/src/pnpm_lock_gate/**/BUILD.bazel'
      - '!tools/ci/src/pnpm_lock_gate/**/OWNERS'
      - '!tools/ci/src/pnpm_lock_gate/**/*.md'
      - 'tools/shell-compat/src/**'
      - '!tools/shell-compat/src/**/BUILD'
      - '!tools/shell-compat/src/**/BUILD.bazel'
      - '!tools/shell-compat/src/**/OWNERS'
      - '!tools/shell-compat/src/**/*.md'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/gods-eye-view
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Fail-open lockfile closure gate: if only pnpm-lock.yaml (plus ignored docs/files)
  # changed outside gods-eye-view's transitive closure, skip rebuilding and re-pushing.
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.verdict == 'skip' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/actions/build-ci-tool
            .github/workflows
            tools/ci/src/pnpm_lock_gate
            tools/ci/src/resolve_deploy_base
            tools/shell-compat

      - name: Build //tools/ci:resolve_deploy_base (no Bazel on this job)
        id: base-bin
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/build-ci-tool
        with:
          tool: resolve_deploy_base

      - name: Resolve durable diff base on push
        id: base
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: gods-eye-view-image.yaml
          RESOLVE_BASE_BIN: ${{ steps.base-bin.outputs.path }}
        run: |
          if [ -n "${RESOLVE_BASE_BIN:-}" ]; then
            "$RESOLVE_BASE_BIN"
          fi

      - name: Build //tools/ci:pnpm_lock_gate (no Bazel on this job)
        id: gate-bin
        continue-on-error: true
        uses: ./.github/actions/build-ci-tool
        with:
          tool: pnpm_lock_gate

      - name: Check whether image rebuild is required
        id: gate
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PNPM_LOCK_GATE_BIN: ${{ steps.gate-bin.outputs.path }}
        run: |
          set -euo pipefail
          "$PNPM_LOCK_GATE_BIN" \
            --workflow .github/workflows/gods-eye-view-image.yaml \
            --importers apps/web/gods-eye-view \
            | tee "$RUNNER_TEMP/gate.out"
          {
            echo "### God's Eye View image lockfile gate"
            echo ""
            echo "- $(cat "$RUNNER_TEMP/gate.out")"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/gods-eye-view/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache (#2841). On main it lives in the registry, next to the
          # image, as the `buildcache` tag -- NOT in the Actions cache, where
          # these three image builds held about 2.2 GiB of the repo's shared
          # 10 GiB budget and pushed it over the limit, evicting other jobs'
          # entries. Non-main runs (PRs, merge queue) read from the registry and
          # gha caches without writing; only main writes cache-to.
          # ignore-error: a failed cache upload must not fail the image build.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha,scope=gods-eye-view-image
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.IMAGE) || '' }}

      - name: Load image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/gods-eye-view/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: gods-eye-view:verify
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha,scope=gods-eye-view-image

      - name: Verify the revision label on the built image
        run: |
          set -euo pipefail
          got="$(docker image inspect gods-eye-view:verify \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [ "$got" != "${GITHUB_SHA}" ]; then
            echo "::error::org.opencontainers.image.revision is '${got}', expected '${GITHUB_SHA}'"
            exit 1
          fi
          echo "revision label = ${got}"

      - name: Verify UID 1001 boots and serves /healthz
        run: |
          set -euo pipefail
          trap 'docker rm -f gev-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name gev-smoke \
            --user 1001:1001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:uid=1001,gid=1001 \
            --tmpfs /app/.gev-cache:uid=1001,gid=1001 \
            --publish 127.0.0.1:18080:8080 \
            gods-eye-view:verify
          ok=false
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18080/healthz >/dev/null; then
              ok=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' gev-smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done
          if [ "$ok" != "true" ]; then
            echo "::error::gods-eye-view did not serve /healthz as UID 1001" >&2
            docker logs gev-smoke >&2 || true
            exit 1
          fi
          echo "/healthz responded 200 as UID 1001 on read-only rootfs"

      - name: Verify the pushed manifest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${DIGEST:-}"
          if [ -z "$digest" ]; then
            digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
              --format '{{.Manifest.Digest}}')"
          fi
          ref="${IMAGE}@${digest}"
          img="$(docker buildx imagetools inspect "${ref}" --format '{{json .Image}}')"
          for want in linux/amd64 linux/arm64; do
            got="$(echo "$img" | jq -r --arg p "$want" \
              '.[$p].config.Labels["org.opencontainers.image.revision"] // "ABSENT"')"
            if [ "$got" = "null" ] || [ "$got" = "ABSENT" ]; then
              echo "::error::pushed index has no ${want} image with a revision label — the cluster has nodes of that architecture"
              exit 1
            fi
            if [ "$got" != "${GITHUB_SHA}" ]; then
              echo "::error::${want} revision label is '${got}', expected '${GITHUB_SHA}'"
              exit 1
            fi
            echo "${want}: revision=${got}"
          done
