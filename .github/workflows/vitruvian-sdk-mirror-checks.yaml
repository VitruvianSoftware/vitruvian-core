name: Vitruvian SDK Mirror Checks

# The checks the vitruvian-sdk mirror runs with Cargo, run here first. The
# mirror (VitruvianSoftware/vitruvian-sdk) has no Bazel, so its ci.yml runs
# the SDK's checks through packages/vitruvian-sdk/verification/Cargo.toml.
# Bazel builds the same sources here and never reads that file, so without
# this a change that breaks the Cargo build (a new source file the manifest
# does not know, a check that only finds its files under Bazel) would be
# found only after it was exported, as the mirror going red. That happened
# from 2026-10-27 to 2026-10-30, when the mirror still ran Python scripts
# this repository had deleted.
#
# The same commands as the mirror's `checks` job and its kits.yml
# conformance runs, from the package's folder, which is the mirror's root.
# Only when the package changes. A standard GitHub-hosted runner on a public
# repository is not billed. NOT a required check: red here means "the
# mirror's CI would fail after the next export".

on:
  push:
    branches: [main]
    paths:
      - 'packages/vitruvian-sdk/**'
      - 'packages/pycompat/vitruvian-pycompat/**'
      - 'tools/copybara/copy.bara.sky'
      - 'tools/copybara/sdk_export_check.py'
      - '.github/workflows/vitruvian-sdk-mirror-checks.yaml'
  pull_request:
    paths:
      - 'packages/vitruvian-sdk/**'
      - 'packages/pycompat/vitruvian-pycompat/**'
      - 'tools/copybara/copy.bara.sky'
      - 'tools/copybara/sdk_export_check.py'
      - '.github/workflows/vitruvian-sdk-mirror-checks.yaml'
  workflow_dispatch:

# Per-commit keying on non-PR events so pushes to main do not evict each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo:
    name: cargo (Rust 1.98.1)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/vitruvian-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version Bazel builds the same checks with (MODULE.bazel,
      # rust.toolchain), and the one the mirror's workflows install.
      - name: Compute Rust 1.98.1 cache key
        id: rust-cache-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          host_triple="$(rustc -vV 2>/dev/null | awk '/^host:/ { print $2 }')"
          if [ -z "$host_triple" ]; then
            case "${RUNNER_OS}:${RUNNER_ARCH}" in
              Linux:X64) host_triple="x86_64-unknown-linux-gnu" ;;
              Linux:ARM64) host_triple="aarch64-unknown-linux-gnu" ;;
              macOS:ARM64) host_triple="aarch64-apple-darwin" ;;
              macOS:X64) host_triple="x86_64-apple-darwin" ;;
              *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
            esac
          fi
          echo "path=${rustup_home}/toolchains/1.98.1-${host_triple}" >> "$GITHUB_OUTPUT"
          echo "key=rustup-toolchain-${RUNNER_OS}-${RUNNER_ARCH}-1.98.1-minimal" >> "$GITHUB_OUTPUT"

      - name: Restore Rust 1.98.1 toolchain cache (read-only)
        id: rust-cache-restore
        if: github.ref != 'refs/heads/main' && steps.rust-cache-key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Restore and save Rust 1.98.1 toolchain cache (main only)
        id: rust-cache-save
        if: github.ref == 'refs/heads/main' && steps.rust-cache-key.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Rust 1.98.1
        env:
          CACHE_HIT: ${{ steps.rust-cache-restore.outputs.cache-hit == 'true' || steps.rust-cache-save.outputs.cache-hit == 'true' }}
          TOOLCHAIN_DIR: ${{ steps.rust-cache-key.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${CACHE_HIT}" != "true" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/rustc" ]; then
            rustup toolchain install 1.98.1 --profile minimal
          fi
          rustup default 1.98.1
          cargo --version

      - name: The protocol, the conformance validator, the samples and the templates
        run: |
          cargo test --locked --manifest-path verification/Cargo.toml
          cargo run --locked --manifest-path verification/Cargo.toml --bin sync-templates -- --check

      - name: The Rust sample through the conformance validator
        run: |
          cargo build --release --manifest-path samples/hello-rust/Cargo.toml
          mkdir -p "$RUNNER_TEMP/hello-rust/bin"
          cp ../../target/release/tool "$RUNNER_TEMP/hello-rust/bin/tool"
          cp samples/hello-rust/vitruvian-tool.json "$RUNNER_TEMP/hello-rust/"
          cargo run --locked --manifest-path verification/Cargo.toml --bin conformance -- "$RUNNER_TEMP/hello-rust" --expect-refusal

  exported-layout:
    name: cargo exported layout (Rust 1.98.1)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute Rust 1.98.1 cache key
        id: rust-cache-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          host_triple="$(rustc -vV 2>/dev/null | awk '/^host:/ { print $2 }')"
          if [ -z "$host_triple" ]; then
            case "${RUNNER_OS}:${RUNNER_ARCH}" in
              Linux:X64) host_triple="x86_64-unknown-linux-gnu" ;;
              Linux:ARM64) host_triple="aarch64-unknown-linux-gnu" ;;
              macOS:ARM64) host_triple="aarch64-apple-darwin" ;;
              macOS:X64) host_triple="x86_64-apple-darwin" ;;
              *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
            esac
          fi
          echo "path=${rustup_home}/toolchains/1.98.1-${host_triple}" >> "$GITHUB_OUTPUT"
          echo "key=rustup-toolchain-${RUNNER_OS}-${RUNNER_ARCH}-1.98.1-minimal" >> "$GITHUB_OUTPUT"

      - name: Restore Rust 1.98.1 toolchain cache (read-only)
        id: rust-cache-restore
        if: github.ref != 'refs/heads/main' && steps.rust-cache-key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Restore and save Rust 1.98.1 toolchain cache (main only)
        id: rust-cache-save
        if: github.ref == 'refs/heads/main' && steps.rust-cache-key.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.rust-cache-key.outputs.path }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Rust 1.98.1
        env:
          CACHE_HIT: ${{ steps.rust-cache-restore.outputs.cache-hit == 'true' || steps.rust-cache-save.outputs.cache-hit == 'true' }}
          TOOLCHAIN_DIR: ${{ steps.rust-cache-key.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${CACHE_HIT}" != "true" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/rustc" ]; then
            rustup toolchain install 1.98.1 --profile minimal
          fi
          rustup default 1.98.1
          cargo --version

      - name: Assemble exported mirror layout and run Cargo checks
        # Runs the same Cargo steps the public mirror runs; the mirror has no Bazel, so this deliberately does not go through Bazel.
        run: python3 tools/copybara/sdk_export_check.py
