# Reclaim a closed PR's Actions caches (#1450).
#
# The repo shares ONE 10 GiB Actions cache budget and GitHub evicts by LRU once
# it is exceeded -- so orphaned entries do not merely waste space, they evict
# the caches other lanes depend on. A PR-scoped cache is readable only from its
# own ref, so once the PR closes it can never be read again, yet GitHub keeps it
# for up to 7 days. An image-building PR leaves ~1.5 GiB behind.
#
# Measured 2026-08-20: 222 entries / 11.10 GiB against a 10 GiB cap -- already
# over, already evicting -- of which 94 entries (3.11 GiB) belonged to two PRs
# merged hours earlier.
name: prune-pr-caches

on:
  pull_request:
    types: [closed]
  # Sweep every closed PR, for the fork case below and as a backstop if the
  # on-close run was missed.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: prune-pr-caches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork PR's GITHUB_TOKEN is read-only, so the delete would 403. Skipping
    # is deliberate rather than letting it fail loudly on every fork merge; the
    # nightly sweep (which runs in this repo's own context) collects those.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Delete caches belonging to closed pull requests
        id: prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          bash tools/ci/prune-pr-caches.sh ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }} >> "$GITHUB_OUTPUT"

      - name: Report remaining cache budget
        # Every number here comes from the script, which enumerates the listing
        # once and is covered by //tools/ci:prune_pr_caches_test. The first
        # version computed them inline with `gh api --paginate --jq '... | add'`
        # and shipped broken: --paginate emits one result PER PAGE, so the sum
        # was two numbers and the arithmetic died with a syntax error. An inline
        # `run:` block is untested code; keep the arithmetic where the tests are.
        env:
          DELETED: ${{ steps.prune.outputs.deleted }}
          FREED: ${{ steps.prune.outputs.freed_mib }}
          ENTRIES: ${{ steps.prune.outputs.remaining_entries }}
          MIB: ${{ steps.prune.outputs.remaining_mib }}
        run: |
          {
            echo "### Actions cache budget"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| reclaimed | ${DELETED} entries / ${FREED} MiB |"
            echo "| remaining | ${ENTRIES} entries / ${MIB} MiB |"
            echo "| repo limit | 10240 MiB |"
          } >> "$GITHUB_STEP_SUMMARY"
