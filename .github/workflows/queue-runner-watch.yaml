# Is the homelab runner pool taking jobs, and can it run them? Every 10 minutes
# and after every push to main, a canary asks the homelab runners for a job and
# runs the runner image's own parity checks (//tools/ci-runner:parity: bazel,
# shellcheck, node, sudo...) while tools/ci/queue-runner-watch.sh waits on a
# GitHub-hosted runner. A canary nobody picks up in 4 minutes, or one whose
# checks fail, sets the
# repository variable QUEUE_RUNNER_FALLBACK to "on", which sends the merge
# queue's jobs back to GitHub-hosted runners (spec §4); one that runs sets it
# back to "off". Without this, a homelab outage would leave routed jobs
# waiting for a runner and stop the queue.
# Spec: docs/superpowers/specs/2026-10-19-queue-runners-on-homelab-design.md
#
# Only does anything while QUEUE_RUNNER is "on"; with it "off" both jobs skip.
# Scheduled workflows run from the default branch only.

name: queue-runner-watch

on:
  # What runs it, and why each trigger is here:
  # - merge_group: queue activity is the demand for the homelab runners, and a
  #   dead pool shows up as a stalled queue, where nothing merges and nothing
  #   pushes. Without this trigger the failure this guards against is the one
  #   case in which it never runs (found on 2026-10-20).
  # - push to main: after every merge.
  # - schedule: GitHub's cron is best-effort; this one had not fired once in
  #   several hours. Kept for quiet periods, off-peak minutes.
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# One watcher per commit, none cancelling another: a burst of queue events must
# not keep killing the running watcher before its 4-minute wait finishes, and a
# single shared group would evict all but the newest waiting run (the repo's
# conformance check rejects a constant group for that reason). Watchers that
# overlap all reach the same answer, so extra ones only cost hosted minutes.
concurrency:
  group: queue-runner-watch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Runs on the homelab. Named "canary": the watcher looks it up by name.
  canary:
    if: ${{ vars.QUEUE_RUNNER == 'on' }}
    runs-on: vitruvian-queue
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci-runner
            .bazelversion
      # A runner that starts but cannot run the queue's jobs (a missing tool, as
      # on 2026-10-20) fails here, and the fallback goes on.
      - name: The runner image has what the queue jobs need
        run: |
          set -euo pipefail
          if ! command -v rustc >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rustc
          fi
          rustc --edition 2021 --crate-type lib --crate-name parity_lib tools/ci-runner/src/lib.rs -o "$RUNNER_TEMP/libparity_lib.rlib"
          rustc --edition 2021 tools/ci-runner/src/main.rs -L "$RUNNER_TEMP" --extern parity_lib="$RUNNER_TEMP/libparity_lib.rlib" -o "$RUNNER_TEMP/parity"
          BAZEL_VERSION="$(cat .bazelversion)" "$RUNNER_TEMP/parity"

  watch:
    if: ${{ vars.QUEUE_RUNNER == 'on' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Writing a repository variable and cancelling a run need more than the
      # workflow's own read-only token.
      - name: Mint a GitHub App token
        id: app-token
        uses: ./.github/actions/mint-pulumi-app-token
        with:
          client-id: ${{ vars.PULUMI_APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Wait for the canary, then set or clear the fallback
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WAIT_SECONDS: '240'
        run: bash tools/ci/queue-runner-watch.sh
