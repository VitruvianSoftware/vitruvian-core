# release-please and asset publisher for HomeSpeaker macOS app:
# 1. Authors release PRs from conventional commits under apps/desktop/home-speaker/.
# 2. When the release PR merges, cuts the GitHub Release (tag: home-speaker-vX.Y.Z).
# 3. Compiles a universal (arm64 + x86_64) HomeSpeaker.app on macOS, zips it
#    with a SHA-256 sidecar, and attaches both to the release.
name: home-speaker-release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/home-speaker/**"
      - ".github/workflows/home-speaker-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. home-speaker-v1.0.0). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: home-speaker-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/desktop/home-speaker--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/desktop/home-speaker--tag_name'] }}
      version: ${{ steps.release.outputs['apps/desktop/home-speaker--version'] }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/desktop/home-speaker/release-please-config.json
          manifest-file: apps/desktop/home-speaker/.release-please-manifest.json
          target-branch: main

  publish-package:
    needs: release-please
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: home-speaker-publish-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Publish downloadable release package
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a Google Cloud "Desktop app" OAuth client with the Home
          # API enabled. When set, users can sign in without registering
          # their own project. Absent, the app still works via Settings >
          # Advanced (bring your own client) or an Antigravity import.
          HOMESPEAKER_GOOGLE_CLIENT_ID: ${{ secrets.HOMESPEAKER_GOOGLE_CLIENT_ID }}
          HOMESPEAKER_GOOGLE_CLIENT_SECRET: ${{ secrets.HOMESPEAKER_GOOGLE_CLIENT_SECRET }}
        run: bash apps/desktop/home-speaker/scripts/publish.sh
