# OAuth User Inspector multi-env promotion chain (stage-5 OSS application
# stage): BUILD ONCE — the image is built and pushed a single time to the
# shared Artifact Registry in the infra-pipeline project by the ungated
# oauth-user-inspector-build environment — then the SAME immutable digest is
# PROMOTED dev (auto) -> nonproduction (reviewer-gated) -> production
# (reviewer-gated), each env landing in its prj-{env}-bu1-oss-floating
# project. Nothing is ever rebuilt per env.
#
# Before each env's app deploy, the zitadel-apps EXPAND step
# (_zitadel-apps-apply.yaml) registers that env's OIDC client + redirect URIs
# in the self-hosted Zitadel instance and syncs the client id/secret into the
# env's Secret Manager, so hosted login works on arrival.
#
# Per-environment identifiers (GCP_PROJECT_ID, GCP_DEPLOY_SERVICE_ACCOUNT,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_REGION) are environment-scoped Actions
# *variables* (repo_config oauthVars) — keyless WIF via the foundation-pool
# means none of them is a credential.
#
# workflow_dispatch redeploys a SINGLE chosen environment (it rebuilds at the
# current sha and deploys just that env); pushes to main run the full chain.

name: oauth-user-inspector-deploy

on:
  push:
    branches: [main]
    # Path globs are GRAPH-CORRECT for this app (#498), unlike tabula's: the
    # oauth-user-inspector container builds STANDALONE (its own Docker Buildx
    # build + self-contained package.json -- it is CATALOG_EXEMPT in
    # tools/conformance for exactly this reason), so it has no cross-package
    # Bazel dependencies a directory glob could under-trigger on. These globs
    # ARE its complete input set. Revisit if/when the app migrates to
    # Bazel rules_oci (docs/repo-assessment.md §5.1) -- then it gates via
    # tools/ci/deploy-affected.sh like tabula.
    paths:
      # NOTE: "oauth-user-inspector/**" already covers the co-located app stack
      # (oauth-user-inspector/infra/app). The identity stack is carved OUT to
      # preserve the pre-move trigger set: identity changes never triggered a
      # deploy when the stack lived under infrastructure/pulumi/apps/.
      - "oauth-user-inspector/**"
      - "!oauth-user-inspector/infra/identity/**"
      - "infrastructure/pulumi/platform/zitadel-apps/**"
      - ".github/workflows/oauth-user-inspector-deploy.yaml"
      - ".github/workflows/_deploy-cloud-run.yaml"
      - ".github/workflows/_zitadel-apps-apply.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (single-env redeploy; pushes run the full chain)
        type: choice
        required: true
        default: development
        options:
          - development
          - nonproduction
          - production

permissions:
  contents: read
  id-token: write

# One promotion chain at a time. All three envs now live in ONE run (the old
# per-env group let two runs race the shared build AR), so serialize the whole
# workflow; queued pushes coalesce onto the newest sha.
concurrency:
  group: oauth-user-inspector-deploy
  cancel-in-progress: false

jobs:
  # BUILD ONCE: push the image to the shared AR in the infra-pipeline project
  # (owned by the oauth-user-inspector-build stack) and capture the immutable
  # digest every env promotes. The build environment is ungated.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: oauth-user-inspector-build
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (capture the digest)
        id: push
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/oauth-user-inspector/app"
          NODE_VERSION="$(cut -d. -f1 .nvmrc 2>/dev/null || echo 22)"
          docker buildx build --push \
            --build-arg NODE_VERSION="${NODE_VERSION}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            oauth-user-inspector/
          # Resolve the immutable digest from the registry (driver-agnostic,
          # vs. buildx --metadata-file which varies by builder): this exact
          # @sha256 ref is what every env deploys.
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "Built ${IMAGE}@${DIGEST}"
          echo "image-digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # APP-SCOPED domain-ownership verification (idempotent, no-op once
  # converged): runs AS THE DEV DEPLOY SA (the ungated
  # oauth-user-inspector-development environment — an app identity, NOT the
  # build SA / infra-pipeline project). It self-verifies the zone via DNS-TXT
  # and delegates ownership to EVERY env's deploy SA — the DomainMapping
  # precondition — so it runs once, up front, and every deploy leg (push chain
  # or single-env dispatch) gates on it. The Site Verification API needs only
  # the SA token + the siteverification scope (no project API-enable, no quota
  # project — nothing foundation-owned is involved). The Cloudflare token comes
  # from the dev project's Secret Manager at runtime (secrets model
  # §pipeline-env; no GitHub secret). The script no-ops cleanly when no
  # Pulumi.<env>.yaml sets customDomain.
  verify-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: oauth-user-inspector-development
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # Besides the ambient credentials (the Secret Manager read below),
          # mint a SEPARATE access token carrying the Site Verification scope:
          # user-style consent is impossible for headless SAs, and
          # SA-impersonation tokens can carry arbitrary scopes.
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/siteverification

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Ensure custom-domain ownership (Site Verification)
        env:
          SITEVERIFY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # Plain assignment (not `export VAR=$(...)`): export would swallow
          # the gcloud exit status and hand the script an empty token.
          CLOUDFLARE_API_TOKEN="$(gcloud secrets versions access latest \
            --secret=CLOUDFLARE_API_TOKEN --project="$GCP_PROJECT_ID")"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret read returned empty (dev deploy SA needs secretAccessor on it — identity stack domainVerificationAnchor)"
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN
          ./tools/ci/ensure-site-verification.sh

  # ---- development (auto on push) ------------------------------------------
  # EXPAND (cf. principle §2.15) before each env's deploy. Gated on the
  # ZITADEL_APPS_AUTO_APPLY repo variable until the Zitadel machine-user key
  # and stack IDs are seeded; until then it cleanly no-ops rather than failing
  # the deploy. Each env's deploy tolerates its zitadel job being SKIPPED
  # (gated off) but not FAILED.
  zitadel-dev:
    if: ${{ vars.ZITADEL_APPS_AUTO_APPLY == 'true' && (github.event_name == 'push' || inputs.environment == 'development') }}
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: development
    secrets: inherit

  deploy-dev:
    needs: [build, verify-domain, zitadel-dev]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify-domain.result == 'success' && needs.zitadel-dev.result != 'failure' && (github.event_name == 'push' || inputs.environment == 'development') }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: oauth-user-inspector
      environment: development
      image-digest: ${{ needs.build.outputs.image-digest }}
      default-region: us-west1
      service-name: oauth-user-inspector
      pulumi-dir: oauth-user-inspector/infra/app
      env-prefix: OAUTH_USER_INSPECTOR
      # The app stack's Cloudflare provider (customDomain grey-cloud CNAME)
      # reads CLOUDFLARE_API_TOKEN fetched at runtime from the dev floating
      # project's Secret Manager (single source; the identity stack's
      # domainVerificationAnchor grants every env's deploy SA secretAccessor
      # on it). Never a GitHub secret (secrets model §pipeline-env).
      cloudflare-token-secret-project: prj-d-bu1-oss-floating-648a
      custom-smoke-script: |
        echo "Smoke-checking ${CAND}/"
        # 1) Reachable (HTTP 2xx).
        curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${CAND}/" >/dev/null
        # 2) The SPA actually MOUNTS. index.html is a static shell that returns
        #    200 even when the React bundle throws on mount — exactly how the
        #    2026-06-27 react/react-dom mismatch reached prod past the old
        #    HTTP-200-only check. Headless-render and assert a marker that only
        #    exists once React has rendered (not in the static #root fallback).
        CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || true)"
        if [ -z "$CHROME" ]; then
          echo "::error::no headless Chrome on the runner — cannot verify the app mounts"; exit 1
        fi
        DOM="$("$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "${CAND}/" 2>/dev/null || true)"
        if printf '%s' "$DOM" | grep -q "Select a provider"; then
          echo "Smoke OK: React app mounted."
        else
          echo "::error::App did NOT mount — served only the static fallback (broken frontend bundle)."
          printf '%s' "$DOM" | head -c 800
          exit 1
        fi
    secrets: inherit

  # ---- nonproduction (reviewer-gated environment) --------------------------
  zitadel-nonprod:
    needs: [deploy-dev]
    if: ${{ !cancelled() && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && ((github.event_name == 'push' && needs.deploy-dev.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction')) }}
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-nonprod:
    needs: [build, verify-domain, deploy-dev, zitadel-nonprod]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify-domain.result == 'success' && needs.zitadel-nonprod.result != 'failure' && ((github.event_name == 'push' && needs.deploy-dev.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: oauth-user-inspector
      environment: nonproduction
      image-digest: ${{ needs.build.outputs.image-digest }}
      default-region: us-west1
      service-name: oauth-user-inspector
      pulumi-dir: oauth-user-inspector/infra/app
      env-prefix: OAUTH_USER_INSPECTOR
      # The app stack's Cloudflare provider (customDomain grey-cloud CNAME)
      # reads CLOUDFLARE_API_TOKEN fetched at runtime from the dev floating
      # project's Secret Manager (single source; the identity stack's
      # domainVerificationAnchor grants every env's deploy SA secretAccessor
      # on it). Never a GitHub secret (secrets model §pipeline-env).
      cloudflare-token-secret-project: prj-d-bu1-oss-floating-648a
      custom-smoke-script: |
        echo "Smoke-checking ${CAND}/"
        # 1) Reachable (HTTP 2xx).
        curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${CAND}/" >/dev/null
        # 2) The SPA actually MOUNTS (see the development smoke for rationale).
        CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || true)"
        if [ -z "$CHROME" ]; then
          echo "::error::no headless Chrome on the runner — cannot verify the app mounts"; exit 1
        fi
        DOM="$("$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "${CAND}/" 2>/dev/null || true)"
        if printf '%s' "$DOM" | grep -q "Select a provider"; then
          echo "Smoke OK: React app mounted."
        else
          echo "::error::App did NOT mount — served only the static fallback (broken frontend bundle)."
          printf '%s' "$DOM" | head -c 800
          exit 1
        fi
    secrets: inherit

  # ---- production (reviewer-gated environment) -----------------------------
  zitadel-prod:
    needs: [deploy-nonprod]
    if: ${{ !cancelled() && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && ((github.event_name == 'push' && needs.deploy-nonprod.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: production
    secrets: inherit

  deploy-prod:
    needs: [build, verify-domain, deploy-nonprod, zitadel-prod]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify-domain.result == 'success' && needs.zitadel-prod.result != 'failure' && ((github.event_name == 'push' && needs.deploy-nonprod.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: oauth-user-inspector
      environment: production
      image-digest: ${{ needs.build.outputs.image-digest }}
      default-region: us-west1
      service-name: oauth-user-inspector
      pulumi-dir: oauth-user-inspector/infra/app
      env-prefix: OAUTH_USER_INSPECTOR
      # The app stack's Cloudflare provider (customDomain grey-cloud CNAME)
      # reads CLOUDFLARE_API_TOKEN fetched at runtime from the dev floating
      # project's Secret Manager (single source; the identity stack's
      # domainVerificationAnchor grants every env's deploy SA secretAccessor
      # on it). Never a GitHub secret (secrets model §pipeline-env).
      cloudflare-token-secret-project: prj-d-bu1-oss-floating-648a
      custom-smoke-script: |
        echo "Smoke-checking ${CAND}/"
        # 1) Reachable (HTTP 2xx).
        curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${CAND}/" >/dev/null
        # 2) The SPA actually MOUNTS (see the development smoke for rationale).
        CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || true)"
        if [ -z "$CHROME" ]; then
          echo "::error::no headless Chrome on the runner — cannot verify the app mounts"; exit 1
        fi
        DOM="$("$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "${CAND}/" 2>/dev/null || true)"
        if printf '%s' "$DOM" | grep -q "Select a provider"; then
          echo "Smoke OK: React app mounted."
        else
          echo "::error::App did NOT mount — served only the static fallback (broken frontend bundle)."
          printf '%s' "$DOM" | head -c 800
          exit 1
        fi
    secrets: inherit
