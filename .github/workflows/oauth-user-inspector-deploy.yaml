# OAuth User Inspector multi-env promotion chain (stage-5 OSS application
# stage): BUILD ONCE — the image is built and pushed a single time to the
# shared Artifact Registry in the infra-pipeline project by the ungated
# oauth-user-inspector-build environment — then the SAME immutable digest is
# PROMOTED dev (auto) -> nonproduction (reviewer-gated) -> production
# (reviewer-gated), each env landing in its prj-{env}-bu1-oss-floating
# project. Nothing is ever rebuilt per env.
#
# Before each env's app deploy, the zitadel-apps EXPAND step
# (_zitadel-apps-apply.yaml) registers that env's OIDC client + redirect URIs
# in the self-hosted Zitadel instance and syncs the client id/secret into the
# env's Secret Manager, so hosted login works on arrival.
#
# Per-environment identifiers (GCP_PROJECT_ID, GCP_DEPLOY_SERVICE_ACCOUNT,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_REGION) are environment-scoped Actions
# *variables* (repo_config oauthVars) — keyless WIF via the foundation-pool
# means none of them is a credential.
#
# DEPLOYMENT STRATEGY (repo-wide — docs/engineering/deployment-strategy.md):
#   - Push to main  -> deploy DEVELOPMENT only. main is the continuous-integration
#     surface; every merge lands on dev.
#   - Release-please release published (tag `oauth-user-inspector-v*`) -> promote
#     to NONPRODUCTION then PRODUCTION. Cutting a release (merging the app's
#     release-please PR) is the deliberate, reviewable promotion gate; a bare
#     merge never touches nonprod/prod.
#   - workflow_dispatch redeploys a SINGLE chosen environment (break-glass; it
#     rebuilds at the current sha and deploys just that env).
#
# A release-please PR is version-bump + changelog only, so the release commit is
# code-identical to what already soaked on dev; build-once-per-run then promotes
# ONE digest across nonprod+prod (build-once / promote-by-digest).

name: oauth-user-inspector-deploy

on:
  push:
    branches: [main]
    # No `paths:` filter (#1351): a workflow-level `push.paths` filter is
    # evaluated by GitHub from the SAME github.event.before..after range as
    # this app's old gate would have used, and that range is exactly what a
    # dropped run (this workflow's constant concurrency group + the
    # #1311/#1335 eviction mechanism) breaks -- GitHub filters, decides "no
    # match", and never starts a run at all, so the skipped commit's changes
    # are never in ANY future push's evaluated range unless a later,
    # unrelated commit happens to also touch these paths. That is a silent,
    # permanent skip with no gate job to even blame. The `gate` job below
    # replaces native path filtering with tools/ci/deploy-affected.sh in
    # PATH-ONLY MODE (no Bazel graph -- oauth-user-inspector builds STANDALONE,
    # its own Docker Buildx build + self-contained package.json, CATALOG_EXEMPT
    # in tools/conformance for exactly this reason) against a DURABLE diff
    # base (tools/ci/resolve-deploy-base.sh), which self-heals instead of
    # silently losing the range.
  # Promotion trigger. release-please (apps-release.yml) publishes a GitHub
  # Release when this app's release PR merges; that fires here and drives the
  # nonprod -> prod ladder. Filtered to this app's tag in each promotion job.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (single-env break-glass redeploy)
        type: choice
        required: true
        default: development
        options:
          - development
          - nonproduction
          - production

permissions:
  contents: read
  id-token: write

# One promotion chain at a time. All three envs now live in ONE run (the old
# per-env group let two runs race the shared build AR), so serialize the whole
# workflow; queued pushes coalesce onto the newest sha.
concurrency:
  group: oauth-user-inspector-deploy
  cancel-in-progress: false

jobs:
  # Render WHAT IS SHIPPING into the run page before the (gated) env deploys, so
  # an approver reads the actual scope. Ungated + independent, so it never delays
  # a rollout.
  #
  # The commit range is the authoritative half: `github.event.before..sha` is the
  # push being deployed, derived from git so it cannot drift. The changelog block
  # below it is the curated narrative (release-please-generated). Before #971 this
  # job rendered ONLY the changelog, which had sat unchanged for 69 commits — every
  # run told the approver the app had just been vendored.
  changelog:
    # Push-only: this renders the `github.event.before..sha` push range, which
    # does not exist on a release event (the release already carries its own
    # curated changelog).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # `git log <before>..<sha>` needs the history; the default depth-1
          # checkout would degrade every run to "scope could not be determined".
          fetch-depth: 0
      - name: What's shipping → step summary
        run: |
          bash tools/ci/changelog-summary.sh \
            oauth-user-inspector/CHANGELOG.md "" oauth-user-inspector \
            --range "${BEFORE}..${SHA}" --path oauth-user-inspector
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}

  # Gate (#1351): replaces the old workflow-level `push.paths` filter. Path-only
  # mode (tools/ci/deploy-affected.sh, DEPLOY_TARGETS unset) -- oauth-user-inspector
  # has no Bazel-graph-tracked deploy artifact, so EXTRA_PATH_REGEX /
  # EXCLUDE_PATH_REGEX below are the COMPLETE input set, carried over verbatim
  # from the old `paths:`/`!paths:` globs. No Bazel setup needed: path-only
  # mode never reaches the TD graph step. FAIL-OPEN: any uncertainty deploys.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # `actions: read` is the ONLY new grant this gate needs -- it lets
      # resolve-deploy-base.sh query this workflow's own run history via the
      # GitHub Actions API. No GCP IAM change: this job never talks to Cloud Run.
      actions: read
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the durable deploy base (#1351)
        id: durable-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: oauth-user-inspector-deploy.yaml
        run: bash tools/ci/resolve-deploy-base.sh
      - name: Decide whether the deploy artifacts are affected
        id: decide
        env:
          BEFORE_REV: ${{ steps.durable-base.outputs.base_sha || github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          # NOTE: "oauth-user-inspector/" already covers the co-located app
          # stack (oauth-user-inspector/infra/app). The identity stack is
          # carved out via EXCLUDE_PATH_REGEX below to preserve the pre-#1351
          # trigger set: identity changes never triggered a deploy when the
          # stack lived under infrastructure/pulumi/apps/.
          #
          # tools/deploy/ is the rollout sequencer this app's deploy actually
          # executes (_deploy-cloud-run.yaml runs `bazel run //tools/deploy:cloud-run`).
          EXTRA_PATH_REGEX: "oauth-user-inspector/|infrastructure/pulumi/platform/zitadel-apps/|tools/deploy/|\\.github/workflows/oauth-user-inspector-deploy\\.yaml|\\.github/workflows/_deploy-cloud-run\\.yaml|\\.github/workflows/_zitadel-apps-apply\\.yaml"
          EXCLUDE_PATH_REGEX: "oauth-user-inspector/infra/identity/"
        run: bash tools/ci/deploy-affected.sh

  # BUILD ONCE: push the image to the shared AR in the infra-pipeline project
  # (owned by the oauth-user-inspector-build stack) and capture the immutable
  # digest every env promotes. The build ENVIRONMENT is ungated (no reviewer),
  # but the JOB is scoped to this app: the `release:` trigger fires on EVERY
  # published release in the repo (GitHub offers no per-tag filter on the
  # `on: release` event), so without this guard the image rebuilt on every
  # unrelated component's release (foundation-*, tabula-*, ...), wasting a WIF
  # auth + buildx run and painting a false-red on that release's checks when the
  # build flaked. The promotion jobs below are already tag-filtered to
  # `oauth-user-inspector-v*`; match the build to the union of cases where its
  # digest is actually consumed (push, dispatch, or THIS app's release).
  build:
    needs: [gate]
    # `needs: [gate]` waits for gate to COMPLETE; gate's own `if` skips it
    # (result: skipped, not failure) for release/dispatch events, which does
    # not block this condition below -- mirrors tabula-deploy.yaml's build job.
    if: ${{ !cancelled() && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v')) || github.event_name == 'workflow_dispatch' || needs.gate.result == 'failure' || needs.gate.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: oauth-user-inspector-build
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (capture the digest)
        id: push
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/oauth-user-inspector/app"
          NODE_VERSION="$(cut -d. -f1 .nvmrc 2>/dev/null || echo 22)"
          docker buildx build --push \
            --build-arg NODE_VERSION="${NODE_VERSION}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            oauth-user-inspector/
          # Resolve the immutable digest from the registry (driver-agnostic,
          # vs. buildx --metadata-file which varies by builder): this exact
          # @sha256 ref is what every env deploys.
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "Built ${IMAGE}@${DIGEST}"
          echo "image-digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # NOTE: domain-ownership verification is PER-ENV and lives INSIDE
  # _deploy-cloud-run.yaml (the "Ensure custom-domain ownership" step): each
  # env's deploy SA SELF-verifies the zone via Site Verification DNS-TXT as
  # itself, right before its own `pulumi up` — ownership in that service is
  # per-caller, so a shared job auth'd as one env's SA cannot verify for the
  # others (and the API refuses owner-list delegation outright when an
  # external token-verified owner is present). There is deliberately NO
  # standalone verify-domain job here anymore.

  # ---- development (auto on push) ------------------------------------------
  # EXPAND (cf. principle §2.15) before each env's deploy. Gated on the
  # ZITADEL_APPS_AUTO_APPLY repo variable until the Zitadel machine-user key
  # and stack IDs are seeded; until then it cleanly no-ops rather than failing
  # the deploy. Each env's deploy tolerates its zitadel job being SKIPPED
  # (gated off) but not FAILED.
  zitadel-dev:
    if: ${{ vars.ZITADEL_APPS_AUTO_APPLY == 'true' && (github.event_name == 'push' || inputs.environment == 'development') }}
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: development
    secrets: inherit

  deploy-dev:
    needs: [build, zitadel-dev]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.zitadel-dev.result != 'failure' && (github.event_name == 'push' || inputs.environment == 'development') }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: oauth-user-inspector
      environment: development
      image-digest: ${{ needs.build.outputs.image-digest }}
      default-region: us-central1
      service-name: oauth-user-inspector
      # The app stack OWNS its Cloud Run service (core-vs-application split):
      # the foundation gcp-app-infra leaf is scaffolding-only and declares no
      # workload, so this stack runs the full blue-green (candidate → smoke →
      # promote) in its own dir (PHASE=all).
      workload-migrated: false
      pulumi-dir: oauth-user-inspector/infra/app
      env-prefix: OAUTH_USER_INSPECTOR
      # The app stack's Cloudflare provider (customDomain grey-cloud CNAME)
      # reads CLOUDFLARE_API_TOKEN fetched at runtime from the dev floating
      # project's Secret Manager (single source; the identity stack's
      # domainVerificationAnchor grants every env's deploy SA secretAccessor
      # on it). Never a GitHub secret (secrets model §pipeline-env).
      cloudflare-token-secret-project: prj-d-bu1-oss-floating-648a
      # Single source of truth: the local `:deploy` target reads the same file
      # (oauth-user-inspector/infra/app/BUILD custom_smoke_script_file).
      custom-smoke-script-file: oauth-user-inspector/infra/app/smoke.sh
    secrets: inherit

  # ---- nonproduction (release-gated: promoted only on an app release) -------
  # No longer cascades from a push. Triggers when THIS app's release-please PR
  # merges (release published with an `oauth-user-inspector-v*` tag), or via a
  # single-env workflow_dispatch. The release merge is the promotion gate, so
  # this environment carries no separate reviewer (production does).
  zitadel-nonprod:
    if: ${{ !cancelled() && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v')) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction')) }}
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-nonprod:
    needs: [build, zitadel-nonprod]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.zitadel-nonprod.result != 'failure' && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v')) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: oauth-user-inspector
      environment: nonproduction
      image-digest: ${{ needs.build.outputs.image-digest }}
      default-region: us-central1
      service-name: oauth-user-inspector
      # The app stack OWNS its Cloud Run service (core-vs-application split):
      # the foundation gcp-app-infra leaf is scaffolding-only and declares no
      # workload, so this stack runs the full blue-green (candidate → smoke →
      # promote) in its own dir (PHASE=all).
      workload-migrated: false
      pulumi-dir: oauth-user-inspector/infra/app
      env-prefix: OAUTH_USER_INSPECTOR
      # The app stack's Cloudflare provider (customDomain grey-cloud CNAME)
      # reads CLOUDFLARE_API_TOKEN fetched at runtime from the dev floating
      # project's Secret Manager (single source; the identity stack's
      # domainVerificationAnchor grants every env's deploy SA secretAccessor
      # on it). Never a GitHub secret (secrets model §pipeline-env).
      cloudflare-token-secret-project: prj-d-bu1-oss-floating-648a
      # Single source of truth: the local `:deploy` target reads the same file
      # (oauth-user-inspector/infra/app/BUILD custom_smoke_script_file).
      custom-smoke-script-file: oauth-user-inspector/infra/app/smoke.sh
    secrets: inherit

  # ---- production (release-gated + reviewer-gated final checkpoint) ---------
  # Same release trigger as nonprod, but LADDERED behind deploy-nonprod success
  # (nonprod smoke-gates prod within the release) AND the production environment
  # keeps a required reviewer — the one deliberate human checkpoint before prod.
  zitadel-prod:
    needs: [deploy-nonprod]
    if: ${{ !cancelled() && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v') && needs.deploy-nonprod.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: production
    secrets: inherit

  deploy-prod:
    needs: [build, deploy-nonprod, zitadel-prod]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.zitadel-prod.result != 'failure' && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v') && needs.deploy-nonprod.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: oauth-user-inspector
      environment: production
      image-digest: ${{ needs.build.outputs.image-digest }}
      default-region: us-central1
      service-name: oauth-user-inspector
      # The app stack OWNS its Cloud Run service (core-vs-application split):
      # the foundation gcp-app-infra leaf is scaffolding-only and declares no
      # workload, so this stack runs the full blue-green (candidate → smoke →
      # promote) in its own dir (PHASE=all).
      workload-migrated: false
      pulumi-dir: oauth-user-inspector/infra/app
      env-prefix: OAUTH_USER_INSPECTOR
      # The app stack's Cloudflare provider (customDomain grey-cloud CNAME)
      # reads CLOUDFLARE_API_TOKEN fetched at runtime from the dev floating
      # project's Secret Manager (single source; the identity stack's
      # domainVerificationAnchor grants every env's deploy SA secretAccessor
      # on it). Never a GitHub secret (secrets model §pipeline-env).
      cloudflare-token-secret-project: prj-d-bu1-oss-floating-648a
      # Single source of truth: the local `:deploy` target reads the same file
      # (oauth-user-inspector/infra/app/BUILD custom_smoke_script_file).
      custom-smoke-script-file: oauth-user-inspector/infra/app/smoke.sh
    secrets: inherit
