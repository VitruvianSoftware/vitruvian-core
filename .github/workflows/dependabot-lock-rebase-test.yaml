# Regression guard for tools/ci/dependabot-lock-rebase.sh — the loop that
# rebases every open Dependabot npm PR onto the just-merged root lock file.
# Hermetic: a real temp git repo (git merge/conflict-resolution is the thing
# under test) plus fake `gh` and `bazel` binaries — no network, no real Bazel.

name: Dependabot Lock Rebase Test

on:
  pull_request:
    paths:
      - "tools/ci/dependabot-lock-rebase.sh"
      - "tools/ci/dependabot-lock-rebase_test.sh"
      - ".github/workflows/dependabot-lock-rebase-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/dependabot-lock-rebase.sh"
      - "tools/ci/dependabot-lock-rebase_test.sh"
      - ".github/workflows/dependabot-lock-rebase-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the dependabot-lock-rebase script tests
        run: bash tools/ci/dependabot-lock-rebase_test.sh
