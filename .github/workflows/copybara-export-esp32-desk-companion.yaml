name: Copybara Export (esp32-desk-companion)

# EXPORT-ONLY mirror of the ESP32-S3 Desk Companion firmware: monorepo apps/embedded/esp32-s3/ ->
# VitruvianSoftware/esp32-desk-companion (repo root) on every push under that subtree. Thin
# caller -- logic lives in _copybara-export.yaml; the export_esp32_desk_companion workflow is
# defined in tools/copybara/copy.bara.sky.
#
# The mirror is the firmware's public source (MIT). Releases still ship from
# this repository; the mirror carries no release workflow.
on:
    push:
        branches: [main]
        paths: ["apps/embedded/esp32-s3/**", "tools/copybara/copy.bara.sky"]
    workflow_dispatch:
        inputs:
            copybara-options:
                description: "Copybara CLI options. First seed of the new EMPTY mirror: '--init-history --force --ignore-noop' (no MONOREPO_REV_ID baseline yet; SQUASH mode lands it as one commit). Normal runs: --ignore-noop."
                default: "--ignore-noop"
                required: false

permissions:
    contents: read

concurrency:
    group: copybara-export-esp32-desk-companion
    cancel-in-progress: false

jobs:
    export:
        uses: ./.github/workflows/_copybara-export.yaml
        with:
            component: esp32-desk-companion
            copybara-options: ${{ inputs['copybara-options'] || github.event.inputs['copybara-options'] || '--force --ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.ESP32_DESK_COMPANION_SYNC_SSH_KEY }}
