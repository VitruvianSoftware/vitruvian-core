# Tabula deploy: a THIN CALLER of the reusable blue-green pipeline
# (_deploy-cloud-run.yaml, #500) — Bazel rules_oci image -> Artifact Registry
# -> prisma migrate (vendored schema-engine, before traffic shifts) -> Pulumi
# candidate at 0% -> smoke -> promote to 100%. All pipeline mechanics live in
# the reusable workflow; this file owns only tabula's identity (targets,
# names, env prefix) and its trigger policy.
#
# DEPLOYMENT STRATEGY (repo-wide — docs/engineering/deployment-strategy.md):
#   - Push to main -> deploy DEVELOPMENT only, IFF the `gate` job finds the API
#     image (or extension bundle) affected. main is continuous-integration.
#   - `tabula-api` release-please PR merged (release published, tag
#     `tabula-api-v*`) -> promote NONPRODUCTION then PRODUCTION. Cutting the API
#     release is the deliberate promotion gate; a bare merge never leaves dev.
#   - workflow_dispatch redeploys a SINGLE chosen environment (break-glass).
#
# The image is built ONCE into bu2's shared Artifact Registry and the SAME
# immutable digest is promoted across the envs it deploys. A `tabula-api`
# release PR is version-bump-only, so the release commit is code-identical to
# what soaked on dev.

name: tabula-deploy

on:
  push:
    # No `paths:` filter (#498): trigger scope is decided by the `gate` job
    # below via the Bazel graph (target-determinator), not directory globs.
    # Globs UNDER-trigger (a shared-library change outside tabula/** never
    # redeployed the API -- the running service silently kept the stale
    # dependency) and OVER-trigger (docs/cli-only changes under tabula/**
    # rebuilt + redeployed the image needlessly).
    branches: [main]
  # Promotion trigger: release-please (tabula-release.yml) publishes a GitHub
  # Release when the `tabula-api` release PR merges; that fires here and drives
  # the nonprod -> prod ladder. Filtered to the `tabula-api-v*` tag per job.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (single-env break-glass redeploy)
        type: choice
        required: true
        default: development
        options:
          - development
          - nonproduction
          - production

permissions:
  contents: read
  id-token: write

# Concurrency is scoped per LANE, not the whole workflow, and lives HERE
# (workflow level) rather than on individual jobs: GitHub Actions rejects a
# `concurrency:` key on ANY job that also has `uses:` pointing at a reusable
# workflow -- confirmed empirically both ways chasing this exact fix (inside
# _deploy-cloud-run.yaml's own job, and on the calling job here), every
# dispatch failed instantly with no runner ever assigned. Workflow-level is
# the only placement that actually works, so per-service granularity is
# achieved by keying the ONE group on which lane this run is in instead:
#   - push                         -> "development"
#   - release (nonprod->prod ladder) -> "promote"
#   - workflow_dispatch            -> inputs.environment (development /
#                                      nonproduction / production)
# Concurrency serializes RUNS against each other, never jobs WITHIN one
# already-running run -- deploy-dev and deploy-dev-web (same run, same
# "development" group) still run in parallel; only a SECOND push run's
# deploy-dev would queue behind the first's. So a stuck production approval
# (lane "promote", or dispatch's "production") can only ever block another
# run in that SAME lane, never an unrelated development push.
#
# A residual, narrower race: a manual workflow_dispatch(nonproduction) (its
# own "nonproduction" group) is NOT serialized against a release run's
# nonprod stage (group "promote") even though both could touch the SAME live
# stack at once -- Pulumi's own per-stack state locking is the backstop
# there (a real concurrent `pulumi up` fails cleanly on a lock conflict,
# retry-able, rather than corrupting state). Accepted: still strictly safer
# than the incident this fixes, and a lane-keyed group is the only shape
# concurrency can take here at all.
#
# History: this used to be a single blanket `group: tabula-deploy` ("every
# run touches the same shared build AR, serialize everything"). That traded
# one bug for a worse one -- a tabula-api release's deploy-prod sat on its
# required-reviewer gate for the better part of an hour, and every push to
# main in the meantime got queued behind it and then evicted by the NEXT
# push (GitHub cancels a still-queued run when a newer one joins its group,
# same mechanism as ci.yaml's GO-2026-5841), so NOTHING reached development
# the whole time. The "shared build AR" concern that justified the blanket
# group was real but narrower than the fix: the `build` job's web-image step
# read its digest back via the mutable `:latest` tag, which two concurrent
# builds really could race. Fixed at the source below (SHA-tag it, like the
# API image already does) instead of papering over it with serialization --
# once no step here writes a shared mutable reference, `build` (and `gate`,
# `changelog`) need no cross-run serialization at all.
concurrency:
  group: deploy-tabula-${{ (github.event_name == 'push' && 'development') || (github.event_name == 'release' && 'promote') || inputs.environment }}
  cancel-in-progress: false

jobs:
  # Render tabula's latest changelog into the run page before the deploy, so an
  # approver reads what is shipping (the pulumi digest only renders after the
  # gate). Ungated + independent of the deploy, so it never delays a rollout.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Changelog → step summary
        run: bash tools/ci/changelog-summary.sh tabula/api/CHANGELOG.md "" tabula-api

  # Graph gate (#498): on push, deploy iff the diff affects a DEPLOYABLE
  # artifact. The universe is the union of both stamped artifacts -- the API
  # image AND the extension bundle -- because the dev banner clears only when
  # the published bundle's commit equals the deployed API's commit, so both
  # must re-stamp on any commit that moves either (the same coupling the old
  # path union encoded). Non-graph inputs (the tabula Pulumi program -- a
  # standalone Go module invisible to the Bazel graph -- and the two workflow
  # files) gate by path inside the script. FAIL-OPEN: any uncertainty deploys
  # (idempotent blue-green); only a confidently-unaffected diff skips.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # `actions: read` is the ONLY new grant this gate needs (#1351) -- it
      # lets resolve-deploy-base.sh query this workflow's own run history via
      # the GitHub Actions API. No GCP IAM change: this job never talks to
      # Cloud Run. It also does not need id-token: write (no GCP auth here).
      actions: read
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # TD diffs the pre-push tip; full history keeps it + the object
          # graph reachable (same invariant as ci.yaml's build-test).
          fetch-depth: 0
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      - name: Resolve the durable deploy base (#1351)
        id: durable-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: tabula-deploy.yaml
        run: bash tools/ci/resolve-deploy-base.sh
      - name: Decide whether the deploy artifacts are affected
        id: decide
        env:
          # A dropped run (constant concurrency group, #1311/#1335 eviction)
          # makes github.event.before alone unsafe -- it is the EVICTED run's
          # own push tip, a range no successor run ever re-diffs. Prefer the
          # durable base; fall back to today's behavior only when it could not
          # be resolved (empty is falsy in GH Actions expressions).
          BEFORE_REV: ${{ steps.durable-base.outputs.base_sha || github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          DEPLOY_TARGETS: "//tabula/api:image_push //tabula/extension:chrome_zip" # + tabula/web/Dockerfile
          # `tools/deploy/` is a NON-GRAPH deploy input for this gate: the TD
          # universe below is DEPLOY_TARGETS (image_push/chrome_zip), which does
          # not depend on the rollout sequencer //tools/deploy:cloud-run.sh, and
          # tools/deploy/ is allowlisted out of the global-impact guard in
          # tools/ci/deploy-affected.sh. Listing it here keeps a change to the
          # candidate -> smoke -> promote sequence forcing a real deploy.
          EXTRA_PATH_REGEX: "tabula/infra/app/|tabula/infra/web/|tabula/web/|tools/deploy/|\\.github/workflows/tabula-deploy\\.yaml|\\.github/workflows/tabula-dev-latest\\.yaml|\\.github/workflows/_deploy-cloud-run\\.yaml"
        run: bash tools/ci/deploy-affected.sh

  # BUILD ONCE into the shared bu2 Artifact Registry and capture the immutable
  # digest every environment promotes. Ungated: pushing an image touches no live
  # service. Replaces the previous rebuild-per-environment flow, where each env
  # built its own :$GITHUB_SHA tag — so what reached production was never the
  # artifact that was smoke-tested in development.
  build:
    needs: [gate]
    # Builds on: THIS app's release (promote path), a dispatch (break-glass), or
    # a push the gate found affected (or a gate that errored — fail-open). The
    # release tag guard matters because `on: release` fires on EVERY published
    # release in the repo (GitHub has no per-tag filter on the event); without
    # it the tabula image rebuilt on every unrelated component's release
    # (foundation-*, oauth-*, ...) — wasted compute, since deploy-nonprod/prod
    # below are already filtered to `tabula-api-v*`.
    if: ${{ always() && !cancelled() && ((github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'tabula-api-v') || startsWith(github.event.release.tag_name, 'tabula-web-v'))) || github.event_name == 'workflow_dispatch' || needs.gate.result == 'failure' || needs.gate.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: tabula-build
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
      web-image-digest: ${{ steps.web-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bazel

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (capture the digest)
        id: push
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/tabula/api"
          bazel run --config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //tabula/api:image_push -- \
            --repository "${IMAGE}" --tag "${GITHUB_SHA}" --tag latest
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "image-digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # ---- tabula/web (Docker, not Bazel) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push tabula-web image
        id: web-image
        run: |
          set -euo pipefail
          # Read the API URL for this environment from Pulumi config
          API_URL=$(grep 'tabula-app:apiUrl' tabula/infra/app/Pulumi.development.yaml | awk '{print $2}')
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/tabula/web"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${API_URL}" \
            -f tabula/web/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          # Resolve the digest via the immutable per-commit tag, NOT :latest --
          # :latest is a shared mutable reference two concurrent builds (this
          # job carries no cross-run concurrency guard, see the top-of-file
          # note) can overwrite between each other's push and inspect, handing
          # one run the OTHER run's digest. Matches the API image's push step
          # above, which already reads back via ${GITHUB_SHA} for the same
          # reason.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # Promote THAT digest, unchanged, through the ladder. development is
  # automatic; nonproduction and production gate on their GitHub Environment.
  deploy-dev:
    needs: [build]
    # Development deploys on push (when the gate found it affected) or a
    # single-env dispatch. Not on a release — that promotes nonprod/prod.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: tabula
      environment: development
      image-digest: ${{ needs.build.outputs.image-digest }}
      service-name: tabula-api
      # The app stack OWNS its Cloud Run service (core-vs-application split):
      # the foundation gcp-app-infra leaf is scaffolding-only and declares no
      # workload, so this stack runs the full blue-green (candidate → smoke →
      # promote) in its own dir (PHASE=all).
      workload-migrated: false
      pulumi-dir: tabula/infra/app
      cloudflare-token-secret-project: prj-d-bu2-oss-floating-c3d1
      secret-prefix: TABULA_
      # tabula's stack owns Cloud Run DomainMappings, which validate domain
      # ownership once at creation and then stick at Ready=False forever if the
      # deploying SA was not yet a verified owner. `up` alone can never heal
      # that (inputs still match, so it diffs clean); refresh lets a deleted
      # mapping be seen as gone and rebuilt.
      pulumi-refresh: true
      env-prefix: TABULA
      default-region: us-central1
      run-migrations: true
      # Skip the whole migrate + blue-green when the live service already
      # serves this exact digest+config (fail-open; tools/ci/tabula-deploy-preflight.sh).
      skip-if-unchanged: true
      smoke-url-path: /health
    secrets: inherit

  deploy-dev-web:
    needs: [build]
    # Development deploys on push (when the gate found it affected) or a
    # single-env dispatch. Not on a release — that promotes nonprod/prod.
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: tabula
      environment: development
      image-digest: ${{ needs.build.outputs.web-image-digest }}
      service-name: tabula-web
      workload-migrated: false
      pulumi-dir: tabula/infra/web
      cloudflare-token-secret-project: prj-d-bu2-oss-floating-c3d1
      secret-prefix: TABULA_
      pulumi-refresh: true
      env-prefix: TABULA_WEB
      default-region: us-central1
      run-migrations: false
      skip-if-unchanged: false
      smoke-url-path: /
    secrets: inherit

  # ---- nonproduction (release-gated: promoted on a tabula-api or tabula-web release) --
  # No longer cascades from a push. Triggers when a tabula release-please
  # PR merges (release published, tag `tabula-api-v*` or `tabula-web-v*`) or via a
  # single-env dispatch. The release merge is the gate, so this env carries no reviewer.
  deploy-nonprod:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'tabula-api-v') || startsWith(github.event.release.tag_name, 'tabula-web-v'))) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: tabula
      environment: nonproduction
      image-digest: ${{ needs.build.outputs.image-digest }}
      service-name: tabula-api
      # The app stack OWNS its Cloud Run service (core-vs-application split):
      # the foundation gcp-app-infra leaf is scaffolding-only and declares no
      # workload, so this stack runs the full blue-green (candidate → smoke →
      # promote) in its own dir (PHASE=all).
      workload-migrated: false
      pulumi-dir: tabula/infra/app
      cloudflare-token-secret-project: prj-d-bu2-oss-floating-c3d1
      secret-prefix: TABULA_
      # tabula's stack owns Cloud Run DomainMappings, which validate domain
      # ownership once at creation and then stick at Ready=False forever if the
      # deploying SA was not yet a verified owner. `up` alone can never heal
      # that (inputs still match, so it diffs clean); refresh lets a deleted
      # mapping be seen as gone and rebuilt.
      pulumi-refresh: true
      env-prefix: TABULA
      default-region: us-central1
      run-migrations: true
      # Skip the whole migrate + blue-green when the live service already
      # serves this exact digest+config (fail-open; tools/ci/tabula-deploy-preflight.sh).
      skip-if-unchanged: true
      smoke-url-path: /health
    secrets: inherit

  deploy-nonprod-web:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'tabula-api-v') || startsWith(github.event.release.tag_name, 'tabula-web-v'))) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: tabula
      environment: nonproduction
      image-digest: ${{ needs.build.outputs.web-image-digest }}
      service-name: tabula-web
      workload-migrated: false
      pulumi-dir: tabula/infra/web
      cloudflare-token-secret-project: prj-d-bu2-oss-floating-c3d1
      secret-prefix: TABULA_
      pulumi-refresh: true
      env-prefix: TABULA_WEB
      default-region: us-central1
      run-migrations: false
      skip-if-unchanged: false
      smoke-url-path: /
    secrets: inherit

  # ---- production (release-gated + reviewer-gated final checkpoint) ---------
  # Same release trigger as nonprod, LADDERED behind deploy-nonprod success, and
  # the production environment keeps its required reviewer.
  deploy-prod:
    needs: [build, deploy-nonprod]
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'tabula-api-v') || startsWith(github.event.release.tag_name, 'tabula-web-v')) && needs.deploy-nonprod.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: tabula
      environment: production
      image-digest: ${{ needs.build.outputs.image-digest }}
      service-name: tabula-api
      # The app stack OWNS its Cloud Run service (core-vs-application split):
      # the foundation gcp-app-infra leaf is scaffolding-only and declares no
      # workload, so this stack runs the full blue-green (candidate → smoke →
      # promote) in its own dir (PHASE=all).
      workload-migrated: false
      pulumi-dir: tabula/infra/app
      cloudflare-token-secret-project: prj-d-bu2-oss-floating-c3d1
      secret-prefix: TABULA_
      # tabula's stack owns Cloud Run DomainMappings, which validate domain
      # ownership once at creation and then stick at Ready=False forever if the
      # deploying SA was not yet a verified owner. `up` alone can never heal
      # that (inputs still match, so it diffs clean); refresh lets a deleted
      # mapping be seen as gone and rebuilt.
      pulumi-refresh: true
      env-prefix: TABULA
      default-region: us-central1
      run-migrations: true
      # Skip the whole migrate + blue-green when the live service already
      # serves this exact digest+config (fail-open; tools/ci/tabula-deploy-preflight.sh).
      skip-if-unchanged: true
      smoke-url-path: /health
    secrets: inherit

  deploy-prod-web:
    needs: [build, deploy-nonprod-web]
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'tabula-api-v') || startsWith(github.event.release.tag_name, 'tabula-web-v')) && needs.deploy-nonprod-web.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: tabula
      environment: production
      image-digest: ${{ needs.build.outputs.web-image-digest }}
      service-name: tabula-web
      workload-migrated: false
      pulumi-dir: tabula/infra/web
      cloudflare-token-secret-project: prj-d-bu2-oss-floating-c3d1
      secret-prefix: TABULA_
      pulumi-refresh: true
      env-prefix: TABULA_WEB
      default-region: us-central1
      run-migrations: false
      skip-if-unchanged: false
      smoke-url-path: /
    secrets: inherit
