# Tabula staging deploy: Bazel-built OCI image -> Artifact Registry ->
# prisma migrate deploy (vendored schema-engine, before traffic shifts) ->
# Pulumi rollout. Replaces the old buildpack-based `gcloud run deploy --source`.
#
# Required repo secrets (carried over from BlueCentre/tabula):
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID
#   PULUMI_ACCESS_TOKEN (Pulumi Cloud backend)

name: tabula-deploy-staging

on:
  push:
    branches: [main]
    paths:
      - "tabula/api/**"
      - "tabula/shared/**"
      - "infrastructure/pulumi/tabula/**"
      - ".github/workflows/tabula-deploy-staging.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tabula-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          bazel run //tabula/api:image_push -- \
            --repository "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/tabula/api" \
            --tag "${GITHUB_SHA}" --tag latest

      - name: Run database migrations
        # Before the new revision takes traffic; vendored schema-engine keeps
        # this hermetic apart from the database connection itself.
        run: |
          bazel build //tabula/api:schema_engine //tabula/api:migrate_deploy_bin
          export PRISMA_SCHEMA_ENGINE_BINARY="$PWD/bazel-bin/tabula/api/schema-engine"
          export PRISMA_QUERY_ENGINE_LIBRARY="$PWD/tabula/api/prisma/engine-placeholder"
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$GCP_PROJECT_ID")"
          bazel run //tabula/api:migrate_deploy_bin -- --schema tabula/api/prisma/schema.prisma

      - name: Install Pulumi
        uses: pulumi/actions@v6

      - name: Deploy Cloud Run via Pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: infrastructure/pulumi/tabula
        run: |
          pulumi stack select staging --create
          pulumi config set tabula:project "$GCP_PROJECT_ID"
          pulumi config set tabula:environment stg
          pulumi config set tabula:imageTag "$GITHUB_SHA"
          pulumi up --yes

      - name: Smoke check
        working-directory: infrastructure/pulumi/tabula
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          URL="$(pulumi stack output serviceUrl)"
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "$URL/health"
