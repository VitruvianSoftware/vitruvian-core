# Guard for .claude/session-start.sh, the one SessionStart hook for cloud
# sessions. It runs cloud-bootstrap.sh, tailscale-up.sh and kube-setup.sh in
# order, because each needs what the one before it made, and Claude Code runs an
# event's hooks in parallel. The test checks the order on fake steps, and that
# settings.json runs the wrapper and none of the steps as a hook of its own.
name: Session Start Hook Test

on:
  pull_request:
    paths:
      - ".claude/session-start.sh"
      - ".claude/settings.json"
      - ".claude/tailscale-up.sh"
      - ".claude/kube-setup.sh"
      - "tools/cloud-bootstrap/cloud-bootstrap.sh"
      - "tools/ci/session-start_test.sh"
      - ".github/workflows/session-start-test.yaml"
  push:
    branches: [main]
    paths:
      - ".claude/session-start.sh"
      - ".claude/settings.json"
      - ".claude/tailscale-up.sh"
      - ".claude/kube-setup.sh"
      - "tools/cloud-bootstrap/cloud-bootstrap.sh"
      - "tools/ci/session-start_test.sh"
      - ".github/workflows/session-start-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the session-start hook tests
        run: bash tools/ci/session-start_test.sh
