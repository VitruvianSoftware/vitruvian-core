# A workflow that checks out without keeping credentials and then pushes to
# the origin remote fails with "could not read Username". Any workflow change
# re-runs the guard.
name: Workflow Git Push Credentials Test

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/ci/workflow-git-push-credentials_test.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/ci/workflow-git-push-credentials_test.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows that push have git credentials
        run: bash tools/ci/workflow-git-push-credentials_test.sh
