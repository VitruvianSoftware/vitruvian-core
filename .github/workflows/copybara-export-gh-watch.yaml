name: Copybara Export (gh-watch)

# EXPORT-ONLY mirror: monorepo apps/desktop/antigravity/plugins/gh-watch/ ->
# VitruvianSoftware/gh-watch (repo root) on every push under that subtree. Thin
# caller -- logic lives in _copybara-export.yaml; the export_gh_watch workflow
# is defined in tools/copybara/copy.bara.sky.
#
# The mirror is how people outside this repository install the plugin:
#   agy plugin install https://github.com/VitruvianSoftware/gh-watch
# so the plugin folder has to land at the mirror's root, plugin.json on top. A
# green run here means "pushed to the mirror".
on:
    push:
        branches: [main]
        paths: ["apps/desktop/antigravity/plugins/gh-watch/**", "tools/copybara/copy.bara.sky"]
    workflow_dispatch:
        inputs:
            copybara-options:
                description: "Copybara CLI options. Re-seed a lost MONOREPO_REV_ID baseline with '--init-history --force --ignore-noop' (SQUASH mode lands it as one commit)."
                default: "--ignore-noop"
                required: false

permissions:
    contents: read

concurrency:
    group: copybara-export-gh-watch
    cancel-in-progress: false

jobs:
    export:
        uses: ./.github/workflows/_copybara-export.yaml
        with:
            component: gh-watch
            copybara-options: ${{ inputs['copybara-options'] || github.event.inputs['copybara-options'] || '--force --ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.GH_WATCH_SYNC_SSH_KEY }}
