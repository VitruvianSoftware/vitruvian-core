name: Tidy Check

# Fails the PR when BUILD files are stale (gazelle) or unformatted. The single
# remediation is `bazel run //:tidy`. Complements Aspect Workflows' build/test CI.
on:
  push:
    branches: [main]
  pull_request:
  # Required status check: must report on the merge queue's `merge_group` event
  # (repo_config gates the queue on this job) or the queue would hang pending.
  merge_group:

permissions:
  contents: read

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tidy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The relevant-paths gate (below) diffs HEAD against a base commit (the
          # PR merge-base, the pre-push tip, or the merge_group base_sha), so that
          # base must be present locally. The default shallow fetch (depth 1)
          # lacks it; full history makes every base reliable.
          fetch-depth: 0

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `tidy-check` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever. Instead we keep triggering on
      # every event and make the heavy steps no-op to success in seconds when the
      # diff is docs/gitops/markdown-only. Native git diff -- no third-party
      # action.
      #
      # This runs on merge_group too (#822): the full-repo gazelle + pnpm resolve
      # is the biggest per-queued-PR cost, and a docs/gitops-only queued PR has
      # nothing for //:tidy to reformat or gazelle to regenerate. relevant-paths
      # FAILS SAFE (any diff it cannot compute -> relevant=true -> run), and the
      # job still runs + reports either way, so the required check never wedges.
      # Same base-resolution build-test already uses on merge_group (base_sha).
      - name: Gate on changed paths
        id: gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE_REV: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: bash tools/ci/relevant-paths.sh

      # Free disk BEFORE any Bazel work — same reclaim set + rationale as
      # ci.yaml's build-test (#404/#374 hit "No space left on device" fetching
      # the LLVM toolchain; this lane hit the identical failure extracting
      # LLVM-19.1.7 once the resynced npm lock grew the fetch set). Android
      # SDK is kept: rules_android aborts analysis without it.
      - name: Free up runner disk space
        if: steps.gate.outputs.relevant != 'false'
        run: |
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          echo "Disk after cleanup:" && df -h /

      - name: Install Bazel
        if: steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/setup-bazel

      # Reuse the EXTRACTED llvm toolchain that ci.yaml's build-test already
      # caches (#1039). This lane loads the same 64k-target graph and so fetches
      # the same toolchain, and it was paying full uncached extraction on every
      # run: measured 151-168s of "Extracting LLVM-19.1.7-Linux-X64.tar.xz" in
      # run 31166051613, out of 307s for the whole `bazel run //:tidy` step --
      # more than half of the second-slowest required check. In the same CI run,
      # build-test restored this cache and extracted LLVM zero times.
      #
      # RESTORE-ONLY, deliberately: build-test owns the save (in setup-bazel's
      # post step, on a key miss), and the entry already exists at 2.2GB. Reading
      # it here therefore adds NOTHING to the repo's 10GB Actions cache budget --
      # which matters, because that budget is why the entry caches only llvm's
      # content-hash subtree rather than the whole 3.81GB contents tree.
      #
      # Path and key must stay identical to ci.yaml's copy or this silently
      # reverts to uncached extraction; the tripwire below makes that loud. On a
      # miss (e.g. a MODULE.bazel bump before build-test has re-saved) the lane
      # just extracts as it does today -- slower, never broken.
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        if: steps.gate.outputs.relevant != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/bazel-repo/contents/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          key: llvm-contents-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}

      # Tripwire: a cache HIT that restored an empty tree means the content-hash
      # pin above has gone stale (llvm bumped in MODULE.bazel), and the only
      # symptom would otherwise be this lane quietly getting ~150s slower again.
      # Warn, never fail -- being slow is not a reason to redden a required check.
      - name: Check the LLVM cache pin is still live
        if: steps.gate.outputs.relevant != 'false' && steps.llvm-contents.outputs.cache-hit == 'true'
        run: |
          PIN=/home/runner/.cache/bazel-repo/contents/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          if [ "$(find "$PIN" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l | tr -d ' ')" = "0" ]; then
            echo "::warning title=llvm-contents pin stale::restored an empty tree; re-pin the content hash in tidy-check.yaml AND ci.yaml (this lane is back to uncached LLVM extraction, ~150s)"
          fi

      - name: Run //:tidy and verify the tree is clean
        if: steps.gate.outputs.relevant != 'false'
        run: |
          bazel run //:tidy
          changed="$(git status --porcelain -- ':!MODULE.bazel.lock')"
          if [ -n "$changed" ]; then
            echo "::error::BUILD files are stale or unformatted. Run 'bazel run //:tidy' and commit the result."
            echo "$changed"
            git diff -- ':!MODULE.bazel.lock'
            exit 1
          fi

      # MODULE.bazel.lock freshness (#1267). The step above deliberately
      # EXCLUDES MODULE.bazel.lock from its clean-tree assertion (`bazel run
      # //:tidy` does not regenerate it), so until now nothing gated Bazel
      # module-lock drift at all -- a MODULE.bazel edit could land with a lock
      # that never resolved it.
      #
      # The upstream preset ships `common:ci --lockfile_mode=error` for exactly
      # this, but nothing passes `--config=ci`, so it has never applied (see the
      # note at the top of .bazelrc). Enforced here as its own step rather than
      # as a global CI flag ON PURPOSE: `bazel mod tidy` in
      # dependabot-bazel-reconcile.yml must still be able to WRITE the lockfile,
      # and a repo-wide --lockfile_mode=error would block it.
      #
      # `bazel mod graph` only does module resolution -- no analysis, no
      # toolchain fetch -- so this is seconds, not minutes. Verified both ways:
      # exit 0 against a current lock, exit 37 ("Missing checksum for registry
      # file ... not permitted with --lockfile_mode=error") against a drifted one.
      - name: MODULE.bazel.lock is in sync with MODULE.bazel
        if: steps.gate.outputs.relevant != 'false'
        run: |
          if ! bazel mod graph --lockfile_mode=error --depth=1 >/dev/null; then
            echo "::error::MODULE.bazel.lock is out of date. Run 'bazel mod deps --lockfile_mode=update' and commit MODULE.bazel.lock."
            exit 1
          fi

      # Lockfile/manifest sync guard (#523 fallout). Dependabot PRs carry a
      # pnpm-lock.yaml diff generated BEFORE the merge queue rebases them; when
      # grouped/parallel dep PRs land in one queue window, main can end up with
      # manifests the lock never resolved (it happened: @types/chrome ^0.2.2
      # and @fastify/rate-limit ^11 in manifests while the lock pinned the old
      # majors -- CI stayed green against the STALE lock, and the type/runtime
      # breakage only detonated on the next innocent `pnpm install`). This
      # step re-resolves with the SAME hermetic pnpm Bazel uses and fails when
      # the committed lock does not match the manifests.
      - name: pnpm lockfile is in sync with the manifests
        if: steps.gate.outputs.relevant != 'false'
        run: |
          bazel run -- @pnpm//:pnpm install --dir "$PWD" --lockfile-only
          if ! git diff --exit-code -- pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of sync with the package.json manifests (a dependency PR merged with a stale lock diff). Run 'bazel run -- @pnpm//:pnpm install --dir . --lockfile-only' and commit the result -- and check whether the newly-resolved versions actually build (this skew has hidden real breakage before)."
            exit 1
          fi
