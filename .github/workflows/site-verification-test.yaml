# Regression guard for tools/ci/ensure-site-verification.sh — the automated
# Google domain-ownership verification the oauth-user-inspector build job runs
# before any env's Cloud Run DomainMapping deploy. The test is hermetic: it
# drives the real script against a local mock of the Site Verification,
# Cloudflare, and DoH APIs (no credentials, no network), asserting the
# bootstrap convergence, strict idempotence (second run performs zero writes),
# and the no-customDomain no-op gate.

name: Site Verification Test

on:
  pull_request:
    paths:
      - "tools/ci/ensure-site-verification.sh"
      - "tools/ci/ensure-site-verification_test.sh"
      - ".github/workflows/site-verification-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/ensure-site-verification.sh"
      - "tools/ci/ensure-site-verification_test.sh"
      - ".github/workflows/site-verification-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run the site-verification script tests
        run: bash tools/ci/ensure-site-verification_test.sh
