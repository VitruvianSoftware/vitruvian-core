name: Repo Config Apply

# Gated apply-on-merge for the repo_config Pulumi module.
#
# When enabled, runs `pulumi up` against the repo_config stack on pushes to the
# default branch that touch the module, applying the GitHub-settings change that
# was reviewed via the separate preview workflow on the pull request.
#
# DISABLED BY DEFAULT — opt in by setting the repository variable
# REPO_CONFIG_AUTO_APPLY=true (Settings -> Secrets and variables -> Actions ->
# Variables). Uses the same shared GitHub App credentials as the preview
# workflow: set its app id in the PULUMI_APP_ID variable and its private key in
# the APP_PRIVATE_KEY secret, plus PULUMI_ACCESS_TOKEN for the Pulumi backend.
on:
    push:
        # repo_config's Pulumi default branch is "main". GitHub Actions `on:`
        # triggers cannot use ${{ }} expressions, so this is the literal
        # branch name — repos whose default branch isn't "main" should edit this
        # list to match.
        branches: ["main"]
        # repo_config compiles + deploys the shared pkg/secrets it imports (local
        # `replace` in go.mod), so a pkg/secrets change must also preview/apply here.
        paths:
            - "infrastructure/pulumi/platform/repo_config/**"
            - "infrastructure/pulumi/pkg/secrets/**"
    # Manual apply: break-glass + the bootstrap run that first applies the
    # pipeline-gate variables (which include REPO_CONFIG_AUTO_APPLY itself).
    # Bypasses the variable gate below — a dispatch is an explicit human act.
    workflow_dispatch:

permissions:
    contents: read

# Serialize applies (#499): this stack owns the merge-queue / required-check /
# branch-protection config everyone depends on. Without a concurrency group,
# two rapid merges touching repo_config could race `pulumi up` — the Pulumi
# backend lock makes the loser ERROR (it does not queue), leaving main's
# governance config half-applied until someone notices. cancel-in-progress
# stays false: an apply must never be killed mid-flight.
concurrency:
    group: repo-config-apply
    cancel-in-progress: false

jobs:
    apply:
        if: ${{ github.event_name == 'workflow_dispatch' || vars.REPO_CONFIG_AUTO_APPLY == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - name: Install Bazel
              uses: ./.github/actions/setup-bazel

            - name: Mint a GitHub App token for the Pulumi GitHub provider
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.PULUMI_APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Pulumi up (repo_config)
              id: pulumi
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_OWNER: ${{ github.repository_owner }}
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  # Injected (never committed) so repo_config can set the Dependabot
                  # BUILDBUDDY_API_KEY secret without a secure: value in git (#456).
                  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
                  # Same pattern: repo_config mirrors this into the Dependabot store
                  # so the preview leg can mint its App token on Dependabot PRs. The
                  # App token minted above is NOT a substitute -- that is a derived,
                  # hour-lived installation token; the Dependabot secret needs the
                  # key itself, which only this secret carries.
                  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
              run: |
                  # +e to capture pulumi's real exit code for the digest below.
                  set +e -u -o pipefail
                  # --config=remotecache-ci: BUILDBUDDY_API_KEY is already in this
                  # step's env (:89) but was never passed to bazel, so the apply
                  # rebuilt the Pulumi program cold every run. Cache-only (no
                  # remote execution) and semantically inert for the apply itself.
                  bazel run --config=remotecache-ci \
                      --remote_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY}" \
                      //infrastructure/pulumi/platform/repo_config:up -- --stack dev --yes \
                      2>&1 | tee /tmp/apply-raw.txt
                  ec="${PIPESTATUS[0]}"
                  echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
                  exit "${ec}"

            # Digest of the apply (creates/updates/replaces/deletes, destructive
            # flagged) on the Actions run summary. No PR on a push, so summary only.
            - name: Pulumi digest → step summary
              if: ${{ always() }}
              uses: ./.github/actions/pulumi-summary
              with:
                  label: repo_config
                  out-file: /tmp/apply-raw.txt
                  exit-code: ${{ steps.pulumi.outputs.exit_code }}
