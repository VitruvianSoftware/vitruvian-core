name: Repo Config Apply

# Gated apply-on-merge for the repo-config Pulumi module.
#
# When enabled, runs `pulumi up` against the repo-config stack on pushes to the
# default branch that touch the module, applying the GitHub-settings change that
# was reviewed via the separate preview workflow on the pull request.
#
# DISABLED BY DEFAULT — opt in by setting the repository variable
# REPO_CONFIG_AUTO_APPLY=true (Settings -> Secrets and variables -> Actions ->
# Variables). Uses the same shared GitHub App credentials as the preview
# workflow: its private key in the APP_PRIVATE_KEY secret, plus
# PULUMI_ACCESS_TOKEN for the Pulumi backend. The App is identified by its
# CLIENT id (#993) -- committed as the default, overridable via the
# PULUMI_APP_CLIENT_ID variable. PULUMI_APP_ID is no longer read here.
on:
    push:
        # repo-config's Pulumi default branch is "main". GitHub Actions `on:`
        # triggers cannot use ${{ }} expressions, so this is the literal
        # branch name — repos whose default branch isn't "main" should edit this
        # list to match.
        branches: ["main"]
        # All repo-config code (including internal/copybara_sync and
        # internal/secrets) lives under this one path.
        paths:
            - "infrastructure/pulumi/platform/repo-config/**"
    # Manual apply: break-glass + the bootstrap run that first applies the
    # pipeline-gate variables (which include REPO_CONFIG_AUTO_APPLY itself).
    # Bypasses the variable gate below — a dispatch is an explicit human act.
    workflow_dispatch:

permissions:
    contents: read

# Serialize applies (#499): this stack owns the merge-queue / required-check /
# branch-protection config everyone depends on. Without a concurrency group,
# two rapid merges touching repo-config could race `pulumi up` — the Pulumi
# backend lock makes the loser ERROR (it does not queue), leaving main's
# governance config half-applied until someone notices. cancel-in-progress
# stays false: an apply must never be killed mid-flight.
concurrency:
    group: repo-config-apply
    cancel-in-progress: false

jobs:
    apply:
        if: ${{ github.event_name == 'workflow_dispatch' || vars.REPO_CONFIG_AUTO_APPLY == 'true' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Install Bazel
              uses: ./.github/actions/setup-bazel

            - name: Mint a GitHub App token for the Pulumi GitHub provider
              id: app-token
              uses: ./.github/actions/mint-pulumi-app-token
              with:
                  client-id: ${{ vars.PULUMI_APP_CLIENT_ID }} # var wins so //tools/pulumi:create-app can rebootstrap; empty falls back to the composite's default id
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }} # org-scoped: copybara sync manages deploy keys on standalone repos

            # Installed explicitly: ubuntu-24.04 shipped a Pulumi CLI in the runner
            # image and this job silently relied on it; ubuntu-26.04 does not ship one.
            - name: Install Pulumi
              uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

            - name: Pulumi up (repo-config)
              id: pulumi
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_OWNER: ${{ github.repository_owner }}
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  # Injected (never committed) so repo-config can set the Dependabot
                  # BUILDBUDDY_API_KEY secret without a secure: value in git (#456).
                  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
                  # Same pattern: repo-config mirrors this into the Dependabot store
                  # so the preview leg can mint its App token on Dependabot PRs. The
                  # App token minted above is NOT a substitute -- that is a derived,
                  # hour-lived installation token; the Dependabot secret needs the
                  # key itself, which only this secret carries.
                  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
                  # Copybara sync auth (consolidated from vitruvian-core-infra):
                  # shared sync App creds, injected from pipeline secrets.
                  SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
                  SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
                  # The vitruviansoftware.dev website's custom domain
                  # (internal/site_domain): two Cloudflare records and the
                  # mirror repo's Pages setting. DORMANT unless the repo variable
                  # SITE_DOMAIN_MANAGED is "true". Once on it must stay on: an
                  # undeclared resource is deleted, and protect makes that a
                  # failed run instead.
                  SITE_DOMAIN_MANAGED: ${{ vars.SITE_DOMAIN_MANAGED }}
                  # Zone-scoped DNS:Edit token (Bitwarden item
                  # vitruvian-core/cloudflare-dns-token). Distinct secret name on
                  # purpose, so no other workflow picks it up by accident.
                  CLOUDFLARE_API_TOKEN: ${{ secrets.DNS_CLOUDFLARE_API_TOKEN }}
                  # CI telemetry webhook secret (cicd_webhook), from
                  # //tools/gitops:rotate-github-otel-webhook-secret. REQUIRED:
                  # without it the run fails rather than deleting the webhook.
                  OTEL_GITHUB_WEBHOOK_SECRET: ${{ secrets.OTEL_GITHUB_WEBHOOK_SECRET }}
              run: |
                  # +e to capture pulumi's real exit code for the digest below.
                  set +e -u -o pipefail
                  # --config=remotecache-ci: BUILDBUDDY_API_KEY is already in this
                  # step's env (:89) but was never passed to bazel, so the apply
                  # rebuilt the Pulumi program cold every run. Cache-only (no
                  # remote execution) and semantically inert for the apply itself.
                  bazel run --config=remotecache-ci \
                      --remote_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY}" \
                      //infrastructure/pulumi/platform/repo-config:up -- --stack dev --yes \
                      2>&1 | tee /tmp/apply-raw.txt
                  ec="${PIPESTATUS[0]}"
                  echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
                  echo "exit-code=${ec}" >> "${GITHUB_OUTPUT}"
                  exit "${ec}"

            # Fork PRs from every outside contributor need a maintainer's approval
            # before their workflows run. The repo is public and is getting
            # self-hosted runners for the merge queue
            # (docs/superpowers/specs/2026-10-19-queue-runners-on-homelab-design.md
            # §5): a fork PR runs ITS copy of the workflows, so without approval
            # it could point a job at those runners. The Pulumi GitHub provider
            # has no resource for this setting, so it is set here, after the
            # apply, and read back: a run that did not take it fails.
            - name: Require approval for every outside contributor's fork PR workflows
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  gh api -X PUT "repos/${REPO}/actions/permissions/fork-pr-contributor-approval" \
                      -f approval_policy=all_external_contributors
                  # GitHub serves the old value for a few seconds after the PUT:
                  # on 2026-10-19 the first read said first_time_contributors
                  # while the setting had taken. Read until it shows, up to 60 s.
                  for _ in $(seq 1 12); do
                      policy="$(gh api "repos/${REPO}/actions/permissions/fork-pr-contributor-approval" --jq .approval_policy)"
                      [ "${policy}" = all_external_contributors ] && break
                      sleep 5
                  done
                  if [ "${policy}" != all_external_contributors ]; then
                      echo "::error::fork PR approval is '${policy}', not all_external_contributors"
                      exit 1
                  fi
                  echo "fork PR approval: ${policy}"

            # The "Sponsor" button: GitHub shows it from a repository's
            # .github/FUNDING.yml only while the repository's Sponsorships
            # feature is on. The Pulumi GitHub provider has no setting for that
            # either (pulumi-github v6.15.0 has no sponsorship field), so it is
            # turned on here through GraphQL's updateRepository, for every
            # repository in sponsor-button-repos.txt, and read back. A listed
            # FUNDING.yml that is missing, or a setting that did not take, fails
            # the run.
            - name: Turn on the Sponsor button for the repositories that have one
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  OWNER: ${{ github.repository_owner }}
                  LIST: infrastructure/pulumi/platform/repo-config/sponsor-button-repos.txt
              run: |
                  set -euo pipefail
                  failed=0
                  while read -r repo funding _; do
                      case "${repo}" in "" | "#"*) continue ;; esac
                      if [ ! -f "${funding}" ]; then
                          echo "::error::${repo}: ${funding} is missing; the button would open nothing"
                          failed=1
                          continue
                      fi
                      id="$(gh api graphql -f owner="${OWNER}" -f name="${repo}" \
                          -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }' \
                          --jq .data.repository.id < /dev/null)"
                      on="$(gh api graphql -f id="${id}" \
                          -f query='mutation($id: ID!) { updateRepository(input: {repositoryId: $id, hasSponsorshipsEnabled: true}) { repository { hasSponsorshipsEnabled } } }' \
                          --jq .data.updateRepository.repository.hasSponsorshipsEnabled < /dev/null)"
                      if [ "${on}" != true ]; then
                          echo "::error::${repo}: Sponsorships is '${on}' after the update, not true"
                          failed=1
                          continue
                      fi
                      echo "${repo}: Sponsorships on"
                  done < "${LIST}"
                  exit "${failed}"

            # Digest of the apply (creates/updates/replaces/deletes, destructive
            # flagged) on the Actions run summary. No PR on a push, so summary only.
            - name: Pulumi digest → step summary
              if: ${{ always() }}
              uses: ./.github/actions/pulumi-summary
              with:
                  label: repo-config
                  out-file: /tmp/apply-raw.txt
                  exit-code: ${{ steps.pulumi.outputs['exit-code'] || steps.pulumi.outputs.exit_code }}
