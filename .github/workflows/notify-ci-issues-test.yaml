# Regression guard for tools/ci/notify-ci-issues.sh — the three polling loops
# (stuck approvals, stuck run-start approvals, main-branch failures) feeding
# the shared ntfy notify() helper. Hermetic: fake `gh api` (canned JSON, real
# jq does the actual filtering/grouping) and fake `curl` (captures the POST
# body instead of sending it) — no network, no credentials.

name: Notify CI Issues Test

on:
  pull_request:
    paths:
      - "tools/ci/notify-ci-issues.sh"
      - "tools/ci/notify-ci-issues_test.sh"
      - ".github/workflows/notify-ci-issues-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/notify-ci-issues.sh"
      - "tools/ci/notify-ci-issues_test.sh"
      - ".github/workflows/notify-ci-issues-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the notify-ci-issues script tests
        run: bash tools/ci/notify-ci-issues_test.sh
