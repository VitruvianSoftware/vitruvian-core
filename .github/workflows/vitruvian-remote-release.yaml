# release-please and asset publisher for Vitruvian Remote Android app:
# 1. Authors release PRs from conventional commits under apps/mobile/vitruvian-remote/.
# 2. When the release PR merges, cuts the GitHub Release (tag: vitruvian-remote-vX.Y.Z).
# 3. Compiles the multi-ABI release APK on Linux, computes SHA-256 sidecars,
#    and attaches them to the release.
# 4. Builds the Mac extension for the Vitruvian app (macmenu's RemoteTool and
#    the agent it runs) on macOS as one program for Apple silicon and Intel,
#    zips it as VitruvianRemote-X.Y.Z-tool.zip with a SHA-256 sidecar, and
#    attaches both: the zip the Vitruvian catalog (catalog/tools.json) pins.
# 5. Asks GitHub what the release holds, and fails naming any file missing.
# 6. Writes the release's update feed (vitruvian-remote-update.json, from
#    step 3) to catalog/android/vitruvian-remote.json in a pull request that
#    merges itself; catalog-publish then signs it into the website, where the
#    app's Settings > About checks for updates.
name: vitruvian-remote-release

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/vitruvian-remote/**"
      - ".github/workflows/vitruvian-remote-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. vitruvian-remote-v0.1.40). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: vitruvian-remote-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/mobile/vitruvian-remote--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/mobile/vitruvian-remote--tag_name'] }}
      version: ${{ steps.release.outputs['apps/mobile/vitruvian-remote--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while its PR is in the merge queue. A
      # fix that lands on main while the release PR is queued then makes
      # release-please's push fail: the PR merges with stale notes and a tag
      # that holds the newer code (Courier 0.3.32 shipped #5268 and #5264 and
      # listed neither). Out of the queue it can be refreshed. After
      # release-please, `rearm` puts back a PR that release-please had nothing
      # to push to. See tools/ci/src/release_pr_dequeue/README.md.
      - name: Build //tools/ci:release_pr_dequeue (no Bazel on this job)
        id: dequeue-bin
        if: ${{ inputs.tag == '' }}
        uses: ./.github/actions/build-ci-tool
        with:
          tool: release_pr_dequeue

      - name: Take a stale release PR out of the merge queue
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-remote
          CODE_PATH: apps/mobile/vitruvian-remote
          MAIN_SHA: ${{ github.sha }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN"'

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/mobile/vitruvian-remote/release-please-config.json
          manifest-file: apps/mobile/vitruvian-remote/.release-please-manifest.json
          target-branch: main

      # release-please pushes only when the release PR's text changes, so a PR
      # that was dequeued for a commit that adds nothing to its notes would stay
      # out of the queue. Put it back (a held, draft or already-armed PR is left alone).
      - name: Put the release PR back in the merge queue
        if: ${{ !cancelled() && steps.dequeue-bin.outcome == 'success' && (inputs.tag == '') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-remote
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN" rearm'

  publish-package:
    needs: release-please
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: vitruvian-remote-publish-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Publish downloadable release package
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustc --edition=2021 -O --crate-type=lib --crate-name=vitruvian_remote_tools_lib apps/mobile/vitruvian-remote/tools/src/lib.rs -o /tmp/libvitruvian_remote_tools_lib.rlib
          rustc --edition=2021 -O apps/mobile/vitruvian-remote/tools/src/publish_main.rs -L /tmp --extern vitruvian_remote_tools_lib=/tmp/libvitruvian_remote_tools_lib.rlib -o /tmp/vitruvian-remote-publish
          /tmp/vitruvian-remote-publish

  # The Mac extension, on the same release. A job of its own because it needs
  # a Mac; it does not wait for the APK, and the APK does not wait for it.
  publish-tool:
    needs: release-please
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    # The same Xcode as CI and developers (.xcode-version); see ci.yaml.
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: vitruvian-remote-publish-tool-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Publish the Mac extension's tool zip
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bazel run //apps/mobile/vitruvian-remote/macmenu:publish-tool

  # The release's last word, and not the publishing scripts': ask GitHub what
  # the release holds. Vitruvian Speaker 1.12.0 and 1.13.0 were published with no
  # files while their publishing step printed success. The APK, the tool zip
  # the catalog installs from, and each one's checksum must be on the
  # release, and the zip must match its checksum, or this fails naming them.
  # It runs when either publishing job failed too, so the red says what is
  # missing.
  check-release:
    needs: [release-please, publish-package, publish-tool]
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check the release has every file
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#vitruvian-remote-v}"
          listing="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"')"
          printf '%s\n' "${listing}"
          missing=0
          for file in \
            "VitruvianRemote-${version}.apk" \
            "VitruvianRemote-${version}.apk.sha256" \
            "VitruvianRemote-${version}-tool.zip" \
            "VitruvianRemote-${version}-tool.zip.sha256" \
            "vitruvian-remote-update.json"; do
            size="$(awk -F '\t' -v f="${file}" '$1 == f { print $2 }' <<<"${listing}")"
            if [[ -z "${size}" || "${size}" == "0" ]]; then
              echo "::error::${TAG} has no ${file}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          # The zip as the app downloads it, against the checksum beside it.
          dir="$(mktemp -d)"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
            --pattern "VitruvianRemote-${version}-tool.zip" \
            --pattern "VitruvianRemote-${version}-tool.zip.sha256"
          (cd "${dir}" && sha256sum -c "VitruvianRemote-${version}-tool.zip.sha256")
          echo "For the catalog entry: size $(stat -c %s "${dir}/VitruvianRemote-${version}-tool.zip"), sha256 $(cut -d' ' -f1 "${dir}/VitruvianRemote-${version}-tool.zip.sha256")"

  # The update feed, into main. A pull request and not a push, as
  # catalog-publish explains: what the website serves, signed, is only ever
  # what the merge queue saw. It checks the feed names the APK the release
  # holds -- the size and SHA-256 of the file as GitHub serves it, and the
  # digest GitHub recorded on upload -- and never moves the feed backwards, so
  # re-publishing an old tag by hand leaves it alone.
  publish-update-feed:
    needs: [release-please, check-release]
    if: ${{ always() && !cancelled() && needs.check-release.result == 'success' && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: vitruvian-remote-update-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # For //tools/format and //tools/ci:site_pr_automerge.
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Mint App token for PR operations
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Check the release's feed against its APK
        id: feed
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#vitruvian-remote-v}"
          apk="VitruvianRemote-${version}.apk"
          dir="$(mktemp -d)"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
            --pattern vitruvian-remote-update.json --pattern "${apk}"
          feed="${dir}/vitruvian-remote-update.json"
          [[ "$(jq -r .version "${feed}")" == "${version}" ]] \
            || { echo "::error::the feed names $(jq -r .version "${feed}"), not ${version}"; exit 1; }
          want_sha="$(jq -r .apk.sha256 "${feed}")"
          have_sha="$(sha256sum "${dir}/${apk}" | cut -d' ' -f1)"
          [[ "${want_sha}" == "${have_sha}" ]] \
            || { echo "::error::the feed's SHA-256 is not the APK's"; exit 1; }
          [[ "$(jq -r .apk.size "${feed}")" == "$(stat -c %s "${dir}/${apk}")" ]] \
            || { echo "::error::the feed's size is not the APK's"; exit 1; }
          recorded="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq ".assets[] | select(.name == \"${apk}\") | .digest // \"\"" 2>/dev/null || true)"
          if [[ -n "${recorded}" && "${recorded}" != "sha256:${have_sha}" ]]; then
            echo "::error::GitHub recorded ${recorded} for ${apk} on upload, not sha256:${have_sha}"
            exit 1
          fi
          current="catalog/android/vitruvian-remote.json"
          if [[ -f "${current}" ]] && (( $(jq -r .versionCode "${current}") >= $(jq -r .versionCode "${feed}") )); then
            echo "The feed already names $(jq -r .version "${current}"); ${version} is not newer. Nothing to do."
            echo "write=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cp "${feed}" "${current}"
          # prettier's layout, so the pull request passes the format check.
          bazel run //tools/format -- "${current}"
          echo "write=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # The App's full token: arming auto-merge needs the right to merge
      # (contents: write) as well as pull-requests: write, as in
      # catalog-publish.
      - name: Open or update the pull request, and arm auto-merge
        if: ${{ steps.feed.outputs.write == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.feed.outputs.version }}
        run: |
          set -euo pipefail
          file=catalog/android/vitruvian-remote.json
          git add "${file}"
          if git diff --cached --quiet; then
            echo "main already has this feed. Nothing to do."
            exit 0
          fi
          branch="auto/remote-update-feed"
          git config user.name "vitruvian-wren-agent[bot]"
          git config user.email "314429222+vitruvian-wren-agent[bot]@users.noreply.github.com"
          gh auth setup-git
          bazel run //tools/ci:site_pr_automerge -- disarm --branch "${branch}"
          git checkout -B "${branch}"
          git commit -m "chore(catalog): Vitruvian Remote ${VERSION} update feed"
          git push -f origin "${branch}"
          sha="$(git rev-parse HEAD)"
          body="Points Vitruvian Remote's update feed (\`${file}\`) at ${VERSION}: its APK on the release, that APK's size and SHA-256, and its changes from CHANGELOG.md.

          Generated by \`vitruvian-remote-release\` after the release's files were checked: the feed's SHA-256 and size are the APK's as GitHub serves it, and match the digest GitHub recorded on upload. Once this merges, \`catalog-publish\` signs the feed into the website and the app offers the update in Settings > About. It arms auto-merge; to hold it, label it \`do-not-automerge\` and turn auto-merge off."
          existing="$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --title "chore(catalog): Vitruvian Remote ${VERSION} update feed" --body "${body}"
            echo "PR #${existing} already open for ${branch}: updated."
          else
            gh pr create --title "chore(catalog): Vitruvian Remote ${VERSION} update feed" \
              --body "${body}" --base main --head "${branch}"
          fi
          bazel run //tools/ci:site_pr_automerge -- arm --branch "${branch}" --sha "${sha}"
