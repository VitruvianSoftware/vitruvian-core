# release-please for the tabula component family — one INDEPENDENT release-please
# run per package, mirroring pulumi-library-release.yml. Each package
# (tabula root, tabula/api, tabula/cli, tabula/extension, tabula/web) owns its
# OWN release-please-config.json + .release-please-manifest.json, so a release PR
# only ever writes that package's manifest. Sibling release PRs can never
# conflict on a shared file — the failure mode of the previous single shared
# tabula/.release-please-manifest.json, which every per-package PR had to edit.
#
# Tags stay tabula-namespaced and unchanged (tabula-v*, tabula-api-v*,
# tabula-extension-v*, tabula-cli-v*, tabula-web-v*), so the Cloud Run deploy
# ladder (tabula-deploy.yaml, which fires on the tabula-api-v* release) is
# untouched. A CLI- or web-only change never re-tags tabula-api.
#
# Other components in this repo (GoReleaser, standalone mirrors) release via
# different mechanisms and are untouched.

name: tabula-release

on:
  push:
    branches: [main]
    paths:
      - "tabula/**"
      - ".github/workflows/tabula-release.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    # Just a full-history checkout + changed-package diff; cap it so a hung
    # clone/step can't pin a runner. release-please is capped separately below.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history for the diff
      - id: set-matrix
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Detect changed files in this push. Fall back to all packages if the
          # before SHA is the zero-ref (branch creation / force push).
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${BEFORE_SHA}" = "${ZERO_SHA}" ] || ! git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "setup: cannot compute diff (new branch or force-push) → releasing all packages"
            ALL=true
          else
            CHANGED_FILES="$(git diff --name-only "${BEFORE_SHA}" HEAD)"
            ALL=false
          fi

          # Discover every package that has a release-please-config.json under
          # tabula/ (the package dir is repo-root relative, e.g. tabula/api or
          # the root package "tabula" itself).
          ALL_PKGS=$(find tabula -name "release-please-config.json" -exec dirname {} \;)

          if [ "${ALL}" = "true" ]; then
            MATCHED_PKGS="${ALL_PKGS}"
          else
            # Keep only packages where at least one changed file falls under the
            # package's directory. The root package "tabula" matches any tabula/
            # change; its config's exclude-paths keep it from double-counting the
            # sub-packages, so an api-only change yields a no-op root run at worst.
            MATCHED_PKGS=""
            while IFS= read -r pkg; do
              [ -z "${pkg}" ] && continue
              if echo "${CHANGED_FILES}" | grep -q "^${pkg}/"; then
                MATCHED_PKGS="${MATCHED_PKGS}${MATCHED_PKGS:+$'\n'}${pkg}"
              fi
            done <<< "${ALL_PKGS}"
          fi

          if [ -z "${MATCHED_PKGS}" ]; then
            echo "setup: no tabula packages changed → empty matrix"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "setup: releasing packages:"
            echo "${MATCHED_PKGS}" | sed 's/^/  /'
            json_array=$(echo "${MATCHED_PKGS}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$json_array" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    # Per-package concurrency: serialize each package's runs independently so two
    # rapid merges to main can't race its release PR / tag creation, while
    # different packages still run in parallel. Non-cancelling — a cancelled
    # release-please run could drop a release (issue #461).
    concurrency:
      group: tabula-release-${{ matrix.package }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        package: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      # Mint a GitHub App token so the release PR is authored by the App, not by
      # GITHUB_TOKEN. main has required status checks (the merge queue, #83), and
      # a PR opened with GITHUB_TOKEN never triggers workflow runs — so a
      # GITHUB_TOKEN-authored release PR could never satisfy the required checks
      # and would be unmergeable. The App-authored PR triggers CI normally.
      - name: Mint App token for the release PR
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23li2K1dcn4V98uOW3 # vitruvian-copybara-sync — public App client ID
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ matrix.package }}/release-please-config.json
          manifest-file: ${{ matrix.package }}/.release-please-manifest.json
          target-branch: main

      # tabula/extension only: when the extension release is cut, build the
      # Chrome zip and attach it to that GitHub Release. Gated on this matrix
      # leg being the extension AND a release having just been created, so it is
      # a no-op for every other package's run.
      - name: Checkout for extension packaging
        if: ${{ matrix.package == 'tabula/extension' && steps.release.outputs['tabula/extension--release_created'] == 'true' }}
        uses: actions/checkout@v7

      - name: Set up Bazel
        if: ${{ matrix.package == 'tabula/extension' && steps.release.outputs['tabula/extension--release_created'] == 'true' }}
        uses: ./.github/actions/setup-bazel

      - name: Build extension package
        if: ${{ matrix.package == 'tabula/extension' && steps.release.outputs['tabula/extension--release_created'] == 'true' }}
        env:
          # Cache-only (see --config=remotecache-ci in tools/remote.bazelrc): reuse
          # the chrome_zip build CI already cached; outputs stay local for the cp.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel build --config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" //tabula/extension:chrome_zip

      - name: Stamp build identity and attach to release
        if: ${{ matrix.package == 'tabula/extension' && steps.release.outputs['tabula/extension--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs['tabula/extension--tag_name'] }}
        run: |
          cp bazel-bin/tabula/extension/tabula-extension-chrome.zip \
            "$RUNNER_TEMP/${TAG}-chrome.zip"
          chmod +w "$RUNNER_TEMP/${TAG}-chrome.zip"
          VERSION="${TAG#tabula-extension-v}"
          cd "$RUNNER_TEMP"
          printf '{"commit":"%s","builtAt":"%s","version":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VERSION" \
            > build_info.json
          # Replace the placeholder entry in place — same post-Bazel stamping as
          # tabula-dev-latest.yaml; the hermetic build stays untouched. Without
          # this, beta installs would carry commit "dev" and the update checker
          # would disable itself.
          zip -q "${TAG}-chrome.zip" build_info.json
          # --repo is required: after the cd above, gh runs outside the checkout
          # and cannot infer the repository from git (this exact gap failed the
          # v0.1.11 cut with "not a git repository").
          gh release upload "$TAG" "$RUNNER_TEMP/${TAG}-chrome.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
