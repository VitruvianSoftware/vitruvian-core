# release-please for the tabula component family. All artifacts are
# tabula-namespaced: tags tabula-v*, tabula-api-v*, tabula-extension-v*,
# tabula-cli-v*, tabula-web-v* and the release PR 'chore(tabula): release …'.
# The config/manifest live under tabula/ (paths inside them are repo-root
# relative). Other components in this repo release via different mechanisms
# (GoReleaser, standalone mirrors) and are untouched: release-please assigns
# commits to packages purely by touched paths.

name: tabula-release

on:
  push:
    branches: [main]
    paths: ["tabula/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      extension_release_created: ${{ steps.release.outputs['tabula/extension--release_created'] }}
      extension_tag_name: ${{ steps.release.outputs['tabula/extension--tag_name'] }}
    steps:
      # Mint a GitHub App token so the release PR is authored by the App, not by
      # GITHUB_TOKEN. main now has required status checks (the live merge queue,
      # #83), and a PR opened with GITHUB_TOKEN never triggers workflow runs — so
      # a GITHUB_TOKEN-authored release PR could never satisfy the required checks
      # and would be unmergeable. The App-authored PR triggers CI normally.
      - name: Mint App token for the release PR
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: tabula/release-please-config.json
          manifest-file: tabula/.release-please-manifest.json
          target-branch: main

  package-extension:
    needs: release-please
    if: needs.release-please.outputs.extension_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build extension package
        env:
          # Cache-only (see --config=remotecache in tools/remote.bazelrc): reuse
          # the chrome_zip build CI already cached; outputs stay local for the cp.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel build --config=remotecache --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" //tabula/extension:chrome_zip

      - name: Stamp build identity and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.extension_tag_name }}
        run: |
          cp bazel-bin/tabula/extension/tabula-extension-chrome.zip \
            "$RUNNER_TEMP/${TAG}-chrome.zip"
          chmod +w "$RUNNER_TEMP/${TAG}-chrome.zip"
          VERSION="${TAG#tabula-extension-v}"
          cd "$RUNNER_TEMP"
          printf '{"commit":"%s","builtAt":"%s","version":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VERSION" \
            > build_info.json
          # Replace the placeholder entry in place — same post-Bazel stamping
          # as tabula-dev-latest.yaml; the hermetic build stays untouched.
          # Without this, beta installs would carry commit "dev" and the
          # update checker would disable itself.
          zip -q "${TAG}-chrome.zip" build_info.json
          # --repo is required: after the cd above, gh runs outside the
          # checkout and cannot infer the repository from git (this exact
          # gap failed the v0.1.11 cut with "not a git repository").
          gh release upload "$TAG" "$RUNNER_TEMP/${TAG}-chrome.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
