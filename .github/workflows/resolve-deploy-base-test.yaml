# Regression guard for tools/ci/resolve-deploy-base.sh (#1351) — the durable
# diff-base resolver for the coalescing deploy lanes (tabula-deploy,
# tabula-dev-latest, oauth-user-inspector-deploy). Hermetic: a fake `gh`
# binary, no network, no credentials. Pins the FAIL-OPEN invariant: any lookup
# problem yields an empty base_sha so the caller falls back to
# github.event.before, never a fabricated diff base.

name: Resolve Deploy Base Test

on:
  pull_request:
    paths:
      - "tools/ci/resolve-deploy-base.sh"
      - "tools/ci/resolve-deploy-base_test.sh"
      - ".github/workflows/resolve-deploy-base-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/resolve-deploy-base.sh"
      - "tools/ci/resolve-deploy-base_test.sh"
      - ".github/workflows/resolve-deploy-base-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run the resolve-deploy-base script tests
        run: bash tools/ci/resolve-deploy-base_test.sh
