# CI apply for the tabula SHARED BUILD stack
# (tabula/infra/build): the cross-env
# Artifact Registry + build SA (+ its foundation-pool WIF binding + per-env
# Cloud Run service-agent AR readers) in the foundation's shared infra-pipeline
# project (prj-c-bu1-infra-pipeline-*).
#
# IDENTITY (chicken-and-egg): the build SA this stack CREATES cannot be the
# identity that APPLIES it. The apply instead runs as sa-terraform-proj — the
# stage-4 projects SA behind the foundation-proj-shared GitHub Environment,
# whose shared leaf created and owns the infra-pipeline project. Its existing
# gcp-bootstrap grants at the foundation parent folder already cover everything
# this stack manages (see gcp-bootstrap/sa.go parentRoles["proj"]):
#   * roles/artifactregistry.admin    → AR repo create + repo IAM policy
#   * roles/iam.serviceAccountAdmin   → build SA create + SA IAM policy
#   * roles/serviceusage.serviceUsageConsumer (org-level) → API calls
# No additional role grants were needed for this pipeline.
#
# The foundation-proj-shared environment is reviewer-gated (protected branches
# only) — appropriate, since this apply mutates the production-tier shared
# infra-pipeline project.
#
# COLD-DEPLOY ORDERING (the app promotion chain depends on this stack):
#   1. repo_config apply — creates the `tabula-build` GitHub
#      Environment + its WIF vars (tabulaVars "build" block).
#   2. THIS workflow — creates the AR repo + build SA and binds
#      principalSet://…/attribute.environment/tabula-build to the
#      build SA (roles/iam.workloadIdentityUser).
#   3. tabula-deploy.yaml `build` job — federates the build SA
#      from that environment and docker-pushes the image.
# Steps 1–2 must have completed once before step 3 can ever succeed.

name: tabula Build Stack Deploy

on:
  push:
    branches: [main]
    paths:
      - "tabula/infra/build/**"
      - ".github/workflows/tabula-build-stack.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Serialize applies of this stack; never cancel an in-flight pulumi up.
    concurrency:
      group: tabula-build-stack-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-proj-shared
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit that CI runners
      # routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this to
      # 5000/hr. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (tabula-build / production)
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: tabula/infra/build
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (production)"
          { pulumi stack select -c "production" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      # Render the pulumi output digest onto the run's step-summary page. Runs
      # even when the deploy fails so the failure — and what it touched — is
      # surfaced. tools/ci/pulumi-summary.sh parses the counts, flags any
      # destructive replace/delete, and tucks the raw log into a <details>.
      - name: Pulumi digest → step summary
        if: always()
        env:
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "tabula-build" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"
