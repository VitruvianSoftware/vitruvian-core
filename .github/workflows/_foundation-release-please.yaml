# Reusable per-phase release-please invocation for foundation-release.yaml,
# deduped from 6 byte-identical copies (release-gcp-org, release-org-folders,
# release-gcp-bootstrap, release-gcp-environments, release-gcp-networks,
# release-gcp-projects) that differed only in the phase directory name.
#
# DELIBERATE: release-please tracks each STAGE ROOT (e.g. .../gcp-networks),
# not the per-leaf Pulumi projects under it. All stage logic lives in the
# shared modules/ package; a per-leaf package split would fail to attribute
# modules/-only commits to any package and silently stop cutting releases
# (and therefore deploys) for the very changes that affect every leaf.
#
# 🤖 AI AGENT WARNING: every caller of this workflow MUST run in parallel and
# independently. Do NOT add `needs:` pointing a caller at a previous phase's
# deploy job -- see foundation-release.yaml's own warning comment.

on:
  workflow_call:
    inputs:
      phase:
        description: >-
          The foundation phase directory name under
          infrastructure/pulumi/foundation/ (e.g. "gcp-org"). Drives the
          concurrency group, the release-please config/manifest paths, and
          the release_created output key.
        required: true
        type: string
    outputs:
      release-created:
        value: ${{ jobs.release.outputs['release-created'] || jobs.release.outputs.release_created }}
      release_created:
        value: ${{ jobs.release.outputs['release-created'] || jobs.release.outputs.release_created }}

permissions:
  contents: read

jobs:
  release:
    # Serialize release-please for this component: two rapid merges to main
    # start overlapping runs that would otherwise drive the same release PR
    # and tag concurrently. Non-cancelling -- a cancelled release-please run
    # can drop a release (#461). Per-component, so components stay parallel.
    # Group has no ${{ github.ref }} because this workflow is main-only, and
    # that matches the deploy-* groups already in the caller.
    concurrency:
      group: foundation-release-${{ inputs.phase }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      release-created: ${{ steps.release.outputs[format('infrastructure/pulumi/foundation/{0}--release_created', inputs.phase)] }}
      release_created: ${{ steps.release.outputs[format('infrastructure/pulumi/foundation/{0}--release_created', inputs.phase)] }}
    steps:
      # `mint-sync-app-token` is a LOCAL composite action; GitHub can't resolve
      # `uses: ./...` without the repo already checked out onto the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while its PR is in the merge queue. A
      # fix that lands on main while the release PR is queued then makes
      # release-please's push fail: the PR merges with stale notes and a tag
      # that holds the newer code (Courier 0.3.32 shipped #5268 and #5264 and
      # listed neither). Out of the queue it can be refreshed. After
      # release-please, `rearm` puts back a PR that release-please had nothing
      # to push to. See tools/ci/src/release_pr_dequeue/README.md.
      # The release branch is named for the package's `component` in its
      # release-please config: release-please--branches--main--components--<component>.
      - name: Find this package's release-please component
        id: component
        env:
          PACKAGE: infrastructure/pulumi/foundation/${{ inputs.phase }}
        run: |
          set -euo pipefail
          component="$(jq -er '.packages[env.PACKAGE].component' "${PACKAGE}/release-please-config.json")"
          echo "name=${component}" >> "$GITHUB_OUTPUT"

      - name: Build //tools/ci:release_pr_dequeue (no Bazel on this job)
        id: dequeue-bin
        uses: ./.github/actions/build-ci-tool
        with:
          tool: release_pr_dequeue

      - name: Take a stale release PR out of the merge queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: ${{ steps.component.outputs.name }}
          CODE_PATH: infrastructure/pulumi/foundation/${{ inputs.phase }}
          MAIN_SHA: ${{ github.sha }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN"'

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/${{ inputs.phase }}/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/${{ inputs.phase }}/.release-please-manifest.json
          target-branch: main

      # release-please pushes only when the release PR's text changes, so a PR
      # that was dequeued for a commit that adds nothing to its notes would stay
      # out of the queue. Put it back (a held, draft or already-armed PR is left alone).
      - name: Put the release PR back in the merge queue
        if: ${{ !cancelled() && steps.dequeue-bin.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: ${{ steps.component.outputs.name }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN" rearm'
