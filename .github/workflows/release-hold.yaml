# Hold a release PR out of the auto-merge flow while that component's
# DEVELOPMENT deploy is red — the fast-feedback half of the dev→nonprod
# interlock (the hard half is the require-dev-soak-job gate on each
# deploy-nonprod job, which cannot be bypassed by any trigger).
#
# Covers every app on the release-gated ladder: tabula-api, tabula-web and
# oauth-user-inspector all share the same exposure — a release PR opened on a
# push (not on a green deploy), auto-merged on green PR CI, promoting into a
# nonproduction that carries no reviewer.
#
# WHY BOTH. This one is advisory and early: it stops the release PR from
# merging at all, so nothing is tagged, no release is published, and the
# changelog stays visible and readable while development is being fixed. The
# promotion-time gate is the backstop that also covers a break-glass
# workflow_dispatch and any release cut by other means.
#
# THE SUBTLETY THAT MAKES THE LABEL ALONE INSUFFICIENT. release-pr-automerge.yaml
# enables auto-merge the moment the PR opens. Auto-merge is a PR SETTING, not a
# per-check gate: adding `do-not-automerge` afterwards does NOT disable it, and
# GitHub would still merge the PR the instant required checks pass. So a hold
# must actually call `--disable-auto`; the label is applied alongside it as the
# human-readable reason (and because release-pr-automerge.yaml's own `if:`
# honours the label, keeping the hold sticky if that workflow re-fires).
#
# TOKEN CHOICE. Re-enabling auto-merge uses the same vitruvian-copybara-sync App
# token release-pr-automerge.yaml uses, because that App is the bypass actor on
# the merge queue's required-review rule (#804). The default GITHUB_TOKEN is not,
# so re-enabling with it would leave the PR stuck in REVIEW_REQUIRED — a silent
# regression of the automation #804 exists to provide.

name: release-hold

on:
  workflow_run:
    # Matched by workflow NAME (the `name:` field), not filename.
    workflows: [tabula-deploy, oauth-user-inspector-deploy]
    types: [completed]

permissions:
  contents: read

jobs:
  hold:
    # Only push-triggered deploys of the default branch carry the development
    # signal: a `release` run never runs deploy-dev at all, and a
    # workflow_dispatch is a deliberate single-env break-glass. Reacting to
    # either would compare a release PR against a run that never deployed
    # development and hold it for no reason.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    strategy:
      # Independent per component: tabula-api's red development must never hold
      # tabula-web's release PR. fail-fast off so one component's API hiccup
      # does not skip the other's evaluation.
      fail-fast: false
      matrix:
        include:
          - source: tabula-deploy
            component: tabula-api
            dev_job: deploy-dev / deploy
          - source: tabula-deploy
            component: tabula-web
            dev_job: deploy-dev-web / deploy
          - source: oauth-user-inspector-deploy
            component: oauth-user-inspector
            dev_job: deploy-dev / deploy
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23li2K1dcn4V98uOW3 # vitruvian-copybara-sync — public App client ID
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Hold or release this component's open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEV_JOB: ${{ matrix.dev_job }}
          COMPONENT: ${{ matrix.component }}
          SOURCE: ${{ matrix.source }}
          TRIGGERED_BY: ${{ github.event.workflow_run.name }}
        run: bash tools/ci/release-hold.sh
