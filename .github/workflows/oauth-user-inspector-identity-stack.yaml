# CI apply for the per-env oauth-user-inspector DEPLOY/RUNTIME IDENTITY stacks
# (oauth-user-inspector/infra/identity): the per-env deploy + runtime service
# accounts on each prj-{env}-bu1-oss-floating project, their foundation-pool WIF
# bindings, per-app least-privilege IAM, and — for the DEV stack — the
# custom-domain verification anchor (siteverification.googleapis.com enabled on
# the dev floating project + secretAccessor grants on the human-seeded
# CLOUDFLARE_API_TOKEN secret for all three env deploy SAs).
#
# PROMOTION CHAIN: applies SEQUENTIALLY development -> nonproduction ->
# production (each `needs:` the previous, mirroring the app-deploy and
# foundation-release chains) — never the old all-envs-at-once matrix. Each leg
# runs via the reusable _oauth-identity-apply.yaml and is independently
# reviewer-gated by its own foundation-proj-<env> GitHub Environment.
#
# IDENTITY (chicken-and-egg): the deploy SA this stack CREATES cannot be the
# identity that APPLIES it. Each leg instead runs as its PER-ENV
# foundation-proj-<env> service account — the stage-4 projects SA that created
# that env's oss-floating project and enabled its APIs. That per-env choice is
# load-bearing for the DEV leg: enabling siteverification.googleapis.com needs
# serviceusage.services.enable ON prj-d-bu1-oss-floating, which the dev projects
# SA provably holds (it enabled every other API there in stage-4) whereas
# foundation-proj-shared / sa-terraform-proj holds only secretmanager.admin
# there — the #948 apply failed on exactly that gap. The same per-env SA created
# the project's service accounts and set its IAM in stage-4, so it covers the
# rest of each stack (deploy/runtime SA create, per-app project IAM, secret IAM)
# with NO additional role grant to any principal. The app deploy SA is
# deliberately NOT this workflow's identity.
#
# COLD-DEPLOY ORDERING (the app promotion chain + domain verification depend on
# this stack):
#   1. repo_config apply — creates the per-env oauth-user-inspector-<env>
#      GitHub Environments + their WIF vars.
#   2. THIS workflow (development leg) — mints the dev deploy/runtime SAs,
#      enables siteverification.googleapis.com on the dev floating project, and
#      grants every env deploy SA secretAccessor on the dev CLOUDFLARE_API_TOKEN
#      secret. (nonproduction / production legs mint their own SAs; they carry
#      no verification-anchor resources.)
#   3. oauth-user-inspector-deploy.yaml `verify-domain` job — federates the dev
#      deploy SA, reads the token from Secret Manager, and (with the dev project
#      as the Site Verification quota project) self-verifies the zone +
#      delegates ownership; then each env's DomainMapping create is authorized.
# Step 2 (at least its development leg) must have completed once before step 3
# can ever succeed.

name: oauth-user-inspector Identity Stack Deploy

on:
  push:
    branches: [main]
    paths:
      - "oauth-user-inspector/infra/identity/**"
      - ".github/workflows/oauth-user-inspector-identity-stack.yaml"
      - ".github/workflows/_oauth-identity-apply.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: Which env stack(s) to apply (a push, or "all", runs the full dev->nonprod->prod chain)
        type: choice
        required: true
        default: all
        options:
          - all
          - development
          - nonproduction
          - production

permissions:
  contents: read
  id-token: write

jobs:
  # development — the anchor leg (siteverification enable + secret grants).
  development:
    if: >-
      ${{ github.event_name == 'push'
          || inputs.environment == 'all'
          || inputs.environment == 'development' }}
    uses: ./.github/workflows/_oauth-identity-apply.yaml
    with:
      stack: development
      gh-environment: foundation-proj-development
    secrets: inherit

  # nonproduction — after development succeeds on a push / "all" run; directly
  # targetable via a single-env dispatch (development is then skipped).
  nonproduction:
    needs: [development]
    if: >-
      ${{ !cancelled()
          && ( ((github.event_name == 'push' || inputs.environment == 'all') && needs.development.result == 'success')
               || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction') ) }}
    uses: ./.github/workflows/_oauth-identity-apply.yaml
    with:
      stack: nonproduction
      gh-environment: foundation-proj-nonproduction
    secrets: inherit

  # production — after nonproduction succeeds on a push / "all" run; directly
  # targetable via a single-env dispatch (the earlier legs are then skipped).
  production:
    needs: [nonproduction]
    if: >-
      ${{ !cancelled()
          && ( ((github.event_name == 'push' || inputs.environment == 'all') && needs.nonproduction.result == 'success')
               || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ) }}
    uses: ./.github/workflows/_oauth-identity-apply.yaml
    with:
      stack: production
      gh-environment: foundation-proj-production
    secrets: inherit
