# Lint the GitHub Actions workflows with actionlint. The workflow tree is large
# and hand-tuned (the entire CI/merge-gate plumbing), and was previously
# unlinted — a malformed expression, a bad `needs:` edge, or a drifted
# required-check name could reach main. actionlint catches workflow syntax,
# `${{ }}` expression errors, job/needs graph mistakes, deprecated action
# versions, and (via shellcheck) issues in `run:` blocks. Issue #458.
#
# Required merge-queue check: "actionlint" is in repo-config's
# `mergeQueueRequiredChecks` set (infrastructure/pulumi/platform/repo_config/main.go),
# so this job must REPORT on every pull_request and merge_group (see the `on:`
# block below — no `paths` filter, or the queue would hang pending).
name: actionlint

on:
  workflow_dispatch: {}
  # NB: NO workflow-level `paths` filter. This is a REQUIRED merge-queue check,
  # so it must REPORT on every pull_request and merge_group — a path-filtered
  # workflow doesn't run (never reports) on a PR outside its paths, blocking that
  # PR from becoming mergeable. Linting the whole workflow tree is fast and runs
  # regardless of the diff. Required-check context is the job name `actionlint`,
  # wired into the ruleset in infrastructure/pulumi/platform/repo_config/main.go
  # (guarded by //tools/conformance:check).
  #
  # Also NO `branches:` filter on pull_request, for the same reporting
  # requirement: that filters on the PR's BASE branch, and a stacked PR's base
  # isn't main -- so this required check silently never ran on one (see
  # ci.yaml's `on:` block for the full incident).
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.7
      # Controlled CI run-blocks: info-level shellcheck (e.g. SC2086 on a
      # secret-key flag that carries no spaces/globs) is acceptable noise. Real
      # shellcheck warnings/errors still fail, and every native actionlint check
      # (job graph, expressions, deprecated actions, syntax) runs regardless.
      SHELLCHECK_OPTS: --severity=warning
    steps:
      - uses: actions/checkout@v7.0.1

      # Logic lives in tools/ci/install-pinned-tool.sh (shared with
      # gitops-validate.yaml, supply-chain.yaml, mcp-slack-image.yaml — see
      # that script's header for why this was deduped).
      - name: Install actionlint (pinned + checksum-verified)
        run: |
          bash tools/ci/install-pinned-tool.sh \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            actionlint --tar

      # actionlint auto-discovers .github/workflows/*.{yml,yaml} when run at the
      # repo root; shellcheck is preinstalled on the runner.
      - name: Lint workflows
        run: actionlint -color
