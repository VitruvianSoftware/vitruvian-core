# Lint the GitHub Actions workflows with actionlint. The workflow tree is large
# and hand-tuned (the entire CI/merge-gate plumbing), and was previously
# unlinted — a malformed expression, a bad `needs:` edge, or a drifted
# required-check name could reach main. actionlint catches workflow syntax,
# `${{ }}` expression errors, job/needs graph mistakes, deprecated action
# versions, and (via shellcheck) issues in `run:` blocks. Issue #458.
#
# Advisory today; the intent is to add "actionlint" to the merge-queue required
# set (repo-config `mergeQueueRequiredChecks`) once it has baked.
name: actionlint

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actions/**"]
  # Required merge-queue check: a drifted/broken workflow must not be mergeable
  # (a bad required-check name silently wedges the queue — the very failure this
  # guards). merge_group takes no `paths` filter, so this runs on every queued
  # commit; linting the workflow tree is fast and always reports. Required-check
  # context is the job name `actionlint`, wired into the ruleset in
  # infrastructure/pulumi/repo_config/main.go (guarded by //tools/conformance:check).
  merge_group:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.7
      # Controlled CI run-blocks: info-level shellcheck (e.g. SC2086 on a
      # secret-key flag that carries no spaces/globs) is acceptable noise. Real
      # shellcheck warnings/errors still fail, and every native actionlint check
      # (job graph, expressions, deprecated actions, syntax) runs regardless.
      SHELLCHECK_OPTS: --severity=warning
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint (pinned + checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "${asset}" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${asset}" -C "${HOME}/.local/bin" actionlint
          rm -f "${asset}" "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # actionlint auto-discovers .github/workflows/*.{yml,yaml} when run at the
      # repo root; shellcheck is preinstalled on the runner.
      - name: Lint workflows
        run: actionlint -color
