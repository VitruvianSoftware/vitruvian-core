# Builds and publishes the mcp-slack container image to GHCR, and produces the
# sha256 digest that gitops/argocd/applications/mcp-slack.yaml pins as
# `image.digest`.
#
# WHY GHCR AND NOT ARTIFACT REGISTRY, since the repo's other image build
# (oauth-user-inspector-deploy.yaml) uses AR: that one deploys to Cloud Run,
# where the runtime has an ambient Google identity. This image is consumed by
# the dev-local k3s homelab, which has no GCP credential — AR would make an
# imagePullSecret mandatory, and that means a credential in the cluster to seal
# and rotate forever. This repo is already in the `VitruvianSoftware` org, so
# the workflow's own GITHUB_TOKEN can publish to ghcr.io/vitruviansoftware/*
# with no new secret, and a public package needs no pull secret at all. That is
# also the path `mcp-slack/deploy/chart/values.yaml:29` already points at, so
# the chart needs no change.
#
# MULTI-PLATFORM IS NOT OPTIONAL HERE. The cluster is mixed-architecture —
# `kubectl get nodes` reports four amd64 (fedora, james-mbp, nuc9i5, nuc9i9)
# and three arm64 (james-macbook-pro, james-mbp16, james-mbp32) — and
# deploy/chart/templates/deployment.yaml declares no nodeSelector, no affinity
# and no tolerations, with replicas: 1. A single-platform image would therefore
# survive roughly four first deploys in seven and then die with `exec format
# error` on a later reschedule, presenting as a crash-looping pod that reads
# like an application fault. Building both platforms removes the failure mode;
# pinning the pod to a node class would be constraining scheduling to work
# around a build defect.
name: mcp-slack-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'mcp-slack/**'
      - '.github/workflows/mcp-slack-image.yaml'
  # PR runs BUILD AND VERIFY BUT DO NOT PUSH. This is the only place the image
  # is exercised before it can reach a cluster, and it is deliberately not just
  # a compile: it asserts the two properties that pass a build and fail a first
  # sync (see the verify steps below).
  #
  # NB the `paths:` filters above and below are safe ONLY while this workflow is
  # NOT in the merge-queue required set. A required check whose workflow carries
  # a workflow-level pull_request `paths:` filter simply never reports on a PR
  # outside those paths, which blocks that PR from ever becoming mergeable — it
  # wedged this repo once already (see gitops-validate.yaml's `on:` block).
  # DO NOT add `mcp-slack-image` to repo_config's mergeQueueRequiredChecks
  # without deleting these filters and gating the work in a step instead.
  pull_request:
    paths:
      - 'mcp-slack/**'
      - '.github/workflows/mcp-slack-image.yaml'

permissions:
  contents: read
  packages: write

# Per-commit keying on non-PR events: a ref-keyed group puts every push-to-main
# run in one lane, where GitHub evicts still-pending runs when a newer one
# queues behind the running one — so a burst of merges silently drops the
# middle commits' images. Same pattern and same reason as gitops-validate.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/mcp-slack
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Single source for the Node major: the Dockerfile's ARG default exists so
      # `docker build mcp-slack/` works standalone, and //tools/conformance:check
      # asserts that default equals .nvmrc's major. Passing it explicitly here
      # means CI tracks .nvmrc even in the window before conformance runs.
      - name: Resolve the canonical Node major from .nvmrc
        id: node
        run: |
          set -euo pipefail
          major="$(cut -d. -f1 .nvmrc)"
          if [ -z "$major" ]; then
            echo "::error::could not read a Node major from .nvmrc"
            exit 1
          fi
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      # binfmt handlers for the arm64 half of PLATFORMS. Without this the arm64
      # build fails on the first RUN rather than at configuration time, which
      # reads like a Dockerfile bug.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Native-arch single-platform build, loaded into the local daemon so the
      # runtime assertions below can actually RUN the image. Multi-platform
      # output cannot be --load'ed, so this is a separate invocation — it shares
      # the buildx cache with the multi-platform build, so the amd64 layers are
      # built once.
      - name: Build (amd64, loaded for verification)
        run: |
          set -euo pipefail
          docker buildx build --load \
            --build-arg NODE_VERSION="${NODE_MAJOR}" \
            --build-arg GIT_REVISION="${GITHUB_SHA}" \
            --platform linux/amd64 \
            --tag mcp-slack:verify \
            mcp-slack/
        env:
          NODE_MAJOR: ${{ steps.node.outputs.major }}

      # ASSERTION 1 — the pod runs as UID 10001 (deployment.yaml securityContext),
      # a UID that exists in no image layer. If any file the process reads is not
      # world-readable the pod CrashLoops on a MODULE_NOT_FOUND that reads like a
      # build fault. Run as that exact UID, under the same read-only rootfs and
      # single writable /tmp the chart imposes, and require the entrypoint and a
      # runtime dependency to be readable.
      #
      # It IMPORTS the runtime dependencies rather than merely stat-ing them.
      # Reading a path proves a permission bit; resolving and evaluating the
      # module proves the dependency tree the image actually ships is intact —
      # which is the property `--ignore-scripts` in the Dockerfile could
      # plausibly break, and a file-existence check would not notice.
      #
      # It deliberately does NOT start the server: that needs a real Slack token
      # and a reachable IdP, and a start attempt failing on config would not
      # discriminate a permission fault from a missing variable.
      - name: Verify UID 10001 can read and load the image
        run: |
          set -euo pipefail
          docker run --rm \
            --user 10001:10001 \
            --read-only --tmpfs /tmp \
            --entrypoint node \
            mcp-slack:verify \
            --input-type=module \
            -e "import { accessSync, constants } from 'node:fs';
                accessSync('/app/dist/index.js', constants.R_OK);
                console.log('uid ' + process.getuid() + ' can read /app/dist/index.js');
                await import('jose');
                await import('@modelcontextprotocol/sdk/server/streamableHttp.js');
                console.log('uid ' + process.getuid() + ' loaded jose and the MCP SDK');"

      # ASSERTION 2 — the provenance label. Nothing injects this automatically:
      # the repo's other Dockerfile carries no LABEL at all and its buildx call
      # passes no --label, so an absent label here would look identical to a
      # correct one until someone tried to tie a running digest back to a commit.
      # No AR or GHCR repository in this org sets immutable tags, so a :<sha> tag
      # is not a substitute.
      - name: Verify the revision label on the built image
        run: |
          set -euo pipefail
          got="$(docker image inspect mcp-slack:verify \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [ "$got" != "${GITHUB_SHA}" ]; then
            echo "::error::org.opencontainers.image.revision is '${got}', expected '${GITHUB_SHA}'"
            exit 1
          fi
          echo "revision label = ${got}"

      # The two assertions above run against amd64, because that is the only
      # platform a runner can --load and execute. Without this step a PR would
      # therefore validate exactly half of the reason this workflow is
      # multi-platform at all: an arm64-only build failure — an unavailable base
      # image, a dependency with a native component, a QEMU fault — would first
      # appear on merge to main, on the architecture three of the seven cluster
      # nodes actually run.
      #
      # No --push and no --load: the output is discarded and only the build is
      # exercised. The amd64 half is a cache hit from the step above, so this
      # costs roughly one arm64 compile.
      - name: Build both platforms (PR only, output discarded)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker buildx build \
            --build-arg NODE_VERSION="${NODE_MAJOR}" \
            --build-arg GIT_REVISION="${GITHUB_SHA}" \
            --platform "${PLATFORMS}" \
            mcp-slack/
        env:
          NODE_MAJOR: ${{ steps.node.outputs.major }}

      # Everything above runs on pull_request too. Everything below is the
      # publish half and is skipped there — a PR must never be able to move the
      # tag an internet-facing workload resolves.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push (multi-platform)
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          set -euo pipefail
          # --sbom=true because the dependency tree that RUNS is not the tree
          # anything scans. //tools/osv-scan reads the repo's committed
          # lockfiles; this image installs with `pnpm install
          # --no-frozen-lockfile` in a standalone context, which explicitly
          # permits a different resolution and re-resolves at build time. So
          # nothing pins the image's tree to the scanned one, nothing scans the
          # image's tree, and two builds of the same commit can differ — the
          # same late-binding the PNPM_VERSION pin fixed for the tool, one layer
          # down in the packages.
          #
          # `--frozen-lockfile` is not the fix available here: the standalone
          # Docker context is exactly why the `catalog:` rewrite exists, so there
          # is no workspace lockfile to freeze against. Attaching an SBOM closes
          # it at the artifact instead — osv-scanner can scan an SBOM directly.
          #
          # NOT already covered by what buildx attaches. Measured on the first
          # published index rather than inferred from the flags: both
          # attestation manifests carry exactly one in-toto layer with
          # `in-toto.io/predicate-type: https://slsa.dev/provenance/v1`, and no
          # SPDX predicate. Provenance records HOW it was built; it says nothing
          # about what is inside. Aegis's finding.
          docker buildx build --push \
            --build-arg NODE_VERSION="${NODE_MAJOR}" \
            --build-arg GIT_REVISION="${GITHUB_SHA}" \
            --platform "${PLATFORMS}" \
            --sbom=true \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            mcp-slack/
          # Read the digest back FROM THE REGISTRY rather than from buildx's
          # --metadata-file, whose shape varies by driver. This @sha256 ref is
          # what the chart pins; the two tags above are human conveniences and
          # are mutable, so nothing should ever deploy by tag.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{.Manifest.Digest}}')"
          if [ -z "$digest" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          NODE_MAJOR: ${{ steps.node.outputs.major }}

      # ASSERTION 3 — re-verify on the PUSHED index, not the local image. The
      # local checks above prove the build was right; this proves what landed in
      # the registry is the same thing. Both platforms must be present, or the
      # mixed-architecture scheduling problem in this file's header is back.
      - name: Verify the pushed manifest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          # `.Image` on a multi-platform ref is a map keyed by platform, so one
          # read answers both questions: an absent platform is a missing key,
          # and the label lives on each per-platform image CONFIG rather than on
          # the index — checking a single platform would leave the other
          # unverified while reporting green.
          img="$(docker buildx imagetools inspect "${ref}" --format '{{json .Image}}')"
          for want in linux/amd64 linux/arm64; do
            got="$(echo "$img" | jq -r --arg p "$want" \
              '.[$p].config.Labels["org.opencontainers.image.revision"] // "ABSENT"')"
            if [ "$got" = "null" ] || [ "$got" = "ABSENT" ]; then
              echo "::error::pushed index has no ${want} image with a revision label — the cluster has nodes of that architecture"
              exit 1
            fi
            if [ "$got" != "${GITHUB_SHA}" ]; then
              echo "::error::${want} revision label is '${got}', expected '${GITHUB_SHA}'"
              exit 1
            fi
            echo "${want}: revision=${got}"
          done
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}

      - name: Report the digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          {
            echo "### mcp-slack image published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Pin this in \`gitops/argocd/applications/mcp-slack.yaml\` as \`image.digest\`."
            echo "Tie it back to this commit via the \`org.opencontainers.image.revision\` label, never the tag —"
            echo "no AR or GHCR repository in this org sets immutable tags."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}

      # ASSERTION 4 — the cluster pulls this image with NO credential. The chart
      # declares no imagePullSecrets and the pod no serviceAccountName, so a
      # package that is not anonymously pullable is ImagePullBackOff on first
      # sync, presenting as a broken deploy rather than as a permissions
      # setting.
      #
      # This step used to ECHO a warning that a new GHCR package starts private
      # along with the `gh api ... -f visibility=public` command to fix it. That
      # claim was carried from charts-publish.yml's note and never tested
      # against a package this workflow had created: the first publish came out
      # PUBLIC, most likely inheriting the publishing repository's visibility.
      # So the note was advice for a state that did not exist, which is the same
      # advisory-that-cannot-fail shape as issue #1501 — and worse than useless,
      # because it sent people looking for a token scope nobody needed.
      #
      # Now it MEASURES the property instead of asserting its opposite, using
      # the only instrument that can: an anonymous request. Authenticated checks
      # cannot answer this — they succeed on a private package, and our tokens
      # lack `read:packages` anyway (measured across three sessions; note that
      # `admin:org` does NOT cover it).
      #
      # Retried because a freshly pushed package can take a moment to become
      # servable, and a race would otherwise fail a correct publish.
      #
      # WHAT A GREEN HERE DOES NOT MEAN (issue #1507). Every run we can foresee
      # is a pass, so a reader who sees green learns less than it looks like:
      #
      #   - on `pull_request` the step is skipped outright by the `if:` below —
      #     PR runs never push, so there is no digest to fetch;
      #   - on `main` the `mcp-slack` package is already public, so the fetch
      #     succeeds.
      #
      # The failure branch therefore has no foreseeable execution, and its green
      # carries no information about whether it would fire correctly. That is
      # NOT the same defect as #1501 — those rules cannot fail a build at all;
      # this one can, and the discriminating half has been measured:
      #
      #   GET https://ghcr.io/token?scope=repository:vitruviansoftware/<pkg>:pull
      #     vitruviansoftware/charts/whoami   403, empty token, curl -sf exit 56
      #     vitruviansoftware/mcp-slack       200, token returned, curl -sf exit 0
      #
      # A real private package in this org yields a non-zero `curl -sf` exit and
      # an empty token, so `[ -n "${token}" ]` is false, all three attempts fall
      # through and the step exits 1. The gate CAN go red, without making
      # anything private and without a credential.
      #
      # BOUND, because "it can fail" and "it fails for the right reason" are
      # different claims and only the first has evidence: the control above
      # exercises the TOKEN hop only. The manifest fetch on the line after it is
      # unexercised in the negative. It can only be stricter than the token it
      # depends on — the safe direction — but nobody has demonstrated that.
      - name: Verify the image is anonymously pullable
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          for attempt in 1 2 3; do
            token="$(curl -sf "https://ghcr.io/token?scope=repository:vitruviansoftware/mcp-slack:pull&service=ghcr.io" \
              | jq -r '.token // empty' || true)"
            if [ -n "${token}" ] && curl -sf -o /dev/null \
                 -H "Authorization: Bearer ${token}" \
                 -H "Accept: application/vnd.oci.image.index.v1+json" \
                 "https://ghcr.io/v2/vitruviansoftware/mcp-slack/manifests/${DIGEST}"; then
              echo "anonymous pull of ${ref} succeeded — the package is public"
              exit 0
            fi
            echo "attempt ${attempt}: not yet anonymously pullable"
            sleep 10
          done
          echo "::error::${ref} is NOT anonymously pullable. The cluster pulls with no credential"
          echo "::error::(no imagePullSecrets in the chart), so this would be ImagePullBackOff on sync."
          echo "::error::Fix with a token carrying write:packages — GITHUB_TOKEN cannot do this:"
          echo "::error::  gh api -X PATCH /orgs/vitruviansoftware/packages/container/mcp-slack -f visibility=public"
          exit 1
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}

      # ASSERTION 5 — the image's OWN dependency tree carries no known
      # advisories (#1503). This is not a duplicate of `osv-scan`.
      #
      # `osv-scan` (required) reads the repo's committed LOCKFILES. This image
      # does not install from them: mcp-slack/Dockerfile installs with
      # `pnpm install --prod --no-frozen-lockfile` in a standalone Docker
      # context, which explicitly permits a different resolution. Measured at
      # digest sha256:63912eee... — the image resolved `jose@6.2.8` where the
      # repo lockfile pins a different patch. So nothing PINNED the image's tree
      # to the scanned tree, and nothing SCANNED the image's tree.
      #
      # #1504 attached the SBOM this reads. Attaching an SBOM is not scanning it.
      #
      # TWO ARMS, ONE BLOCKS — see tools/ci/image-sbom-scan.sh for the full
      # reasoning. Briefly: the blocking arm covers /app/node_modules (clean at
      # first measurement, 0 of 93 packages), the reporting arm covers everything
      # else (the Debian base contributed 39 advisory instances on day one,
      # mostly unfixed upstream — blocking on those would be red on arrival for
      # reasons no PR author can fix, and a gate like that gets deleted).
      #
      # BOUND, stated because the green does not carry it: this cannot pre-empt a
      # merge. PR runs build but never push, so there is no published index and
      # no attestation to fetch — which is why the step carries the same
      # `!= 'pull_request'` guard as the publish itself. It reddens the PUBLISH,
      # after the merge. Making it a PR gate needs the SBOM read out of a local
      # build rather than the registry, which is a different change.
      # Logic lives in tools/ci/install-pinned-tool.sh (shared with
      # actionlint.yaml, gitops-validate.yaml, supply-chain.yaml — same shape
      # and same version pin as supply-chain.yaml's install step: one scanner
      # version across the repo, so a finding here and a finding there are the
      # same instrument. See that script's header for why this was deduped.
      - name: Install osv-scanner (pinned + checksum-verified)
        if: github.event_name != 'pull_request'
        env:
          OSV_SCANNER_VERSION: v2.4.0
        run: |
          bash tools/ci/install-pinned-tool.sh \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}" \
            osv-scanner_linux_amd64 \
            osv-scanner_SHA256SUMS \
            ' osv-scanner_linux_amd64$' \
            osv-scanner --raw

      - name: Scan the published image's SBOM for known advisories
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: bash tools/ci/image-sbom-scan.sh
