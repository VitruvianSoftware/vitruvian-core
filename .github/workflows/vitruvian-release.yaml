# release-please for the Vitruvian macOS app:
# 1. Authors release PRs from conventional commits under apps/desktop/vitruvian/.
# 2. When the release PR merges, cuts the GitHub Release (tag: vitruvian-vX.Y.Z).
# The DMG is NOT built here: that release fires the `vitruvian` unit's
# production rung in the generated delivery-vitruvian.yaml, which attaches
# Vitruvian-X.Y.Z.dmg (declared in apps/desktop/vitruvian/BUILD).
name: vitruvian-release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/vitruvian/**"
      - ".github/workflows/vitruvian-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. vitruvian-v3.4.1). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Never cancel a release run; serialize them on the branch so rapid merges
    # to main cannot race the release PR / tag creation (issue #461).
    concurrency:
      group: vitruvian-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/desktop/vitruvian--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/desktop/vitruvian--tag_name'] }}
      version: ${{ steps.release.outputs['apps/desktop/vitruvian--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-please PRs must be authored by an App (not GITHUB_TOKEN) so the
      # PR triggers the merge queue's required checks.
      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while the PR is in the merge queue, so a
      # queued release PR could not be refreshed and merged without the change
      # that just landed (#2938). Out of the queue it can; release-beta-gate.yaml
      # queues it again once the beta DMG exists for the new code.
      - name: Take a stale release PR out of the merge queue
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian
          CODE_PATH: apps/desktop/vitruvian
          MAIN_SHA: ${{ github.sha }}
        run: bash tools/ci/release-pr-dequeue.sh

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/desktop/vitruvian/release-please-config.json
          manifest-file: apps/desktop/vitruvian/.release-please-manifest.json
          target-branch: main
