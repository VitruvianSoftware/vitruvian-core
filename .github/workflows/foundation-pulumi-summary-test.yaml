# Regression guard for tools/ci/pulumi-summary.sh — the pulumi output digest
# rendered into the foundation deploy/preview run summaries and the sticky PR
# comment. The parser keys off quirks in pulumi's `--diff` output (preview vs up
# tense, the double section `up --diff` emits, "N changes. M unchanged" lines,
# `+-` replacements, leaked color directives on failure), so it ships with a
# fixture-backed test built from REAL `pulumi {up,preview} --diff` captures.
#
# Runs on the actual runner awk (mawk/gawk), which also proves the POSIX-awk
# parser is portable off the author's machine.

name: Foundation Pulumi Summary Test

on:
  pull_request:
    paths:
      - "tools/ci/pulumi-summary.sh"
      - "tools/ci/pulumi-summary_test.sh"
      - "tools/ci/testdata/pulumi/**"
      - ".github/workflows/foundation-pulumi-summary-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/pulumi-summary.sh"
      - "tools/ci/pulumi-summary_test.sh"
      - "tools/ci/testdata/pulumi/**"
      - ".github/workflows/foundation-pulumi-summary-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Show the runner awk (portability signal)
        run: awk -W version 2>&1 | head -1 || awk --version 2>&1 | head -1 || true

      - name: Run the pulumi-summary parser tests
        run: bash tools/ci/pulumi-summary_test.sh
