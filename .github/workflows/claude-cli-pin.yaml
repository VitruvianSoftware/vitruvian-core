# Weekly bump of the Claude Code CLI that runs the orchestrator plugin's
# behaviour tests (//apps/claude-code/plugins/vitruvian-orchestrator:plugin_test).
#
# //tools/claude-cli-pin:update asks the npm registry for the latest
# @anthropic-ai/claude-code, checks every platform package, and rewrites the
# version and four sha512 hashes in tools/testinfra/claude_cli.bzl together.
# When that changes the file, this opens or updates a pull request on
# chore/claude-cli-pin; the required build-test check then runs the plugin
# tests on the new CLI before anything merges.

name: claude-cli-pin

on:
  schedule:
    # Tuesdays at 14:23 UTC (off-the-hour to avoid GitHub cron load spikes).
    - cron: "23 14 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-cli-pin
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Bump the pinned Claude Code CLI
        id: update
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/claude-cli-pin.txt"
          bazel run //tools/claude-cli-pin:update > "$summary"
          cat "$summary"

          status_lines="$(git status --porcelain=v1 -uall)"
          if [ -z "$status_lines" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The Claude Code CLI pin is already current; nothing to commit."
            exit 0
          fi
          if [ "$status_lines" != " M tools/testinfra/claude_cli.bzl" ]; then
            echo "::error::Unexpected changed or untracked files after the bump (expected only tools/testinfra/claude_cli.bzl):"
            printf '%s\n' "$status_lines" >&2
            exit 1
          fi

          version="$(sed -nE 's/^_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' tools/testinfra/claude_cli.bzl)"
          if [ -z "$version" ]; then
            echo "::error::Could not read the new version from tools/testinfra/claude_cli.bzl."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Mint App token for PR operations
        if: steps.update.outputs.changed == 'true'
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/claude-cli-pin"
          title="chore(testinfra): bump the Claude Code CLI to $VERSION"
          body="$RUNNER_TEMP/claude-cli-pin-body.md"

          git config user.name "vitruvian-wren-agent[bot]"
          git config user.email "314429222+vitruvian-wren-agent[bot]@users.noreply.github.com"
          # The checkout used persist-credentials: false; hand git the App token.
          gh auth setup-git

          # The update was built from the checkout. If main has since changed
          # these files, pushing it would undo that change; next week retries.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          moved=0
          git diff --quiet HEAD refs/remotes/origin/main -- tools/testinfra/claude_cli.bzl || moved=$?
          case "$moved" in
            0) ;;
            1)
              echo "::notice::main changed the pin during this run; left alone for the next run."
              exit 0
              ;;
            *)
              echo "::error::Could not compare the checkout with main (git diff exit $moved)."
              exit 1
              ;;
          esac

          # Leave the branch alone if it holds commits this workflow did not write.
          remote_sha=""
          found=0
          ls_out="$(git ls-remote --exit-code --heads origin "refs/heads/$branch")" || found=$?
          case "$found" in
            0)
              remote_sha="${ls_out%%[[:space:]]*}"
              if ! [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Unexpected git ls-remote output for $branch."
                exit 1
              fi
              git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "$remote_sha"
              # Capture first so a failed rev-list stops the job instead of
              # looking like "no foreign commits".
              branch_commits="$(git rev-list "refs/remotes/origin/main..$remote_sha")"
              foreign=()
              while IFS= read -r sha; do
                [ -z "$sha" ] && continue
                trailer="$(git log -1 --format='%(trailers:key=Claude-Cli-Pin-Update,valueonly)' "$sha")"
                if [ "$trailer" != "true" ]; then
                  foreign+=("${sha:0:9}")
                fi
              done <<< "$branch_commits"
              if [ "${#foreign[@]}" -gt 0 ]; then
                printf -v foreign_list '%s, ' "${foreign[@]}"
                foreign_list="${foreign_list%, }"
                echo "::notice::$branch holds commits claude-cli-pin did not write ($foreign_list); left alone."
                exit 0
              fi
              ;;
            2) ;;
            *)
              echo "::error::Could not read $branch on origin (git ls-remote exit $found)."
              exit 1
              ;;
          esac

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"

          # Nothing to do if an open pull request already proposes exactly this
          # pin: re-pushing would only reset CI and clear any armed auto-merge.
          # A closed one is reopened as a new pull request below.
          # Only when main has not changed the pin since the branch was cut:
          # otherwise the old commit would conflict, so it is rebuilt on main.
          if [ -n "$existing" ] && [ -n "$remote_sha" ]; then
            base="$(git merge-base refs/remotes/origin/main "$remote_sha")"
            same=0
            git diff --quiet "$remote_sha" -- tools/testinfra/claude_cli.bzl || same=$?
            base_current=0
            git diff --quiet "$base" refs/remotes/origin/main -- tools/testinfra/claude_cli.bzl || base_current=$?
            case "$same:$base_current" in
              0:0)
                failing="$(gh pr view "$existing" --json statusCheckRollup --jq '[.statusCheckRollup[] | select((.conclusion // "") | test("FAILURE|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE"))] | length')"
                if [ "$failing" != "0" ]; then
                  echo "::warning::PR #${existing} is unchanged but has $failing failing check(s); re-run them or close the PR to rebuild it."
                fi
                echo "PR #${existing} already proposes $VERSION; left alone."
                exit 0
                ;;
              [01]:[01]) ;;
              *)
                echo "::error::Could not compare the pin with $branch (git diff exits $same, $base_current)."
                exit 1
                ;;
            esac
          fi
          if [ -n "$existing" ]; then
            # Captured first: inside an if test a failed gh would read as "not armed".
            auto_merge="$(gh pr view "$existing" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$auto_merge" = "true" ]; then
              gh pr merge "$existing" --disable-auto
            fi
          fi

          {
            echo "Moves the Claude Code CLI that runs the orchestrator plugin's behaviour tests to [\`$VERSION\`](https://www.npmjs.com/package/@anthropic-ai/claude-code/v/$VERSION)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/claude-cli-pin.txt"
            echo '```'
            echo ""
            echo "\`//tools/claude-cli-pin:update\` took the version and the four platform \`sha512\` hashes from the npm registry and checked that every platform package belongs to that release. The required \`build-test\` check runs \`//apps/claude-code/plugins/vitruvian-orchestrator:plugin_test\` on the new CLI; review its result before merging."
            echo ""
            echo "Generated automatically by the \`claude-cli-pin\` workflow."
          } > "$body"

          git checkout -B "$branch"
          git add tools/testinfra/claude_cli.bzl
          git commit \
            -m "$title" \
            -m "Bumped from https://registry.npmjs.org by the claude-cli-pin workflow." \
            -m "Claude-Cli-Pin-Update: true"
          if [ -n "$remote_sha" ]; then
            git push "--force-with-lease=refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git push origin "$branch"
          fi

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
            echo "PR #${existing} already open for $branch: updated."
          else
            gh pr create --title "$title" --body-file "$body" --base main --head "$branch"
          fi
