# Reusable workflow for deploying a single foundation projects (stage-4) leaf.
#
# This workflow deploys one business-unit leaf (shared, development,
# nonproduction, or production) of the gcp-projects foundation stage. It is
# called by the main foundation-release.yaml workflow in a chained sequence:
#
#   development (auto) → nonproduction (manual approval)
#     → shared (manual approval; the BU infra-pipeline) → production (manual approval)
#
# Upstream-leaf layout: each leaf is its own thin Pulumi project at
# {business_unit}/{environment}/ (upstream 4-projects/business_unit_N/<leaf>),
# with a single `production` stack
# (ipv1337/foundation-projects-bu1-<leaf>/production) and the stage logic
# shared via ../../modules. The `shared` leaf holds the BU infra-pipeline
# (modules/infra_pipelines); the env leaves hold base_env. Each leaf maps to:
#   - A leaf Pulumi project dir: {working_directory}/{business_unit}/{environment}
#     (committed non-secret config in that leaf's Pulumi.production.yaml)
#   - A GitHub Environment with optional protection rules (foundation-proj-{environment})
#
# This pattern replaces the upstream Terraform foundation's branch promotion
# strategy (development → nonproduction → production branches, with
# {business_unit}/shared applied alongside production) with a
# monorepo-compatible approach using GitHub Environment gates.

name: Foundation Projects Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target leaf: shared, development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-projects"
        description: "Stage root directory; pulumi runs in {working_directory}/{business_unit}/{environment}"
      business_unit:
        description: "Business-unit leaf directory under the stage root (business_unit_1, business_unit_2, ...)"
        required: false
        type: string
        default: business_unit_1
      allow_destructive:
        description: "Permit an apply whose plan DELETES or REPLACES resources. Off by default; the preview gate fails closed instead."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - shared
          - development
          - nonproduction
          - production
        description: "Target leaf: shared, development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-projects"
        description: "Stage root directory; pulumi runs in {working_directory}/{business_unit}/{environment}"
      business_unit:
        description: "Business-unit leaf directory under the stage root (business_unit_1, business_unit_2, ...)"
        required: false
        type: string
        default: business_unit_1
      allow_destructive:
        description: "Permit an apply whose plan DELETES or REPLACES resources (e.g. a deliberate removal or rollback). Off by default."
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write

jobs:
  # On a DIRECT manual dispatch (not when foundation-release calls this via
  # workflow_call -- that run shows the changelog from its own `changelog` job),
  # render this stage's latest changelog into the run page before the gated
  # deploy. Ungated + independent of `deploy`, so it never delays the rollout.
  changelog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Changelog → step summary
        env:
          WORKDIR: ${{ inputs.working_directory }}
        run: bash tools/ci/changelog-summary.sh "$WORKDIR/CHANGELOG.md" "" "$(basename "$WORKDIR")"

  # PLAN BEFORE APPROVAL. This job is deliberately UNGATED and runs ahead of
  # `deploy`, so the diff exists on the run page *before* a reviewer is asked to
  # approve the gated apply. Previously the only diff was produced by `pulumi up`
  # INSIDE the gated job — i.e. after approval and after the change had already
  # been made — so an approver was clicking approve with nothing to look at.
  #
  # This is the failure that revoked a live IAM binding: a release run pinned to
  # an older commit sat at the gate, was approved in good faith, and then
  # deleted a grant added by a newer apply. Nothing in the UI signalled it.
  # Now the destroy is visible up front, and the guard below fails the run
  # outright so a stale plan cannot be approved by mistake.
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # foundation-proj-preview is the ungated, read-scoped identity the PR
    # previews already use — approval must not be required to SEE the plan.
    environment: foundation-proj-preview
    outputs:
      deleted: ${{ steps.summary.outputs.deleted }}
      replaced: ${{ steps.summary.outputs.replaced }}
      destructive: ${{ steps.summary.outputs.destructive }}
    env:
      GOWORK: off
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # --refresh mirrors the apply below EXACTLY. A preview computed without it
      # can differ from what the apply then does, which would make this gate
      # worse than useless: reassuring but wrong.
      - name: Pulumi preview (${{ inputs.environment }})
        id: pulumi
        uses: ./.github/actions/pulumi-run-captured
        with:
          command: preview
          stack: production
          refresh: "true"
          working-directory: ${{ inputs.working_directory }}/${{ inputs.business_unit }}/${{ inputs.environment }}
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Same renderer as the apply, so the plan the approver reads and the
      # receipt they get afterwards are produced by one parser and cannot drift.
      # It also exports the counts this job gates on.
      - name: Compute the pulumi digest label
        if: always()
        id: label
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          BUSINESS_UNIT: ${{ inputs.business_unit }}
        run: echo "value=$(basename "${WORKING_DIRECTORY}")/${BUSINESS_UNIT#business_unit_}-${{ inputs.environment }} (plan)" >> "${GITHUB_OUTPUT}"

      - name: Pulumi plan → step summary
        id: summary
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: ${{ steps.label.outputs.value }}
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}

      # FAIL CLOSED on a destructive plan. gcp projects/serviceaccount IAMMember
      # are non-authoritative: a delete REMOVES the member, revoking live access
      # that the owning stack will not re-add. Requiring an explicit opt-in makes
      # a silent revert impossible — a deliberate removal or rollback still
      # works, it just has to say so.
      - name: Guard — refuse a destructive plan
        if: ${{ steps.pulumi.outputs.exit_code == '0' && !inputs.allow_destructive }}
        env:
          DELETED: ${{ steps.summary.outputs.deleted }}
          REPLACED: ${{ steps.summary.outputs.replaced }}
        run: |
          set -euo pipefail
          # FAIL CLOSED on missing counts. If the summary step did not emit them
          # the plan was never successfully parsed, so we cannot claim it is
          # safe — defaulting to 0 here would turn a broken parser into a
          # rubber stamp, which is the exact failure this guard exists to stop.
          if [ -z "${DELETED:-}" ] || [ -z "${REPLACED:-}" ]; then
            echo "::error::Refusing to apply: the plan summary produced no resource counts, so the plan could not be verified as non-destructive. Check the 'Pulumi plan → step summary' step."
            exit 1
          fi
          if [ "$DELETED" -gt 0 ] || [ "$REPLACED" -gt 0 ]; then
            echo "::error::Refusing to apply: this plan would DELETE ${DELETED} and REPLACE ${REPLACED} resource(s). See the plan in this run's summary. If the removal is intended (a deliberate deletion or a rollback), re-run with allow_destructive=true. If it is NOT intended, this run is probably built from a commit older than the last apply to this stack — compare it against main before approving."
            exit 1
          fi
          echo "plan is non-destructive (0 deleted, 0 replaced) — safe to apply"

  deploy:
    # Serialize per (stack dir + environment): a newer promotion run waits for an
    # older in-flight one rather than racing/deploying out of order onto live org
    # infra. Never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-proj-deploy-${{ inputs.working_directory }}-${{ inputs.business_unit }}-${{ inputs.environment }}
      cancel-in-progress: false
    # The plan must exist and be non-destructive before anyone is asked to
    # approve the apply (see the `preview` job).
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-proj-${{ inputs.environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit that CI runners
      # routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this to
      # 5000/hr. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # Upstream-leaf layout: the environment selects the business-unit leaf
      # Pulumi project dir; every leaf has exactly one stack, `production`.
      #
      # --refresh makes this stage SELF-HEALING for non-authoritative IAM.
      # gcp.projects/serviceaccount IAMMember are additive: create = add
      # member, delete = REMOVE member. Several app deploy-identity grants
      # are currently dual-declared here and in the app's own identity stack
      # during the §4.1 migration, so if the app stack ever drops a member,
      # this stack's state still claims to own it and would never re-add it
      # — a permanent silent revocation that breaks the app's CI. Refreshing
      # first reconciles state with reality so the member is restored.
      - name: Pulumi up (${{ inputs.environment }})
        id: pulumi
        uses: ./.github/actions/pulumi-run-captured
        with:
          command: up
          stack: production
          refresh: "true"
          working-directory: ${{ inputs.working_directory }}/${{ inputs.business_unit }}/${{ inputs.environment }}
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Render the pulumi output digest onto the run's step-summary page via the
      # shared composite (.github/actions/pulumi-summary). Runs even when the
      # deploy fails so the failure — and what it touched — is surfaced.
      - name: Compute the pulumi digest label
        if: always()
        id: label
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          BUSINESS_UNIT: ${{ inputs.business_unit }}
        run: echo "value=$(basename "${WORKING_DIRECTORY}")/${BUSINESS_UNIT#business_unit_}-${{ inputs.environment }}" >> "${GITHUB_OUTPUT}"

      - name: Pulumi digest → step summary
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: ${{ steps.label.outputs.value }}
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}
