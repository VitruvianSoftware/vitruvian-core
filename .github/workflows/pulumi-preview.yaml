name: Pulumi Preview

# Advisory `pulumi preview` on PRs for the APP IaC stacks (#499), mirroring
# _repo-config-preview.yaml. Destructive diffs (the class that deleted the live
# zitadel OIDC client, PR #310) surface on the PR as a sticky comment instead
# of post-merge at apply time.
#
# ADVISORY ONLY — deliberately NOT a merge-queue required check, so the
# workflow-level `paths:` filter below is safe (the #493 conformance guard only
# forbids paths filters on REQUIRED checks, which would wedge PR mergeability).
#
# Auth notes:
#   * tabula / oauth-user-inspector authenticate to GCP via the same keyless
#     WIF the deploy workflows use. The WIF pool's attribute condition is
#     repository-scoped (assertion.repository == this repo), so pull_request
#     refs authenticate fine; fork PRs never see the vars/secrets at all.
#   * The bazel-run wrappers (//infrastructure/pulumi/<p>:preview) are NOT used
#     here: tools/pulumi/pulumi_cmd.sh pins those projects to a HUMAN gcloud
#     identity (infrastructure/gcp-identities.tsv) and hard-errors without it.
#     Raw `pulumi` CLI + WIF is the established CI convention (both deploy
#     workflows already do exactly this).
#   * imageTag / promote / stableRevision are deploy-time inputs that are NOT
#     in the committed stack config, so the service image/traffic lines in a
#     preview are expected noise — the signal is adds/deletes/REPLACES.
#
# Gated on the PULUMI_PREVIEW_ENABLED repo variable (codified in repo_config's
# pipelineGates). The zitadel-apps stack is NOT previewed here: reaching its
# management API needs a tailnet join + TLS shim per run (see the zitadel-infra
# job in oauth-user-inspector-deploy.yaml); its destructive-import class is
# instead blocked statically by //tools/conformance:check (check_zitadel_import)
# on every PR for free.

on:
  pull_request:
    paths:
      - "tabula/infra/app/**"
      - "oauth-user-inspector/infra/app/**"
      - "infrastructure/pulumi/pkg/**"
      - ".github/workflows/pulumi-preview.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

# Per-PR group: a superseding push cancels the stale preview (it is advisory;
# unlike an apply there is nothing unsafe about cancelling it).
concurrency:
  group: pulumi-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ vars.PULUMI_PREVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: tabula
            dir: tabula/infra/app
            stack: development
            environment: tabula-development
          - app: oauth-user-inspector
            dir: oauth-user-inspector/infra/app
            stack: development
            environment: oauth-user-inspector-development
            # Non-secret placeholder so the app stack's DEFAULT cloudflare
            # provider can CONFIGURE during this advisory, token-less preview
            # (a dry run makes zero Cloudflare API calls; the zone lookup is
            # skipped under DryRun). The real Cloudflare token is NEVER exposed
            # to previews — it is fetched from Secret Manager only at deploy time
            # (_deploy-cloud-run.yaml). Without a value here the provider config
            # fails ("must provide apiToken") the moment the stack has a DNS
            # record in state to reconcile. See oauth-user-inspector/infra/app/main.go.
            cfPreviewToken: preview-only-not-a-real-cloudflare-token
    environment: ${{ matrix.environment }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      # Per-leg scope: only preview the stack whose inputs changed (its own
      # dir, the shared pkg/ library, or this workflow). The other leg reports
      # green in seconds. Advisory job — filter uncertainty failing the job is
      # acceptable and visible, never a queue wedge.
      - name: Detect ${{ matrix.app }} stack changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.base_ref }}
          filters: |
            stack:
              - '${{ matrix.dir }}/**'
              - 'infrastructure/pulumi/pkg/**'
              - '.github/workflows/pulumi-preview.yaml'

      - name: Authenticate to GCP (WIF, keyless)
        if: steps.changes.outputs.stack == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        if: steps.changes.outputs.stack == 'true'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi preview (${{ matrix.app }} / ${{ matrix.stack }})
        if: steps.changes.outputs.stack == 'true'
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Empty for apps without a cloudflare provider (e.g. tabula); a
          # non-secret placeholder for oauth-user-inspector (see matrix note).
          CLOUDFLARE_API_TOKEN: ${{ matrix.cfPreviewToken }}
        working-directory: ${{ matrix.dir }}
        run: |
          # Disable -e so a failing preview does not abort before we capture its
          # exit code. Advisory: never fail the PR on a diff, but DO fail visibly
          # if the preview itself errors (the program no longer evaluates).
          set +e -u -o pipefail
          { pulumi stack select -c "${{ matrix.stack }}" \
              && pulumi preview --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      # Structured digest (creates/updates/replaces/deletes, destructive flagged)
      # → step summary + the same sticky PR comment, replacing the prior raw-dump
      # comment. pulumi-summary tucks the raw log into a <details> and highlights
      # the real signal (creates/deletes/REPLACES) over expected update-noise.
      - name: Pulumi digest → summary + sticky comment
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: ${{ matrix.app }}
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}
          sticky-header: pulumi-preview-${{ matrix.app }}
