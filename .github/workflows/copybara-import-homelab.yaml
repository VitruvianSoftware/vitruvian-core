name: Copybara Import (homelab)

# Imports VitruvianSoftware/homelab into vitruvian-core/homelab/ when the
# standalone fires a repository_dispatch (type homelab-import). Thin caller —
# logic lives in _copybara-import.yaml.
on:
    repository_dispatch:
        types: [homelab-import]
    workflow_dispatch:
        inputs:
            copybara_options:
                description: "Copybara CLI options. Use '--force --ignore-noop' ONCE to seed the baseline; normal runs use --ignore-noop."
                default: "--ignore-noop"
                required: false

permissions:
    contents: write

# Per-component (NOT a shared group): a shared concurrency group cancels
# intermediate pending runs, which would DROP a component's import. Cross-component
# races on the shared monorepo main are handled by the retry in _copybara-import.yaml.
concurrency:
    group: copybara-import-homelab
    cancel-in-progress: false

jobs:
    import:
        uses: ./.github/workflows/_copybara-import.yaml
        with:
            component: homelab
            standalone_only: ".github/workflows/sync-to-monorepo.yaml"
            copybara_options: ${{ github.event.inputs.copybara_options || '--ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.HOMELAB_SYNC_SSH_KEY }}
