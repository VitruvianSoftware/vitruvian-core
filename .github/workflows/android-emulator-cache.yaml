name: Android Emulator SDK Cache

# Main-only Android emulator SDK cache warmer.
#
# Presubmit's remote-boot unit runs only on pull requests and in the merge
# queue, so nothing on main would otherwise populate the Android SDK Actions
# cache. This workflow warms and saves it on main pushes touching the action,
# on a daily schedule, or on manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/android-emulator/**"
      - ".github/workflows/android-emulator-cache.yaml"
      - ".github/actions/setup-bazel/cache_capacity_guard.py"
  schedule:
    # Daily, off the hour, to refresh evicted entries without overwriting hits.
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-emulator-cache-warm
  cancel-in-progress: false

jobs:
  warm-android-emulator:
    name: warm-android-emulator
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Warm Android emulator SDK cache
        uses: ./.github/actions/android-emulator
        with:
          boot: "false"
          cache-limit-gb: ${{ vars.ACTIONS_CACHE_LIMIT_CONFIRMED_GB }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
