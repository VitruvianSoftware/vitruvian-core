# GENERATED by 'bazel run //tools/ci:gen' from delivery() declarations — DO NOT EDIT. tidy-check enforces regeneration.
#
# Source of truth: the delivery() declarations in the Bazel graph
# (tools/delivery/defs.bzl). Renderer: //tools/delivery/gen, aliased
# //tools/ci:gen. Editing this file by hand is a no-op that CI reverts:
# tidy-check regenerates and fails on any diff.
#
# DEPENDABOT: the action pins below are rendered from constants in
# tools/delivery/gen/main.go. Dependabot's github-actions ecosystem scans
# every file under .github/workflows/, so it will offer to bump them HERE —
# and that PR fails tidy-check, because the next regeneration puts the old
# pin back. Apply the bump to the constant in main.go and run
# `bazel run //tools/ci:gen`; the diff in this file then matches.
#
# PHASE 2 — THE WHOLE LADDER ACTS (spec §6). This workflow is now the
# delivery path for every unit below, on all three of its triggers:
#   - push to main      -> the FIRST environment of every AFFECTED unit
#                          (companions applied first, expand-before-serve);
#   - release published -> nonproduction then production for the unit whose
#                          tag prefix matches, each rung holding its legacy
#                          interlocks (dev-soak, prior-rung success, the
#                          production Environment's required reviewer);
#   - workflow_dispatch -> exactly ONE unit into ONE environment.
#
# The legacy per-app workflows keep ONLY their own workflow_dispatch, as
# dispatch-only shells pending their Phase-3 deletion; their `push:` and
# `release:` triggers are gone, so nothing here races them.
#
# ROLLBACK (spec §6.1): flip the DELIVERY_ORCHESTRATOR_ENABLED repo
# variable to false and every job below no-ops without a commit. Level 0
# is the break-glass `bazel run` target, unchanged, per the runbook.
#
# Units declared today (sorted by name). The orchestrator re-derives this list
# at run time from the Bazel graph — it is reproduced here so that adding,
# renaming or deleting a delivery() declaration shows up as a DIFF in this
# generated file, which is what makes tidy-check's regeneration assertion
# mean something even for a unit that renders no job yet.
#   - oauth-user-inspector  kind=cloud-run  run=//apps/web/oauth-user-inspector/infra/app:deploy  envs=development,nonproduction,production  promotion=release:oauth-user-inspector-v
#       paths:  apps/web/oauth-user-inspector/ infrastructure/pulumi/platform/zitadel-apps/ tools/deploy/ \.github/workflows/_deploy-cloud-run\.yaml \.github/workflows/_zitadel-apps-apply\.yaml
#       except: apps/web/oauth-user-inspector/infra/identity/ apps/web/oauth-user-inspector/catalog-info\.yaml apps/web/oauth-user-inspector/deploy/ apps/web/oauth-user-inspector/docs/ apps/web/oauth-user-inspector/mkdocs\.yml apps/web/oauth-user-inspector/CHANGELOG\.md
#       soak:   promotion blocked while development is red
#   - oauth-user-inspector-identity  kind=pulumi  run=//apps/web/oauth-user-inspector/infra/identity:up  envs=development,nonproduction,production  promotion=push-all
#       paths:  apps/web/oauth-user-inspector/infra/identity/ \.github/workflows/_oauth-identity-apply\.yaml
#       render: reusable from .github/workflows/oauth-user-inspector-identity-stack.yaml job "development"
#   - zitadel-apps  kind=pulumi  run=//infrastructure/pulumi/platform/zitadel-apps:up  envs=development,nonproduction,production  promotion=release:oauth-user-inspector-v
#       paths:  infrastructure/pulumi/platform/zitadel-apps/ \.github/workflows/_zitadel-apps-apply\.yaml

name: delivery-oauth-user-inspector

on:
  push:
    branches: [main]
  # Manual, single unit + single environment (the escape hatch that
  # replaces every legacy per-app workflow's own dispatch block). Every
  # fan-out job below carries a dispatch arm naming ITS unit and ITS rung,
  # so a dispatch delivers exactly one thing — never the whole ladder.
  workflow_dispatch:
    inputs:
      unit:
        description: Delivery unit to deliver (a companion is applied by dispatching the unit it expands for)
        type: choice
        required: true
        options:
          - oauth-user-inspector
          - oauth-user-inspector-identity
      environment:
        description: Target environment (single-env break-glass redeploy)
        type: choice
        required: true
        default: development
        options:
          - development
          - nonproduction
          - production
      allow-unsoaked:
        description: Promote even if the unit's development deploy is RED (logged loudly; tools/ci/require-dev-soak.sh)
        type: boolean
        required: false
        default: false
  # Promotion trigger. release-please publishes a GitHub Release when a
  # component's release PR merges; that fires here and drives the
  # nonproduction -> production ladder for the unit whose tag prefix
  # matches. Filtered PER JOB (see each rung's `if:`), never here: the
  # event itself carries no tag filter.
  release:
    types: [published]

# Least privilege AT THE WORKFLOW LEVEL: `contents: read` to check out and
# `actions: read` so the orchestrator can resolve a durable diff base from
# this workflow's own run history. `id-token: write` is deliberately NOT
# here — the fan-out jobs that need WIF grant it on THEMSELVES (see their
# job-level permissions blocks), so `orchestrate`, which never talks to
# GCP, cannot mint a cloud credential.
permissions:
  contents: read
  actions: read

# State-mutation posture: one group per app, never cancel. Two delivery
# runs of one app must not race the same live environment, and a queued run
# must not be cancelled mid-rollout.
#
# ONE WORKFLOW PER APP, so apps never share a queue. The group keys on
# github.workflow, which is this file's own name, so each app's
# delivery-<app>.yaml is its own lane: a run of one app waiting on an
# Environment approval holds back only that app's later pushes. When every
# app shared one delivery.yaml, one approval-gated run held every app's
# push lane, and the pushes queued behind it were evicted one after another.
#
# WHY WORKFLOW-LEVEL AND NOT PER-UNIT (spec §4.3 asks for
# `delivery-<unit>-<env>` groups): every fan-out job below is a `uses:`
# caller, and this repo has already paid for that experiment — #1607 put a
# `concurrency:` on the calling jobs in tabula-deploy.yaml and every
# dispatch failed INSTANTLY with no runner assigned, reproducibly, even
# with a static expression-free group string; workflow-level was the only
# placement that worked. A per-workflow group is strictly STRONGER
# serialization than per-unit groups for the units inside one app — it can
# never let two runs touch one environment at once. Revisit only with a
# live experiment, never by reasoning from the docs.
#
# KNOWN CONSEQUENCE (#1351), MITIGATED FOR PUSHES: a coalescing group
# means GitHub EVICTS an already-PENDING run when a newer one queues, and
# `github.event.before` is fixed at the EVICTED run's push — a range no
# successor re-diffs, i.e. a silent permanent skip. The orchestrate job
# therefore resolves a DURABLE base from this workflow's last successful
# push run (tools/ci/resolve-deploy-base.sh) and only falls back to
# github.event.before when that cannot be determined: the NEXT push run
# re-diffs the evicted one's range, so eviction costs latency, not a
# delivery. Observed live and working on the Phase-2 merge burst.
#
# WHY RELEASE RUNS ARE KEYED SEPARATELY, PER TAG: that recovery does not
# exist for a release. A release run delivers what its TAG names, and no
# later run ever re-derives it — so an evicted release run is a promotion
# that silently never happens, recoverable only by a human noticing and
# dispatching it. That is not hypothetical: two releases published in the
# same minute during the Phase-2 rollout evicted each other (runs
# 32345258539 / 32344982262 — harmless only because both tags were infra
# ones with no rung of their own; a tabula-api-v + tabula-web-v pair would
# have dropped one service's promotion). Keying release runs on the tag
# gives every tag its own lane: two tags never evict each other, while two
# runs of the SAME tag (a re-publish) still serialize, which is the case
# that could actually race one environment.
concurrency:
  group: delivery-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', inputs.unit, inputs.environment) || 'push' }}
  cancel-in-progress: false

jobs:
  orchestrate:
    # Kill switch (spec §6.1, rollback level 1): flip the
    # DELIVERY_ORCHESTRATOR_ENABLED repo variable to disable the whole
    # orchestrator without a commit, a revert or a deploy. Repo-scoped, not
    # environment-scoped: a job-level `if:` cannot see an environment
    # variable. Declared in infrastructure/pulumi/platform/repo-config.
    #
    # PUSH-ONLY, and that is not a narrowing of the gate — it is what this
    # job decides. Its verdict is "which units did this DIFF affect", which
    # only a push has: a release event promotes an already-built digest by
    # tag, and a dispatch names its unit outright. Running it anyway would
    # pay a Bazel setup + a target-determinator sweep on EVERY published
    # release in the repo (this workflow has no per-tag trigger filter) for
    # an answer nothing reads. Every fan-out job below stays reachable with
    # this skipped: their conditions use always()/!cancelled() and their
    # release/dispatch arms, exactly as the legacy jobs did with their own
    # push-only `gate` job skipped.
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      # `manifest` is the whole delivery-manifest.json, compact, for a
      # consumer that needs more than a boolean (fromJSON in a future
      # phase). The affected_* pairs are the convenience form a job-level
      # `if:` can actually read — expressions cannot index into JSON.
      manifest: ${{ steps.manifest.outputs.manifest }}
      affected_oauth_user_inspector: ${{ steps.manifest.outputs.affected_oauth_user_inspector }}
      affected_oauth_user_inspector_identity: ${{ steps.manifest.outputs.affected_oauth_user_inspector_identity }}
      affected_zitadel_apps: ${{ steps.manifest.outputs.affected_zitadel_apps }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0 is LOAD-BEARING, not hygiene. The engine diffs
          # HEAD against `github.event.before`, which does not exist in the
          # default depth-1 clone — the gate then fail-opens on every run
          # and reports "affected" for everything, forever, while looking
          # perfectly healthy. That is exactly #1763: the gate was not
          # broken, it could not see.
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel
      - name: Resolve the durable diff base (#1351)
        id: durable-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: delivery-oauth-user-inspector.yaml
          LEGACY_WORKFLOW_FILE: delivery.yaml
        # Reads THIS workflow's last successful push run and uses its head
        # sha as the diff base, so a run evicted by this app's
        # concurrency group above does not take its commit range to the
        # grave (until the app has one, the shared delivery.yaml's, which
        # delivered it before the per-app split). Always exits 0: an empty
        # base_sha means "could not determine", and the step below falls
        # back.
        run: bash tools/ci/resolve-deploy-base.sh
      - name: Resolve per-unit durable bases (#1842)
        id: unit-bases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: delivery-oauth-user-inspector.yaml
          LEGACY_WORKFLOW_FILE: delivery.yaml
        # Refines the single base above, which is a RUN-level verdict: a run
        # whose delivery jobs were all skipped still concludes success and
        # still becomes the base, so a wrongly-skipped unit's commits fall
        # outside every future diff and its delivery is lost, not deferred.
        # This resolves each unit's own laggiest last delivery instead.
        # Always exits 0; an empty object means every unit keeps the single
        # base, which is exactly the previous behaviour.
        run: bash tools/ci/resolve-unit-bases.sh
      - name: Compute the delivery manifest
        id: manifest
        env:
          # Durable base first, github.event.before only as the fallback
          # (empty is falsy in a GitHub Actions expression). The engine
          # itself fails open if BOTH are unusable.
          BEFORE_REV: ${{ steps.durable-base.outputs.base_sha || github.event.before }}
          # Per-unit bases (#1842). Only ever OLDER than BEFORE_REV, so the
          # worst case is a redundant deploy, never a lost one.
          UNIT_BASES_JSON: ${{ steps.unit-bases.outputs.unit_bases }}
          # A force-push makes any base untrustworthy; the orchestrator
          # turns this into a whole-manifest fail-open with a loud reason.
          FORCED_PUSH: ${{ github.event.forced }}
          # The affected engine may build/query through the shared remote
          # cache; absent (e.g. a fork) it degrades to a local build.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          # The units THIS workflow delivers. The engine judges only these, so
          # one app's workflow never pays for another app's target-determinator
          # sweep. A name the engine cannot find fails the manifest open.
          ORCHESTRATE_UNITS: oauth-user-inspector oauth-user-inspector-identity zitadel-apps
        run: bazel run //tools/delivery/orchestrate -- --out delivery-manifest.json
      - name: Upload the delivery manifest
        uses: actions/upload-artifact@v7
        with:
          name: delivery-manifest
          path: delivery-manifest.json
          # 30 days: long enough to A/B a delivery verdict against what the
          # legacy workflows actually did, which is how each phase is
          # signed off before the legacy path is deleted.
          retention-days: 30

  # ======== unit: oauth-user-inspector → development → nonproduction → production ========
  # Declared in apps/web/oauth-user-inspector/infra/app/BUILD; break-glass target: //apps/web/oauth-user-inspector/infra/app:deploy
  # GitHub Environments: oauth-user-inspector-development, oauth-user-inspector-nonproduction, oauth-user-inspector-production (approvals + keyless-WIF vars live there)
  # Promotion to nonproduction/production: on a published release tagged oauth-user-inspector-v* (release-please).

  # BUILD ONCE, promote by digest: the image is pushed a single time, into
  # the shared Artifact Registry owned by the build Environment's project,
  # and every rung deploys that one immutable @sha256 ref. The app's Pulumi
  # program accepts nothing else — there is deliberately no mutable-tag
  # fallback — so this job is what makes the deploy below possible at all.
  oauth-user-inspector-build:
    needs: [orchestrate]
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && always() && !cancelled() && ((github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_oauth_user_inspector == 'true')) || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v')) || (github.event_name == 'workflow_dispatch' && inputs.unit == 'oauth-user-inspector'))
    concurrency:
      group: delivery-oauth-user-inspector-build
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: oauth-user-inspector-build
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (capture the digest)
        id: push
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/oauth-user-inspector/app"
          NODE_VERSION="$(cut -d. -f1 .nvmrc 2>/dev/null || echo 22)"
          docker buildx build --push \
            --build-arg NODE_VERSION="${NODE_VERSION}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            apps/web/oauth-user-inspector/
          # Resolve the immutable digest from the registry (driver-agnostic,
          # vs. buildx --metadata-file which varies by builder): this exact
          # @sha256 ref is what every env deploys.
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "Built ${IMAGE}@${DIGEST}"
          echo "image-digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # EXPAND before serve (§2.15): zitadel-apps is applied before
  # oauth-user-inspector's new development revision takes traffic, or hosted login is
  # broken on arrival. Gated on the SAME verdict as the deploy below — if
  # no revision is arriving there is nothing to expand for. Applying it
  # unconditionally is #1794: ~9 needless applies a day against a stack
  # whose force-replace DELETES the live OIDC client.
  zitadel-apps-development:
    needs: [orchestrate]
    # `always() && !cancelled()` (not the implicit success()-of-needs):
    # orchestrate may legitimately be skipped or red, and the fail-open arm
    # below has to be reachable in exactly those cases.
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && always() && !cancelled() && ((github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_oauth_user_inspector == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.unit == 'oauth-user-inspector' && inputs.environment == 'development'))
    concurrency:
      group: delivery-zitadel-apps-development
      cancel-in-progress: false
    # Job-level, because a called workflow's permissions can only NARROW
    # the caller's: keyless WIF needs id-token: write HERE, and granting it
    # workflow-wide would hand it to orchestrate too.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: "development"
    secrets: inherit

  # The push rung: main is the continuous-integration surface, so every
  # affected merge lands here and nowhere else.
  oauth-user-inspector-development:
    needs: [orchestrate, oauth-user-inspector-build, zitadel-apps-development]
    # The build MUST have succeeded — there is no image otherwise, and this
    # is an EQUALITY, not a `!= 'failure'`, so a SKIPPED build stops the
    # deploy too rather than promoting whatever the registry's `latest`
    # happens to hold. `!cancelled()` keeps the whole condition reachable
    # when a need was skipped, which the implicit success()-of-needs would
    # not.
    # A companion that is SKIPPED — its repo-variable gate is off — must not
    # block the deploy, while one that FAILED must.
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && !cancelled() && needs.oauth-user-inspector-build.result == 'success' && needs.zitadel-apps-development.result != 'failure' && ((github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_oauth_user_inspector == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.unit == 'oauth-user-inspector' && inputs.environment == 'development'))
    concurrency:
      group: delivery-oauth-user-inspector-development
      cancel-in-progress: false
    # Job-level, because a called workflow's permissions can only NARROW
    # the caller's: keyless WIF needs id-token: write HERE, and granting it
    # workflow-wide would hand it to orchestrate too.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: "oauth-user-inspector"
      cloudflare-token-secret-project: "prj-d-bu1-oss-floating-648a"
      custom-smoke-script-file: "apps/web/oauth-user-inspector/infra/app/smoke.sh"
      default-region: "us-central1"
      env-prefix: "OAUTH_USER_INSPECTOR"
      environment: "development"
      image-digest: "${{ needs.oauth-user-inspector-build.outputs.image-digest }}"
      pulumi-dir: "apps/web/oauth-user-inspector/infra/app"
      service-name: "oauth-user-inspector"
      workload-migrated: false
    secrets: inherit

  # PROMOTION INTERLOCK: refuse to promote while development is RED.
  # release-please opens a release PR on any push and auto-merges it on the
  # PR check suite, which knows nothing about the DEPLOYMENT — so without
  # this a commit whose development deploy FAILED rides into nonproduction
  # with no human in the loop. Fails CLOSED on a definitive red, OPEN on an
  # indeterminate answer (tools/ci/require-dev-soak.sh).
  oauth-user-inspector-require-dev-soak:
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && !cancelled() && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v')) || (github.event_name == 'workflow_dispatch' && inputs.unit == 'oauth-user-inspector' && inputs.environment == 'nonproduction'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # `actions: read` is what lets the script read this repo's run
      # history; it is safe on an ordinary job (see the header note).
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WHICH workflow's history holds the development deploy, and which
          # job in it. DEV_JOB_NAME is the CHECK-RUN name, which GitHub
          # composes as "<caller job id> / <called workflow's job id>" — the
          # generated development job calling _deploy-cloud-run.yaml's
          # `deploy`. A name that matches nothing makes the gate fail-open
          # forever, i.e. visible and inert, which its own header calls
          # worse than no gate at all.
          WORKFLOW_FILE: delivery-oauth-user-inspector.yaml
          LEGACY_WORKFLOW_FILE: delivery.yaml
          DEV_JOB_NAME: oauth-user-inspector-development / deploy
          # Break-glass override, from the dispatch form first and the repo
          # variable second (an unset variable is falsy, so this ends at
          # 'false'). The script logs loudly when it is honoured.
          ALLOW_UNSOAKED: ${{ inputs.allow-unsoaked || vars.ALLOW_UNSOAKED_PROMOTION || 'false' }}
        run: ./tools/ci/require-dev-soak.sh

  # EXPAND before serve (§2.15): zitadel-apps is applied before
  # oauth-user-inspector's new nonproduction revision takes traffic, or hosted login is
  # broken on arrival. Gated on the SAME verdict as the deploy below — if
  # no revision is arriving there is nothing to expand for. Applying it
  # unconditionally is #1794: ~9 needless applies a day against a stack
  # whose force-replace DELETES the live OIDC client.
  zitadel-apps-nonproduction:
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && !cancelled() && ((github.event_name == 'release' && startsWith(github.event.release.tag_name, 'oauth-user-inspector-v')) || (github.event_name == 'workflow_dispatch' && inputs.unit == 'oauth-user-inspector' && inputs.environment == 'nonproduction'))
    concurrency:
      group: delivery-zitadel-apps-nonproduction
      cancel-in-progress: false
    # Job-level, because a called workflow's permissions can only NARROW
    # the caller's: keyless WIF needs id-token: write HERE, and granting it
    # workflow-wide would hand it to orchestrate too.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: "nonproduction"
    secrets: inherit

  # PROMOTION rung 1/2 — release-gated, never reached by a push.
  oauth-user-inspector-nonproduction:
    needs: [oauth-user-inspector-build, oauth-user-inspector-require-dev-soak, zitadel-apps-nonproduction]
    # The build MUST have succeeded — there is no image otherwise, and this
    # is an EQUALITY, not a `!= 'failure'`, so a SKIPPED build stops the
    # deploy too rather than promoting whatever the registry's `latest`
    # happens to hold. `!cancelled()` keeps the whole condition reachable
    # when a need was skipped, which the implicit success()-of-needs would
    # not.
    # A companion that is SKIPPED — its repo-variable gate is off — must not
    # block the deploy, while one that FAILED must.
    # The soak result is checked EXPLICITLY: an `if:` REPLACES the default
    # success()-of-all-needs rather than ANDing with it, so without this
    # clause a RED interlock would still let the promotion run — the gate
    # silently a no-op, which is how it was found broken before.
