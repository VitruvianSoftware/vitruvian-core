name: Copybara Config Smoke Test

# GUARDRAIL: Copybara evaluates the ENTIRE copy.bara.sky on every workflow run,
# so a single load/parse error in the config breaks EVERY component's live export
# at once (devx, homelab, mcp-slack, nexus-agent, oauth-user-inspector, ...), not
# just the one being edited. This job runs the SAME pinned Copybara image the
# exports use and `validate`s the whole config on any PR that touches the copybara
# tooling, turning "the next scheduled export silently breaks" into a red check
# that blocks the merge.
#
# DO NOT make this a required merge-queue check while the `paths:` filters below
# exist. A path-filtered workflow does not run -- and therefore never REPORTS --
# on a PR outside its paths, so every PR that does not touch copybara would sit
# "pending" forever and never become mergeable. This repo has already been
# wedged that way once; see the standing warnings in gitops-validate.yaml,
# actionlint.yaml and migration-safety.yaml, all of which deliberately carry no
# `paths:` filter for exactly this reason.
#
# The safe pattern, if this ever does need to gate the queue, is "always report,
# conditionally work" (tools/ci/relevant-paths.sh, PR #273): trigger on every
# pull_request/merge_group with NO `paths:` filter, and skip the WORK inside the
# job based on a changed-files diff. Note `merge_group` events ignore `paths:`
# anyway, so the filter buys nothing on the lane that would matter.
on:
    pull_request:
        paths:
            - "tools/copybara/copy.bara.sky"
            - ".github/workflows/copybara-*.yaml"
            - ".github/workflows/_copybara-export.yaml"
            - ".github/workflows/copybara-config-smoketest.yaml"
    push:
        branches: [main]
        paths:
            - "tools/copybara/copy.bara.sky"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # ref-only key (no sha/event_name) meant a push run and an unrelated
    # trigger sharing this ref could evict each other. Matches the pattern
    # already used correctly by ci.yaml, gitops-validate.yaml,
    # migration-safety.yaml, and others in this repo: key on event_name +
    # (ref for pull_request, sha for push), and only cancel in-progress for
    # PR runs (a superseded PR preview is safe to cancel; a push run on
    # main is not).
    group: copybara-config-smoketest-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Validate copy.bara.sky loads on the pinned Copybara image
              run: |
                  set -uo pipefail
                  # The pinned olivr/copybara build is ENV-driven (COPYBARA_CONFIG /
                  # COPYBARA_WORKFLOW, exactly like tools/copybara/sync) and has no
                  # standalone `validate` subcommand. Requesting a deliberately
                  # nonexistent workflow makes Copybara LOAD + execute the entire
                  # config — running every core.workflow() registration, which is the
                  # real check on the Starlark (generalized schema, new component,
                  # transforms) — and then print the list of valid migrations before
                  # exiting non-zero. A genuine load/parse error instead aborts BEFORE
                  # "Validating configuration". So: assert we reached validation and
                  # that every expected migration is registered.
                  out="$(docker run --rm \
                    -v "$GITHUB_WORKSPACE/tools/copybara/copy.bara.sky":/root/copy.bara.sky \
                    -e COPYBARA_CONFIG=/root/copy.bara.sky \
                    -e COPYBARA_WORKFLOW=__smoketest_probe__ \
                    olivr/copybara@sha256:87e2e9089344e64693faebb2ee0ed33b8797358c0420b0fa98325ca611e98679 \
                    copybara 2>&1 || true)"
                  echo "$out"
                  if ! grep -q "Validating configuration" <<<"$out"; then
                    echo "::error::copy.bara.sky failed to load (never reached configuration validation)"
                    exit 1
                  fi
                  for wf in export_devx export_homelab export_mcp_slack export_nexus_agent export_oauth_user_inspector export_pulumi_library; do
                    grep -q "$wf" <<<"$out" || {
                      echo "::error::expected migration '$wf' missing from the config — load incomplete"
                      exit 1
                    }
                  done
                  echo "copy.bara.sky loaded + validated OK (all expected migrations registered)."
