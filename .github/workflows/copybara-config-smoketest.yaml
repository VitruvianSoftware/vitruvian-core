name: Copybara Config Smoke Test

# GUARDRAIL: Copybara evaluates the ENTIRE copy.bara.sky on every workflow run,
# so a single load/parse error in the config breaks EVERY component's live export
# at once (devx, homelab, mcp-slack, nexus-agent, oauth-user-inspector, ...), not
# just the one being edited. This job runs the SAME pinned Copybara image the
# exports use and `validate`s the whole config on any PR that touches the copybara
# tooling, turning "the next scheduled export silently breaks" into a red check
# that blocks the merge. Make this a REQUIRED check on the merge queue.
on:
    pull_request:
        paths:
            - "tools/copybara/copy.bara.sky"
            - ".github/workflows/copybara-*.yaml"
            - ".github/workflows/_copybara-export.yaml"
            - ".github/workflows/copybara-config-smoketest.yaml"
    push:
        branches: [main]
        paths:
            - "tools/copybara/copy.bara.sky"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: copybara-config-smoketest-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Validate copy.bara.sky loads on the pinned Copybara image
              run: |
                  set -euo pipefail
                  # Same pinned digest as tools/copybara/sync (the export path). If
                  # this build ever lacks `validate`, fall back to
                  # `copybara info <config> export_devx` (loads the full config too).
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE/tools/copybara/copy.bara.sky":/root/copy.bara.sky \
                    -e COPYBARA_CONFIG=/root/copy.bara.sky \
                    olivr/copybara@sha256:87e2e9089344e64693faebb2ee0ed33b8797358c0420b0fa98325ca611e98679 \
                    copybara validate /root/copy.bara.sky
                  echo "copy.bara.sky validated OK on the pinned image."
