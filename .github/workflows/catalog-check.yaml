# Checks each tool a pull request adds to the catalog, or changes, by fetching
# its download: the pinned size and SHA-256, a zip that stays inside its
# folder, `vitruvian-tool validate` on what it unpacks to, and its manifest
# against the entry. The checks that need no network are //catalog/...,
# which the build-test lane runs.
#
# It runs nothing the download holds: validate reads the manifest and the
# folder. The downloads job's token is read-only and no secret is passed to
# it. It is not a required check: the catalog's README asks the reviewer to
# merge only with it green.
#
# For a pull request catalog-bump opened (catalog/bump-*), the job
# bump-automerge then arms auto-merge, or turns it off. This is the only
# place a bump is armed, so none merges while this check fails or before it
# has run: the merge queue does not wait for it, as it is not required. The
# job bump-guard turns it off at once when someone else pushes to the branch.
#
# What that protects, and what it doesn't. Both jobs check out main's
# //catalog:bump, which decides; catalog-bump's own commits only ever touch
# catalog/tools.json and the site's _data/tools.yml, and //catalog:bump holds any
# bump pull request that changes anything else. But on `pull_request` GitHub
# runs THIS FILE as it stands in the pull request's merge commit: a person
# with push access who edits it on a bump branch runs their own version,
# with the App key. That is true of every workflow here while main needs no
# approval; the fix is repo-wide (the App key in an environment only main
# can use), not in this file.
name: catalog-check

on:
  pull_request:
    paths:
      - catalog/**
      - .github/workflows/catalog-check.yaml

permissions:
  contents: read

concurrency:
  group: catalog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  downloads:
    # macOS: vitruvian-tool is a Swift command for macOS.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build vitruvian-tool
        run: |
          set -euo pipefail
          cache_flags=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache_flags=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel build --config=macos-app "${cache_flags[@]}" //packages/vitruvian-sdk:vitruvian-tool

      - name: Check each new or changed download
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/tools.base.json"
          if ! git show "origin/${BASE_REF}:catalog/tools.json" > "$base" 2>/dev/null; then
            echo '{"tools": []}' > "$base"
          fi
          cache_flags=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache_flags=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel run "${cache_flags[@]}" //catalog:check-downloads -- --base "$base" --head catalog/tools.json \
            --validate "$(bazel cquery --config=macos-app --output=files //packages/vitruvian-sdk:vitruvian-tool 2>/dev/null)"

  # A push to a bump branch, before anything else runs on it: when the new
  # head is not catalog-bump's single trailer commit, auto-merge goes off at
  # once and the pull request is held for a person (needs-human, one comment).
  # No `needs`, so it does not wait minutes for the macOS downloads job.
  bump-guard:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'catalog/bump-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # main's //catalog:bump decides, while the pull request leaves this file alone
      # (see the top of the file for what that does not cover).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
          # //catalog:bump, and the composite action that mints the App token.
          sparse-checkout: |
            catalog
            .github/actions

      # Pull requests only: it turns auto-merge off, labels, comments and
      # reads a compare (the repository is public). It can neither push nor
      # merge.
      - name: Mint App token
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core
          permission-pull-requests: write

      - name: Hold a person's commit at once
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTED: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rustc --edition 2021 --crate-type lib --crate-name catalog catalog/src/lib.rs -o "$RUNNER_TEMP/libcatalog.rlib"
          rustc --edition 2021 catalog/src/bin/bump.rs -L "$RUNNER_TEMP" --extern catalog="$RUNNER_TEMP/libcatalog.rlib" -o "$RUNNER_TEMP/bump"
          "$RUNNER_TEMP/bump" automerge --pr "$PR" --tested-sha "$TESTED" --check pushed --base "$BASE"

  # Arms auto-merge on a catalog-bump pull request once the downloads passed
  # on the commit the branch still holds, when the branch holds only
  # catalog-bump's one trailer commit, catalog-bump marked the body as one that
  # may merge itself, and nobody held it (needs-human, do-not-automerge, a
  # draft). It arms at that commit only (--match-head-commit). When the
  # downloads did not pass it turns auto-merge off; a person's commit is held.
  # `//catalog:bump -- automerge` decides and acts; //catalog:bump_test tests
  # it. Only a branch of this repository: a fork's pull request gets no secret.
  bump-automerge:
    needs: downloads
    if: >-
      always() &&
      startsWith(github.event.pull_request.head.ref, 'catalog/bump-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # main's //catalog:bump decides, while the pull request leaves this file alone
      # (see the top of the file for what that does not cover).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
          # //catalog:bump, and the composite action that mints the App token.
          sparse-checkout: |
            catalog
            .github/actions

      # The App's full token: arming auto-merge needs the right to merge
      # (contents: write) as well as pull-requests: write, and the shared
      # minting action can narrow a token to pull requests only.
      - name: Mint App token
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Arm auto-merge, turn it off, or hold it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          TESTED: ${{ github.event.pull_request.head.sha }}
          CHECK: ${{ needs.downloads.result }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rustc --edition 2021 --crate-type lib --crate-name catalog catalog/src/lib.rs -o "$RUNNER_TEMP/libcatalog.rlib"
          rustc --edition 2021 catalog/src/bin/bump.rs -L "$RUNNER_TEMP" --extern catalog="$RUNNER_TEMP/libcatalog.rlib" -o "$RUNNER_TEMP/bump"
          "$RUNNER_TEMP/bump" automerge --pr "$PR" --tested-sha "$TESTED" --check "$CHECK" --base "$BASE"
