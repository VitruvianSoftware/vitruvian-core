# Applies tabula's stateful tier (tabula/infra/data): the per-env Neon Postgres
# projects, the shared Upstash Redis, and the Secret Manager versions carrying
# their connection strings into each environment's project.
#
# ONE stack for all three environments — Neon and Upstash live in a single
# external account each, not per GCP project (see tabula/infra/data/main.go).
# Mirrors tabula-build-stack.yaml, the other cross-environment singleton.
#
# ⚠️ This stack owns the DATABASES. A `pulumi destroy` here deletes real data,
# which is why it is apply-only, gated, and never cancelled mid-flight.
name: tabula Data Stack Deploy

# DISPATCH ONLY — deliberately no `push:` trigger, unlike the sibling stacks.
#
# This stack owns DATABASES. An apply here creates real Neon projects and writes
# new connection strings into every environment's Secret Manager, so merging a
# change to it would REPOINT all three live environments at whatever it just
# built. That is not something a merge should do on its own schedule: it needs a
# human choosing the moment and verifying afterwards, per the expand/deploy/
# verify sequence in docs/superpowers/plans/2026-07-22-saas-stateful-tier-as-code.md.
#
# (Learned the hard way: the first version of this workflow had a push trigger,
# so merging the stack auto-applied it the moment it landed.)
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Serialize applies; never cancel an in-flight pulumi up against a database.
    concurrency:
      group: tabula-data-stack-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same gate as the build stack: this applies with the stage-4 projects SA,
    # which already owns the bu2 projects the secrets are written into.
    environment: foundation-proj-shared
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit (intermittent 403s).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The Neon and Upstash providers authenticate from the environment. Both
      # credentials live in the infra-pipeline project's Secret Manager, seeded
      # out of band with `bazel run //tools/gcp-secrets:seed -- tabula/infra/build`
      # (a secret VALUE is the one thing that cannot ship as code).
      #
      # Read into GITHUB_ENV with ::add-mask:: first, so a value cannot surface in
      # a log line even if a later step echoes its environment.
      - name: Fetch provider credentials from Secret Manager
        env:
          CRED_PROJECT: prj-c-bu2-infra-pipeline-3d09
        run: |
          set -euo pipefail
          for pair in "NEON_API_KEY:NEON_API_KEY" \
                      "UPSTASH_API_KEY:UPSTASH_API_KEY" \
                      "UPSTASH_EMAIL:UPSTASH_EMAIL"; do
            secret="${pair%%:*}"; var="${pair##*:}"
            if ! value="$(gcloud secrets versions access latest \
                  --secret="${secret}" --project="${CRED_PROJECT}" 2>/dev/null)"; then
              echo "::error::${secret} has no value in ${CRED_PROJECT}." \
                   "Seed it with: bazel run //tools/gcp-secrets:seed -- tabula/infra/build"
              exit 1
            fi
            echo "::add-mask::${value}"
            echo "${var}=${value}" >> "${GITHUB_ENV}"
          done

      # The Neon ORG the projects are created in. NOT hardcoded: the org id
      # belongs to whichever Neon account the API key is for, and pinning the
      # wrong one fails deep in the apply with a misleading
      # "not an organization member" 404 rather than a config error. Resolve it
      # from the key itself, and refuse to guess if the account has more than
      # one org.
      - name: Resolve the Neon organization
        run: |
          set -euo pipefail
          body="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            https://console.neon.tech/api/v2/users/me/organizations)" || {
              echo "::error::could not list Neon organizations for this API key"; exit 1; }
          count="$(printf '%s' "$body" | jq '[.organizations[]?] | length')"
          if [ "$count" = "0" ]; then
            echo "::error::the Neon API key's account belongs to no organization." \
                 "Create one in the Neon console — a project outside an org is owned by an individual."
            exit 1
          fi
          if [ "$count" != "1" ]; then
            echo "::error::the Neon account has ${count} organizations; refusing to guess." \
                 "Set tabula-data:neonOrgId explicitly in Pulumi.production.yaml. Found:" \
                 "$(printf '%s' "$body" | jq -r '[.organizations[].id] | join(", ")')"
            exit 1
          fi
          org="$(printf '%s' "$body" | jq -r '.organizations[0].id')"
          echo "Neon organization: ${org}"
          echo "TABULA_NEON_ORG_ID=${org}" >> "${GITHUB_ENV}"

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (tabula-data / production)
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: tabula/infra/data
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (production)"
          { pulumi stack select -c "production" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      - name: Pulumi digest → step summary
        if: always()
        env:
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "tabula-data" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"
