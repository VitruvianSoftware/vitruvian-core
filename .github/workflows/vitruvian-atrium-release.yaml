# release-please for the Vitruvian Atrium macOS app:
# 1. Authors release PRs from conventional commits under apps/desktop/vitruvian-atrium/.
# 2. When the release PR merges, cuts the GitHub Release (tag: vitruvian-atrium-vX.Y.Z).
# The DMG is NOT built here: that release fires the `vitruvian-atrium` unit's
# production rung in the generated delivery-vitruvian-atrium.yaml, which attaches
# VitruvianAtrium-X.Y.Z.dmg (declared in apps/desktop/vitruvian-atrium/BUILD).
name: vitruvian-atrium-release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/vitruvian-atrium/**"
      - ".github/workflows/vitruvian-atrium-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. vitruvian-atrium-v3.4.1). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Never cancel a release run; serialize them on the branch so rapid merges
    # to main cannot race the release PR / tag creation (issue #461).
    concurrency:
      group: vitruvian-atrium-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/desktop/vitruvian-atrium--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/desktop/vitruvian-atrium--tag_name'] }}
      version: ${{ steps.release.outputs['apps/desktop/vitruvian-atrium--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-please PRs must be authored by an App (not GITHUB_TOKEN) so the
      # PR triggers the merge queue's required checks.
      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while the PR is in the merge queue, so a
      # queued release PR could not be refreshed and merged without the change
      # that just landed (#2938). Out of the queue it can; release-beta-gate.yaml
      # queues it again once the beta DMG exists for the new code.
      - name: Build //tools/ci:release_pr_dequeue (no Bazel on this job)
        id: dequeue-bin
        if: ${{ inputs.tag == '' }}
        uses: ./.github/actions/build-ci-tool
        with:
          tool: release_pr_dequeue

      - name: Take a stale release PR out of the merge queue
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-atrium
          CODE_PATH: apps/desktop/vitruvian-atrium
          MAIN_SHA: ${{ github.sha }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN"'

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/desktop/vitruvian-atrium/release-please-config.json
          manifest-file: apps/desktop/vitruvian-atrium/.release-please-manifest.json
          target-branch: main

      # Vitruvian 3.89.0 and earlier look for updates only under tags
      # vitruvian-v*, and download Vitruvian-X.Y.Z-universal.dmg from them.
      # So each release is also a release under that name: made here, by
      # release-please's App, because the tag ruleset (release_tags.go) lets
      # only it create tags. The delivery workflow's publish step uploads the
      # DMG to it. Idempotent, and it fills in the current version whenever
      # this runs, so a release whose copy is missing gets one on the next run.
      - name: Publish the release under the name 3.89.0 and earlier update from
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["apps/desktop/vitruvian-atrium"])' \
            apps/desktop/vitruvian-atrium/.release-please-manifest.json)"
          tag="vitruvian-atrium-v${version}"
          legacy="vitruvian-v${version}"
          if ! gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            echo "$tag is not released yet: nothing to copy"
            exit 0
          fi
          if gh release view "$legacy" -R "$REPO" >/dev/null 2>&1; then
            echo "$legacy is there already"
            exit 0
          fi
          sha="$(gh api "repos/${REPO}/commits/${tag}" --jq .sha)"
          gh release create "$legacy" -R "$REPO" --target "$sha" --latest=false \
            --title "Vitruvian Atrium ${version} (update for Vitruvian 3.89.0 and earlier)" \
            --notes "The update path for Macs on Vitruvian 3.89.0 or earlier, which look for releases under this name. The release itself is ${tag}."
          echo "made $legacy at $sha"
