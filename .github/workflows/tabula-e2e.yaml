# The tabula E2E lane: Playwright drives headless Chromium with the MV3
# extension against a fully hermetic Bazel-managed stack (PostgreSQL, Redis,
# migrations, the Fastify API). e2e-tagged targets are excluded from the
# default test sweep (.bazelrc) and run only here; Chromium's host system
# libraries are the one non-hermetic input, installed below.
#
# jest coverageThreshold enforcement runs in a SEPARATE, parallel `coverage`
# job (below) rather than as a second step in this lane — the slow Playwright
# run and the coverage re-run used to stack sequentially on the critical path.

name: tabula-e2e

on:
  push:
    branches: [main]
    paths:
      - "tabula/**"
      - "tools/testinfra/**"
      - ".github/workflows/tabula-e2e.yaml"
  pull_request:
    branches: [main]
    paths:
      - "tabula/**"
      - "tools/testinfra/**"
      - ".github/workflows/tabula-e2e.yaml"
  # Quarantine lane (#501): specs tagged @quarantine are EXCLUDED from the
  # blocking push/PR runs above (one flaky spec must not fail unrelated PRs)
  # but still run nightly here, so a quarantined test keeps producing signal
  # -- the green-streak evidence its tracking issue needs to un-quarantine,
  # or the continuing-red evidence that keeps the issue honest. Policy:
  # docs/engineering/flaky-tests.md.
  schedule:
    - cron: "30 6 * * *"

# Cancel a PR's in-flight e2e when a newer push to the same PR supersedes it.
# NEVER cancels the push-to-main or nightly-schedule lanes -- same invariant
# ci.yaml states, for the same reason: their results VERIFY what is already on
# main, so a cancelled run is a commit that main never got a verdict for.
#
# Both halves of this matter, and the old `cancel-in-progress: true` broke both:
#
#  - push-to-main. Observed 2026-07-28: ed081f43 ("Bump the go-minor-patch
#    group across 3 directories") landed and its run was cancelled 2m6s in by
#    the next merge -- BOTH `e2e` and `coverage` killed, so that commit has no
#    e2e and no jest-coverage verdict on main. A later red run then misattributes
#    the breakage to the wrong commit, which is exactly what culprit-finder.yaml
#    has to bisect back out.
#
#  - the nightly schedule. `github.ref` is refs/heads/main for the schedule
#    event too, so the quarantine lane shared one group with every merge and any
#    merge landing while it ran would cancel it. That lane runs a DIFFERENT
#    target (//tabula/extension:e2e_quarantine, line ~176) than the push lane,
#    so nothing else reproduces the signal -- and green-streak evidence is the
#    whole point of #501/#512. `github.event_name` in the group key keeps the
#    schedule and push lanes from ever contending.
#
# WHY THE NON-PR LANES KEY ON `github.sha`, NOT `github.ref`. Turning
# cancel-in-progress off is NOT sufficient on its own: GitHub also cancels an
# already-PENDING run in a group when a newer one queues behind the running one.
# Merges here arrive in dependabot bursts -- 10:00:15 and 10:02:05 on 2026-07-28,
# ~2min apart, against a 4-7min e2e -- so a ref-keyed push lane would still drop
# the middle commits of a burst, just at a different point. `github.sha` is
# unique per commit, so every pushed commit gets its own group and its own
# verdict: nothing cancels it, nothing queues it behind a sibling. Bursts run in
# parallel, which is the same total work rather than extra.
concurrency:
  # pull_request: group by ref, so a newer push to the SAME PR supersedes the
  # old run. push / schedule: group by sha, unique per run, so they neither
  # cancel nor queue. cancel-in-progress is additionally pinned to the PR event
  # so the intent survives any later change to the key.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: both jobs only check out and run the hermetic
# Bazel stack (e2e + coverage); upload-artifact needs no token scope. Pin
# contents: read explicitly so the floor does not rely on the repo/org
# default-permissions setting.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      # The hermetic Bazel stack (PostgreSQL, Redis, the JDK toolchain,
      # Chromium) plus coverage instrumentation can exhaust the ~14GB free on
      # a stock ubuntu-latest runner. A prior run died with 86MB left: a Java
      # toolchain build action failed mid-write and the whole lane was
      # reported as a (misleading) flaky e2e failure. See the free-disk-space
      # composite for the common reclaim set + rationale; this lane also strips
      # powershell/swift, which it never touches either.
      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space
        with:
          extra-paths: |
            /usr/local/share/powershell
            /usr/share/swift

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # Restore the extracted LLVM toolchain (#1039) and pair it with the
      # tripwire below -- see the llvm-cache-restore composite for the
      # rationale and the content-hash pin (kept in exactly one place there).
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: ./.github/actions/llvm-cache-restore

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).

      - name: Install Chromium system libraries
        # Playwright's Chromium needs host .so's (nss/atk/libdrm/fonts...) —
        # the one genuinely non-hermetic layer of the E2E stack.
        run: npx --yes playwright@1.57.0 install-deps chromium

      - name: Run E2E suite
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # Share the BuildBuddy cache when the key is present (internal PRs +
          # push to main); fall back to a fully local run when it is absent (e.g.
          # a fork PR) so the lane never hard-depends on a secret it may not have.
          # Cache-only keeps test EXECUTION on the runner, where the Chromium
          # system libraries installed above live (full RBE would not have them).
          cache=()
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            cache=(--config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY")
          fi
          # Quarantine split (#501, docs/engineering/flaky-tests.md). The grep
          # filters are BAKED INTO the Bazel targets (tabula/extension/BUILD),
          # NOT passed via --test_arg: pw_suite uses fixed_args because the
          # service manager execs the binary directly, so Bazel-time test args
          # would silently never reach Playwright.
          #   blocking lanes (push/PR): //tabula/... -- :e2e excludes
          #     @quarantine-tagged specs via its baked --grep-invert, and the
          #     manual-tagged :e2e_quarantine is skipped by the wildcard.
          #   nightly schedule: ONLY the quarantined specs, by explicit label.
          #     --nocache_test_results: a cached pass would hollow out the
          #     green-streak evidence the tracking issue needs.
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            bazel test "${cache[@]}" --config=e2e --nocache_test_results //tabula/extension:e2e_quarantine
          else
            bazel test "${cache[@]}" --config=e2e //tabula/...
          fi

      - name: Report slowest E2E tests
        # Surface the per-test durations the 'list' reporter wrote into Bazel's
        # test.log, so the lane's real cost is visible at a glance. Best-effort;
        # never fails the build.
        if: always()
        continue-on-error: true
        run: |
          log="bazel-testlogs/tabula/extension/e2e/test.log"
          if [ ! -f "$log" ]; then echo "no test.log at $log"; exit 0; fi
          echo "### Slowest E2E tests (top 25, milliseconds)"
          sed -E 's/\x1b\[[0-9;]*m//g' "$log" \
            | grep -E '\([0-9.]+(ms|s|m)\)[[:space:]]*$' \
            | awk '{
                d=$NF; gsub(/[()]/,"",d);
                if (d ~ /ms$/)      ms=substr(d,1,length(d)-2)+0;
                else if (d ~ /m$/)  ms=substr(d,1,length(d)-1)*60000;
                else                ms=substr(d,1,length(d)-1)*1000;
                printf "%8.0f\t%s\n", ms, $0;
              }' \
            | sort -rn | head -25

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: bazel-testlogs/tabula/extension/e2e/
          retention-days: 7

      # Tripwire -- see the llvm-cache-tripwire composite for the rationale
      # (hardened per review on #1304 after a placement-bug incident).
      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  coverage:
    # jest coverageThreshold enforcement for the tabula unit/integration suites.
    # Runs in PARALLEL with the `e2e` job: `bazel coverage` excludes e2e-tagged
    # targets (the coverage command inherits --test_tag_filters=-e2e), so this no
    # longer stacks ~80s onto the e2e critical path. Needs the Bazel stack but
    # not Chromium. Skipped on the nightly quarantine schedule (#501) -- that
    # lane exists only to re-run quarantined e2e specs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      # Coverage instrumentation is disk-heavy; reclaim the same unused SDKs as
      # the e2e job (see the free-disk-space composite for the rationale; the
      # Android SDK is kept).
      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space
        with:
          extra-paths: |
            /usr/local/share/powershell
            /usr/share/swift

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # Restore the extracted LLVM toolchain (#1039) and pair it with the
      # tripwire below -- see the llvm-cache-restore composite for the
      # rationale and the content-hash pin (kept in exactly one place there).
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: ./.github/actions/llvm-cache-restore

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).

      - name: Enforce coverage thresholds
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # Cache-only: reuse the tabula build CI already cached (this lane
          # otherwise rebuilds the whole stack from cold). Key-guarded so a fork
          # PR without the secret still runs fully locally.
          cache=()
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            cache=(--config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY")
          fi
          bazel coverage "${cache[@]}" //tabula/...
      # Tripwire -- see the llvm-cache-tripwire composite for the rationale
      # (hardened per review on #1304 after a placement-bug incident).
      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

