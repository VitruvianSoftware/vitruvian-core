# The tabula E2E lane: Playwright drives headless Chromium with the MV3
# extension against a fully hermetic Bazel-managed stack (PostgreSQL, Redis,
# migrations, the Fastify API). e2e-tagged targets are excluded from the
# default test sweep (.bazelrc) and run only here; Chromium's host system
# libraries are the one non-hermetic input, installed below.
#
# jest coverageThreshold enforcement runs in a SEPARATE, parallel `coverage`
# job (below) rather than as a second step in this lane — the slow Playwright
# run and the coverage re-run used to stack sequentially on the critical path.

name: tabula-e2e

on:
  push:
    branches: [main]
    paths:
      - "tabula/**"
      - "tools/testinfra/**"
      - ".github/workflows/tabula-e2e.yaml"
  pull_request:
    branches: [main]
    paths:
      - "tabula/**"
      - "tools/testinfra/**"
      - ".github/workflows/tabula-e2e.yaml"
  # Quarantine lane (#501): specs tagged @quarantine are EXCLUDED from the
  # blocking push/PR runs above (one flaky spec must not fail unrelated PRs)
  # but still run nightly here, so a quarantined test keeps producing signal
  # -- the green-streak evidence its tracking issue needs to un-quarantine,
  # or the continuing-red evidence that keeps the issue honest. Policy:
  # docs/engineering/flaky-tests.md.
  schedule:
    - cron: "30 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: both jobs only check out and run the hermetic
# Bazel stack (e2e + coverage); upload-artifact needs no token scope. Pin
# contents: read explicitly so the floor does not rely on the repo/org
# default-permissions setting.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Free up runner disk space
        # The hermetic Bazel stack (PostgreSQL, Redis, the JDK toolchain,
        # Chromium) plus coverage instrumentation can exhaust the ~14GB free on
        # a stock ubuntu-latest runner. A prior run died with 86MB left: a Java
        # toolchain build action failed mid-write and the whole lane was
        # reported as a (misleading) flaky e2e failure. Reclaim large
        # preinstalled SDKs this lane never touches before building (~12GB).
        #
        # Do NOT remove /usr/local/lib/android: rules_android in the module
        # graph fetches an android_sdk_repository at analysis time and aborts the
        # build if the SDK is gone ("No Android SDK apis found"), even though no
        # Android target is built here. Likewise keep /opt/hostedtoolcache/node
        # and .../Python (used by `npx playwright`); only CodeQL is removed from
        # the toolcache. `|| true` so a missing path is never fatal.
        run: |
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          echo "Disk after cleanup:" && df -h /

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # Cache the EXTRACTED llvm toolchain (#1039) -- the dominant variance
      # source in this gate (uncached extraction measured 98-264s/run; the
      # build-test spread is 336-545s).
      #
      # Why none of the generic layers ever covered it (all verified):
      #  - repository-cache caches DOWNLOADS; extraction lands in the Bazel 9
      #    repo contents cache (~/.cache/bazel-repo/contents) and the shared
      #    "repository" entry is immutable + won by whichever job saves first --
      #    a cheap lane that never fetched llvm (169MB entry, dated pre-#1297).
      #  - setup-bazel's external-cache sizes $output_base/external/* entries;
      #    the llvm entry there is a SYMLINK into the contents cache
      #    (du: 4.0K apparent vs 8.2G real), so it always falls under the 10MB
      #    floor and is silently skipped (#1302, closed).
      #  - caching the whole contents tree is 3.81GB compressed -- too fat for
      #    the 10GB Actions budget. The llvm subtree is 8.2G of the 13G, so this
      #    caches exactly that content-hash dir and nothing else.
      #
      # The path pins llvm's content hash. It changes ONLY when the llvm archive
      # changes (bump of llvm_versions in MODULE.bazel); the tripwire step below
      # turns a stale pin into a loud warning instead of a silent regression to
      # uncached extraction. Restore runs here; the save happens in this
      # action's post step after the build, only on a key miss.
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/bazel-repo/contents/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          key: llvm-contents-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
      - name: Record LLVM candidate count (pre-build)
        id: llvm-pre
        run: |
          PIN=/home/runner/.cache/bazel-repo/contents/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          echo "count=$(ls "$PIN" 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).

      - name: Install Chromium system libraries
        # Playwright's Chromium needs host .so's (nss/atk/libdrm/fonts...) —
        # the one genuinely non-hermetic layer of the E2E stack.
        run: npx --yes playwright@1.57.0 install-deps chromium

      - name: Run E2E suite
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # Share the BuildBuddy cache when the key is present (internal PRs +
          # push to main); fall back to a fully local run when it is absent (e.g.
          # a fork PR) so the lane never hard-depends on a secret it may not have.
          # Cache-only keeps test EXECUTION on the runner, where the Chromium
          # system libraries installed above live (full RBE would not have them).
          cache=()
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            cache=(--config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY")
          fi
          # Quarantine split (#501, docs/engineering/flaky-tests.md). The grep
          # filters are BAKED INTO the Bazel targets (tabula/extension/BUILD),
          # NOT passed via --test_arg: pw_suite uses fixed_args because the
          # service manager execs the binary directly, so Bazel-time test args
          # would silently never reach Playwright.
          #   blocking lanes (push/PR): //tabula/... -- :e2e excludes
          #     @quarantine-tagged specs via its baked --grep-invert, and the
          #     manual-tagged :e2e_quarantine is skipped by the wildcard.
          #   nightly schedule: ONLY the quarantined specs, by explicit label.
          #     --nocache_test_results: a cached pass would hollow out the
          #     green-streak evidence the tracking issue needs.
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            bazel test "${cache[@]}" --config=e2e --nocache_test_results //tabula/extension:e2e_quarantine
          else
            bazel test "${cache[@]}" --config=e2e //tabula/...
          fi

      - name: Report slowest E2E tests
        # Surface the per-test durations the 'list' reporter wrote into Bazel's
        # test.log, so the lane's real cost is visible at a glance. Best-effort;
        # never fails the build.
        if: always()
        continue-on-error: true
        run: |
          log="bazel-testlogs/tabula/extension/e2e/test.log"
          if [ ! -f "$log" ]; then echo "no test.log at $log"; exit 0; fi
          echo "### Slowest E2E tests (top 25, milliseconds)"
          sed -E 's/\x1b\[[0-9;]*m//g' "$log" \
            | grep -E '\([0-9.]+(ms|s|m)\)[[:space:]]*$' \
            | awk '{
                d=$NF; gsub(/[()]/,"",d);
                if (d ~ /ms$/)      ms=substr(d,1,length(d)-2)+0;
                else if (d ~ /m$/)  ms=substr(d,1,length(d)-1)*60000;
                else                ms=substr(d,1,length(d)-1)*1000;
                printf "%8.0f\t%s\n", ms, $0;
              }' \
            | sort -rn | head -25

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: bazel-testlogs/tabula/extension/e2e/
          retention-days: 7

      # Tripwire (#1039, hardened per review on #1304): assert the cache was
      # USED, not merely that the pinned hash still exists. The first version
      # checked only whether the pin moved -- and stayed green while build-test
      # extracted with NO cache step at all (the placement bug), because
      # extraction itself creates the pinned dir. Same green-but-degraded shape
      # as the dead TD fast path (#1260): a guard must test the outcome.
      #
      #  - restore step missing/skipped        -> FAIL (structural, never legit)
      #  - restored a hit, but Bazel STILL     -> FAIL (recorded-inputs mismatch;
      #    materialized a new candidate            the cache is dead weight)
      #  - key miss                            -> notice only (expected once
      #                                            after an llvm_versions bump)
      #  - llvm under a different content hash -> warning with replacement hash
      - name: LLVM cache tripwire
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.llvm-contents.outcome }}
          CACHE_HIT: ${{ steps.llvm-contents.outputs.cache-hit }}
          PRE_COUNT: ${{ steps.llvm-pre.outputs.count }}
        run: |
          C=/home/runner/.cache/bazel-repo/contents
          PIN=$C/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          POST_COUNT=$(ls "$PIN" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESTORE_OUTCOME" != "success" ]; then
            echo "::error title=llvm-contents-cache broken::the 'Restore the extracted LLVM toolchain' step did not run in this job (outcome='$RESTORE_OUTCOME'). This is the exact placement bug that shipped once already -- the lane pays full extraction while everything looks green."
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ] && [ "${POST_COUNT:-0}" -gt "${PRE_COUNT:-0}" ]; then
            echo "::error title=llvm-contents-cache dead weight::cache HIT restored a candidate but Bazel materialized a NEW one anyway (candidates $PRE_COUNT -> $POST_COUNT): recorded-inputs validation rejected the restored dir, so every run now pays restore AND extraction. Investigate before this rots."
            exit 1
          fi
          if [ "$CACHE_HIT" != "true" ] && [ "${POST_COUNT:-0}" -gt 0 ]; then
            echo "::notice::llvm-contents cache miss -- extracted and the post step will save. Expected exactly once after an llvm_versions bump."
          fi
          if [ ! -d "$PIN" ] && compgen -G "$C/*/*/bin/clang" >/dev/null 2>&1; then
            NEW=$(dirname "$(dirname "$(compgen -G "$C/*/*/bin/clang" | head -1)")")
            echo "::warning title=llvm-contents-cache stale::LLVM materialized under $(basename "$(dirname "$NEW")") but the cache pins b2a833d3... -- update the pinned hash in ci.yaml (both jobs)."
            {
              echo "### llvm-contents-cache pinned hash is stale"
              echo "- expected: b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513"
              echo "- actual:   $(basename "$(dirname "$NEW")")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi


  coverage:
    # jest coverageThreshold enforcement for the tabula unit/integration suites.
    # Runs in PARALLEL with the `e2e` job: `bazel coverage` excludes e2e-tagged
    # targets (the coverage command inherits --test_tag_filters=-e2e), so this no
    # longer stacks ~80s onto the e2e critical path. Needs the Bazel stack but
    # not Chromium. Skipped on the nightly quarantine schedule (#501) -- that
    # lane exists only to re-run quarantined e2e specs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Free up runner disk space
        # Coverage instrumentation is disk-heavy; reclaim the same unused SDKs as
        # the e2e job (see that step for the rationale; the Android SDK is kept).
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      # Cache the EXTRACTED llvm toolchain (#1039) -- the dominant variance
      # source in this gate (uncached extraction measured 98-264s/run; the
      # build-test spread is 336-545s).
      #
      # Why none of the generic layers ever covered it (all verified):
      #  - repository-cache caches DOWNLOADS; extraction lands in the Bazel 9
      #    repo contents cache (~/.cache/bazel-repo/contents) and the shared
      #    "repository" entry is immutable + won by whichever job saves first --
      #    a cheap lane that never fetched llvm (169MB entry, dated pre-#1297).
      #  - setup-bazel's external-cache sizes $output_base/external/* entries;
      #    the llvm entry there is a SYMLINK into the contents cache
      #    (du: 4.0K apparent vs 8.2G real), so it always falls under the 10MB
      #    floor and is silently skipped (#1302, closed).
      #  - caching the whole contents tree is 3.81GB compressed -- too fat for
      #    the 10GB Actions budget. The llvm subtree is 8.2G of the 13G, so this
      #    caches exactly that content-hash dir and nothing else.
      #
      # The path pins llvm's content hash. It changes ONLY when the llvm archive
      # changes (bump of llvm_versions in MODULE.bazel); the tripwire step below
      # turns a stale pin into a loud warning instead of a silent regression to
      # uncached extraction. Restore runs here; the save happens in this
      # action's post step after the build, only on a key miss.
      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/bazel-repo/contents/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          key: llvm-contents-v1-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
      - name: Record LLVM candidate count (pre-build)
        id: llvm-pre
        run: |
          PIN=/home/runner/.cache/bazel-repo/contents/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          echo "count=$(ls "$PIN" 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor).
      # `build-test` is a REQUIRED status check behind the merge queue, so it
      # must ALWAYS report a result -- a naive `paths-ignore` would make it never
      # report and wedge the PR "pending" forever, and merge_group events ignore
      # `paths:` anyway. So we keep triggering on every event and only
      # short-circuit the pull_request and push lanes: when the diff is
      # docs/gitops/markdown-only the affected-targets step below is skipped and
      # the job reports success fast. Native git diff -- no third-party action;
      # ci.yaml already checks out with fetch-depth: 0 so the merge-base is here.
      # The merge_group lane never consults this gate: its affected-target run
      # decides scope itself (and fails safe to //...).

      - name: Enforce coverage thresholds
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # Cache-only: reuse the tabula build CI already cached (this lane
          # otherwise rebuilds the whole stack from cold). Key-guarded so a fork
          # PR without the secret still runs fully locally.
          cache=()
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            cache=(--config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY")
          fi
          bazel coverage "${cache[@]}" //tabula/...
      # Tripwire (#1039, hardened per review on #1304): assert the cache was
      # USED, not merely that the pinned hash still exists. The first version
      # checked only whether the pin moved -- and stayed green while build-test
      # extracted with NO cache step at all (the placement bug), because
      # extraction itself creates the pinned dir. Same green-but-degraded shape
      # as the dead TD fast path (#1260): a guard must test the outcome.
      #
      #  - restore step missing/skipped        -> FAIL (structural, never legit)
      #  - restored a hit, but Bazel STILL     -> FAIL (recorded-inputs mismatch;
      #    materialized a new candidate            the cache is dead weight)
      #  - key miss                            -> notice only (expected once
      #                                            after an llvm_versions bump)
      #  - llvm under a different content hash -> warning with replacement hash
      - name: LLVM cache tripwire
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.llvm-contents.outcome }}
          CACHE_HIT: ${{ steps.llvm-contents.outputs.cache-hit }}
          PRE_COUNT: ${{ steps.llvm-pre.outputs.count }}
        run: |
          C=/home/runner/.cache/bazel-repo/contents
          PIN=$C/b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513
          POST_COUNT=$(ls "$PIN" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESTORE_OUTCOME" != "success" ]; then
            echo "::error title=llvm-contents-cache broken::the 'Restore the extracted LLVM toolchain' step did not run in this job (outcome='$RESTORE_OUTCOME'). This is the exact placement bug that shipped once already -- the lane pays full extraction while everything looks green."
            exit 1
          fi
          if [ "$CACHE_HIT" = "true" ] && [ "${POST_COUNT:-0}" -gt "${PRE_COUNT:-0}" ]; then
            echo "::error title=llvm-contents-cache dead weight::cache HIT restored a candidate but Bazel materialized a NEW one anyway (candidates $PRE_COUNT -> $POST_COUNT): recorded-inputs validation rejected the restored dir, so every run now pays restore AND extraction. Investigate before this rots."
            exit 1
          fi
          if [ "$CACHE_HIT" != "true" ] && [ "${POST_COUNT:-0}" -gt 0 ]; then
            echo "::notice::llvm-contents cache miss -- extracted and the post step will save. Expected exactly once after an llvm_versions bump."
          fi
          if [ ! -d "$PIN" ] && compgen -G "$C/*/*/bin/clang" >/dev/null 2>&1; then
            NEW=$(dirname "$(dirname "$(compgen -G "$C/*/*/bin/clang" | head -1)")")
            echo "::warning title=llvm-contents-cache stale::LLVM materialized under $(basename "$(dirname "$NEW")") but the cache pins b2a833d3... -- update the pinned hash in ci.yaml (both jobs)."
            {
              echo "### llvm-contents-cache pinned hash is stale"
              echo "- expected: b2a833d3b1074c70ca2f8457e96897f8a6e275cb44162aeeb1f914937594d513"
              echo "- actual:   $(basename "$(dirname "$NEW")")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

