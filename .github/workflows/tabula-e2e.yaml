# The tabula E2E lane: Playwright drives headless Chromium with the MV3
# extension against a fully hermetic Bazel-managed stack (PostgreSQL, Redis,
# migrations, the Fastify API). e2e-tagged targets are excluded from the
# default test sweep (.bazelrc) and run only here; Chromium's host system
# libraries are the one non-hermetic input, installed below. Coverage for the
# tabula unit/integration suites (jest coverageThreshold enforcement) also
# runs in this lane.

name: tabula-e2e

on:
  push:
    branches: [main]
    paths:
      - "tabula/**"
      - "tools/testinfra/**"
      - ".github/workflows/tabula-e2e.yaml"
  pull_request:
    branches: [main]
    paths:
      - "tabula/**"
      - "tools/testinfra/**"
      - ".github/workflows/tabula-e2e.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          bazelrc: |
            common --announce_rc --color=yes
            common --show_progress_rate_limit=60 --show_timestamps

      - name: Install Chromium system libraries
        # Playwright's Chromium needs host .so's (nss/atk/libdrm/fonts...) —
        # the one genuinely non-hermetic layer of the E2E stack.
        run: npx --yes playwright@1.57.0 install-deps chromium

      - name: Run E2E suite
        run: bazel test --config=e2e //tabula/...

      - name: Enforce coverage thresholds
        run: bazel coverage //tabula/...

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: bazel-testlogs/tabula/extension/e2e/
          retention-days: 7
