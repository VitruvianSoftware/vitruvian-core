name: pulumi-library-release

on:
  push:
    branches: [main]
    paths:
      - "pulumi/library/**"
      - ".github/workflows/pulumi-library-release.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    # Just a full-history checkout + changed-package diff; cap it so a hung
    # clone/step can't pin a runner. Matches the 10-min floor other lightweight
    # jobs use (the release-please job below is capped separately at 45).
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need history for diff
      - id: set-matrix
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Detect changed files in this push. Fall back to all packages if
          # the before SHA is the zero-ref (branch creation / force push).
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${BEFORE_SHA}" = "${ZERO_SHA}" ] || ! git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "setup: cannot compute diff (new branch or force-push) → releasing all packages"
            ALL=true
          else
            CHANGED_FILES="$(git diff --name-only "${BEFORE_SHA}" HEAD)"
            ALL=false
          fi

          cd pulumi/library
          # Discover all packages that have a release-please-config.json
          ALL_PKGS=$(find * -name "release-please-config.json" -exec dirname {} \;)

          if [ "${ALL}" = "true" ]; then
            MATCHED_PKGS="${ALL_PKGS}"
          else
            # Keep only packages where at least one changed file falls under
            # the package's directory (prefixed with pulumi/library/).
            MATCHED_PKGS=""
            while IFS= read -r pkg; do
              [ -z "${pkg}" ] && continue
              pkg_path="pulumi/library/${pkg}"
              if echo "${CHANGED_FILES}" | grep -q "^${pkg_path}/"; then
                MATCHED_PKGS="${MATCHED_PKGS}${MATCHED_PKGS:+$'\n'}${pkg}"
              fi
            done <<< "${ALL_PKGS}"
          fi

          if [ -z "${MATCHED_PKGS}" ]; then
            echo "setup: no library packages changed → empty matrix"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "setup: releasing packages:"
            echo "${MATCHED_PKGS}" | sed 's/^/  /'
            json_array=$(echo "${MATCHED_PKGS}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map("pulumi/library/" + .)')
            echo "matrix=$json_array" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Per-package concurrency: serialize each package's runs independently
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.package }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        package: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Mint App token for the release PR
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ matrix.package }}/release-please-config.json
          manifest-file: ${{ matrix.package }}/.release-please-manifest.json
          target-branch: main
