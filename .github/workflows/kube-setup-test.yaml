# Guard for the cluster status line .claude/kube-setup.sh prints at session
# start: the only word an agent gets on whether kubectl will work. It drives the
# real hook against fake tailscale and kubectl binaries and checks the line says
# "reachable" only when the apiserver answered, and why not otherwise (a revoked
# TS_AUTHKEY, no tailscaled, a rejected LAB_SA_TOKEN, a silent apiserver).
name: Kube Setup Hook Test

on:
  pull_request:
    paths:
      - ".claude/kube-setup.sh"
      - ".claude/settings.json"
      - "tools/ci/kube-setup_test.sh"
      - ".github/workflows/kube-setup-test.yaml"
  push:
    branches: [main]
    paths:
      - ".claude/kube-setup.sh"
      - ".claude/settings.json"
      - "tools/ci/kube-setup_test.sh"
      - ".github/workflows/kube-setup-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the kube-setup hook tests
        run: bash tools/ci/kube-setup_test.sh
