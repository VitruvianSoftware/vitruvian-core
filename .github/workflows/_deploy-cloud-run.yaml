name: _deploy-cloud-run

# Reusable blue-green Cloud Run deploy (#500, docs/repo-assessment.md §5.3),
# extracted verbatim from tabula's production pipeline (the reference
# implementation): Bazel rules_oci image push -> optional Prisma migrations ->
# Pulumi candidate at 0% traffic -> smoke the candidate's dedicated URL ->
# shift 100%. A smoke failure exits before the shift, so the live revision
# keeps serving and there is nothing to roll back.
#
# Deploy-phase inputs (image tag / stable revision / promote) pass to the
# Pulumi program as per-invocation <ENV-PREFIX>_* environment variables, NOT
# `pulumi config set` (#499): env is process-scoped, so a local run
# interleaving with CI -- or two operators on one env -- can never read each
# other's half-written config and shift traffic to the wrong revision.
#
# Caller contract:
#   * job-level `environment: <app-name>-<environment>` supplies the WIF vars
#     (GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT,
#     GCP_PROJECT_ID, GCP_REGION) -- pass `secrets: inherit`.
#   * The Pulumi program reads <env-prefix>_IMAGE_TAG / _PROMOTE /
#     _STABLE_REVISION (see infrastructure/pulumi/apps/tabula/main.go envOrConfig).
#   * Migrations (run-migrations: true) implement the vendored-Prisma pattern;
#     an app with a different migration story extends this workflow rather
#     than bolting steps around the call.

on:
  workflow_call:
    inputs:
      app-name:
        description: "App name; GitHub environment is <app-name>-<environment>"
        required: true
        type: string
      environment:
        description: "development | nonproduction | production"
        required: true
        type: string
      bazel-image-target:
        description: 'Bazel target for oci_push (e.g. //tabula/api:image_push). Optional if dockerfile-dir is provided.'
        required: false
        type: string
        default: ''
      dockerfile-dir:
        description: 'Directory containing the Dockerfile to build and push. Optional if bazel-image-target is provided.'
        required: false
        type: string
        default: ''
      image-digest:
        description: >-
          Pre-built immutable image ref (<ar>/<image>@sha256:...) from a
          build-once job. When set, the in-job build/push (and the Artifact
          Registry bootstrap) are skipped and the digest is promoted as-is:
          the Pulumi program receives <env-prefix>_IMAGE_DIGEST instead of
          <env-prefix>_IMAGE_TAG (build-once / promote-by-digest).
        required: false
        type: string
        default: ""
      image-repository-path:
        description: "Artifact Registry path under the project, e.g. tabula/api (build path only; unused when image-digest is set)"
        required: false
        type: string
        default: ""
      artifact-repository:
        description: "Artifact Registry repository name (first path segment), e.g. tabula (build path only; unused when image-digest is set)"
        required: false
        type: string
        default: ""
      default-region:
        description: >-
          Fallback region when the GitHub Environment defines no GCP_REGION
          variable. Kept caller-scoped because different apps live in
          different regions (tabula: us-central1, oauth-user-inspector:
          us-west1).
        required: false
        type: string
        default: "us-central1"
      service-name:
        description: "Cloud Run service name pattern; '-<environment>' is appended, e.g. tabula-api"
        required: true
        type: string
      pulumi-dir:
        description: "Pulumi project dir, e.g. infrastructure/pulumi/apps/tabula"
        required: true
        type: string
      env-prefix:
        description: "Env-var prefix the Pulumi program reads, e.g. TABULA"
        required: true
        type: string
      run-migrations:
        description: "Run //tabula/api:schema_engine and //tabula/api:migrate_deploy_bin before Pulumi up"
        required: false
        type: boolean
        default: false
      smoke-url-path:
        description: "Path to append to the service URL for the default curl smoke test, e.g. /health"
        required: false
        type: string
        default: "/"
      custom-smoke-script:
        description: "Custom bash script to run instead of the default curl check. The candidate URL is available as the CAND env var."
        required: false
        type: string
        default: ""
      cloudflare-token-secret-project:
        description: >-
          GCP project whose Secret Manager holds the CLOUDFLARE_API_TOKEN
          secret (an app with a `customDomain` config needs it for its
          grey-cloud DNS record). When set, the token is fetched at runtime as
          the env's deploy SA and exported as CLOUDFLARE_API_TOKEN for the
          Pulumi steps — never a GitHub secret (secrets model §pipeline-env).
          The project may differ from the env's own (oauth-user-inspector
          stores ONE token, in its dev floating project; the app's identity
          stack grants each env's deploy SA secretAccessor on that single
          secret). Setting this ALSO enables the per-env domain-ownership
          self-verification step (tools/ci/ensure-site-verification.sh) that
          must precede a customDomain DomainMapping deploy — see that step.
          Empty (the default) skips both entirely.
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Explicit least-privilege floor for this reusable workflow. A called
    # workflow's permissions can only narrow the caller's grant, never widen it,
    # so declaring them here makes the job self-documenting and robust against a
    # future caller that grants more than the deploy needs: checkout
    # (contents: read) + GCP Workload Identity Federation (id-token: write).
    # No repo/API/package writes happen in this job.
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.app-name }}-${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || inputs.default-region }}
      # Cache-only BuildBuddy access (--config=remotecache): reuse the image /
      # schema-engine actions CI already cached instead of a cold rebuild on
      # the deploy critical path. No RBE, so outputs stay local for the push.
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # customDomain apps only (same gate as the Cloudflare-token fetch):
          # besides the ambient credentials every step uses, mint a SEPARATE
          # access token carrying the Site Verification scope for the
          # domain-ownership self-verify step below. User-style consent is
          # impossible for headless SAs, and SA-impersonation tokens can carry
          # arbitrary scopes. Empty token_format (the action default) mints
          # nothing for apps without a custom domain.
          token_format: ${{ inputs.cloudflare-token-secret-project != '' && 'access_token' || '' }}
          access_token_scopes: https://www.googleapis.com/auth/siteverification

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        if: ${{ inputs.image-digest == '' }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository
        # Bootstrap ordering: the image push runs before `pulumi up`, but
        # Pulumi owns the repository resource. Create it idempotently here;
        # the Pulumi program adopts it (unconditional pulumi.Import — by the
        # time pulumi runs, this repo always exists). Skipped entirely on the
        # promote-by-digest path: the shared repository is owned by the app's
        # build stack and the image was already pushed by the build job.
        if: ${{ inputs.image-digest == '' }}
        run: |
          gcloud artifacts repositories describe "${{ inputs.artifact-repository }}" \
            --project "$GCP_PROJECT_ID" --location "$GCP_REGION" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${{ inputs.artifact-repository }}" \
            --project "$GCP_PROJECT_ID" --location "$GCP_REGION" \
            --repository-format=docker \
            --description="${{ inputs.app-name }} container images (managed by ${{ inputs.pulumi-dir }})"

      - name: Build and push image (Bazel)
        if: ${{ inputs.image-digest == '' && inputs.bazel-image-target != '' }}
        run: |
          bazel run --config=remotecache --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            ${{ inputs.bazel-image-target }} -- \
            --repository "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ inputs.image-repository-path }}" \
            --tag "${GITHUB_SHA}" --tag latest

      - name: Build and push image (Docker)
        if: ${{ inputs.image-digest == '' && inputs.bazel-image-target == '' && inputs.dockerfile-dir != '' }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ inputs.image-repository-path }}"
          # Try to get NODE_VERSION from canonical if present
          NODE_VERSION="$(cut -d. -f1 .nvmrc 2>/dev/null || echo 22)"
          docker buildx build --push \
            --build-arg NODE_VERSION="${NODE_VERSION}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            ${{ inputs.dockerfile-dir }}

      - name: Run database migrations
        if: ${{ inputs.run-migrations }}
        # Before the new revision takes traffic; vendored schema-engine keeps
        # this hermetic apart from the database connection itself. (The
        # vendored-Prisma pattern -- tabula's; see the caller-contract note.)
        #
        # EXPAND phase (issue #819): the OLD revision keeps serving against the
        # just-migrated schema during the traffic shift below, so this must only
        # apply backward-COMPATIBLE (expand) migrations. `--phase expand` makes
        # the wrapper REFUSE if a pending *_contract (backward-incompatible)
        # migration would be swept in; those are applied deliberately post-soak
        # via `--phase contract`. The migration-safety check already blocks an
        # un-marked backward-incompatible migration from reaching main.
        run: |
          bazel build --config=remotecache --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //tabula/api:schema_engine //tabula/api:migrate_deploy_bin
          export PRISMA_SCHEMA_ENGINE_BINARY="$PWD/bazel-bin/tabula/api/schema-engine"
          export PRISMA_QUERY_ENGINE_LIBRARY="$PWD/tabula/api/prisma/engine-placeholder"
          # Plain assignment (not `export VAR=$(...)`): export would swallow
          # the gcloud exit status and hand Prisma an empty DATABASE_URL.
          DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$GCP_PROJECT_ID")"
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret read returned empty (deployer SA needs secretAccessor on it)"
            exit 1
          fi
          export DATABASE_URL
          bazel run --config=remotecache --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //tabula/api:migrate_deploy_bin -- --schema tabula/api/prisma/schema.prisma --phase expand

      - name: Fetch the Cloudflare API token (Secret Manager)
        # Cloud-native secret flow: pulled per-run as the deploy SA from the
        # app-designated project (see the input's description), masked, and
        # exported job-wide so BOTH `pulumi up` phases (deploy + promote) see
        # it — the cloudflare provider reads the env var implicitly, so it
        # never touches Pulumi config or state.
        if: ${{ inputs.cloudflare-token-secret-project != '' }}
        run: |
          set -euo pipefail
          # Plain assignment (not `export VAR=$(...)`): export would swallow
          # the gcloud exit status and hand Pulumi an empty token.
          CF_TOKEN="$(gcloud secrets versions access latest \
            --secret=CLOUDFLARE_API_TOKEN \
            --project="${{ inputs.cloudflare-token-secret-project }}")"
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret read returned empty (deploy SA needs secretAccessor on it in ${{ inputs.cloudflare-token-secret-project }})"
            exit 1
          fi
          echo "::add-mask::$CF_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"

      - name: Ensure custom-domain ownership (Site Verification, self-verify)
        # PER-ENV SELF-VERIFICATION: creating a Cloud Run DomainMapping
        # requires the DEPLOYING principal to be a verified owner of the
        # domain in Google's Site Verification service, and ownership there is
        # PER-CALLER — no SA can verify (or delegate) on another identity's
        # behalf, so THIS env's deploy SA self-verifies its zone via DNS-TXT
        # right before its own `pulumi up`. Idempotent: once this SA is a
        # verified owner the script no-ops, and it no-ops entirely when the
        # env's Pulumi.<env>.yaml sets no customDomain (DEPLOY_ENV scopes the
        # script to this env's config). The quota project for the
        # getToken/insert WRITE calls is this env's OWN floating project
        # (SITEVERIFY_QUOTA_PROJECT/x-goog-user-project), where the foundation
        # project factory declares siteverification.googleapis.com — NOTE the
        # API itself is console-only and needs a one-time manual enable per
        # project (see tools/ci/ensure-site-verification.sh). CLOUDFLARE_API_TOKEN
        # is job-wide env from the fetch step above.
        if: ${{ inputs.cloudflare-token-secret-project != '' }}
        env:
          SITEVERIFY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SITEVERIFY_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          APP_DIR: ${{ inputs.pulumi-dir }}
        run: ./tools/ci/ensure-site-verification.sh

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # Blue-green rollout (issue #204): deploy the new revision with NO
      # traffic, smoke its dedicated candidate URL, then shift 100% only on
      # success.
      - name: Deploy the new revision without traffic (Pulumi)
        id: deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # CLOUDFLARE_API_TOKEN (apps with a `customDomain` config) is
          # job-wide env from the Secret Manager fetch step above — absent
          # entirely for apps without one, and the program skips DNS.
          # Pulumi shells out to `go build`; the repo-root go.work does not
          # include this module (same as tools/pulumi/pulumi_cmd.sh).
          GOWORK: off
        working-directory: ${{ inputs.pulumi-dir }}
        run: |
          pulumi stack select "$DEPLOY_ENV" --create
          # Pin 100% to whatever serves now; the new revision publishes at 0%
          # behind a `candidate` tag. Empty on the first ever deploy -> the
          # program routes 100% straight to the new revision.
          STABLE="$(gcloud run services describe "${{ inputs.service-name }}-${DEPLOY_ENV}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          echo "Current live revision: ${STABLE:-<none, first deploy>}"
          # Publish whether this is a first-ever deploy + the stable revision, so
          # the smoke and promote steps consume THESE values instead of re-deriving
          # from an order-assumed traffic[0] later (#808): the smoke step must not
          # fall back to the live (stable) URL on a normal deploy, and the promote
          # step must re-pin the same stable captured here.
          if [ -z "$STABLE" ]; then
            echo "first_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "first_deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "stable_revision=${STABLE}" >> "$GITHUB_OUTPUT"
          # Per-invocation env, NOT `pulumi config set` (#499 de-race).
          if [ -n "${{ inputs.image-digest }}" ]; then
            # Promote-by-digest: every env deploys the SAME immutable artifact
            # the build-once job produced; nothing is rebuilt per env.
            export "${{ inputs.env-prefix }}_IMAGE_DIGEST=${{ inputs.image-digest }}"
          else
            export "${{ inputs.env-prefix }}_IMAGE_TAG=${GITHUB_SHA}"
          fi
          export "${{ inputs.env-prefix }}_STABLE_REVISION=${STABLE}"
          export "${{ inputs.env-prefix }}_PROMOTE=false"
          pulumi up --yes

      - name: Smoke-check the candidate revision (before any traffic shift)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GOWORK: off
          CUSTOM_SMOKE_SCRIPT: ${{ inputs.custom-smoke-script }}
          FIRST_DEPLOY: ${{ steps.deploy.outputs.first_deploy }}
        working-directory: ${{ inputs.pulumi-dir }}
        run: |
          set -euo pipefail
          pulumi stack select "$DEPLOY_ENV" >/dev/null 2>&1 || true
          # The candidate's dedicated tag URL (the new revision at 0% traffic).
          CAND="$(gcloud run services describe "${{ inputs.service-name }}-${DEPLOY_ENV}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json | jq -r '.status.traffic[]? | select(.tag=="candidate") | .url' | head -n1)"
          if [ -z "$CAND" ] || [ "$CAND" = "null" ]; then
            if [ "$FIRST_DEPLOY" = "true" ]; then
              # First-ever deploy: there is no candidate tag because traffic went
              # straight to the new revision, so the live service URL IS the new
              # revision -- smoke that.
              CAND="$(pulumi stack output serviceUrl)"
              echo "First deploy: smoking the live service URL (it is the new revision)."
            else
              # NOT a first deploy: the candidate URL must resolve. Falling back to
              # the live service URL here would smoke the STABLE (old) revision, go
              # green against untested code, and then promote the new revision to
              # 100% -- the exact false-green in #808. Fail the deploy instead.
              echo "::error::Could not resolve the candidate revision URL on a non-first deploy. Refusing to smoke the stable revision (that would false-green and promote an untested revision). Failing the deploy."
              exit 1
            fi
          fi
          if [ -n "$CUSTOM_SMOKE_SCRIPT" ]; then
            echo "Running custom smoke script against ${CAND}"
            export CAND
            eval "$CUSTOM_SMOKE_SCRIPT"
          else
            echo "Smoke-checking ${CAND}${{ inputs.smoke-url-path }}"
            curl --fail --retry 10 --retry-delay 5 --retry-connrefused "${CAND}${{ inputs.smoke-url-path }}"
          fi

      - name: Shift 100% traffic to the new revision (Pulumi)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # The promote is a second `pulumi up` of the SAME program, so it
          # needs the same Cloudflare credential (job-wide env from the Secret
          # Manager fetch step) or the program's customDomain guard fails.
          GOWORK: off
          STABLE_REVISION: ${{ steps.deploy.outputs.stable_revision }}
        working-directory: ${{ inputs.pulumi-dir }}
        run: |
          pulumi stack select "$DEPLOY_ENV"
          # Re-pin the SAME stable revision captured in phase 1 -- NOT a fresh
          # traffic[0] read (the traffic array order isn't guaranteed, so this
          # could pin the wrong revision) -- so the promote update is
          # self-consistent with the candidate that was just smoked (#808).
          if [ -n "${{ inputs.image-digest }}" ]; then
            export "${{ inputs.env-prefix }}_IMAGE_DIGEST=${{ inputs.image-digest }}"
          else
            export "${{ inputs.env-prefix }}_IMAGE_TAG=${GITHUB_SHA}"
          fi
          export "${{ inputs.env-prefix }}_STABLE_REVISION=${STABLE_REVISION}"
          export "${{ inputs.env-prefix }}_PROMOTE=true"
          pulumi up --yes
