name: Dependabot auto-merge

# Auto-merge Dependabot MINOR/PATCH PRs after CI passes, via a DIRECT merge with
# the GitHub App token. The merge is App-attributed, so it triggers the
# per-component copybara export (a GITHUB_TOKEN merge would NOT — that's the
# import-side recursion-prevention). MAJOR bumps are never auto-merged (left for
# manual review; a normal human merge is still user-attributed and fans out).
#
# Why workflow_run + a direct merge (not `gh pr merge --auto`): the org disables
# repo-level auto-merge, so `--auto` is unavailable. workflow_run fires AFTER CI
# in the default-branch context (full Actions secrets — hence SYNC_APP_* exists
# as an Actions secret too, not only a Dependabot secret).
#
# MINOR/PATCH detection: our monorepo gomod/github-actions Dependabot groups are
# named `*-minor-patch`, so qualifying PRs land on branches like
# `dependabot/go_modules/devx/go-minor-patch-<hash>`. MAJOR bumps arrive on
# individual branches with no group name, so they never match.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

permissions:
    contents: read

jobs:
    merge:
        if: >-
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.actor.login == 'dependabot[bot]' &&
            contains(github.event.workflow_run.head_branch, '-minor-patch')
        runs-on: ubuntu-latest
        steps:
            - name: Mint App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                app-id: ${{ secrets.SYNC_APP_ID }}
                private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
            - name: Merge the Dependabot PR (App-attributed → fans out via export)
              env:
                GH_TOKEN: ${{ steps.app-token.outputs.token }}
                BRANCH: ${{ github.event.workflow_run.head_branch }}
                REPO: ${{ github.repository }}
              run: |
                num="$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
                if [ -z "$num" ]; then echo "No open PR for branch $BRANCH — nothing to merge."; exit 0; fi
                echo "Merging Dependabot PR #$num (branch $BRANCH) via App token."
                gh pr merge "$num" -R "$REPO" --squash
