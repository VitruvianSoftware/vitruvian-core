name: Dependabot auto-merge

# Auto-merge Dependabot MINOR/PATCH PRs by ENQUEUING them in the merge queue
# (#83) once CI passes. `--auto` makes the PR merge THROUGH the queue instead of
# via a direct merge that bypassed it, so Dependabot bumps get the same required-
# check serialization as every other PR. The queue's merge still fans out the
# per-component copybara export: a push to main from the queue triggers the
# export workflows normally (it is not the GITHUB_TOKEN self-trigger that the
# old direct merge had to dodge). MAJOR bumps are never auto-merged (manual).
#
# workflow_run fires AFTER CI in the default-branch context (full Actions
# secrets — hence SYNC_APP_* exists as an Actions secret too, not only a
# Dependabot secret). The App token enables auto-merge; the workflow's own
# GITHUB_TOKEN is contents:read only.
#
# MINOR/PATCH detection: our monorepo gomod/github-actions Dependabot groups are
# named `*-minor-patch`, so qualifying PRs land on branches like
# `dependabot/go_modules/devx/go-minor-patch-<hash>`. MAJOR bumps arrive on
# individual branches with no group name, so they never match.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

permissions:
    contents: read

jobs:
    merge:
        if: >-
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.actor.login == 'dependabot[bot]' &&
            contains(github.event.workflow_run.head_branch, '-minor-patch')
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Mint App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                app-id: ${{ secrets.SYNC_APP_ID }}
                private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
            - name: Enable auto-merge so the PR merges through the queue
              env:
                GH_TOKEN: ${{ steps.app-token.outputs.token }}
                BRANCH: ${{ github.event.workflow_run.head_branch }}
                REPO: ${{ github.repository }}
              run: |
                num="$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
                if [ -z "$num" ]; then echo "No open PR for branch $BRANCH — nothing to merge."; exit 0; fi
                echo "Enabling auto-merge for Dependabot PR #$num (branch $BRANCH); the queue merges it."
                gh pr merge "$num" -R "$REPO" --squash --auto
