name: zitadel-apps-mcp-slack-apply

# Manual apply of the zitadel-apps-mcp-slack stack — the Zitadel project and
# OIDC client that let Gemini Spark call mcp-slack. Its outputs fill two of the
# six render-blocking values in
# gitops/argocd/applications/mcp-slack.yaml.disabled: `oidc.projectId` and
# `oidc.clientId`.
#
# WHY THIS EXISTS SEPARATELY FROM _zitadel-apps-apply.yaml: that one is the
# oauth-user-inspector promotion chain — reusable, per-environment, and it syncs
# the minted credential into that app's GCP Secret Manager. This stack has no
# GCP target at all: main.go imports only the pulumi and zitadel SDKs, and every
# resource it declares is a zitadel one. So the Google WIF auth step is
# deliberately absent here rather than forgotten.
#
# main.go declares FOUR constructors, not two. Named rather than numbered
# because a line citation in a comment decays silently; `grep -n 'zitadel\.New'`
# on that file is the authority, not this list:
#   NewProject          unconditional
#   NewProjectRole      unconditional — created up front so enabling
#                       projectRoleCheck later is a config flip, not a schema
#                       change during an outage
#   NewUserGrant        one per id in grantUserIds, which is currently ""
#   NewApplicationOidc  unconditional
# So the committed config produces three creates and zero grants. An earlier
# draft of this comment said "two", and a reviewer pre-registered that as the
# expected plan without opening main.go — which is why the count is spelled out
# here with a pointer to the command that checks it.
#
# DEFAULTS TO PREVIEW, AND THAT IS THE CONTROL. The first apply CREATES a real
# project and a real OIDC client in the live instance; unlike everything else in
# this repo that is not reversible by reverting a commit. `up` therefore has to
# be selected explicitly on the dispatch, so "post the plan before applying" is
# a property of the workflow rather than a habit someone has to remember.
#
# NEVER RUN THE `:import` BAZEL TARGET AGAINST THIS STACK. The macro generates
# one, but Zitadel's provider cannot read the client secret back, so an import
# plans a REPLACEMENT — create-replacement then delete-original — which destroys
# the live client. That is not hypothetical: it is how the sibling stack broke
# on 2026-06-26 (`Errors.App.NotFound`). See the stack's README, "Never import
# this client". This workflow only ever runs preview / refresh / up.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preview (safe, default) | up (CREATES live Zitadel resources)"
        required: true
        default: preview
        type: choice
        options: [preview, up]

# Serialize applies of this stack; never cancel an in-flight pulumi up.
# Mirrors the identical guard on the sibling _oauth-identity-apply.yaml /
# _tabula-identity-apply.yaml (which this workflow otherwise matches step
# for step — same tailnet-tunnel + pulumi-up shape). Without this, two
# manual dispatches within the same window (or one double-click) could run
# `pulumi up --yes` on the SAME Zitadel OIDC client stack concurrently;
# Pulumi's own per-stack state locking is the only backstop today, unlike
# the siblings where it's an explicit, documented guard.
concurrency:
  group: zitadel-apps-mcp-slack-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # checkout only. No `id-token: write` — that exists in the sibling for its
    # GCP Secret Manager writes, and this stack has no GCP resources.
    permissions:
      contents: read
    # Supplies TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET and ZITADEL_MACHINE_KEY_JSON,
    # which are ENVIRONMENT secrets rather than repo secrets — this stack cannot
    # authenticate without it. The name says oauth-user-inspector because that is
    # where those three were first seeded; they are instance-wide credentials,
    # not app-scoped. A dedicated environment would be tidier and would cost a
    # human three secret copies, so it is deliberately not done here.
    environment: oauth-user-inspector-development
    env:
      DEPLOY_ENV: development
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Join the tailnet (ephemeral, tag:ci)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # v4 already passes `--accept-routes`; don't add it in args.

      - name: Prepare the internal TLS route to the Envoy gateway
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq socat
          # Zitadel ties the JWT-profile audience to the connection scheme and only
          # accepts the https issuer, so the provider must SEE https even though the
          # internal hop is plain http. Terminate TLS locally with a self-signed cert
          # for the host, trusted in the runner's store, forwarding to Envoy.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem \
            -days 1 -subj "/CN=auth.ipv1337.dev" -addext "subjectAltName=DNS:auth.ipv1337.dev"
          sudo cp /tmp/c.pem /usr/local/share/ca-certificates/auth-internal.crt
          sudo update-ca-certificates >/dev/null
          cat /tmp/c.pem /tmp/k.pem | sudo tee /etc/auth-internal-ck.pem >/dev/null
          echo "127.0.0.1 auth.ipv1337.dev" | sudo tee -a /etc/hosts >/dev/null

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: "Run Pulumi (${{ inputs.action }})"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ZITADEL_MACHINE_KEY_JSON: ${{ secrets.ZITADEL_MACHINE_KEY_JSON }}
          ACTION: ${{ inputs.action }}
          GOWORK: off
        working-directory: infrastructure/pulumi/platform/zitadel-apps-mcp-slack
        run: |
          set -euo pipefail
          # The terminator must live inside THIS step — a backgrounded process does
          # not survive across steps.
          #
          # Target a cluster node's TAILSCALE device on the gateway NodePort, NOT
          # the LB VIP 10.44.86.211. The VIP is a Cilium eBPF LB address: a packet
          # forwarded to it by the subnet router is dropped in Cilium's datapath
          # before load-balancing, so conntrack never sees it. A node's tailscale IP
          # is a first-class tailnet device and Cilium DOES load-balance NodePort for
          # that traffic. Fixed in 7fea0b3f for the sibling workflow.
          # NOTE: zitadel-apps/APPLYING-FROM-CI.md still documents the VIP form; it
          # predates that fix and is stale on this point.
          # :30265 is pinned in gitops/argocd/platform/envoy-gateway/gateway/envoyproxy.yaml
          # precisely so this hardcoding cannot drift.
          sudo socat OPENSSL-LISTEN:443,reuseaddr,fork,cert=/etc/auth-internal-ck.pem,verify=0 \
            TCP:nuc9i9.coati-koi.ts.net:30265 &
          trap 'sudo pkill -f "OPENSSL-LISTEN:443" 2>/dev/null || true' EXIT

          # Fail loudly on the route rather than letting Pulumi report a confusing
          # provider error. This is also the positive control that the tunnel works:
          # if healthz answers, the internal path is up.
          for _ in $(seq 1 15); do
            curl -fsS --max-time 5 https://auth.ipv1337.dev/debug/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 https://auth.ipv1337.dev/debug/healthz >/dev/null
          echo "internal route to auth.ipv1337.dev is up"

          pulumi stack select "$DEPLOY_ENV" --create
          pulumi config set --secret zitadel:jwtProfileJson "$ZITADEL_MACHINE_KEY_JSON"

          if [ "$ACTION" = "up" ]; then
            pulumi up --yes
          else
            pulumi preview --diff
          fi

          # ---------------------------------------------------------------
          # REPORTING LIVES IN THIS STEP, DELIBERATELY, AND IS NOT GATED ON
          # $ACTION. Both properties are fixes for how the first `up` failed.
          #
          # 1. In a separate step it could not work at all: the socat terminator
          #    above is backgrounded and trapped on EXIT, so it dies when this
          #    step ends and `refresh` got `dial tcp 127.0.0.1:443: connection
          #    refused`. The comment above the socat line already said a
          #    backgrounded process does not survive across steps; the reporting
          #    step was written one step later anyway.
          #
          # 2. It used to carry `if: inputs.action == 'up'`, which meant the only
          #    run that could ever execute it was the irreversible one. Every
          #    safe rehearsal took the branch that skipped it, so its first
          #    execution was necessarily the run that creates live resources. A
          #    code path whose sole test is the dangerous path has no test.
          #    Running it on `preview` too is the point, not a side effect.
          # ---------------------------------------------------------------

          # An empty stack has no outputs, and on `preview` that is not a failure,
          # it is a first preview. But this probe CANNOT tell "no outputs" from
          # "the command failed" — network, auth, a drifted `stack select` and a
          # backend hiccup all exit non-zero too, and `2>&1` discards the reason.
          # So it is only allowed to skip on `preview`. After an `up` the outputs
          # exist by construction, which makes a probe failure there a real
          # failure that must stay red: skipping would jump the refresh, the
          # print AND the accessTokenType gate below and still `exit 0`, so the
          # run would go green with nothing evaluated.
          if [ "$ACTION" != "up" ] && ! pulumi stack output projectId >/dev/null 2>&1; then
            echo "stack has no outputs yet — nothing applied, skipping the report"
            exit 0
          fi

          # refresh BEFORE reading: accessTokenType is under IgnoreChanges, so
          # without it the output reports what Pulumi last WROTE, not what Zitadel
          # currently HOLDS. A server-side flip to BEARER would read as JWT forever
          # while every request is rejected.
          pulumi refresh --yes

          # --show-secrets is REQUIRED here: the provider marks clientId secret, so
          # the named call alone prints `[secret]`. clientId is a public OIDC
          # identifier whose destination is a gitops manifest in this repo;
          # clientSecret is the actual credential and is not in this list.
          # The flag is only safe because every output is NAMED — a bare
          # `pulumi stack output --show-secrets` would dump clientSecret too.
          OUTPUTS="projectId clientId sparkScopes accessTokenType projectRoleCheck"
          case " $OUTPUTS " in
            *" clientSecret "*)
              echo "::error::clientSecret is in the printed set while --show-secrets is on" >&2
              exit 1 ;;
          esac
          # Read into a variable BEFORE printing. `printf ... "$(cmd)"` does not
          # trip `set -e` when the substitution fails — the command substitution
          # is not the command whose status the shell checks — so a failed read
          # prints an empty field and the loop carries on. For clientId that is
          # not cosmetic: a blank is indistinguishable from an empty value, and
          # it is the string that gets pasted into the gitops manifest.
          ATT=""
          for o in $OUTPUTS; do
            v="$(pulumi stack output "$o" --show-secrets)"
            if [ -z "$v" ]; then
              echo "::error::stack output $o read back empty — refusing to report a blank value" >&2
              exit 1
            fi
            printf '%-18s %s\n' "$o" "$v"
            if [ "$o" = "accessTokenType" ]; then ATT="$v"; fi
          done

          # Gate on the value that was actually PRINTED, not on a second read, so
          # the check cannot disagree with the report. Empty means accessTokenType
          # left $OUTPUTS and the gate never saw a value — fail rather than pass.
          if [ -z "$ATT" ]; then
            echo "::error::accessTokenType was never read — it must stay in the printed set" >&2
            exit 1
          fi
          if [ "$ATT" != "OIDC_TOKEN_TYPE_JWT" ]; then
            echo "::error::accessTokenType is $ATT, not OIDC_TOKEN_TYPE_JWT — mcp-slack's auth model assumes JWT" >&2
            exit 1
          fi
