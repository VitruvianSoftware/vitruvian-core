# When a tool's release is newer than its catalog entry, opens a pull request
# that lists it: one per tool and version, on catalog/bump-<id>-<version>.
# catalog/sources.json says which releases update which entry.
#
# Why each hour and not on the release: no release event can tell this
# repository that a tool's zip is ready.
#   - The GitHub tool's zip is attached in another repository,
#     VitruvianSoftware/vitruvian-tool-github, by that repository's own
#     release.yml with its own token. Nothing there reaches this repository.
#   - HomeSpeaker's release is created by release-please with an App token, so
#     `release: published` would fire, but before the zip exists: the zip is
#     uploaded afterwards by home-speaker-release.yaml's publish-package job
#     (1.20.0: published 08:45:31, zip attached 08:50:08).
# Comparing each source's newest release with the catalog works for every
# tool, however its release is made, and a missed hour is caught the next.
#
# Cost: the plan job asks GitHub a few questions and ends in seconds when the
# catalog is current, which is nearly every hour. Only a release that is ahead
# runs the bump job (Bazel). An open pull request for that version is left
# alone, unless it no longer merges, when it is rebuilt from main.
#
# Who merges it: catalog-check arms auto-merge once it passes on the pull
# request (its bump-automerge job), and only when this workflow marked the
# body as one that may merge itself. It does not when anything changes in
# what the tool asks for (uses), its commands, panels, protocol or publisher:
# then the pull request is labelled needs-human and the body names each.
#
# What it leaves alone: a version whose pull request a person closed; a
# branch holding a commit this workflow did not write (it comments once); a
# release it refused, while the issue "catalog-bump refused <id> <version>"
# that the refusal opened stays open. After the merge, catalog-publish signs
# the list.
name: catalog-bump

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Catalog entry, e.g. dev.vitruvian.homespeaker. Empty with an empty tag: every tool behind its newest release."
        required: false
        type: string
      tag:
        description: "Release tag, e.g. home-speaker-v1.20.0 (v1.4.1 for the GitHub tool). Needs the id."
        required: false
        type: string

permissions:
  contents: read

# One run at a time: two runs would race on the same branch.
concurrency:
  group: catalog-bump
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # pull-requests: write only to say, once, why a branch is left alone.
    permissions:
      contents: read
      pull-requests: write
      issues: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: catalog

      - name: Which releases are newer than the catalog
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          if [ -n "${ID}${TAG}" ]; then
            if [ -z "$ID" ] || [ -z "$TAG" ]; then
              echo "::error::Give both id and tag, or neither."
              exit 1
            fi
            jq -cn --arg id "$ID" --arg tag "$TAG" '[{id: $id, tag: $tag}]' > "$plan"
          else
            python3 catalog/bump.py plan --out "$plan"
          fi
          echo "matrix=$(jq -c . "$plan")" >> "$GITHUB_OUTPUT"

  bump:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # issues: write only to record a refusal.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      # The result's status decides, not the exit status: Bazel and argparse
      # also exit 2 for a usage error. not-ready (no zip yet) and not-listed
      # are a notice; refused is recorded below; no result at all (an API
      # blip, a crash) fails the job, and the next hour tries again.
      - name: Update ${{ matrix.id }} from ${{ matrix.tag }}
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
          TAG: ${{ matrix.tag }}
        run: |
          set +e -u -o pipefail
          result="$RUNNER_TEMP/result.json"
          rm -f "$result"
          bazel run //catalog:bump -- --id "$ID" --tag "$TAG" --result-out "$result"
          code=$?
          set -e
          status="$(jq -r '.status // empty' "$result" 2>/dev/null || true)"
          case "$status" in
            bumped | current | refused) ;;
            not-ready | not-listed) status=skipped ;;
            unavailable)
              echo "::error::$(jq -r .message "$result"): GitHub did not hand it over. Not a refusal; the next hour tries again."
              exit 1
              ;;
            *)
              echo "::error::catalog:bump ended with exit ${code} and status '${status:-none}'."
              exit 1
              ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One issue per refused version. While it is open the plan skips that
      # version, so a refusal is one red run, not one an hour. Closing the
      # issue lets the next hour try again.
      - name: Record the refusal
        if: steps.bump.outputs.status == 'refused'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/result.json"
          title="$(jq -r .issue_title "$result")"
          jq -r .issue_body "$result" > "$RUNNER_TEMP/issue.md"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$open" ]; then
            echo "Issue #$open already records this refusal."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
          echo "::error::$(jq -r .message "$result")"
          exit 1

      - name: Mint App token for PR operations
        if: steps.bump.outputs.status == 'bumped'
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Open or update the pull request
        if: steps.bump.outputs.status == 'bumped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ID: ${{ matrix.id }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/result.json"
          branch="$(jq -r .branch "$result")"
          version="$(jq -r .version "$result")"
          title="$(jq -r .title "$result")"
          automerge="$(jq -r .automerge "$result")"
          jq -r .body "$result" > "$RUNNER_TEMP/body.md"
          # The App token can push past the ruleset: push only to a bump branch.
          if ! [[ "$branch" =~ ^catalog/bump-[a-z0-9.-]+-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$branch' is not a catalog/bump-<id>-<version> branch."
            exit 1
          fi

          git config user.name "vitruvian-wren-agent[bot]"
          git config user.email "314429222+vitruvian-wren-agent[bot]@users.noreply.github.com"
          # The checkout used persist-credentials: false. Hand git the App
          # token for the push.
          gh auth setup-git

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"

          # The branch holds one commit, this workflow's, marked with the
          # trailer below. Anything else is a person's (agent sessions share
          # the bot's email, so the email proves nothing): leave it. The plan
          # normally catches this first and comments once.
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null
          found=$?
          set -e
          case "$found" in
            0)
              gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" > "$RUNNER_TEMP/compare.json"
              others="$(python3 catalog/bump.py foreign --compare "$RUNNER_TEMP/compare.json" --id "$ID" --version "$version")"
              if [ -n "$others" ]; then
                echo "::notice::$branch holds commits catalog-bump did not write (${others//$'\n'/, }); left alone."
                exit 0
              fi
              ;;
            2) ;;
            *)
              echo "::error::Could not read $branch on origin (git ls-remote exit $found)."
              exit 1
              ;;
          esac

          # Off before the push, every time: catalog-check arms it again only
          # if it passes on the new commit and the new body allows it.
          if [ -n "$existing" ] && [ "$(gh pr view "$existing" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge "$existing" --disable-auto
          fi
          if [ -n "$existing" ] && [ "$automerge" != "true" ]; then
            gh pr edit "$existing" --add-label needs-human
          fi

          git checkout -B "$branch"
          git add catalog/tools.json apps/web/vitruviansoftware-dev/_data/tools.yml
          git commit -m "$title" -m "Written by the catalog-bump workflow from the release $TAG." \
            -m "Catalog-Bump: $ID@$version"
          git push -f origin "$branch"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            number="$existing"
            echo "PR #${number} already open for $branch: updated."
          else
            labels=()
            if [ "$automerge" != "true" ]; then
              labels=(--label needs-human)
            fi
            gh pr create --title "$title" --body-file "$RUNNER_TEMP/body.md" --base main --head "$branch" "${labels[@]}"
            number="$(gh pr view "$branch" --json number --jq .number)"
          fi
          if [ "$automerge" = "true" ]; then
            echo "PR #$number: catalog-check arms auto-merge when it passes."
          else
            echo "::notice::PR #$number waits for a person (needs-human): see its description."
          fi

          # A pull request for an older version of the same tool is replaced;
          # one for a newer version is left alone.
          gh pr list --base main --state open --json number,headRefName --limit 200 > "$RUNNER_TEMP/pulls.json"
          python3 catalog/bump.py older --pulls "$RUNNER_TEMP/pulls.json" --id "$ID" --version "$version" |
            while read -r older; do
              gh pr close "$older" --delete-branch --comment "Replaced by #${number}, for ${TAG}."
            done
