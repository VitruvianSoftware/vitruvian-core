# When a tool's release is newer than its catalog entry, opens a pull request
# that lists it: one per tool and version, on catalog/bump-<id>-<version>.
# catalog/sources.json says which releases update which entry.
#
# When it runs:
#   - As soon as a tool's release workflow in this repository finishes
#     (workflow_run below). Each of those workflows ends by checking that the
#     tool's zip is on the release, so the zip is there when this starts.
#   - When a change to catalog/tools.json lands on main (push below). A
#     merged bump changes that file, and so can stop the other open bump pull
#     requests from merging: they edit the same lines. This run rebuilds them
#     at once. Without it, on 2026-10-19 Vitruvian Remote's bump sat broken
#     for about three hours after HomeSpeaker's merged first, waiting for an
#     hourly run that GitHub kept dropping. GitHub needs a few seconds after a
#     push to work out whether a pull request still merges, so the plan asks
#     again for up to half a minute before it gives up until the next run.
#     It cannot start itself: its own runs push only to bump branches, and
#     catalog-publish's merges write only the website's copy, under
#     apps/web/.../tools/catalog/. A path filter matches the whole path from
#     the repository's root, so that copy does not match catalog/tools.json.
#   - Each hour, as a backup: GitHub drops scheduled runs when it is busy
#     (on 2026-10-16 it started one of five), and a missed release is caught
#     on the next hour that does run.
#   - By hand, from the Actions page.
#
# Every run that is not a by-hand run with an id and a tag does the same thing:
# compare the newest release of every row of catalog/sources.json with its
# entry. Nothing is taken from the run that woke it. That is why a release
# needs no id or tag here, and why GitHub dropping a waiting run (see the
# concurrency block) loses nothing.
#
# Why not other ways to hear of a release:
#   - `release: published` fires too early. release-please publishes the
#     release, and the zip is uploaded minutes later by the release
#     workflow's publishing job (HomeSpeaker 1.20.0: published 08:45:31,
#     zip attached 08:50:08).
#   - Uploading the zip makes no event that starts a workflow: it is uploaded
#     with GITHUB_TOKEN, and GitHub starts no workflow for what that token
#     does, apart from workflow_dispatch and repository_dispatch
#     (https://docs.github.com/en/actions/concepts/security/github_token).
#     workflow_run is not caused by the token: GitHub sends it when a run ends
#     (https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run).
#   - The GitHub tool is released from another repository,
#     VitruvianSoftware/vitruvian-tool-github, by its own release.yml. A run
#     there cannot wake a workflow here without a token for this repository,
#     and none is kept there. Only the hourly run picks its releases up.
#
# Cost: the plan job asks GitHub a few questions and ends in seconds when the
# catalog is current, which is nearly every run, a run started by a catalog
# change included. Only a release that is ahead runs the bump job (Bazel). An
# open pull request for that version is left alone, unless it no longer
# merges, when it is rebuilt from main. Waiting on GitHub to judge one adds at
# most half a minute to the plan job.
#
# Who merges it: catalog-check arms auto-merge once it passes on the pull
# request (its bump-automerge job), and only when this workflow marked the
# body as one that may merge itself. It does not when anything changes in
# what the tool asks for (uses), its commands, panels, protocol or publisher:
# then the pull request is labelled needs-human and the body names each.
#
# What it leaves alone: a version whose pull request a person closed; a
# branch holding a commit this workflow did not write (it comments once); a
# release it refused, while the issue "catalog-bump refused <id> <version>"
# that the refusal opened stays open. After the merge, catalog-publish signs
# the list.
name: catalog-bump

on:
  # The release workflows of the tools released from this repository, by
  # their `name:`. This list is the releaseWorkflow column of
  # catalog/sources.json: //catalog:release_trigger_test fails when the two
  # differ, or when a tool released from this repository has none.
  #
  # Not only the runs that made a release: each of these workflows also runs
  # on pushes that only update its release pull request, and it is not known
  # here which run made one. Those runs find the catalog current in seconds.
  # Failed runs are not filtered out either. A skipped run would still take
  # its place in the concurrency group below, and could push out a waiting
  # run that had work to do.
  #
  # main only: a release is only ever made from main. A run started this way
  # has this repository's secrets, so it reads nothing from the run that woke
  # it: no artifact, no output, no branch. It checks out main, as every run
  # does.
  workflow_run:
    workflows:
      - home-speaker-release
      - android-remote-release
      - vitruvian-tool-tv-release
    types: [completed]
    branches: [main]
  # A merged bump, or any other change to the catalog: rebuild the bump pull
  # requests it stopped from merging. Root-anchored: the website's signed
  # copy that catalog-publish writes does not match.
  push:
    branches: [main]
    paths:
      - catalog/tools.json
  # The backup, for releases the triggers above missed and for the GitHub
  # tool, which is released from another repository.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Catalog entry, e.g. dev.vitruvian.homespeaker. Empty with an empty tag: every tool behind its newest release."
        required: false
        type: string
      tag:
        description: "Release tag, e.g. home-speaker-v1.20.0 (v1.4.1 for the GitHub tool). Needs the id."
        required: false
        type: string

permissions:
  contents: read

# One run at a time, whatever started it: two runs would race on the same
# branch and could open the same pull request twice. The group is one fixed
# name for that reason; do not key it by event.
#
# cancel-in-progress: false keeps the running run. It does not keep a waiting
# one: GitHub allows one waiting run per group, and cancels it when another
# arrives. That is safe here because the run that stays waiting starts after
# the running one ends, and checks every tool afresh. Only a by-hand run for
# one id and tag can be lost that way; run it again. (`queue: max` would keep
# them all, but actionlint 1.7.12, the newest, rejects the key and the
# actionlint check is required.)
concurrency:
  group: catalog-bump
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # pull-requests: write only to say, once, why a branch is left alone.
    permissions:
      contents: read
      pull-requests: write
      issues: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: catalog

      - name: Which releases are newer than the catalog
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          if [ -n "${ID}${TAG}" ]; then
            if [ -z "$ID" ] || [ -z "$TAG" ]; then
              echo "::error::Give both id and tag, or neither."
              exit 1
            fi
            jq -cn --arg id "$ID" --arg tag "$TAG" '[{id: $id, tag: $tag}]' > "$plan"
          else
            rustc --edition 2021 --crate-type lib --crate-name catalog catalog/src/lib.rs -o "$RUNNER_TEMP/libcatalog.rlib"
            rustc --edition 2021 catalog/src/bin/bump.rs -L "$RUNNER_TEMP" --extern catalog="$RUNNER_TEMP/libcatalog.rlib" -o "$RUNNER_TEMP/bump"
            "$RUNNER_TEMP/bump" plan --out "$plan"
          fi
          echo "matrix=$(jq -c . "$plan")" >> "$GITHUB_OUTPUT"

  bump:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # issues: write only to record a refusal.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      # The result's status decides, not the exit status: Bazel and argparse
      # also exit 2 for a usage error. not-ready (no zip yet) and not-listed
      # are a notice; refused is recorded below; no result at all (an API
      # blip, a crash) fails the job, and the next run tries again.
      - name: Update ${{ matrix.id }} from ${{ matrix.tag }}
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
          TAG: ${{ matrix.tag }}
        run: |
          set +e -u -o pipefail
          result="$RUNNER_TEMP/result.json"
          rm -f "$result"
          bazel run //catalog:bump -- --id "$ID" --tag "$TAG" --result-out "$result"
          code=$?
          set -e
          status="$(jq -r '.status // empty' "$result" 2>/dev/null || true)"
          case "$status" in
            bumped | current | refused) ;;
            not-ready | not-listed) status=skipped ;;
            unavailable)
              echo "::error::$(jq -r .message "$result"): GitHub did not hand it over. Not a refusal; the next run tries again."
              exit 1
              ;;
            *)
              echo "::error::catalog:bump ended with exit ${code} and status '${status:-none}'."
              exit 1
              ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One issue per refused version. While it is open the plan skips that
      # version, so a refusal is one red run, not a red run every time.
      # Closing the issue lets the next run try again.
      - name: Record the refusal
        if: steps.bump.outputs.status == 'refused'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/result.json"
          title="$(jq -r .issue_title "$result")"
          jq -r .issue_body "$result" > "$RUNNER_TEMP/issue.md"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$open" ]; then
            echo "Issue #$open already records this refusal."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
          echo "::error::$(jq -r .message "$result")"
          exit 1

      - name: Mint App token for PR operations
        if: steps.bump.outputs.status == 'bumped'
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Open or update the pull request
        if: steps.bump.outputs.status == 'bumped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ID: ${{ matrix.id }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/result.json"
          branch="$(jq -r .branch "$result")"
          version="$(jq -r .version "$result")"
          title="$(jq -r .title "$result")"
          automerge="$(jq -r .automerge "$result")"
          jq -r .body "$result" > "$RUNNER_TEMP/body.md"
          # The App token can push past the ruleset: push only to a bump branch.
          if ! [[ "$branch" =~ ^catalog/bump-[a-z0-9.-]+-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$branch' is not a catalog/bump-<id>-<version> branch."
            exit 1
          fi

          git config user.name "vitruvian-wren-agent[bot]"
          git config user.email "314429222+vitruvian-wren-agent[bot]@users.noreply.github.com"
          # The checkout used persist-credentials: false. Hand git the App
          # token for the push.
          gh auth setup-git

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"

          # The branch holds one commit, this workflow's, marked with the
          # trailer below. Anything else is a person's (agent sessions share
          # the bot's email, so the email proves nothing): leave it. The plan
          # normally catches this first and comments once.
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null
          found=$?
          set -e
          case "$found" in
            0)
              gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" > "$RUNNER_TEMP/compare.json"
              others="$(bazel run //catalog:bump -- foreign --compare "$RUNNER_TEMP/compare.json" --id "$ID" --version "$version")"
              if [ -n "$others" ]; then
                echo "::notice::$branch holds commits catalog-bump did not write (${others//$'\n'/, }); left alone."
                exit 0
              fi
              ;;
            2) ;;
            *)
              echo "::error::Could not read $branch on origin (git ls-remote exit $found)."
              exit 1
              ;;
          esac

          # Off before the push, every time: catalog-check arms it again only
          # if it passes on the new commit and the new body allows it.
          if [ -n "$existing" ] && [ "$(gh pr view "$existing" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge "$existing" --disable-auto
          fi
          if [ -n "$existing" ] && [ "$automerge" != "true" ]; then
            gh pr edit "$existing" --add-label needs-human
          fi

          git checkout -B "$branch"
          git add catalog/tools.json apps/web/vitruviansoftware-dev/_data/tools.yml
          git commit -m "$title" -m "Written by the catalog-bump workflow from the release $TAG." \
            -m "Catalog-Bump: $ID@$version"
          git push -f origin "$branch"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            number="$existing"
            echo "PR #${number} already open for $branch: updated."
          else
            labels=()
            if [ "$automerge" != "true" ]; then
              labels=(--label needs-human)
            fi
            gh pr create --title "$title" --body-file "$RUNNER_TEMP/body.md" --base main --head "$branch" "${labels[@]}"
            number="$(gh pr view "$branch" --json number --jq .number)"
          fi
          if [ "$automerge" = "true" ]; then
            echo "PR #$number: catalog-check arms auto-merge when it passes."
          else
            echo "::notice::PR #$number waits for a person (needs-human): see its description."
          fi

          # A pull request for an older version of the same tool is replaced;
          # one for a newer version is left alone.
          gh pr list --base main --state open --json number,headRefName --limit 200 > "$RUNNER_TEMP/pulls.json"
          bazel run //catalog:bump -- older --pulls "$RUNNER_TEMP/pulls.json" --id "$ID" --version "$version" |
            while read -r older; do
              gh pr close "$older" --delete-branch --comment "Replaced by #${number}, for ${TAG}."
            done
