name: Copybara Export (vitruvian-remote)

# EXPORT-ONLY mirror of Vitruvian Remote: monorepo apps/mobile/android-remote/ ->
# VitruvianSoftware/vitruvian-remote (repo root) on every push under that subtree. Thin
# caller -- logic lives in _copybara-export.yaml; the export_vitruvian_remote workflow is
# defined in tools/copybara/copy.bara.sky.
#
# The mirror is the app's public source (MIT): the Android app and its Mac
# agent and menu. Releases still ship from this repository; the mirror carries
# no release workflow.
on:
    push:
        branches: [main]
        paths: ["apps/mobile/android-remote/**", "tools/copybara/copy.bara.sky"]
    workflow_dispatch:
        inputs:
            copybara-options:
                description: "Copybara CLI options. First seed of the new EMPTY mirror: '--init-history --force --ignore-noop' (no MONOREPO_REV_ID baseline yet; SQUASH mode lands it as one commit). Normal runs: --ignore-noop."
                default: "--ignore-noop"
                required: false

permissions:
    contents: read
    actions: read # _copybara-export.yaml waits for Repo Config Apply runs

concurrency:
    group: copybara-export-vitruvian-remote
    cancel-in-progress: false

jobs:
    export:
        uses: ./.github/workflows/_copybara-export.yaml
        with:
            component: vitruvian-remote
            copybara-options: ${{ inputs['copybara-options'] || github.event.inputs['copybara-options'] || '--force --ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.VITRUVIAN_REMOTE_SYNC_SSH_KEY }}
