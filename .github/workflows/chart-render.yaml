# Renders every co-located Helm chart and asserts its guards REFUSE, not just
# that it parses. Logic lives in tools/ci/chart-render.sh so it is reviewable
# and runnable locally (`bash tools/ci/chart-render.sh`, needs only helm).
#
# Until this existed, no CI job rendered a chart. Every statement about the
# mcp-slack chart — which `required` calls fire, whether the boolean type-check
# refuses a quoted "false" — was a source read by someone who could not run it.
# Several of those reads disagreed before converging, which is the honest
# argument for the job: not that people read carelessly, but that reading is not
# the same instrument as running.
#
# NOT YET A REQUIRED CHECK, and the omission is deliberate rather than pending.
# Promoting it means adding `chart-render` to mergeQueueRequiredChecks in
# infrastructure/pulumi/platform/repo_config/main.go, and that should follow
# evidence it is stable rather than precede it. This file is written so the
# promotion is a one-line change there and needs NO edit here: there is no
# workflow-level `paths:` filter on `pull_request`, so the check reports on
# every PR — which is the property a required check must have and the one whose
# absence wedged this repo once (see gitops-validate.yaml's `on:` block for the
# incident). Rendering three local charts is ~2s; running it unconditionally is
# cheaper than the bookkeeping of deciding when to.
name: chart-render

on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Per-commit keying on non-PR events. A ref-keyed group puts every push-to-main
# run in one lane, where GitHub evicts a still-PENDING run when a newer one
# queues behind the running one — so a burst of merges silently drops the middle
# commits' verdicts. Same pattern, and the same reason, as gitops-validate.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name = the check context, so promoting this to a required check needs no
  # rename. Named `chart-render` rather than a bare `render` so the context is
  # unambiguous in the ruleset.
  chart-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned by digest, matching charts-publish.yml — the other workflow in
      # this repo that needs helm. Same action, same version, deliberately: two
      # helm installs drifting apart is a difference nobody would look for when
      # a chart renders in one job and not the other.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Render charts and assert their guards refuse
        run: bash tools/ci/chart-render.sh

  # Separate job, not another step on chart-render: this one needs the network
  # and a GHCR credential, and chart-render.sh is deliberately offline. Keeping
  # them apart means a registry outage cannot redden the offline template checks,
  # and the two contexts can be promoted to required independently.
  #
  # Job name = the check context, same convention as chart-render above.
  gitops-values-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only pull of public OCI charts from ghcr.io. helm 4's ANONYMOUS
      # token request to ghcr is refused with 403 even for public packages, so a
      # credential is required to render buzz's chart at all.
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Explicit, not assumed. The discovery step parses the gitops tree with
      # PyYAML; if it were merely present-by-default on the runner image, an
      # image change would make this gate find zero pairs. The script also
      # refuses to run without it, so the two cannot disagree silently.
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Render each Application's values against its chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash tools/ci/gitops-values-render.sh
  # Unit-tests the Prometheus ALERT RULES, not just their syntax. Offline and
  # fast; no cluster, no network.
  #
  # Syntax validity was never the failure mode worth gating. The 2026-08-18
  # backstage incident was invisible because no rule existed for it at all, and
  # the trap when writing one is keying on health_status -- which stays "Healthy"
  # through exactly the outage the rule is meant to catch. These tests assert the
  # alert fires WHILE health is Healthy, so that mistake cannot be reintroduced
  # quietly. The rules are extracted from the deployed applicationset at run time
  # rather than duplicated, so the test cannot pass against a stale copy.
  prometheus-rule-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # promtool ships only inside the full prometheus tarball, nested as
      # prometheus-<ver>.linux-amd64/promtool -- hence the member-path argument.
      # (prometheus/promci is NOT an installer: it has no root action.yml, only
      # sub-actions, so `uses: prometheus/promci@...` fails outright.)
      - name: Install promtool (pinned + checksum-verified)
        env:
          # MUST track the prometheus the cluster actually runs, which is the
          # appVersion of the chart pinned in
          # gitops/argocd/platform/prometheus/applicationset.yaml
          # (chart 22.6.7 -> prometheus v2.45.0). promtool validates rules for
          # ITS own version, so a promtool a major version ahead can accept
          # syntax the deployed server rejects -- a gate that passes while the
          # rules fail to load is the failure mode this whole directory exists
          # to prevent. Bump this together with the chart's targetRevision.
          PROMETHEUS_VERSION: 2.45.0
        run: |
          bash tools/ci/install-pinned-tool.sh \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}" \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            sha256sums.txt \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            promtool --tar "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Run rule unit tests
        run: bash tools/ci/prometheus-rule-tests/run.sh
