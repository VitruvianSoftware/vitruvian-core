# Renders every co-located Helm chart and asserts its guards REFUSE, not just
# that it parses. Logic lives in //tools/ci:chart_render so it is reviewable
# and runnable locally (`bazel run //tools/ci:chart_render`, needs only helm).
#
# Until this existed, no CI job rendered a chart. Every statement about the
# vitruvian-slack-mcp chart — which `required` calls fire, whether the boolean type-check
# refuses a quoted "false" — was a source read by someone who could not run it.
# Several of those reads disagreed before converging, which is the honest
# argument for the job: not that people read carelessly, but that reading is not
# the same instrument as running.
#
# NOT A REQUIRED CHECK (none of the three jobs here is), so on pull_request this
# workflow runs only when a file it reads changes: the gitops tree, a chart, the
# tools it builds, or this file. The merge queue and main still run it on every
# change.
#
# The filter is there because "unconditionally is cheaper" did not hold: over
# 48 merged PRs (2026-11-13..14) each of the three jobs took a hosted runner
# for 0.4-0.6 min on every PR, almost all of them with no gitops or chart
# change, and every one of those waited in the same concurrent-job queue as
# the PR's real checks.
#
# BEFORE PROMOTING any of these to a required check (mergeQueueRequiredChecks
# in infrastructure/pulumi/platform/repo-config/main.go), remove the
# `pull_request.paths` filter below or move the job behind a job-level `if:`
# (the `changes` pattern in ci.yaml). A required check whose workflow does not
# start never reports, and the PR waits on it forever (see the `changes` job in ci.yaml;
# `on:` block for the incident).
name: chart-render

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      # What the three jobs read: gitops manifests and values, the local
      # charts (*/deploy/chart, found by chart_render), their tools' sources
      # and fixtures (tools/ci/src/*, tools/ci/chart-render,
      # tools/ci/prometheus-rule-tests), and the actions that build them.
      - 'gitops/**'
      - '**/deploy/chart/**'
      - 'tools/ci/**'
      - 'tools/shell-compat/**'
      - '.github/actions/build-ci-tool/**'
      - '.github/actions/install-pinned-tool/**'
      - '.github/actions/cache-pip-wheel/**'
      # install-pinned-tool checks promtool against its pin here.
      - 'tools/tools.lock.json'
      # cache-pip-wheel checks PyYAML against its pin here.
      - 'requirements/all.txt'
      - '.github/workflows/chart-render.yaml'
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Per-commit keying on non-PR events. A ref-keyed group puts every push-to-main
# run in one lane, where GitHub evicts a still-PENDING run when a newer one
# queues behind the running one — so a burst of merges silently drops the middle
# commits' verdicts. Same pattern, and the same reason, as ci.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name = the check context, so promoting this to a required check needs no
  # rename. Named `chart-render` rather than a bare `render` so the context is
  # unambiguous in the ruleset.
  chart-render:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by digest, matching the generated charts-publish job — the other lane in
      # this repo that needs helm. Same action, same version, deliberately: two
      # helm installs drifting apart is a difference nobody would look for when
      # a chart renders in one job and not the other.
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Build //tools/ci:chart_render (no Bazel on this job)
        id: chart-render-bin
        uses: ./.github/actions/build-ci-tool
        with:
          tool: chart_render

      - name: Render charts and assert their guards refuse
        env:
          CHART_RENDER: ${{ steps.chart-render-bin.outputs.path }}
        run: |
          set -euo pipefail
          "$CHART_RENDER"

  # Separate job, not another step on chart-render: this one needs the network
  # and a GHCR credential, and chart-render is deliberately offline. Keeping
  # them apart means a registry outage cannot redden the offline template checks,
  # and the two contexts can be promoted to required independently.
  #
  # Job name = the check context, same convention as chart-render above.
  gitops-values-render:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only pull of public OCI charts from ghcr.io. helm 4's ANONYMOUS
      # token request to ghcr is refused with 403 even for public packages, so a
      # credential is required to render buzz's chart at all.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      # Explicit, not assumed. The discovery step parses the gitops tree with
      # PyYAML; if it were merely present-by-default on the runner image, an
      # image change would make this gate find zero pairs. The script also
      # refuses to run without it, so the two cannot disagree silently.
      # PyYAML follows requirements/all.txt (hash-pinned under the one-version rule).
      - name: Install PyYAML (cached)
        uses: ./.github/actions/cache-pip-wheel
        with:
          package: pyyaml

      - name: Build //tools/ci:gitops_values_render (no Bazel on this job)
        id: values-render-bin
        uses: ./.github/actions/build-ci-tool
        with:
          tool: gitops_values_render

      - name: Render each Application's values against its chart
        env:
          GITOPS_VALUES_RENDER: ${{ steps.values-render-bin.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          "$GITOPS_VALUES_RENDER"
  # Unit-tests the Prometheus ALERT RULES, not just their syntax. Offline and
  # fast; no cluster, no network.
  #
  # Syntax validity was never the failure mode worth gating. The 2026-08-18
  # backstage incident was invisible because no rule existed for it at all, and
  # the trap when writing one is keying on health_status -- which stays "Healthy"
  # through exactly the outage the rule is meant to catch. These tests assert the
  # alert fires WHILE health is Healthy, so that mistake cannot be reintroduced
  # quietly. The rules are extracted from the deployed applicationset at run time
  # rather than duplicated, so the test cannot pass against a stale copy.
  prometheus-rule-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # promtool ships only inside the full prometheus tarball, nested as
      # prometheus-<ver>.linux-amd64/promtool -- hence the member-path argument.
      # (prometheus/promci is NOT an installer: it has no root action.yml, only
      # sub-actions, so `uses: prometheus/promci@...` fails outright.)
      - name: Install promtool (pinned + checksum-verified)
        env:
          # MUST track the prometheus the cluster actually runs, which is the
          # appVersion of the chart pinned in
          # gitops/argocd/platform/prometheus/applicationset.yaml
          # (chart 22.6.7 -> prometheus v2.45.0). promtool validates rules for
          # ITS own version, so a promtool a major version ahead can accept
          # syntax the deployed server rejects -- a gate that passes while the
          # rules fail to load is the failure mode this whole directory exists
          # to prevent. Bump this together with the chart's targetRevision.
          PROMETHEUS_VERSION: 2.45.0
        uses: ./.github/actions/install-pinned-tool
        with:
          base-url: https://github.com/prometheus/prometheus/releases/download/v${{ env.PROMETHEUS_VERSION }}
          asset: prometheus-${{ env.PROMETHEUS_VERSION }}.linux-amd64.tar.gz
          bin-name: promtool
          mode: tar
          member-path: prometheus-${{ env.PROMETHEUS_VERSION }}.linux-amd64/promtool

      # PyYAML follows requirements/all.txt (hash-pinned under the one-version rule).
      - name: Install PyYAML (cached)
        uses: ./.github/actions/cache-pip-wheel
        with:
          package: pyyaml

      - name: Run rule unit tests
        run: |
          set -euo pipefail
          rustc --edition 2021 --crate-type lib --crate-name shell_compat tools/shell-compat/src/lib.rs -o "$RUNNER_TEMP/libshell_compat.rlib"
          rustc --edition 2021 --crate-type lib --crate-name prometheus_rule_tests tools/ci/prometheus-rule-tests/src/lib.rs -L "$RUNNER_TEMP" --extern shell_compat="$RUNNER_TEMP/libshell_compat.rlib" -o "$RUNNER_TEMP/libprometheus_rule_tests.rlib"
          rustc --edition 2021 tools/ci/prometheus-rule-tests/src/main.rs -L "$RUNNER_TEMP" --extern shell_compat="$RUNNER_TEMP/libshell_compat.rlib" --extern prometheus_rule_tests="$RUNNER_TEMP/libprometheus_rule_tests.rlib" -o "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/run"
