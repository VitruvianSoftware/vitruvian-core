name: zitadel-apps-relay-apply

# Manual apply of the zitadel-apps-relay stack: the Zitadel project and OIDC
# clients for the Vitruvian Relay (spec:
# docs/superpowers/specs/2026-11-07-vitruvian-relay-design.md §6).
#
# Same shape as zitadel-apps-mcp-slack-apply.yaml, which documents each step in
# detail: tailnet tunnel to the internal Zitadel route, Pulumi over it, then a
# report of the stack's outputs. No GCP resources, so no WIF step.
#
# DEFAULTS TO PREVIEW. `up` creates live Zitadel resources and has to be picked
# on the dispatch. NEVER run the `:import` target against this stack: the
# provider plans a replacement and deletes the live client.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preview (safe, default) | up (CREATES live Zitadel resources)"
        required: true
        default: preview
        type: choice
        options: [preview, up]

# Serialize applies of this stack; never cancel an in-flight pulumi up.
concurrency:
  group: zitadel-apps-relay-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Holds HEADSCALE_CI_AUTHKEY and ZITADEL_MACHINE_KEY_JSON:
    # instance-wide credentials first seeded under this environment's name.
    environment: oauth-user-inspector-development
    env:
      DEPLOY_ENV: development
      # Authenticates Pulumi's github:// plugin download (rate limits).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Zitadel tunnel (Headscale join + TLS terminator prep)
        uses: ./.github/actions/zitadel-tunnel-setup
        with:
          headscale-authkey: ${{ secrets.HEADSCALE_CI_AUTHKEY }}

      - name: Install Pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: "Run Pulumi (${{ inputs.action }})"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ZITADEL_MACHINE_KEY_JSON: ${{ secrets.ZITADEL_MACHINE_KEY_JSON }}
          ACTION: ${{ inputs.action }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GOWORK: off
        working-directory: infrastructure/pulumi/platform/zitadel-apps-relay
        run: |
          set -euo pipefail
          retry="${RUNNER_TEMP}/retry-concurrent-update"
          rustc --edition 2021 -O "$GITHUB_WORKSPACE/tools/pulumi/src/bin/retry_concurrent_update.rs" -o "$retry"
          # guarded-up (//tools/pulumi:guarded-up) runs `pulumi preview --json`, the
          # plan guard, then `pulumi up`, as one unit retried on the 409. The guard
          # refuses a plan that deletes or replaces anything nobody approved: on
          # the Zitadel provider a replace of an OIDC app DELETES the live client
          # and breaks hosted login (2026-06-26).
          guarded_up="${RUNNER_TEMP}/guarded-up"
          rustc --edition 2021 -O "$GITHUB_WORKSPACE/tools/pulumi/src/bin/guarded_up.rs" -o "$guarded_up"

          # Internal route to Zitadel over the Headscale mesh (the public edge 403s
          # the API). $ZITADEL_GATEWAY comes from the zitadel-tunnel-setup action.
          : "${ZITADEL_GATEWAY:?zitadel-tunnel-setup did not pick a gateway node}"
          sudo socat OPENSSL-LISTEN:443,bind=127.0.0.1,reuseaddr,fork,cert=/etc/auth-internal-ck.pem,verify=0 \
            TCP:"${ZITADEL_GATEWAY}" &
          trap 'sudo pkill -f "OPENSSL-LISTEN:443" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            curl -fsS --max-time 5 https://auth.ipv1337.dev/debug/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 https://auth.ipv1337.dev/debug/healthz >/dev/null
          echo "internal route to auth.ipv1337.dev is up"

          # plan-guard:begin
          # No --create: the development stack exists, and a missing stack is a
          # mistake to stop on, not one to paper over with an empty stack.
          pulumi stack select "$DEPLOY_ENV"
          pulumi config set --secret zitadel:jwtProfileJson "$ZITADEL_MACHINE_KEY_JSON"
          if [ "$ACTION" = "up" ]; then
            # refresh is a Pulumi Cloud update too, so it waits out the 409.
            "$retry" pulumi refresh --yes
            # Which deletes and replaces may apply: only ones a reviewed commit named
            # with an `Allow-destroy: <urn>` line. A push reads the pushed commits; a
            # release reads the commits since the product's previous release
            # (tools/pulumi/release_approvals.sh). A manual run approves nothing.
            allow=()
            case "${EVENT_NAME:-}" in
              push)
                allow=(--allow-destroy-from-event "${GITHUB_EVENT_PATH:?}")
                ;;
              release)
                approvals="${RUNNER_TEMP}/release-approvals.json"
                "$GITHUB_WORKSPACE/tools/pulumi/release_approvals.sh" "$approvals"
                allow=(--allow-destroy-from-event "$approvals")
                ;;
            esac
            "$guarded_up" "zitadel-apps-relay ${DEPLOY_ENV}" ${allow[@]+"${allow[@]}"}
          else
            pulumi preview --diff
          fi
          # plan-guard:end

          if [ "$ACTION" != "up" ] && ! pulumi stack output projectId >/dev/null 2>&1; then
            echo "stack has no outputs yet — nothing applied, skipping the report"
            exit 0
          fi

          # Report what is live. Refresh first so ignored fields show Zitadel's
          # current values, not the last ones Pulumi wrote. Nothing printed here
          # is secret: client ids are not credentials, and geminiClientSecret
          # (the one confidential client's secret) is never printed. Read it
          # locally with the :stack target (see the stack's README).
          "$retry" pulumi refresh --yes
          for o in projectId projectRoleCheck scopes connectorClientId claudeClientId; do
            v="$(pulumi stack output "$o")"
            if [ -z "$v" ]; then
              echo "::error::stack output $o read back empty — refusing to report a blank value" >&2
              exit 1
            fi
            printf '%-26s %s\n' "$o" "$v"
          done
          # Read every output once. Under bash -e a failed read stops the run
          # here, so a transient Pulumi error can't make a client look absent.
          outputs="$(pulumi stack output --json)"
          # has() runs jq inside an `if`, where a parse error would read as
          # "key absent" and skip a client's check. Prove it's a JSON object first.
          if ! jq -e 'type == "object"' <<<"$outputs" >/dev/null; then
            echo "::error::pulumi stack output --json did not return a JSON object" >&2
            exit 1
          fi
          has() { jq -e --arg k "$1" 'has($k)' <<<"$outputs" >/dev/null; }
          get() { jq -r --arg k "$1" '.[$k]' <<<"$outputs"; }
          for c in chatgpt gemini; do
            if has "${c}ClientId"; then
              printf '%-26s %s\n' "${c}ClientId" "$(get "${c}ClientId")"
            fi
          done
          # The relay validates JWTs locally; an opaque token on any client would
          # fail every request while the stack reports clean.
          for c in connector claude chatgpt gemini; do
            # chatgpt and gemini exist only when their callbacks are configured.
            # Skip one only when the stack has no client for it; a configured
            # client with no token type fails the run.
            if { [ "$c" = chatgpt ] || [ "$c" = gemini ]; } && ! has "${c}ClientId"; then
              continue
            fi
            if ! has "${c}AccessTokenType"; then
              echo "::error::${c} client exists but has no ${c}AccessTokenType output" >&2
              exit 1
            fi
            att="$(get "${c}AccessTokenType")"
            if [ "$att" != "OIDC_TOKEN_TYPE_JWT" ]; then
              echo "::error::${c} access token type is '${att}', not OIDC_TOKEN_TYPE_JWT" >&2
              exit 1
            fi
          done
