name: Registry Trust

# Did every released version come from the mirror's workflow, and not from a
# person? Publishing is keyless: release-please moves a version, Copybara
# exports it, and the mirror's release.yml publishes with the runner's
# identity. This asks npm, crates.io and PyPI, in public, whether that is what
# happened, for every package release-please releases
# (//tools/registry-trust:check; docs/engineering/registry-trust.md).
#
# It needs the network, so it is not a presubmit test: its logic is tested
# with recorded answers in //tools/registry-trust:check_test.
#
# NOT a required check. It gates nothing; red here means a person published a
# version by hand, or a registry could not be read (the log says which).
#
# Who is told: a red run on a schedule opens or refreshes ONE issue, as
# periodic-full-sweep.yaml and supply-chain.yaml do, because a scheduled run
# notifies nobody. A red run on a push to main is a failed push run, which
# notify-ci-issues.yaml already sends to ntfy.

on:
  schedule:
    # Daily, off the hour: a hand-published version is known within a day.
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # A release (a manifest moved), a package added to or taken out of
    # release-please, a mirror or its workflow changed, or this tool changed.
    paths:
      - "**/.release-please-manifest.json"
      - "**/release-please-config.json"
      - "tools/copybara/copy.bara.sky"
      - "tools/registry-trust/**"
      - ".github/workflows/registry-trust.yaml"

# Least privilege: it reads the checkout and three public registries. No
# secret and no token is used by the check.
permissions:
  contents: read

concurrency:
  group: registry-trust-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Every released version came from the workflow
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain python3, standard library only: no Bazel, so no cache key and no
      # secret. It exits 1 naming each package and version a person
      # published, and 2 when a registry could not be read.
      - name: Ask npm, crates.io and PyPI who published each version
        run: |
          set -euo pipefail
          rustc --edition 2021 --crate-type lib --crate-name registry_trust tools/registry-trust/src/lib.rs -o "$RUNNER_TEMP/libregistry_trust.rlib"
          rustc --edition 2021 tools/registry-trust/src/main.rs -L "$RUNNER_TEMP" --extern registry_trust="$RUNNER_TEMP/libregistry_trust.rlib" -o "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check"

  # Separate job, so the check itself keeps read-only permissions on every
  # event. One issue, found by its exact title: later red days comment on it,
  # and closing it re-arms creation.
  alert:
    name: Open or refresh the issue
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or refresh the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Registry trust is red: a released version did not come from the workflow"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The scheduled \`registry-trust\` check failed on \`main\`.

          Either a version of one of our packages on npm, crates.io or PyPI was
          published by a person and not by its mirror's release workflow, or a
          registry could not be read. The run log names each package and
          version, or the registry that did not answer.

          Failing run: ${run_url}

          Reproduce: \`bazel run //tools/registry-trust:check\` (read-only, no
          token). What to do about it: docs/engineering/registry-trust.md."
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red: ${run_url}"
          else
            gh issue create --title "$title" --body "$body"
          fi
