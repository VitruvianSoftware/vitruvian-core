# release-please and asset publisher for the Daytona Platinum 126506 Wear OS watch face:
# 1. Authors release PRs from conventional commits under apps/mobile/wearos/faces/daytona-platinum/.
# 2. When the release PR merges, cuts the GitHub Release (tag: daytona-platinum-vX.Y.Z).
# 3. Packages and signs the Declarative Watch Face Format (WFF) APK on Linux,
#    computes its SHA-256 sidecar, and attaches both to the GitHub Release so
#    users can download and install DaytonaPlatinum-X.Y.Z.apk directly.
# 4. Verifies the GitHub Release holds both assets with non-zero size and matching SHA-256.
name: daytona-platinum-release

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/wearos/faces/daytona-platinum/**"
      - ".github/workflows/daytona-platinum-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. daytona-platinum-v0.1.0). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: daytona-platinum-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/mobile/wearos/faces/daytona-platinum--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/mobile/wearos/faces/daytona-platinum--tag_name'] }}
      version: ${{ steps.release.outputs['apps/mobile/wearos/faces/daytona-platinum--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/mobile/wearos/faces/daytona-platinum/release-please-config.json
          manifest-file: apps/mobile/wearos/faces/daytona-platinum/.release-please-manifest.json
          target-branch: main

  publish-package:
    needs: release-please
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: daytona-platinum-publish-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Publish downloadable Watch Face APK
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash apps/mobile/wearos/faces/daytona-platinum/scripts/publish.sh

  check-release:
    needs: [release-please, publish-package]
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check the release has every file
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#daytona-platinum-v}"
          listing="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"')"
          printf '%s\n' "${listing}"
          missing=0
          for file in \
            "DaytonaPlatinum-${version}.apk" \
            "DaytonaPlatinum-${version}.apk.sha256"; do
            size="$(awk -F '\t' -v f="${file}" '$1 == f { print $2 }' <<<"${listing}")"
            if [[ -z "${size}" || "${size}" == "0" ]]; then
              echo "::error::${TAG} has no ${file}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          dir="$(mktemp -d)"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
            --pattern "DaytonaPlatinum-${version}.apk" \
            --pattern "DaytonaPlatinum-${version}.apk.sha256"
          (cd "${dir}" && sha256sum -c "DaytonaPlatinum-${version}.apk.sha256")
