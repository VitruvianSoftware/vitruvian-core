name: _oauth-identity-apply

# Reusable single-env apply of the oauth-user-inspector identity stack
# (oauth-user-inspector/infra/identity). The caller
# (the GENERATED .github/workflows/delivery.yaml, rendered from the delivery()
# unit in oauth-user-inspector/infra/identity/BUILD; the hand-written
# oauth-user-inspector-identity-stack.yaml caller was deleted in Phase 3)
# invokes it once per env in a
# sequential dev -> nonproduction -> production chain, each leg gated by its own
# foundation-proj-<env> GitHub Environment.
#
# IDENTITY: runs as the PER-ENV foundation-proj-<env> service account (the
# stage-4 projects SA for that leaf, which created the env's oss-floating project
# and set its IAM in stage-4). It covers this stack's resources — deploy/runtime
# SA create, per-app project IAM, Cloudflare-token secret IAM — with no new
# grant. This stack does NOT enable any API (the siteverification enable each
# env's self-verify path needs lives in the foundation project factory's
# ActivateApis for every prj-{env}-bu1-oss-floating project, declared as the
# project owner — plus a one-time manual console enable per project, the API
# being console-only).

on:
  workflow_call:
    inputs:
      stack:
        description: Pulumi stack / env (development | nonproduction | production)
        required: true
        type: string
      gh-environment:
        description: GitHub Environment supplying the per-env WIF vars (foundation-proj-<env>)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    # Serialize applies of the SAME stack; never cancel an in-flight pulumi up.
    concurrency:
      group: oauth-user-inspector-identity-stack-deploy-${{ inputs.stack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Per-env foundation identity + reviewer gate (protected branches only).
    environment: ${{ inputs.gh-environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit CI runners routinely
      # exhaust (intermittent 403s); GITHUB_TOKEN raises this to 5000/hr. Same
      # class of fix as #756 / the build-stack workflow.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (oauth-user-inspector identity / ${{ inputs.stack }})
        id: pulumi
        uses: ./.github/actions/pulumi-run-captured
        with:
          command: up
          stack: ${{ inputs.stack }}
          working-directory: oauth-user-inspector/infra/identity
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Render the pulumi output digest onto the run's step-summary page via the
      # shared composite (.github/actions/pulumi-summary). Runs even when the
      # deploy fails so the failure — and what it touched — is surfaced.
      - name: Pulumi digest → step summary
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: oauth-user-inspector-identity-${{ inputs.stack }}
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}
