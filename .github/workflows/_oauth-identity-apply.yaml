name: _oauth-identity-apply

# Reusable single-env apply of the oauth-user-inspector identity stack
# (oauth-user-inspector/infra/identity). The caller
# (oauth-user-inspector-identity-stack.yaml) invokes it once per env in a
# sequential dev -> nonproduction -> production chain, each leg gated by its own
# foundation-proj-<env> GitHub Environment.
#
# IDENTITY: runs as the PER-ENV foundation-proj-<env> service account (the
# stage-4 projects SA that CREATED that env's oss-floating project and enabled
# its APIs) — NOT foundation-proj-shared / sa-terraform-proj. That matters
# because the dev leg's siteverification.googleapis.com enable needs
# serviceusage.services.enable ON the floating project, which the per-env
# projects SA provably holds (it enabled every other API there in stage-4)
# whereas the shared SA holds only secretmanager.admin there — the #948 apply
# failed for exactly that reason. The per-env SA also created the project's SAs
# and set its IAM in stage-4, so it covers the rest of the stack (deploy/runtime
# SA create, per-app project IAM, Cloudflare-token secret IAM) with no new grant.

on:
  workflow_call:
    inputs:
      stack:
        description: Pulumi stack / env (development | nonproduction | production)
        required: true
        type: string
      gh-environment:
        description: GitHub Environment supplying the per-env WIF vars (foundation-proj-<env>)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    # Serialize applies of the SAME stack; never cancel an in-flight pulumi up.
    concurrency:
      group: oauth-user-inspector-identity-stack-deploy-${{ inputs.stack }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Per-env foundation identity + reviewer gate (protected branches only).
    environment: ${{ inputs.gh-environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the job does not hit
      # the 60/hr/IP unauthenticated GitHub API rate limit CI runners routinely
      # exhaust (intermittent 403s); GITHUB_TOKEN raises this to 5000/hr. Same
      # class of fix as #756 / the build-stack workflow.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (oauth-user-inspector identity / ${{ inputs.stack }})
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          STACK: ${{ inputs.stack }}
        working-directory: oauth-user-inspector/infra/identity
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (${STACK})"
          { pulumi stack select -c "${STACK}" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      # Render the pulumi output digest onto the run's step-summary page. Runs
      # even when the deploy fails so the failure — and what it touched — is
      # surfaced. tools/ci/pulumi-summary.sh parses the counts, flags any
      # destructive replace/delete, and tucks the raw log into a <details>.
      - name: Pulumi digest → step summary
        if: always()
        env:
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "oauth-user-inspector-identity-${{ inputs.stack }}" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"
