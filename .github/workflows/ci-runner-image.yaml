# Builds vitruvian-ci-runner (tools/ci-runner), the image the homelab
# merge-queue runners run, checks it has what the queue jobs expect
# (//tools/ci-runner:parity), and pushes it to GHCR from main. The runner
# scale set pins it by digest (gitops/argocd/platform/actions-runners).
# Spec: docs/superpowers/specs/2026-10-19-queue-runners-on-homelab-design.md §3

name: ci-runner-image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'tools/ci-runner/**'
      - '.github/workflows/ci-runner-image.yaml'
  pull_request:
    paths:
      - 'tools/ci-runner/**'
      - '.github/workflows/ci-runner-image.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vitruviansoftware/vitruvian-ci-runner

jobs:
  image:
    # Always GitHub-hosted: this builds the homelab runners' own image.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only: the runner nodes (fedora, nuc9i9) and the runner binary
      # in the image are x64.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/ci-runner
          file: tools/ci-runner/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vitruvian-ci-runner:check
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha,scope=ci-runner-image
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=max,scope=ci-runner-image' || format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.IMAGE) }}

      - name: Parity check (what the queue jobs expect)
        run: |
          set -euo pipefail
          rustc --edition 2021 --crate-type lib --crate-name parity_lib tools/ci-runner/src/lib.rs -o "$RUNNER_TEMP/libparity_lib.rlib"
          rustc --edition 2021 tools/ci-runner/src/main.rs -L "$RUNNER_TEMP" --extern parity_lib="$RUNNER_TEMP/libparity_lib.rlib" -o "$RUNNER_TEMP/parity"
          docker run --rm -e ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT= \
              -e BAZEL_VERSION="$(cat .bazelversion)" \
              -v "$RUNNER_TEMP/parity:/check/parity:ro" \
              vitruvian-ci-runner:check /check/parity

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/ci-runner
          file: tools/ci-runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Digest → step summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Pushed \`${IMAGE}@${DIGEST}\` — pin this in the runner scale set." >> "$GITHUB_STEP_SUMMARY"
