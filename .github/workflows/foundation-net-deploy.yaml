# Reusable workflow for deploying a single foundation network.
#
# This workflow deploys one Pulumi stack (development, nonproduction, or
# production) for the gcp-networks foundation stage. It is called by
# the main foundation-release.yaml workflow in a chained sequence:
#
#   development (auto) → nonproduction (manual approval) → production (manual approval)
#
# Each environment maps to:
#   - A Pulumi stack with its own state and config (Pulumi.{environment}.yaml)
#   - A GitHub Environment with optional protection rules (foundation-net-{environment})
#
# This pattern replaces the upstream Terraform foundation's branch promotion
# strategy (development → nonproduction → production branches) with a
# monorepo-compatible approach using GitHub Environment gates.

name: Foundation Network Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment: development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-networks"
        description: "Working directory for pulumi commands"
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - development
          - nonproduction
          - production
        description: "Target environment: development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-networks"
        description: "Working directory for pulumi commands"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-net-${{ inputs.environment }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (${{ inputs.environment }})
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (${ENVIRONMENT})"
          { pulumi stack select -c "${ENVIRONMENT}" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      # Render the pulumi output digest onto the run's step-summary page. Runs
      # even when the deploy fails so the failure — and what it touched — is
      # surfaced. tools/ci/pulumi-summary.sh parses the counts, flags any
      # destructive replace/delete, and tucks the raw log into a <details>.
      - name: Pulumi digest → step summary
        if: always()
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "$(basename "${WORKING_DIRECTORY}")" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"
