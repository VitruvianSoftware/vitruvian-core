# Reusable workflow for deploying a single foundation network leaf.
#
# This workflow deploys one leaf (shared, development, nonproduction, or
# production) of the gcp-networks foundation stage. It is called by
# the main foundation-release.yaml workflow in a chained sequence:
#
#   development (auto) → nonproduction (manual approval)
#     → shared (manual approval; the hub) → production (manual approval)
#
# Upstream-leaf layout: each leaf is its own thin Pulumi project at
# envs/{environment}/ (upstream 3-networks-hub-and-spoke/envs/<env>), with a
# single `production` stack (ipv1337/foundation-networks-<leaf>/production) and
# the stage logic shared via ../../modules. The `shared` leaf holds the hub VPC
# / DNS hub / hierarchical firewall; the env leaves hold the spokes. Each leaf
# maps to:
#   - A leaf Pulumi project dir: {working_directory}/envs/{environment}
#     (committed non-secret config in that leaf's Pulumi.production.yaml)
#   - A GitHub Environment with optional protection rules (foundation-net-{environment})
#
# This pattern replaces the upstream Terraform foundation's branch promotion
# strategy (development → nonproduction → production branches, with envs/shared
# applied alongside production) with a monorepo-compatible approach using
# GitHub Environment gates.

name: Foundation Network Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target leaf: shared, development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-networks"
        description: "Stage root directory; pulumi runs in {working_directory}/envs/{environment}"
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - shared
          - development
          - nonproduction
          - production
        description: "Target leaf: shared, development, nonproduction, or production"
      working_directory:
        required: false
        type: string
        default: "infrastructure/pulumi/foundation/gcp-networks"
        description: "Stage root directory; pulumi runs in {working_directory}/envs/{environment}"

permissions:
  contents: read
  id-token: write

jobs:
  # On a DIRECT manual dispatch (not when foundation-release calls this via
  # workflow_call -- that run shows the changelog from its own `changelog` job),
  # render this stage's latest changelog into the run page before the gated
  # deploy. Ungated + independent of `deploy`, so it never delays the rollout.
  changelog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Changelog → step summary
        env:
          WORKDIR: ${{ inputs.working_directory }}
        run: bash tools/ci/changelog-summary.sh "$WORKDIR/CHANGELOG.md" "" "$(basename "$WORKDIR")"

  deploy:
    # Serialize per (stack dir + environment): a newer promotion run waits for an
    # older in-flight one rather than racing/deploying out of order onto live org
    # infra. Never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-net-deploy-${{ inputs.working_directory }}-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-net-${{ inputs.environment }}
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads (e.g. pulumiverse
      # pulumi-resource-time used by gcp-networks for time.Sleep propagation
      # gates) so the job does not hit the 60/hr/IP unauthenticated GitHub API
      # rate limit that CI runners routinely exhaust (intermittent 403s);
      # GITHUB_TOKEN raises this to 5000/hr. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # Consume the region from the earlier phase (foundation design): read the
      # canonical regions out of gcp-bootstrap's common_config output and hand them
      # to the networks program as env vars, which win over the committed config
      # (see envOrConfig in each env's config.go). This keeps every phase on ONE
      # region source — bootstrap — and is why the leaf can't just silently drift
      # (that is how the secondary became us-south1). We inject at the deploy layer
      # rather than reading a StackReference in-program because the region is baked
      # into LOGICAL resource names (network/v2 subnets, hub cloud routers), which
      # must be static strings and a StackReference output is async. Fail-safe: if
      # the read returns nothing the program falls back to its committed value,
      # which config_test.go guards to equal the canonical bootstrap regions.
      - name: Consume regions from gcp-bootstrap (single source of truth)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          # +e: clear the inherited errexit so an empty read / skipped echo does not
          # abort the step (GH runs steps as `bash -eo pipefail`; -uo alone keeps -e).
          set +e -u -o pipefail
          CC="$(pulumi stack output --stack ipv1337/foundation-bootstrap/production common_config --json 2>/dev/null || echo '{}')"
          R1="$(printf '%s' "$CC" | jq -r '.default_region // empty')"
          R2="$(printf '%s' "$CC" | jq -r '.default_region_2 // empty')"
          [ -n "$R1" ] && echo "NETWORKS_DEFAULT_REGION=$R1" >> "$GITHUB_ENV"
          [ -n "$R2" ] && echo "NETWORKS_SECONDARY_REGION=$R2" >> "$GITHUB_ENV"
          echo "Consumed from bootstrap: default_region=${R1:-<committed-fallback>} default_region_2=${R2:-<committed-fallback>}"

      # Upstream-leaf layout: the environment selects the leaf Pulumi project
      # dir; every leaf has exactly one stack, `production`.
      - name: Pulumi up (${{ inputs.environment }})
        id: pulumi
        uses: ./.github/actions/pulumi-run-captured
        with:
          command: up
          stack: production
          working-directory: ${{ inputs.working_directory }}/envs/${{ inputs.environment }}
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Render the pulumi output digest onto the run's step-summary page via the
      # shared composite (.github/actions/pulumi-summary). Runs even when the
      # deploy fails so the failure — and what it touched — is surfaced.
      - name: Compute the pulumi digest label
        if: always()
        id: label
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: echo "value=$(basename "${WORKING_DIRECTORY}")/${{ inputs.environment }}" >> "${GITHUB_OUTPUT}"

      - name: Pulumi digest → step summary
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: ${{ steps.label.outputs.value }}
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}
