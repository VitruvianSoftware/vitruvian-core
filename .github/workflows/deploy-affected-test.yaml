# Regression guard for tools/ci/deploy-affected.sh — the Bazel-graph deploy gate
# shared by tabula-deploy, tabula-dev-latest, and (path-only mode, #1351)
# oauth-user-inspector-deploy. Hermetic: a real temp git repo (no faking needed
# for the diff/path logic) plus a fake target-determinator binary (TD_BIN) for
# the graph-mode cases only. Pins the FAIL-OPEN invariant (every uncertain path
# deploys) and the path-only mode contract (no graph universe -> EXTRA_PATH_REGEX
# alone decides, never the global-impact guard).

name: Deploy Affected Test

on:
  pull_request:
    paths:
      - "tools/ci/deploy-affected.sh"
      - "tools/ci/deploy-affected_test.sh"
      - "tools/ci/td-lib.sh"
      - ".github/workflows/deploy-affected-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/deploy-affected.sh"
      - "tools/ci/deploy-affected_test.sh"
      - "tools/ci/td-lib.sh"
      - ".github/workflows/deploy-affected-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the deploy-affected script tests
        run: bash tools/ci/deploy-affected_test.sh
