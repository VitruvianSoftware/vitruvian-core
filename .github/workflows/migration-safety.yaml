# Migration-safety gate (issue #819): Squawk-lint Tabula's Prisma migrations so a
# backward-INCOMPATIBLE change (drop/rename a column, narrow a type, add a
# validated constraint) can't reach main and break the OLD Cloud Run revision
# during the blue-green traffic shift (see tools/ci/migration-safety.sh and
# tabula/api/prisma/.squawk.toml for the WHY and the tuned rule set).
name: migration-safety

on:
  workflow_dispatch: {}
  # NB: NO workflow-level `paths:` filter. This is a REQUIRED merge-queue check
  # (job name `migration-safety`, wired into the ruleset in
  # infrastructure/pulumi/platform/repo_config/main.go and guarded by
  # //tools/conformance:check), so it must REPORT on every pull_request and
  # merge_group. A path-filtered required check never runs -- and so never
  # reports -- on a PR outside its paths, wedging that PR's mergeability. The
  # WORK is gated instead by the script's own changed-files diff (which is empty,
  # and thus a fast no-op, for PRs that touch no migrations).
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: migration-safety-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the script's three-dot `git diff <base>...HEAD`
          # against the merge base resolves the migrations THIS branch adds.
          fetch-depth: 0

      # On pull_request / merge_group, lint the migrations the change adds
      # (base = the event's base sha). On push / workflow_dispatch there is no
      # meaningful base, so the script runs its self-test only and still reports.
      - name: Squawk migration-safety
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            merge_group)  BASE="$MG_BASE" ;;
            *)            BASE="" ;;
          esac
          bash tools/ci/migration-safety.sh "$BASE"
