# Throwaway check: confirms GitHub refuses runs from a non-main branch that
# target the deploy Environments. Lives only on its scratch branch; never merged.
name: scratch-env-refusal

on:
  push:
    branches: ["atlas/scratch-env-refusal-4120"]

permissions: {}

jobs:
  tabula-development:
    runs-on: ubuntu-latest
    environment: tabula-development
    steps:
      - run: echo "should never run"
  oauth-user-inspector-development:
    runs-on: ubuntu-latest
    environment: oauth-user-inspector-development
    steps:
      - run: echo "should never run"
