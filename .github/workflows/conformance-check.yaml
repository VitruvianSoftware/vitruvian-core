name: Conformance Check

# Fails the PR when version pins drift across the repo's source-of-truth files —
# e.g. a `go.mod` that no longer matches `go.work`, a Dockerfile `FROM node:`
# that disagrees with `.nvmrc`, or a `package.json` that declares a cataloged
# dependency as a literal range instead of `catalog:`. Unlike `//:doctor` (which
# checks a developer's machine), this runs on the source tree, so drift is caught
# automatically. The single remediation is `bazel run //tools/conformance:check`
# (read its output). Deviations are tracked as temporary, justified rows in
# tools/conformance/version-pins.tsv.
on:
  push:
    branches: [main]
  pull_request:
  # Required status check: must report on the merge queue's `merge_group` event
  # (repo_config gates the queue on this job) or the queue would hang pending.
  merge_group:

permissions:
  contents: read

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The relevant-paths gate (below) diffs HEAD against the PR merge-base,
          # so the merge-base must be present locally; full history makes it
          # reliable. On push/merge_group the gate is skipped and the check runs.
          fetch-depth: 0

      # Changed-paths gate (CI lead-time optimisation, NOT a safety floor). Like
      # tidy-check, this is intended to be a REQUIRED status check, so it must
      # ALWAYS report a result — we keep triggering on every event and make the
      # heavy steps no-op to success in seconds when the PR diff can't affect
      # version pins (docs/gitops/markdown-only). On push/merge_group the gate is
      # skipped and `relevant` is empty, so the steps run unconditionally.
      - name: Gate on changed paths (PR only)
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/relevant-paths.sh

      - name: Install Bazel
        if: steps.gate.outputs.relevant != 'false'
        uses: ./.github/actions/setup-bazel

      - name: Verify version pins are consistent across the repo
        if: steps.gate.outputs.relevant != 'false'
        run: bazel run //tools/conformance:check
