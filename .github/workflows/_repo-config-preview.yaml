name: Repo Config Preview

# Gated PR preview for the repo_config Pulumi module.
#
# When enabled, runs `pulumi preview --diff` against the repo_config stack on
# pull requests that touch the module, and posts the diff back to the PR as a
# single updating comment so reviewers can see the proposed GitHub-settings
# change before it is applied (via the separate apply/up workflow on merge).
#
# DISABLED BY DEFAULT — opt in by setting the repository variable
# REPO_CONFIG_PREVIEW_ENABLED=true (Settings -> Secrets and variables ->
# Actions -> Variables). The shared GitHub App (created once per org via
# `bazel run //tools/pulumi:create-app`) supplies the Pulumi GitHub provider
# credentials; set its app id in the PULUMI_APP_ID variable and its private key
# in the APP_PRIVATE_KEY secret, plus PULUMI_ACCESS_TOKEN for the Pulumi backend.
on:
    pull_request:
        # repo_config compiles + deploys the shared pkg/secrets it imports (local
        # `replace` in go.mod), so a pkg/secrets change must also preview/apply here.
        paths:
            - "infrastructure/pulumi/platform/repo_config/**"
            - "infrastructure/pulumi/pkg/secrets/**"

permissions:
    contents: read
    pull-requests: write

# Cancel superseded preview runs for the same PR (pull_request-only trigger).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    preview:
        if: ${{ vars.REPO_CONFIG_PREVIEW_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - name: Install Bazel
              uses: ./.github/actions/setup-bazel

            - name: Mint a GitHub App token for the Pulumi GitHub provider
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.PULUMI_APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Pulumi preview (repo_config)
              id: pulumi
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_OWNER: ${{ github.repository_owner }}
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  # Same value the apply injects (#456) so the preview resolves the
                  # Dependabot secret from env, not a committed secure: value.
                  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
              run: |
                  # +e so a failing preview does not abort before we capture its
                  # exit code. --color=no --curses=no stops Bazel ANSI/cursor noise;
                  # pulumi-summary.sh strips any residual pulumi color itself.
                  set +e -u -o pipefail
                  bazel run --color=no --curses=no \
                      //infrastructure/pulumi/platform/repo_config:preview -- --stack dev --diff \
                      2>&1 | tee /tmp/preview-raw.txt
                  ec="${PIPESTATUS[0]}"
                  echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
                  exit "${ec}"

            # Structured digest (creates/updates/replaces/deletes, destructive
            # flagged) → step summary + the same sticky comment, replacing the
            # prior raw-dump. pulumi-summary.sh cleans ANSI and parses only the
            # last `Resources:` section, so it takes the raw combined bazel log
            # directly (no pre-clean/section-extraction needed here).
            - name: Pulumi digest → summary + sticky comment
              if: ${{ always() }}
              uses: ./.github/actions/pulumi-summary
              with:
                  label: repo_config
                  out-file: /tmp/preview-raw.txt
                  exit-code: ${{ steps.pulumi.outputs.exit_code }}
                  sticky-header: repo-config-preview
