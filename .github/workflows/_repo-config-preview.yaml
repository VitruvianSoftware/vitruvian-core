name: Repo Config Preview

# Gated PR preview for the repo_config Pulumi module.
#
# When enabled, runs `pulumi preview --diff` against the repo_config stack on
# pull requests that touch the module, and posts the diff back to the PR as a
# single updating comment so reviewers can see the proposed GitHub-settings
# change before it is applied (via the separate apply/up workflow on merge).
#
# DISABLED BY DEFAULT — opt in by setting the repository variable
# REPO_CONFIG_PREVIEW_ENABLED=true (Settings -> Secrets and variables ->
# Actions -> Variables). The shared GitHub App (created once per org via
# `bazel run //tools/pulumi:create-app`) supplies the Pulumi GitHub provider
# credentials; set its private key in the APP_PRIVATE_KEY secret, plus
# PULUMI_ACCESS_TOKEN for the Pulumi backend. The App is identified by its
# CLIENT id (#993) -- committed as the default, overridable via the
# PULUMI_APP_CLIENT_ID variable. PULUMI_APP_ID is no longer read here.
on:
    pull_request:
        # repo_config compiles + deploys the shared pkg/secrets it imports (local
        # `replace` in go.mod), so a pkg/secrets change must also preview/apply here.
        paths:
            - "infrastructure/pulumi/platform/repo_config/**"
            - "infrastructure/pulumi/pkg/secrets/**"

permissions:
    contents: read
    pull-requests: write

# Cancel superseded preview runs for the same PR (pull_request-only trigger).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    preview:
        if: ${{ vars.REPO_CONFIG_PREVIEW_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Install Bazel
              uses: ./.github/actions/setup-bazel

            # Dependabot-authored PRs read the DEPENDABOT secret store, not the
            # repository one, so `secrets.APP_PRIVATE_KEY` resolves to the empty
            # string and create-github-app-token dies with "The 'private-key'
            # input must be set to a non-empty string" before pulumi is ever
            # reached. That put a red X on every dependency bump touching
            # repo_config or pkg/secrets -- a failure about the RUNNER's
            # credentials that says nothing about the bump.
            #
            # Same run-then-noop-green shape #1186 gave pulumi-preview.yaml for
            # PULUMI_ACCESS_TOKEN, and keyed on the CREDENTIAL rather than on
            # `github.actor == 'dependabot[bot]'` for the same reason: fork PRs
            # and any future key rotation hit this identical wall, and an actor
            # check would silently miss both. The secrets context is not usable
            # in an `if:`, hence the detour through env + an output.
            #
            # The CURE ships alongside this: repo_config now mirrors
            # APP_PRIVATE_KEY into the Dependabot store (dependabotSecrets), so
            # once that applies, Dependabot PRs take the real preview path and
            # this branch goes dormant for them.
            #
            # Kept anyway, because it still fires for fork PRs -- which cannot
            # read the Dependabot store either -- and during any window where the
            # App key is rotated or the mirror is withdrawn. Deleting it would
            # re-open the exact red-X-about-the-runner failure on those paths.
            - name: Detect GitHub App credential
              id: creds
              env:
                  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [ -n "${APP_PRIVATE_KEY}" ]; then
                      echo "available=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "available=false" >> "${GITHUB_OUTPUT}"
                  fi

            - name: Mint a GitHub App token for the Pulumi GitHub provider
              id: app-token
              if: steps.creds.outputs.available == 'true'
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ vars.PULUMI_APP_CLIENT_ID || 'Iv23lijyULMNaNPFbaQZ' }} # vitruviansoftware-pulumi; var wins so //tools/pulumi:create-app can rebootstrap
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            # Says WHY the leg is green rather than leaving the reader to infer
            # it from the digest's generic "preview was skipped" -- the coverage
            # gap is real (a bump that breaks repo_config EVALUATION is not
            # caught on this PR) and should be legible on the PR itself.
            - name: Note skipped preview (no GitHub App credential)
              if: steps.creds.outputs.available != 'true'
              run: |
                  set -euo pipefail
                  printf '### repo_config\n\n_Pulumi preview skipped: `APP_PRIVATE_KEY` is not exposed to this event (Dependabot and fork PRs read a separate secret store). This stack is previewed again on the next maintainer PR and re-checked at apply time._\n' \
                      >> "${GITHUB_STEP_SUMMARY}"

            - name: Pulumi preview (repo_config)
              id: pulumi
              if: steps.creds.outputs.available == 'true'
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_OWNER: ${{ github.repository_owner }}
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  # Same value the apply injects (#456) so the preview resolves the
                  # Dependabot secret from env, not a committed secure: value.
                  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
                  # Required for the same reason, and load-bearing in a way that is
                  # easy to miss: dependabotSecrets skips an entry whose value is
                  # absent, so a preview WITHOUT this in env would resolve the entry
                  # to nil and render the mirrored secret as a pending DELETE. It is
                  # here to keep preview and apply seeing the same desired state.
                  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
              run: |
                  # +e so a failing preview does not abort before we capture its
                  # exit code. --color=no --curses=no stops Bazel ANSI/cursor noise;
                  # pulumi-summary.sh strips any residual pulumi color itself.
                  set +e -u -o pipefail
                  bazel run --color=no --curses=no \
                      //infrastructure/pulumi/platform/repo_config:preview -- --stack dev --diff \
                      2>&1 | tee /tmp/preview-raw.txt
                  ec="${PIPESTATUS[0]}"
                  echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
                  exit "${ec}"

            # Structured digest (creates/updates/replaces/deletes, destructive
            # flagged) → step summary + the same sticky comment, replacing the
            # prior raw-dump. pulumi-summary.sh cleans ANSI and parses only the
            # last `Resources:` section, so it takes the raw combined bazel log
            # directly (no pre-clean/section-extraction needed here).
            - name: Pulumi digest → summary + sticky comment
              if: ${{ always() }}
              uses: ./.github/actions/pulumi-summary
              with:
                  label: repo_config
                  out-file: /tmp/preview-raw.txt
                  exit-code: ${{ steps.pulumi.outputs.exit_code }}
                  sticky-header: repo-config-preview
