name: Copybara Export (reusable)

# Reusable EXPORT: monorepo/<component>/ -> standalone/<component> (root).
# Called by thin per-component `copybara-export-<component>.yaml` workflows,
# which own the `push` path trigger + the concurrency group. Logic lives here,
# once, for all components.
#
# Auth: monorepo origin over HTTPS via GITHUB_TOKEN; standalone destination
# over SSH via the component's write deploy key (sync_ssh_key).
# Add per-component callers via the runbook (docs/copybara-bidi-sync.md).
on:
    workflow_call:
        inputs:
            component:
                description: "Component / standalone repo name (e.g. my-lib). Maps to the export_<component> Copybara workflow."
                required: true
                type: string
            standalone_only:
                description: "Space-separated repo-relative paths that exist ONLY in the standalone (the conflict pre-check excludes them)."
                required: false
                type: string
                default: ""
            copybara_options:
                description: "Copybara CLI options. Use '--force --ignore-noop' ONCE to seed the MONOREPO_REV_ID baseline; normal runs use --ignore-noop."
                required: false
                type: string
                default: "--ignore-noop"
        secrets:
            sync_ssh_key:
                description: "Private half of the standalone repo's write deploy key."
                required: true

permissions:
    contents: read

jobs:
    export:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # full history so the conflict pre-check can reach the rev-id baseline

            - name: Install Bazel
              uses: ./.github/actions/setup-bazel

            - name: Set up Copybara auth (SSH deploy key + HTTPS token)
              env:
                  SSH_KEY: ${{ secrets.sync_ssh_key }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p ~/.ssh
                  # OpenSSH requires exactly one trailing newline; normalize it.
                  printf '%s\n' "${SSH_KEY%$'\n'}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -t rsa,ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
                  printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > ~/.git-credentials
                  chmod 600 ~/.git-credentials
                  printf '[credential]\n\thelper = store\n[user]\n\tname = Copybara Sync\n\temail = sync@github.com\n' > ~/.gitconfig

            - name: Conflict pre-check (refuse to overwrite a concurrent edit)
              env:
                  CB_OPTS: ${{ inputs.copybara_options }}
                  COMPONENT: ${{ inputs.component }}
                  STANDALONE_ONLY: ${{ inputs.standalone_only }}
              run: |
                  # --force is a deliberate override (e.g. baseline seeding) — skip the guard.
                  case "$CB_OPTS" in *--force*) echo "skipping conflict pre-check (--force override)"; exit 0 ;; esac
                  GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_rsa -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                    git clone --no-tags "git@github.com:${{ github.repository_owner }}/${COMPONENT}.git" \
                    "$RUNNER_TEMP/${COMPONENT}-peer"
                  # STANDALONE_ONLY is intentionally unquoted: it word-splits into separate pathspec args.
                  bazel run //tools/copybara/conflict_precheck -- \
                    export "$COMPONENT" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/${COMPONENT}-peer" \
                    $STANDALONE_ONLY

            - name: Copybara export (monorepo/<component>/ -> standalone)
              env:
                  CB_OPTS: ${{ inputs.copybara_options }}
                  COMPONENT: ${{ inputs.component }}
              run: |
                  bazel run //tools/copybara/sync -- \
                    export "$COMPONENT" --options "$CB_OPTS"
