name: Copybara Export (reusable)

# Reusable EXPORT: monorepo/<component>/ -> standalone/<component> (root).
# Called by thin per-component `copybara-export-<component>.yaml` workflows,
# which own the `push` path trigger + the concurrency group. Logic lives here,
# once, for all components.
#
# Auth: monorepo origin over HTTPS via GITHUB_TOKEN; standalone destination
# over SSH via the component's write deploy key (sync_ssh_key).
# Add per-component callers via the runbook (docs/admin/copybara-sync.md).
on:
    workflow_call:
        inputs:
            component:
                description: "Component / standalone repo name (e.g. my-lib). Maps to the export_<component> Copybara workflow."
                required: true
                type: string
            standalone-only:
                description: "Space-separated repo-relative paths that exist ONLY in the standalone (the conflict pre-check excludes them)."
                required: false
                type: string
                default: ""
            standalone_only:
                description: "Space-separated repo-relative paths that exist ONLY in the standalone (the conflict pre-check excludes them)."
                required: false
                type: string
                default: ""
            copybara-options:
                description: "Copybara CLI options. Use '--force --ignore-noop' ONCE to seed the MONOREPO_REV_ID baseline; normal runs use --ignore-noop."
                required: false
                type: string
                default: "--ignore-noop"
            copybara_options:
                description: "Copybara CLI options. Use '--force --ignore-noop' ONCE to seed the MONOREPO_REV_ID baseline; normal runs use --ignore-noop."
                required: false
                type: string
                default: "--ignore-noop"
        secrets:
            sync_ssh_key:
                description: "Private half of the standalone repo's write deploy key."
                required: true

permissions:
    contents: read
    actions: read # list Repo Config Apply runs (await-repo-config)

jobs:
    # Repo Config Apply owns every mirror's deploy key and the matching
    # <COMP>_SYNC_SSH_KEY secret, and can rotate both (a mirror rename does, by
    # design: see the comment on <repo>-sync-key in
    # infrastructure/pulumi/platform/repo-config/internal/copybara_sync/sync.go).
    # A job gets its secrets when it starts. On 2026-11-13 (push b37b85a6, #4661)
    # the devx, homelab and mcp-slack exports started alongside the apply, took
    # the old key, and were refused at the push step ("Permission denied
    # (publickey)") after the apply had replaced it. So the export job does not
    # start until no apply is in flight: it then reads the key that is current.
    # Guarded by //tools/conformance:check (copybara group).
    await-repo-config:
        runs-on: ubuntu-26.04
        timeout-minutes: 50 # the apply's own limit is 45
        steps:
            - name: Wait for any Repo Config Apply in flight
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  BEFORE: ${{ github.event.before }}
                  APPLY_WORKFLOW: _repo-config-apply.yaml
                  APPLY_PATH: infrastructure/pulumi/platform/repo-config/
              run: |
                  set -euo pipefail
                  runs="repos/${REPO}/actions/workflows/${APPLY_WORKFLOW}/runs"

                  # 1. If this push changed repo-config, its apply run must
                  #    exist before "nothing in flight" means anything. GitHub
                  #    creates a push's runs together, but give it two minutes.
                  changed=false
                  if [ -n "${BEFORE}" ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ]; then
                      files="$(gh api "repos/${REPO}/compare/${BEFORE}...${SHA}" --jq '.files[].filename')"
                      # The compare API lists at most 300 files: assume a touch past that.
                      if grep -q "^${APPLY_PATH}" <<<"${files}" || [ "$(wc -l <<<"${files}")" -ge 300 ]; then
                          changed=true
                      fi
                  fi
                  if [ "${changed}" = true ]; then
                      for _ in $(seq 1 24); do
                          n="$(gh api "${runs}?head_sha=${SHA}" --jq '.total_count')"
                          [ "${n}" -gt 0 ] && break
                          sleep 5
                      done
                      if [ "${n}" -eq 0 ]; then
                          echo "::warning::this push changed ${APPLY_PATH} but no ${APPLY_WORKFLOW} run appeared for ${SHA}; exporting with the current key"
                      fi
                  fi

                  # 2. Wait until no apply is queued or running, on any commit:
                  #    an earlier push's apply can rotate a key just as well.
                  while :; do
                      busy="$(gh api "${runs}?per_page=30" \
                          --jq '[.workflow_runs[] | select(.status != "completed")] | map("\(.html_url) (\(.status))") | join(" ")')"
                      [ -z "${busy}" ] && break
                      echo "waiting for: ${busy}"
                      sleep 15
                  done

                  # Said, not enforced: if this push's apply failed, the key may
                  # or may not have moved, and the push step is the real test.
                  c="$(gh api "${runs}?head_sha=${SHA}" --jq '.workflow_runs[0].conclusion // "none"')"
                  case "${c}" in
                      success | skipped | none) echo "repo-config apply for ${SHA}: ${c}" ;;
                      *) echo "::warning::repo-config apply for ${SHA} ended '${c}'; a rotated mirror key may not match" ;;
                  esac

    export:
        needs: await-repo-config
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0 # full history so the conflict pre-check can reach the rev-id baseline

            - name: Install Bazel
              uses: ./.github/actions/setup-bazel

            - name: Set up Copybara auth (SSH deploy key + HTTPS token)
              env:
                  SSH_KEY: ${{ secrets.sync_ssh_key }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p ~/.ssh
                  # OpenSSH requires exactly one trailing newline; normalize it.
                  printf '%s\n' "${SSH_KEY%$'\n'}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -t rsa,ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
                  printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > ~/.git-credentials
                  chmod 600 ~/.git-credentials
                  printf '[credential]\n\thelper = store\n[user]\n\tname = Copybara Sync\n\temail = sync@github.com\n' > ~/.gitconfig

            - name: Conflict pre-check (refuse to overwrite a concurrent edit)
              env:
                  CB_OPTS: ${{ inputs['copybara-options'] || inputs.copybara_options }}
                  COMPONENT: ${{ inputs.component }}
                  STANDALONE_ONLY: ${{ inputs['standalone-only'] || inputs.standalone_only }}
              run: |
                  # --force is a deliberate override (e.g. baseline seeding) — skip the guard.
                  case "$CB_OPTS" in *--force*) echo "skipping conflict pre-check (--force override)"; exit 0 ;; esac
                  GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_rsa -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                    git clone --no-tags "git@github.com:${{ github.repository_owner }}/${COMPONENT}.git" \
                    "$RUNNER_TEMP/${COMPONENT}-peer"
                  # STANDALONE_ONLY is intentionally unquoted: it word-splits into separate pathspec args.
                  # shellcheck disable=SC2086
                  bazel run //tools/copybara/conflict-precheck -- \
                    export "$COMPONENT" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/${COMPONENT}-peer" \
                    $STANDALONE_ONLY

            - name: Copybara export (monorepo/<component>/ -> standalone)
              env:
                  CB_OPTS: ${{ inputs['copybara-options'] || inputs.copybara_options }}
                  COMPONENT: ${{ inputs.component }}
              run: |
                  bazel run //tools/copybara/sync -- \
                    export "$COMPONENT" --options "$CB_OPTS"
