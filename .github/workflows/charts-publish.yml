name: charts-publish

# Packages co-located Helm charts (**/deploy/chart) and pushes them as OCI
# artifacts to GHCR (oci://ghcr.io/vitruviansoftware/charts/<name>). Versions
# are driven by each Chart.yaml `version`. Charts are intended to be public so
# ArgoCD can pull them without a credential.
#
# Scoped per chart (#498): a push publishes ONLY the charts whose directory
# changed in that push (fail-open to ALL when the diff base is untrustworthy);
# workflow_dispatch always publishes everything. Re-pushing an unchanged chart
# version is a harmless overwrite, so fail-open is safe -- the scoping exists
# so N apps' charts don't all republish on every one-chart change.
on:
  # DISPATCH-ONLY SHELL, pending deletion in PHASE 3 (delivery-orchestrator
  # spec §6, docs/superpowers/specs/2026-08-19-delivery-orchestrator-design.md).
  #
  # The `push:` trigger was deleted by PHASE 2 (Wave B2): the generated
  # .github/workflows/delivery.yaml now owns this unit's push lane as
  # ``charts-publish``, running the SAME tools/charts/publish.sh this file now runs — asserted mechanically
  # against THIS file by //tools/delivery/gen's parity tests. Leaving `push:`
  # here as well would have BOTH workflows do the same work on every merge, racing two publishes onto one OCI repo.
  #
  # CONSEQUENCE, intentional: every `github.event_name == 'push'` arm below is
  # now DEAD CODE. It is left untouched so that reverting Phase 2 is restoring
  # one trigger rather than reconstructing a lane; Phase 3 deletes the file.
  #
  # `workflow_dispatch` survives as the break-glass escape hatch; the generated
  # workflow has an equivalent (unit + environment inputs), which is what makes
  # that deletion possible.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# Serialize publishes: two rapid merges (or a dispatch racing a push) must not
# race the OCI push to ghcr.io/vitruviansoftware/charts. Non-cancelling so an
# in-flight package/push completes before the next runs (issue #461).
concurrency:
  group: charts-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The per-chart scoping below diffs against the pre-push tip.
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package and push charts
        env:
          BEFORE_REV: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
        # EXTRACTED (delivery-orchestrator Phase 2, Wave B2): the 45 inline
        # lines that used to live here are now tools/charts/publish.sh, run by
        # BOTH this workflow and the generated delivery.yaml -- one copy, so
        # the two cannot drift -- and wrapped by //tools/charts:publish, the
        # break-glass target the delivery() declaration names.
        run: bash tools/charts/publish.sh
      - name: Visibility note
        run: |
          echo "New GHCR packages start private. Make each chart public once (UI or):"
          echo "  gh api -X PATCH /orgs/vitruviansoftware/packages/container/charts%2F<name> -f visibility=public"
