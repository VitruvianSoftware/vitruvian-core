name: charts-publish

# Packages every co-located Helm chart (**/deploy/chart) and pushes it as an OCI
# artifact to GHCR (oci://ghcr.io/vitruviansoftware/charts/<name>). Versions are
# driven by each Chart.yaml `version`. Charts are intended to be public so ArgoCD
# can pull them without a credential.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '**/deploy/chart/**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package and push charts
        run: |
          set -euo pipefail
          ORG=vitruviansoftware
          mkdir -p /tmp/charts
          found=0
          while IFS= read -r chart; do
            dir="$(dirname "$chart")"
            name="$(awk -F': ' '/^name:/{print $2; exit}' "$chart")"
            echo "::group::Packaging ${name} from ${dir}"
            helm package "$dir" -d /tmp/charts
            helm push /tmp/charts/"${name}"-*.tgz "oci://ghcr.io/${ORG}/charts"
            echo "::endgroup::"
            found=1
          done < <(find . -path '*/deploy/chart/Chart.yaml' -not -path './bazel-*/*')
          [ "$found" = 1 ] || echo "No charts found under **/deploy/chart"
      - name: Visibility note
        run: |
          echo "New GHCR packages start private. Make each chart public once (UI or):"
          echo "  gh api -X PATCH /orgs/vitruviansoftware/packages/container/charts%2F<name> -f visibility=public"
