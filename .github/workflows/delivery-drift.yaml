# Delivery drift detector (#1842).
#
# A silently-skipped delivery and a correct skip look IDENTICAL in the runs
# list: both green, both affected=false. Nothing ever goes red, and the durable
# base makes the omission permanent. This job is the standing check that makes
# that failure mode FALSIFIABLE -- it asks, per unit, "is what you last shipped
# still current with main?" and fails if the answer is no.
#
# It is deliberately NOT a required check on any PR: it describes the fleet's
# convergence, not a change's correctness, and gating merges on it would make
# an unrelated stalled deploy block everyone.
#
# THE VERDICT IS A CHECK RUN, not this job's colour. A job can only pass or
# fail, and a run that skipped every unit (no app's workflow had a finished
# run to judge against) would pass just like one that found everything
# delivered. So the job publishes "delivery-drift verdict" on the commit it
# checked:
#   success  units were checked and none is behind (skipped ones are named);
#   neutral  NOTHING was checked -- not a pass; the summary says why;
#   failure  drift or UNKNOWN, or the check never reached a verdict.
# In the runs list a neutral run still shows green (Actions has no neutral run),
# with a "nothing checked" notice on the run page; the check run is the record.
name: delivery-drift

on:
  schedule:
    # Hourly, offset off the hour so it does not pile onto the :00 cron burst.
    - cron: "37 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  # The detector reads each run's successful jobs through GraphQL, where a
  # workflow job is a check run: without this the query is refused and every
  # unit reports UNKNOWN (red, never a silent green).
  # write: the job publishes its verdict as the "delivery-drift verdict" check
  # run (write includes the read above).
  checks: write
  contents: read

# One drift poll at a time; a slow run must not stack with the next tick.
concurrency:
  group: delivery-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-26.04
    # Nothing waits: each unit is judged at its app's newest finished delivery
    # run. A full check of all 12 units took 2m46s plus about 1 minute of
    # setup (run 38623200337); 15 leaves room for a slow API or cold cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The detector resolves each unit's last-delivered commit and diffs it
          # against HEAD; a shallow clone would leave those commits unresolvable
          # and every unit would report UNKNOWN.
          fetch-depth: 0

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Check every delivery unit against main
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        # set +e: a non-zero exit is the SIGNAL here, not a runner failure.
        run: |
          set +e -u -o pipefail
          DRIFT_RESULT_FILE="$GITHUB_OUTPUT" DRIFT_SUMMARY_FILE="$RUNNER_TEMP/drift-summary.md" \
            bazel run //tools/ci:delivery_drift | tee "$RUNNER_TEMP/drift.out"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Always, so a crash or a failed setup still leaves a verdict (failure),
      # never a commit with no record of this check.
      - name: Publish the verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          CONCLUSION: ${{ steps.drift.outputs.conclusion }}
          TITLE: ${{ steps.drift.outputs.title }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/drift-summary.md"
          if [ -z "$CONCLUSION" ]; then
            CONCLUSION=failure
            TITLE="No verdict: the check did not finish"
            echo "The drift step ended without a verdict (setup failed, or it crashed). See the job log." >"$summary"
          fi
          cat "$summary" >>"$GITHUB_STEP_SUMMARY"
          if [ "$CONCLUSION" = neutral ]; then
            echo "::notice title=delivery-drift: nothing checked::${TITLE}. This is not a pass; see the run summary."
          fi
          gh api "repos/${REPO}/check-runs" \
            -f name="delivery-drift verdict" -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion="$CONCLUSION" \
            -f "output[title]=${TITLE}" -F "output[summary]=@${summary}" \
            --jq '"published: \(.name) = \(.conclusion) \(.html_url)"'

      - name: Report
        if: steps.drift.outputs.rc != '0'
        run: |
          {
            echo "### Delivery drift detected"
            echo ""
            echo "One or more delivery units have not shipped work that is on \`main\`."
            echo "See this job's log for the per-unit verdicts and the reason each was judged affected."
            echo ""
            echo "This is the check for the failure mode described in #1842: a skipped delivery is invisible in the runs list."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
