# Regression guard for tools/ci/foundation-app-digest-guard.sh -- the
# fail-closed check that refuses to deploy an enabled workload with no image
# digest. Hermetic: tests the pure missing_digest_apps() function directly, no
# GITHUB_ENV, no real Pulumi.production.yaml.

name: Foundation App Digest Guard Test

on:
  pull_request:
    paths:
      - "tools/ci/foundation-app-digest-guard.sh"
      - "tools/ci/foundation-app-digest-guard_test.sh"
      - ".github/workflows/foundation-app-digest-guard-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/foundation-app-digest-guard.sh"
      - "tools/ci/foundation-app-digest-guard_test.sh"
      - ".github/workflows/foundation-app-digest-guard-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the foundation-app-digest-guard script tests
        run: bash tools/ci/foundation-app-digest-guard_test.sh
