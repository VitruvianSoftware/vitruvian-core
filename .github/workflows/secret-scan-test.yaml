# Regression guard for tools/ci/secret-scan.sh — the sibling-test convention
# every other script in tools/ci/ already follows (changelog-summary,
# pulumi-summary, relevant-paths, deploy-affected, resolve-deploy-base,
# ensure-site-verification, tabula-deploy-preflight); secret-scan.sh was the
# only one without.
#
# What the test pins is the gate's HONESTY, not gitleaks' detection. The
# secret-scan required check reports a verdict that gets quoted as evidence, and
# both of its known defects produced a confident wrong sentence rather than an
# error: an exec failure printed as "gitleaks found a candidate secret" (rc 126/
# 127 — the default path on any non-Linux host, since the pinned tarball is
# linux_x64), and a USE_SYSTEM_GITLEAKS=1 run printing this gate's clean verdict
# from an unpinned binary with different rules. gitleaks is stubbed, so the
# suite needs no network and no platform-specific binary.
#
# NB: this is deliberately NOT a required merge-queue check. It is path-filtered,
# and a path-filtered required check never reports on a PR outside its paths,
# which wedges that PR's mergeability (guarded by //tools/conformance:check).

name: Secret Scan Test

on:
  pull_request:
    paths:
      - "tools/ci/secret-scan.sh"
      - "tools/ci/secret-scan_test.sh"
      - ".github/workflows/secret-scan-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/secret-scan.sh"
      - "tools/ci/secret-scan_test.sh"
      - ".github/workflows/secret-scan-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the secret-scan gate tests
        run: bash tools/ci/secret-scan_test.sh
