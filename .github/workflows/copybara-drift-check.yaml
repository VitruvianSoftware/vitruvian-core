name: Copybara Drift Check

# FAIL-LOUD divergence detector for the bidirectional sync, across ALL components.
#
# The sync itself does NOT fail loud on a true conflict: if the same content is
# edited on both repos within one sync cycle, each direction overwrites the other
# and the repos silently DIVERGE (see docs/copybara-bidi-sync.md §7). This job
# closes that gap: for each component it compares vitruvian-core/<component>/
# against the standalone repo root (applying the same context-file excludes) and
# goes RED if they differ — turning silent divergence into a visible failure.
#
# A component is only checked once it has been SEEDED (its standalone history
# carries the MONOREPO_REV_ID label); un-seeded components are skipped, not failed.
#
# Runs: right after each sync (workflow_run), on a schedule (backstop), on demand.
on:
    workflow_run:
        workflows:
            - "Copybara Export (mcp-slack)"
            - "Copybara Export (devx)"
            - "Copybara Export (homelab)"
            - "Copybara Export (nexus-agent)"
            - "Copybara Import (mcp-slack)"
            - "Copybara Import (devx)"
            - "Copybara Import (homelab)"
            - "Copybara Import (nexus-agent)"
        types: [completed]
    schedule:
        - cron: "*/30 * * * *"
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: copybara-drift-check
    cancel-in-progress: true

jobs:
    drift-check:
        runs-on: ubuntu-latest
        # All component deploy keys are exposed; each iteration selects its own via
        # bash indirect expansion (GitHub expressions can't index secrets by a var).
        env:
            MCP_SLACK_SYNC_SSH_KEY: ${{ secrets.MCP_SLACK_SYNC_SSH_KEY }}
            DEVX_SYNC_SSH_KEY: ${{ secrets.DEVX_SYNC_SSH_KEY }}
            HOMELAB_SYNC_SSH_KEY: ${{ secrets.HOMELAB_SYNC_SSH_KEY }}
            NEXUS_AGENT_SYNC_SSH_KEY: ${{ secrets.NEXUS_AGENT_SYNC_SSH_KEY }}
        steps:
            - uses: actions/checkout@v6
            - name: Compare every seeded component subtree against its standalone (fail on drift)
              run: |
                set -uo pipefail
                mkdir -p ~/.ssh
                ssh-keyscan -t rsa,ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null

                # Component subtree (monorepo) vs standalone repo root. Exclude the
                # context-specific files that intentionally never cross the boundary
                # (must match copy.bara.sky's origin/destination excludes):
                #   BUILD / BUILD.bazel     : monorepo-only (Bazel/gazelle)
                #   package-lock.json       : standalone-only (npm; monorepo uses root pnpm)
                #   sync-to-monorepo.yaml   : standalone-only (the dispatch workflow)
                components="mcp-slack devx homelab nexus-agent"
                drift=0
                checked=0
                for comp in $components; do
                  prefix="$(printf '%s' "$comp" | tr 'a-z-' 'A-Z_')"
                  var="${prefix}_SYNC_SSH_KEY"
                  key="${!var:-}"
                  if [ -z "$key" ]; then echo "::warning::[$comp] no deploy key configured — skipping"; continue; fi
                  printf '%s\n' "${key%$'\n'}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  peer="$RUNNER_TEMP/$comp-standalone"
                  rm -rf "$peer"
                  if ! GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_rsa -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                        git clone --no-tags "git@github.com:VitruvianSoftware/$comp.git" "$peer" 2>/dev/null; then
                    echo "::warning::[$comp] standalone clone failed — skipping"; continue
                  fi
                  # Only assert sync for SEEDED components (standalone history carries
                  # the export label); otherwise this is a not-yet-onboarded repo.
                  if [ -z "$(git -C "$peer" log --grep='MONOREPO_REV_ID' -1 --format=%H 2>/dev/null)" ]; then
                    echo "ℹ️  [$comp] not yet seeded (no MONOREPO_REV_ID in standalone history) — skipping"
                    continue
                  fi
                  checked=$((checked+1))
                  OUT="$(diff -r \
                    -x '.git' -x 'BUILD' -x 'BUILD.bazel' -x 'package-lock.json' -x 'sync-to-monorepo.yaml' \
                    "$GITHUB_WORKSPACE/$comp" "$peer" 2>&1)" && rc=0 || rc=$?
                  if [ "$rc" -eq 0 ]; then
                    echo "✅ [$comp] in sync — vitruvian-core/$comp/ matches the standalone."
                  else
                    echo "::error title=Copybara sync drift ($comp)::vitruvian-core/$comp and VitruvianSoftware/$comp have DIVERGED. Likely a concurrent conflicting edit (see docs/copybara-bidi-sync.md §7). Reconcile by hand."
                    echo "----- [$comp] divergence (< monorepo  > standalone) -----"
                    echo "$OUT"
                    drift=1
                  fi
                done
                echo "Checked $checked seeded component(s)."
                if [ "$drift" -ne 0 ]; then exit 1; fi
                echo "✅ All seeded components in sync."
