name: Await Repo Config Apply (reusable)

# Holds a mirror export until no Repo Config Apply run is queued or in flight.
#
# Repo Config Apply owns every mirror's deploy key and the matching
# <COMP>_SYNC_SSH_KEY secret, and can replace both (a mirror rename always
# does: see <repo>-sync-key in
# infrastructure/pulumi/platform/repo-config/internal/copybara_sync/sync.go).
# On 2026-11-13 (push b37b85a6, #4661) the devx, homelab and mcp-slack exports
# ran alongside the apply, held the old key, and were refused at the push step
# ("Permission denied (publickey)") once the apply had replaced it.
#
# Each copybara-export-*.yaml caller runs this as its own job and gives the job
# that maps <COMP>_SYNC_SSH_KEY `needs: await-repo-config`. The wait has to sit
# in the CALLER: a called job's `with:`/`secrets:` are evaluated when that job
# starts (they may read needs.*.outputs), so the key mapping is read only after
# this has finished. A wait inside _copybara-export.yaml would come too late
# if the caller's mapping were evaluated at run start.
# Guarded by //tools/conformance:check (copybara group).
on:
    workflow_call:
        outputs:
            restarted:
                description: "true when this run handed the export to a fresh run (step 3); the caller then skips its export job"
                value: ${{ jobs.wait.outputs.restarted }}

permissions:
    contents: read
    actions: write # list Repo Config Apply runs; start a fresh export run (step 3)

jobs:
    wait:
        runs-on: ubuntu-26.04
        timeout-minutes: 50 # the apply's own limit is 45
        outputs:
            restarted: ${{ steps.restart.outputs.restarted }}
        steps:
            - name: Wait for any Repo Config Apply in flight
              id: wait
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  # Empty on workflow_dispatch: the script then compares the
                  # head commit with its parent instead.
                  BEFORE: ${{ github.event.before }}
                  APPLY_WORKFLOW: _repo-config-apply.yaml
                  # Must match the apply's push path filter (conformance-checked).
                  APPLY_PATH: infrastructure/pulumi/platform/repo-config/
              run: |
                  set -euo pipefail
                  runs="repos/${REPO}/actions/workflows/${APPLY_WORKFLOW}/runs"

                  # A transient API error must not end the job: retry, then fail.
                  api() {
                      local i
                      for i in 1 2 3 4 5; do
                          if gh api "$@"; then return 0; fi
                          echo "gh api $1 failed (attempt ${i}); retrying" >&2
                          sleep 10
                      done
                      return 1
                  }

                  # 1. If this push changed repo-config, its apply run must
                  #    exist before "nothing in flight" means anything. GitHub
                  #    creates a push's runs together, but allow two minutes.
                  # A manual run (workflow_dispatch) has no "before": compare
                  # the head commit with its parent, so a run started right
                  # after a repo-config merge still waits for that apply to
                  # appear. A run of several commits at once is still covered
                  # by step 2 once its apply exists.
                  if [ -z "${BEFORE}" ]; then
                      BEFORE="$(api "repos/${REPO}/commits/${SHA}" --jq '.parents[0].sha // ""')"
                  fi
                  changed=false
                  if [ -n "${BEFORE}" ] && [ "${BEFORE}" != 0000000000000000000000000000000000000000 ]; then
                      files="$(api "repos/${REPO}/compare/${BEFORE}...${SHA}" --jq '.files[].filename')"
                      # The compare API lists at most 300 files: assume a touch past that.
                      if grep -q "^${APPLY_PATH}" <<<"${files}" || [ "$(wc -l <<<"${files}")" -ge 300 ]; then
                          changed=true
                      fi
                  fi
                  echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
                  if [ "${changed}" = true ]; then
                      n=0
                      for _ in $(seq 1 24); do
                          n="$(api "${runs}?head_sha=${SHA}" --jq '.total_count')"
                          [ "${n}" -gt 0 ] && break
                          sleep 5
                      done
                      if [ "${n}" -eq 0 ]; then
                          echo "::warning::this push changed ${APPLY_PATH} but no ${APPLY_WORKFLOW} run appeared for ${SHA}; exporting with the current key"
                      fi
                  fi

                  # 2. Wait until no apply is unfinished, on any commit (an
                  #    earlier push's apply can replace a key just as well).
                  #    Asked per status, so a busy run is never pushed off a page.
                  while :; do
                      busy=""
                      for s in requested queued pending waiting in_progress; do
                          b="$(api "${runs}?status=${s}&per_page=10" --jq '.workflow_runs[] | "\(.html_url) (\(.status))"')"
                          busy="${busy}${b:+${b} }"
                      done
                      [ -z "${busy}" ] && break
                      echo "waiting for: ${busy}"
                      sleep 15
                  done

                  # 2b. The list above can miss a run GitHub created seconds ago:
                  #     on 2026-11-20 (vitruvian-party rename) it came back empty
                  #     6 s after this push's apply started, so the export was
                  #     restarted before the apply wrote the new key, and the
                  #     fresh run was refused with the old one. So when this push
                  #     changed repo-config, also wait on that apply run itself,
                  #     by its own status, until it has completed.
                  if [ "${changed}" = true ]; then
                      while :; do
                          st="$(api "${runs}?head_sha=${SHA}" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
                          [ "${st}" = 0 ] && break
                          echo "waiting for this push's ${APPLY_WORKFLOW} run to complete"
                          sleep 15
                      done
                  fi

                  # Said, not enforced: if this push's apply failed, the key may
                  # or may not have moved, and the push step is the real test.
                  c="$(api "${runs}?head_sha=${SHA}" --jq '.workflow_runs[0].conclusion // "none"')"
                  case "${c}" in
                      success | skipped | none) echo "repo-config apply for ${SHA}: ${c}" ;;
                      *) echo "::warning::repo-config apply for ${SHA} ended '${c}'; a replaced mirror key may not match" ;;
                  esac

            # 3. A run cannot see a secret created after the run itself was:
            #    it takes its secrets when it is created. mini-party's first
            #    export (2026-11-19) and wand's (2026-11-18) both got an EMPTY
            #    key, though their export jobs started 6 and 24 min after the
            #    apply wrote it; wand's re-run, a new attempt, got it. So when
            #    this push changed repo-config (a mirror key may be new or
            #    replaced), start a fresh run of this export now that the apply
            #    is done, and let the caller skip its export job here. Only on
            #    push: the fresh run is a workflow_dispatch, so it cannot loop.
            - name: Restart the export if this push changed repo-config
              id: restart
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  EVENT: ${{ github.event_name }}
                  CHANGED: ${{ steps.wait.outputs.changed }}
                  # In a called workflow the github context is the caller's:
                  # owner/repo/.github/workflows/<file>@<ref>.
                  WORKFLOW_REF: ${{ github.workflow_ref }}
              run: |
                  set -euo pipefail
                  if [ "${EVENT}" != push ] || [ "${CHANGED}" != true ]; then
                      echo "restarted=false" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi
                  file="${WORKFLOW_REF#*/.github/workflows/}"
                  file="${file%@*}"
                  # --force: an export after a copy.bara.sky change must not
                  # no-op (see the callers' push default).
                  gh workflow run "${file}" --repo "${REPO}" --ref main \
                      -f copybara-options='--force --ignore-noop'
                  echo "started a fresh ${file} run on main, created after the apply, so it can read a new or replaced mirror key"
                  echo "restarted=true" >> "${GITHUB_OUTPUT}"
