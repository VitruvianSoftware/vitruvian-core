# Regression guard for tools/ci/go-test-infra.sh — the sibling-test convention
# the rest of tools/ci/ follows (changelog-summary, pulumi-summary,
# relevant-paths, deploy-affected, resolve-deploy-base, ensure-site-verification,
# tabula-deploy-preflight, secret-scan).
#
# What it pins is that the `go-test-infra` REQUIRED check cannot report a
# verdict it did not earn. That script runs 30 modules through a concurrent
# pool, and the expensive failure for that shape is not a crash but a green
# check over red tests: a pool that collects a child's output while dropping its
# exit status looks exactly like a passing run. `go` is stubbed, so the suite
# needs no toolchain, no network, and no multi-GB module cache.
#
# NB: this is deliberately NOT a required merge-queue check. It is path-filtered,
# and a path-filtered required check never reports on a PR outside its paths,
# which wedges that PR's mergeability (guarded by //tools/conformance:check).

name: Go Test Infra Test

on:
  pull_request:
    paths:
      - "tools/ci/go-test-infra.sh"
      - "tools/ci/go-test-infra_test.sh"
      - ".github/workflows/go-test-infra-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/go-test-infra.sh"
      - "tools/ci/go-test-infra_test.sh"
      - ".github/workflows/go-test-infra-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the go-test-infra runner tests
        run: bash tools/ci/go-test-infra_test.sh
