# Regression guard for tools/ci/require-dev-soak.sh — the dev→nonprod promotion
# interlock. Hermetic: a fake `gh` binary, no network, no credentials.
#
# Pins the asymmetric failure policy this gate depends on: it must FAIL CLOSED
# on a definitive red development deploy (that is the whole point) while
# FAILING OPEN on an indeterminate answer, and must treat `skipped` as a pass
# so a docs- or CLI-only change — which the graph gate legitimately skips —
# cannot wedge that component's releases permanently.

name: Require Dev Soak Test

on:
  pull_request:
    paths:
      - "tools/ci/require-dev-soak.sh"
      - "tools/ci/require-dev-soak_test.sh"
      - ".github/workflows/require-dev-soak-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/ci/require-dev-soak.sh"
      - "tools/ci/require-dev-soak_test.sh"
      - ".github/workflows/require-dev-soak-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run the require-dev-soak script tests
        run: bash tools/ci/require-dev-soak_test.sh
