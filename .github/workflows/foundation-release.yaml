name: Foundation Release & Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/pulumi/foundation/**"
      - "infrastructure/pulumi/pkg/**"
      - ".github/workflows/foundation-release.yaml"

permissions:
  contents: write
  pull-requests: write
  id-token: write

# ──────────────────────────────────────────────────────────────────────────────
# Each foundation phase has its own release-please config, manifest, release
# PR, and deploy job. There is NO shared state between phases — merging one
# release PR never conflicts with another.
#
# Release PRs auto-merge on green CI (release-pr-automerge.yaml enables auto-merge
# on each `release-please--*` PR via the bypass App), so the operator no longer
# controls deploy order by merge timing. Deploy ORDER is instead controlled where
# it is enforceable: development deploys automatically, while nonproduction and
# production each gate on their GitHub Environment approval — the operator
# approves those in the desired sequence. For a coordinated CROSS-PHASE change
# (e.g. gcp-org must export an output before gcp-networks consumes it), land the
# producing phase's code on main first so its release + dev deploy run ahead of
# the consumer's; prod ordering is held by the environment approvals.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Release Please ─────────────────────────────────────────────────────────
  # Independent release-please invocations, one per phase. Each uses its
  # own config + manifest file living inside the phase directory.
  #
  # DELIBERATE: release-please tracks each STAGE ROOT (e.g. .../gcp-networks),
  # not the per-leaf Pulumi projects under it. All stage logic lives in the
  # shared modules/ package; a per-leaf package split would fail to attribute
  # modules/-only commits to any package and silently stop cutting releases
  # (and therefore deploys) for the very changes that affect every leaf. One
  # stage release fans out to all of that stage's leaf deploys via the chains.
  #
  # 🤖 AI AGENT WARNING: DO NOT ADD CROSS-PHASE DEPENDENCIES TO THESE JOBS!
  # All `release-*` jobs MUST run in parallel and independently. Do NOT add `needs:`
  # pointing to a previous phase's deploy job. Wiring `release-gcp-networks` to
  # `deploy-env-production` will break the pipeline by skipping deployments when
  # only a single phase is releasing.
  # Only the intra-phase `deploy-*` jobs should be chained sequentially.

  release-gcp-org:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-org--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-org/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-org/.release-please-manifest.json
          target-branch: main

  release-org-folders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/org-folders--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/org-folders/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/org-folders/.release-please-manifest.json
          target-branch: main

  release-gcp-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-bootstrap--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-bootstrap/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-bootstrap/.release-please-manifest.json
          target-branch: main

  # Surface each just-released component's changelog on the run page BEFORE the
  # gated deploy jobs, so an approver can read WHAT is shipping before approving
  # (the deploy digest -- pulumi-summary.sh -- only renders AFTER approval). This
  # job is ungated and runs as soon as the release jobs settle; the deploy jobs
  # do not depend on it, so it never delays a rollout. `always() && (any
  # released)` shows notes for whatever released even if a sibling release job
  # failed, and skips entirely on a non-release push.
  changelog:
    needs:
      - release-gcp-org
      - release-org-folders
      - release-gcp-bootstrap
      - release-gcp-environments
      - release-gcp-networks
      - release-gcp-projects
    if: >-
      always() && (
      needs.release-gcp-org.outputs.release_created == 'true' ||
      needs.release-org-folders.outputs.release_created == 'true' ||
      needs.release-gcp-bootstrap.outputs.release_created == 'true' ||
      needs.release-gcp-environments.outputs.release_created == 'true' ||
      needs.release-gcp-networks.outputs.release_created == 'true' ||
      needs.release-gcp-projects.outputs.release_created == 'true' )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Released changelogs → step summary
        env:
          R_ORG: ${{ needs.release-gcp-org.outputs.release_created }}
          R_FOLDERS: ${{ needs.release-org-folders.outputs.release_created }}
          R_BOOTSTRAP: ${{ needs.release-gcp-bootstrap.outputs.release_created }}
          R_ENVS: ${{ needs.release-gcp-environments.outputs.release_created }}
          R_NETS: ${{ needs.release-gcp-networks.outputs.release_created }}
          R_PROJS: ${{ needs.release-gcp-projects.outputs.release_created }}
        run: |
          cl() { bash tools/ci/changelog-summary.sh "infrastructure/pulumi/foundation/$1/CHANGELOG.md" "" "$1"; }
          if [ "$R_ORG" = "true" ]; then cl gcp-org; fi
          if [ "$R_FOLDERS" = "true" ]; then cl org-folders; fi
          if [ "$R_BOOTSTRAP" = "true" ]; then cl gcp-bootstrap; fi
          if [ "$R_ENVS" = "true" ]; then cl gcp-environments; fi
          if [ "$R_NETS" = "true" ]; then cl gcp-networks; fi
          if [ "$R_PROJS" = "true" ]; then cl gcp-projects; fi

  # ── Deploy jobs ────────────────────────────────────────────────────────────

  deploy-gcp-org:
    # Serialize deploys of this org stack; never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-deploy-gcp-org
      cancel-in-progress: false
    needs: release-gcp-org
    if: needs.release-gcp-org.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-org
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the deploy does not
      # hit the 60/hr/IP unauthenticated GitHub API rate limit that CI runners
      # routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this to
      # 5000/hr. The pulumiverse pulumi-resource-time plugin (gcp-bootstrap /
      # gcp-networks, for time.Sleep propagation gates) is the github://
      # dependency today. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (gcp-org / envs/shared / production)
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        # Upstream-leaf layout: 1-org's Pulumi project root is the envs/shared
        # leaf (stack ipv1337/foundation-org-shared/production); the stage logic
        # lives in the sibling modules/.
        working-directory: infrastructure/pulumi/foundation/gcp-org/envs/shared
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (production)"
          { pulumi stack select -c "production" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      - name: Pulumi digest → step summary
        if: always()
        env:
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "gcp-org" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"

  deploy-org-folders:
    # Serialize deploys of this org stack; never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-deploy-org-folders
      cancel-in-progress: false
    needs: release-org-folders
    if: needs.release-org-folders.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-org-folders
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the deploy does not
      # hit the 60/hr/IP unauthenticated GitHub API rate limit that CI runners
      # routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this to
      # 5000/hr. The pulumiverse pulumi-resource-time plugin (gcp-bootstrap /
      # gcp-networks, for time.Sleep propagation gates) is the github://
      # dependency today. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (org-folders / production)
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: infrastructure/pulumi/foundation/org-folders
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (production)"
          { pulumi stack select -c "production" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      - name: Pulumi digest → step summary
        if: always()
        env:
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "org-folders" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"

  deploy-gcp-bootstrap:
    # Serialize deploys of this org stack; never cancel an in-flight pulumi up.
    concurrency:
      group: foundation-deploy-gcp-bootstrap
      cancel-in-progress: false
    needs: release-gcp-bootstrap
    if: needs.release-gcp-bootstrap.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-bootstrap
    env:
      GOWORK: off
      # Authenticate Pulumi's github:// plugin downloads so the deploy does not
      # hit the 60/hr/IP unauthenticated GitHub API rate limit that CI runners
      # routinely exhaust (intermittent 403s); GITHUB_TOKEN raises this to
      # 5000/hr. The pulumiverse pulumi-resource-time plugin (gcp-bootstrap /
      # gcp-networks, for time.Sleep propagation gates) is the github://
      # dependency today. Same class of fix as #756.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (gcp-bootstrap / production)
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: infrastructure/pulumi/foundation/gcp-bootstrap
        run: |
          # GitHub runs steps with `bash -eo pipefail`; disable -e so the failing
          # pipeline does not abort here and we capture pulumi's real exit code.
          set +e -u -o pipefail
          echo "::group::pulumi up --diff (production)"
          { pulumi stack select -c "production" \
              && pulumi up --yes --diff --non-interactive; } \
            2>&1 | tee "${RUNNER_TEMP}/pulumi-out.txt"
          ec="${PIPESTATUS[0]}"
          echo "::endgroup::"
          echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"
          exit "${ec}"

      - name: Pulumi digest → step summary
        if: always()
        env:
          PULUMI_EXIT: ${{ steps.pulumi.outputs.exit_code }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/tools/ci/pulumi-summary.sh" \
            "gcp-bootstrap" \
            "${RUNNER_TEMP}/pulumi-out.txt" \
            "${PULUMI_EXIT:-1}" >> "${GITHUB_STEP_SUMMARY}"

  # ── Phase 2: Environments ────────────────────────────────────────────────
  # The environments stage uses a chained promotion workflow:
  #   development (auto) → nonproduction (manual approval) → production (manual approval)
  # Each environment is its own leaf Pulumi project (envs/<env>, upstream
  # 2-environments layout) with a single `production` stack and isolated state;
  # the reusable workflow maps the environment name onto the leaf dir.

  release-gcp-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-environments--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-environments/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-environments/.release-please-manifest.json
          target-branch: main

  deploy-env-development:
    needs: release-gcp-environments
    if: needs.release-gcp-environments.outputs.release_created == 'true'
    uses: ./.github/workflows/foundation-env-deploy.yaml
    with:
      environment: development
    secrets: inherit

  deploy-env-nonproduction:
    needs: deploy-env-development
    uses: ./.github/workflows/foundation-env-deploy.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-env-production:
    needs: deploy-env-nonproduction
    uses: ./.github/workflows/foundation-env-deploy.yaml
    with:
      environment: production
    secrets: inherit

  # ── Phase 3: Networks ─────────────────────────────────────────────────────
  # The networks stage uses a chained promotion workflow:
  #   development (auto) → nonproduction (manual approval)
  #     → shared (manual approval) → production (manual approval)
  # Each leaf is its own leaf Pulumi project (envs/<leaf>, upstream
  # 3-networks-hub-and-spoke layout) with a single `production` stack and
  # isolated state; the reusable workflow maps the leaf name onto the dir.
  # The `shared` leaf (hub VPC / DNS hub / hierarchical firewall) is
  # production-tier — upstream applies envs/shared from the production branch —
  # so it sits behind nonproduction's soak and its own approval gate, ahead of
  # the production spoke (hub changes land before the prod spoke consumes them).

  release-gcp-networks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-networks--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-networks/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-networks/.release-please-manifest.json
          target-branch: main

  # shared holds the hub VPC the spokes peer into, so it MUST apply first —
  # dev/nonprod/prod depend on it (upstream 3-networks README). Then the standard
  # dev → nonprod → prod promotion (envs are independent of each other).
  deploy-net-shared:
    needs: release-gcp-networks
    if: needs.release-gcp-networks.outputs.release_created == 'true'
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: shared
    secrets: inherit

  deploy-net-development:
    needs: deploy-net-shared
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: development
    secrets: inherit

  deploy-net-nonproduction:
    needs: deploy-net-development
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-net-production:
    needs: deploy-net-nonproduction
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: production
    secrets: inherit

  # ── Phase 4: Projects ─────────────────────────────────────────────────────
  # The projects stage (gcp-projects, stage 4) uses a chained promotion workflow:
  #   development (auto) → nonproduction (manual approval)
  #     → shared (manual approval) → production (manual approval)
  # Each business-unit leaf is its own leaf Pulumi project
  # (business_unit_1/<leaf>, upstream 4-projects layout) with a single
  # `production` stack and isolated state; the reusable workflow maps the leaf
  # name onto the dir. The `shared` leaf (BU infra-pipeline,
  # modules/infra_pipelines) is production-tier — upstream applies
  # business_unit_1/shared from the production branch — so it sits behind
  # nonproduction's soak and its own approval gate, ahead of production.

  release-gcp-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-projects--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-projects/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-projects/.release-please-manifest.json
          target-branch: main

  # shared holds the BU infra-pipeline project; apply it first, then the standard
  # dev → nonprod → prod promotion (mirrors the networks chain + upstream ordering).
  deploy-proj-shared:
    needs: release-gcp-projects
    if: needs.release-gcp-projects.outputs.release_created == 'true'
    uses: ./.github/workflows/foundation-proj-deploy.yaml
    with:
      environment: shared
    secrets: inherit

  deploy-proj-development:
    needs: deploy-proj-shared
    uses: ./.github/workflows/foundation-proj-deploy.yaml
    with:
      environment: development
    secrets: inherit

  deploy-proj-nonproduction:
    needs: deploy-proj-development
    uses: ./.github/workflows/foundation-proj-deploy.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-proj-production:
    needs: deploy-proj-nonproduction
    uses: ./.github/workflows/foundation-proj-deploy.yaml
    with:
      environment: production
    secrets: inherit

