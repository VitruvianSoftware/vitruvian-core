name: Foundation Release & Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/pulumi/foundation/**"
      - "infrastructure/pulumi/pkg/**"
      - ".github/workflows/foundation-release.yaml"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: foundation-release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation--release_created'] }}
    steps:
      - name: Mint App token for the release PR
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/.release-please-manifest.json
          target-branch: main

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - app: gcp-bootstrap
            dir: infrastructure/pulumi/foundation/gcp-bootstrap
            stack: production
            environment: foundation-bootstrap
          - app: org-folders
            dir: infrastructure/pulumi/foundation/org-folders
            stack: production
            environment: foundation-bootstrap
          - app: gcp-org
            dir: infrastructure/pulumi/foundation/gcp-org
            stack: production
            environment: foundation-org
    environment: ${{ matrix.environment }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (${{ matrix.app }} / ${{ matrix.stack }})
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          pulumi stack select "${{ matrix.stack }}"
          pulumi up --yes --non-interactive
