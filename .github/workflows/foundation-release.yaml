name: Foundation Release & Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/pulumi/foundation/**"
      - "infrastructure/pulumi/pkg/**"
      - ".github/workflows/foundation-release.yaml"

permissions:
  contents: write
  pull-requests: write
  id-token: write

# ──────────────────────────────────────────────────────────────────────────────
# Each foundation phase has its own release-please config, manifest, release
# PR, and deploy job. There is NO shared state between phases — merging one
# release PR never conflicts with another.
#
# The operator controls deployment order by merging the individual Release
# Please PRs in the desired sequence.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Release Please ─────────────────────────────────────────────────────────
  # Three independent release-please invocations, one per phase. Each uses its
  # own config + manifest file living inside the phase directory, so merging
  # one release PR does not touch any file shared by the others.

  release-gcp-org:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-org--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-org/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-org/.release-please-manifest.json
          target-branch: main

  release-org-folders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/org-folders--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/org-folders/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/org-folders/.release-please-manifest.json
          target-branch: main

  release-gcp-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-bootstrap--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-bootstrap/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-bootstrap/.release-please-manifest.json
          target-branch: main

  # ── Deploy jobs ────────────────────────────────────────────────────────────

  deploy-gcp-org:
    needs: release-gcp-org
    if: needs.release-gcp-org.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-org
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (gcp-org / production)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: infrastructure/pulumi/foundation/gcp-org
        run: |
          set -euo pipefail
          pulumi stack select -c "production"
          pulumi up --yes --non-interactive

  deploy-org-folders:
    needs: release-org-folders
    if: needs.release-org-folders.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-org-folders
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (org-folders / production)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: infrastructure/pulumi/foundation/org-folders
        run: |
          set -euo pipefail
          pulumi stack select -c "production"
          pulumi up --yes --non-interactive

  deploy-gcp-bootstrap:
    needs: release-gcp-bootstrap
    if: needs.release-gcp-bootstrap.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: foundation-bootstrap
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (gcp-bootstrap / production)
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        working-directory: infrastructure/pulumi/foundation/gcp-bootstrap
        run: |
          set -euo pipefail
          pulumi stack select -c "production"
          pulumi up --yes --non-interactive

  # ── Phase 2: Environments ────────────────────────────────────────────────
  # The environments stage uses a chained promotion workflow:
  #   development (auto) → nonproduction (manual approval) → production (manual approval)
  # Each environment is a separate Pulumi stack with isolated state.

  release-gcp-environments:
    needs: [deploy-gcp-org, deploy-org-folders, deploy-gcp-bootstrap]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-environments--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-environments/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-environments/.release-please-manifest.json
          target-branch: main

  deploy-env-development:
    needs: release-gcp-environments
    if: needs.release-gcp-environments.outputs.release_created == 'true'
    uses: ./.github/workflows/foundation-env-deploy.yaml
    with:
      environment: development
    secrets: inherit

  deploy-env-nonproduction:
    needs: deploy-env-development
    uses: ./.github/workflows/foundation-env-deploy.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-env-production:
    needs: deploy-env-nonproduction
    uses: ./.github/workflows/foundation-env-deploy.yaml
    with:
      environment: production
    secrets: inherit

  # ── Phase 3: Networks ─────────────────────────────────────────────────────
  # The networks stage uses a chained promotion workflow:
  #   development (auto) → nonproduction (manual approval) → production (manual approval)
  # Each environment is a separate Pulumi stack with isolated state.

  release-gcp-networks:
    needs: [deploy-env-production]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs['infrastructure/pulumi/foundation/gcp-networks--release_created'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: infrastructure/pulumi/foundation/gcp-networks/release-please-config.json
          manifest-file: infrastructure/pulumi/foundation/gcp-networks/.release-please-manifest.json
          target-branch: main

  deploy-net-development:
    needs: release-gcp-networks
    if: needs.release-gcp-networks.outputs.release_created == 'true'
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: development
    secrets: inherit

  deploy-net-nonproduction:
    needs: deploy-net-development
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: nonproduction
    secrets: inherit

  deploy-net-production:
    needs: deploy-net-nonproduction
    uses: ./.github/workflows/foundation-net-deploy.yaml
    with:
      environment: production
    secrets: inherit

