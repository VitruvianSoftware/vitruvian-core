# release-please for Vitruvian GitHub (apps/extensions/atrium/vitruvian-github):
# authors the release PR from conventional commits under that folder and,
# when that PR merges, cuts the GitHub Release tagged
# vitruvian-github-vX.Y.Z here.
#
# This is RELEASE MACHINERY, not delivery: it builds and publishes nothing. The
# release PR writes the version into .release-please-manifest.json,
# CHANGELOG.md, vitruvian-tool.json and Version.swift; Copybara exports them
# to VitruvianSoftware/vitruvian-github, whose own release.yml (exported
# from apps/extensions/atrium/vitruvian-github/.github/workflows/) tags vX.Y.Z
# there and attaches the tool's zip, which catalog/tools.json then pins.
#
# The first release is 1.0.0: the manifest starts at 0.0.0, which release-please
# reads as "never released", and the config's initial-version names 1.0.0.
# bootstrap-sha stops its first look back at the commit the tool's work
# started from. Release PRs merge themselves (release-pr-automerge.yaml);
# label one do-not-automerge to hold it.
name: vitruvian-github-release

on:
  push:
    branches: [main]
    paths:
      - "apps/extensions/atrium/vitruvian-github/**"
      - ".github/workflows/vitruvian-github-release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Never cancel a release run; serialize them on the branch so rapid merges
    # to main cannot race the release PR / tag creation (issue #461).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # `mint-sync-app-token` is a LOCAL composite action; GitHub can't resolve
      # `uses: ./...` without the repo already checked out onto the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-please PRs must be authored by an App (not GITHUB_TOKEN) so the
      # PR triggers the merge queue's required checks. No fallback: a
      # GITHUB_TOKEN-authored release PR can never enter the merge queue.
      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while its PR is in the merge queue. A
      # fix that lands on main while the release PR is queued then makes
      # release-please's push fail: the PR merges with stale notes and a tag
      # that holds the newer code (Courier 0.3.32 shipped #5268 and #5264 and
      # listed neither). Out of the queue it can be refreshed. After
      # release-please, `rearm` puts back a PR that release-please had nothing
      # to push to. See tools/ci/src/release_pr_dequeue/README.md.
      - name: Build //tools/ci:release_pr_dequeue (no Bazel on this job)
        id: dequeue-bin
        uses: ./.github/actions/build-ci-tool
        with:
          tool: release_pr_dequeue

      - name: Take a stale release PR out of the merge queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-github
          CODE_PATH: apps/extensions/atrium/vitruvian-github
          MAIN_SHA: ${{ github.sha }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN"'

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/extensions/atrium/vitruvian-github/release-please-config.json
          manifest-file: apps/extensions/atrium/vitruvian-github/.release-please-manifest.json
          target-branch: main

      # release-please pushes only when the release PR's text changes, so a PR
      # that was dequeued for a commit that adds nothing to its notes would stay
      # out of the queue. Put it back (a held, draft or already-armed PR is left alone).
      - name: Put the release PR back in the merge queue
        if: ${{ !cancelled() && steps.dequeue-bin.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-github
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN" rearm'
