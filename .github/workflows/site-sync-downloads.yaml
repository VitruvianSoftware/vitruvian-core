name: site-sync-downloads

on:
  schedule:
    # Run daily at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-sync-downloads
  cancel-in-progress: false

jobs:
  sync-downloads:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint App token for PR operations
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Run catalog synchronization
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 tools/sync-downloads/sync_downloads.py

      - name: Open or update PR if changes detected
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if git diff --quiet apps/web/vitruviansoftware-dev/_data/downloads.yml; then
            echo "Catalog is up to date, nothing to commit."
            exit 0
          fi

          branch="auto/sync-downloads-catalog"
          git config user.name "vitruvian-wren-agent[bot]"
          git config user.email "314429222+vitruvian-wren-agent[bot]@users.noreply.github.com"

          # The checkout above used persist-credentials: false, so git has no
          # credentials of its own. Hand it the App token for the push.
          gh auth setup-git

          git checkout -B "$branch"
          git add apps/web/vitruviansoftware-dev/_data/downloads.yml
          git commit -m "chore(site): synchronize downloads catalog with latest releases"
          git push -f origin "$branch"

          body="Synchronized \`apps/web/vitruviansoftware-dev/_data/downloads.yml\` with newly published GitHub Releases across standalone and monorepo components.

          Generated automatically by the \`site-sync-downloads\` workflow."

          existing="$(gh pr list \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for $branch -- updated."
          else
            gh pr create \
              --title "chore(site): synchronize downloads catalog with latest releases" \
              --body "$body" \
              --base main \
              --head "$branch"
          fi
