# Each day, brings the website's downloads list up to date with the newest
# GitHub Releases, through a pull request from auto/sync-downloads-catalog.
#
# Who merges it: this workflow arms auto-merge on the pull request, at the
# commit it pushed, so the merge queue merges it once its checks pass
# (tools/ci/site-pr-automerge.sh). Not when a person holds it with
# do-not-automerge or needs-human, or leaves it a draft.
name: site-sync-downloads

on:
  schedule:
    # Run daily at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-sync-downloads
  cancel-in-progress: false

jobs:
  sync-downloads:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint App token for PR operations
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core

      - name: Run catalog synchronization
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          rustc --edition 2021 --crate-type lib --crate-name sync_downloads tools/sync-downloads/src/lib.rs -o "$RUNNER_TEMP/libsync_downloads.rlib"
          rustc --edition 2021 tools/sync-downloads/src/main.rs -L "$RUNNER_TEMP" --extern sync_downloads="$RUNNER_TEMP/libsync_downloads.rlib" -o "$RUNNER_TEMP/sync_downloads"
          "$RUNNER_TEMP/sync_downloads"

      # The App's full token: arming auto-merge needs the right to merge
      # (contents: write) as well as pull-requests: write, as in
      # catalog-check's bump-automerge.
      - name: Open or update PR if changes detected, and arm auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git diff --quiet apps/web/vitruviansoftware-dev/_data/downloads.yml; then
            echo "Catalog is up to date, nothing to commit."
            exit 0
          fi

          branch="auto/sync-downloads-catalog"
          git config user.name "vitruvian-wren-agent[bot]"
          git config user.email "314429222+vitruvian-wren-agent[bot]@users.noreply.github.com"

          # The checkout above used persist-credentials: false, so git has no
          # credentials of its own. Hand it the App token for the push.
          gh auth setup-git

          # Off before the push: an arming made for an earlier commit must not
          # carry this one. It is armed again below, at this commit only.
          bash tools/ci/site-pr-automerge.sh disarm --branch "$branch"

          git checkout -B "$branch"
          git add apps/web/vitruviansoftware-dev/_data/downloads.yml
          git commit -m "chore(site): synchronize downloads catalog with latest releases"
          git push -f origin "$branch"
          sha="$(git rev-parse HEAD)"

          body="Synchronized \`apps/web/vitruviansoftware-dev/_data/downloads.yml\` with newly published GitHub Releases across standalone and monorepo components.

          Generated automatically by the \`site-sync-downloads\` workflow. It arms auto-merge, so the merge queue merges it once its checks pass. To hold it, label it \`do-not-automerge\` and turn auto-merge off."

          existing="$(gh pr list \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for $branch -- updated."
          else
            gh pr create \
              --title "chore(site): synchronize downloads catalog with latest releases" \
              --body "$body" \
              --base main \
              --head "$branch"
          fi

          bash tools/ci/site-pr-automerge.sh arm --branch "$branch" --sha "$sha"
