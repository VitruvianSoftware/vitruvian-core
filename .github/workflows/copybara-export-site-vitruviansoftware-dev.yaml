name: Copybara Export (site-vitruviansoftware-dev)

# EXPORT-ONLY mirror: monorepo apps/web/vitruviansoftware-dev/ ->
# VitruvianSoftware/site-vitruviansoftware-dev (repo root) on every push under
# that subtree. Thin caller -- logic lives in _copybara-export.yaml; the
# export_site_vitruviansoftware_dev workflow is defined in
# tools/copybara/copy.bara.sky.
#
# THIS EXPORT IS THE WEBSITE'S DEPLOY TRIGGER. The standalone repo is the GitHub
# Pages publisher for vitruviansoftware.dev: the push this job makes to its main
# starts that repo's own jekyll.yml, which builds and deploys the site. A green
# run here means "pushed to the mirror", not "live" -- the deploy is the
# mirror's run.
on:
    push:
        branches: [main]
        paths: ["apps/web/vitruviansoftware-dev/**", "tools/copybara/copy.bara.sky"]
    workflow_dispatch:
        inputs:
            copybara-options:
                description: "Copybara CLI options. Re-seed a lost MONOREPO_REV_ID baseline with '--init-history --force --ignore-noop' (SQUASH mode lands it as one commit). Normal runs: --ignore-noop."
                default: "--ignore-noop"
                required: false

permissions:
    contents: read

concurrency:
    group: copybara-export-site-vitruviansoftware-dev
    cancel-in-progress: false

jobs:
    export:
        uses: ./.github/workflows/_copybara-export.yaml
        with:
            component: site-vitruviansoftware-dev
            copybara-options: ${{ inputs['copybara-options'] || github.event.inputs['copybara-options'] || '--force --ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.SITE_VITRUVIANSOFTWARE_DEV_SYNC_SSH_KEY }}
