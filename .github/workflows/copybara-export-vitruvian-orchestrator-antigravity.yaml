name: Copybara Export (vitruvian-orchestrator-antigravity)

# EXPORT-ONLY mirror: monorepo apps/antigravity/plugins/vitruvian-orchestrator/ ->
# VitruvianSoftware/vitruvian-orchestrator-antigravity (repo root) on every push under that subtree. Thin
# caller -- logic lives in _copybara-export.yaml; the export_vitruvian_orchestrator_antigravity workflow
# is defined in tools/copybara/copy.bara.sky.
#
# The mirror is how people outside this repository install the plugin:
#   agy plugin install https://github.com/VitruvianSoftware/vitruvian-orchestrator-antigravity
# so the plugin folder has to land at the mirror's root, plugin.json on top. A
# green run here means "pushed to the mirror".
on:
    push:
        branches: [main]
        paths: ["apps/antigravity/plugins/vitruvian-orchestrator/**", "tools/copybara/copy.bara.sky"]
    workflow_dispatch:
        inputs:
            copybara-options:
                description: "Copybara CLI options. Re-seed a lost MONOREPO_REV_ID baseline with '--init-history --force --ignore-noop' (SQUASH mode lands it as one commit)."
                default: "--ignore-noop"
                required: false

permissions:
    contents: read
    actions: read # _await-repo-config.yaml lists Repo Config Apply runs

concurrency:
    group: copybara-export-vitruvian-orchestrator-antigravity
    cancel-in-progress: false

jobs:
    # Holds the export (and the key mapping below) until no Repo Config
    # Apply can still replace the mirror key: see _await-repo-config.yaml.
    await-repo-config:
        uses: ./.github/workflows/_await-repo-config.yaml
        permissions:
            contents: read
            actions: write # may start a fresh run of this export (see _await-repo-config.yaml)

    export:
        needs: await-repo-config
        # Skipped when the wait handed this export to a fresh run.
        if: needs.await-repo-config.outputs.restarted != 'true'
        uses: ./.github/workflows/_copybara-export.yaml
        with:
            component: vitruvian-orchestrator-antigravity
            copybara-options: ${{ inputs['copybara-options'] || github.event.inputs['copybara-options'] || '--force --ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.VITRUVIAN_ORCHESTRATOR_ANTIGRAVITY_SYNC_SSH_KEY }}
