# Self-hosted Renovate, scoped to exactly one gap: Helm chart version pins
# inside gitops/argocd/ ArgoCD Application/ApplicationSet manifests (e.g.
# buzz.yaml's `targetRevision: 0.1.7` against ghcr.io/block/buzz/charts).
# Dependabot has no Helm/ArgoCD manager (see .github/dependabot.yml — no entry
# touches gitops/), so nothing tracked this before. New-tool sign-off: James
# Nguyen, vitruvian-core-buzz channel, 2026-07-31 (thread root
# 5955e5f7ba52d63429c49730945bd5b876bfb7c43419c6fca5410a6aa0b3374d), per
# docs/engineering/application-development-principles.md §2.13.
#
# Config lives in renovate.json5 (repo root) — `enabledManagers: ["argocd"]`
# there is what actually keeps this from ever touching npm/gomod/github-actions/
# docker, all of which Dependabot already owns. Validated locally against the
# real tree before this workflow existed: `RENOVATE_PLATFORM=local npx renovate`
# detects exactly the 34 gitops/argocd/** files and 35 chart dependencies, zero
# config warnings, zero overlap with Dependabot's ecosystems.
#
# Token: Renovate's OWN GitHub App, vitruvian-renovate (#2551), minted per run
# with contents, pull-requests and issues write -- and nothing else. Two things
# make that the right identity:
#
# - Its pushes trigger CI like a person's. The previous token, the workflow's
#   GITHUB_TOKEN, is deliberately not allowed to trigger other workflows, so
#   every Renovate PR arrived with ~10 red zero-job runs and needed a
#   close/reopen by another App before its real CI started.
# - It is NOT a bypass actor on main's merge queue, unlike the
#   vitruvian-copybara-sync App (#804), which is why Renovate never borrowed
#   that one. Renovate is a large third-party tool downloaded fresh each run;
#   its PRs have to pass the queue like anyone else's.
#   TestRenovateIsNotABypassActor (infrastructure/pulumi/platform/repo-config)
#   fails if that ever changes.
#
# The key is stored with `bazel run //tools/github-app-key -- renovate`.

name: renovate

on:
  workflow_dispatch: {}
  schedule:
    # THIS CRON IS THE ONLY CADENCE CONTROL. renovate.json5 deliberately carries
    # no `schedule:` — see the comment there. A config-side time-of-day window
    # cannot "line up" with a cron, because GitHub delivers scheduled runs
    # 30-180 minutes late under load; a window narrower than that drift silently
    # turns every delivered run into a no-op. That is exactly what the previous
    # pairing (this cron + "before 6am on monday") did, for its entire life.
    # Guarded by //tools/conformance:check (check_renovate_schedule).
    - cron: "0 5 * * 1" # 05:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate (argocd Helm chart pins)
    runs-on: ubuntu-26.04
    # The observed run is ~1min (one datasource, one repo, autodiscover off);
    # 20 gives ~20x headroom for a slow registry while still failing fast. A job
    # with no timeout inherits GitHub's 360-minute default, so a wedged registry
    # call would hold a runner for 6h — and this lane is serialized on a constant
    # concurrency group, so the next scheduled run would queue behind it.
    timeout-minutes: 20
    # Renovate writes with its own App token (see the header), so the job's
    # GITHUB_TOKEN only needs to check out the repo.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived token for Renovate's own App, narrowed to this repo and to
      # exactly what Renovate does here: push branches, open PRs, and keep the
      # Dependency Dashboard issue (renovate.json5) up to date.
      - name: Mint a token for the vitruvian-renovate App
        id: renovate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liR87u9iun3Br4GZ # vitruvian-renovate — public App client ID
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: vitruvian-core
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        with:
          configurationFile: renovate.json5
          token: ${{ steps.renovate-token.outputs.token }}
        env:
          # Commit as the App's bot user (id from GET /users/vitruvian-renovate[bot]).
          RENOVATE_USERNAME: vitruvian-renovate[bot]
          RENOVATE_GIT_AUTHOR: "vitruvian-renovate[bot] <335167190+vitruvian-renovate[bot]@users.noreply.github.com>"
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: false
          # No onboarding PR: renovate.json5 already states exactly what we want.
          RENOVATE_ONBOARDING: false
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
