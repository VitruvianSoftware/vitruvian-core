# Self-hosted Renovate, scoped to exactly one gap: Helm chart version pins
# inside gitops/argocd/ ArgoCD Application/ApplicationSet manifests (e.g.
# buzz.yaml's `targetRevision: 0.1.7` against ghcr.io/block/buzz/charts).
# Dependabot has no Helm/ArgoCD manager (see .github/dependabot.yml — no entry
# touches gitops/), so nothing tracked this before. New-tool sign-off: James
# Nguyen, vitruvian-core-buzz channel, 2026-07-31 (thread root
# 5955e5f7ba52d63429c49730945bd5b876bfb7c43419c6fca5410a6aa0b3374d), per
# docs/engineering/application-development-principles.md §2.13.
#
# Config lives in renovate.json5 (repo root) — `enabledManagers: ["argocd"]`
# there is what actually keeps this from ever touching npm/gomod/github-actions/
# docker, all of which Dependabot already owns. Validated locally against the
# real tree before this workflow existed: `RENOVATE_PLATFORM=local npx renovate`
# detects exactly the 34 gitops/argocd/** files and 35 chart dependencies, zero
# config warnings, zero overlap with Dependabot's ecosystems.
#
# Token: the plain workflow GITHUB_TOKEN (contents:write, pull-requests:write),
# NOT the vitruvian-copybara-sync App used elsewhere (copybara-import-pr.yaml,
# release-pr-automerge.yaml) — that App is a merge-queue required-review
# BYPASS actor (#804), reserved for its own narrow release-automation purpose.
# Reusing it here would silently grant Renovate-authored infra PRs the same
# bypass, which nobody signed off on. Plain GITHUB_TOKEN has none of that.
#
# Known rough edge from that choice: GitHub does not let a GITHUB_TOKEN-authored
# push trigger a `pull_request` workflow run (anti-recursion protection), so a
# fresh Renovate PR may show no checks until it's manually re-triggered (e.g.
# close/reopen, or "Re-run all jobs") or enqueued into the merge queue. Every
# required check here also runs on `merge_group` (verified: ci.yaml,
# gitops-validate.yaml, tidy-check.yaml, migration-safety.yaml,
# conformance-check.yaml, actionlint.yaml all have it), so the merge queue is
# still the real, unbypassable gate — this only affects how soon a check
# *appears* on the PR, not whether one runs before merge.

name: renovate

on:
  workflow_dispatch: {}
  schedule:
    # THIS CRON IS THE ONLY CADENCE CONTROL. renovate.json5 deliberately carries
    # no `schedule:` — see the comment there. A config-side time-of-day window
    # cannot "line up" with a cron, because GitHub delivers scheduled runs
    # 30-180 minutes late under load; a window narrower than that drift silently
    # turns every delivered run into a no-op. That is exactly what the previous
    # pairing (this cron + "before 6am on monday") did, for its entire life.
    # Guarded by //tools/conformance:check (check_renovate_schedule).
    - cron: "0 5 * * 1" # 05:00 UTC Monday

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate (argocd Helm chart pins)
    runs-on: ubuntu-latest
    # The observed run is ~1min (one datasource, one repo, autodiscover off);
    # 20 gives ~20x headroom for a slow registry while still failing fast. A job
    # with no timeout inherits GitHub's 360-minute default, so a wedged registry
    # call would hold a runner for 6h — and this lane is serialized on a constant
    # concurrency group, so the next scheduled run would queue behind it.
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: false
          # No onboarding PR: renovate.json5 already states exactly what we want.
          RENOVATE_ONBOARDING: false
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
