name: Copybara Sync-Auth Apply

# Applies the root sync-auth Pulumi stack (vitruvian-core-infra) — the GitHub
# deploy keys + Actions secrets that back the one-way Copybara mirrors for every
# synced component (see infrastructure/pulumi/pkg/copybara_sync). Run this once
# to provision a newly-onboarded component's <COMPONENT>_SYNC_SSH_KEY before its
# first `copybara-export-*` baseline seed.
#
# workflow_dispatch ALWAYS runs (manual provisioning). Push to the module
# auto-applies ONLY when the repository variable SYNC_AUTH_AUTO_APPLY=true
# (Settings -> Secrets and variables -> Actions -> Variables) — off by default
# because this stack manages auth for every component.
#
# Auth: the shared Pulumi GitHub App (PULUMI_APP_ID variable + APP_PRIVATE_KEY
# secret) — minted org-scoped so the provider can manage deploy keys on the
# standalone repos, not just the monorepo — plus PULUMI_ACCESS_TOKEN for the
# Pulumi Cloud backend. The App must be installed (with administration + secrets
# write) on the monorepo AND every standalone component repo.
on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths:
            - "infrastructure/pulumi/main.go"
            - "infrastructure/pulumi/pkg/copybara_sync/**"
            - "infrastructure/pulumi/BUILD"
            - ".github/workflows/copybara-sync-auth-apply.yaml"

permissions:
    contents: read

concurrency:
    group: copybara-sync-auth-apply
    cancel-in-progress: false

jobs:
    apply:
        # Manual runs always proceed; push-triggered runs are opt-in.
        if: ${{ github.event_name == 'workflow_dispatch' || vars.SYNC_AUTH_AUTO_APPLY == 'true' }}
        runs-on: ubuntu-latest
        # Bound the Pulumi apply (matches _repo-config-apply / dependabot-bazel-
        # reconcile, both 45). Without this the job defaults to 360 min, and a
        # wedged `pulumi up` would also hold the cancel-in-progress:false
        # concurrency lock for that whole window, blocking later runs.
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - name: Install Bazel
              uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  repository-cache: true
                  bazelrc: |
                      common --announce_rc --color=yes --curses=yes
                      common --show_progress_rate_limit=60 --show_timestamps

            # Org-scoped so the Pulumi GitHub provider can manage deploy keys +
            # Actions secrets on the standalone component repos, not only the
            # monorepo (this is the key difference from the repo_config apply).
            - name: Mint a GitHub App token for the Pulumi GitHub provider
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.PULUMI_APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}

            - name: Pulumi up (vitruvian-core-infra sync-auth)
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  GITHUB_OWNER: ${{ github.repository_owner }}
                  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
                  # The shared sync App creds, injected from pipeline secrets (never
                  # committed). The program reads these env vars in CI and falls back
                  # to the gitignored local Pulumi stack config for local dev.
                  SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
                  SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
              run: bazel run //infrastructure/pulumi:up -- --stack dev --yes
