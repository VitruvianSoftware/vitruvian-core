# GENERATED by 'bazel run //tools/pipeline:gen' from pipeline_unit() declarations — DO NOT EDIT. tidy-check enforces regeneration.

name: Presubmit

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: presubmit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan/affected-units
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      units: ${{ steps.plan.outputs.units }}
      degraded: ${{ steps.plan.outputs.degraded }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Work out which units this change affects
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          ALL_UNITS: '["backstage-backend","design-system","backstage-app","design-system-android","devx-cli","homelab","mcp-slack-service","nexus-agent-src","nexus-agent-macos","oauth-user-inspector","pulumi-repo-config","remote","remote-boot","tabula-shared","tabula-api","tabula-cli","tabula-extension","tabula-web"]'
        run: |
          set +e -u -o pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group)  base="$MQ_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac
          units="$ALL_UNITS"
          degraded=unknown
          if [ -z "$base" ]; then
            echo "::warning::No diff base for event '$EVENT_NAME'; running every unit."
          else
            out="$(bazel run //tools/pipeline:plan -- \
                     --base="$base" --event="$EVENT_NAME" \
                     --format=github-matrix --repo-root="$PWD" 2>/tmp/plan.err)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::Planner exited $rc; running every unit. Last lines:"
              tail -n 30 /tmp/plan.err || true
            fi
            matrix="$(printf '%s\n' "$out" | grep '^matrix=' | sed 's/^matrix=//')"
            degraded="$(printf '%s\n' "$out" | grep '^is_degraded=' | sed 's/^is_degraded=//')"
            if [ -n "$matrix" ] && parsed="$(printf '%s' "$matrix" | jq -c '[.[].name]' 2>/dev/null)"; then
              units="$parsed"
            else
              echo "::warning::Could not read an affected-unit list; running every unit."
              units="$ALL_UNITS"
            fi
          fi
          echo "affected units: $units"
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "degraded=$degraded" >> "$GITHUB_OUTPUT"
          {
            echo "### Affected units"
            echo ""
            printf '%s\n' "$units" | jq -r '.[]' 2>/dev/null | sed 's/^/- /' || echo "- (all)"
          } >> "$GITHUB_STEP_SUMMARY"

