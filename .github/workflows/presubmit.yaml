          extra_flags=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache_flags=(--config=remote "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel test "${extra_flags[@]}" "${cache_flags[@]}" //tabula/extension:unit_tests || { rc=$?; if [ $rc -eq 4 ]; then bazel build "${extra_flags[@]}" "${cache_flags[@]}" //tabula/extension:unit_tests; else exit $rc; fi; }

      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  unit-tabula-web:
    name: tabula-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-design-system, unit-tabula-shared]
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Free up runner disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Restore the extracted LLVM toolchain
        id: llvm-contents
        uses: ./.github/actions/llvm-cache-restore

      - name: Build & Test Unit tabula-web
        run: |
          set -euo pipefail
          cache_flags=()
          extra_flags=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache_flags=(--config=remote "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel test "${extra_flags[@]}" "${cache_flags[@]}" //tabula/web:unit_tests || { rc=$?; if [ $rc -eq 4 ]; then bazel build "${extra_flags[@]}" "${cache_flags[@]}" //tabula/web:unit_tests; else exit $rc; fi; }

      - name: LLVM cache tripwire
        if: always()
        uses: ./.github/actions/llvm-cache-tripwire
        with:
          restore-outcome: ${{ steps.llvm-contents.outputs.outcome }}
          cache-hit: ${{ steps.llvm-contents.outputs.cache-hit }}
          pre-count: ${{ steps.llvm-contents.outputs.pre-count }}
          pin-path: ${{ steps.llvm-contents.outputs.pin-path }}

  gate:
    name: gate/all-required-passed
    needs: [unit-backstage-backend, unit-design-system, unit-backstage-app, unit-design-system-android, unit-devx-cli, unit-homelab, unit-mcp-slack-service, unit-nexus-agent-src, unit-nexus-agent-macos, unit-oauth-user-inspector, unit-pulumi-repo-config, unit-remote, unit-tabula-shared, unit-tabula-api, unit-tabula-cli, unit-tabula-extension, unit-tabula-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Evaluate Monorepo Gate Verdict
        run: |
          set -euo pipefail
          echo "✓ All pipeline units in DAG completed successfully."
