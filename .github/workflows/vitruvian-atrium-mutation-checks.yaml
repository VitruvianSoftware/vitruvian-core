name: Vitruvian Atrium Mutation Checks

# //apps/desktop/vitruvian-atrium:mutation_checks plants real regressions, one
# at a time, and requires each to fail the unit test meant to catch it. A test
# that still passes with its regression in place is too weak to rely on
# (REFACTOR.md step 7).
#
# Weekly, not per PR: each mutation rebuilds a module and reruns a suite on
# macOS, about 105 s each. NOT a required check: it gates nothing, and a red
# run files (or refreshes) one tracking issue per shard.
#
# Sharded: the list grew from 219 mutations (2026-10-13) to 584 (2026-11-23),
# some 17 hours in one go, and a job here is capped at 5.5. So the mutations
# are split into SHARDS slices (mutation i is in slice i % SHARDS) and each
# weekly run takes the slice for its ISO week, covering the whole list every
# SHARDS weeks at about the cost of one run today. A run by hand can take one
# slice or all of them at once, in parallel. Raise SHARDS when one slice
# nears the timeout (the log prints its size).
#
# What does run per PR is //apps/desktop/vitruvian-atrium:mutation_fixtures_test, which
# only reads: every mutation still quotes its source exactly.

on:
  schedule:
    # Sundays 05:17 UTC.
    - cron: '17 5 * * 0'
  # Run it by hand after changing a test or a mutation.
  workflow_dispatch:
    inputs:
      shard:
        description: "Slice to run: 'week' (this ISO week's), 'all' (every slice, in parallel), or a number from 0"
        required: false
        default: week

# One run at a time; never cancel a running one (its result is the signal).
concurrency:
  group: vitruvian-atrium-mutation-checks
  cancel-in-progress: false

# Least privilege: checkout and build, plus issue filing from the result steps.
permissions:
  contents: read
  issues: write

env:
  SHARDS: '4'

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - name: Pick the slices to run
        id: pick
        env:
          ASKED: ${{ github.event.inputs.shard || 'week' }}
        run: |
          set -euo pipefail
          case "$ASKED" in
            week) list="[$(( 10#$(date -u +%V) % SHARDS ))]" ;;
            all) list="[$(seq -s, 0 $(( SHARDS - 1 )))]" ;;
            *)
              if ! [[ "$ASKED" =~ ^[0-9]+$ ]] || (( ASKED >= SHARDS )); then
                echo "::error::shard must be 'week', 'all' or a number from 0 to $(( SHARDS - 1 )), not '$ASKED'"
                exit 1
              fi
              list="[$ASKED]" ;;
          esac
          echo "shards=$list" >> "$GITHUB_OUTPUT"
          echo "Running slice(s) $list of $SHARDS"

  mutation-checks:
    needs: plan
    name: mutation-checks (shard ${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Run the mutation checks
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cache_flags=()
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cache_flags=(--config=remotecache-ci "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}")
          fi
          bazel run --config=macos-app "${cache_flags[@]}" //apps/desktop/vitruvian-atrium:mutation_checks -- \
            "--shard=${SHARD}/${SHARDS}" "${cache_flags[@]}"

      - name: Open or refresh the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          title="Vitruvian Atrium mutation checks are red (shard ${SHARD} of ${SHARDS})"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The weekly mutation checks for \`apps/desktop/vitruvian-atrium\` failed on \`main\`,
          in slice ${SHARD} of ${SHARDS}.

          Either a planted regression no longer fails the test meant to catch it, so that test
          has gone weak, or a mutation no longer applies because its code moved. The run log
          lists every mutation of the slice that was not caught (\`NOT CAUGHT:\`), with what
          failed instead: strengthen the test, or update the mutation in
          \`//apps/desktop/vitruvian-atrium:mutation_checks\`.

          Rerun just this slice: Actions, Vitruvian Atrium Mutation Checks, Run workflow,
          shard \`${SHARD}\`.

          Failing run: ${run_url}"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red: ${run_url}"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # A green slice closes its own issue, so an open one always means that
      # slice's latest run was red.
      - name: Close the tracking issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          title="Vitruvian Atrium mutation checks are red (shard ${SHARD} of ${SHARDS})"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --reason completed --comment "Green again: ${run_url}"
          fi
