# Validate the ArgoCD GitOps tree (schema + syntax via kubeconform) BEFORE a
# change reaches main and reconciles live against the cluster (selfHeal +
# prune). Advisory today; the intent is to add "gitops-validate" to the
# merge-queue required set (repo-config `mergeQueueRequiredChecks`) once proven.
# Issue #454. Logic lives in tools/ci/gitops-validate.sh so it is reviewable and
# runnable locally (`bash tools/ci/gitops-validate.sh` with kubeconform on PATH).
name: gitops-validate

on:
  workflow_dispatch: {}
  # NB: NO workflow-level `paths` filter. This is a REQUIRED merge-queue check,
  # so it must REPORT on every pull_request and merge_group — a path-filtered
  # workflow simply doesn't run (and never reports) on a PR outside its paths,
  # which blocks that PR from ever becoming mergeable (it wedged the whole repo
  # once, before this was removed). kubeconform over the whole gitops tree is
  # fast (~20s) and validates the full tree regardless of the diff, so running it
  # unconditionally is both correct and cheap. The required-check context is the
  # job name `gitops-validate`, wired into the ruleset in
  # infrastructure/pulumi/platform/repo_config/main.go (guarded by //tools/conformance:check).
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

# Least privilege: this job only reads the tree and validates it.
permissions:
  contents: read

# Cancel a superseded PR run; never cancel push-to-main or a merge_group run.
concurrency:
  group: gitops-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name = the required-check context in the merge-queue ruleset. Named
  # `gitops-validate` (not a bare `validate`) so the required context is
  # unambiguous.
  gitops-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform (pinned + checksum-verified)
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          # Keep the ORIGINAL filename (-O) so it matches the entry in CHECKSUMS
          # that `sha256sum -c` verifies against.
          curl -fsSL -O "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o CHECKSUMS "${base}/CHECKSUMS"
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf kubeconform-linux-amd64.tar.gz -C "${HOME}/.local/bin" kubeconform
          rm -f kubeconform-linux-amd64.tar.gz CHECKSUMS
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Validate gitops manifests
        run: bash tools/ci/gitops-validate.sh
