# Validate the ArgoCD GitOps tree (schema + syntax via kubeconform) BEFORE a
# change reaches main and reconciles live against the cluster (selfHeal +
# prune). Advisory today; the intent is to add "gitops-validate" to the
# merge-queue required set (repo-config `mergeQueueRequiredChecks`) once proven.
# Issue #454. Logic lives in tools/ci/gitops-validate.sh so it is reviewable and
# runnable locally (`bash tools/ci/gitops-validate.sh` with kubeconform on PATH).
name: gitops-validate

on:
  workflow_dispatch: {}
  # NB: NO workflow-level `paths` filter. This is a REQUIRED merge-queue check,
  # so it must REPORT on every pull_request and merge_group — a path-filtered
  # workflow simply doesn't run (and never reports) on a PR outside its paths,
  # which blocks that PR from ever becoming mergeable (it wedged the whole repo
  # once, before this was removed). kubeconform over the whole gitops tree is
  # fast (~20s) and validates the full tree regardless of the diff, so running it
  # unconditionally is both correct and cheap. The required-check context is the
  # job name `gitops-validate`, wired into the ruleset in
  # infrastructure/pulumi/platform/repo_config/main.go (guarded by //tools/conformance:check).
  #
  # Also NO `branches:` filter on pull_request, for the same reporting
  # requirement: that filters on the PR's BASE branch, and a stacked PR's base
  # isn't main -- so this required check silently never ran on one (see
  # ci.yaml's `on:` block for the full incident).
  pull_request:
  push:
    branches: [main]
  merge_group:

# Least privilege: this job only reads the tree and validates it.
permissions:
  contents: read

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name = the required-check context in the merge-queue ruleset. Named
  # `gitops-validate` (not a bare `validate`) so the required context is
  # unambiguous.
  gitops-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # For the goTemplate render simulation in tools/gitops/appset_render. It
      # uses only the standard library (text/template), so no module download
      # happens here -- but the toolchain must be pinned rather than inherited
      # from whatever the runner image ships, or the gate's fidelity to the
      # ApplicationSet controller drifts with the image.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install kubeconform (pinned + checksum-verified)
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          # Keep the ORIGINAL filename (-O) so it matches the entry in CHECKSUMS
          # that `sha256sum -c` verifies against.
          # --retry: this is a REQUIRED check, so one transient GitHub-releases
          # blip reddens the merge queue for a reason unrelated to the change
          # under test. Retry transport errors AND HTTP 5xx/429
          # (--retry-all-errors), and bound each attempt with --max-time so a
          # hung CDN connection fails fast instead of burning the job timeout.
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 -O "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 -o CHECKSUMS "${base}/CHECKSUMS"
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf kubeconform-linux-amd64.tar.gz -C "${HOME}/.local/bin" kubeconform
          rm -f kubeconform-linux-amd64.tar.gz CHECKSUMS
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Validate gitops manifests
        run: bash tools/ci/gitops-validate.sh
