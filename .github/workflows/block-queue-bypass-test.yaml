# Guard for .claude/block-queue-bypass.sh, the Claude Code hook that stops an
# agent session merging a pull request past the merge queue (gh pr merge
# --admin, a direct merge through the API, a push to main). The test also
# asserts the hook is wired into .claude/settings.json: a correct script that
# nothing calls protects nothing.
name: Block Queue Bypass Test

on:
  pull_request:
    paths:
      - ".claude/block-queue-bypass.sh"
      - ".claude/settings.json"
      - "tools/ci/block-queue-bypass_test.sh"
      - ".github/workflows/block-queue-bypass-test.yaml"
  push:
    branches: [main]
    paths:
      - ".claude/block-queue-bypass.sh"
      - ".claude/settings.json"
      - "tools/ci/block-queue-bypass_test.sh"
      - ".github/workflows/block-queue-bypass-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run the queue-bypass hook tests
        run: bash tools/ci/block-queue-bypass_test.sh
