name: culprit-finder

# Mechanical bisection for a red nightly sweep (#501). The merge-queue /
# postsubmit lanes are affected-scoped, so a breakage the graph misattributed
# could have landed with ANY commit since the last green sweep — across a
# batch of merges. This workflow drives `git bisect run` over that range with
# `bazel test` on exactly the failing targets; the remote cache makes each
# midpoint roughly one incremental test run.
#
# Run it from the breakage issue periodic-full-sweep filed: the issue links
# the red run, the run log names the failing target(s), and the last green
# sweep run's commit is the `good` input. Supply `issue` to have the culprit
# posted back onto that issue.

on:
  workflow_dispatch:
    inputs:
      good:
        description: "Last known-GREEN commit SHA (e.g. the previous green sweep's commit)"
        required: true
        type: string
      bad:
        description: "Known-RED commit SHA (default: current main tip)"
        required: false
        type: string
      targets:
        description: "Space-separated failing Bazel target label(s) from the sweep log"
        required: true
        type: string
      issue:
        description: "Issue number to post the culprit onto (e.g. the sweep breakage issue)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: culprit-finder
  cancel-in-progress: false

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Bisect needs the full history + object graph of the range.
          fetch-depth: 0

      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          echo "Disk after cleanup:" && df -h /

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Bisect
        id: bisect
        env:
          GOOD_SHA: ${{ inputs.good }}
          BAD_SHA: ${{ inputs.bad || github.sha }}
          TARGETS: ${{ inputs.targets }}
          BAZEL_ARGS: "--config=remote --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}"
        run: bash tools/ci/bisect-culprit.sh

      - name: Post the culprit onto the breakage issue
        if: ${{ always() && inputs.issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the dispatch input through the environment and reference it as
          # "$ISSUE" below — never `${{ }}`-interpolate a workflow_dispatch input
          # straight into the script body (script-injection shape, even though
          # dispatch is maintainer-only). #824.
          ISSUE: ${{ inputs.issue }}
          RESULT: ${{ steps.bisect.outputs.culprit }}
          SUBJECT: ${{ steps.bisect.outputs.culprit_subject }}
        run: |
          # Guard: the target must be a plain issue number (gh accepts a number,
          # URL, or branch name — pin it to digits so a malformed input can't be
          # coerced into a different target or a flag).
          if ! printf '%s' "$ISSUE" | grep -Eq '^[0-9]+$'; then
            echo "::error::'issue' input must be a bare issue number, got: $ISSUE"
            exit 1
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$RESULT" ]; then
            body="culprit-finder: first bad commit is \`${RESULT}\` — ${SUBJECT} (bisect run: ${run_url})"
          else
            body="culprit-finder: bisect did NOT converge (flaky in range, or the good/bad inputs are wrong). Run: ${run_url}"
          fi
          gh issue comment "$ISSUE" --body "$body"
