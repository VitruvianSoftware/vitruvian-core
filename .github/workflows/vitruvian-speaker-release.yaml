# release-please and asset publisher for Vitruvian Speaker macOS app:
# 1. Authors release PRs from conventional commits under apps/desktop/vitruvian-speaker/.
# 2. When the release PR merges, cuts the GitHub Release (tag: vitruvian-speaker-vX.Y.Z).
# 3. Compiles a universal (arm64 + x86_64) Vitruvian Speaker.app on macOS, zips it
#    with a SHA-256 sidecar, and attaches both to the release.
name: vitruvian-speaker-release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/vitruvian-speaker/**"
      - ".github/workflows/vitruvian-speaker-release.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and upload (e.g. vitruvian-speaker-v1.0.0). Empty runs release-please."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: vitruvian-speaker-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs['apps/desktop/vitruvian-speaker--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/desktop/vitruvian-speaker--tag_name'] }}
      version: ${{ steps.release.outputs['apps/desktop/vitruvian-speaker--version'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token for the release PR
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      # GitHub refuses a branch update while its PR is in the merge queue. A
      # fix that lands on main while the release PR is queued then makes
      # release-please's push fail: the PR merges with stale notes and a tag
      # that holds the newer code (Courier 0.3.32 shipped #5268 and #5264 and
      # listed neither). Out of the queue it can be refreshed. After
      # release-please, `rearm` puts back a PR that release-please had nothing
      # to push to. See tools/ci/src/release_pr_dequeue/README.md.
      - name: Build //tools/ci:release_pr_dequeue (no Bazel on this job)
        id: dequeue-bin
        if: ${{ inputs.tag == '' }}
        uses: ./.github/actions/build-ci-tool
        with:
          tool: release_pr_dequeue

      - name: Take a stale release PR out of the merge queue
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-speaker
          CODE_PATH: apps/desktop/vitruvian-speaker
          MAIN_SHA: ${{ github.sha }}
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN"'

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.tag == '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: apps/desktop/vitruvian-speaker/release-please-config.json
          manifest-file: apps/desktop/vitruvian-speaker/.release-please-manifest.json
          target-branch: main

      # release-please pushes only when the release PR's text changes, so a PR
      # that was dequeued for a commit that adds nothing to its notes would stay
      # out of the queue. Put it back (a held, draft or already-armed PR is left alone).
      - name: Put the release PR back in the merge queue
        if: ${{ !cancelled() && steps.dequeue-bin.outcome == 'success' && (inputs.tag == '') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian-speaker
          DEQUEUE_BIN: ${{ steps.dequeue-bin.outputs.path }}
        run: '"$DEQUEUE_BIN" rearm'

  publish-package:
    needs: release-please
    if: ${{ always() && !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    # The same Xcode as CI and developers (.xcode-version); see ci.yaml.
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: vitruvian-speaker-publish-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode

      - name: Mint App token for the Homebrew tap
        id: tap-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: VitruvianSoftware
          repositories: homebrew-tap

      - name: Publish downloadable release package
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          # Optional: a Google Cloud "Desktop app" OAuth client with the Home
          # API enabled. When set, users can sign in without registering
          # their own project. Absent, the app still works via Settings >
          # Advanced (bring your own client) or an Antigravity import.
          VITRUVIAN_SPEAKER_GOOGLE_CLIENT_ID: ${{ secrets.HOMESPEAKER_GOOGLE_CLIENT_ID }}
          VITRUVIAN_SPEAKER_GOOGLE_CLIENT_SECRET: ${{ secrets.HOMESPEAKER_GOOGLE_CLIENT_SECRET }}
        run: |
          rustc --edition 2021 --crate-type lib --crate-name publish_lib apps/desktop/vitruvian-speaker/scripts/src/publish/lib.rs -o "$RUNNER_TEMP/libpublish_lib.rlib"
          rustc --edition 2021 apps/desktop/vitruvian-speaker/scripts/src/publish/main.rs -L "$RUNNER_TEMP" --extern publish_lib="$RUNNER_TEMP/libpublish_lib.rlib" -o "$RUNNER_TEMP/vitruvian-speaker-publish"
          "$RUNNER_TEMP/vitruvian-speaker-publish"

      # The job's last word, and not the publishing script's: ask GitHub what
      # the release holds. 1.12.0 and 1.13.0 were published with no files while
      # the step above printed success and this job was green. Every app
      # artifact, each checksum, and the tool zip the Vitruvian catalog
      # installs from must be on the release, or the job fails naming them.
      - name: Check the release has every file
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#vitruvian-speaker-v}"
          rustc --edition 2021 --crate-type lib --crate-name package_desktop tools/desktop-package/src/lib.rs -o "$RUNNER_TEMP/libpackage_desktop.rlib"
          rustc --edition 2021 tools/desktop-package/src/main.rs -L "$RUNNER_TEMP" --extern package_desktop="$RUNNER_TEMP/libpackage_desktop.rlib" -o "$RUNNER_TEMP/package-desktop"
          "$RUNNER_TEMP/package-desktop" --verify-only \
            --app-name "Vitruvian Speaker" --version "${version}" --tag "${TAG}" \
            --require-asset "VitruvianSpeaker-${version}-tool.zip"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
