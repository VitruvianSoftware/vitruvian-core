name: preview-teardown

on:
  pull_request:
    types: [closed]
  schedule:
    # Hourly ghost reaper sweep (at minute 17)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Targeted PR number to reap (leave empty for monorepo sweep)"
        required: false
        default: ""
      dry_run:
        description: "Run in dry-run mode (report candidates without deleting)"
        required: false
        type: boolean
        default: false

concurrency:
  group: preview-teardown-${{ github.event.pull_request.number || github.event.inputs.pr || 'cron' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  teardown:
    name: Reap Ephemeral Previews
    runs-on: ubuntu-latest
    environment: tabula-development
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Ephemeral Preview Reaper
        id: reaper
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PREVIEW_TTL_HOURS: 24
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == true) && '1' || '' }}
        run: |
          PR_TARGET="${{ github.event.pull_request.number || github.event.inputs.pr || '' }}"
          ./tools/ci/preview-reaper.sh ${PR_TARGET} >> "$GITHUB_OUTPUT"

      - name: Update PR Sticky Comment on Targeted Event
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/preview/pr-comment.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --app "tabula" \
            --status "teardown"

      - name: Publish Teardown Summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🧹 Ephemeral Preview Teardown & Reaper Report

          | Metric | Count |
          |---|---|
          | **Cloud Run Services Reaped** | \`${{ steps.reaper.outputs.reaped_cloudrun }}\` |
          | **Kubernetes Namespaces Reaped** | \`${{ steps.reaper.outputs.reaped_k8s }}\` |
          | **Neon DB Branches Reaped** | \`${{ steps.reaper.outputs.reaped_neon }}\` |
          | **Total Resources Reclaimed** | \`${{ steps.reaper.outputs.total_reaped }}\` |

          *Execution Mode:* \`${{ github.event_name }}\` (Target: \`${{ github.event.pull_request.number || github.event.inputs.pr || 'monorepo sweep' }}\`)
          EOF
