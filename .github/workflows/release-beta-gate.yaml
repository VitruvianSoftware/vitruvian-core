# Keep vitruvian's release PR out of auto-merge until the beta DMG has been
# built for the exact code the release would tag (tools/ci/release-beta-gate.sh
# has the decision and how it finds that build).
#
# WHY A GATE AND NOT A HOLD. release-hold.yaml reacts to a RED development
# deploy, so it can only stop a release PR that has not merged yet. For
# vitruvian that race is lost: release-please opens the release PR on the same
# push that runs `vitruvian-beta`, and the PR's CI can go green and merge before
# the beta finishes. That is how vitruvian-v3.6.0 was tagged ten minutes before
# the packaging fix landed, with no DMG, and a tag that cannot be re-published.
# So this PR waits by default: release-pr-automerge.yaml leaves it alone, and
# auto-merge is enabled here only once `vitruvian-beta` has SUCCEEDED for its
# code.
#
# WHEN IT EVALUATES. On every push `delivery-vitruvian` run that completes on
# main (the beta's result arrives), and on every release PR open/update
# (release-please rebuilt it on newer code, so an earlier green beta no longer
# counts and auto-merge is turned back off). workflow_dispatch re-runs it by
# hand.
#
# TOKEN CHOICE. Same as release-hold.yaml: auto-merge is enabled with the
# vitruvian-copybara-sync App token, the bypass actor on the merge queue's
# required-review rule (#804), or the PR would sit in REVIEW_REQUIRED.

name: release-beta-gate

on:
  workflow_run:
    # Matched by workflow NAME: vitruvian's generated delivery workflow.
    workflows: [delivery-vitruvian]
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Push runs of main carry the beta; a release or dispatch run does not. On
    # pull_request, only vitruvian's in-repo release PR.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'release-please--branches--main--components--vitruvian' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Evaluations are idempotent and each re-reads the current state, so queue
    # them rather than cancel: the last one to run sees the newest state.
    concurrency:
      group: release-beta-gate-vitruvian
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # `mint-sync-app-token` is a LOCAL composite action; GitHub can't resolve
      # `uses: ./...` without the repo already checked out onto the runner.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mint App token
        id: app-token
        uses: ./.github/actions/mint-sync-app-token
        with:
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Gate vitruvian's release PR on the beta DMG
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMPONENT: vitruvian
          CODE_PATH: apps/desktop/vitruvian
          BETA_JOB: vitruvian-beta
          WORKFLOW: delivery-vitruvian.yaml
          # vitruvian delivered through the shared delivery.yaml before the
          # per-app split; code that workflow built is judged by its runs.
          LEGACY_WORKFLOW: delivery.yaml
        run: bash tools/ci/release-beta-gate.sh
