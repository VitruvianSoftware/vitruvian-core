# Supply-chain gates: the class of check this repo had NONE of.
#
# Before this, the only dependency-security surface was Dependabot version
# bumps -- which alert AFTER a vulnerable dependency is already on main -- and
# GitHub secret scanning, which covers known PROVIDER patterns only
# (`secret_scanning_non_provider_patterns` is off, so a generic token or a
# private key pasted into a file raised nothing). Neither BLOCKS a merge.
#
# One REQUIRED merge-queue check (repo_config/main.go):
#   secret-scan — gitleaks over the commits the change ADDS.
# A dependency-review job is deferred on an unmet prerequisite; see below.
#
# NO workflow-level `paths:` filter, deliberately: a required check behind a
# path filter never reports on PRs outside those paths and wedges them
# "pending" forever. `//tools/conformance:check` asserts exactly this.
#
# The job uses the repo's run-then-noop-green shape so it ALWAYS reports a
# result on every event, including merge_group.

name: Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Blocks a PR that introduces a dependency with a known advisory -- the
  # pre-merge counterpart to Dependabot, which only opens a fix PR once the
  # vulnerable version is already on main.
  #
  # This was deferred at first because the action needs the GitHub Dependency
  # graph, which was OFF (the org sets
  # dependency_graph_enabled_for_new_repositories=false, so
  # /dependency-graph/sbom 404'd and the action hard-errored). It is now ON, via
  # `bazel run //tools/github-security:enable-dependency-graph` -- an org code
  # security configuration attached to this repo alone, since pulumi-github
  # v6.14.0 exposes dependency-graph on the ORGANIZATION resource only and
  # repo_config therefore cannot express it. Re-run that target if this job ever
  # starts failing with "not supported on this repository".
  #
  # The action only does useful work on a pull_request (it diffs the dependency
  # graph between base and head), but the JOB is unconditional so it always
  # reports a result -- the run-then-noop-green shape every required check in
  # this repo uses. A required check that is sometimes skipped leaves the merge
  # queue pending forever.
  # ⚠ BEFORE MAKING THIS REPOSITORY PRIVATE — READ THIS.
  #
  # Dependency review is free on PUBLIC repositories. On a PRIVATE repository it
  # requires GitHub Code Security (paid, per active committer). Flipping this
  # repo to private without acting FIRST breaks merges outright, because
  # dependency-review is a REQUIRED check (repo_config/main.go): the action
  # starts hard-erroring, the required check goes red on every PR, and the merge
  # queue blocks everything.
  #
  # Two supported paths, both to be taken BEFORE the visibility flip:
  #   a) Keep the gate — buy GitHub Code Security, and set advanced_security to
  #      `code_security` on the `dependency-graph-only` configuration
  #      (org code-security configurations; //tools/github-security).
  #   b) Drop the gate — remove "dependency-review" from the required-check list
  #      in repo_config/main.go and delete this job. //tools/conformance:check
  #      enforces that those two stay in sync, so a half-done removal fails CI
  #      rather than wedging the queue.
  #
  # Note the companion billing hazard: the configuration that enables the
  # dependency graph must set advanced_security=enabled (the API rejects a GHAS
  # feature without it, and it cannot be `not_set`). That is free while this repo
  # is public and BILLABLE once it is private. //tools/github-security's target
  # refuses to run against a non-public repo without explicit confirmation.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          # Block on high+ severity. Advisories below that would make the gate
          # noisy enough to be routinely bypassed, which is worse than not
          # having it.
          fail-on-severity: high
          # Deny licences that would contaminate this MIT repo. Kept narrow on
          # purpose: a broad denylist fails on transitive dev-only packages and
          # trains people to ignore the gate.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later

      - name: Not a pull request — nothing to diff
        if: github.event_name != 'pull_request'
        run: echo "dependency-review only diffs on pull_request; reporting green."

  secret-scan:
    # gitleaks over the commits this change introduces. Diff-scoped on purpose:
    # the repo carries known historical findings (a rotated BuildBuddy key, an
    # old local-dev kubeconfig), and a permanently-red gate is one everybody
    # learns to ignore. See tools/ci/secret-scan.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan range is resolved against the merge-base / before-rev.
          fetch-depth: 0

      - name: Scan added commits for secrets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BASE_REV: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: bash tools/ci/secret-scan.sh
