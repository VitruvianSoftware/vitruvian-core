# Supply-chain gates: the class of check this repo had NONE of.
#
# Before this, the only dependency-security surface was Dependabot version
# bumps -- which alert AFTER a vulnerable dependency is already on main -- and
# GitHub secret scanning, which covers known PROVIDER patterns only
# (`secret_scanning_non_provider_patterns` is off, so a generic token or a
# private key pasted into a file raised nothing). Neither BLOCKS a merge.
#
# One REQUIRED merge-queue check (repo_config/main.go):
#   secret-scan — gitleaks over the commits the change ADDS.
#   osv-scan    — google/osv-scanner over the lockfiles.
#
# NO workflow-level `paths:` filter, deliberately: a required check behind a
# path filter never reports on PRs outside those paths and wedges them
# "pending" forever. `//tools/conformance:check` asserts exactly this.
#
# The job uses the repo's run-then-noop-green shape so it ALWAYS reports a
# result on every event, including merge_group.

name: Supply Chain

on:
  # NO `branches:` filter on pull_request: this backs required checks
  # (osv-scan, secret-scan), and `branches: [main]` filters on the PR's BASE
  # branch -- a stacked PR's base isn't main, so this never ran on one (see
  # ci.yaml's `on:` block for the full incident).
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # Nightly, so osv-scan is CONTINUOUS monitoring and not only a pre-merge gate.
  #
  # This is what makes dropping GitHub's dependency graph safe. Dependabot ALERTS
  # are built on that graph, and the graph is only on here via a code security
  # configuration that must also set advanced_security -- free while this repo is
  # public, billed per active committer once it is private. Removing that config
  # therefore removes the alerts too.
  #
  # A pre-merge gate alone does not replace them: it catches a vulnerable
  # dependency you INTRODUCE, but nothing notices a NEW advisory published
  # against a dependency you already ship. That is precisely what the alerts did.
  # A nightly scan restores it, for free, at any repository visibility -- and
  # covers Cargo and PyPI, which the graph handled poorly here.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC, an hour after the nightly full sweep

permissions:
  contents: read

# Cancel a PR's in-flight run when a newer push to the SAME PR supersedes it;
# never drop a push-to-main or merge_group verdict.
#
# `cancel-in-progress: false` is NOT sufficient on its own: GitHub also cancels
# an already-PENDING run in a group when a newer one queues behind the running
# one. A ref-keyed group therefore put every push-to-main run in ONE group
# (`refs/heads/main`), so a burst of merges silently evicted the middle
# commits' still-pending runs -- observed on main: fb3859bd (2026-07-28,
# evicted 34s later by e1f98538) and 322f7ea7 (2026-07-29, evicted by
# 496dbb67). Those commits landed with no postsubmit verdict at all.
#
# `github.sha` is unique per commit, so every pushed commit gets its own group
# and its own verdict: nothing cancels it, nothing queues it behind a sibling.
# Same pattern as tabula-e2e.yaml (#1311); guarded by //tools/conformance:check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Blocks a PR whose lockfiles contain a dependency with a known advisory --
  # the pre-merge counterpart to Dependabot, which only opens a fix PR once the
  # vulnerable version is already on main.
  #
  # This replaced GitHub's `dependency-review`. That action reads GitHub's
  # DEPENDENCY GRAPH, an Advanced Security feature: free on public repositories,
  # BILLED PER ACTIVE COMMITTER on private ones. Verified against the API, the
  # code security configuration enabling the graph cannot omit
  # advanced_security (accepted values are only
  # enabled|disabled|code_security|secret_protection), so as a REQUIRED check it
  # could not survive this repo turning private without either an invoice or a
  # wedged merge queue -- the action hard-errors the moment the graph is gone.
  #
  # osv-scanner reads the LOCKFILES directly against the public OSV database:
  # free at any visibility, runnable locally (`bazel run //tools/osv-scan`,
  # which dependency-review could never be), and it also covers Cargo and PyPI.
  #
  # The JOB is unconditional so it always reports on every event including
  # merge_group -- the run-then-noop-green shape every required check here uses.
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The scan always covers the WHOLE tree; the base is used only to ask
          # whether this change touched a dependency manifest, which decides
          # block-vs-report when advisories are found. See tools/osv-scan.
          fetch-depth: 0

      # Logic lives in tools/ci/install-pinned-tool.sh (shared with
      # actionlint.yaml, gitops-validate.yaml, mcp-slack-image.yaml — see that
      # script's header for why this was deduped).
      # NOTE: this hardens fetching the SCANNER BINARY only. #1192 tracks the
      # separate deps.dev resolution SPOF *inside* the scan itself.
      - name: Install osv-scanner (pinned + checksum-verified)
        env:
          OSV_SCANNER_VERSION: v2.4.0
        run: |
          bash tools/ci/install-pinned-tool.sh \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}" \
            osv-scanner_linux_amd64 \
            osv-scanner_SHA256SUMS \
            ' osv-scanner_linux_amd64$' \
            osv-scanner --raw

      # The scan itself is always full-tree. BASE_REF/BASE_REV are used ONLY to
      # decide whether found advisories block or report: a change that touches no
      # dependency manifest cannot have introduced one, so blocking it would halt
      # unrelated work for a vulnerability already present in the base (this
      # wedged the merge queue on 2026-07-27, GO-2026-5841). Both resolve empty
      # on schedule/dispatch, and the script fails CLOSED without a base -- so the
      # nightly run still blocks on the entire advisory set.
      - name: Scan lockfiles for known advisories
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BASE_REV: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: bash tools/osv-scan/osv-scan.sh

  secret-scan:
    # gitleaks over the commits this change introduces. Diff-scoped on purpose:
    # the repo carries known historical findings (a rotated BuildBuddy key, an
    # old local-dev kubeconfig), and a permanently-red gate is one everybody
    # learns to ignore. See tools/ci/secret-scan.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The scan range is resolved against the merge-base / before-rev.
          fetch-depth: 0

      # Skipped on the nightly schedule: this gate is DIFF-scoped, and a schedule
      # run has no diff base at all (both vars below resolve empty), so it would
      # fall back to scanning the whole history and trip over the repo's known
      # historical findings -- a nightly red that means nothing. The nightly run
      # exists for osv-scan, which is the check that benefits from it. secret-scan
      # still runs on every pull_request/push/merge_group, so its required-check
      # behaviour is unchanged.
      - name: Scan added commits for secrets
        if: github.event_name != 'schedule'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BASE_REV: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: bash tools/ci/secret-scan.sh
