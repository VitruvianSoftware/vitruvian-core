# Supply-chain gates: the class of check this repo had NONE of.
#
# Before this, the only dependency-security surface was Dependabot version
# bumps -- which alert AFTER a vulnerable dependency is already on main -- and
# GitHub secret scanning, which covers known PROVIDER patterns only
# (`secret_scanning_non_provider_patterns` is off, so a generic token or a
# private key pasted into a file raised nothing). Neither BLOCKS a merge.
#
# Two jobs, both REQUIRED merge-queue checks (repo_config/main.go):
#   dependency-review — refuses a PR that introduces a dependency with a known
#                       vulnerability, before it reaches main.
#   secret-scan       — gitleaks over the commits the change ADDS.
#
# NO workflow-level `paths:` filter, deliberately: a required check behind a
# path filter never reports on PRs outside those paths and wedges them
# "pending" forever. `//tools/conformance:check` asserts exactly this.
#
# Both jobs use the repo's run-then-noop-green shape so they ALWAYS report a
# result on every event, including merge_group.

name: Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    # Blocks a PR that ADDS a dependency carrying a known advisory. This is the
    # pre-merge counterpart to Dependabot security updates, which only open a
    # fix PR once the vulnerable version is already on main.
    #
    # The action is inherently pull_request-scoped: it diffs the dependency
    # graph between the PR base and head, which only exists in a PR context. On
    # push / merge_group / dispatch the job therefore runs and reports green
    # without doing work -- required checks must always report, and the PR lane
    # has already vetted the very commits the queue is merging.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Start at the level that is unambiguously actionable. Raising this to
          # `low` is a one-word change once the signal proves quiet.
          fail-on-severity: high
          # Licence review is intentionally NOT enabled here: //tools/license
          # already owns first-party licensing, and third-party licence policy
          # deserves its own decision rather than riding in on a security gate.
          comment-summary-in-pr: on-failure

      - name: Not a pull request — nothing to diff
        if: github.event_name != 'pull_request'
        run: echo "dependency-review only applies to pull_request events; reporting green."

  secret-scan:
    # gitleaks over the commits this change introduces. Diff-scoped on purpose:
    # the repo carries known historical findings (a rotated BuildBuddy key, an
    # old local-dev kubeconfig), and a permanently-red gate is one everybody
    # learns to ignore. See tools/ci/secret-scan.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan range is resolved against the merge-base / before-rev.
          fetch-depth: 0

      - name: Scan added commits for secrets
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BASE_REV: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: bash tools/ci/secret-scan.sh
