name: Copybara Export (pulumi_ts-example-foundation)

# EXPORT-ONLY mirror: monorepo pulumi/examples/ts-foundation/ ->
# VitruvianSoftware/pulumi_ts-example-foundation (repo root), SQUASH mode. Thin
# caller; the export_pulumi_ts_example_foundation workflow (workspace:* foundation-*
# -> published npm versions) is in tools/copybara/copy.bara.sky. npm re-derives the
# lockfile on install.
#
# FIRST seed (no MONOREPO_REV_ID baseline yet): dispatch with
# '--init-history --force --ignore-noop'; INSPECT the push. Normal runs: --ignore-noop.
on:
    push:
        branches: [main]
        paths: ["pulumi/examples/ts-foundation/**"]
    workflow_dispatch:
        inputs:
            copybara_options:
                description: "Copybara CLI options. First seed: '--init-history --force --ignore-noop'. Normal runs: --ignore-noop."
                default: "--ignore-noop"
                required: false

permissions:
    contents: read

concurrency:
    group: copybara-export-pulumi-ts-example-foundation
    cancel-in-progress: false

jobs:
    export:
        uses: ./.github/workflows/_copybara-export.yaml
        with:
            component: pulumi_ts-example-foundation
            standalone_only: ".github/workflows/ci.yml .github/workflows/e2e.yml .github/workflows/release.yml .github/workflows/commitlint.yml"
            copybara_options: ${{ github.event.inputs.copybara_options || '--ignore-noop' }}
        secrets:
            sync_ssh_key: ${{ secrets.PULUMI_TS_EXAMPLE_FOUNDATION_SYNC_SSH_KEY }}
