# Publishes a rolling "dev-latest" extension bundle on every main commit that
# touches the extension. The fixed prerelease tag tabula-extension-dev-latest
# hosts two assets, overwritten per run:
#   tabula-extension-chrome.zip  — the dist_release bundle with build_info.json
#                                  stamped to the real commit (injected POST
#                                  Bazel build: the webpack action must stay
#                                  hermetic, see tabula/extension/webpack.config.js)
#   build_info.json              — the same identity, downloadable on its own
# Consumed by `tabcli ext update` and the in-extension update banner (#45).
# Release-please owns tabula-extension-v* tags; this fixed tag never collides.

name: tabula-dev-latest

on:
  # DISPATCH-ONLY SHELL, pending deletion in PHASE 3 (delivery-orchestrator
  # spec §6, docs/superpowers/specs/2026-08-19-delivery-orchestrator-design.md).
  #
  # The `push:` trigger was deleted by PHASE 2 (Wave B2): the generated
  # .github/workflows/delivery.yaml now owns this unit's push lane as
  # ``tabula-dev-latest-publish``, transcribing the `publish` job below step for step, off the same
  # shared graph universe (the delivery() declaration in tabula/extension/BUILD
  # carries the identical graph_targets pair, so the bundle and the API still
  # re-stamp commit for commit) — asserted mechanically
  # against THIS file by //tools/delivery/gen's parity tests. Leaving `push:`
  # here as well would have BOTH workflows do the same work on every merge, racing two uploads onto one rolling
  # prerelease tag.
  #
  # CONSEQUENCE, intentional: every `github.event_name == 'push'` arm below is
  # now DEAD CODE. It is left untouched so that reverting Phase 2 is restoring
  # one trigger rather than reconstructing a lane; Phase 3 deletes the file.
  #
  # `workflow_dispatch` survives as the break-glass escape hatch; the generated
  # workflow has an equivalent (unit + environment inputs), which is what makes
  # that deletion possible.
  # Manual re-publish (e.g. after a gate false-negative or a lost release
  # asset) -- the gate is skipped and the bundle is stamped unconditionally.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabula-dev-latest
  cancel-in-progress: true

jobs:
  # Same gate as tabula-deploy.yaml (#498): fail-open, deploy-artifact
  # universe = API image + extension bundle, non-graph inputs by path.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # `actions: read` is the ONLY new grant this gate needs (#1351) -- it
      # lets resolve-deploy-base.sh query this workflow's own run history via
      # the GitHub Actions API. No GCP IAM change: this job never talks to
      # Cloud Run. It also does not need id-token: write (no GCP auth here).
      actions: read
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      - name: Resolve the durable deploy base (#1351)
        id: durable-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: tabula-dev-latest.yaml
        run: bash tools/ci/resolve-deploy-base.sh
      - name: Decide whether the deploy artifacts are affected
        id: decide
        env:
          # See tabula-deploy.yaml's gate job for why github.event.before alone
          # is unsafe here (#1351: constant concurrency group + #1311/#1335
          # eviction). Empty is falsy in GH Actions expressions.
          BEFORE_REV: ${{ steps.durable-base.outputs.base_sha || github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          DEPLOY_TARGETS: "//tabula/api:image_push //tabula/extension:chrome_zip"
          EXTRA_PATH_REGEX: "tabula/infra/app/|\\.github/workflows/tabula-deploy\\.yaml|\\.github/workflows/tabula-dev-latest\\.yaml"
        run: bash tools/ci/deploy-affected.sh

  publish:
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.result == 'failure' || needs.gate.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build extension bundle
        env:
          # Cache-only (see --config=remotecache-ci in tools/remote.bazelrc): reuse
          # the chrome_zip build CI already cached; outputs stay local for the cp.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel build --config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" //tabula/extension:chrome_zip

      - name: Stamp build identity into the bundle
        run: |
          cp bazel-bin/tabula/extension/tabula-extension-chrome.zip \
            "$RUNNER_TEMP/tabula-extension-chrome.zip"
          chmod +w "$RUNNER_TEMP/tabula-extension-chrome.zip"
          VERSION="$(node -p "require('./tabula/extension/package.json').version")"
          cd "$RUNNER_TEMP"
          printf '{"commit":"%s","builtAt":"%s","version":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VERSION" \
            > build_info.json
          # zip updates the existing (placeholder) entry in place
          zip -q tabula-extension-chrome.zip build_info.json

      - name: Publish to the rolling dev-latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: tabula-extension-dev-latest
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "tabula-extension dev-latest (rolling)" \
              --notes "Rolling dev bundle; assets overwritten on every main commit."
          # build_info.json is also published standalone so tooling can check
          # the latest identity without downloading the bundle (M2 pinning).
          gh release upload "$TAG" \
            "$RUNNER_TEMP/tabula-extension-chrome.zip" \
            "$RUNNER_TEMP/build_info.json" \
            --clobber
          gh release edit "$TAG" \
            --notes "commit: ${GITHUB_SHA} — built $(date -u +%Y-%m-%dT%H:%M:%SZ)"
