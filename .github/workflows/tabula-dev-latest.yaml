# Publishes a rolling "dev-latest" extension bundle on every main commit that
# touches the extension. The fixed prerelease tag tabula-extension-dev-latest
# hosts two assets, overwritten per run:
#   tabula-extension-chrome.zip  — the dist_release bundle with build_info.json
#                                  stamped to the real commit (injected POST
#                                  Bazel build: the webpack action must stay
#                                  hermetic, see tabula/extension/webpack.config.js)
#   build_info.json              — the same identity, downloadable on its own
# Consumed by `tabcli ext update` and the in-extension update banner (#45).
# Release-please owns tabula-extension-v* tags; this fixed tag never collides.

name: tabula-dev-latest

on:
  push:
    # No `paths:` filter (#498): the `gate` job below decides via the Bazel
    # graph, with the SAME artifact-pair universe as tabula-deploy.yaml -- the
    # banner clears only when the published bundle's commit equals the
    # deployed API's commit, so both workflows must agree, commit for commit,
    # on what re-stamps. Two independent path unions could drift; one shared
    # graph gate cannot.
    branches: [main]
  # Manual re-publish (e.g. after a gate false-negative or a lost release
  # asset) -- the gate is skipped and the bundle is stamped unconditionally.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabula-dev-latest
  cancel-in-progress: true

jobs:
  # Same gate as tabula-deploy.yaml (#498): fail-open, deploy-artifact
  # universe = API image + extension bundle, non-graph inputs by path.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      - name: Decide whether the deploy artifacts are affected
        id: decide
        env:
          BEFORE_REV: ${{ github.event.before }}
          FORCED_PUSH: ${{ github.event.forced }}
          DEPLOY_TARGETS: "//tabula/api:image_push //tabula/extension:chrome_zip"
          EXTRA_PATH_REGEX: "infrastructure/pulumi/tabula/|\\.github/workflows/tabula-deploy\\.yaml|\\.github/workflows/tabula-dev-latest\\.yaml"
        run: bash tools/ci/deploy-affected.sh

  publish:
    needs: [gate]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build extension bundle
        env:
          # Cache-only (see --config=remotecache in tools/remote.bazelrc): reuse
          # the chrome_zip build CI already cached; outputs stay local for the cp.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel build --config=remotecache --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" //tabula/extension:chrome_zip

      - name: Stamp build identity into the bundle
        run: |
          cp bazel-bin/tabula/extension/tabula-extension-chrome.zip \
            "$RUNNER_TEMP/tabula-extension-chrome.zip"
          chmod +w "$RUNNER_TEMP/tabula-extension-chrome.zip"
          VERSION="$(node -p "require('./tabula/extension/package.json').version")"
          cd "$RUNNER_TEMP"
          printf '{"commit":"%s","builtAt":"%s","version":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VERSION" \
            > build_info.json
          # zip updates the existing (placeholder) entry in place
          zip -q tabula-extension-chrome.zip build_info.json

      - name: Publish to the rolling dev-latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: tabula-extension-dev-latest
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "tabula-extension dev-latest (rolling)" \
              --notes "Rolling dev bundle; assets overwritten on every main commit."
          # build_info.json is also published standalone so tooling can check
          # the latest identity without downloading the bundle (M2 pinning).
          gh release upload "$TAG" \
            "$RUNNER_TEMP/tabula-extension-chrome.zip" \
            "$RUNNER_TEMP/build_info.json" \
            --clobber
          gh release edit "$TAG" \
            --notes "commit: ${GITHUB_SHA} — built $(date -u +%Y-%m-%dT%H:%M:%SZ)"
