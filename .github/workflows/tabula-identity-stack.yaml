# CI apply for the per-env tabula DEPLOY/RUNTIME IDENTITY stacks
# (tabula/infra/identity): the per-env deploy + runtime service
# accounts on each prj-{env}-bu1-oss-floating project, their foundation-pool WIF
# bindings, per-app least-privilege IAM, and — for the DEV stack — the
# custom-domain verification anchor (secretAccessor grants on the human-seeded
# CLOUDFLARE_API_TOKEN secret for all three env deploy SAs). The
# siteverification.googleapis.com enable that each env's self-verify path needs
# lives in the foundation project factory's ActivateApis for every
# prj-{env}-bu1-oss-floating project, NOT in this stack (declared as the
# project owner; the API itself is console-only — see the ordering note).
#
# PROMOTION CHAIN: applies SEQUENTIALLY development -> nonproduction ->
# production (each `needs:` the previous, mirroring the app-deploy and
# foundation-release chains) — never the old all-envs-at-once matrix. Each leg
# runs via the reusable _tabula-identity-apply.yaml and is independently
# reviewer-gated by its own foundation-proj-<env> GitHub Environment.
#
# IDENTITY (chicken-and-egg): the deploy SA this stack CREATES cannot be the
# identity that APPLIES it. Each leg instead runs as its PER-ENV
# foundation-proj-<env> service account — the stage-4 projects SA for that leaf
# (which created the env's oss-floating project and set its IAM in stage-4, so it
# covers deploy/runtime SA create, per-app project IAM, and secret IAM with NO
# additional role grant). The app deploy SA is deliberately NOT this workflow's
# identity.
#
# COLD-DEPLOY ORDERING (the app promotion chain + domain verification depend on
# this stack AND on the foundation stage-4 projects leaves):
#   0. Foundation stage-4 gcp-projects-<env> apply (foundation-proj-deploy
#      workflow) — declares siteverification.googleapis.com on each env's
#      prj-{env}-bu1-oss-floating via its ActivateApis — PLUS the one-time
#      MANUAL console enable of that API per project (it is console-only; see
#      tools/ci/ensure-site-verification.sh). Both MUST precede step 3 for
#      that env (the self-verify getToken WRITE 403s until the API is on).
#   1. repo_config apply — creates the per-env tabula-<env>
#      GitHub Environments + their WIF vars.
#   2. THIS workflow (development leg) — mints the dev deploy/runtime SAs and
#      grants every env deploy SA secretAccessor on the dev CLOUDFLARE_API_TOKEN
#      secret. (nonproduction / production legs mint their own SAs; they carry
#      no verification-anchor resources.)
#   3. Each env's deploy leg (_deploy-cloud-run.yaml "Ensure custom-domain
#      ownership" step) — federates THAT env's deploy SA, reads the Cloudflare
#      token from the dev project's Secret Manager, and (with the env's OWN
#      project as the Site Verification quota project, enabled in step 0)
#      SELF-verifies the zone as itself; then that env's DomainMapping create
#      is authorized. Ownership is per-caller — there is no delegation.
# Steps 0 and 2 must both have completed once before step 3 can ever succeed.

name: tabula Identity Stack Deploy

on:
  # DISPATCH-ONLY SHELL, pending deletion in PHASE 3 (delivery-orchestrator
  # spec §6, docs/superpowers/specs/2026-08-19-delivery-orchestrator-design.md).
  #
  # The `push:` trigger was deleted by PHASE 2 (Wave B2): the generated
  # .github/workflows/delivery.yaml now owns this unit's push lane as
  # ``tabula-identity-{development,nonproduction,production}``, calling the SAME _tabula-identity-apply.yaml with the same
  # stack + gh-environment inputs, chained in the same order — asserted mechanically
  # against THIS file by //tools/delivery/gen's parity tests. Leaving `push:`
  # here as well would have BOTH workflows do the same work on every merge, racing two Pulumi applies on one stack.
  #
  # CONSEQUENCE, intentional: every `github.event_name == 'push'` arm below is
  # now DEAD CODE. It is left untouched so that reverting Phase 2 is restoring
  # one trigger rather than reconstructing a lane; Phase 3 deletes the file.
  #
  # `workflow_dispatch` survives as the break-glass escape hatch; the generated
  # workflow has an equivalent (unit + environment inputs), which is what makes
  # that deletion possible.
  workflow_dispatch:
    inputs:
      environment:
        description: Which env stack(s) to apply (a push, or "all", runs the full dev->nonprod->prod chain)
        type: choice
        required: true
        default: all
        options:
          - all
          - development
          - nonproduction
          - production

permissions:
  contents: read
  id-token: write

jobs:
  # development — the anchor leg (Cloudflare-token secretAccessor grants).
  development:
    if: >-
      ${{ github.event_name == 'push'
          || inputs.environment == 'all'
          || inputs.environment == 'development' }}
    uses: ./.github/workflows/_tabula-identity-apply.yaml
    with:
      stack: development
      gh-environment: foundation-proj-development
    secrets: inherit

  # nonproduction — after development succeeds on a push / "all" run; directly
  # targetable via a single-env dispatch (development is then skipped).
  nonproduction:
    needs: [development]
    if: >-
      ${{ !cancelled()
          && ( ((github.event_name == 'push' || inputs.environment == 'all') && needs.development.result == 'success')
               || (github.event_name == 'workflow_dispatch' && inputs.environment == 'nonproduction') ) }}
    uses: ./.github/workflows/_tabula-identity-apply.yaml
    with:
      stack: nonproduction
      gh-environment: foundation-proj-nonproduction
    secrets: inherit

  # production — after nonproduction succeeds on a push / "all" run; directly
  # targetable via a single-env dispatch (the earlier legs are then skipped).
  production:
    needs: [nonproduction]
    if: >-
      ${{ !cancelled()
          && ( ((github.event_name == 'push' || inputs.environment == 'all') && needs.nonproduction.result == 'success')
               || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ) }}
    uses: ./.github/workflows/_tabula-identity-apply.yaml
    with:
      stack: production
      gh-environment: foundation-proj-production
    secrets: inherit
