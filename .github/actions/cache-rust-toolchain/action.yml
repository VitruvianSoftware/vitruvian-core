name: Cache Rust toolchain
description: Restore and (on main only) save a minimal rustup toolchain, verifying cached binaries before use.

inputs:
  version:
    description: Rust toolchain version to install (e.g. 1.98.1).
    required: true

outputs:
  cache-hit:
    description: Whether an exact-key toolchain cache hit occurred.
    value: ${{ steps.cache-restore.outputs.cache-hit == 'true' || steps.cache-save.outputs.cache-hit == 'true' }}
  toolchain-dir:
    description: Path to the cached rustup toolchain directory.
    value: ${{ steps.cache-key.outputs.path }}

runs:
  using: composite
  steps:
    - name: Compute Rust toolchain cache key and path
      id: cache-key
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUST_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "${RUST_VERSION}" ]; then
          echo "::error::inputs.version must not be empty" >&2
          exit 1
        fi
        rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
        host_triple="$({ rustc -vV 2>/dev/null || true; } | awk '/^host:/ { print $2 }')"
        if [ -z "$host_triple" ]; then
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64) host_triple="x86_64-unknown-linux-gnu" ;;
            Linux:ARM64) host_triple="aarch64-unknown-linux-gnu" ;;
            macOS:ARM64) host_triple="aarch64-apple-darwin" ;;
            macOS:X64) host_triple="x86_64-apple-darwin" ;;
            *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
        fi
        echo "path=${rustup_home}/toolchains/${RUST_VERSION}-${host_triple}" >> "$GITHUB_OUTPUT"
        # Bump the v1 segment to drop a bad cache entry.
        echo "key=rustup-toolchain-v1-${RUNNER_OS}-${RUNNER_ARCH}-${RUST_VERSION}-minimal" >> "$GITHUB_OUTPUT"

    - name: Restore Rust toolchain cache (read-only)
      id: cache-restore
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.cache-key.outputs.path }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Restore and save Rust toolchain cache (main only)
      id: cache-save
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.cache-key.outputs.path }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Install or verify Rust toolchain
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit == 'true' || steps.cache-save.outputs.cache-hit == 'true' }}
        TOOLCHAIN_DIR: ${{ steps.cache-key.outputs.path }}
        RUST_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        verify_toolchain() {
          if [ ! -x "${TOOLCHAIN_DIR}/bin/rustc" ] || [ ! -x "${TOOLCHAIN_DIR}/bin/cargo" ]; then
            return 1
          fi
          local probe_dir rc=0
          probe_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rust-probe.XXXXXX")"
          printf 'fn main(){}\n' > "${probe_dir}/probe.rs"
          if ! "${TOOLCHAIN_DIR}/bin/rustc" "${probe_dir}/probe.rs" -o "${probe_dir}/probe" >/dev/null 2>&1; then
            rc=1
          elif ! "${TOOLCHAIN_DIR}/bin/cargo" --version >/dev/null 2>&1; then
            rc=1
          fi
          rm -rf "${probe_dir}"
          return "${rc}"
        }

        if [ "${CACHE_HIT}" = "true" ]; then
          if ! verify_toolchain; then
            echo "::warning::Cached Rust toolchain at ${TOOLCHAIN_DIR} failed verification; reinstalling"
            rm -rf "${TOOLCHAIN_DIR}"
            rustup toolchain install "${RUST_VERSION}" --profile minimal
            if ! verify_toolchain; then
              echo "::error::Rust toolchain ${RUST_VERSION} failed verification after reinstall" >&2
              exit 1
            fi
          fi
        else
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          if ! verify_toolchain; then
            echo "::error::Rust toolchain ${RUST_VERSION} failed verification after install" >&2
            exit 1
          fi
        fi
