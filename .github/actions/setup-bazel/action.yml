# Canonical Bazel setup for the monorepo's CI lanes: the pinned setup-bazel
# action with the repo's standard caches and CI bazelrc, in one place so the
# ~14 inline copies don't drift. The action pin is bumped here once (Dependabot
# tracks action.yml files in the github-actions ecosystem).
#
# Requires the repo to be checked out first (composite actions referenced as
# `./.github/actions/...` resolve from the workspace). Every caller does
# actions/checkout before this step.
name: Set up Bazel
description: Install Bazel (bazelisk) with the repo's standard caches and CI bazelrc.

runs:
  using: composite
  steps:
    # LLVM's prebuilt linker needs libxml2.so.2; Ubuntu 26.04 no longer ships it.
    #
    # toolchains_llvm hands us the official LLVM 19.1.7 Linux-X64 release, whose
    # ld.lld is dynamically linked against libxml2.so.2 (checked with objdump -p;
    # 22.1.8 needs it too, and 23.1.2 swaps it for ICU 70, which neither 24.04
    # nor 26.04 ships). 26.04 carries only the new ABI, libxml2-16 (.so.16), so
    # without this every C/C++/Rust link fails with "error while loading shared
    # libraries: libxml2.so.2" before it starts.
    #
    # Fix: install noble's libxml2 2.9.14 plus the libicu74 it links against.
    # Both use sonames 26.04 does not have, so they sit BESIDE the system
    # libxml2-16 / libicu rather than replacing anything. Checksum-pinned.
    #
    # A no-op wherever libxml2.so.2 already exists (24.04, macOS), so it costs
    # nothing there. REMOVE THIS once the C++ toolchain no longer needs the
    # host's libxml2 (#2425: a self-contained LLVM build).
    #
    # The archive drops a version when a security update supersedes it (3.9 → 3.10
    # on 2026-10-25 turned the primary URL into a 404 and left every run on the
    # Launchpad fallback, which was returning 502/503). The fallback is now
    # snapshot.ubuntu.com, which keeps every published file at a fixed timestamp,
    # so the pinned checksum always has a working URL.
    #
    # To survive Ubuntu mirror outages (e.g. 2026-11-11 archive.ubuntu.com DNS
    # outage), GitHub-hosted Linux jobs restore the pre-downloaded .debs from
    # the `ci-debs-1-linux-x64-<sha256s>` Actions cache (saved by
    # bazel-repo-cache.yaml on main), verify checksums, and fall back to the
    # mirror list only on a cache miss or checksum mismatch. The URLs and
    # sha256s live in one place: ./.github/actions/setup-bazel/libxml2_debs.sh.
    - name: Check libxml2.so.2 and ci-debs cache key
      id: ci-debs
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if bash "${GITHUB_ACTION_PATH}/libxml2_debs.sh" has-libxml2; then
          echo "libxml2.so.2 already present -- nothing to do"
          echo "needed=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        sha_key="$(bash "${GITHUB_ACTION_PATH}/libxml2_debs.sh" sha-key)"
        {
          echo "needed=true"
          echo "path=${HOME}/.cache/ci-debs"
          echo "sha_key=${sha_key}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore LLVM linker .debs cache
      if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && steps.ci-debs.outputs.needed == 'true' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.ci-debs.outputs.path }}
        key: ci-debs-1-linux-x64-${{ steps.ci-debs.outputs.sha_key }}

    - name: Provide libxml2.so.2 for LLVM's linker (Ubuntu 26.04+)
      if: runner.os == 'Linux' && steps.ci-debs.outputs.needed == 'true'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/libxml2_debs.sh" install "${{ steps.ci-debs.outputs.path }}"

    # Make room for the repository-cache restore on GitHub-hosted Linux.
    #
    # The restore holds the 5.55 GB archive (cache.tzst) on disk while tar
    # unpacks it, so disk use peaks at about 16.5 GB before it settles. On
    # 2026-10-31 two jobs on ubuntu-26.04 image 20261018.50.1 died in this
    # step with "tar: Cannot mkdir: No space left on device" (run 41246054493
    # job 124670890058, run 41247748253 job 124675646736); the retries landed
    # on image 20261025.179.1 and passed, so the margin is thin, not absent.
    #
    # Only when `df` shows less than 25 GB free: jobs that already called
    # free-disk-space have more than that and skip this at the cost of one df.
    # Self-hosted runners are left alone (their disk is ours to size).
    #
    # Removes the free-disk-space set plus /usr/share/swift and
    # /usr/local/share/powershell (no hosted-Linux job uses either; the Swift
    # lanes run on macOS, and vitruvian-tabs-e2e already removes both ahead of
    # setup-bazel). NEVER add /usr/local/lib/android: android_sdk_repository
    # resolves the SDK from $ANDROID_HOME at analysis time.
    - name: Check free disk space before the cache restore
      id: disk
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        free_gb="$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')"
        echo "free on /: ${free_gb} GB (threshold 25 GB)"
        if [ "${free_gb}" -lt 25 ]; then
          echo "low=true" >> "$GITHUB_OUTPUT"
        else
          echo "enough space -- skipping the cleanup"
        fi
    - name: Free disk space for the cache restore
      if: steps.disk.outputs.low == 'true'
      uses: ./.github/actions/free-disk-space
      with:
        extra-paths: |
          /usr/share/swift
          /usr/local/share/powershell

    # This action is RESTORE-ONLY for the Bazel repository cache.
    #
    # No regular CI job — including jobs on main, merge-queue runs, pull
    # requests, or _copybara-export.yaml — ever writes the repository cache.
    # Only .github/workflows/bazel-repo-cache.yaml saves repository cache
    # entries, and only after filling archives cleanly and proving offline
    # completeness with `--repository_disable_download`.
    #
    # Why: an Actions cache saved on a throwaway merge-queue or PR branch is
    # unreadable elsewhere while still consuming the repo's 10 GiB budget and
    # evicting main's entries; self-hosted runners upload too slowly (~1.8 MB/s)
    # and hit job timeouts; and allowing partial jobs (such as Copybara export)
    # to race-save first on main poisoned exact-key hits with incomplete
    # entries. Restoring checks the exact `-repository-full-<hash>` key, then the
    # `-repository-full-` prefix, and falls back LAST to the same-platform
    # legacy `-repository-` prefix so a full entry always wins when one exists
    # while keeping the legacy cache usable until a full entry is saved.
    #
    # tools/conformance (CACHESAVE) fails if this action ever re-enables
    # `repository-cache` or `cache-save` on bazel-contrib/setup-bazel, if a
    # workflow calls bazel-contrib/setup-bazel directly outside
    # bazel-repo-cache.yaml, or if the `-repository-full-` key prefix drifts.
    #
    # GOPROXY: if proxy.golang.org fails to answer, fetch the Go module
    # straight from its source repository instead of failing the job (#4187).
    #
    # Go modules from go.mod are NOT fetched by Bazel's downloader, so
    # --http_connector_attempts / --http_timeout_scaling / downloader.cfg never
    # apply to them, and the archive repository cache (`~/.cache/bazel-repo`)
    # cannot hold them. gazelle's go_repository (0.51.3) runs its fetch_repo
    # tool, which runs `go mod download`. Instead, GitHub-hosted jobs restore a
    # separate `bazel-gomod-1-<os>-<arch>-*` Actions cache containing only
    # `cache/download` zips at `$HOME/.cache/bazel-gomod` (saved by
    # `.github/workflows/bazel-repo-cache.yaml` on main) and point gazelle at
    # it via `GO_REPOSITORY_USE_HOST_MODCACHE=1` + `GOMODCACHE`. GOPROXY below
    # remains as the pipe-fallback safety net on a cache miss:
    # on 2026-11-01 `go mod download` failed twice in the merge queue on macOS
    # with "proxy.golang.org ... net/http: TLS handshake timeout" (run
    # 41353399428 job 124989530940, run 41361913018 job 125015487496).
    #
    # Go's default is "https://proxy.golang.org,direct". A COMMA falls through
    # to the next entry only on a 404/410 answer, so a timeout fails the fetch.
    # A PIPE falls through on any error. Listing the proxy twice does not
    # retry it: Go tries the same URL once (checked against a server that
    # never completes a TLS handshake, the CI failure exactly).
    #
    # `direct` cannot change what we build: fetch_repo checks the module's
    # hash against go.sum whatever the source, and fails on a mismatch.
    #
    # tools/conformance (GOPROXY) fails if this line loses the pipe fallback.
    #
    # Every GitHub-hosted job (including main) restores the archive-only
    # repository cache and the Go module cache via actions/cache/restore below.
    # Self-hosted runners (vitruvian-queue) skip the Actions cache downloads
    # altogether: they mount the persistent ReadWriteMany vitruvian-queue-cache
    # PVC at /home/runner/.cache/bazel-repo (which also holds repo contents) and
    # point --repository_cache at it in "Use the restored repository cache"
    # below, so ephemeral runner pods do not pull multi-GiB archives over WAN
    # on every job.
    #
    # setup-bazel 0.19.x is kept with `repository-cache: false` and
    # `cache-save: false`: earlier versions hung after an aborted download
    # instead of exiting, whereas actions/cache/restore honors
    # SEGMENT_DOWNLOAD_TIMEOUT_MINS and `continue-on-error: true`, so a stalled
    # or missing restore becomes a cache miss and Bazel downloads what it needs.
    #
    # The paths must stay the absolute `$HOME/.cache/bazel-repo` and
    # `$HOME/.cache/bazel-gomod` strings that bazel-repo-cache.yaml saves under
    # (an Actions cache entry's version hashes its path strings, so `~/` would miss).
    - name: Where setup-bazel keeps the repository cache
      id: repo-cache
      shell: bash
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          # The pod mounts the cache PVC at ~/.cache/bazel-repo and
          # ~/.cache/bazelisk. The runner image has no ~/.cache, so the
          # container runtime creates it as root:root 0755 to hold those
          # mount points, and Bazel's output root (~/.cache/bazel) then fails
          # with "mkdir(.../.cache/bazel/_bazel_runner): Permission denied"
          # (every Bazel job on vitruvian-queue from 2026-11-08 01:14 UTC).
          # Take ~/.cache back first; not recursive, so the NFS mounts under
          # it are left alone.
          if [ -d "${HOME}/.cache" ] && [ ! -w "${HOME}/.cache" ]; then
            sudo chown "$(id -u):$(id -g)" "${HOME}/.cache"
          fi
          for d in "${HOME}/.cache/bazel-repo" "${HOME}/.cache/bazelisk"; do
            mkdir -p "$d" 2>/dev/null || true
            if [ -d "$d" ] && [ ! -w "$d" ]; then
              sudo chown "$(id -u):$(id -g)" "$d"
            fi
          done
        fi
        {
          echo "path=${HOME}/.cache/bazel-repo"
          echo "gomod_path=${HOME}/.cache/bazel-gomod"
        } >> "${GITHUB_OUTPUT}"

    # Self-hosted runners share one Bazel repository cache and one Bazelisk
    # cache on an NFS volume, so a broken entry there fails every job until
    # someone clears it. On 2026-11-08 the weekly cache GC left cached repos
    # half-empty and every merge-queue job failed with "BUILD file not found"
    # in @rules_python. runner_cache_check.py samples the cache within a time
    # budget, clears only the cached repos that lost files (or the whole
    # repo contents cache when a sample shows widespread damage) and any
    # Bazelisk binary whose SHA-256 no longer matches, so the next job heals
    # it. It never fails the job; `timeout` caps it if NFS stalls.
    # runner_cache_check_test (BUILD here) holds the rules.
    #
    # The budget is 5 seconds, down from 20. The check always uses all of it,
    # so at 20 it was most of this action on the pool: a median 25-26 s in
    # every one of 116 queue jobs on 2026-11-17, a dozen or so jobs per
    # merge-queue entry. A 20-second sample covered 659 to 2,015 cached repos
    # in the four logs read; 5 seconds covers about a quarter of that per job,
    # and the check now logs how its time was split. That still finds
    # damage that hits many repos at once, which is what this is here for
    # (three broken repos in one sample clear the whole cache), and the
    # Bazelisk check is not sampled, so it is unchanged. What it gives up is
    # some chance of one job catching a single broken repo before it needs it.
    - name: Check the shared runner caches for broken entries
      if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        timeout 60 python3 "${GITHUB_ACTION_PATH}/runner_cache_check.py" \
          --repo-cache "${HOME}/.cache/bazel-repo" \
          --bazelisk-cache "${HOME}/.cache/bazelisk" \
          --budget-seconds 5 \
          || echo "::warning title=Runner cache check::stopped early (exit $?); the job goes on"

    - name: Restore the Bazel repository cache
      if: ${{ runner.environment == 'github-hosted' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "4"
      with:
        path: ${{ steps.repo-cache.outputs.path }}
        key: setup-bazel-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-repository-full-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
        restore-keys: |
          setup-bazel-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-repository-full-
          setup-bazel-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-repository-

    - name: Restore the Bazel Go module cache
      if: ${{ runner.environment == 'github-hosted' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "4"
      with:
        path: ${{ steps.repo-cache.outputs.gomod_path }}
        key: bazel-gomod-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-${{ hashFiles('go.work', 'go.work.sum', 'go.sum', 'apps/cli/vitruvian-devx/go.sum', 'apps/desktop/vitruvian-courier/engine/go.sum', 'packages/vitruvian-sdk/go/go.sum', 'packages/pulumi/library/go/go.sum', 'packages/pulumi/library/go/pkg/app/go.sum', 'packages/pulumi/library/go/pkg/bootstrap/go.sum', 'packages/pulumi/library/go/pkg/cai_monitoring/go.sum', 'packages/pulumi/library/go/pkg/centralized_logging/go.sum', 'packages/pulumi/library/go/pkg/cicd/go.sum', 'packages/pulumi/library/go/pkg/cloud_dns/go.sum', 'packages/pulumi/library/go/pkg/cloud_functions/go.sum', 'packages/pulumi/library/go/pkg/cloud_router/go.sum', 'packages/pulumi/library/go/pkg/cloud_storage/go.sum', 'packages/pulumi/library/go/pkg/compute_instance/go.sum', 'packages/pulumi/library/go/pkg/data/go.sum', 'packages/pulumi/library/go/pkg/gcloud/go.sum', 'packages/pulumi/library/go/pkg/google_group/go.sum', 'packages/pulumi/library/go/pkg/iam/go.sum', 'packages/pulumi/library/go/pkg/instance_template/go.sum', 'packages/pulumi/library/go/pkg/kms/go.sum', 'packages/pulumi/library/go/pkg/log_export/go.sum', 'packages/pulumi/library/go/pkg/neon/go.sum', 'packages/pulumi/library/go/pkg/network/go.sum', 'packages/pulumi/library/go/pkg/network_firewall_policy/go.sum', 'packages/pulumi/library/go/pkg/network_peering/go.sum', 'packages/pulumi/library/go/pkg/org_policy/go.sum', 'packages/pulumi/library/go/pkg/private_service_connect/go.sum', 'packages/pulumi/library/go/pkg/project_factory/go.sum', 'packages/pulumi/library/go/pkg/pubsub/go.sum', 'packages/pulumi/library/go/pkg/upstash/go.sum', 'packages/pulumi/library/go/pkg/vpc_service_controls/go.sum') }}
        restore-keys: |
          bazel-gomod-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-

    - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
      with:
        # Never on the self-hosted runners: their ~/.cache/bazelisk is one NFS
        # volume shared by every pod, so it already is the cache. Restoring the
        # Actions cache there untars over a binary other jobs are running; on
        # 2026-11-09 that left d302d22.../bin/bazel torn, and every job that
        # touched it failed with "Failed to open ... as a zip file:
        # Input/output error" right after "Failed to restore bazelisk cache".
        bazelisk-cache: ${{ runner.environment != 'self-hosted' }}
        repository-cache: false
        cache-save: false
        bazelrc: |
          common --announce_rc --color=yes --curses=yes
          common --show_progress_rate_limit=60 --show_timestamps
          common --repo_env=GOPROXY=https://proxy.golang.org|direct

    # setup-bazel itself runs with repository-cache: false (restore-only), so
    # point Bazel at the repository cache path above for every job: hosted jobs
    # read the restored archive cache (or download on a miss), and self-hosted
    # runners read their mounted PVC. setup-bazel writes ~/.bazelrc without a
    # final newline, hence the leading one.
    - name: Use the restored repository cache
      shell: bash
      run: printf '\ncommon --repository_cache=%s\n' "${{ steps.repo-cache.outputs.path }}" >> "${HOME}/.bazelrc"

    - name: Use the restored Go module cache
      if: ${{ runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        mkdir -p "${{ steps.repo-cache.outputs.gomod_path }}"
        printf '\ncommon --repo_env=GO_REPOSITORY_USE_HOST_MODCACHE=1\ncommon --repo_env=GOMODCACHE=%s\n' "${{ steps.repo-cache.outputs.gomod_path }}" >> "${HOME}/.bazelrc"
