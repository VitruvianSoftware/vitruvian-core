# Canonical Bazel setup for the monorepo's CI lanes: the pinned setup-bazel
# action with the repo's standard caches and CI bazelrc, in one place so the
# ~14 inline copies don't drift. The action pin is bumped here once (Dependabot
# tracks action.yml files in the github-actions ecosystem).
#
# Requires the repo to be checked out first (composite actions referenced as
# `./.github/actions/...` resolve from the workspace). Every caller does
# actions/checkout before this step.
name: Set up Bazel
description: Install Bazel (bazelisk) with the repo's standard caches and CI bazelrc.

runs:
  using: composite
  steps:
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
        # Cache the EXTRACTED llvm toolchain (#1039).
        #
        # repository-cache above caches DOWNLOADS; extraction is per-output_base,
        # so every fresh runner re-extracts LLVM-19.1.7-Linux-X64.tar.xz. Measured
        # on main: 35s / 94s / 95s / 106s / 154s / 204s within a single run, and
        # 154s even on a warm re-run. It is the dominant slice of the ~3m45s of
        # loading/analysis on lanes like tidy-check (only ~48s of that 275s is
        # action execution -- Critical Path: 44.48s).
        #
        # Scoped with `manifest` rather than `external-cache: true`: that would
        # cache EVERY external over 10MB, and each repo is a separate cache entry
        # competing for the repo-wide 10GB Actions cache budget. LLVM is the one
        # that actually costs minutes. Keyed on MODULE.bazel because that is where
        # llvm_versions is pinned (:207-216), so a toolchain bump invalidates it.
        #
        # A remote ACTION cache does NOT substitute for this -- measured and
        # rejected in #1038: --config=remotecache on tidy-check was slightly
        # WORSE (288.5s vs 275.5s) with zero cache hits, because RBE and
        # cache-only lanes compute different action keys, and because the cost
        # here is loading/analysis rather than action execution.
        external-cache: |
          manifest:
            llvm_toolchain_llvm: MODULE.bazel
        bazelrc: |
          common --announce_rc --color=yes --curses=yes
          common --show_progress_rate_limit=60 --show_timestamps
