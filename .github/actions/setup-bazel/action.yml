# Canonical Bazel setup for the monorepo's CI lanes: the pinned setup-bazel
# action with the repo's standard caches and CI bazelrc, in one place so the
# ~14 inline copies don't drift. The action pin is bumped here once (Dependabot
# tracks action.yml files in the github-actions ecosystem).
#
# Requires the repo to be checked out first (composite actions referenced as
# `./.github/actions/...` resolve from the workspace). Every caller does
# actions/checkout before this step.
name: Set up Bazel
description: Install Bazel (bazelisk) with the repo's standard caches and CI bazelrc.

runs:
  using: composite
  steps:
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
        bazelrc: |
          common --announce_rc --color=yes --curses=yes
          common --show_progress_rate_limit=60 --show_timestamps
