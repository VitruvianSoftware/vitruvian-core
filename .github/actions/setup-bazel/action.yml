# Canonical Bazel setup for the monorepo's CI lanes: the pinned setup-bazel
# action with the repo's standard caches and CI bazelrc, in one place so the
# ~14 inline copies don't drift. The action pin is bumped here once (Dependabot
# tracks action.yml files in the github-actions ecosystem).
#
# Requires the repo to be checked out first (composite actions referenced as
# `./.github/actions/...` resolve from the workspace). Every caller does
# actions/checkout before this step.
name: Set up Bazel
description: Install Bazel (bazelisk) with the repo's standard caches and CI bazelrc.

runs:
  using: composite
  steps:
    # LLVM's prebuilt linker needs libxml2.so.2; Ubuntu 26.04 no longer ships it.
    #
    # toolchains_llvm hands us the official LLVM 19.1.7 Linux-X64 release, whose
    # ld.lld is dynamically linked against libxml2.so.2 (checked with objdump -p;
    # 22.1.8 needs it too, and 23.1.2 swaps it for ICU 70, which neither 24.04
    # nor 26.04 ships). 26.04 carries only the new ABI, libxml2-16 (.so.16), so
    # without this every C/C++/Rust link fails with "error while loading shared
    # libraries: libxml2.so.2" before it starts.
    #
    # Fix: install noble's libxml2 2.9.14 plus the libicu74 it links against.
    # Both use sonames 26.04 does not have, so they sit BESIDE the system
    # libxml2-16 / libicu rather than replacing anything. Checksum-pinned.
    #
    # A no-op wherever libxml2.so.2 already exists (24.04, macOS), so it costs
    # nothing there. REMOVE THIS once the C++ toolchain no longer needs the
    # host's libxml2 (#2425: a self-contained LLVM build).
    #
    # The archive drops a version when a security update supersedes it (3.9 → 3.10
    # on 2026-10-25 turned the primary URL into a 404 and left every run on the
    # Launchpad fallback, which was returning 502/503). The fallback is now
    # snapshot.ubuntu.com, which keeps every published file at a fixed timestamp,
    # so the pinned checksum always has a working URL.
    - name: Provide libxml2.so.2 for LLVM's linker (Ubuntu 26.04+)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # Herestring, not `ldconfig -p | grep -q`: under pipefail an early-exit
        # grep can SIGPIPE ldconfig on large output and flip the verdict.
        has_libxml2_so2() { grep -q 'libxml2\.so\.2 ' <<<"$(ldconfig -p)"; }
        if has_libxml2_so2; then
          echo "libxml2.so.2 already present -- nothing to do"
          exit 0
        fi
        dir="$(mktemp -d)"
        fetch() { # name sha256 url...
          local name="$1" sha="$2"
          shift 2
          for url in "$@"; do
            if curl -fsSL --connect-timeout 10 --max-time 60 --retry 2 --retry-all-errors -o "${dir}/${name}" "${url}"; then
              if echo "${sha}  ${dir}/${name}" | sha256sum -c -; then
                return 0
              fi
            fi
          done
          echo "::error::failed to fetch ${name} from any mirror"
          return 1
        }
        fetch libicu74.deb \
          c9a70989678660eed9a1e904c74fa043da8bec8e2036856fc16e31ced79b04f8 \
          'http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu74_74.2-1ubuntu3.1_amd64.deb' \
          'http://security.ubuntu.com/ubuntu/pool/main/i/icu/libicu74_74.2-1ubuntu3.1_amd64.deb' \
          'http://azure.archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu74_74.2-1ubuntu3.1_amd64.deb' \
          'https://snapshot.ubuntu.com/ubuntu/20261025T000000Z/pool/main/i/icu/libicu74_74.2-1ubuntu3.1_amd64.deb'
        fetch libxml2.deb \
          c5a065f85c1e6f605741e365e40cad71c3ceb0e85e2791400bd35b8896e12ad1 \
          'http://archive.ubuntu.com/ubuntu/pool/main/libx/libxml2/libxml2_2.9.14+dfsg-1.3ubuntu3.10_amd64.deb' \
          'http://security.ubuntu.com/ubuntu/pool/main/libx/libxml2/libxml2_2.9.14+dfsg-1.3ubuntu3.10_amd64.deb' \
          'http://azure.archive.ubuntu.com/ubuntu/pool/main/libx/libxml2/libxml2_2.9.14+dfsg-1.3ubuntu3.10_amd64.deb' \
          'https://snapshot.ubuntu.com/ubuntu/20261025T000000Z/pool/main/libx/libxml2/libxml2_2.9.14+dfsg-1.3ubuntu3.10_amd64.deb'
        sudo dpkg -i "${dir}/libicu74.deb" "${dir}/libxml2.deb"
        has_libxml2_so2 \
          || { echo "::error::libxml2.so.2 still missing after install"; exit 1; }
        echo "installed libxml2.so.2 (noble 2.9.14) for LLVM's linker"

    # Make room for the repository-cache restore on GitHub-hosted Linux.
    #
    # The restore holds the 5.55 GB archive (cache.tzst) on disk while tar
    # unpacks it, so disk use peaks at about 16.5 GB before it settles. On
    # 2026-10-31 two jobs on ubuntu-26.04 image 20261018.50.1 died in this
    # step with "tar: Cannot mkdir: No space left on device" (run 41246054493
    # job 124670890058, run 41247748253 job 124675646736); the retries landed
    # on image 20261025.179.1 and passed, so the margin is thin, not absent.
    #
    # Only when `df` shows less than 25 GB free: jobs that already called
    # free-disk-space have more than that and skip this at the cost of one df.
    # Self-hosted runners are left alone (their disk is ours to size).
    #
    # Removes the free-disk-space set plus /usr/share/swift and
    # /usr/local/share/powershell (no hosted-Linux job uses either; the Swift
    # lanes run on macOS, and vitruvian-tabs-e2e already removes both ahead of
    # setup-bazel). NEVER add /usr/local/lib/android: android_sdk_repository
    # resolves the SDK from $ANDROID_HOME at analysis time.
    - name: Check free disk space before the cache restore
      id: disk
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        free_gb="$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')"
        echo "free on /: ${free_gb} GB (threshold 25 GB)"
        if [ "${free_gb}" -lt 25 ]; then
          echo "low=true" >> "$GITHUB_OUTPUT"
        else
          echo "enough space -- skipping the cleanup"
        fi
    - name: Free disk space for the cache restore
      if: steps.disk.outputs.low == 'true'
      uses: ./.github/actions/free-disk-space
      with:
        extra-paths: |
          /usr/share/swift
          /usr/local/share/powershell

    # Every job RESTORES the caches; only GitHub-hosted jobs on main SAVE them.
    #
    # An Actions cache is readable only from the ref that saved it and from the
    # default branch. A merge-queue entry runs on a throwaway
    # gh-readonly-queue/main/pr-<n>-<sha> branch that GitHub deletes when the
    # entry leaves the queue, so a cache saved there can never be read again,
    # and a pull-request cache is read only by that PR's next push. Both still
    # count against the repo's single 10 GiB budget, and GitHub makes room by
    # evicting the oldest entries -- main's, which is what every other ref
    # falls back to. One queue entry held 6.2 GiB of such dead cache on
    # 2026-10-31 (repository 3.9 + llvm 2.2 + bazelisk), more than half the
    # budget.
    #
    # Self-hosted runners (the vitruvian-queue pool) are excluded even on main:
    # their upload measured ~1.8 MB/s against ~300-365 MB/s from GitHub-hosted
    # runners. On 2026-10-31 two merge-queue Conformance Check runs (41178618061,
    # 41178619555) passed in 6 minutes, then spent 38 minutes in this action's
    # post step uploading a 5.7 GB repository cache and hit the 45-minute job
    # timeout, which cancelled a required check and dropped PRs #4085 and #4090
    # from the queue. A post step cannot be given its own timeout, so the only
    # safe save is one that cannot be slow. GitHub-hosted jobs on main (ci.yaml's
    # build-test and friends) keep the entries warm for everyone.
    #
    # tools/conformance (CACHESAVE) fails if this guard is dropped, or if a
    # workflow calls bazel-contrib/setup-bazel directly instead of this action.
    #
    # GOPROXY: if proxy.golang.org fails to answer, fetch the Go module
    # straight from its source repository instead of failing the job (#4187).
    #
    # Go modules from go.mod are NOT fetched by Bazel's downloader, so
    # --http_connector_attempts / --http_timeout_scaling / downloader.cfg never
    # apply to them, and the repository cache restored above does not hold
    # them. gazelle's go_repository (0.51.3; still so in 0.54.0) runs its
    # fetch_repo tool, which runs `go mod download` with Go's own HTTP client:
    # no retries, and a fresh download on every CI run. On 2026-11-01 that
    # failed twice in the merge queue on macOS with "proxy.golang.org ...
    # net/http: TLS handshake timeout" (run 41353399428 job 124989530940,
    # run 41361913018 job 125015487496), ejecting the PR at the head.
    #
    # Go's default is "https://proxy.golang.org,direct". A COMMA falls through
    # to the next entry only on a 404/410 answer, so a timeout fails the fetch.
    # A PIPE falls through on any error. Listing the proxy twice does not
    # retry it: Go tries the same URL once (checked against a server that
    # never completes a TLS handshake, the CI failure exactly).
    #
    # `direct` cannot change what we build: fetch_repo checks the module's
    # hash against go.sum whatever the source, and fails on a mismatch.
    #
    # tools/conformance (GOPROXY) fails if this line loses the pipe fallback.
    #
    # The repository cache is restored by setup-bazel only where it is also
    # saved (GitHub-hosted jobs on main, the same guard as cache-save);
    # GitHub-hosted jobs off main restore it with actions/cache/restore, in the
    # step below. Self-hosted runners (vitruvian-queue) skip the Actions cache
    # download altogether: they mount the persistent ReadWriteMany
    # vitruvian-queue-cache PVC at /home/runner/.cache/bazel-repo and point
    # --repository_cache at it in "Use the restored repository cache" below, so
    # ephemeral runner pods do not pull the 5.55 GB archive over WAN on every
    # job.
    #
    # setup-bazel 0.19.1 never exits its main step after an aborted download:
    # it logs "Failed to restore repository cache", but the stalled HTTP
    # request keeps node alive, so the step sits until the job's timeout. On
    # 2026-11-06 that happened twice in the merge queue on vitruvian-queue
    # runners (run 42277456783 job lint-naming: the 3.6 GB download stopped at
    # 47.5% at 19:15:48, the job was cancelled at its 15-minute limit at
    # 19:27:23; run 42280417088 the same), cancelling a required check and
    # dropping PR #4380 from the queue. 3 of 17 queue-runner restores in the
    # last 40 queue CI runs were aborted; the queue runners download it at
    # ~10 MB/s (median 318 s, max 481 s), against ~60 s on hosted runners.
    # actions/cache/restore ends with process.exit for exactly this case ("node
    # will stay alive if any promises are not resolved, which is a possibility
    # if HTTP requests are dangling"), and SEGMENT_DOWNLOAD_TIMEOUT_MINS gives
    # up on a stalled download, so a bad download is a cache miss: Bazel then
    # fetches what it needs itself.
    #
    # The key is setup-bazel's own (setup-bazel-<cache-version>-<platform>-
    # <arch>-repository-<hash of MODULE.bazel and the WORKSPACE files>), so it
    # reads the entries main saves; the restore-keys prefix matches the newest
    # one if the hash differs.
    #
    # tools/conformance (CACHESAVE) fails if setup-bazel restores the
    # repository cache outside that guard, if actions/cache/restore runs on
    # self-hosted runners or main, or if this restore loses its timeout.
    #
    # The path must be the same string setup-bazel saves under, an absolute
    # $HOME/.cache/bazel-repo: an Actions cache entry's version is a hash of
    # its paths, so `~/.cache/bazel-repo` found nothing, not even by prefix
    # (checked in this PR's first run).
    - name: Where setup-bazel keeps the repository cache
      id: repo-cache
      if: ${{ !(github.ref == 'refs/heads/main' && runner.environment == 'github-hosted') }}
      shell: bash
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          # The pod mounts the cache PVC at ~/.cache/bazel-repo and
          # ~/.cache/bazelisk. The runner image has no ~/.cache, so the
          # container runtime creates it as root:root 0755 to hold those
          # mount points, and Bazel's output root (~/.cache/bazel) then fails
          # with "mkdir(.../.cache/bazel/_bazel_runner): Permission denied"
          # (every Bazel job on vitruvian-queue from 2026-11-08 01:14 UTC).
          # Take ~/.cache back first; not recursive, so the NFS mounts under
          # it are left alone.
          if [ -d "${HOME}/.cache" ] && [ ! -w "${HOME}/.cache" ]; then
            sudo chown "$(id -u):$(id -g)" "${HOME}/.cache"
          fi
          for d in "${HOME}/.cache/bazel-repo" "${HOME}/.cache/bazelisk"; do
            mkdir -p "$d" 2>/dev/null || true
            if [ -d "$d" ] && [ ! -w "$d" ]; then
              sudo chown "$(id -u):$(id -g)" "$d"
            fi
          done
        fi
        echo "path=${HOME}/.cache/bazel-repo" >> "${GITHUB_OUTPUT}"

    # Self-hosted runners share one Bazel repository cache and one Bazelisk
    # cache on an NFS volume, so a broken entry there fails every job until
    # someone clears it. On 2026-11-08 the weekly cache GC left cached repos
    # half-empty and every merge-queue job failed with "BUILD file not found"
    # in @rules_python. runner_cache_check.py samples the cache within a time
    # budget, clears only the cached repos that lost files (or the whole
    # repo contents cache when a sample shows widespread damage) and any
    # Bazelisk binary whose SHA-256 no longer matches, so the next job heals
    # it. It never fails the job; `timeout` caps it if NFS stalls.
    # runner_cache_check_test (BUILD here) holds the rules.
    - name: Check the shared runner caches for broken entries
      if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        timeout 60 python3 "${GITHUB_ACTION_PATH}/runner_cache_check.py" \
          --repo-cache "${HOME}/.cache/bazel-repo" \
          --bazelisk-cache "${HOME}/.cache/bazelisk" \
          --budget-seconds 20 \
          || echo "::warning title=Runner cache check::stopped early (exit $?); the job goes on"

    - name: Restore the Bazel repository cache
      if: ${{ runner.environment == 'github-hosted' && github.ref != 'refs/heads/main' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "4"
      with:
        path: ${{ steps.repo-cache.outputs.path }}
        key: setup-bazel-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-repository-${{ hashFiles('MODULE.bazel', 'WORKSPACE.bazel', 'WORKSPACE.bzlmod', 'WORKSPACE') }}
        restore-keys: |
          setup-bazel-1-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-repository-

    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        # Never on the self-hosted runners: their ~/.cache/bazelisk is one NFS
        # volume shared by every pod, so it already is the cache. Restoring the
        # Actions cache there untars over a binary other jobs are running; on
        # 2026-11-09 that left d302d22.../bin/bazel torn, and every job that
        # touched it failed with "Failed to open ... as a zip file:
        # Input/output error" right after "Failed to restore bazelisk cache".
        bazelisk-cache: ${{ runner.environment != 'self-hosted' }}
        repository-cache: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
        cache-save: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
        bazelrc: |
          common --announce_rc --color=yes --curses=yes
          common --show_progress_rate_limit=60 --show_timestamps
          common --repo_env=GOPROXY=https://proxy.golang.org|direct

    # Without its repository cache setup-bazel leaves --repository_cache out
    # of ~/.bazelrc, so point Bazel at the folder restored above. setup-bazel
    # writes the file without a final newline, hence the leading one.
    - name: Use the restored repository cache
      if: ${{ !(github.ref == 'refs/heads/main' && runner.environment == 'github-hosted') }}
      shell: bash
      run: printf '\ncommon --repository_cache=%s\n' "${{ steps.repo-cache.outputs.path }}" >> "${HOME}/.bazelrc"
