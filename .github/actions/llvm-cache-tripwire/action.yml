# Tripwire (#1039, hardened per review on #1304): assert the llvm-cache-restore
# composite's cache was actually USED by the build, not merely that the pinned
# hash still exists. The first version checked only whether the pin moved --
# and stayed green while a job extracted LLVM with NO cache-restore step at
# all (the placement bug), because extraction itself creates the pinned dir.
# Same green-but-degraded shape as the dead target-determinator fast path
# (#1260): a guard must test the outcome, not just the artifact.
#
#  - restore step missing/skipped        -> FAIL (structural, never legit)
#  - restored a hit, but Bazel STILL     -> FAIL (recorded-inputs mismatch;
#    materialized a new candidate            the cache is dead weight)
#  - key miss                            -> notice only (expected once after
#                                            an llvm_versions bump)
#  - restored one content hash, but     -> FAIL (the cache key does not move
#    Bazel extracted under another           with some input of the llvm repo
#                                            rule; see tools/ci/llvm-cache-key.sh)
#
# It then STAGES the toolchain for saving (#2456): on a key miss it hard-links
# whichever contents/<hash>/ actually holds clang into the llvm-cache-restore
# composite's fixed stage folder, which that composite's post step saves. The
# name is discovered here, after the build, so no file has to pin it -- the
# pinned name went stale once (#2419 -> #2455) and cost every Bazel lane a full
# re-extraction until someone noticed.
#
# Feed this composite the three outputs of a prior llvm-cache-restore step in
# the SAME job. Callers must put `if: always()` on the step invoking this
# composite so it still reports when an earlier step in the job failed.
name: LLVM cache tripwire
description: >-
  Verify the LLVM extracted-toolchain cache (see the llvm-cache-restore
  composite) was actually used by the build, not merely present.

inputs:
  restore-outcome:
    description: The llvm-cache-restore composite's `outcome` output.
    required: true
  cache-hit:
    description: The llvm-cache-restore composite's `cache-hit` output.
    required: true
  pre-count:
    description: The llvm-cache-restore composite's `pre-count` output.
    required: true
  pin-path:
    description: >-
      The llvm-cache-restore composite's `pin-path` output: the content-hash
      directory it restored, or empty on a miss.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: LLVM cache tripwire
      shell: bash
      env:
        RESTORE_OUTCOME: ${{ inputs.restore-outcome }}
        CACHE_HIT: ${{ inputs.cache-hit }}
        PRE_COUNT: ${{ inputs.pre-count }}
        PIN: ${{ inputs.pin-path }}
      run: |
        STAGE_SH="$GITHUB_WORKSPACE/tools/ci/llvm-cache-stage.sh"
        # The contents/<hash> dir that actually holds clang after the build
        # (empty when this lane never needed LLVM).
        LIVE=$(bash "$STAGE_SH" live "${LLVM_CACHE_CONTENTS:-/home/runner/.cache/bazel-repo/contents}")
        # A missing $PIN is the ordinary cache-miss state; the step runs under
        # `bash -e -o pipefail`, so never let `ls` of an absent dir kill it.
        POST_COUNT=$( { [ -n "$PIN" ] && ls "$PIN" 2>/dev/null || true; } | wc -l | tr -d ' ')
        if [ "$RESTORE_OUTCOME" != "success" ]; then
          echo "::error title=llvm-contents-cache broken::the 'Restore the extracted LLVM toolchain' step did not run in this job (outcome='$RESTORE_OUTCOME'). This is the exact placement bug that shipped once already -- the lane pays full extraction while everything looks green."
          exit 1
        fi
        if [ "$CACHE_HIT" = "true" ] && [ -n "$LIVE" ] && [ "$LIVE" != "$PIN" ]; then
          echo "::error title=llvm-contents-cache wrong toolchain::the cache HIT restored $(basename "${PIN:-none}") but Bazel extracted LLVM under $(basename "$LIVE"). The key matched while the toolchain's definition moved, so every run on this key pays restore AND extraction, and an exact hit never re-saves. Add the input that moved to tools/ci/llvm-cache-key.sh."
          exit 1
        fi
        if [ "$CACHE_HIT" = "true" ] && [ "${POST_COUNT:-0}" -gt "${PRE_COUNT:-0}" ]; then
          echo "::error title=llvm-contents-cache dead weight::cache HIT restored a candidate but Bazel materialized a NEW one anyway (candidates $PRE_COUNT -> $POST_COUNT): recorded-inputs validation rejected the restored dir, so every run now pays restore AND extraction. Investigate before this rots."
          exit 1
        fi
        if [ "$CACHE_HIT" != "true" ] && [ -n "$LIVE" ]; then
          echo "::notice::llvm-contents cache miss -- extracted under $(basename "$LIVE"); staged for the post step to save. Expected exactly once after a toolchain-affecting MODULE.bazel change, or after a runner-image point release moves /etc/os-release (see tools/ci/llvm-cache-key.sh)."
        fi
        # Accumulation check: is the saved entry carrying candidates that some
        # runs will reject -- the dead-weight state above, caught while it is
        # still only slow rather than red?
        #
        # ONE EXTRACTION MATERIALIZES TWO DIRECTORIES under the content hash,
        # not one. Measured, twice: the #2242 failure went 2 -> 4 across a
        # single rejected-and-re-extracted build (+2), and a healthy hit on main
        # @ c0ecef1b reported PRE_COUNT 2 while the tripwire passed, i.e. Bazel
        # accepted a restored candidate and added nothing. So 2 is the steady
        # state and the threshold is >2 -- more than one extraction's worth.
        #
        # The first cut of this check used `-gt 1` ("expected 1") and therefore
        # fired on every healthy build. A guard that always fires is worse than
        # no guard: it trains everyone to scroll past the one warning that will
        # eventually matter.
        #
        # A warning, not a failure: this is a cost signal, and it must not be
        # able to take CI down on its own.
        if [ "$CACHE_HIT" = "true" ] && [ "${PRE_COUNT:-0}" -gt 2 ]; then
          echo "::warning title=llvm-contents-cache accumulating::the restored entry holds $PRE_COUNT candidate dirs; one extraction accounts for 2, so this entry carries rejects that some runs will re-extract past. Check whether a new recorded input has appeared that tools/ci/llvm-cache-key.sh does not key on."
        fi
        # Stage for the save. Only on a miss: actions/cache never saves on an
        # exact primary-key hit, so staging then would be wasted work. A staging
        # failure is a cost problem, not a correctness one -- warn, don't fail.
        if [ "$CACHE_HIT" != "true" ] && [ -n "$LIVE" ] && [ -n "${LLVM_CACHE_STAGE:-}" ]; then
          if ! bash "$STAGE_SH" stage "$LLVM_CACHE_STAGE" "$LLVM_CACHE_CONTENTS" >/dev/null; then
            echo "::warning title=llvm-contents-cache not staged::could not stage $(basename "$LIVE") for saving; the next run on this key will miss and extract again."
          fi
        fi
