# Tripwire (#1039, hardened per review on #1304): assert the llvm-cache-restore
# composite's cache was actually USED by the build, not merely that the pinned
# hash still exists. The first version checked only whether the pin moved --
# and stayed green while a job extracted LLVM with NO cache-restore step at
# all (the placement bug), because extraction itself creates the pinned dir.
# Same green-but-degraded shape as the dead target-determinator fast path
# (#1260): a guard must test the outcome, not just the artifact.
#
#  - restore step missing/skipped        -> FAIL (structural, never legit)
#  - restored a hit, but Bazel STILL     -> FAIL (recorded-inputs mismatch;
#    materialized a new candidate            the cache is dead weight)
#  - key miss                            -> notice only (expected once after
#                                            an llvm_versions bump)
#  - llvm under a different content hash -> warning with replacement hash
#
# Feed this composite the three outputs of a prior llvm-cache-restore step in
# the SAME job. Callers must put `if: always()` on the step invoking this
# composite so it still reports when an earlier step in the job failed.
name: LLVM cache tripwire
description: >-
  Verify the LLVM extracted-toolchain cache (see the llvm-cache-restore
  composite) was actually used by the build, not merely present.

inputs:
  restore-outcome:
    description: The llvm-cache-restore composite's `outcome` output.
    required: true
  cache-hit:
    description: The llvm-cache-restore composite's `cache-hit` output.
    required: true
  pre-count:
    description: The llvm-cache-restore composite's `pre-count` output.
    required: true
  pin-path:
    description: >-
      The llvm-cache-restore composite's `pin-path` output. Read, never
      hardcoded here, so the content-hash pin still lives in exactly one
      place (llvm-cache-restore/action.yml).
    required: true

runs:
  using: composite
  steps:
    - name: LLVM cache tripwire
      shell: bash
      env:
        RESTORE_OUTCOME: ${{ inputs.restore-outcome }}
        CACHE_HIT: ${{ inputs.cache-hit }}
        PRE_COUNT: ${{ inputs.pre-count }}
        PIN: ${{ inputs.pin-path }}
      run: |
        C=$(dirname "$PIN")
        POST_COUNT=$(ls "$PIN" 2>/dev/null | wc -l | tr -d ' ')
        if [ "$RESTORE_OUTCOME" != "success" ]; then
          echo "::error title=llvm-contents-cache broken::the 'Restore the extracted LLVM toolchain' step did not run in this job (outcome='$RESTORE_OUTCOME'). This is the exact placement bug that shipped once already -- the lane pays full extraction while everything looks green."
          exit 1
        fi
        if [ "$CACHE_HIT" = "true" ] && [ "${POST_COUNT:-0}" -gt "${PRE_COUNT:-0}" ]; then
          echo "::error title=llvm-contents-cache dead weight::cache HIT restored a candidate but Bazel materialized a NEW one anyway (candidates $PRE_COUNT -> $POST_COUNT): recorded-inputs validation rejected the restored dir, so every run now pays restore AND extraction. Investigate before this rots."
          exit 1
        fi
        if [ "$CACHE_HIT" != "true" ] && [ "${POST_COUNT:-0}" -gt 0 ]; then
          echo "::notice::llvm-contents cache miss -- extracted and the post step will save. Expected exactly once after an llvm_versions bump."
        fi
        if [ ! -d "$PIN" ] && compgen -G "$C/*/*/bin/clang" >/dev/null 2>&1; then
          NEW=$(dirname "$(dirname "$(compgen -G "$C/*/*/bin/clang" | head -1)")")
          echo "::warning title=llvm-contents-cache stale::LLVM materialized under $(basename "$(dirname "$NEW")") but the cache pins $(basename "$PIN")... -- update the pinned hash in .github/actions/llvm-cache-restore/action.yml."
          {
            echo "### llvm-contents-cache pinned hash is stale"
            echo "- expected: $(basename "$PIN")"
            echo "- actual:   $(basename "$(dirname "$NEW")")"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
