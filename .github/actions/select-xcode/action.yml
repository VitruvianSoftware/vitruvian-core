name: Select the pinned Xcode
description: >-
  Switches the runner to the Xcode named in .xcode-version and fails if it is
  not installed. Swift is the one compiler Bazel cannot pin itself: rules_swift
  and apple_support use whatever Xcode xcode-select points at. Without this, CI
  built with the runner's default Xcode while developers built with theirs, and
  a Swift line that compiled on one failed on the other (#2536).
runs:
  using: composite
  steps:
    - name: Select Xcode from .xcode-version
      shell: bash
      run: |
        set -euo pipefail
        want="$(tr -d '[:space:]' < .xcode-version)"
        for app in "/Applications/Xcode_${want}.app" "/Applications/Xcode_${want}.0.app"; do
          if [ -d "$app" ]; then
            sudo xcode-select -s "$app/Contents/Developer"
            break
          fi
        done
        got="$(xcodebuild -version | head -1 | awk '{print $2}')"
        # "27.0" must select an Xcode whose version is 27.0 or 27.0.x.
        case "$got" in
          "$want"|"$want".*) echo "Using Xcode $got ($(xcode-select -p))" ;;
          *)
            echo "::error::.xcode-version pins Xcode ${want}, but this runner has Xcode ${got} selected and no /Applications/Xcode_${want}.app. Move the job to a runner image that ships it, or bump .xcode-version deliberately."
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
            ;;
        esac
