# Canonical vitruviansoftware-pulumi App token mint: the pinned
# create-github-app-token action + this App's default client-id, in one
# place so the 3 inline copies don't drift. Authenticates Pulumi's github://
# state-backend plugin.
#
# private-key MUST still be passed by the caller: composite actions do not
# automatically inherit the calling workflow's `secrets` context — every
# caller passes `secrets.APP_PRIVATE_KEY` explicitly, same as before.
#
# client-id stays caller-resolved (vars.PULUMI_APP_CLIENT_ID at the call
# site, falling back to this App's default id here) rather than hardcoded
# entirely: the var lets //tools/pulumi:create-app rebootstrap a NEW App
# during recovery, which a hardcoded id in this composite would prevent.
#
# Requires the repo to be checked out first (composite actions referenced as
# `./.github/actions/...` resolve from the workspace).
name: Mint Pulumi App token
description: Mint a short-lived vitruviansoftware-pulumi GitHub App installation token.

inputs:
  private-key:
    description: The App's private key (secrets.APP_PRIVATE_KEY at the call site).
    required: true
  client-id:
    description: Override the App client-id (vars.PULUMI_APP_CLIENT_ID at the call site). Empty uses this App's default id.
    required: false
    default: ""
  owner:
    description: Optional — narrow the grant to this owner instead of the App's full installation.
    required: false
    default: ""

outputs:
  token:
    description: The minted installation token.
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    - id: mint
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id || 'Iv23lijyULMNaNPFbaQZ' }} # vitruviansoftware-pulumi
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
