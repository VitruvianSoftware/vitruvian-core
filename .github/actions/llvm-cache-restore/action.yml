# Cache the EXTRACTED llvm toolchain (#1039) -- the dominant variance source in
# Bazel-graph CI lanes (uncached extraction measured 98-264s/run; build-test's
# spread is 336-545s).
#
# Why none of the generic layers ever cover it (all verified):
#  - repository-cache caches DOWNLOADS; extraction lands in the Bazel 9 repo
#    contents cache (~/.cache/bazel-repo/contents) and the shared "repository"
#    entry is immutable + won by whichever job saves first -- a cheap lane
#    that never fetched llvm (169MB entry, dated pre-#1297).
#  - setup-bazel's external-cache sizes $output_base/external/* entries; the
#    llvm entry there is a SYMLINK into the contents cache (du: 4.0K apparent
#    vs 8.2G real), so it always falls under the 10MB floor and is silently
#    skipped (#1302, closed).
#  - caching the whole contents tree is 3.81GB compressed -- too fat for the
#    10GB Actions budget. The llvm subtree is 8.2G of the 13G, so this caches
#    exactly that content-hash dir and nothing else.
#
# NO FOLDER NAME IS PINNED (#2456). Bazel names the extracted folder after a
# hash of the llvm repo rule's whole definition, so it moves on more than an
# llvm_versions bump -- a rules_cc bump (#2419) moved it, and the hand-copied
# name this file used to carry left every Bazel lane re-extracting for ~20 runs
# (#2455). Now the cache saves and restores one FIXED folder (the stage), and
# //tools/ci:llvm_cache_stage moves the real <hash>/ in and out of Bazel's
# contents cache by whatever name it actually has:
#
#   here (restore)      stage/<hash>/  --mv-->  contents/<hash>/
#   tripwire (job end)  contents/<hash>/ holding bin/clang  --hard link-->
#                       stage/<hash>/, which this action's post step saves
#
# The llvm-cache-tripwire composite still fails a job whose restored toolchain
# Bazel refused to reuse, and notices a missing restore step -- the placement
# bug that shipped once already (a lane paid full extraction while green).

# The KEY is a separate concern from the PIN, and is derived by
# //tools/ci:llvm_cache_key. It has to track every recorded input of the
# llvm_toolchain_llvm repo rule -- which includes /etc/os-release, because
# toolchains_llvm reads it to pick a distribution. Keying on MODULE.bazel
# alone made a GitHub runner-image point release (Ubuntu 24.04.4 -> 24.04.5)
# hit a 2.2GB entry that Bazel then rejected and re-extracted on EVERY run,
# with the exact-key hit stopping the post step from ever saving the good
# contents (#2242). Read the header of tools/ci/src/llvm_cache_key/lib.rs
# before touching the key.
#
# Both tools are built here with the runner's rustc (./.github/actions/
# build-ci-tool), not with Bazel: a Bazel-built Rust binary links with the
# hermetic LLVM toolchain, which is exactly what this restores.
#
# Requires the repo to be checked out and Bazel set up (./.github/actions/
# setup-bazel) first, so the bazel-repo contents-cache directory exists.
name: Restore extracted LLVM toolchain
description: >-
  Restore the extracted LLVM toolchain's content-hash directory from
  the Actions cache, and record the pre-build candidate count the
  llvm-cache-tripwire composite needs.

inputs:
  restore-only:
    description: >-
      When 'true', restore without ever saving (actions/cache/restore) -- for
      a lane that reuses another job's cache entry without owning writes to
      it (tidy-check.yaml loads the same 64k-target graph as ci.yaml's
      build-test; a second writer would just waste upload budget on a
      redundant save). On main the writers are the read+write GitHub-hosted
      jobs that actually run there: tabula-e2e.yaml (tabula pushes and its
      daily schedule), and ci.yaml's build-test and go-race on the pushes
      the merge queue did not already pass. When 'false' (the default),
      use full read+write actions/cache, which also saves a fresh extraction
      in its post step on a cache miss -- but only in a GitHub-hosted job on
      main; everywhere else (merge queue, pull requests, self-hosted runners)
      the restore is read-only regardless of this input.
    required: false
    default: "false"

outputs:
  pin-path:
    description: >-
      Absolute path to the LLVM content-hash directory this restore put in
      place, or empty when nothing was restored. The name comes from the cache
      entry itself, never from this file (see the header).
    value: ${{ steps.place.outputs.pin }}
  cache-hit:
    description: Whether the LLVM contents cache was an exact-key hit (`true`/`false`).
    value: ${{ steps.resolve.outputs.cache-hit }}
  outcome:
    description: >-
      The restore step's own recorded outcome (`success`, `failure`, ...).
      The llvm-cache-tripwire composite fails loudly if this is ever anything
      but `success` -- that means the restore step did not run in this job at
      all, which is the exact placement bug that shipped once already.
    value: ${{ steps.resolve.outputs.outcome }}
  pre-count:
    description: >-
      Number of candidate dirs materialized under the restored content hash
      BEFORE the build runs. The llvm-cache-tripwire composite compares this
      to the post-build count to catch a cache hit that Bazel rejected and
      re-extracted anyway (dead-weight cache).
    value: ${{ steps.pre-count.outputs.count }}

runs:
  using: composite
  steps:
    # The only place the two folders are named. Exported to the job env too,
    # so the llvm-cache-tripwire composite stages into the same stage folder
    # without every caller passing it through.
    - name: Resolve LLVM cache paths
      id: paths
      shell: bash
      run: |
        stage=/home/runner/.cache/llvm-contents-stage
        contents=/home/runner/.cache/bazel-repo/contents
        echo "stage=$stage" >> "$GITHUB_OUTPUT"
        echo "contents=$contents" >> "$GITHUB_OUTPUT"
        echo "LLVM_CACHE_STAGE=$stage" >> "$GITHUB_ENV"
        echo "LLVM_CACHE_CONTENTS=$contents" >> "$GITHUB_ENV"

    - name: Build the LLVM cache key tool
      id: key-tool
      uses: ./.github/actions/build-ci-tool
      with:
        tool: llvm_cache_key

    # LLVM_CACHE_STAGE_BIN is exported so the llvm-cache-tripwire composite and
    # tidy-check's toolchain check run this same binary after the build.
    - name: Build the LLVM cache stage tool
      id: stage-tool
      uses: ./.github/actions/build-ci-tool
      with:
        tool: llvm_cache_stage

    - name: Export the LLVM cache stage tool
      shell: bash
      env:
        STAGE_BIN: ${{ steps.stage-tool.outputs.path }}
      run: echo "LLVM_CACHE_STAGE_BIN=${STAGE_BIN}" >> "$GITHUB_ENV"

    # The key must move with EVERY recorded input of the llvm_toolchain_llvm
    # repo rule, not just MODULE.bazel -- toolchains_llvm reads /etc/os-release
    # to pick its distribution, so a runner-image point release invalidates the
    # extracted contents while the old key still hits. See the long note in
    # tools/ci/src/llvm_cache_key/lib.rs for the full failure mode (#2242).
    - name: Derive the LLVM contents cache key
      id: key
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        MODULE_HASH: ${{ hashFiles('MODULE.bazel') }}
        KEY_BIN: ${{ steps.key-tool.outputs.path }}
      run: |
        key=$("$KEY_BIN" "$RUNNER_OS_NAME" "$MODULE_HASH")
        echo "value=$key" >> "$GITHUB_OUTPUT"
        echo "llvm contents cache key: $key"

    # Read+write only for a GitHub-hosted job on main; every other job is a
    # pure reader. A cache saved on a merge-queue or PR ref is unreadable by
    # anyone else yet evicts main's entries from the shared 10 GiB budget, and
    # self-hosted runners upload too slowly to save safely -- see the note on
    # the save guard in ../setup-bazel/action.yml (2026-10-31 queue incident).
    - name: Decide whether this job may save
      id: mode
      shell: bash
      env:
        RESTORE_ONLY: ${{ inputs.restore-only }}
        MAY_SAVE: ${{ github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' }}
      run: |
        # LLVM_CACHE_SAVES tells the llvm-cache-tripwire composite whether
        # this job's post step saves, so its cache-miss notice says what
        # actually happens to the fresh extraction.
        if [ "$RESTORE_ONLY" = "true" ] || [ "$MAY_SAVE" != "true" ]; then
          echo "readonly=true" >> "$GITHUB_OUTPUT"
          echo "LLVM_CACHE_SAVES=false" >> "$GITHUB_ENV"
          echo "LLVM contents cache: restore only (saves happen on GitHub-hosted main jobs)"
        else
          echo "readonly=false" >> "$GITHUB_OUTPUT"
          echo "LLVM_CACHE_SAVES=true" >> "$GITHUB_ENV"
        fi

    - name: Restore the extracted LLVM toolchain
      id: restore-rw
      if: steps.mode.outputs.readonly != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.paths.outputs.stage }}
        key: ${{ steps.key.outputs.value }}

    - name: Restore the extracted LLVM toolchain (read-only)
      id: restore-ro
      if: steps.mode.outputs.readonly == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.paths.outputs.stage }}
        key: ${{ steps.key.outputs.value }}

    # Exactly one of the two steps above ran (mutually exclusive `if:`); fold
    # their outputs into one place so callers don't need to know which mode
    # was used. `steps.<id>.outcome` is populated even for a skipped step
    # (`skipped`), so it can't be string-concatenated like a normal output --
    # branch on the same decision instead.
    - name: Resolve restore outcome
      id: resolve
      shell: bash
      run: |
        if [ "${{ steps.mode.outputs.readonly }}" = "true" ]; then
          echo "outcome=${{ steps.restore-ro.outcome }}" >> "$GITHUB_OUTPUT"
          echo "cache-hit=${{ steps.restore-ro.outputs.cache-hit }}" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=${{ steps.restore-rw.outcome }}" >> "$GITHUB_OUTPUT"
          echo "cache-hit=${{ steps.restore-rw.outputs.cache-hit }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Move the restored LLVM toolchain into place
      id: place
      shell: bash
      env:
        STAGE: ${{ steps.paths.outputs.stage }}
        CONTENTS: ${{ steps.paths.outputs.contents }}
      run: |
        pin=$("$LLVM_CACHE_STAGE_BIN" restore "$STAGE" "$CONTENTS")
        echo "pin=$pin" >> "$GITHUB_OUTPUT"
        echo "restored LLVM toolchain: ${pin:-<none>}"
    - name: Record LLVM candidate count (pre-build)
      id: pre-count
      shell: bash
      env:
        PIN: ${{ steps.place.outputs.pin }}
      run: |
        echo "count=$( { [ -n "$PIN" ] && ls "$PIN" 2>/dev/null; } | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
