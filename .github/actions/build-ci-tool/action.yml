# Builds one of the std-only Rust tools in tools/ci/src/<tool>/ with the
# runner's rustc, for steps that run before (or without) Bazel: the
# changed-paths gate decides whether Bazel is set up at all, the LLVM cache
# restore runs before the first build that would extract LLVM, and the merge
# queue and fast-lane lookups run on a sparse checkout with no Bazel. Each tool
# is a lib.rs plus a main.rs over //tools/shell-compat, nothing else, so three
# rustc calls build exactly what //tools/ci:<tool> builds, in about a second.
#
# These are the only rustc command lines for those tools in any workflow or
# action. //tools/ci:build_ci_tool_test runs this step's `run:` block verbatim
# with the Bazel toolchain's rustc, for every tool, so a change here that stops
# building fails `bazel test` before it can fail a lane.
name: Build a tools/ci Rust tool
description: >-
  Compile tools/ci/src/<tool> (lib.rs + main.rs over tools/shell-compat) with
  the runner's rustc and output the binary's path.

inputs:
  tool:
    description: >-
      The tool's folder under tools/ci/src, which is also its crate name
      (for example relevant_paths).
    required: true
  source-root:
    description: >-
      The checkout to build from; empty means the workspace. The fast-lane
      steps pass a checkout of the pull request's BASE commit, so a pull
      request cannot rewrite the rule that decides whether it may skip tests.
    required: false
    default: ""

outputs:
  bin:
    description: Absolute path of the built binary.
    value: ${{ steps.build.outputs.bin }}

runs:
  using: composite
  steps:
    - name: Build tools/ci/src/${{ inputs.tool }}
      id: build
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        SOURCE_ROOT: ${{ inputs.source-root }}
      run: |
        case "$TOOL" in
          '' | *[!a-z0-9_]*) echo "::error::build-ci-tool: tool must be a crate name under tools/ci/src, got '$TOOL'"; exit 1 ;;
        esac
        root="${SOURCE_ROOT:-$GITHUB_WORKSPACE}"
        command -v rustc >/dev/null || { echo "::error::build-ci-tool: no rustc on this runner, so tools/ci/src/$TOOL cannot be built"; exit 1; }
        out="$(mktemp -d "$RUNNER_TEMP/ci-tool-$TOOL.XXXXXX")"
        rustc --edition 2021 -O --crate-type lib --crate-name shell_compat "$root/tools/shell-compat/src/lib.rs" -o "$out/libshell_compat.rlib"
        rustc --edition 2021 -O --crate-type lib --crate-name "$TOOL" "$root/tools/ci/src/$TOOL/lib.rs" -L "$out" --extern shell_compat="$out/libshell_compat.rlib" -o "$out/lib$TOOL.rlib"
        rustc --edition 2021 -O "$root/tools/ci/src/$TOOL/main.rs" -L "$out" --extern shell_compat="$out/libshell_compat.rlib" --extern "$TOOL=$out/lib$TOOL.rlib" -o "$out/$TOOL"
        echo "bin=$out/$TOOL" >> "$GITHUB_OUTPUT"
