name: Zitadel tunnel setup
description: >-
  Join the tailnet and prepare a local TLS terminator for the internal route
  to auth.ipv1337.dev (Zitadel), deduped from _zitadel-apps-apply.yaml and
  zitadel-apps-mcp-slack-apply.yaml's identical copies. This ONLY prepares the
  cert/hosts-file/tailnet join -- it deliberately does NOT start the socat
  tunnel itself. socat's `&` background process does not survive across a
  step boundary, so the actual `sudo socat OPENSSL-LISTEN:443,... &` +
  healthz-wait must stay inlined in the SAME step as whatever command (pulumi,
  etc.) needs the route -- see either caller for that half.

inputs:
  tailscale-oauth-client-id:
    required: true
  tailscale-oauth-secret:
    required: true

runs:
  using: composite
  steps:
    - name: Join the tailnet (ephemeral, tag:ci)
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        # OAuth client (no expiry) — mints a short-lived ephemeral tag:ci key
        # per run, so there's no 90-day auth-key rotation chore. The client
        # carries the `auth_keys` write scope tagged tag:ci; `tags:` is
        # required with OAuth.
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        tags: tag:ci
        # v4 already passes `--accept-routes`; don't add it in args.

    - name: Prepare the internal TLS route to the Envoy gateway
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq && sudo apt-get install -y -qq socat
        # Zitadel ties the JWT-profile audience to the connection scheme and
        # only accepts the https issuer, so the provider must see HTTPS.
        # Terminate TLS locally with a trusted self-signed cert for the host,
        # forwarding the decrypted HTTP (Host preserved) to the internal
        # Envoy gateway.
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem \
          -days 1 -subj "/CN=auth.ipv1337.dev" -addext "subjectAltName=DNS:auth.ipv1337.dev"
        sudo cp /tmp/c.pem /usr/local/share/ca-certificates/auth-internal.crt
        sudo update-ca-certificates >/dev/null
        cat /tmp/c.pem /tmp/k.pem | sudo tee /etc/auth-internal-ck.pem >/dev/null
        echo "127.0.0.1 auth.ipv1337.dev" | sudo tee -a /etc/hosts >/dev/null
