version: 2
updates:
  # ─── Go modules (per go.work member; root //:go.mod is an empty placeholder) ───
  - package-ecosystem: "gomod"
    directory: "/devx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/homelab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # ─── Root workflows only (Dependabot can't scan component subtree workflows) ───
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # ─── npm deps for the whole pnpm workspace (the monorepo is the dep
  #     authority; the mirror Dependabot configs are being retired). ONE block
  #     at the workspace ROOT — where pnpm-lock.yaml lives — because Dependabot
  #     cannot update a lockfile outside its configured directory: the previous
  #     per-app blocks produced manifest-only PRs that never touched the root
  #     lock, which caused every lock-skew incident (#531) and which the
  #     tidy-check lockfile-sync guard now rightly rejects. Root scope covers
  #     every member of pnpm-workspace.yaml (tabula/*, mcp-slack, nexus-agent,
  #     oauth-user-inspector, tools, packages/*) with coherent lock updates.
  #     Group name *-minor-patch so dependabot-auto-merge enqueues them like
  #     the gomod groups. ───
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # react + react-dom MUST share a major version or the app fails to mount at
      # runtime (react 19 + react-dom 18 broke prod 2026-06-27). Group them (+ their
      # types) across ALL update-types so a bump can never split them. This group
      # isn't *-minor-patch, so a react major lands as a single non-auto-merged PR
      # for deliberate review — exactly what a framework major warrants.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The jest runner family must move as a set: a solo jest-cli major
      # against an older jest core dies at runtime (dependabot #564), and a
      # jest-environment-jsdom major drags a jsdom major that breaks DOM tests
      # (jsdom 26 unforgeable window.location + cssstyle rgb() — the bulk of
      # the jest-30 migration, #573). Group them across ALL update-types so a
      # major arrives as ONE non-auto-merged PR for the deliberate test
      # migration it always requires. NB: jest 30's resolver also needs
      # ts-first moduleFileExtensions in each tabula jest.config.js (compiled
      # .js siblings in the Bazel bin tree) — already in place.
      jest:
        patterns:
          - "jest"
          - "jest-cli"
          - "jest-environment-jsdom"
          - "@types/jest"
          - "ts-jest"
          - "babel-jest"
      # Storybook refuses to run when its packages disagree on version -- the
      # core does a version check across every @storybook/* it loads and hard
      # errors. So the family cannot be bumped one package at a time, and
      # ungrouped is exactly what it got: the 9.1.20 -> 10.5.4 major arrived as
      # four separate PRs (storybook #1215, react-vite #1214, addon-a11y #1216,
      # addon-docs #1218). Each regenerated pnpm-lock.yaml from a different base,
      # so all four conflicted with each other and with every other npm PR that
      # touched the lock -- none of them could be merged, and merging any one
      # would have left the tree on a mix of 9 and 10.
      # Grouped across ALL update-types for the same reason as `jest` above: a
      # storybook major is a deliberate migration, and it should arrive as ONE
      # PR carrying ONE internally consistent lockfile.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to the Bazel-vendored browser build (MODULE.bazel documents the
      # coupling): Playwright >= 1.58 fetches chromium from Chrome-for-Testing
      # CDN paths that rules_playwright cannot mirror -- a bump here without
      # re-vendoring the browsers wipes out the whole e2e lane at launch
      # ("Executable doesn't exist ... chromium-<n>/chrome"). Bump ONLY
      # together with the rules_playwright browser re-vendor.
      - dependency-name: "@playwright/test"
      # The fastify family moves together — permanently. Each @fastify/*
      # plugin major tracks a fastify major via fastify-plugin's boot-time
      # version check, so a solo major in ANY of them is a startup-fatal
      # FST_ERR_PLUGIN_VERSION_MISMATCH (proven twice: rate-limit-10 on
      # fastify 4, and dependabot #536's solo fastify-5). Fastify majors land
      # as ONE coordinated PR bumping the whole set (fastify 4->5 was #530) —
      # and plugin majors can hide runtime-only breaks (cors 11 narrowed the
      # default CORS methods to GET/HEAD/POST). Minors/patches flow normally.
      - dependency-name: "fastify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/cors"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/jwt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/rate-limit"
        update-types: ["version-update:semver-major"]
      # Coupled to the vendored Prisma engines hash in MODULE.bazel (#528):
      # a client/CLI major without the engine re-vendor breaks migrate deploy
      # at deploy time, invisibly to CI.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
  # ─── infrastructure/pulumi Go modules (issue #462 — previously uncovered).
  #     Each is its own go.mod (GOWORK=off); a bump PR that breaks a stack fails
  #     CI and won't merge. ───
  - package-ecosystem: "gomod"
    directories:
      - "/infrastructure/pulumi/platform/dev-local"
      - "/infrastructure/pulumi/accounts/personal"
      - "/oauth-user-inspector/infra/app"
      - "/oauth-user-inspector/infra/identity"
      - "/infrastructure/pulumi/foundation/gcp-bootstrap"
      - "/infrastructure/pulumi/foundation/gcp-org"
      - "/infrastructure/pulumi/foundation/org-folders"
      - "/infrastructure/pulumi/platform/repo_config"
      - "/tabula/infra/app"
      - "/infrastructure/pulumi/platform/zitadel-apps"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # ─── pulumi-library Go modules AND the go-foundation example stages that
  #     consume them. Each is its own go.mod: the library components are
  #     workspace members, each example stage is a Pulumi project resolving the
  #     library through `replace` directives to local paths.
  #
  #     ONE entry, deliberately -- these were two separate entries until the
  #     grpc 1.80.0 -> 1.82.1 sweep (#1164/#1166/#1175/#1179/#1180) showed why
  #     that cannot work. An example carries its OWN pin of the library's
  #     transitive graph, and Dependabot cannot see across a `replace` edge: it
  #     tidies only the module it bumps. Split across two entries, the library
  #     bump and the matching example bump are always separate PRs, so the
  #     library PR lands (or is tested) with the examples still pinning the old
  #     version -- which is exactly `go: updates to go.mod needed`, and exactly
  #     what red-lined example-build three times in that one sweep.
  #
  #     Merged into a single entry, the shared `go-minor-patch` group spans both
  #     directory sets, so a dependency common to a library and its examples
  #     moves on BOTH sides in the same PR and the tree is never half-bumped.
  #
  #     This is a mitigation, NOT a guarantee, and must not be mistaken for one:
  #     grouping can only co-bump a dependency that ALREADY appears in both
  #     go.mods, and it does not group MAJOR bumps at all. A library bump that
  #     introduces a brand-new transitive module still desyncs the examples.
  #     `bazel run //tools/gomod:check` (wired into example-build) is the actual
  #     backstop; this just makes it fire far less often. ───
  - package-ecosystem: "gomod"
    directories:
      - "/pulumi/library/go"
      - "/pulumi/library/go/pkg/*"
      - "/pulumi/examples/go-foundation/*"
    schedule:
      interval: "weekly"
    # Raised from 5: this entry now covers both directory sets, so the ungrouped
    # remainder (majors) comes from ~56 modules rather than ~29.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
