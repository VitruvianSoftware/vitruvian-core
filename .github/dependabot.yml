version: 2
updates:
  # ─── Go modules (per go.work member; root //:go.mod is an empty placeholder) ───
  - package-ecosystem: "gomod"
    directory: "/devx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/homelab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # ─── Root workflows only (Dependabot can't scan component subtree workflows) ───
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # ─── npm deps for the node apps (the monorepo is the dep authority; the
  #     mirror Dependabot configs are being retired). Group name *-minor-patch
  #     so dependabot-auto-merge enqueues them like the gomod groups. ───
  - package-ecosystem: "npm"
    directory: "/mcp-slack"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/nexus-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/oauth-user-inspector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # react + react-dom MUST share a major version or the app fails to mount at
      # runtime (react 19 + react-dom 18 broke prod 2026-06-27). Group them (+ their
      # types) across ALL update-types so a bump can never split them. This group
      # isn't *-minor-patch, so a react major lands as a single non-auto-merged PR
      # for deliberate review — exactly what a framework major warrants.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
