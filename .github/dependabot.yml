version: 2
updates:
  # ─── Go modules (per go.work member; root //:go.mod is an empty placeholder) ───
  - package-ecosystem: "gomod"
    directory: "/devx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
      go-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/homelab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
      go-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
  # ─── Root workflows only (Dependabot can't scan component subtree workflows) ───
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      actions-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
  # ─── npm deps for the whole pnpm workspace (the monorepo is the dep
  #     authority; the mirror Dependabot configs are being retired). ONE block
  #     at the workspace ROOT — where pnpm-lock.yaml lives — because Dependabot
  #     cannot update a lockfile outside its configured directory: the previous
  #     per-app blocks produced manifest-only PRs that never touched the root
  #     lock, which caused every lock-skew incident (#531) and which the
  #     tidy-check lockfile-sync guard now rightly rejects. Root scope covers
  #     every member of pnpm-workspace.yaml (tabula/*, mcp-slack, nexus-agent,
  #     oauth-user-inspector, tools, packages/*) with coherent lock updates.
  #     Group name *-minor-patch so dependabot-auto-merge enqueues them like
  #     the gomod groups. ───
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # react + react-dom MUST share a major version or the app fails to mount at
      # runtime (react 19 + react-dom 18 broke prod 2026-06-27). Group them (+ their
      # types) across ALL update-types so a bump can never split them. This group
      # isn't *-minor-patch, so a react major lands as a single non-auto-merged PR
      # for deliberate review — exactly what a framework major warrants.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: "security-updates"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The jest runner family must move as a set: a solo jest-cli major
      # against an older jest core dies at runtime (dependabot #564), and a
      # jest-environment-jsdom major drags a jsdom major that breaks DOM tests
      # (jsdom 26 unforgeable window.location + cssstyle rgb() — the bulk of
      # the jest-30 migration, #573). Group them across ALL update-types so a
      # major arrives as ONE non-auto-merged PR for the deliberate test
      # migration it always requires. NB: jest 30's resolver also needs
      # ts-first moduleFileExtensions in each tabula jest.config.js (compiled
      # .js siblings in the Bazel bin tree) — already in place.
      jest:
        patterns:
          - "jest"
          - "jest-cli"
          - "jest-environment-jsdom"
          - "@types/jest"
          - "ts-jest"
          - "babel-jest"
      jest-security:
        applies-to: "security-updates"
        patterns:
          - "jest"
          - "jest-cli"
          - "jest-environment-jsdom"
          - "@types/jest"
          - "ts-jest"
          - "babel-jest"
      # Storybook refuses to run when its packages disagree on version -- the
      # core does a version check across every @storybook/* it loads and hard
      # errors. So the family cannot be bumped one package at a time, and
      # ungrouped is exactly what it got: the 9.1.20 -> 10.5.4 major arrived as
      # four separate PRs (storybook #1215, react-vite #1214, addon-a11y #1216,
      # addon-docs #1218). Each regenerated pnpm-lock.yaml from a different base,
      # so all four conflicted with each other and with every other npm PR that
      # touched the lock -- none of them could be merged, and merging any one
      # would have left the tree on a mix of 9 and 10.
      # Grouped across ALL update-types for the same reason as `jest` above: a
      # storybook major is a deliberate migration, and it should arrive as ONE
      # PR carrying ONE internally consistent lockfile.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      storybook-security:
        applies-to: "security-updates"
        patterns:
          - "storybook"
          - "@storybook/*"
      # react-router + react-router-dom must move together
      react-router:
        patterns:
          - "react-router"
          - "react-router-dom"
          - "@types/react-router"
          - "@types/react-router-dom"
      react-router-security:
        applies-to: "security-updates"
        patterns:
          - "react-router"
          - "react-router-dom"
          - "@types/react-router"
          - "@types/react-router-dom"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Backstage 1.x requires React Router v6 (pinned in catalogs: backstage in
      # pnpm-workspace.yaml). Major bumps to v7/v8 break Backstage frontend routing.
      # NOTE: this ignore is repo-wide (there is one npm entry, directory: /) and has
      # no expiry -- nothing prompts a revisit. See
      # docs/dependency-versioning/javascript.md ("Named catalogs holding a framework
      # back") for when and how to remove it.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # Pinned to the Bazel-vendored browser build (MODULE.bazel documents the
      # coupling): Playwright >= 1.58 fetches chromium from Chrome-for-Testing
      # CDN paths that rules_playwright cannot mirror -- a bump here without
      # re-vendoring the browsers wipes out the whole e2e lane at launch
      # ("Executable doesn't exist ... chromium-<n>/chrome"). Bump ONLY
      # together with the rules_playwright browser re-vendor.
      - dependency-name: "@playwright/test"
      # The fastify family moves together — permanently. Each @fastify/*
      # plugin major tracks a fastify major via fastify-plugin's boot-time
      # version check, so a solo major in ANY of them is a startup-fatal
      # FST_ERR_PLUGIN_VERSION_MISMATCH (proven twice: rate-limit-10 on
      # fastify 4, and dependabot #536's solo fastify-5). Fastify majors land
      # as ONE coordinated PR bumping the whole set (fastify 4->5 was #530) —
      # and plugin majors can hide runtime-only breaks (cors 11 narrowed the
      # default CORS methods to GET/HEAD/POST). Minors/patches flow normally.
      - dependency-name: "fastify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/cors"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/jwt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/rate-limit"
        update-types: ["version-update:semver-major"]
      # Coupled to the vendored Prisma engines hash in MODULE.bazel (#528):
      # a client/CLI major without the engine re-vendor breaks migrate deploy
      # at deploy time, invisibly to CI.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
  # ─── policy-library: the Pulumi CrossGuard policy pack (issue #1391).
  #
  #     WHY A SECOND npm ENTRY, when the block above says "ONE block at the
  #     workspace ROOT". That rule is about pnpm WORKSPACE MEMBERS, which share
  #     the root pnpm-lock.yaml and must be bumped through it or the lock skews
  #     (#531). policy-library is not one: it is absent from
  #     pnpm-workspace.yaml, carries its own package.json + package-lock.json,
  #     and Pulumi's policy runner installs it with npm at `pulumi up` time. So
  #     the root entry cannot reach it -- Dependabot only updates a lockfile
  #     inside its configured directory -- and it had NO scheduled updates at
  #     all. Its lock is standalone, so bumping it here cannot skew the root
  #     lock; the two share no resolution.
  #
  #     WHAT WENT WRONG WITHOUT IT: it drifted into a red REQUIRED osv-scan
  #     three times, each cleared by a hand-written PR -- #1184
  #     (brace-expansion), #1185 (tar), and #1390, where it carried 7 of the 24
  #     advisories that blocked every open dependency PR at once. Three hand
  #     fixes for the same missing config is the signal this entry answers.
  #
  #     WHAT THIS DOES AND DOES NOT BUY. It bumps the pack's DIRECT deps
  #     (@pulumi/policy, @pulumi/pulumi, typescript) on a schedule, which
  #     regenerates package-lock.json and pulls a fresh transitive tree with it
  #     -- that is what keeps ordinary drift from accumulating. It does NOT make
  #     every advisory fixable: alert-driven security updates already ran
  #     against this directory before this entry existed, and failed
  #     `security_update_not_possible` -- "undici is a transitive dependency and
  #     no update path was found ... the parent package(s) that depend on it in
  #     the lockfile require" an older range (job 1506484471, 2026-08-04).
  #     Dependabot cannot rewrite a parent's range, so a transitive advisory
  #     whose parents lag stays unfixable BY DEPENDABOT no matter what is
  #     configured here. The tool for that case is the npm `overrides` block in
  #     this directory's package.json, added in #1390 -- keep the two in mind
  #     together: this entry prevents the drift, overrides clear what it cannot.
  #
  #     NOT a corepack problem. #1191 attributes this directory class's failures
  #     to corepack intercepting `npm update` because the ROOT package.json
  #     declares `packageManager: pnpm`. That was true when it was filed
  #     (2026-07-25) and is no longer: the updater now runs `corepack prepare
  #     npm@11 --activate` first and it succeeds. Verified across four update
  #     jobs on 2026-08-04 (runs 30934672222/30934672307/30934672459/30934673760)
  #     -- zero corepack errors, all four failing on resolution instead. Do not
  #     re-diagnose this as corepack without re-measuring.
  #
  #     Group named *-minor-patch so dependabot-auto-merge enqueues it: that
  #     workflow matches `contains(head_branch, '-minor-patch')`. ───
  - package-ecosystem: "npm"
    directory: "/pulumi/examples/go-foundation/policy-library"
    schedule:
      interval: "weekly"
    # Three direct dependencies, so the ungrouped remainder (majors) is tiny.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      policy-library-minor-patch:
        update-types:
          - "minor"
          - "patch"
      policy-library-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
  # ─── infrastructure/pulumi Go modules (issue #462 — previously uncovered).
  #     Each is its own go.mod (GOWORK=off); a bump PR that breaks a stack fails
  #     CI and won't merge. ───
  - package-ecosystem: "gomod"
    directories:
      # Recursive glob, not the previous hand-maintained list of 7: that list had
      # drifted to cover 7 of the 33 go.mods under this tree, leaving
      # pkg/secrets and 26 foundation stacks unscanned entirely. A single `**`
      # cannot drift. NB `*` does NOT cross `/` -- a single-star glob here would
      # match only the immediate children and miss every nested stack.
      - "/infrastructure/pulumi/**"
      # Outside the pulumi tree, so still enumerated.
      - "/oauth-user-inspector/infra/app"
      - "/oauth-user-inspector/infra/identity"
      - "/tabula/infra/app"
    schedule:
      interval: "weekly"
    # Raised from 5 alongside the `**` above: this entry went from 7 hand-listed
    # modules to ~33, and the old limit would starve the tail of the tree the
    # recursive glob just made visible.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
      go-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
  # ─── pulumi-library Go modules AND the go-foundation example stages that
  #     consume them. Each is its own go.mod: the library components are
  #     workspace members, each example stage is a Pulumi project resolving the
  #     library through `replace` directives to local paths.
  #
  #     ONE entry, deliberately -- these were two separate entries until the
  #     grpc 1.80.0 -> 1.82.1 sweep (#1164/#1166/#1175/#1179/#1180) showed why
  #     that cannot work. An example carries its OWN pin of the library's
  #     transitive graph, and Dependabot cannot see across a `replace` edge: it
  #     tidies only the module it bumps. Split across two entries, the library
  #     bump and the matching example bump are always separate PRs, so the
  #     library PR lands (or is tested) with the examples still pinning the old
  #     version -- which is exactly `go: updates to go.mod needed`, and exactly
  #     what red-lined example-build three times in that one sweep.
  #
  #     Merged into a single entry, the shared `go-minor-patch` group spans both
  #     directory sets, so a dependency common to a library and its examples
  #     moves on BOTH sides in the same PR and the tree is never half-bumped.
  #
  #     This is a mitigation, NOT a guarantee, and must not be mistaken for one:
  #     grouping can only co-bump a dependency that ALREADY appears in both
  #     go.mods, and it does not group MAJOR bumps at all. A library bump that
  #     introduces a brand-new transitive module still desyncs the examples.
  #     `bazel run //tools/gomod:check` (wired into example-build) is the actual
  #     backstop; this just makes it fire far less often. ───
  - package-ecosystem: "gomod"
    directories:
      - "/pulumi/library/go"
      - "/pulumi/library/go/pkg/*"
      - "/pulumi/examples/go-foundation/**"
    schedule:
      interval: "weekly"
    # Raised from 5: this entry now covers both directory sets, so the ungrouped
    # remainder (majors) comes from ~56 modules rather than ~29.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
      go-security-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
