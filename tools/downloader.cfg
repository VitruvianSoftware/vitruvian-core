# Workaround https://github.com/bazelbuild/bazel-central-registry/issues/5513
rewrite ftp.gnu.org/(.*) https://ftpmirror.gnu.org/$1

# The agent egress proxy in Claude Code cloud sessions serves github.com source
# archives only for repositories in the session's scope; every other one 403s.
# bats-core is registered as a toolchain by aspect_bazel_lib, so it is fetched by
# ANY `bazel run`/`bazel test` -- which meant no bazel target at all could run in a
# cloud session, including //tools/cloud-bootstrap:whoami, the tool whose whole job
# is to tell such a session what it has. Bazel's own mirror carries the identical
# artifact and is not scope-gated, so this fixes every cloud session permanently
# rather than asking each one to widen its repo scope for a dependency we never
# execute directly. Harmless elsewhere: CI and laptops just take the mirror.
rewrite github.com/bats-core/bats-core/archive/(.*) https://mirror.bazel.build/github.com/bats-core/bats-core/archive/$1
