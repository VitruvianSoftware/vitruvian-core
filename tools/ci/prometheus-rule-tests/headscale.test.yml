#
# Unit tests for the `headscale` alert group in
# gitops/argocd/platform/prometheus/applicationset.yaml, fed by
# headscale-key-exporter and policy-sync (gitops/argocd/platform/headscale/).
#
# These exist because the CI pre-auth key (HEADSCALE_CI_AUTHKEY) and Headplane's
# API key expire on a date, and nothing used to say so before the day they
# stopped working. The tests pin the two thresholds (warn under 30 days, page
# under 3), that a credential far from expiry stays quiet, and that the
# exporter going blind is itself an alert rather than silence.
#
# Samples are 1m apart: sparser ones go stale between points (5m lookback),
# which resets `for:` and the alert never fires. An empty Prometheus label is
# no label, so the API key's user="" is simply absent here.
#
# promtool starts the clock at 0, so time() at eval_time T is T in seconds and
# a series value of N days means "expires N days after the test starts".
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------ 30-day warn --
  - interval: 1m
    name: A key crossing 30 days left warns after an hour, not before
    input_series:
      # Expires half an hour before day 31: under 30 days left from 23h30m on.
      - series: 'headscale_credential_expiration_timestamp_seconds{kind="preauthkey",id="5",name="tag:ci",user="james",reusable="true",ephemeral="true"}'
        values: '2676600x1600'
    alert_rule_test:
      - eval_time: 23h
        alertname: HeadscaleCredentialExpiringSoon
        exp_alerts: []
      # Condition true from 23h31m; `for: 1h` holds it pending until 24h31m.
      - eval_time: 24h
        alertname: HeadscaleCredentialExpiringSoon
        exp_alerts: []
      - eval_time: 25h
        alertname: HeadscaleCredentialExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
              kind: preauthkey
              id: "5"
              name: "tag:ci"
              user: james
              reusable: "true"
              ephemeral: "true"
            exp_annotations:
              summary: "Headscale preauthkey tag:ci (id 5) expires in 29d 22h 30m 0s"
              description: "Headscale preauthkey tag:ci (id 5, user james) expires in 29d 22h 30m 0s. Rotate it before then: what uses each key and how to rotate it is in gitops/argocd/platform/headscale/README.md. A key nothing uses any more can be expired instead (bazel run //tools/gitops:headscale-apikey-expire or :headscale -- preauthkeys expire), which also clears this alert."
      # A month out is a warning, not a page.
      - eval_time: 25h
        alertname: HeadscaleCredentialExpiringImminently
        exp_alerts: []

  # ------------------------------------------------------------- 3-day page --
  - interval: 1m
    name: Three days left pages
    input_series:
      # Expires at day 4: under 3 days left from hour 24 on.
      - series: 'headscale_credential_expiration_timestamp_seconds{kind="apikey",id="3",name="TWRIQB0"}'
        values: '345600x1600'
    alert_rule_test:
      - eval_time: 24h
        alertname: HeadscaleCredentialExpiringImminently
        exp_alerts: []
      # Under 3 days it is the page alone: the warning has stood down.
      - eval_time: 26h
        alertname: HeadscaleCredentialExpiringSoon
        exp_alerts: []
      - eval_time: 26h
        alertname: HeadscaleCredentialExpiringImminently
        exp_alerts:
          - exp_labels:
              severity: page
              pagerduty_service: cluster
              kind: apikey
              id: "3"
              name: TWRIQB0
            exp_annotations:
              summary: "Headscale apikey TWRIQB0 (id 3) expires in 2d 22h 0m 0s"
              description: "Headscale apikey TWRIQB0 (id 3, user ) expires in 2d 22h 0m 0s, after a month of warnings. When it does, whatever joins or calls Headscale with it stops working (for the CI pre-auth key: every Zitadel apply workflow). Rotate it now: gitops/argocd/platform/headscale/README.md."

  # ---------------------------------------------------------- far from it --
  - interval: 1m
    name: A credential a year out never alerts
    input_series:
      - series: 'headscale_credential_expiration_timestamp_seconds{kind="preauthkey",id="5",name="tag:ci",user="james",reusable="true",ephemeral="true"}'
        values: '31536000x2900'
      - series: 'headscale_key_exporter_up'
        values: '1x2900'
    alert_rule_test:
      - eval_time: 47h
        alertname: HeadscaleCredentialExpiringSoon
        exp_alerts: []
      - eval_time: 47h
        alertname: HeadscaleCredentialExpiringImminently
        exp_alerts: []
      - eval_time: 47h
        alertname: HeadscaleKeyExporterDown
        exp_alerts: []

  # ------------------------------------------------------- exporter blind --
  - interval: 1m
    name: The exporter failing to read Headscale is an alert after 30m
    input_series:
      - series: 'headscale_key_exporter_up{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-key-exporter"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: HeadscaleKeyExporterDown
        exp_alerts: []
      - eval_time: 31m
        alertname: HeadscaleKeyExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
              job: kubernetes-service-endpoints
              namespace: headscale
              service: headscale-key-exporter
            exp_annotations:
              summary: "headscale-key-exporter is not watching every Headscale key"
              description: "headscale-key-exporter has not read the Headscale API (or some of its records) for 30m, or is not being scraped, so some Headscale key expiries are not being watched. Its log says why: bazel run //tools/gitops:logs -- -n headscale deploy/headscale-key-exporter. An HTTP 401 means its own API key expired or was revoked: re-mint it with bazel run //tools/gitops:seal-headscale-key-exporter."

  - interval: 1m
    name: The exporter missing entirely is an alert too
    input_series:
      # Some other series, so the test has input; the exporter's is absent.
      - series: 'up{job="kubernetes-service-endpoints"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 31m
        alertname: HeadscaleKeyExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
            exp_annotations:
              summary: "headscale-key-exporter is not watching every Headscale key"
              description: "headscale-key-exporter has not read the Headscale API (or some of its records) for 30m, or is not being scraped, so some Headscale key expiries are not being watched. Its log says why: bazel run //tools/gitops:logs -- -n headscale deploy/headscale-key-exporter. An HTTP 401 means its own API key expired or was revoked: re-mint it with bazel run //tools/gitops:seal-headscale-key-exporter."

  - interval: 1m
    name: Reads that silently stop are an alert even while up stays 1
    input_series:
      # up frozen at 1, but the last successful read never moves past t=0.
      - series: 'headscale_key_exporter_up{service="headscale-key-exporter"}'
        values: '1x120'
      - series: 'headscale_key_exporter_last_success_timestamp_seconds{service="headscale-key-exporter"}'
        values: '0x120'
    alert_rule_test:
      # Over an hour stale from 60m; `for: 30m` holds it pending until 90m.
      - eval_time: 89m
        alertname: HeadscaleKeyExporterDown
        exp_alerts: []
      - eval_time: 91m
        alertname: HeadscaleKeyExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
              service: headscale-key-exporter
            exp_annotations:
              summary: "headscale-key-exporter is not watching every Headscale key"
              description: "headscale-key-exporter has not read the Headscale API (or some of its records) for 30m, or is not being scraped, so some Headscale key expiries are not being watched. Its log says why: bazel run //tools/gitops:logs -- -n headscale deploy/headscale-key-exporter. An HTTP 401 means its own API key expired or was revoked: re-mint it with bazel run //tools/gitops:seal-headscale-key-exporter."

  - interval: 1m
    name: A record the exporter cannot read is an alert even while up is 1
    input_series:
      - series: 'headscale_key_exporter_up{service="headscale-key-exporter"}'
        values: '1x60'
      - series: 'headscale_key_exporter_last_success_timestamp_seconds{service="headscale-key-exporter"}'
        values: '0+60x60'
      - series: 'headscale_key_exporter_unreadable_records{service="headscale-key-exporter"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: HeadscaleKeyExporterDown
        exp_alerts: []
      - eval_time: 31m
        alertname: HeadscaleKeyExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
              service: headscale-key-exporter
            exp_annotations:
              summary: "headscale-key-exporter is not watching every Headscale key"
              description: "headscale-key-exporter has not read the Headscale API (or some of its records) for 30m, or is not being scraped, so some Headscale key expiries are not being watched. Its log says why: bazel run //tools/gitops:logs -- -n headscale deploy/headscale-key-exporter. An HTTP 401 means its own API key expired or was revoked: re-mint it with bazel run //tools/gitops:seal-headscale-key-exporter."

  - interval: 1m
    name: A healthy exporter with fresh reads never alerts
    input_series:
      - series: 'headscale_key_exporter_up{service="headscale-key-exporter"}'
        values: '1x120'
      # last_success tracks the clock (one read a minute).
      - series: 'headscale_key_exporter_last_success_timestamp_seconds{service="headscale-key-exporter"}'
        values: '0+60x120'
      - series: 'headscale_key_exporter_unreadable_records{service="headscale-key-exporter"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 119m
        alertname: HeadscaleKeyExporterDown
        exp_alerts: []

  # --------------------------------------------------- policy-sync stale ----
  - interval: 1m
    name: Stale unpaused policy-sync fires HeadscalePolicySyncStale after 15m plus 5m for
    input_series:
      - series: 'headscale_policy_sync_up{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '1 0x30'
      - series: 'headscale_policy_sync_last_success_timestamp_seconds{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '0x31'
      - series: 'headscale_policy_sync_paused{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '0x31'
    alert_rule_test:
      # 14m = 840s <= 900s (stays silent even past the 5m `for` duration).
      - eval_time: 14m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []
      # Condition turns true at 16m (960s > 900s); `for: 5m` holds it pending through 20m.
      - eval_time: 20m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []
      - eval_time: 21m
        alertname: HeadscalePolicySyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
              job: kubernetes-service-endpoints
              namespace: headscale
              service: headscale-policy-sync
            exp_annotations:
              summary: "Headscale ACL policy-sync has not succeeded in 21m 0s"
              description: "The policy-sync sidecar on deploy/headscale has not completed a clean ACL reconciliation for 21m 0s (>15m) and is not paused, so live Headscale ACLs may have drifted from gitops/argocd/platform/headscale/policy.hujson (or a bad policy failed headscale policy check/set). Check sidecar logs with: bazel run //tools/gitops:logs -- -n headscale deploy/headscale -c policy-sync."

  - interval: 1m
    name: Stale policy-sync stays silent while paused
    input_series:
      - series: 'headscale_policy_sync_up{service="headscale-policy-sync"}'
        values: '1x40'
      - series: 'headscale_policy_sync_last_success_timestamp_seconds{service="headscale-policy-sync"}'
        values: '0x40'
      - series: 'headscale_policy_sync_paused{service="headscale-policy-sync"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []

  - interval: 1m
    name: Fresh policy-sync stays silent
    input_series:
      - series: 'headscale_policy_sync_up{service="headscale-policy-sync"}'
        values: '1x60'
      - series: 'headscale_policy_sync_last_success_timestamp_seconds{service="headscale-policy-sync"}'
        values: '0+60x60'
      - series: 'headscale_policy_sync_paused{service="headscale-policy-sync"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 59m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []

  - interval: 1m
    name: Missing policy-sync series fires HeadscalePolicySyncStale after 5m for
    input_series:
      # Unrelated series so the test has input while all headscale_policy_sync_* series are absent.
      - series: 'up{job="kubernetes-service-endpoints"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []
      - eval_time: 6m
        alertname: HeadscalePolicySyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
            exp_annotations:
              summary: "Headscale ACL policy-sync metrics are absent"
              description: "Prometheus has no headscale_policy_sync metrics, so the policy-sync sidecar on deploy/headscale is down, crash-looping, or not being scraped via Service/headscale-policy-sync. Check sidecar logs with: bazel run //tools/gitops:logs -- -n headscale deploy/headscale -c policy-sync."

  # ------------------------------------------------ policy-sync pause cap ----
  - interval: 1m
    name: Paused policy-sync under 12h stays silent
    input_series:
      - series: 'headscale_policy_sync_up{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '0x720'
      - series: 'headscale_policy_sync_last_success_timestamp_seconds{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '0x720'
      - series: 'headscale_policy_sync_paused{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '1x720'
    alert_rule_test:
      - eval_time: 11h59m
        alertname: HeadscalePolicySyncPausedTooLong
        exp_alerts: []
      - eval_time: 11h59m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []

  - interval: 1m
    name: Paused policy-sync for 12h+ fires HeadscalePolicySyncPausedTooLong while stale stays silent
    input_series:
      - series: 'headscale_policy_sync_up{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '0x750'
      - series: 'headscale_policy_sync_last_success_timestamp_seconds{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '0x750'
      - series: 'headscale_policy_sync_paused{job="kubernetes-service-endpoints",namespace="headscale",service="headscale-policy-sync"}'
        values: '1x750'
    alert_rule_test:
      - eval_time: 11h59m
        alertname: HeadscalePolicySyncPausedTooLong
        exp_alerts: []
      - eval_time: 12h1m
        alertname: HeadscalePolicySyncStale
        exp_alerts: []
      - eval_time: 12h1m
        alertname: HeadscalePolicySyncPausedTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              pagerduty_service: cluster
              job: kubernetes-service-endpoints
              namespace: headscale
              service: headscale-policy-sync
            exp_annotations:
              summary: "Headscale ACL policy-sync has been paused for over 12h"
              description: "The policy-sync sidecar on deploy/headscale has seen ConfigMap/headscale-policy-sync-pause for >12h, so HeadscalePolicySyncStale is suppressed and gitops/argocd/platform/headscale/policy.hujson is not being reconciled. Land the break-glass policy change in git and resume reconciliation with: bazel run //tools/gitops:headscale-policy-sync-resume."
