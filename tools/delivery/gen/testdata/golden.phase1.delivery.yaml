# GENERATED by 'bazel run //tools/ci:gen' from delivery() declarations — DO NOT EDIT. tidy-check enforces regeneration.
#
# Source of truth: the delivery() declarations in the Bazel graph
# (tools/delivery/defs.bzl). Renderer: //tools/delivery/gen, aliased
# //tools/ci:gen. Editing this file by hand is a no-op that CI reverts:
# tidy-check regenerates and fails on any diff.
#
# DEPENDABOT: the action pins below are rendered from constants in
# tools/delivery/gen/main.go. Dependabot's github-actions ecosystem scans
# every file under .github/workflows/, so it will offer to bump them HERE —
# and that PR fails tidy-check, because the next regeneration puts the old
# pin back. Apply the bump to the constant in main.go and run
# `bazel run //tools/ci:gen`; the diff in this file then matches.
#
# PHASE 1 — THE DEVELOPMENT RUNG ACTS (spec §6). On a push to main this
# workflow now DELIVERS: for every cloud-run unit the orchestrator finds
# affected, it applies that unit's companions and then deploys its FIRST
# environment. Nonproduction and production are NOT rendered here — they
# stay release-gated in the legacy per-app workflow until Phase 2, which is
# also why that workflow keeps its `release:` and `workflow_dispatch`
# triggers (only its `push:` trigger was removed).
#
# ROLLBACK (spec §6.1): flip the DELIVERY_ORCHESTRATOR_ENABLED repo
# variable to false and every job below no-ops without a commit; the legacy
# workflow's workflow_dispatch is the level-0 "deliver now" path, and the
# break-glass `bazel run` targets are unchanged.
#
# Units declared today (sorted by name). The orchestrator re-derives this list
# at run time from the Bazel graph — it is reproduced here so that adding,
# renaming or deleting a delivery() declaration shows up as a DIFF in this
# generated file, which is what makes tidy-check's regeneration assertion
# mean something even for a unit that renders no job yet.
#   - charts  kind=publish  run=//tools/charts:publish  envs=publish  promotion=push-all
#       paths:  .*/deploy/chart/ tools/charts/
#       render: transcribed from .github/workflows/charts-publish.yml job "publish"
#   - copybara-sync-auth  kind=pulumi  run=//infrastructure/pulumi:up  envs=dev  promotion=push-all
#       paths:  infrastructure/pulumi/main\.go infrastructure/pulumi/pkg/copybara_sync/ infrastructure/pulumi/BUILD
#       render: transcribed from .github/workflows/copybara-sync-auth-apply.yaml job "apply"
#       gate:   push applies require vars.SYNC_AUTH_AUTO_APPLY == 'true'
#   - oauth-user-inspector  kind=cloud-run  run=//oauth-user-inspector/infra/app:deploy  envs=development,nonproduction,production  promotion=release:oauth-user-inspector-v
#       paths:  oauth-user-inspector/ infrastructure/pulumi/platform/zitadel-apps/ tools/deploy/ \.github/workflows/_deploy-cloud-run\.yaml \.github/workflows/_zitadel-apps-apply\.yaml
#       except: oauth-user-inspector/infra/identity/ oauth-user-inspector/catalog-info\.yaml oauth-user-inspector/deploy/ oauth-user-inspector/docs/ oauth-user-inspector/mkdocs\.yml oauth-user-inspector/CHANGELOG\.md
#       soak:   promotion blocked while development is red
#   - oauth-user-inspector-identity  kind=pulumi  run=//oauth-user-inspector/infra/identity:up  envs=development,nonproduction,production  promotion=push-all
#       paths:  oauth-user-inspector/infra/identity/ \.github/workflows/_oauth-identity-apply\.yaml
#       render: reusable from .github/workflows/oauth-user-inspector-identity-stack.yaml job "development"
#   - tabula-api  kind=cloud-run  run=//tabula/infra/app:deploy  envs=development,nonproduction,production  promotion=release:tabula-api-v
#       paths:  tabula/infra/app/ tabula/infra/web/ tabula/web/ tools/deploy/ \.github/workflows/_deploy-cloud-run\.yaml
#       graph:  //tabula/api:image_push //tabula/extension:chrome_zip
#       build:  shared "tabula" → image-digest
#       soak:   promotion blocked while development is red
#       skip:   preflight=revision-name (deploy skipped when live already serves the desired revision)
#   - tabula-build-stack  kind=pulumi  run=//tabula/infra/build:up  envs=shared  promotion=push-all
#       paths:  tabula/infra/build/
#       render: transcribed from .github/workflows/tabula-build-stack.yaml job "deploy"
#   - tabula-dev-latest  kind=publish  run=//tabula/extension:publish-dev-latest  envs=publish  promotion=push-all
#       paths:  tabula/infra/app/ tabula/extension/publish-dev-latest\.sh
#       graph:  //tabula/api:image_push //tabula/extension:chrome_zip
#       render: transcribed from .github/workflows/tabula-dev-latest.yaml job "publish"
#   - tabula-identity  kind=pulumi  run=//tabula/infra/identity:up  envs=development,nonproduction,production  promotion=push-all
#       paths:  tabula/infra/identity/ \.github/workflows/_tabula-identity-apply\.yaml
#       render: reusable from .github/workflows/tabula-identity-stack.yaml job "development"
#   - tabula-web  kind=cloud-run  run=//tabula/infra/web:deploy  envs=development,nonproduction,production  promotion=release:tabula-web-v
#       paths:  tabula/infra/app/ tabula/infra/web/ tabula/web/ tools/deploy/ \.github/workflows/_deploy-cloud-run\.yaml
#       graph:  //tabula/api:image_push //tabula/extension:chrome_zip
#       build:  shared "tabula" → web-image-digest
#       soak:   promotion blocked while development is red
#   - zitadel-apps  kind=pulumi  run=//infrastructure/pulumi/platform/zitadel-apps:up  envs=development,nonproduction,production  promotion=release:oauth-user-inspector-v
#       paths:  infrastructure/pulumi/platform/zitadel-apps/ \.github/workflows/_zitadel-apps-apply\.yaml

name: delivery

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege AT THE WORKFLOW LEVEL: `contents: read` to check out and
# `actions: read` so the orchestrator can resolve a durable diff base from
# this workflow's own run history. `id-token: write` is deliberately NOT
# here — the fan-out jobs that need WIF grant it on THEMSELVES (see their
# job-level permissions blocks), so `orchestrate`, which never talks to
# GCP, cannot mint a cloud credential.
permissions:
  contents: read
  actions: read

# State-mutation posture: one constant group, never cancel. Two delivery
# runs must not race the same live environment, and a queued run must not be
# cancelled mid-rollout.
#
# WHY WORKFLOW-LEVEL AND NOT PER-UNIT (spec §4.3 asks for
# `delivery-<unit>-<env>` groups): every fan-out job below is a `uses:`
# caller, and this repo has already paid for that experiment — #1607 put a
# `concurrency:` on the calling jobs in tabula-deploy.yaml and every
# dispatch failed INSTANTLY with no runner assigned, reproducibly, even
# with a static expression-free group string; workflow-level was the only
# placement that worked. A constant group here is strictly STRONGER
# serialization than per-unit groups (it also serializes unrelated units,
# which at this scale costs nothing) — it can never let two runs touch one
# environment at once. Revisit only with a live experiment, never by
# reasoning from the docs.
#
# KNOWN CONSEQUENCE (#1351), MITIGATED FOR PUSHES: a coalescing group
# means GitHub EVICTS an already-PENDING run when a newer one queues, and
# `github.event.before` is fixed at the EVICTED run's push — a range no
# successor re-diffs, i.e. a silent permanent skip. The orchestrate job
# therefore resolves a DURABLE base from this workflow's last successful
# push run (tools/ci/resolve-deploy-base.sh) and only falls back to
# github.event.before when that cannot be determined: the NEXT push run
# re-diffs the evicted one's range, so eviction costs latency, not a
# delivery. Observed live and working on the Phase-2 merge burst.
#
# WHY RELEASE RUNS ARE KEYED SEPARATELY, PER TAG: that recovery does not
# exist for a release. A release run delivers what its TAG names, and no
# later run ever re-derives it — so an evicted release run is a promotion
# that silently never happens, recoverable only by a human noticing and
# dispatching it. That is not hypothetical: two releases published in the
# same minute during the Phase-2 rollout evicted each other (runs
# 32345258539 / 32344982262 — harmless only because both tags were infra
# ones with no rung of their own; a tabula-api-v + tabula-web-v pair would
# have dropped one service's promotion). Keying release runs on the tag
# gives every tag its own lane: two tags never evict each other, while two
# runs of the SAME tag (a re-publish) still serialize, which is the case
# that could actually race one environment.
concurrency:
  group: delivery-${{ github.event_name == 'release' && github.event.release.tag_name || 'push' }}
  cancel-in-progress: false

jobs:
  orchestrate:
    # Kill switch (spec §6.1, rollback level 1): flip the
    # DELIVERY_ORCHESTRATOR_ENABLED repo variable to disable the whole
    # orchestrator without a commit, a revert or a deploy. Repo-scoped, not
    # environment-scoped: a job-level `if:` cannot see an environment
    # variable. Declared in infrastructure/pulumi/platform/repo_config.
    #
    # PUSH-ONLY, and that is not a narrowing of the gate — it is what this
    # job decides. Its verdict is "which units did this DIFF affect", which
    # only a push has: a release event promotes an already-built digest by
    # tag, and a dispatch names its unit outright. Running it anyway would
    # pay a Bazel setup + a target-determinator sweep on EVERY published
    # release in the repo (this workflow has no per-tag trigger filter) for
    # an answer nothing reads. Every fan-out job below stays reachable with
    # this skipped: their conditions use always()/!cancelled() and their
    # release/dispatch arms, exactly as the legacy jobs did with their own
    # push-only `gate` job skipped.
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # `manifest` is the whole delivery-manifest.json, compact, for a
      # consumer that needs more than a boolean (fromJSON in a future
      # phase). The affected_* pairs are the convenience form a job-level
      # `if:` can actually read — expressions cannot index into JSON.
      manifest: ${{ steps.manifest.outputs.manifest }}
      affected_charts: ${{ steps.manifest.outputs.affected_charts }}
      affected_copybara_sync_auth: ${{ steps.manifest.outputs.affected_copybara_sync_auth }}
      affected_oauth_user_inspector: ${{ steps.manifest.outputs.affected_oauth_user_inspector }}
      affected_oauth_user_inspector_identity: ${{ steps.manifest.outputs.affected_oauth_user_inspector_identity }}
      affected_tabula_api: ${{ steps.manifest.outputs.affected_tabula_api }}
      affected_tabula_build_stack: ${{ steps.manifest.outputs.affected_tabula_build_stack }}
      affected_tabula_dev_latest: ${{ steps.manifest.outputs.affected_tabula_dev_latest }}
      affected_tabula_identity: ${{ steps.manifest.outputs.affected_tabula_identity }}
      affected_tabula_web: ${{ steps.manifest.outputs.affected_tabula_web }}
      affected_zitadel_apps: ${{ steps.manifest.outputs.affected_zitadel_apps }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # fetch-depth: 0 is LOAD-BEARING, not hygiene. The engine diffs
          # HEAD against `github.event.before`, which does not exist in the
          # default depth-1 clone — the gate then fail-opens on every run
          # and reports "affected" for everything, forever, while looking
          # perfectly healthy. That is exactly #1763: the gate was not
          # broken, it could not see.
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel
      - name: Resolve the durable diff base (#1351)
        id: durable-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: delivery.yaml
        # Reads THIS workflow's last successful push run and uses its head
        # sha as the diff base, so a run evicted by the constant
        # concurrency group above does not take its commit range to the
        # grave. Always exits 0: an empty base_sha means "could not
        # determine", and the step below falls back.
        run: bash tools/ci/resolve-deploy-base.sh
      - name: Compute the delivery manifest
        id: manifest
        env:
          # Durable base first, github.event.before only as the fallback
          # (empty is falsy in a GitHub Actions expression). The engine
          # itself fails open if BOTH are unusable.
          BEFORE_REV: ${{ steps.durable-base.outputs.base_sha || github.event.before }}
          # A force-push makes any base untrustworthy; the orchestrator
          # turns this into a whole-manifest fail-open with a loud reason.
          FORCED_PUSH: ${{ github.event.forced }}
          # The affected engine may build/query through the shared remote
          # cache; absent (e.g. a fork) it degrades to a local build.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel run //tools/delivery/orchestrate -- --out delivery-manifest.json
      - name: Upload the delivery manifest
        uses: actions/upload-artifact@v7
        with:
          name: delivery-manifest
          path: delivery-manifest.json
          # 30 days: long enough to A/B a delivery verdict against what the
          # legacy workflows actually did, which is how each phase is
          # signed off before the legacy path is deleted.
          retention-days: 30

  # ======== unit: oauth-user-inspector → development ========
  # Declared in oauth-user-inspector/infra/app/BUILD; break-glass target: //oauth-user-inspector/infra/app:deploy
  # GitHub Environments: oauth-user-inspector-development (approvals + keyless-WIF vars live there)
  # Promotion to nonproduction/production: still the legacy ladder, on oauth-user-inspector-v* (Phase 2 migrates it).

  # BUILD ONCE, promote by digest: the image is pushed a single time, into
  # the shared Artifact Registry owned by the build Environment's project,
  # and every rung deploys that one immutable @sha256 ref. The app's Pulumi
  # program accepts nothing else — there is deliberately no mutable-tag
  # fallback — so this job is what makes the deploy below possible at all.
  oauth-user-inspector-build:
    needs: [orchestrate]
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && always() && !cancelled() && (github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_oauth_user_inspector == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: oauth-user-inspector-build
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (capture the digest)
        id: push
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/oauth-user-inspector/app"
          NODE_VERSION="$(cut -d. -f1 .nvmrc 2>/dev/null || echo 22)"
          docker buildx build --push \
            --build-arg NODE_VERSION="${NODE_VERSION}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            oauth-user-inspector/
          # Resolve the immutable digest from the registry (driver-agnostic,
          # vs. buildx --metadata-file which varies by builder): this exact
          # @sha256 ref is what every env deploys.
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "Built ${IMAGE}@${DIGEST}"
          echo "image-digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # EXPAND before serve (§2.15): zitadel-apps is applied before
  # oauth-user-inspector's new development revision takes traffic, or hosted login is
  # broken on arrival. Gated on the SAME verdict as the deploy below — if
  # no revision is arriving there is nothing to expand for. Applying it
  # unconditionally is #1794: ~9 needless applies a day against a stack
  # whose force-replace DELETES the live OIDC client.
  zitadel-apps-development:
    needs: [orchestrate]
    # `always() && !cancelled()` (not the implicit success()-of-needs):
    # orchestrate may legitimately be skipped or red, and the fail-open arm
    # below has to be reachable in exactly those cases.
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && vars.ZITADEL_APPS_AUTO_APPLY == 'true' && always() && !cancelled() && (github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_oauth_user_inspector == 'true'))
    # Job-level, because a called workflow's permissions can only NARROW
    # the caller's: keyless WIF needs id-token: write HERE, and granting it
    # workflow-wide would hand it to orchestrate too.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_zitadel-apps-apply.yaml
    with:
      environment: "development"
    secrets: inherit

  # The push rung: main is the continuous-integration surface, so every
  # affected merge lands here and nowhere else.
  oauth-user-inspector-development:
    needs: [orchestrate, oauth-user-inspector-build, zitadel-apps-development]
    # The build MUST have succeeded — there is no image otherwise, and this
    # is an EQUALITY, not a `!= 'failure'`, so a SKIPPED build stops the
    # deploy too rather than promoting whatever the registry's `latest`
    # happens to hold. `!cancelled()` keeps the whole condition reachable
    # when a need was skipped, which the implicit success()-of-needs would
    # not.
    # A companion that is SKIPPED — its repo-variable gate is off — must not
    # block the deploy, while one that FAILED must.
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && !cancelled() && needs.oauth-user-inspector-build.result == 'success' && needs.zitadel-apps-development.result != 'failure' && (github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_oauth_user_inspector == 'true'))
    # Job-level, because a called workflow's permissions can only NARROW
    # the caller's: keyless WIF needs id-token: write HERE, and granting it
    # workflow-wide would hand it to orchestrate too.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-cloud-run.yaml
    with:
      app-name: "oauth-user-inspector"
      cloudflare-token-secret-project: "prj-d-bu1-oss-floating-648a"
      custom-smoke-script-file: "oauth-user-inspector/infra/app/smoke.sh"
      default-region: "us-central1"
      env-prefix: "OAUTH_USER_INSPECTOR"
      environment: "development"
      image-digest: "${{ needs.oauth-user-inspector-build.outputs.image-digest }}"
      pulumi-dir: "oauth-user-inspector/infra/app"
      service-name: "oauth-user-inspector"
      workload-migrated: false
    secrets: inherit

  # ======== unit: tabula-api → development ========
  # Declared in tabula/infra/app/BUILD; break-glass target: //tabula/infra/app:deploy
  # GitHub Environments: tabula-development (approvals + keyless-WIF vars live there)
  # Promotion to nonproduction/production: still the legacy ladder, on tabula-api-v* (Phase 2 migrates it).

  # Render WHAT IS SHIPPING into the run page before the (gated) deploys, so
  # an approver reads the actual scope. Ungated by the manifest and
  # independent of every other job, so it never delays a rollout.
  tabula-api-changelog:
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && github.event_name == 'push'
    uses: ./.github/workflows/_changelog-summary.yaml
    with:
      label: "tabula-api"
      working-directory: "tabula/api"

  # BUILD ONCE for every tabula unit, promote by digest: one job pushes the
  # images into the shared Artifact Registry owned by the build
  # Environment's project, and every rung of every consuming unit deploys
  # those immutable @sha256 refs. Rebuilding per environment is what made
  # what reached production not be the artifact that was smoke-tested.
  # Consumed by: tabula-api, tabula-web
  tabula-build:
    needs: [orchestrate]
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && always() && !cancelled() && (github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_tabula_api == 'true' || needs.orchestrate.outputs.affected_tabula_web == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: tabula-build
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    outputs:
      image-digest: ${{ steps.push.outputs.image-digest }}
      web-image-digest: ${{ steps.web-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-bazel

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (capture the digest)
        id: push
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/tabula/api"
          bazel run --config=remotecache-ci --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //tabula/api:image_push -- \
            --repository "${IMAGE}" --tag "${GITHUB_SHA}" --tag latest
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          echo "image-digest=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # ---- tabula/web (Docker, not Bazel) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push tabula-web image
        id: web-image
        run: |
          set -euo pipefail
          # NO --build-arg NEXT_PUBLIC_API_URL here, deliberately: this image
          # is built ONCE and promoted unchanged across dev/nonprod/prod
          # below, and NEXT_PUBLIC_ vars are inlined into the client bundle
          # at `next build` time — a single build can only ever bake in ONE
          # environment's API host (this broke prod login: the shared image
          # shipped everywhere with development's API URL frozen into it).
          # The API URL is now a plain runtime env var (API_URL, injected per
          # environment by tabula/infra/web/main.go from Pulumi's `apiUrl`
          # config) that tabula/web/lib/runtime-config.ts and proxy.ts
          # read fresh on every request instead.
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/tabula/web"
          docker build \
            -f tabula/web/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          # Resolve the digest via the immutable per-commit tag, NOT :latest --
          # :latest is a shared mutable reference two concurrent builds can
          # overwrite between each other's push and inspect, handing one run
          # the OTHER run's digest. Matches the API image's push step above,
          # which already reads back via ${GITHUB_SHA} for the same reason.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # The push rung: main is the continuous-integration surface, so every
  # affected merge lands here and nowhere else.
  tabula-api-development:
    needs: [orchestrate, tabula-build]
    # The build MUST have succeeded — there is no image otherwise, and this
    # is an EQUALITY, not a `!= 'failure'`, so a SKIPPED build stops the
