    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build, stamp and publish the rolling dev-latest bundle
        env:
          # Cache-only (see --config=remotecache-ci in tools/remote.bazelrc):
