          # a fork) the script builds locally instead of failing on auth.
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tabula/extension/publish-dev-latest.sh

