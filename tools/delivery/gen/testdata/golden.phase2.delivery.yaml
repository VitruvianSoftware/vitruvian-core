  # ======== unit: tabula-build-stack → shared ========
  # Declared in tabula/infra/build/BUILD; break-glass target: //tabula/infra/build:up
  # Transcribed from .github/workflows/tabula-build-stack.yaml job "deploy" (that file was deleted in Phase 3; see git history).

  # Single rung: delivers on an affected push (and on a dispatch naming it).
  # GitHub Environment: foundation-proj-shared (its reviewer gate and WIF vars).
  tabula-build-stack-shared:
    needs: [orchestrate]
    if: vars.DELIVERY_ORCHESTRATOR_ENABLED == 'true' && !cancelled() && ((github.event_name == 'push' && (needs.orchestrate.result != 'success' || needs.orchestrate.outputs.affected_tabula_build_stack == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.unit == 'tabula-build-stack' && inputs.environment == 'shared'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Transcribed from the legacy job: job-level permissions REPLACE the
    # workflow-level block, which is narrower than this job needs.
    permissions:
      contents: read
      id-token: write
    environment: foundation-proj-shared
    env:
      GOWORK: off
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP (WIF, keyless)
        uses: ./.github/actions/gcp-auth
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      - name: Pulumi up (tabula-build / production)
        id: pulumi
        uses: ./.github/actions/pulumi-run-captured
        with:
          command: up
          stack: production
          working-directory: tabula/infra/build
          pulumi-access-token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Render the pulumi output digest onto the run's step-summary page via the
      # shared composite (.github/actions/pulumi-summary). Runs even when the
      # deploy fails so the failure — and what it touched — is surfaced.
      - name: Pulumi digest → step summary
        if: always()
        uses: ./.github/actions/pulumi-summary
        with:
          label: tabula-build
          out-file: ${{ runner.temp }}/pulumi-out.txt
          exit-code: ${{ steps.pulumi.outputs.exit_code }}

