# See https://pnpm.io/pnpm-workspace_yaml
packages:
  - packages/*
  - tools
  - mcp-slack
  - nexus-agent
  - oauth-user-inspector
  - tabula/shared
  - tabula/api
  - tabula/extension
  - tabula/web
  - tabula/cli
  # pulumi-library: the GCP Pulumi component library (TypeScript arm), grafted
  # from the standalone pulumi-library repo. Each component is an independently
  # published @vitruviansoftware/foundation-* package; consumers (and the public
  # mirror) keep those names, so cross-package refs use `workspace:*` in-tree.
  # The ts/ root is a private meta-package holding the shared vitest config.
  - pulumi/library/ts
  - pulumi/library/ts/packages/*
  # pulumi ts foundation example (fork-and-own reference): root is the single
  # workspace member so foundation-* resolve in-tree via workspace:*; the per-env
  # Pulumi project dirs share this hoisted install.
  - pulumi/examples/ts-foundation

# Catalog: the single source of truth for versions of dependencies meant to be
# uniform across every workspace — the JS arm of the repo's One Version Rule
# (see docs/dependency-versioning/javascript.md). A package references an entry
# with `"<dep>": "catalog:"` instead of a literal range, so a bump is one edit
# here rather than one per package.json, and the versions cannot silently drift
# apart. Deliberately divergent versions (e.g. apps on different React majors)
# stay as explicit ranges, or move to a *named* catalog when intended.
catalog:
  "@swc/core": ^1.15.46
  "@swc/jest": ^0.2.39
  jest: ^30.4.2
  "@pulumi/pulumi": ^3.0.0
  "@pulumi/gcp": ^9.30.0
  "@pulumi/random": ^4.0.0
  "@pulumi/command": ^1.0.0
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10

# The @fastify/* plugins rely on npm-style hoisting to find `fastify` (they
# don't declare it as a peer dependency upstream). Under the strict rules_js /
# hoist=false layout that breaks their `declare module 'fastify'` type
# augmentations (e.g. request.jwtVerify / request.user from @fastify/jwt).
# Declaring the missing peer here makes pnpm link a sibling `fastify` into
# each plugin's store instance, restoring resolution without any hoisting.
packageExtensions:
  "@fastify/jwt":
    peerDependencies:
      fastify: "*"
  "@fastify/cors":
    peerDependencies:
      fastify: "*"
  "@fastify/rate-limit":
    peerDependencies:
      fastify: "*"
