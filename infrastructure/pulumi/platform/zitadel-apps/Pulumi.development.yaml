# Committed stack config (config-as-code): non-secret identifiers only, so the
# deploy workflow can resolve them on a clean checkout (principle §2.5). The
# Zitadel provider credential is injected at apply time by the deploy workflow
# from the ZITADEL_MACHINE_KEY_JSON pipeline secret — never stored here.
#
# Before enabling the ZITADEL_APPS_AUTO_APPLY variable on the
# oauth-user-inspector-deploy workflow, an operator seeds the org/project/import
# IDs below (read from the Zitadel console: Project → your project → the app).
# Until then the apply job is gated off and these are inert.
config:
  zitadel:domain: auth.ipv1337.dev
  # EXPAND, don't replace (§2.15): the production custom domain is FIRST (the fix —
  # its login was broken because this redirect wasn't registered), and the existing
  # live redirects (local dev + the Cloud Run URL) are kept so nothing already
  # working breaks. devMode stays true (main.go) for the http://localhost entry.
  zitadel-apps:redirectUris:
    - https://oauth-inspector.ipv1337.dev/
    # Per-env custom domains (infrastructure/pulumi/apps/oauth-user-inspector
    # customDomain config) — EXPANDED here, not replacing anything, so OIDC
    # login works on them too. Takes effect once ZITADEL_APPS_AUTO_APPLY
    # re-enables the apply job.
    - https://oauth-inspector.dev.ipv1337.dev/
    - https://oauth-inspector.staging.ipv1337.dev/
    - http://localhost:8080/
    - https://oauth-user-inspector-rwwbf2knaa-uw.a.run.app/
  zitadel-apps:postLogoutRedirectUris:
    - https://oauth-inspector.ipv1337.dev/
    - https://oauth-inspector.dev.ipv1337.dev/
    - https://oauth-inspector.staging.ipv1337.dev/
    - http://localhost:8080/
    - https://oauth-user-inspector-rwwbf2knaa-uw.a.run.app/
  # Match the live app's display name so the adopt is a pure no-op (no rename):
  zitadel-apps:appName: "oauth-user-inspector-web"
  # Seeded 2026-06-26 (verified against the live instance via the iam-admin PAT):
  zitadel-apps:projectId: "378961731155658332"
  zitadel-apps:orgId: "378818267051001367" # the "Vitruvian" FirstInstance org
  # NO importId — the app is CREATED and owned by Pulumi. Importing/adopting it is
  # destructive on the pulumiverse/zitadel provider (force-new diff on
  # appType/version/... → "import replacement + delete original" deletes the live
  # client). The old importId pointed at app 378961731390539356, which a
  # 2026-06-26 CI apply replaced+deleted (Errors.App.NotFound). After this stack
  # creates a fresh client, sync its clientId/clientSecret to GCP Secret Manager
  # (ZITADEL_APP_OAUTH_CLIENT_ID / _SECRET). See main.go.
