# Committed stack config for the nonproduction environment (config-as-code):
# non-secret Zitadel identifiers + redirect URIs only. The Zitadel provider
# credential is injected at apply time by the deploy workflow from the
# ZITADEL_MACHINE_KEY_JSON pipeline secret — never stored here.
#
# This stack mints a BRAND-NEW per-env OIDC client (never imports/adopts — see
# main.go). The env's Cloud Run run.app redirect is appended automatically via
# the app-stack StackReference (ZITADEL_APPS_APP_STACK) once the app stack's
# first deploy exports serviceUrl; until then the committed set below applies.
config:
  zitadel:domain: auth.ipv1337.dev
  zitadel-apps:redirectUris:
    - https://oauth-inspector.ipv1337.dev/
    - http://localhost:8080/
  zitadel-apps:postLogoutRedirectUris:
    - https://oauth-inspector.ipv1337.dev/
    - http://localhost:8080/
  # Per-env client name (the dev/live client keeps oauth-user-inspector-web):
  zitadel-apps:appName: "oauth-user-inspector-web-nonproduction"
  # Same Zitadel project/org as the dev client (one IdP instance, per-env apps):
  zitadel-apps:projectId: "378961731155658332"
  zitadel-apps:orgId: "378818267051001367" # the "Vitruvian" FirstInstance org
  # Cred-sync target (stage-5): the nonproduction oss-floating project's Secret
  # Manager receives this client's id/secret under the OAUTH_USER_INSPECTOR_
  # prefix, so the app deployment reads them at runtime (server SECRET_PREFIX).
  zitadel-apps:ossProject: "prj-n-bu1-oss-floating-630b"
