# Committed stack config (config-as-code): non-secret values only.
# The Sentry API token is never stored here in plaintext; manual runs read
# SENTRY_TOKEN or an encrypted `sentry:token` Pulumi secret, and the PagerDuty
# Events v2 routing key is fetched as a secret output via StackReference. A
# unit test fails if a plaintext token appears in this file.
config:
  vitruvian-sentry-pagerduty:organization: sentry
  vitruvian-sentry-pagerduty:baseUrl: https://sentry.lab.ipv1337.dev/api/
  vitruvian-sentry-pagerduty:integrationName: Vitruvian Software
  vitruvian-sentry-pagerduty:pagerdutyStack: ipv1337/vitruvian-pagerduty/production
  vitruvian-sentry-pagerduty:serviceName: Sentry
  vitruvian-sentry-pagerduty:severity: default
  vitruvian-sentry-pagerduty:excludeProjects:
    - internal
  vitruvian-sentry-pagerduty:frequencyMinutes: 30
