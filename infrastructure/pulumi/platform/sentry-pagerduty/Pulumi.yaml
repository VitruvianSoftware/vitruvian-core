# The project is NOT named `sentry`: that is the provider package's own config
# namespace (`sentry:token` and friends), and sharing it would collide with
# this program's settings. Also kept separate from `platform/sentry`, which
# binds `pulumiverse/pulumi-sentry` v0.0.9 under package name `sentry`.
name: vitruvian-sentry-pagerduty
runtime: go
description: Self-hosted Sentry high-priority alert rules wired to PagerDuty as code.
# jianyuan/terraform-provider-sentry v0.15.8 (which adds workflow-engine
# `sentry_alert` required by Sentry 26.10.1 after `/rules/` removal), consumed
# through Pulumi's parameterized `terraform-provider` package. Regenerate the
# Go SDK (`sdks/sentry`) whenever either version changes; see README.md.
packages:
  sentry:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - registry.terraform.io/jianyuan/sentry
      - 0.15.8
