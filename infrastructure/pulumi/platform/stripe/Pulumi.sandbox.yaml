# Committed stack config (config-as-code, principle §2.5): non-secret values
# only. This stack targets a Stripe SANDBOX (test mode); the program refuses a
# live key here (internal/stripekey). The live account is Pulumi.production.yaml,
# applied only after this stack, behind a required reviewer.
#
# The Stripe key is never here in plaintext. CI injects it as STRIPE_API_KEY
# from a pipeline secret. Locally, either export STRIPE_API_KEY for the session
# or store it as a Pulumi secret, which writes only ciphertext here:
#   bazel run //infrastructure/pulumi/platform/stripe:config -- \
#     set --secret apiKey --stack sandbox
# A test fails the build if a plaintext key ever lands in this file.
config:
  # Account-wide: true of everything this stack sells.
  vitruvian-stripe:mode: test
  vitruvian-stripe:currency: usd
  # Product line 1: donations for the free apps. Paid products, when they
  # come, get a sibling object here (and a package beside internal/donations).
  vitruvian-stripe:donations:
    productName: Support Vitruvian Software
    # Cents. Donors type any amount in [minimum, maximum], starting at preset.
    # Changing ANY of these replaces the Price (Stripe prices are immutable;
    # the provider marks custom_unit_amount RequiresReplace). The Payment Links
    # selling it then have to point at the new Price, which can mean new links
    # with new URLs. That is why apps link to a stable redirect, not to Stripe.
    amounts:
      minimum: 100
      preset: 500
      maximum: 100000
    thankYouMessage: >-
      Thank you for supporting Vitruvian Software. Everything we make stays free
      because people like you chip in.
    # One Payment Link per app. `key` names the resource and is written to the
    # link's metadata, so donations are attributed per app in Stripe: every
    # app gets its own link, so you can see which app people back. Each key
    # also has a page, vitruviansoftware.dev/donate/<key>/, which the app's
    # buttons open (its mirror's Sponsor button too), and an entry in the
    # site's _data/donations.yml; internal/donations/donations_pages_test.go
    # keeps the three in step. A Payment Link can only be deactivated, never
    # deleted, so a key is for good once applied.
    # `development` is not an app: it is the general "support development"
    # link on vitruviansoftware.dev/donate/, for anyone backing the work as a
    # whole rather than one app.
    apps:
      - key: vitruvian
        name: Vitruvian
      - key: development
        name: Vitruvian Software development
      - key: courier
        name: Courier
      - key: home-speaker
        name: HomeSpeaker
      - key: vitruvian-remote
        name: Vitruvian Remote
      - key: esp32-desk-companion
        name: Vitruvian Deck
      - key: nexus-agent
        name: NexusAgent
      - key: oauth-user-inspector
        name: OAuth User Inspector
      - key: mcp-slack
        name: mcp-slack
      - key: mcp-roborock
        name: mcp-roborock
      - key: gh-watch
        name: gh-watch
      - key: devx
        name: devx
      - key: homelab
        name: homelab
