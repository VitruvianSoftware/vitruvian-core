# The project is NOT named `stripe`: that is the provider package's own config
# namespace (stripe:apiKey and friends), and sharing it would mix this
# program's settings with the provider's. Pulumi keys stack state on this
# name, so it stays fixed once a stack exists (tools/conformance).
name: vitruvian-stripe
runtime: go
description: Stripe products, prices and Payment Links as code. Donations today, paid products later.
# Stripe's OWN Terraform provider (github.com/stripe/terraform-provider-stripe,
# MIT, generated by Stripe from its OpenAPI spec), consumed through Pulumi's
# parameterized `terraform-provider` package ("Any Terraform Provider"). The
# program stays Pulumi-in-Go; only the provider underneath is bridged.
#
# Both versions are pinned so a preview on another machine resolves the same
# schema: the top-level `version` is the pulumi-terraform-provider plugin, the
# second parameter is Stripe's provider. Regenerate the Go SDK (sdks/stripe)
# whenever either changes; see README.md "Generating the Stripe SDK".
packages:
  stripe:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - registry.terraform.io/stripe/stripe
      - 0.3.0
