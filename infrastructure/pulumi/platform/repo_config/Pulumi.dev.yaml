config:
  vitruvian-core-repo-config:repoOwner: VitruvianSoftware
  vitruvian-core-repo-config:requirePullRequest: "false"
  vitruvian-core-repo-config:requireStatusChecks: "false"
  # Merge queue (#83) is the enforcement authority for main: PR merges go
  # through the queue and must pass the required CI checks. Classic
  # requireStatusChecks stays false to avoid the strict-up-to-date conflict
  # with the queue (the queue rebases entries itself).
  vitruvian-core-repo-config:mergeQueue: "true"
  # Required code-owner review on main (#804). OFF while this is a solo repo:
  # with one maintainer there is no second reviewer (it produces zero reviews),
  # and a ruleset bypass actor cannot satisfy it through the merge queue (bypass
  # applies only to a DIRECT merge, not auto-merge), so it only blocks
  # release-please/Dependabot auto-merge. Flip to "true" once a second reviewer
  # exists — the merge queue + required CI checks stay enforced regardless.
  vitruvian-core-repo-config:requireCodeOwnerReview: "false"
  vitruvian-core-repo-config:tabulaProductionReviewers:
    - ipv1337
  vitruvian-core-repo-config:tabulaVars:
    development:
      GCP_DEPLOY_SERVICE_ACCOUNT: github-actions-dev@tabula-dev-0001.iam.gserviceaccount.com
      GCP_PROJECT_ID: tabula-dev-0001
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/796264355044/locations/global/workloadIdentityPools/github-actions-dev-1/providers/github-actions-dev
  vitruvian-core-repo-config:foundationVars:
    foundation-bootstrap:
      GCP_PROJECT_ID: prj-b-seed-8ebb
      GCP_SERVICE_ACCOUNT: sa-terraform-bootstrap@prj-b-seed-8ebb.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1007864396578/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-org:
      GCP_PROJECT_ID: prj-b-seed-8ebb
      GCP_SERVICE_ACCOUNT: sa-terraform-org@prj-b-seed-8ebb.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1007864396578/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    # org-folders creates the org-root fldr-foundation-1 umbrella folder and
    # deploys as the BOOTSTRAP SA (matching the WIF binding in
    # gcp-bootstrap/build_github_actions.go) from its own foundation-org-folders
    # environment. #642 split it off the shared foundation-bootstrap environment
    # but these vars were never added here, so the env had no credentials and the
    # deploy's WIF auth failed with an empty workload_identity_provider.
    foundation-org-folders:
      GCP_PROJECT_ID: prj-b-seed-8ebb
      GCP_SERVICE_ACCOUNT: sa-terraform-bootstrap@prj-b-seed-8ebb.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1007864396578/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-env:
      GCP_PROJECT_ID: prj-b-seed-8ebb
      GCP_SERVICE_ACCOUNT: sa-terraform-env@prj-b-seed-8ebb.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1007864396578/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-net:
      GCP_PROJECT_ID: prj-b-seed-8ebb
      GCP_SERVICE_ACCOUNT: sa-terraform-net@prj-b-seed-8ebb.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1007864396578/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-proj:
      GCP_PROJECT_ID: prj-b-seed-8ebb
      GCP_SERVICE_ACCOUNT: sa-terraform-proj@prj-b-seed-8ebb.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1007864396578/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
  # oauth-user-inspector deploy environments — non-secret identifiers only (keyless
  # WIF), keyed per GitHub Environment. The matching GitHub-side SECRETS are NOT
  # here; they are synced from a gitignored, Bitwarden-backed store by
  # //tools/sync-env-secrets (§2.4, §2.18).
  #
  # Only `development` is populated (its current, single-env personal-project
  # deployment, preserved so the imported GitHub vars map cleanly). The
  # nonproduction / production / build environments are created empty here (env +
  # protection rules only) — their per-env oss-project deploy SA + foundation-pool
  # WIF provider are minted by the Phase-3 identity stacks, which set these vars
  # then. Do not add placeholder values.
  vitruvian-core-repo-config:oauthVars:
    development:
      GCP_DEPLOY_SERVICE_ACCOUNT: github-actions-dev@gen-lang-client-0352693779.iam.gserviceaccount.com
      GCP_PROJECT_ID: gen-lang-client-0352693779
      GCP_REGION: us-west1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/724518326928/locations/global/workloadIdentityPools/github-actions-dev-1/providers/github-actions-dev
  # buildbuddyApiKey is NO LONGER committed here (issue #456 / §2.4). The CI
  # apply/preview inject it as the BUILDBUDDY_API_KEY env var from the pipeline
  # secret; a local run may `pulumi config set --secret buildbuddyApiKey`
  # (gitignored). Resolved via secrets.EnvOrConfigOptional (pkg/secrets),
  # called from dependabotSecrets() in main.go.
