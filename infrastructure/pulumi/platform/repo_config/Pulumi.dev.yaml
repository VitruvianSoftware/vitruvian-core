config:
  vitruvian-core-repo-config:repoOwner: VitruvianSoftware
  vitruvian-core-repo-config:requirePullRequest: "false"
  vitruvian-core-repo-config:requireStatusChecks: "false"
  # Merge queue (#83) is the enforcement authority for main: PR merges go
  # through the queue and must pass the required CI checks. Classic
  # requireStatusChecks stays false to avoid the strict-up-to-date conflict
  # with the queue (the queue rebases entries itself).
  vitruvian-core-repo-config:mergeQueue: "true"
  vitruvian-core-repo-config:tabulaProductionReviewers:
    - ipv1337
  vitruvian-core-repo-config:tabulaVars:
    development:
      GCP_DEPLOY_SERVICE_ACCOUNT: github-actions-dev@tabula-dev-0001.iam.gserviceaccount.com
      GCP_PROJECT_ID: tabula-dev-0001
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/796264355044/locations/global/workloadIdentityPools/github-actions-dev-1/providers/github-actions-dev
  vitruvian-core-repo-config:foundationVars:
    foundation-bootstrap:
      GCP_SERVICE_ACCOUNT: REPLACE_ME_BOOTSTRAP_SA
      GCP_WORKLOAD_IDENTITY_PROVIDER: REPLACE_ME_WIF_PROVIDER
    foundation-org:
      GCP_SERVICE_ACCOUNT: REPLACE_ME_ORG_SA
      GCP_WORKLOAD_IDENTITY_PROVIDER: REPLACE_ME_WIF_PROVIDER
  # oauth-user-inspector deploy environment — non-secret identifiers only (keyless
  # WIF). The matching GitHub-side SECRETS are NOT here; they are synced from a
  # gitignored, Bitwarden-backed store by //tools/sync-env-secrets (§2.4, §2.18).
  vitruvian-core-repo-config:oauthVars:
    GCP_DEPLOY_SERVICE_ACCOUNT: github-actions-dev@gen-lang-client-0352693779.iam.gserviceaccount.com
    GCP_PROJECT_ID: gen-lang-client-0352693779
    GCP_REGION: us-west1
    GCP_WORKLOAD_IDENTITY_PROVIDER: projects/724518326928/locations/global/workloadIdentityPools/github-actions-dev-1/providers/github-actions-dev
  # buildbuddyApiKey is NO LONGER committed here (issue #456 / §2.4). The CI
  # apply/preview inject it as the BUILDBUDDY_API_KEY env var from the pipeline
  # secret; a local run may `pulumi config set --secret buildbuddyApiKey`
  # (gitignored). Resolved via secrets.EnvOrConfigOptional (pkg/secrets),
  # called from dependabotSecrets() in main.go.
