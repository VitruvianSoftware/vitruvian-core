# Committed stack config (config-as-code): non-secret values only.
# The PagerDuty API token is never stored here in plaintext; CI supplies
# PAGERDUTY_TOKEN from the pipeline secret, and local runs read PAGERDUTY_TOKEN
# or an encrypted `pagerduty:token` Pulumi secret. A unit test fails if a
# plaintext token appears in this file.
config:
  vitruvian-pagerduty:responderEmail: james@vitruviansoftware.dev
  vitruvian-pagerduty:escalation:
    name: Vitruvian on-call
    delayMinutes: 30
    loops: 2
    # The account's built-in "Default" policy. The free plan allows only one
    # escalation policy, so the stack adopts this one rather than creating a
    # second. A live preview (2026-11-14) showed it already pages the
    # responder above; adoption renames it and sets the loops.
    adoptId: PS9GPWM
  # The free plan allows one on-call schedule. The escalation policy pages
  # whoever is on call in it. Members are emails of existing PagerDuty users,
  # in rotation order; leave the list empty for the responder alone. Keep
  # start fixed: it anchors every handover.
  vitruvian-pagerduty:schedule:
    name: Vitruvian on-call rotation
    timeZone: America/Los_Angeles
    start: "2026-11-16T09:00:00-08:00"
    shiftDays: 7
    members: []
  # The responder's own notification rules. PagerDuty stops at the first one
  # that gets the incident acknowledged, so SMS and calls (100 a month on the
  # free plan, email and push are unlimited) only go out if push goes
  # unanswered. Low urgency (warnings, about nine a day over 2026-11-10..17)
  # goes to push only: unlimited, and never escalates to SMS or calls. Contact methods are
  # named by type and label, never by number; change numbers in PagerDuty.
  # adoptId takes over the rules the account already had.
  vitruvian-pagerduty:notificationRules:
    - {urgency: high, type: push_notification_contact_method, label: Pixel 11 Pro Fold, delayMinutes: 0, adoptId: PLE2VCZ}
    - {urgency: high, type: email_contact_method, label: Default, delayMinutes: 0, adoptId: PTZQFR0}
    - {urgency: high, type: sms_contact_method, label: Mobile, delayMinutes: 5, adoptId: PEUNHV3}
    - {urgency: high, type: phone_contact_method, label: Mobile, delayMinutes: 10, adoptId: PI3YI7T}
    - {urgency: low, type: push_notification_contact_method, label: Pixel 11 Pro Fold, delayMinutes: 0}
  vitruvian-pagerduty:services:
    - key: sentry
      name: Sentry
      description: Errors and issues from the self-hosted Sentry at sentry.lab.ipv1337.dev
    # One service per area of the homelab cluster, so an incident says where it
    # came from. Alertmanager picks the service from each alert rule's
    # pagerduty_service label (gitops/argocd/platform/prometheus); the keys
    # reach the cluster as the alertmanager-pagerduty-keys SealedSecret
    # (bazel run //tools/gitops:seal-alert-pagerduty).
    - key: cluster
      name: Homelab cluster
      description: Nodes, etcd, workloads, storage, certificates and the monitoring stack on the dev-local k3s cluster
    - key: data
      name: Homelab databases and backups
      description: CloudNativePG clusters, WAL archiving and backup jobs on the dev-local k3s cluster
    - key: apps
      name: Homelab apps and GitOps
      description: Argo CD sync health and the apps it deploys (Vitruvian Slack MCP) on the dev-local k3s cluster
    # GitHub Actions failures on main, stuck approvals, merge-queue bypasses
    # and broken mirrors, from .github/workflows/notify-ci-issues.yaml. Its key
    # reaches the workflow as the PAGERDUTY_CI_ROUTING_KEY repository secret,
    # which repo-config copies from this stack's ciIntegrationKey output.
    - key: ci
      name: CI / delivery
      description: GitHub Actions failures on main, stuck approvals, merge-queue bypasses and exported-mirror failures, from notify-ci-issues
