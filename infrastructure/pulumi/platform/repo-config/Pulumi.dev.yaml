config:
  vitruvian-core-repo-config:repoOwner: VitruvianSoftware
  vitruvian-core-repo-config:requirePullRequest: "false"
  vitruvian-core-repo-config:requireStatusChecks: "false"
  # Merge queue (#83) is the enforcement authority for main: PR merges go
  # through the queue and must pass the required CI checks. Classic
  # requireStatusChecks stays false to avoid the strict-up-to-date conflict
  # with the queue (the queue rebases entries itself).
  vitruvian-core-repo-config:mergeQueue: "true"
  # Required code-owner review on main (#804). OFF while this is a solo repo:
  # with one maintainer there is no second reviewer (it produces zero reviews),
  # and a ruleset bypass actor cannot satisfy it through the merge queue (bypass
  # applies only to a DIRECT merge, not auto-merge), so it only blocks
  # release-please/Dependabot auto-merge. Flip to "true" once a second reviewer
  # exists — the merge queue + required CI checks stay enforced regardless.
  vitruvian-core-repo-config:requireCodeOwnerReview: "false"
  # Per-agent GitHub App identities live in
  # docs/guides/creating-an-agent-github-app.md, NOT here. Which repositories an
  # App installation may touch cannot be managed from this stack: the provider
  # reads it via GET /user/installations/{id}/repositories, a USER-scoped
  # endpoint, and this stack authenticates as a GitHub App -- GitHub answers
  # "403 Resource not accessible by integration". A user PAT does not rescue it
  # either; modifying an org's app installation needs org-owner rights that the
  # deploy identity does not and should not have. The Terraform provider says so
  # in one line that is easy to skim past: "this resource is not compatible with
  # the GitHub App Installation authentication method".
  # Approval count. Independent of requireCodeOwnerReview above, because an App
  # CAN satisfy an approval but CANNOT be a code owner. Still "0": raising it
  # before every agent authors PRs under its own App re-creates the wedge
  # described above. See docs/guides/creating-an-agent-github-app.md step 6.
  vitruvian-core-repo-config:requiredApprovals: "0"
  vitruvian-core-repo-config:tabulaProductionReviewers:
    - ipv1337
  # Stage-5 multi-env on business unit 2. Every environment federates the SHARED
  # foundation-pool (repo-pinned provider) scoped to its GitHub Environment:
  # `build` pushes the shared Artifact Registry in bu2's infra-pipeline project
  # as the build SA; development/nonproduction/production deploy the promoted
  # digest into their own bu2 project as that env's per-app deploy SA.
  #
  # This replaces the personal-project pipeline identity (WIF pool
  # github-actions-dev-1 in tabula-dev-0001), which was NOT environment-scoped
  # and also trusted the archived BlueCentre/tabula repo.
  vitruvian-core-repo-config:tabulaVars:
    build:
      GCP_DEPLOY_SERVICE_ACCOUNT: tabula-build@prj-c-bu2-infra-pipeline-3d09.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-c-bu2-infra-pipeline-3d09
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    development:
      GCP_DEPLOY_SERVICE_ACCOUNT: tabula-deploy@prj-d-bu2-oss-floating-c3d1.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-d-bu2-oss-floating-c3d1
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    nonproduction:
      GCP_DEPLOY_SERVICE_ACCOUNT: tabula-deploy@prj-n-bu2-oss-floating-a943.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-n-bu2-oss-floating-a943
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    production:
      GCP_DEPLOY_SERVICE_ACCOUNT: tabula-deploy@prj-p-bu2-oss-floating-8663.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-p-bu2-oss-floating-8663
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
  vitruvian-core-repo-config:foundationVars:
    foundation-bootstrap:
      GCP_PROJECT_ID: prj-b-seed-c010
      GCP_SERVICE_ACCOUNT: sa-terraform-bootstrap@prj-b-seed-c010.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-org:
      GCP_PROJECT_ID: prj-b-seed-c010
      GCP_SERVICE_ACCOUNT: sa-terraform-org@prj-b-seed-c010.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    # org-folders creates the org-root fldr-foundation-1 umbrella folder and
    # deploys as the BOOTSTRAP SA (matching the WIF binding in
    # gcp-bootstrap/build_github_actions.go) from its own foundation-org-folders
    # environment. #642 split it off the shared foundation-bootstrap environment
    # but these vars were never added here, so the env had no credentials and the
    # deploy's WIF auth failed with an empty workload_identity_provider.
    foundation-org-folders:
      GCP_PROJECT_ID: prj-b-seed-c010
      GCP_SERVICE_ACCOUNT: sa-terraform-bootstrap@prj-b-seed-c010.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-env:
      GCP_PROJECT_ID: prj-b-seed-c010
      GCP_SERVICE_ACCOUNT: sa-terraform-env@prj-b-seed-c010.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-net:
      GCP_PROJECT_ID: prj-b-seed-c010
      GCP_SERVICE_ACCOUNT: sa-terraform-net@prj-b-seed-c010.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    foundation-proj:
      GCP_PROJECT_ID: prj-b-seed-c010
      GCP_SERVICE_ACCOUNT: sa-terraform-proj@prj-b-seed-c010.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
  # oauth-user-inspector deploy environments — non-secret identifiers only (keyless
  # WIF), keyed per GitHub Environment. The matching GitHub-side SECRETS are NOT
  # here; they are synced from a gitignored, Bitwarden-backed store by
  # //tools/sync-env-secrets (§2.4, §2.18).
  #
  # Stage-5 multi-env (Phase 3): every environment federates the SHARED
  # foundation-pool (repo-pinned provider). `build` pushes the shared Artifact
  # Registry in the infra-pipeline project as the build SA (oauth-user-
  # inspector-build stack); development/nonproduction/production deploy the
  # promoted digest into their env's oss-floating project as that env's
  # per-app deploy SA (oauth-user-inspector-deploy-identity stacks).
  # `development` now targets the dev oss project — the old personal-project
  # (gen-lang-client-*) pipeline identity is retired with the Phase-4 cutover.
  vitruvian-core-repo-config:oauthVars:
    build:
      GCP_DEPLOY_SERVICE_ACCOUNT: oauth-user-inspector-build@prj-c-bu1-infra-pipeline-4b48.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-c-bu1-infra-pipeline-4b48
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    development:
      GCP_DEPLOY_SERVICE_ACCOUNT: oauth-user-inspector-deploy@prj-d-bu1-oss-floating-648a.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-d-bu1-oss-floating-648a
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    nonproduction:
      GCP_DEPLOY_SERVICE_ACCOUNT: oauth-user-inspector-deploy@prj-n-bu1-oss-floating-630b.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-n-bu1-oss-floating-630b
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
    production:
      GCP_DEPLOY_SERVICE_ACCOUNT: oauth-user-inspector-deploy@prj-p-bu1-oss-floating-16e0.iam.gserviceaccount.com
      GCP_PROJECT_ID: prj-p-bu1-oss-floating-16e0
      GCP_REGION: us-central1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1064807322707/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider
  # buildbuddyApiKey is NO LONGER committed here (issue #456 / §2.4). The CI
  # apply/preview inject it as the BUILDBUDDY_API_KEY env var from the pipeline
  # secret; a local run may `pulumi config set --secret buildbuddyApiKey`
  # (gitignored). Resolved via secrets.EnvOrConfigOptional (pkg/secrets),
  # called from dependabotSecrets() in main.go.
