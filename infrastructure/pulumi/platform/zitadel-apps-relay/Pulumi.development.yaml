# Committed stack config: non-secret identifiers only. The Zitadel provider
# credential comes from the ZITADEL_MACHINE_KEY_JSON pipeline secret at apply
# time. One stack: during P0 the relay is a homelab spike.
config:
  zitadel:domain: auth.ipv1337.dev
  # Own project (see main.go for why `aud` alone is not a boundary here).
  zitadel-apps-relay:projectName: relay
  zitadel-apps-relay:orgId: "378818267051001367" # the "Vitruvian" FirstInstance org
  zitadel-apps-relay:roleKey: relay-user
  # Invite-only: you can sign in only if you hold the relay-user role through a
  # user grant. The check and the grant land in the same apply (main.go refuses
  # the check without a grant). James's grant is grantUserIds below; everyone
  # else is in inviteUserIds. Both are applied by CI, never by hand.
  # 378818267051722263 is the account for james.nguyen@gmail.com, the one that
  # can log in (see zitadel-apps-mcp-slack's config for how that was confirmed).
  zitadel-apps-relay:projectRoleCheck: "true"
  zitadel-apps-relay:grantUserIds: "378818267051722263"
  # Comma-separated Zitadel user ids of invited people. Each user must already
  # exist in the same org as the project (orgId above), and must not also be in
  # grantUserIds. Empty = nobody invited.
  # 401064406491859363 is relay-test, a test person for the live second-user
  # check (created 2026-11-24 with no password in git). Remove it after the test.
  zitadel-apps-relay:inviteUserIds: "401064406491859363"
  # ChatGPT's per-connector callback, copied from ChatGPT's "Add custom MCP
  # server" screen. Empty = no ChatGPT client yet (spike A, second half).
  zitadel-apps-relay:chatgptRedirectUris: ""
  # The Gemini app's callback for this connector, copied from Gemini's
  # Settings > Connectors > + Custom > Additional settings > "Copy redirect URI"
  # with https://relay-spike.ipv1337.dev/mcp as the server URL (2026-11-13).
  # The second is the same callback for James's Mac on the multi-user relay
  # (its /mcp/d/<device> URL, 2026-11-22): Gemini gives each server URL its own.
  # Comma-separated. Empty = no Gemini client.
  zitadel-apps-relay:geminiRedirectUris: "https://oauth-redirect.googleusercontent.com/r/user_bound_custom-mcp-b3b5dc02c05b1a90254344dc,https://oauth-redirect.googleusercontent.com/r/user_bound_custom-mcp-ad531bcb73c097fd14140faf"
