# Committed stack config (config-as-code): non-secret values only.
# The Sentry API token is never stored here; CI passes SENTRY_TOKEN from the
# sentry-production environment, and internal/config/config_test.go rejects any
# token-like value, `secure:` ciphertext, or unknown config key.
config:
  sentry:baseUrl: https://sentry.lab.ipv1337.dev/api/
  sentry:organization: sentry
  sentry:team:
    name: Vitruvian
    slug: vitruvian
  sentry:projects:
    - name: Backstage
      slug: backstage
      platform: node-express
      resolveAge: 720
    - name: OAuth User Inspector
