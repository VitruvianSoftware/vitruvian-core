# Stack config for the vitruviansoftware.dev foundation Phase 4 — development projects.
#
# Deploys business unit "bu1" under fldr-{development}-bu1 (parented off the live
# gcp-environments development env folder, i.e. under fldr-foundation-1).
#
# Hybrid go-live posture: the full 4-projects machinery is ported, but only the
# FLOATING project type is instantiated for now (svpc/peering/confidential-space/
# infra-pipeline/CMEK toggled off). Floating-only keeps this stack collision-free
# for co-tenancy — no Shared-VPC attach, no VPC-SC perimeter mutation, no peering.
#
# Promotion order: development → nonproduction → production
# This is the first environment deployed (auto-approve).
config:
  # --- Environment + business unit identity ---
  foundation-projects:env: "development"
  foundation-projects:business_code: "bu1"

  # --- Core identifiers ---
  foundation-projects:billing_account: "013EEF-107C95-8E11BD"
  foundation-projects:project_prefix: "prj"
  foundation-projects:folder_prefix: "fldr"

  # --- Cross-stage reference (per-env env stack; org/network refs unused while
  #     only the floating type is enabled, so they are omitted) ---
  foundation-projects:env_stack_name: "ipv1337/foundation-environments/development"

  # --- Project-type enablement: FLOATING ONLY ---
  foundation-projects:floating_project_enabled: "true"
  foundation-projects:svpc_project_enabled: "false"
  foundation-projects:peering_project_enabled: "false"
  foundation-projects:infra_pipeline_enabled: "false"
  foundation-projects:confidential_space_enabled: "false"

  # --- Features off for the floating-only first cut ---
  foundation-projects:cmek_enabled: "false"
  foundation-projects:peering_enabled: "false"
  foundation-projects:enforce_vpcsc: "false"
