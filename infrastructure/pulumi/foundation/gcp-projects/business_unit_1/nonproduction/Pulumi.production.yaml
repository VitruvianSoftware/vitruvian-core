# Stack config for the vitruviansoftware.dev foundation Phase 4 — bu1 nonproduction leaf.
#
# Deploys business unit "bu1" under fldr-nonproduction-bu1 (parented off the live
# gcp-environments nonproduction env folder, i.e. under fldr-foundation-1). The
# environment identity (nonproduction/n) is pinned in this leaf's main.go, not
# configured here (upstream business_unit_1/nonproduction layout).
#
# Hybrid go-live posture: FLOATING project type only (see development leaf notes).
# The BU's shared infra-pipeline project lives in the sibling
# business_unit_1/shared leaf.
#
# Promotion order: development → nonproduction → production
# Gated by GitHub Environment protection.
config:
  # --- Business unit identity ---
  foundation-projects-bu1-nonproduction:business_code: "bu1"

  # --- Core identifiers ---
  foundation-projects-bu1-nonproduction:billing_account: "008CAA-C364C4-B29B67"
  foundation-projects-bu1-nonproduction:project_prefix: "prj"
  foundation-projects-bu1-nonproduction:folder_prefix: "fldr"

  # --- Cross-stage reference (per-env env leaf stack; org/network refs unused
  #     while only the floating type is enabled, so they are omitted) ---
  foundation-projects-bu1-nonproduction:env_stack_name: "ipv1337/foundation-environments-nonproduction/production"

  # --- Project-type enablement: FLOATING ONLY ---
  foundation-projects-bu1-nonproduction:floating_project_enabled: "true"
  # OSS apps home (e.g. oauth-user-inspector): second floating project prj-{env}-bu1-oss-floating
  foundation-projects-bu1-nonproduction:oss_floating_project_enabled: "true"
  # Read-only access for homelab-cluster workloads federated in by
  # gcp-bootstrap (docs/gcp-cluster-federation.md). The identity is
  # created there and granted here, because roles on a project belong to
  # the stage that owns the project. Roles default to run.viewer +
  # monitoring.viewer and are validated against a read-only allowlist.
  foundation-projects-bu1-nonproduction:cluster_reader_members: "serviceAccount:sa-homelab-cluster@prj-b-cicd-e096.iam.gserviceaccount.com"
  foundation-projects-bu1-nonproduction:svpc_project_enabled: "false"
  foundation-projects-bu1-nonproduction:peering_project_enabled: "false"
  foundation-projects-bu1-nonproduction:confidential_space_enabled: "false"

  # --- Features off for the floating-only first cut ---
  foundation-projects-bu1-nonproduction:cmek_enabled: "false"
  foundation-projects-bu1-nonproduction:peering_enabled: "false"
  foundation-projects-bu1-nonproduction:enforce_vpcsc: "false"

  # --- Platform-issued app deploy identities (stage-5 workloads consume these) ---
  # Minted HERE, one stage above the 5-app-infra workloads they deploy, so an
  # app's pipeline can never edit the stack defining its own permissions.
  # The account id and role set are replicated EXACTLY from
  # oauth-user-inspector/infra/identity, which owned them before adoption.
  foundation-projects-bu1-nonproduction:bootstrap_stack_name: "ipv1337/foundation-bootstrap/production"
  foundation-projects-bu1-nonproduction:apps: "oauth-user-inspector"
  foundation-projects-bu1-nonproduction:app_build_reader_grants: "oauth-user-inspector=prj-c-bu1-infra-pipeline-4b48/us-central1/oauth-user-inspector"
  foundation-projects-bu1-nonproduction:oauth-user-inspector_deploy_account_id: "oauth-user-inspector-deploy"
  foundation-projects-bu1-nonproduction:oauth-user-inspector_deploy_roles: "roles/run.admin,roles/iam.serviceAccountUser,roles/serviceusage.serviceUsageConsumer,roles/logging.viewer"
  # The FIFTH deploy grant: Secret Manager admin CONDITIONED to this app's
  # secret prefix. It was NOT carried over when the deploy identity was adopted
  # here (the "replicated EXACTLY" note above predates conditioned-role support
  # in app_deploy_identity, added in #1148) -- the app stack still owns it.
  # Title + expression reproduce the LIVE binding byte for byte, verified with
  # `gcloud projects get-iam-policy`; a mismatch would create a SECOND binding
  # instead of adopting the existing one. The ${projectNumber} placeholder
  # resolves from this stage's own oss_floating_project_number output.
  # It must NOT be appended to _deploy_roles: unconditioned, secretmanager.admin
  # reaches every co-tenant app's secrets (app_deploy_identity refuses it).
  foundation-projects-bu1-nonproduction:oauth-user-inspector_deploy_conditional_roles: 'roles/secretmanager.admin|oauth-user-inspector-secrets-only|resource.name.startsWith("projects/${projectNumber}/secrets/OAUTH_USER_INSPECTOR_")'
