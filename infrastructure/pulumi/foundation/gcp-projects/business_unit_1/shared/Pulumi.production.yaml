# Stack config for the vitruviansoftware.dev foundation Phase 4 — bu1 shared leaf.
#
# The once-per-BU, environment-independent resources (upstream
# 4-projects/business_unit_1/shared): the app-infra pipeline project
# prj-c-bu1-infra-pipeline under the 1-org COMMON folder. This shared,
# cross-env project hosts stage-5 app CI/CD + the build-once Artifact
# Registry; the common/c identity is pinned in this leaf's main.go.
#
# This leaf replaces the old per-env infra_pipeline_enabled toggle (previously
# enabled only in the production env stack to avoid duplicate projects): the
# pipeline now has exactly one structural home. dev/nonprod/prod app stacks
# consume infra_pipeline_project_id from
# ipv1337/foundation-projects-bu1-shared/production.
config:
  # --- Business unit identity ---
  foundation-projects-bu1-shared:business_code: "bu1"

  # --- Core identifiers ---
  foundation-projects-bu1-shared:billing_account: "013EEF-107C95-8E11BD"
  foundation-projects-bu1-shared:project_prefix: "prj"

  # --- Cross-stage reference (1-org root at envs/shared) ---
  foundation-projects-bu1-shared:org_stack_name: "ipv1337/foundation-org-shared/production"
  # Bootstrap stack — provides wif_pool_name for app build-SA WIF bindings.
  # Only referenced when app_build_spaces is non-empty (see remote.go).
  foundation-projects-bu1-shared:bootstrap_stack_name: "ipv1337/foundation-bootstrap/production"

  # --- App-infra pipeline (the leaf's reason to exist; explicit for clarity) ---
  foundation-projects-bu1-shared:infra_pipeline_enabled: "true"

  # --- App build spaces (foundation owns each app's shared image registry) ----
  # The AR repository + build SA + writer grant that let an app push images.
  # Foundation-authored because they live in the shared infra-pipeline project
  # (which the foundation owns) and hand out permissions — see
  # docs/engineering/core-vs-application-infrastructure.md §3. Reader grants live
  # in the env leaves (the consuming SAs are per-env).
  #
  # oauth-user-inspector: adopts the live repo/SA the app's build stack created
  # (createIgnoreAlreadyExists + retainOnDelete in app_build_space make this
  # non-destructive). Region is us-west1 — the app's region, NOT the leaf default
  # us-central1 — so the declared repo matches the live one and adoption is a
  # no-op rather than a second repo in the wrong location.
  foundation-projects-bu1-shared:app_build_spaces: "oauth-user-inspector"
  foundation-projects-bu1-shared:oauth-user-inspector_ar_repository_id: "oauth-user-inspector"
  foundation-projects-bu1-shared:oauth-user-inspector_ar_region: "us-west1"
  foundation-projects-bu1-shared:oauth-user-inspector_build_account_id: "oauth-user-inspector-build"
  foundation-projects-bu1-shared:oauth-user-inspector_build_github_environment: "oauth-user-inspector-build"
