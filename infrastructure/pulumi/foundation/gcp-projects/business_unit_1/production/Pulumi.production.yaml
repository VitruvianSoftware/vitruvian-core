# Stack config for the vitruviansoftware.dev foundation Phase 4 — bu1 production leaf.
#
# Deploys business unit "bu1" under fldr-production-bu1 (parented off the live
# gcp-environments production env folder, i.e. under fldr-foundation-1). The
# environment identity (production/p) is pinned in this leaf's main.go, not
# configured here (upstream business_unit_1/production layout).
#
# Hybrid go-live posture: FLOATING project type only (svpc/peering/
# confidential-space/CMEK toggled off). Floating-only keeps this stack
# collision-free for co-tenancy — no Shared-VPC attach, no VPC-SC perimeter
# mutation, no peering. The BU's shared infra-pipeline project lives in the
# sibling business_unit_1/shared leaf.
#
# Promotion order: development → nonproduction → production
# Gated by GitHub Environment protection.
config:
  # --- Business unit identity ---
  foundation-projects-bu1-production:business_code: "bu1"

  # --- Core identifiers ---
  foundation-projects-bu1-production:billing_account: "008CAA-C364C4-B29B67"
  foundation-projects-bu1-production:project_prefix: "prj"
  foundation-projects-bu1-production:folder_prefix: "fldr"

  # --- Cross-stage reference (per-env env leaf stack; org/network refs unused
  #     while only the floating type is enabled, so they are omitted) ---
  foundation-projects-bu1-production:env_stack_name: "ipv1337/foundation-environments-production/production"

  # --- Project-type enablement: FLOATING ONLY ---
  foundation-projects-bu1-production:floating_project_enabled: "true"
  # OSS apps home (e.g. oauth-user-inspector): second floating project prj-{env}-bu1-oss-floating
  foundation-projects-bu1-production:oss_floating_project_enabled: "true"
  foundation-projects-bu1-production:svpc_project_enabled: "false"
  foundation-projects-bu1-production:peering_project_enabled: "false"
  foundation-projects-bu1-production:confidential_space_enabled: "false"

  # --- Features off for the floating-only first cut ---
  foundation-projects-bu1-production:cmek_enabled: "false"
  foundation-projects-bu1-production:peering_enabled: "false"
  foundation-projects-bu1-production:enforce_vpcsc: "false"

  # --- Platform-issued app deploy identities (stage-5 workloads consume these) ---
  # Minted HERE, one stage above the 5-app-infra workloads they deploy, so an
  # app's pipeline can never edit the stack defining its own permissions.
  # The account id and role set are replicated EXACTLY from
  # oauth-user-inspector/infra/identity, which owned them before adoption.
  foundation-projects-bu1-production:bootstrap_stack_name: "ipv1337/foundation-bootstrap/production"
  foundation-projects-bu1-production:apps: "oauth-user-inspector"
  foundation-projects-bu1-production:app_build_reader_grants: "oauth-user-inspector=prj-c-bu1-infra-pipeline-4b48/us-central1/oauth-user-inspector"
  foundation-projects-bu1-production:oauth-user-inspector_deploy_account_id: "oauth-user-inspector-deploy"
  foundation-projects-bu1-production:oauth-user-inspector_deploy_roles: "roles/run.admin,roles/iam.serviceAccountUser,roles/serviceusage.serviceUsageConsumer,roles/logging.viewer"
