# Stack config for the vitruviansoftware.dev foundation Phase 4 — bu2 development leaf.
#
# Deploys business unit "bu2" under fldr-development-bu2 (parented off the live
# gcp-environments development env folder, i.e. under fldr-foundation-1). The
# environment identity (development/d) is pinned in this leaf's main.go, not
# configured here (upstream business_unit_2/development layout).
#
# Hybrid go-live posture: the full 4-projects machinery is ported, but only the
# FLOATING project type is instantiated for now (svpc/peering/confidential-space/
# CMEK toggled off). Floating-only keeps this stack collision-free for
# co-tenancy — no Shared-VPC attach, no VPC-SC perimeter mutation, no peering.
# The BU's shared infra-pipeline project lives in the sibling
# business_unit_2/shared leaf.
#
# Promotion order: development → nonproduction → production
# This is the first environment deployed (auto-approve).
config:
  # --- Business unit identity ---
  foundation-projects-bu2-development:business_code: "bu2"

  # --- Core identifiers ---
  foundation-projects-bu2-development:billing_account: "008CAA-C364C4-B29B67"
  foundation-projects-bu2-development:project_prefix: "prj"
  foundation-projects-bu2-development:folder_prefix: "fldr"

  # --- Cross-stage reference (per-env env leaf stack; org/network refs unused
  #     while only the floating type is enabled, so they are omitted) ---
  foundation-projects-bu2-development:env_stack_name: "ipv1337/foundation-environments-development/production"

  # --- Project-type enablement: FLOATING ONLY ---
  foundation-projects-bu2-development:floating_project_enabled: "false"
  # OSS apps home (bu2 = tabula): second floating project prj-{env}-bu2-oss-floating
  foundation-projects-bu2-development:oss_floating_project_enabled: "true"
  foundation-projects-bu2-development:svpc_project_enabled: "false"
  foundation-projects-bu2-development:peering_project_enabled: "false"
  foundation-projects-bu2-development:confidential_space_enabled: "false"

  # --- Features off for the floating-only first cut ---
  foundation-projects-bu2-development:cmek_enabled: "false"
  foundation-projects-bu2-development:peering_enabled: "false"
  foundation-projects-bu2-development:enforce_vpcsc: "false"

  # App-infra pipeline identity (sa-app-infra-bu2): applies the stage-5
  # gcp-app-infra/business_unit_2/development leaf. tabula's per-app deploy SA
  # stays in tabula/infra/identity; this only mints the pipeline SA.
  foundation-projects-bu2-development:apps: "tabula"
  # --- Platform-issued app deploy identity (stage-5 workloads consume this) ---
  # Minted HERE, one stage above the 5-app-infra workload it deploys, so tabula's
  # pipeline can never edit the stack defining its own permissions (§4.1).
  # The account id, role set and IAM conditions are replicated EXACTLY from
  # tabula/infra/identity, which owned them before adoption -- verified against
  # the LIVE policy with `gcloud projects get-iam-policy`. Adoption must be
  # permission-neutral: app_deploy_identity creates the SA with
  # CreateIgnoreAlreadyExists, and because projects.IAMMember is
  # non-authoritative and every (role, member, condition) tuple matches, each
  # create is an idempotent no-op patch of the existing binding.
  # The secretmanager roles MUST stay in _deploy_conditional_roles: unconditioned
  # they would reach every co-tenant app's secrets (the module refuses them).
  foundation-projects-bu2-development:tabula_deploy_account_id: "tabula-deploy"
  foundation-projects-bu2-development:tabula_deploy_roles: "roles/run.admin,roles/iam.serviceAccountUser,roles/serviceusage.serviceUsageConsumer,roles/logging.viewer"
  foundation-projects-bu2-development:tabula_deploy_conditional_roles: 'roles/secretmanager.admin|tabula-secrets-only|resource.name.startsWith("projects/${projectNumber}/secrets/TABULA_");roles/secretmanager.secretAccessor|tabula-secrets-only|resource.name.startsWith("projects/${projectNumber}/secrets/TABULA_")'
  foundation-projects-bu2-development:bootstrap_stack_name: "ipv1337/foundation-bootstrap/production"
  foundation-projects-bu2-development:app_build_reader_grants: "tabula=prj-c-bu2-infra-pipeline-3d09/us-central1/tabula"
