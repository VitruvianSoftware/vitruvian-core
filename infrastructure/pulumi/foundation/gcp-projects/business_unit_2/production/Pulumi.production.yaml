# Stack config for the vitruviansoftware.dev foundation Phase 4 — bu2 production leaf.
#
# Deploys business unit "bu2" under fldr-production-bu2 (parented off the live
# gcp-environments production env folder, i.e. under fldr-foundation-1). The
# environment identity (production/p) is pinned in this leaf's main.go, not
# configured here (upstream business_unit_2/production layout).
#
# Hybrid go-live posture: FLOATING project type only (svpc/peering/
# confidential-space/CMEK toggled off). Floating-only keeps this stack
# collision-free for co-tenancy — no Shared-VPC attach, no VPC-SC perimeter
# mutation, no peering. The BU's shared infra-pipeline project lives in the
# sibling business_unit_2/shared leaf.
#
# Promotion order: development → nonproduction → production
# Gated by GitHub Environment protection.
config:
  # --- Business unit identity ---
  foundation-projects-bu2-production:business_code: "bu2"

  # --- Core identifiers ---
  foundation-projects-bu2-production:billing_account: "013EEF-107C95-8E11BD"
  foundation-projects-bu2-production:project_prefix: "prj"
  foundation-projects-bu2-production:folder_prefix: "fldr"

  # --- Cross-stage reference (per-env env leaf stack; org/network refs unused
  #     while only the floating type is enabled, so they are omitted) ---
  foundation-projects-bu2-production:env_stack_name: "ipv1337/foundation-environments-production/production"

  # --- Project-type enablement: FLOATING ONLY ---
  foundation-projects-bu2-production:floating_project_enabled: "false"
  # OSS apps home (bu2 = tabula): second floating project prj-{env}-bu2-oss-floating
  foundation-projects-bu2-production:oss_floating_project_enabled: "true"
  foundation-projects-bu2-production:svpc_project_enabled: "false"
  foundation-projects-bu2-production:peering_project_enabled: "false"
  foundation-projects-bu2-production:confidential_space_enabled: "false"

  # --- Features off for the floating-only first cut ---
  foundation-projects-bu2-production:cmek_enabled: "false"
  foundation-projects-bu2-production:peering_enabled: "false"
  foundation-projects-bu2-production:enforce_vpcsc: "false"
