# Stack config for the vitruviansoftware.dev foundation Phase 3 — production network.
#
# This stack deploys the production spoke VPC in hub-and-spoke topology:
#   - Shared VPC host project (prj-p-svpc)
#   - Spoke VPC, subnets, Cloud NAT, DNS, firewall, PSC
#   - Bi-directional VPC peering to hub
#
# Promotion order: development → nonproduction → production
# This environment requires manual approval.
config:
  # --- Environment identity ---
  foundation-networks:env: "production"
  foundation-networks:env_code: "p"

  # --- Core identifiers (mirrors 1-org config) ---
  foundation-networks:org_id: "90456063361"
  foundation-networks:default_region: "us-central1"
  foundation-networks:secondary_region: "us-south1"

  # --- Hub project (created by 1-org when enable_hub_and_spoke=true) ---
  foundation-networks:hub_project_id: "prj-net-hub"

  # --- Cross-stage references ---
  foundation-networks:org_stack_name: "ipv1337/foundation-org/production"

  # --- Network folder (from 1-org) ---
  foundation-networks:parent_id: "folders/823326946563"

  # --- DNS ---
  foundation-networks:domain: "vitruviansoftware.dev."

  # --- VPC-SC access level members (dry-run baseline; enforce_vpcsc=false) ---
  # Foundation SAs that operate resources through the service perimeters. GCP
  # rejects an access level with no non-trivial condition, so this trusted set is
  # required; refine it (and flip enforce_vpcsc=true) once the perimeter posture
  # is validated. Migrated from foundation-0's VPC-SC (2026-07-09).
  foundation-networks:vpc_sc_members:
    - "serviceAccount:sa-terraform-bootstrap@prj-b-seed-8ebb.iam.gserviceaccount.com"
    - "serviceAccount:sa-terraform-org@prj-b-seed-8ebb.iam.gserviceaccount.com"
    - "serviceAccount:sa-terraform-env@prj-b-seed-8ebb.iam.gserviceaccount.com"
    - "serviceAccount:sa-terraform-net@prj-b-seed-8ebb.iam.gserviceaccount.com"
    - "serviceAccount:sa-terraform-proj@prj-b-seed-8ebb.iam.gserviceaccount.com"
