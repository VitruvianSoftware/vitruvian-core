# Stack config for the vitruviansoftware.dev foundation Phase 5 (app-infra) -
# bu2 nonproduction leaf. The environment identity is pinned in this leaf's main.go,
# not configured here (upstream business_unit_1/<env> layout).
#
# bu2 hosts tabula. The Cloud Run workload itself is still deployed by
# tabula/infra/app; moving it onto modules/serverless_space adopts a live
# traffic-serving service and is a separate, deliberate cutover
# (docs/engineering/core-vs-application-infrastructure.md 7) - NOT this leaf.
#
# Promotion order: development -> nonproduction -> production
config:
  foundation-app-infra-bu2-nonproduction:business_code: "bu2"
  # tabula's live Cloud Run services run in us-central1 (see tabula/infra/app),
  # NOT bu1's us-west1 - the region must match so a future import diff is empty.

  # --- Cross-stage reference ---
  foundation-app-infra-bu2-nonproduction:projects_stack_name: "ipv1337/foundation-projects-bu2-nonproduction/production"

  # --- Applications hosted in this environment ---
  foundation-app-infra-bu2-nonproduction:apps: "tabula"

  # Deploy identity is consumed by StackReference from gcp-projects bu2. NOTE:
  # bu2 stage-4 does not yet MINT it (tabula/infra/identity still owns
  # tabula-deploy); moving that mint up a stage is the prerequisite for the
  # cutover and is tracked as a deliberate follow-up, not done here.

  # Cloud Run service is live and serving from tabula/infra/app. Flipping it
  # alone would try to CREATE a service that already exists and fail. Cutover:
  # docs/engineering/core-vs-application-infrastructure.md 7 (import here ->
  # flip true -> state-delete from the app stack). Values below replicate the
  # live service so the imported resource matches and the diff is empty.
