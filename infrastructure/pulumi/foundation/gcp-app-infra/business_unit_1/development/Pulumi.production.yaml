# Stack config for the vitruviansoftware.dev foundation Phase 5 (app-infra) -
# bu1 development leaf. The environment identity is pinned in this leaf's main.go,
# not configured here (upstream business_unit_1/<env> layout).
#
# Scope today: the PLATFORM-ISSUED deploy identity per app per env
# (docs/engineering/core-vs-application-infrastructure.md 4.1). The Cloud Run
# workload itself is still deployed by oauth-user-inspector/infra/app; moving it
# onto modules/serverless_space adopts a live traffic-serving service and is a
# separate change.
#
# Promotion order: development -> nonproduction -> production
config:
  foundation-app-infra-bu1-development:business_code: "bu1"
  foundation-app-infra-bu1-development:region: "us-west1"

  # --- Cross-stage reference ---
  foundation-app-infra-bu1-development:projects_stack_name: "ipv1337/foundation-projects-bu1-development/production"

  # --- Applications hosted in this environment ---
  # Adding an app is a one-line change here plus its per-app overrides below.
  foundation-app-infra-bu1-development:apps: "oauth-user-inspector"

  # Deploy identities are minted in gcp-projects (one stage up) and consumed
  # here by StackReference — see that leaf's `apps` config.

  # --- oauth-user-inspector serverless workload (NOT YET CUT OVER) ---
  # workload_enabled is the cutover switch and is deliberately FALSE: the
  # Cloud Run service is live and serving from oauth-user-inspector/infra/app.
  # A Pulumi stack cannot adopt a running resource by declaring it, so flipping
  # this alone would try to CREATE a service that already exists and fail.
  # Cutover order is in docs/engineering/core-vs-application-infrastructure.md
  # §7: import here -> flip to true -> state-delete from the app stack.
  # The values below are replicated from that stack so the imported resource
  # matches and the diff after import is empty.
  foundation-app-infra-bu1-development:oauth-user-inspector_workload_enabled: "true"
  foundation-app-infra-bu1-development:oauth-user-inspector_service_name: "oauth-user-inspector"
  foundation-app-infra-bu1-development:oauth-user-inspector_secret_prefix: "OAUTH_USER_INSPECTOR_"
  foundation-app-infra-bu1-development:oauth-user-inspector_runtime_service_account: "oauth-user-inspector-rt@prj-d-bu1-oss-floating-648a.iam.gserviceaccount.com"
  foundation-app-infra-bu1-development:oauth-user-inspector_max_instances: "10"
  foundation-app-infra-bu1-development:oauth-user-inspector_public_invoker: "true"

