# Committed stack config for the development environment (tabula-dev-0001 is
# the project the standalone repo used; its secrets are adopted on first up —
# see adoptExistingSecrets in main.go, flip to false after the first deploy).
config:
  gcp:project: tabula-dev-0001
  tabula:project: tabula-dev-0001
  tabula:region: us-central1
  tabula:environment: dev
  tabula:apiUrl: https://tabula-api-dev-q7dosy3wiq-uc.a.run.app/api/v1
  # The development (unpacked) extension install's origin. Becomes stable
  # once the extension ships with a fixed ID (manifest key / Web Store).
  tabula:authPostmessageOrigin: chrome-extension://ghlhjkkemckcbckgimildcekkjjkaajf
  tabula:deployServiceAccount: github-actions-dev@tabula-dev-0001.iam.gserviceaccount.com
  tabula:adoptExistingSecrets: "false"
