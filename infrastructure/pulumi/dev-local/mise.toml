[env]
# Automatically load the .env file if it exists
_.file = ".env"
# Automatically point kubectl/pulumi to the local Lima cluster
KUBECONFIG = "{{config_root}}/lima-k8s.yaml"

[tools]
# Pin exact tool versions so every contributor has identical environments
go = "1.25.6"
pulumi = "3"

[tasks.init]
description = "Initialize local config templates (does not overwrite existing)"
run = [
    "cp -n .env.example .env || true",
    "cp -n Pulumi.example.yaml Pulumi.local.yaml || true"
]

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.tidy]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks.preview]
description = "Run a Pulumi preview against the local stack"
run = "pulumi preview -s local"

[tasks.deploy]
description = "Deploy the infrastructure locally"
run = "pulumi up -s local"

[tasks.destroy]
description = "Destroy the local infrastructure"
run = "pulumi destroy -s local"
