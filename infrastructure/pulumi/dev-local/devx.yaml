# Inject KUBECONFIG into `devx run`/`devx action` child commands so pulumi's
# k8s provider (context "default") can reach the local cluster without the
# developer exporting KUBECONFIG by hand.
kubeconfig: ~/.kube/cluster.yaml

pipeline:
  test:
    command: ["go", "test", "./..."]
  lint:
    command: ["go", "vet", "./..."]
  build:
    # Ensure the code compiles. (pulumi preview requires live cluster state)
    command: ["go", "build", "."]

customActions:
  preview:
    command: ["pulumi", "preview", "--diff"]
  up:
    command: ["pulumi", "up", "--yes"]
  refresh:
    command: ["pulumi", "refresh", "--yes"]
  destroy:
    command: ["pulumi", "destroy", "--yes"]
  provision-local-dev-infrastructure:
    commands:
      - ["echo", "=== PROVISIONING LOCAL DEV INFRASTRUCTURE ==="]
      - ["pulumi", "up", "--refresh", "--yes"]
