config:
  monorepo:kubernetes_context: "default"
  monorepo:region: "us-central1"
  monorepo:high_availability_enabled: "true"
  monorepo:longhorn_enabled: "true"
  monorepo:minio_enabled: "true"
  monorepo:gemini_telemetry_enabled: "true"
  monorepo:cert_manager_enabled: "true"
  monorepo:cert_manager_version: "v1.17.0"
  monorepo:external_secrets_enabled: "true"
  monorepo:external_secrets_version: "0.14.4"
  monorepo:external_dns_enabled: "true"
  monorepo:external_dns_version: "1.15.0"
  monorepo:monitoring_enabled: "true"
  monorepo:grafana_enabled: "true"
  monorepo:grafana_ha_enabled: "true"
  monorepo:grafana_db_backups_enabled: "true"
  monorepo:grafana_version: "10.5.15"
  monorepo:opentelemetry_enabled: "true"
  monorepo:opentelemetry_version: "0.110.0"
  monorepo:datadog_enabled: "false"
  monorepo:datadog_version: "3.74.1"
  monorepo:istio_enabled: "false"
  monorepo:istio_version: "1.23.3"
  monorepo:redis_enabled: "false"
  monorepo:redis_version: "25.4.1"
  monorepo:cnpg_enabled: "true"
  monorepo:cnpg_version: "0.23.2"
  monorepo:cnpg_operator_version: "0.23.2"
  monorepo:cleanup_crds: "false"
  monorepo:cnpg_cluster_version: "0.2.1"
  monorepo:cnpg_app_db_name: app
  monorepo:cnpg_app_db_user: app_user
  monorepo:mongodb_enabled: "false"
  monorepo:mongodb_operator_version: "0.13.0"
  monorepo:mongodb_replicaset_version: "4.4.19"
  monorepo:argocd_enabled: "false"
  # Optional ArgoCD access (defaults: ClusterIP, reach via `kubectl port-forward`).
  # Set both to expose the UI through traefik + external-dns:
  #   monorepo:argocd_domain: "argocd.dev.example.io"
  #   monorepo:argocd_ingress_enabled: "true"
  #   monorepo:argocd_ingress_class: "traefik"   # override the default if needed
  #   monorepo:argocd_admin_email: "you@example.com"  # binds org-admin (needs an SSO connector)
  monorepo:telepresence_enabled: "false"
  monitoring:namespace: monitoring
  database:namespace: database
  ingress:namespace: ingress-nginx
