# Cert Manager Helm values
# installCRDs: false  # We'll use CRD management through the Helm chart's built-in mechanism
crds:
  enabled: false

global:
  leaderElection:
    namespace: cert-manager

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9402"

resources:
  requests:
    cpu: 10m
    memory: 32Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1