# Committed stack config for the nonproduction environment (config-as-code): the
# env's oss-floating project, region, and runtime SA (minted by the sibling
# oauth-user-inspector-deploy-identity stack). The image digest is a
# per-invocation input (OAUTH_USER_INSPECTOR_IMAGE_DIGEST) from the build-once
# job, never committed. Runtime secrets stay in GCP Secret Manager under the
# OAUTH_USER_INSPECTOR_ prefix.
config:
  gcp:project: prj-n-bu1-oss-floating-630b
  oauth-user-inspector:project: prj-n-bu1-oss-floating-630b
  oauth-user-inspector:region: us-west1
  oauth-user-inspector:environment: nonproduction
  oauth-user-inspector:runtimeServiceAccount: oauth-user-inspector-rt@prj-n-bu1-oss-floating-630b.iam.gserviceaccount.com
  # Custom domain (opt-in): Cloud Run DomainMapping + grey-cloud Cloudflare
  # CNAME (main.go). The zone is given by NAME and resolved to its id at
  # deploy time via the CLOUDFLARE_API_TOKEN-authenticated API.
  oauth-user-inspector:customDomain: oauth-inspector.staging.ipv1337.dev
  oauth-user-inspector:cloudflareZone: ipv1337.dev
