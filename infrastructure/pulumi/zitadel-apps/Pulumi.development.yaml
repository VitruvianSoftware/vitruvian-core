# Committed stack config (config-as-code): non-secret identifiers only, so the
# deploy workflow can resolve them on a clean checkout (principle §2.5). The
# Zitadel provider credential is injected at apply time by the deploy workflow
# from the ZITADEL_MACHINE_KEY_JSON pipeline secret — never stored here.
#
# Before enabling the ZITADEL_APPS_AUTO_APPLY variable on the
# oauth-user-inspector-deploy workflow, an operator seeds the org/project/import
# IDs below (read from the Zitadel console: Project → your project → the app).
# Until then the apply job is gated off and these are inert.
config:
  zitadel:domain: auth.ipv1337.dev
  zitadel-apps:redirectUris:
    - https://oauth-inspector.ipv1337.dev/
  zitadel-apps:postLogoutRedirectUris:
    - https://oauth-inspector.ipv1337.dev/
  # Fill these in, then flip ZITADEL_APPS_AUTO_APPLY=true:
  # zitadel-apps:projectId: "<zitadel-project-id>"
  # zitadel-apps:orgId: "<zitadel-org-id>"                  # optional; defaults to the service user's org
  # Adopt the EXISTING application so its Client ID/Secret in GCP Secret Manager
  # stay valid (format: "<org_id>:<project_id>:<app_id>"):
  # zitadel-apps:importId: "<org_id>:<project_id>:<app_id>"
