# Shared build stack for tabula. Single stack (production) — it owns
# cross-env singletons (Artifact Registry + build SA) in the foundation's shared
# infra-pipeline project (prj-c-bu2-infra-pipeline-*), resolved via StackReference
# to ipv1337/foundation-projects-bu2-shared/production (infra_pipeline_project_id). The per-env
# Cloud Run service-agent AR-reader grants read each env's oss_floating_project_number
# from ipv1337/foundation-projects-bu2-{development,nonproduction,production}/production.
# The build SA federates the shared foundation-pool (gcp-bootstrap); no per-app
# WIF pool — same pattern as the deploy-identity stacks.
config:
  tabula-build:region: "us-central1"
  tabula-build:bootstrap_stack: "ipv1337/foundation-bootstrap/production"
  # IAM member allowed to READ the Neon/Upstash management credentials, so the
  # //tools/saas-cli wrappers work for a human and not only for CI. A group is
  # preferable to a person (outlives an individual, revoked in one place); this
  # is the sole maintainer today.
  tabula-build:operatorPrincipal: user:james@vitruviansoftware.dev
