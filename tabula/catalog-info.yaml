# Machine-readable app metadata (#500): the single per-app source for
# ownership, deploy identity, and release model. Backstage-compatible
# Component; consumed today by tools/conformance (owner must match
# .github/CODEOWNERS) and by humans/agents doing impact analysis.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tabula
  description: SaaS tab/workspace platform — API (Cloud Run blue-green) + Chrome extension + web companion + CLI
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
    # Cloud Run services this component actually runs as. Explicit rather
    # than derived: the projects are random-suffixed and some components
    # have more than one service per environment, so nothing here is
    # guessable from the entity name.
    vitruvian.dev/cloud-run-services: |
      development/api=prj-d-bu2-oss-floating-c3d1/us-central1/tabula-api-development
      development/web=prj-d-bu2-oss-floating-c3d1/us-central1/tabula-web-development
      nonproduction/api=prj-n-bu2-oss-floating-a943/us-central1/tabula-api-nonproduction
      nonproduction/web=prj-n-bu2-oss-floating-a943/us-central1/tabula-web-nonproduction
      production/api=prj-p-bu2-oss-floating-8663/us-central1/tabula-api-production
      production/web=prj-p-bu2-oss-floating-8663/us-central1/tabula-web-production
    vitruvian.dev/deploy-workflow: tabula-deploy.yaml
    vitruvian.dev/deploy-targets: //tabula/api:image_push //tabula/extension:chrome_zip
    vitruvian.dev/environments: development nonproduction production
    vitruvian.dev/release-model: continuous-deploy
spec:
  type: service
  lifecycle: production
  owner: tabula-team
  system: vitruvian-core
