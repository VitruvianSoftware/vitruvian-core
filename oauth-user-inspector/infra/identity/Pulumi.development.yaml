# Per-env deploy/runtime identity for oauth-user-inspector on the development oss project.
# Federates the shared foundation-pool (gcp-bootstrap); no per-app WIF pool.
config:
  oauth-user-inspector-deploy-identity:project: "prj-d-bu1-oss-floating-648a"
  oauth-user-inspector-deploy-identity:region: "us-west1"
  oauth-user-inspector-deploy-identity:bootstrap_stack: "ipv1337/foundation-bootstrap/production"
  oauth-user-inspector-deploy-identity:projects_stack: "ipv1337/foundation-projects-bu1-development/production"
  # Custom-domain verification anchor (dev is the ONE anchor env): grants every
  # env's deploy SA secretAccessor on the human-seeded CLOUDFLARE_API_TOKEN
  # secret stored here (single source; nonprod/prod read cross-project). The
  # Site Verification API needs only the SA token + siteverification scope — no
  # API-enable / quota project — so nothing else is anchored. See identity
  # main.go.
  oauth-user-inspector-deploy-identity:domainVerificationAnchor: "true"
  oauth-user-inspector-deploy-identity:cloudflareTokenAccessorProjects: "prj-d-bu1-oss-floating-648a,prj-n-bu1-oss-floating-630b,prj-p-bu1-oss-floating-16e0"
