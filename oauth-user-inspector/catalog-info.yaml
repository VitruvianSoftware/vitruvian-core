# Machine-readable app metadata (#500): the single per-app source for
# ownership, deploy identity, and release model. Backstage-compatible
# Component; consumed today by tools/conformance (owner must match
# .github/CODEOWNERS) and by humans/agents doing impact analysis.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: oauth-user-inspector
  description: OAuth/OIDC token inspector web app — Vite/React frontend + Express backend on Cloud Run, Zitadel SSO
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
    storybook.io/url: https://storybook.ipv1337.dev
    opentelemetry.io/service-name: oauth-user-inspector
    prometheus.io/rule: oauth-user-inspector
    prometheus.io/alert: all
    # Single word => matched as a Grafana TAG (case-sensitive). Resolves to
    # the templated 'Cloud Run Services' dashboard, which is tagged with both
    # app names; pick this component's project from its variable.
    grafana/dashboard-selector: oauth-user-inspector
    # Cloud Run services this component actually runs as. Explicit rather
    # than derived: the projects are random-suffixed and some components
    # have more than one service per environment, so nothing here is
    # guessable from the entity name.
    vitruvian.dev/cloud-run-services: |
      development=prj-d-bu1-oss-floating-648a/us-central1/oauth-user-inspector-development
      nonproduction=prj-n-bu1-oss-floating-630b/us-central1/oauth-user-inspector-nonproduction
      production=prj-p-bu1-oss-floating-16e0/us-central1/oauth-user-inspector-production
    vitruvian.dev/deploy-workflow: delivery.yaml
    vitruvian.dev/environments: development
    vitruvian.dev/release-model: continuous-deploy
    vitruvian.dev/mirror: VitruvianSoftware/oauth-user-inspector
  links:
    - url: https://github.com/VitruvianSoftware/oauth-user-inspector
      title: GitHub Mirror
      icon: github
    - url: https://status.ipv1337.dev
      title: Uptime Status
      icon: web
    - url: https://grafana.lab.ipv1337.dev/d/cloud-run-services?var-service=oauth-user-inspector
      title: Grafana Cloud Run Metrics
      icon: dashboard
    - url: https://github.com/VitruvianSoftware/vitruvian-core/pkgs/container/oauth-user-inspector
      title: Container Image (GHCR)
      icon: docker
    - url: https://github.com/VitruvianSoftware/vitruvian-core/blob/main/docs/operations/incident-triage-runbook.md
      title: Incident Triage Runbook
      icon: docs
spec:
  type: service
  lifecycle: production
  owner: oauth-user-inspector-team
  system: oauth-user-inspector
  providesApis:
    - oauth-inspector-api
  dependsOn:
    - component:default/monorepo-tooling
    - resource:default/zitadel
    - resource:default/pulumi-zitadel-apps
