apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mcp-server
  title: Model Context Protocol (MCP) Server
  description: >-
    Scaffolds a Model Context Protocol server (TypeScript/Python) pre-configured with
    Streamable HTTP and stdio transports, tool registries, schema validation, and npm/OCI packaging.
  tags:
    - mcp
    - ai
    - agent-tools
    - typescript
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: MCP Server Configuration
      required:
        - name
        - description
      properties:
        name:
          title: Server Name
          type: string
          description: snake_case identifier with mcp_ prefix (e.g., mcp_github, mcp_linear).
          pattern: "^mcp_[a-z0-9]+(_[a-z0-9]+)*$"
          maxLength: 30
          ui:autofocus: true
          ui:placeholder: mcp_jira
        description:
          title: Description
          type: string
          description: Capabilities and tools exposed by this MCP server to AI agents.
          ui:placeholder: Exposes Jira issue querying, sprint tracking, and status transitions to LLMs

  steps:
    - id: fetch
      name: Fetch MCP Starter
      action: fetch:plain
      input:
        url: https://github.com/VitruvianSoftware/vitruvian-core

    - id: render
      name: Render MCP Server
      action: vitruvian:app:render
      input:
        name: ${{ parameters.name }}
        language: typescript
        targetPath: apps/${{ parameters.name }}

    - id: pr
      name: Open Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=VitruvianSoftware&repo=vitruvian-core
        sourcePath: ${{ steps.render.output.stagePath }}
        branchName: scaffolder/${{ parameters.name }}
        title: "feat(${{ parameters.name }}): scaffold MCP server"
        description: |
          ### Scaffolded Model Context Protocol Server: `${{ parameters.name }}`
          - **Description**: ${{ parameters.description }}
        draft: true

  output:
    links:
      - title: Review Draft Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
