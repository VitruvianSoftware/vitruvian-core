apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: k8s-canary-microservice
  title: Kubernetes Canary Microservice
  description: >-
    Scaffolds an in-cluster microservice pre-configured with Argo Rollouts Canary deployment,
    Prometheus AnalysisTemplates, Envoy Gateway HTTPRoutes, and GitOps ArgoCD bindings.
  tags:
    - kubernetes
    - canary
    - argo-rollouts
    - gitops
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Microservice Metadata
      required:
        - name
        - description
      properties:
        name:
          title: Service Name
          type: string
          description: snake_case name of the microservice.
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
          maxLength: 30
          ui:autofocus: true
          ui:placeholder: order_routing_engine
        description:
          title: Description
          type: string
          description: Purpose of this microservice workload.
          ui:placeholder: Routes internal order traffic with real-time canary health verification

  steps:
    - id: fetch
      name: Fetch Kubernetes Starter
      action: fetch:plain
      input:
        url: https://github.com/VitruvianSoftware/vitruvian-core

    - id: render
      name: Render Canary Microservice
      action: vitruvian:app:render
      input:
        name: ${{ parameters.name }}
        language: go
        targetPath: apps/${{ parameters.name }}

    - id: pr
      name: Open Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=VitruvianSoftware&repo=vitruvian-core
        sourcePath: ${{ steps.render.output.stagePath }}
        branchName: scaffolder/k8s-${{ parameters.name }}
        title: "feat(${{ parameters.name }}): scaffold Kubernetes Canary microservice"
        description: |
          ### Scaffolded Kubernetes Canary Microservice: `${{ parameters.name }}`
          - **Progressive Delivery**: Argo Rollouts Canary (Canary + Stable services, AnalysisTemplate)
          - **Description**: ${{ parameters.description }}
        draft: true

  output:
    links:
      - title: Review Draft Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
