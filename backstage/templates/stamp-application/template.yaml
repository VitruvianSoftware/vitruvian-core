# The Create-page front door for the application initializer (P1).
#
# THIS TEMPLATE OWNS NO APPLICATION TEMPLATES. It fetches vitruvian-core and
# runs THAT repository's own embedded initializer engine via the
# `vitruvian:app:render` action (ADR-026) -- aspect-workflows-template is never
# fetched, and upgrading a starter is a PR in the target repo rather than a
# Backstage redeploy. Adding a language here is an enum entry plus a template
# directory in the target repo; nothing about this file's shape changes.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: stamp-application
  title: Stamp a new application
  description: >-
    Render a new application into vitruvian-core using the repository's own
    initializer engine, and open a draft pull request with the result.
  tags:
    - initializer
    - monorepo
    - bazel
    - go
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: The application
      required:
        - name
        - description
        - owner
        - language
      properties:
        name:
          title: Name
          type: string
          description: >-
            snake_case. Becomes the directory name and every Bazel target name,
            so it is not free-form -- gazelle names Go targets after the
            directory.
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 30
          ui:autofocus: true
          ui:placeholder: order_service
        description:
          title: Description
          type: string
          description: What this application is for. Lands in its catalog-info.yaml.
          ui:placeholder: Prices and books orders
        owner:
          title: Owner
          type: string
          description: The team that will own this application.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        language:
          title: Language
          type: string
          description: >-
            Which starter to render. Sourced from the target repository's
            tools/initializer/config.json.
          # An enum with one member today, on purpose: P2 adds languages by
          # extending this list, with no change to the form's shape or to the
          # action's contract.
          enum:
            - go
          enumNames:
            - Go
          default: go

    - title: Advanced
      properties:
        targetPath:
          title: Target path
          type: string
          description: >-
            Where to stamp the application, relative to the repository root. Its
            last path segment MUST equal the name above. Leave blank for the
            ADR-014 default, apps/<name>. Note that vitruvian-core's EXISTING
            applications live at the repository root (./tabula, ./devx, ...);
            apps/ is the default for newly stamped ones, and the first stamp
            introduces that directory.
          # Deliberately no `default:`. Template parameters are a plain JSON
          # Schema -- `${{ }}` is substituted in `steps`, NOT here -- so a
          # default of `apps/${{ parameters.name }}` would render into the field
          # LITERALLY, and the action would then reject it for having a basename
          # that is not the application name. The default therefore lives in one
          # place, the action (an empty targetPath means apps/<name>), and this
          # placeholder shows it.
          ui:placeholder: apps/<name>

  steps:
    # Plain fetch, not fetch:template: nothing in this repository is a template
    # from Backstage's point of view. The engine does the rendering.
    - id: fetch
      name: Fetch vitruvian-core
      action: fetch:plain
      input:
        url: https://github.com/VitruvianSoftware/vitruvian-core

    - id: render
      name: Render the application
      action: vitruvian:app:render
      input:
        name: ${{ parameters.name }}
        language: ${{ parameters.language }}
        targetPath: ${{ parameters.targetPath }}

    # DRAFT, on purpose: P1 ships no auto-merge (that is P3), and a stamped
    # application must be read by a human before it lands.
    - id: pr
      name: Open a draft pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=VitruvianSoftware&repo=vitruvian-core
        branchName: stamp/${{ parameters.name }}
        title: "feat(${{ parameters.name }}): stamp application via initializer"
        draft: true
        description: |
          Stamped from the Backstage Create page by the `stamp-application`
          template, which ran **this repository's own** initializer engine
          (`aspect render-app`, `tools/initializer/`) — ADR-026. Backstage owns
          no templates for this; upgrading the starter is a PR here.

          - **Application:** `${{ parameters.name }}` (${{ parameters.language }})
          - **Path:** `${{ parameters.targetPath }}` (blank means the ADR-014
            default, `apps/${{ parameters.name }}`)
          - **Owner:** `${{ parameters.owner }}`
          - **Description:** ${{ parameters.description }}

          ### Two things this PR changes that you did not ask for

          1. **`catalog-info.yaml` at the repository root was edited.** One line
             was added to the `vitruvian-core-apps` Location so the new
             component is actually discovered by the catalog — ADR-019
             disclose-and-include. Without it the app exists but never appears
             in Backstage. The edit is idempotent and nothing else in that file
             is touched.

          2. **CI will flag missing license headers on the rendered files.**
             The starter templates do not yet carry the MIT header this repo
             enforces repo-wide. That is a known P1 gap in the initializer, not
             a problem with this PR: run `bazel run //tools/license:add` on the
             new directory before merging. It is resolved per-app for now, and
             fixed properly in the starter templates upstream.

  output:
    links:
      - title: Draft pull request
        url: ${{ steps.pr.output.remoteUrl }}
      - title: The stamped application
        url: ${{ steps.pr.output.remoteUrl }}/files
    text:
      - title: Rendered into
        content: |
          `${{ steps.render.output.appPath }}` — component metadata at
          `${{ steps.render.output.catalogInfoPath }}`.
