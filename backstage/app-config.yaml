app:
  title: Vitruvian Developer Portal
  baseUrl: https://backstage.vitruviansoftware.dev

organization:
  name: Vitruvian Software

backend:
  baseUrl: https://backstage.vitruviansoftware.dev
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: https://backstage.vitruviansoftware.dev
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: backstage-db-cluster-rw.backstage.svc.cluster.local
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}
    pluginDivisionMode: schema

integrations:
  github:
    - host: github.com

auth:
  environment: production
  providers:
    # No guest provider: the portal is internet-facing, so anonymous sign-in
    # would expose the whole catalog. GitHub SSO is the only way in, and the
    # usernameMatchingUserEntityName resolver below means a GitHub account only
    # works if a matching User entity exists in the catalog.
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

# Without `enabled: true` Backstage allows every request without consulting a
# policy at all, so this flag is what makes the Vitruvian policy load-bearing.
# Admins get unrestricted access; every other signed-in user is read-only.
permission:
  enabled: true
  adminEntityRefs:
    - group:default/platform-team

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: url
      target: https://github.com/VitruvianSoftware/vitruvian-core/blob/main/catalog-info.yaml
