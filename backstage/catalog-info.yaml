apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: Vitruvian Developer Portal — software catalog, service documentation, and platform engineering workbench
  annotations:
    github.com/project-slug: VitruvianSoftware/vitruvian-core
    backstage.io/techdocs-ref: dir:.
    # Binds this component to its live workloads for the Kubernetes tab. A label
    # selector rather than backstage.io/kubernetes-id because the Helm chart sets
    # app.kubernetes.io/name and does not carry a backstage.io/kubernetes-id
    # label -- verified against the running pod rather than assumed.
    backstage.io/kubernetes-id: backstage
    backstage.io/kubernetes-namespace: backstage
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=backstage
    # Deployment state (sync/health, revision history) for the Deployments tab.
    # app-name, not app-selector: the `backstage` Application carries app=backstage
    # but backstage-db is labelled app=backstage-db, so a selector would either
    # miss the database or lump an independently-synced Postgres cluster into
    # this component's deploy history.
    argocd/app-name: backstage
  links:
    - url: https://backstage.vitruviansoftware.dev
      title: Web Console
      icon: dashboard
    - url: https://backstage.vitruviansoftware.dev/api/mcp-actions/v1
      title: MCP Endpoint
      icon: api
    - url: https://status.ipv1337.dev
      title: Uptime Status
      icon: web
    - url: https://argocd.lab.ipv1337.dev/applications/backstage
      title: ArgoCD Application
      icon: cloud
    - url: https://github.com/VitruvianSoftware/vitruvian-core/pkgs/container/backstage
      title: Container Image (GHCR)
      icon: docker
    - url: https://github.com/VitruvianSoftware/vitruvian-core/blob/main/docs/operations/incident-triage-runbook.md
      title: Incident Triage Runbook
      icon: docs
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: developer-portal
  providesApis:
    - backstage-mcp-api
  dependsOn:
    - resource:default/cloudnative-pg
